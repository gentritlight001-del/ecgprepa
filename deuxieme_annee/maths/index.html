<!DOCTYPE html>
<html lang="fr">
<head>
<script src="../../auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECG Prépa — Mathématiques 2ème Année</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: #2a2a35;
    --accent: #9ecba0;
    --accent2: #7c9ec9;
    --accent3: #c8a96e;
    --accent4: #c97c9e;
    --text: #e8e6e0;
    --text-dim: #8a8880;
    --text-faint: #4a4845;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }

  .page { display: none; min-height: 100vh; flex-direction: column; }
  .page.active { display: flex; }

  .bg-orb { position: fixed; border-radius: 50%; filter: blur(140px); pointer-events: none; opacity: 0.09; z-index: 0; }
  .orb1 { width: 700px; height: 700px; background: var(--accent); top: -300px; right: -250px; }
  .orb2 { width: 600px; height: 600px; background: var(--accent2); bottom: -250px; left: -250px; }
  .orb3 { width: 400px; height: 400px; background: var(--accent4); top: 40%; left: 30%; opacity: 0.05; }

  nav {
    display: flex; align-items: center;
    padding: 18px 48px; border-bottom: 1px solid var(--border);
    background: rgba(13,13,15,0.9); backdrop-filter: blur(16px);
    position: sticky; top: 0; z-index: 100;
  }
  .nav-logo { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; color: var(--accent); cursor: pointer; letter-spacing: 0.02em; }
  .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-dim); flex-wrap: wrap; }
  .nav-left { flex: 1 1 0; display: flex; align-items: center; }
  .nav-right { flex: 1 1 0; display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .breadcrumb span { cursor: pointer; transition: color 0.2s; }
  .breadcrumb span:hover { color: var(--accent); }
  .breadcrumb .sep { color: var(--text-faint); }
  .breadcrumb .current { color: var(--text); cursor: default; }

  .page-header { padding: 60px 64px 40px; border-bottom: 1px solid var(--border); position: relative; z-index: 1; }
  .page-header::after { content: ''; position: absolute; bottom: -1px; left: 64px; width: 60px; height: 2px; background: var(--accent); }
  .page-eyebrow { font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; font-weight: 500; font-family: 'DM Mono', monospace; }
  .page-title { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 4vw, 3.2rem); font-weight: 900; color: var(--text); }

  .page-body { display: flex; align-items: stretch; gap: 40px; padding: 48px 64px; position: relative; z-index: 1; }

  .chapters-container { flex: 1; max-width: 900px; border-right: 1px solid var(--border); padding-right: 32px; }
  .chapter-item { display: flex; align-items: center; gap: 20px; padding: 20px 24px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; background: var(--surface); text-decoration: none; color: inherit; }
  .chapter-item:hover { border-color: var(--accent); background: var(--surface2); transform: translateX(4px); }
  .chapter-num { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 900; color: var(--text-faint); min-width: 48px; line-height: 1; }
  .chapter-info { flex: 1; }
  .chapter-info .chapter-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--text-dim); margin-bottom: 4px; font-family: 'DM Mono', monospace; }
  .chapter-info .chapter-name { font-size: 1rem; font-weight: 500; color: var(--text); }
  .chapter-arrow { color: var(--text-faint); font-size: 1.1rem; transition: all 0.2s; }
  .chapter-item:hover .chapter-arrow { color: var(--accent); transform: translateX(4px); }

  .sidebar { width: 300px; flex-shrink: 0; align-self: flex-start; position: sticky; top: 90px; display: flex; flex-direction: column; gap: 20px; }

  .motif-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 20px 16px; }
  .motif-card svg { width: 100%; height: auto; display: block; }
  .motif-caption { text-align: center; margin-top: 10px; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim); font-family: 'DM Mono', monospace; }

  @media (max-width: 1000px) {
    .sidebar { display: none; }
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  .fade-up { animation: fadeUp 0.5s ease forwards; opacity: 0; }
  .fade-up:nth-child(1)  { animation-delay: 0.00s; }
  .fade-up:nth-child(2)  { animation-delay: 0.05s; }
  .fade-up:nth-child(3)  { animation-delay: 0.10s; }
  .fade-up:nth-child(4)  { animation-delay: 0.15s; }
  .fade-up:nth-child(5)  { animation-delay: 0.20s; }
  .fade-up:nth-child(6)  { animation-delay: 0.25s; }
  .fade-up:nth-child(7)  { animation-delay: 0.30s; }
  .fade-up:nth-child(8)  { animation-delay: 0.35s; }
  .fade-up:nth-child(9)  { animation-delay: 0.40s; }
  .fade-up:nth-child(10) { animation-delay: 0.45s; }
  .fade-up:nth-child(11) { animation-delay: 0.50s; }
  .fade-up:nth-child(12) { animation-delay: 0.55s; }
  .fade-up:nth-child(13) { animation-delay: 0.60s; }
  .fade-up:nth-child(14) { animation-delay: 0.65s; }
  .fade-up:nth-child(15) { animation-delay: 0.70s; }
  .fade-up:nth-child(16) { animation-delay: 0.75s; }
  .fade-up:nth-child(17) { animation-delay: 0.80s; }
  .fade-up:nth-child(18) { animation-delay: 0.85s; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

  @media (max-width: 768px) {
    nav { padding: 14px 20px; }
    .page-header { padding: 40px 24px 30px; }
    .page-header::after { left: 24px; }
    .page-body { padding: 32px 24px; flex-direction: column; }
  }
</style>
</head>
<body>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>
<div class="bg-orb orb3"></div>

<div id="page-maths" class="page active">
  <nav>
    <div class="nav-left"><div class="nav-logo" onclick="window.location.href='../../index.html'">ECG Prépa</div></div>
    <div class="breadcrumb">
      <span onclick="window.location.href='../../index.html'">Accueil</span>
      <span class="sep">/</span>
      <span onclick="window.location.href='../../cours-ecg.html'">Cours</span>
      <span class="sep">/</span>
      <span onclick="window.location.href='../index.html'">2ème Année</span>
      <span class="sep">/</span>
      <span class="current">Mathématiques</span>
    </div>
  <div class="nav-right"></div>
</nav>
  <div class="page-header">
    <div class="page-eyebrow">📐 Mathématiques — 2ème Année</div>
    <div class="page-title">Chapitres Mathématiques</div>
  </div>
  <div class="page-body">
  <div class="chapters-container">
    <a class="chapter-item fade-up" href="chapitre1.html"><div class="chapter-num">1</div><div class="chapter-info"><div class="chapter-label">Chapitre 1</div><div class="chapter-name">Les développements limités</div></div><div class="chapter-arrow">→</div></a>
    <a class="chapter-item fade-up" href="chapitre2.html"><div class="chapter-num">2</div><div class="chapter-info"><div class="chapter-label">Chapitre 2</div><div class="chapter-name">Les suites</div></div><div class="chapter-arrow">→</div></a>
  </div>

  <aside class="sidebar">
    <div class="motif-card">
      <svg viewBox="0 0 260 380" xmlns="http://www.w3.org/2000/svg">
        <!-- circle drawn by the compass -->
        <circle cx="130" cy="190" r="85" fill="none" stroke="var(--accent)" stroke-width="1.4" opacity="0.9"/>
        <circle cx="130" cy="190" r="1.6" fill="var(--accent)" opacity="0.9"/>

        <!-- compass legs -->
        <g stroke="var(--accent3)" stroke-width="2" stroke-linecap="round" opacity="0.95">
          <path d="M130 60 L 130 190" />
          <path d="M130 60 L 208 235" />
        </g>

        <!-- compass hinge -->
        <circle cx="130" cy="60" r="6" fill="none" stroke="var(--accent3)" stroke-width="2" opacity="0.95"/>

        <!-- compass needle point -->
        <circle cx="130" cy="190" r="3" fill="var(--accent4)" opacity="0.95"/>

        <!-- compass pencil tip -->
        <path d="M208 235 L 216 250 L 200 246 Z" fill="var(--accent4)" opacity="0.9"/>

        <!-- small handle detail at hinge -->
        <path d="M122 48 L 138 48" stroke="var(--accent3)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

        <!-- ornamental corner ticks -->
        <g stroke="var(--text-faint)" stroke-width="1">
          <path d="M20 20 L20 40 M20 20 L40 20" />
          <path d="M240 20 L240 40 M240 20 L220 20" />
          <path d="M20 360 L20 340 M20 360 L40 360" />
          <path d="M240 360 L240 340 M240 360 L220 360" />
        </g>
      </svg>
      <div class="motif-caption">Mathématiques</div>
    </div>
  </aside>
  </div>
</div>
</body>
</html>
