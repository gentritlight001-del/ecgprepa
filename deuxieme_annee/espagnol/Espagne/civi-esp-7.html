<!DOCTYPE html>
<html lang="fr" data-theme="espagnol3">
<head>
<script src="../../auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Nationalisme catalan — Civilisation Hispanophone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- ══════════════════════════════════════════════════════════════════════
     TEMPLATE UNIVERSEL DE COURS DE CIVILISATION — v1
     Pour créer un nouveau cours : dupliquer ce fichier, ne modifier QUE
     le bloc de données (id="donnees") tout en bas. Rien d'autre à toucher.
     ══════════════════════════════════════════════════════════════════════ -->

<style>
  /* ─── PALETTE DE BASE (identique au site) ─── */
  :root{
    --bg:#0d0d0f; --surface:#16161a; --surface2:#1e1e24; --border:#2a2a35;
    --text:#e8e6e0; --text-dim:#8a8880; --text-faint:#4a4845;
    --radius:14px;
  }
  /* ─── THÈMES PAR LANGUE — change data-theme sur <html> ─── */
  html[data-theme="anglais"] { --a1:#c8a96e; --a2:#7c9ec9; --a3:#9ecba0; --a4:#c97c9e; --hero:#16233d; }
  html[data-theme="anglais2"] { --a1:#c9633f; --a2:#5b8f6f; --a3:#6c8fc7; --a4:#a06bb0; --hero:#16241b; }
  html[data-theme="espagnol"]{ --a1:#e0a93e; --a2:#c8553d; --a3:#7fae7a; --a4:#b06fa8; --hero:#3a1a18; }
  html[data-theme="espagnol3"]{ --a1:#c9a24a; --a2:#4d7ea8; --a3:#5aa88f; --a4:#a85a6b; --hero:#101c2c; }
  html[data-theme="espagnol4"]{ --a1:#a98ac9; --a2:#6fa89b; --a3:#cf8f5e; --a4:#c26a8e; --hero:#221a2c; }
  html[data-theme="espagnol5"]{ --a1:#4fae94; --a2:#c98a4b; --a3:#8f9ec9; --a4:#c0566f; --hero:#10251f; }
  html[data-theme="espagnol6"]{ --a1:#5b9bd5; --a2:#d9a441; --a3:#7bb37a; --a4:#b0566e; --hero:#132436; }
  html[data-theme="espagnol7"]{ --a1:#e0954f; --a2:#5f9ea6; --a3:#a878c9; --a4:#b5495b; --hero:#2b1c14; }
  html[data-theme="espagnol8"]{ --a1:#d4534f; --a2:#4f9d8f; --a3:#e0b04a; --a4:#8f5fa8; --hero:#2a1416; }
  html[data-theme="allemand"]{ --a1:#d8b44a; --a2:#8fa4bd; --a3:#84b58e; --a4:#c06060; --hero:#241f1a; }
  html[data-theme="italien"] { --a1:#d5a94e; --a2:#6fae8f; --a3:#a8c07a; --a4:#c4695e; --hero:#152a24; }
  html[data-theme="chinois"] { --a1:#d9a441; --a2:#c05a4a; --a3:#83a98f; --a4:#a97fb0; --hero:#2c1618; }

  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;overflow-x:hidden}

  /* ─── FOND ─── */
  .bg-orb{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;opacity:.08;z-index:0}
  .orb1{width:700px;height:700px;background:var(--a1);top:-300px;right:-250px}
  .orb2{width:600px;height:600px;background:var(--a2);bottom:-250px;left:-250px}

  /* ─── BARRE DE PROGRESSION ─── */
  #progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:200;
    background:linear-gradient(90deg,var(--a1),var(--a2),var(--a4));transition:width .1s linear}

  /* ─── NAV ─── */
  nav{display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding:16px 40px;border-bottom:1px solid var(--border);
    background:rgba(13,13,15,.9);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100}
  .nav-logo{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;color:var(--a1);cursor:pointer}
  .breadcrumb{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--text-dim);flex-wrap:wrap}
  .breadcrumb span{cursor:pointer;transition:color .2s}
  .breadcrumb span:hover{color:var(--a1)}
  .breadcrumb .sep{color:var(--text-faint);cursor:default}
  .breadcrumb .current{color:var(--text);cursor:default}
  .nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .ap-lang-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    color:rgba(255,255,255,.6);font-family:'DM Mono',monospace;font-size:10px;font-weight:700;
    letter-spacing:.12em;padding:5px 14px;border-radius:4px;cursor:pointer;transition:all .2s;text-transform:uppercase}
  .ap-lang-btn.active{background:var(--a1);border-color:var(--a1);color:#12100c}
  .ap-lang-btn:hover:not(.active){background:rgba(255,255,255,.15);color:#fff}

  /* ─── HERO ─── */
  .hero{position:relative;z-index:1;padding:76px 40px 56px;text-align:center;overflow:hidden;
    background:linear-gradient(160deg,var(--hero),#0d0d0f 85%);border-bottom:1px solid var(--border)}
  .hero::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
    width:80px;height:2px;background:var(--a1)}
  .hero-flag{font-size:2.6rem;line-height:1;margin-bottom:18px;display:block}
  .hero-label{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.3em;
    text-transform:uppercase;color:var(--a1);margin-bottom:18px}
  .hero h1{font-family:'Playfair Display',serif;font-weight:900;line-height:1.05;
    font-size:clamp(2.4rem,6vw,4.6rem);max-width:900px;margin:0 auto 18px}
  .hero-sub{font-size:1rem;color:var(--text-dim);max-width:640px;margin:0 auto;line-height:1.6}

  /* ─── LAYOUT ─── */
  .layout{display:flex;gap:48px;max-width:1320px;margin:0 auto;padding:48px 40px 100px;position:relative;z-index:1}
  main{flex:1;min-width:0;max-width:840px}

  /* ─── COLONNE CHRONOLOGIE ─── */
  .rail{width:262px;flex-shrink:0;position:sticky;top:88px;align-self:flex-start;
    max-height:calc(100vh - 118px);overflow-y:auto;padding-right:8px}
  .rail-title{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;
    color:var(--a1);margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border)}
  .rail .tl{padding-left:20px;margin:0 0 0 4px}
  .rail .tl-item{padding-bottom:16px}
  .rail .tl-item::before{left:-26px;top:4px;width:7px;height:7px}
  .rail .tl-d{font-size:.66rem;letter-spacing:.08em}
  .rail .tl-c{font-size:.79rem;line-height:1.5}
  .rail::-webkit-scrollbar{width:3px}
  .rail::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .chrono-mobile{display:none}

  /* ─── BLOC GÉNÉRIQUE ─── */
  .bloc{margin-bottom:64px;scroll-margin-top:88px}
  .bloc-head{display:flex;align-items:baseline;gap:14px;margin-bottom:24px;
    padding-bottom:12px;border-bottom:1px solid var(--border)}
  .bloc-kicker{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--k,var(--a1))}
  .bloc-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--text)}

  /* ─── L'ESSENTIEL ─── */
  .essentiel{background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    border:1px solid var(--border);border-left:3px solid var(--a1);border-radius:var(--radius);
    padding:28px 30px;margin-bottom:36px}
  .essentiel-label{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--a1);margin-bottom:14px}
  .essentiel p{font-size:.98rem;line-height:1.75;color:var(--text);margin-bottom:0}
  .essentiel p strong{color:var(--a1);font-weight:500}

  /* ─── STATS ─── */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0}
  .stat{border-radius:10px;padding:18px 16px;text-align:center;border:1px solid rgba(255,255,255,.08);
    background:linear-gradient(135deg,color-mix(in srgb,var(--c,var(--a1)) 26%,#101014),
    color-mix(in srgb,var(--c,var(--a1)) 8%,#101014))}
  .stat-n{font-family:'DM Mono',monospace;font-size:1.5rem;font-weight:500;color:var(--text);display:block;line-height:1.1}
  .stat-d{font-size:.7rem;color:var(--text-dim);margin-top:7px;display:block;line-height:1.45}

  /* ─── PARTIES ─── */
  .partie{margin-bottom:78px;scroll-margin-top:88px}
  .partie-head{display:flex;align-items:center;gap:22px;margin-bottom:34px;
    padding-bottom:18px;border-bottom:2px solid var(--p)}
  .partie-num{font-family:'Playfair Display',serif;font-size:3.4rem;font-weight:900;
    color:var(--p);opacity:.35;line-height:.9;flex-shrink:0}
  .partie-title{font-family:'Playfair Display',serif;font-size:clamp(1.35rem,3vw,1.95rem);
    font-weight:700;line-height:1.2}
  .partie-kicker{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.24em;
    text-transform:uppercase;color:var(--p);margin-bottom:6px}

  .section{margin-bottom:44px;scroll-margin-top:88px}
  .section-title{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;
    color:var(--text);margin-bottom:18px;padding-left:16px;border-left:3px solid var(--p)}
  .section-num{color:var(--p);font-weight:900}

  /* ─── TEXTE ─── */
  .prose{font-size:.96rem;line-height:1.8;color:rgba(232,230,224,.78);margin-bottom:16px}
  .prose strong{color:var(--text);font-weight:500}
  .prose em{color:var(--p,var(--a1));font-style:normal;font-weight:500}
  .es{font-family:'DM Mono',monospace;font-size:.86em;color:var(--a2)}

  /* ─── LISTE ─── */
  .liste{list-style:none;margin:14px 0 20px}
  .liste li{font-size:.93rem;line-height:1.65;color:rgba(232,230,224,.75);
    padding:9px 0 9px 22px;position:relative;border-bottom:1px solid rgba(255,255,255,.05)}
  .liste li:last-child{border-bottom:none}
  .liste li::before{content:'';position:absolute;left:0;top:17px;width:6px;height:6px;
    border-radius:50%;background:var(--p,var(--a1))}
  .liste li strong{color:var(--text);font-weight:500}

  /* ─── FAITS CLÉS ─── */
  .faits{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;margin:20px 0}
  .fait{background:rgba(255,255,255,.03);border:1px solid var(--border);
    border-left:3px solid var(--p,var(--a1));border-radius:8px;padding:13px 15px}
  .fait-l{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--text-faint);
    text-transform:uppercase;letter-spacing:.14em;margin-bottom:5px}
  .fait-v{font-size:.86rem;font-weight:500;color:var(--text);line-height:1.4}

  /* ─── CITATION ─── */
  .citation{background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
    border:1px solid var(--border);border-left:3px solid var(--a1);border-radius:0 10px 10px 0;
    padding:20px 24px;margin:22px 0}
  .citation p{font-family:'Playfair Display',serif;font-style:italic;font-size:1.02rem;
    line-height:1.6;color:var(--text);margin-bottom:9px}
  .citation cite{font-family:'DM Mono',monospace;font-size:.66rem;letter-spacing:.08em;
    color:var(--a1);font-style:normal}

  /* ─── ENCADRÉ ─── */
  .encadre{display:flex;gap:15px;align-items:flex-start;border-radius:10px;padding:17px 20px;margin:20px 0;
    background:color-mix(in srgb,var(--c,var(--a2)) 7%,transparent);
    border:1px solid color-mix(in srgb,var(--c,var(--a2)) 26%,transparent)}
  .encadre-ic{font-size:1.5rem;flex-shrink:0;line-height:1.2}
  .encadre-t{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.2em;
    text-transform:uppercase;color:var(--c,var(--a2));margin-bottom:7px;font-weight:500}
  .encadre-c{font-size:.89rem;line-height:1.7;color:rgba(232,230,224,.75)}
  .encadre-c strong{color:var(--text);font-weight:500}

  /* ─── DÉFINITION ─── */
  .def{border:1px dashed var(--border);border-radius:10px;padding:15px 18px;margin:18px 0;
    background:rgba(255,255,255,.02)}
  .def-mot{font-family:'Playfair Display',serif;font-weight:700;font-size:1rem;color:var(--a3);margin-bottom:6px}
  .def-c{font-size:.88rem;line-height:1.7;color:rgba(232,230,224,.72)}

  /* ─── TABLEAU ─── */
  .tbl-wrap{overflow-x:auto;margin:20px 0;border:1px solid var(--border);border-radius:10px}
  table{width:100%;border-collapse:collapse;font-size:.83rem}
  thead{background:rgba(255,255,255,.04)}
  thead th{padding:11px 15px;text-align:left;font-family:'DM Mono',monospace;font-size:.6rem;
    letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap}
  tbody tr{border-top:1px solid var(--border)}
  tbody tr:nth-child(even){background:rgba(255,255,255,.015)}
  tbody td{padding:11px 15px;color:rgba(232,230,224,.75);line-height:1.5}
  tbody td:first-child{color:var(--text);font-weight:500}

  /* ─── CHRONOLOGIE ─── */
  .tl{border-left:2px solid var(--border);padding-left:26px;margin:8px 0 8px 6px}
  .tl-item{position:relative;padding-bottom:22px}
  .tl-item:last-child{padding-bottom:0}
  .tl-item::before{content:'';position:absolute;left:-33px;top:5px;width:9px;height:9px;border-radius:50%;
    background:var(--c,var(--a1));box-shadow:0 0 0 3px rgba(13,13,15,1),0 0 0 5px color-mix(in srgb,var(--c,var(--a1)) 35%,transparent)}
  .tl-d{font-family:'DM Mono',monospace;font-size:.72rem;font-weight:500;letter-spacing:.1em;
    color:var(--c,var(--a1));margin-bottom:4px}
  .tl-c{font-size:.9rem;line-height:1.6;color:rgba(232,230,224,.75)}
  .tl-c strong{color:var(--text);font-weight:500}

  /* ─── ACTEURS ─── */
  .acteurs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .acteur{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;
    transition:all .25s;position:relative;overflow:hidden}
  .acteur:hover{border-color:var(--c,var(--a1));transform:translateY(-3px);background:var(--surface2)}
  .acteur-nom{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;margin-bottom:3px}
  .acteur-role{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--c,var(--a1));margin-bottom:10px}
  .acteur-c{font-size:.82rem;line-height:1.6;color:var(--text-dim)}

  /* ─── DÉBAT ─── */
  .debat{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .debat-col{border:1px solid var(--border);border-radius:12px;padding:20px 22px;background:rgba(255,255,255,.02)}
  .debat-col.oui{border-top:3px solid var(--a3)}
  .debat-col.non{border-top:3px solid var(--a4)}
  .debat-t{font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}
  .debat-col.oui .debat-t{color:var(--a3)}
  .debat-col.non .debat-t{color:var(--a4)}
  .debat-col li{font-size:.87rem;line-height:1.6;color:rgba(232,230,224,.75);
    padding:9px 0 9px 18px;position:relative;list-style:none;border-bottom:1px solid rgba(255,255,255,.05)}
  .debat-col li:last-child{border-bottom:none}
  .debat-col li::before{content:'';position:absolute;left:0;top:16px;width:5px;height:5px;border-radius:50%}
  .debat-col.oui li::before{background:var(--a3)}
  .debat-col.non li::before{background:var(--a4)}
  .debat-col li strong{color:var(--text);font-weight:500}

  /* ─── LEXIQUE ─── */
  .lex-search{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-family:'DM Sans',sans-serif;font-size:.88rem;padding:11px 15px;margin-bottom:14px}
  .lex-search:focus{outline:none;border-color:var(--a1)}
  .lex-search::placeholder{color:var(--text-faint)}
  .lex td:first-child{font-family:'DM Mono',monospace;color:var(--a2);font-weight:500}

  /* ─── SUJETS ─── */
  .sujet{border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:10px;
    background:var(--surface);display:flex;gap:16px;align-items:flex-start;transition:all .2s}
  .sujet:hover{border-color:var(--a4);transform:translateX(4px)}
  .sujet-n{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:900;color:var(--text-faint);line-height:1;flex-shrink:0}
  .sujet-q{font-size:.94rem;line-height:1.6;color:var(--text);margin-bottom:5px;font-weight:400}
  .sujet-h{font-size:.79rem;color:var(--text-dim);line-height:1.55}

  /* ─── À RETENIR ─── */
  .retenir{background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 12%,transparent),rgba(255,255,255,.02));
    border:1px solid color-mix(in srgb,var(--a1) 30%,transparent);border-radius:var(--radius);padding:28px 30px}
  .retenir li{font-size:.93rem;line-height:1.65;color:rgba(232,230,224,.82);
    padding:10px 0 10px 26px;position:relative;list-style:none;border-bottom:1px solid rgba(255,255,255,.06)}
  .retenir li:last-child{border-bottom:none}
  .retenir li::before{content:'✓';position:absolute;left:0;top:9px;color:var(--a1);font-size:.85rem}
  .retenir li strong{color:var(--text);font-weight:500}

  /* ─── PIED DE PAGE ─── */
  footer{text-align:center;padding:36px 40px;border-top:1px solid var(--border);
    font-family:'DM Mono',monospace;font-size:.7rem;color:var(--text-dim);letter-spacing:.14em;
    text-transform:uppercase}

  /* ─── ANIMATION ─── */
  .rev{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
  .rev.vu{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){.rev{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
  :focus-visible{outline:2px solid var(--a1);outline-offset:3px}

  /* ─── RESPONSIVE ─── */
  @media(max-width:1080px){
    .rail{display:none}
    .layout{padding:32px 22px 70px}
    .chrono-mobile{display:block}
  }
  @media(max-width:680px){
    nav{padding:12px 18px;flex-wrap:wrap}
    .breadcrumb{font-size:.7rem;order:3;width:100%}
    .hero{padding:52px 20px 40px}
    .debat{grid-template-columns:1fr}
    .partie-head{gap:14px}
    .partie-num{font-size:2.4rem}
  }
  /* ─── IMPRESSION ─── */
  @media print{
    body{background:#fff;color:#111}
    nav,.rail,#progress,.bg-orb,.nav-right{display:none!important}
    .hero{background:none;border-bottom:2px solid #111;padding:0 0 22px}
    .hero h1,.prose,.liste li,.bloc-title{color:#111}
    .layout{display:block;padding:0}
    .partie,.bloc{break-inside:avoid;page-break-inside:avoid}
    .rev{opacity:1;transform:none}
    .chrono-mobile{display:block!important}
  }
</style>
</head>
<body>

<div id="progress"></div>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<nav>
  <div class="nav-logo" onclick="location.href='../../../index.html'">ECG Prépa</div>
  <div class="breadcrumb">
    <span onclick="location.href='../../../index.html'">Accueil</span>
    <span class="sep">/</span>
    <span onclick="location.href='../../index.html'">2ème Année</span>
    <span class="sep">/</span>
    <span onclick="location.href='../index.html'">Civilisation</span>
    <span class="sep">/</span>
    <span class="current" id="bc-titre">—</span>
  </div>
  <div class="nav-right">
    <button id="ap-btn-fr" class="ap-lang-btn active" onclick="setLang('fr')">🇫🇷 FR</button>
    <button id="ap-btn-es" class="ap-lang-btn" onclick="setLang('es')">🇪🇸 ES</button>
  </div>
</nav>

<header class="hero" id="hero"></header>

<div class="layout">
  <aside class="rail" id="rail"></aside>
  <main id="cours"></main>
</div>

<footer id="ft"></footer>


<!-- ══════════════════════════════════════════════════════════════════
     ⬇⬇⬇  SEULE PARTIE À MODIFIER POUR UN NOUVEAU COURS  ⬇⬇⬇
     ══════════════════════════════════════════════════════════════════ -->
<script id="donnees">
const COURS = {

  /* ─── 1. IDENTITÉ DU COURS ───────────────────────────────────────── */
  meta: {
    theme:     "espagnol8",

  /* ─── 2. L'ESSENTIEL + CHIFFRES CLÉS ─────────────────────────────── */
  essentiel: {
    fr:"Le nationalisme catalan prend racine dans la <strong>Renaixença</strong> du XIX<sup>e</sup> siècle, renaissance culturelle et linguistique qui précède de plusieurs décennies toute revendication politique d'indépendance. Doté d'institutions d'autogouvernement dès 1914 (Mancomunitat) puis 1932 (premier <em>Estatut</em>), le catalanisme est brutalement réprimé sous Franco avant de retrouver, en 1979, un statut d'autonomie qui en fait l'une des trois « nationalités historiques » de la Constitution. Le tournant survient en <strong>2010</strong> : le Tribunal constitutionnel censure des pans entiers du nouveau statut catalan de 2006, en particulier la mention de « nation », provoquant un choc politique qui transforme un <strong>autonomisme majoritaire</strong> en <strong>indépendantisme de masse</strong>. S'ensuit le <em>procés</em> : consultation non contraignante du 9 novembre 2014, élections plébiscitaires de 2015, référendum illégal du <strong>1<sup>er</sup> octobre 2017</strong> marqué par des violences policières, puis <strong>déclaration unilatérale d'indépendance</strong> le 27 octobre, aussitôt suivie de la mise sous tutelle de la Catalogne (article 155) et de l'exil ou l'emprisonnement des dirigeants indépendantistes. Graciés en 2021 puis amnistiés par une loi de 2023-2024, ces derniers voient leur situation judiciaire se solder en <strong>juillet 2026</strong> par un arrêt favorable de la Cour de justice de l'UE, ouvrant la voie au retour de <strong>Carles Puigdemont</strong> — tandis qu'à Barcelone, le gouvernement socialiste de <strong>Salvador Illa</strong>, élu en 2024, mise sur une <em>« normalité »</em> qui déplace le conflit du terrain identitaire vers celui, plus discret mais tout aussi disputé, du financement (voir chapitre 06).",
    es:"El nacionalismo catalán hunde sus raíces en la <strong>Renaixença</strong> del siglo XIX, renacimiento cultural y lingüístico que precede en varias décadas a cualquier reivindicación política de independencia. Dotado de instituciones de autogobierno desde 1914 (Mancomunitat) y luego 1932 (primer <em>Estatut</em>), el catalanismo es brutalmente reprimido bajo Franco antes de recuperar, en 1979, un estatuto de autonomía que lo convierte en una de las tres «nacionalidades históricas» de la Constitución. El punto de inflexión llega en <strong>2010</strong>: el Tribunal Constitucional censura partes enteras del nuevo Estatut catalán de 2006, en particular la mención de «nación», provocando un choque político que transforma un <strong>autonomismo mayoritario</strong> en <strong>independentismo de masas</strong>. Sigue el <em>procés</em>: consulta no vinculante del 9 de noviembre de 2014, elecciones plebiscitarias de 2015, referéndum ilegal del <strong>1 de octubre de 2017</strong> marcado por violencia policial, y después <strong>declaración unilateral de independencia</strong> el 27 de octubre, seguida de inmediato por la intervención de Cataluña (artículo 155) y el exilio o encarcelamiento de los dirigentes independentistas. Indultados en 2021 y luego amnistiados por una ley de 2023-2024, estos ven su situación judicial resolverse en <strong>julio de 2026</strong> con una sentencia favorable del Tribunal de Justicia de la UE, que abre la vía al regreso de <strong>Carles Puigdemont</strong> — mientras que en Barcelona, el gobierno socialista de <strong>Salvador Illa</strong>, elegido en 2024, apuesta por una <em>«normalidad»</em> que desplaza el conflicto del terreno identitario hacia el de la financiación, más discreto pero igual de disputado (ver capítulo 06)."
  },

            fr:"Le nationalisme catalan ne naît pas d'une revendication politique, mais d'un mouvement littéraire : la <strong>Renaixença</strong> (« renaissance »), qui se développe entre 1833 et la fin du XIX<sup>e</sup> siècle, restaure le catalan comme langue de création littéraire après des siècles de recul face au castillan, notamment à la suite du <em>decreto de Nueva Planta</em> de 1716 qui avait supprimé les institutions propres de la Catalogne. Cette renaissance linguistique précède de plusieurs décennies l'apparition d'un projet politique autonomiste structuré, ce qui explique la profondeur des racines <strong>culturelles</strong> du catalanisme, bien antérieures à toute revendication d'indépendance.",
            es:"El nacionalismo catalán no nace de una reivindicación política, sino de un movimiento literario: la <strong>Renaixença</strong> («renacimiento»), que se desarrolla entre 1833 y finales del siglo XIX, restaura el catalán como lengua de creación literaria tras siglos de retroceso frente al castellano, sobre todo a raíz del <em>decreto de Nueva Planta</em> de 1716 que había suprimido las instituciones propias de Cataluña. Este renacimiento lingüístico precede en varias décadas la aparición de un proyecto político autonomista estructurado, lo que explica la profundidad de las raíces <strong>culturales</strong> del catalanismo, muy anteriores a cualquier reivindicación de independencia."} },
          { t:"p", c:{

            es:"La politización llega en el cambio entre los siglos XIX y XX. En <strong>1901</strong>, <strong>Enric Prat de la Riba</strong> funda la <strong>Lliga Regionalista</strong>, primer gran partido catalanista, conservador y burgués, que reivindica el autogobierno dentro del marco español en lugar de la separación. Esta estrategia da fruto en <strong>1914</strong> con la creación de la <strong>Mancomunitat de Catalunya</strong>, que federa las cuatro provincias catalanas en una administración común —sin poder legislativo propio, pero primer órgano de autoadministración desde 1716—."} },

               es:"«Hecho diferencial»: expresión que designa los rasgos propios de Cataluña —lengua, derecho civil, instituciones históricas— invocados para justificar un tratamiento constitucional distinto del de las demás regiones españolas. Noción central del debate sobre los «hechos diferenciales» ya abordado en el capítulo 06."} }

            es:"La proclamación de la <strong>II República</strong> en 1931 permite la aprobación, en <strong>1932</strong>, del primer <strong>Estatut d'autonomia</strong> de la Cataluña democrática: la Generalitat, institución medieval suprimida en 1716, es restaurada bajo la presidencia de <strong>Francesc Macià</strong>. Esta autonomía queda brutalmente interrumpida por la victoria franquista de 1939: durante casi cuarenta años, la <strong>lengua catalana</strong> es prohibida en la enseñanza, la administración y los medios, sus instituciones suprimidas, sus dirigentes ejecutados (el presidente Lluís Companys en 1940) o exiliados."} },

            es:"El <strong>10 de julio de 2010</strong>, una manifestación masiva reúne a más de un millón de personas en Barcelona bajo el lema <em>«Som una nació. Nosaltres decidim»</em> («Somos una nación. Nosotros decidimos»). La crisis económica de 2008, que golpea duramente a Cataluña, y el fracaso de las negociaciones sobre la financiación regional, terminan de convertir a una parte de la opinión catalana, hasta entonces autonomista, a la idea de que solo la independencia permitiría salir de lo que percibe como un callejón institucional."} }

            es:"Ante la negativa constante de Madrid a autorizar un referéndum, la Generalitat organiza el <strong>9 de noviembre de 2014</strong> una <strong>consulta no vinculante</strong> («9N»), pese a su suspensión por el Tribunal Constitucional. Presentada como una simple «participación ciudadana» para eludir la prohibición jurídica de un referéndum formal, arroja una mayoría de «sí» a la independencia, pero con una participación limitada a en torno al 37 % del censo. Artur Mas es después condenado por desobediencia, una sanción que radicaliza el movimiento más que lo disuade."} },
          { t:"p", c:{

            es:"Las elecciones del <strong>27 de septiembre de 2015</strong> son presentadas por los independentistas como un <strong>plebiscito</strong>: la coalición Junts pel Sí y la CUP obtienen juntas la mayoría absoluta de escaños en el Parlament, pero solo el <strong>47,8 % de los votos</strong> — una brecha entre mayoría de escaños y mayoría de votos que alimentará de forma duradera la impugnación de la legitimidad del proceso, incluso entre algunos partidarios moderados de la autonomía."} }

        blocs:[
          { t:"p", c:{
            fr:"Le <strong>1<sup>er</sup> octobre 2017</strong>, la Generalitat, désormais présidée par <strong>Carles Puigdemont</strong>, organise le <strong>référendum d'autodétermination</strong> malgré son interdiction explicite par le Tribunal constitutionnel. Le gouvernement de <strong>Mariano Rajoy</strong> déploie la police nationale et la Guardia Civil pour empêcher le vote, provoquant des <strong>charges violentes</strong> devant plusieurs bureaux de vote, filmées et diffusées dans le monde entier. Le résultat officiel donne 90 % de « oui », mais sur une participation estimée à environ 43 %, l'essentiel du camp unioniste ayant boycotté un scrutin qu'il jugeait illégal.",
            es:"El <strong>1 de octubre de 2017</strong>, la Generalitat, presidida entonces por <strong>Carles Puigdemont</strong>, organiza el <strong>referéndum de autodeterminación</strong> pese a su prohibición explícita por el Tribunal Constitucional. El gobierno de <strong>Mariano Rajoy</strong> despliega a la Policía Nacional y a la Guardia Civil para impedir la votación, provocando <strong>cargas violentas</strong> ante numerosos colegios electorales, filmadas y difundidas en todo el mundo. El resultado oficial da un 90 % de «sí», pero sobre una participación estimada en torno al 43 %, ya que la mayor parte del bando unionista boicoteó una votación que consideraba ilegal."} },
          { t:"p", c:{
            fr:"Le <strong>27 octobre 2017</strong>, le Parlement catalan vote, à bulletins secrets et en l'absence de l'opposition, une <strong>déclaration unilatérale d'indépendance</strong> (DUI). Le Sénat espagnol active, le jour même, l'<strong>article 155</strong> de la Constitution, qui permet à l'État de suspendre l'autonomie d'une communauté en cas de manquement grave à ses obligations constitutionnelles — une disposition jusque-là jamais utilisée. Le gouvernement catalan est destitué, ses compétences reprises directement par Madrid, et de nouvelles élections régionales sont convoquées pour décembre 2017.",
            es:"El <strong>27 de octubre de 2017</strong>, el Parlament vota, en votación secreta y en ausencia de la oposición, una <strong>declaración unilateral de independencia</strong> (DUI). El Senado español activa, ese mismo día, el <strong>artículo 155</strong> de la Constitución, que permite al Estado suspender la autonomía de una comunidad en caso de incumplimiento grave de sus obligaciones constitucionales —una disposición hasta entonces nunca utilizada—. El Govern es destituido, sus competencias asumidas directamente por Madrid, y se convocan nuevas elecciones regionales para diciembre de 2017."} },
          { t:"encadre", icon:"⚠️", c:"var(--a4)",

            c2:{fr:"Ne pas présenter la DUI comme ayant produit un <strong>effet juridique</strong>. Elle n'a jamais été reconnue, ni en Espagne ni par aucun État tiers ni par l'Union européenne ; la Catalogne n'est, à aucun moment, devenue un État indépendant de fait. La déclaration a surtout eu une portée <strong>pénale</strong> : elle est au fondement des poursuites pour sédition puis rébellion engagées contre ses initiateurs.",
                es:"No presentar la DUI como si hubiera producido un <strong>efecto jurídico</strong>. Nunca fue reconocida, ni en España ni por ningún Estado tercero ni por la Unión Europea; Cataluña no llegó a convertirse en ningún momento en un Estado independiente de facto. La declaración tuvo sobre todo un alcance <strong>penal</strong>: es el fundamento de las causas por sedición y luego rebelión abiertas contra sus impulsores."} },
          { t:"p", c:{
            fr:"Dans les jours suivants, <strong>Carles Puigdemont</strong> et plusieurs conseillers du gouvernement destitué s'exilent en Belgique pour échapper aux poursuites, tandis que d'autres dirigeants — dont le vice-président <strong>Oriol Junqueras</strong> — sont placés en détention provisoire. S'ouvre alors une décennie de procédures judiciaires parallèles : procès à Madrid, demandes d'extradition européenne infructueuses contre Puigdemont, mandats d'arrêt internationaux régulièrement levés puis réactivés selon les pays de séjour de l'ancien président catalan.",
            es:"En los días siguientes, <strong>Carles Puigdemont</strong> y varios consejeros del Govern destituido se exilian en Bélgica para escapar de la acción judicial, mientras otros dirigentes —entre ellos el vicepresidente <strong>Oriol Junqueras</strong>— quedan en prisión provisional. Se abre entonces una década de procedimientos judiciales paralelos: juicio en Madrid, solicitudes de extradición europea infructuosas contra Puigdemont, órdenes de detención internacionales retiradas y reactivadas según los países de estancia del expresidente catalán."} }

        blocs:[

            es:"Como se ha visto en el capítulo 09, la investidura de Sánchez en noviembre de 2023 depende del apoyo de <strong>Junts</strong>, que lo convierte en condición explícita de una <strong>ley de amnistía</strong> que cubre el conjunto de los hechos ligados al procés entre 2012 y 2023 —referéndum, DUI, pero también las manifestaciones posteriores de los Comités de Defensa de la República (CDR)—. Votada el <strong>9 de noviembre de 2023</strong> y aprobada definitivamente en <strong>2024</strong> tras varias lanzaderas parlamentarias, la ley extingue las responsabilidades penales, con la excepción explícita de los hechos de <strong>terrorismo</strong> y de <strong>malversación con fin de enriquecimiento personal</strong> — una cláusula que se convertirá en el núcleo del litigio judicial siguiente."} },

            es:"El <strong>Tribunal Supremo</strong> español se niega durante varios meses a aplicar la amnistía a Puigdemont, considerando que el desvío de fondos públicos para financiar el referéndum constituye una malversación con fin personal excluida del ámbito de la ley —una lectura extensiva cuestionada por los juristas del <em>procés</em>—. El Tribunal de Cuentas español eleva entonces una cuestión prejudicial al <strong>Tribunal de Justicia de la Unión Europea</strong> (TJUE) sobre la compatibilidad de la ley con el derecho comunitario, en particular la protección de los intereses financieros de la UE."} },

            es:"Las elecciones catalanas del <strong>12 de mayo de 2024</strong> marcan una ruptura: el <strong>PSC</strong> de <strong>Salvador Illa</strong> queda primero por primera vez desde 2003, mientras los dos partidos independentistas históricos, ERC y Junts, retroceden claramente respecto a su apogeo de 2017. Illa forma un gobierno socialista minoritario, cuya investidura depende de la abstención de ERC, y exhibe una línea de <strong>«normalidad»</strong> —gestión de los servicios públicos, apaciguamiento del conflicto identitario— que rompe con diez años de política catalana organizada en torno al <em>procés</em>."} },

            es:"Esta normalización desplaza el terreno del conflicto más que lo apaga: es ahora la <strong>financiación singular</strong> —estudiada en el capítulo 06— la que estructura las relaciones de fuerza entre el PSC, ERC y Junts, que sigue reclamando un concierto económico completo y amenaza con regularidad con retirar su apoyo al gobierno de Sánchez en Madrid. El propio presupuesto catalán conoce, a lo largo de 2026, varios episodios de bloqueo entre el PSC y ERC, señal de que el apaciguamiento institucional no ha puesto fin a las tensiones entre los socios de la mayoría."} },

  lexique: [

    { es:"Estatut d'autonomia", fr:"Statut d'autonomie de la Catalogne, adopté en 1932, 1979 et 2006 ; « constitution régionale » catalane." },
    { es:"Dret a decidir", fr:"« Droit à décider » : doctrine indépendantiste selon laquelle la question de l'indépendance doit être tranchée par référendum." },
    { es:"Diada", fr:"Fête nationale catalane du 11 septembre, commémorant la chute de Barcelone en 1714, devenue rendez-vous militant depuis 2012." },
    { es:"Procés", fr:"Processus politique et institutionnel indépendantiste catalan, de la consultation de 2014 à la DUI de 2017." },
    { es:"1-O", fr:"Référendum d'autodétermination illégal du 1er octobre 2017, marqué par des violences policières." },
    { es:"DUI (Declaració Unilateral d'Independència)", fr:"Déclaration unilatérale d'indépendance votée par le Parlement catalan le 27 octobre 2017, sans effet juridique reconnu." },
    { es:"Artículo 155", fr:"Disposition constitutionnelle permettant à l'État de suspendre l'autonomie d'une communauté ; activée pour la première fois en 2017." },

    { es:"Ley de amnistía", fr:"Loi de 2023-2024 effaçant les responsabilités pénales liées au procés, validée par la CJUE en juillet 2026." },

  sujets: [

         es:"¿Cómo explicar la transformación de un catalanismo autonomista en movimiento independentista de masas?"},
      h:{fr:"Partir de la censure du statut de 2006 par le Tribunal constitutionnel en 2010 comme catalyseur, sans négliger le contexte de la crise de 2008.",
         es:"Partir de la censura del Estatut de 2006 por el Tribunal Constitucional en 2010 como catalizador, sin descuidar el contexto de la crisis de 2008."} },
    { q:{fr:"Le référendum du 1<sup>er</sup> octobre 2017 a-t-il constitué une rupture démocratique ou institutionnelle ?",
         es:"¿Constituyó el referéndum del 1 de octubre de 2017 una ruptura democrática o institucional?"},
      h:{fr:"Distinguer la légitimité procédurale contestée du scrutin et la réalité des violences policières, sans les confondre en un seul jugement.",
         es:"Distinguir la legitimidad procedimental cuestionada de la votación y la realidad de la violencia policial, sin confundirlas en un único juicio."} },
    { q:{fr:"Dans quelle mesure l'amnistie de 2023-2024 a-t-elle refermé la crise catalane ?",
         es:"¿En qué medida ha cerrado la amnistía de 2023-2024 la crisis catalana?"},
      h:{fr:"Distinguer clairement le règlement judiciaire, validé par la CJUE en 2026, et la question politique de l'indépendance, restée sans réponse.",
         es:"Distinguir claramente la resolución judicial, avalada por el TJUE en 2026, y la cuestión política de la independencia, que sigue sin respuesta."} },
    { q:{fr:"La « normalité » du gouvernement Illa marque-t-elle la fin du nationalisme catalan comme force politique majeure ?",
         es:"¿Marca la «normalidad» del Govern de Illa el fin del nacionalismo catalán como fuerza política mayor?"},
      h:{fr:"S'appuyer sur les résultats électoraux de 2024, le recul relatif de Junts et d'ERC, et le déplacement du conflit vers la financiación singular (chapitre 06).",
         es:"Apoyarse en los resultados electorales de 2024, el retroceso relativo de Junts y ERC, y el desplazamiento del conflicto hacia la financiación singular (capítulo 06)."} }

  /* ─── 9. À RETENIR ───────────────────────────────────────────────── */
  retenir: {

    ],
    es:[
      "El nacionalismo catalán nace de un movimiento <strong>cultural</strong>, la Renaixença del siglo XIX, mucho antes de cualquier reivindicación de independencia.",
      "Dotado de instituciones desde 1914 y 1932, el catalanismo es brutalmente reprimido bajo <strong>Franco</strong> antes de ser restaurado por el Estatut de 1979.",
      "La <strong>censura del Estatut de 2006</strong> por el Tribunal Constitucional en 2010 es el catalizador que transforma el autonomismo en independentismo de masas.",
      "El <strong>procés</strong> se despliega desde la Diada de 2012 hasta el referéndum ilegal del <strong>1-O</strong> (2017) y la declaración unilateral de independencia del 27 de octubre de 2017.",
      "El artículo <strong>155</strong>, activado por primera vez en la historia constitucional, pone a Cataluña bajo intervención directa y destituye al Govern.",
      "Las condenas de 2019 son seguidas por los <strong>indultos de 2021</strong>, y después por la <strong>ley de amnistía de 2023-2024</strong>, condición del apoyo de Junts a la investidura de Sánchez.",
      "En <strong>julio de 2026</strong>, el TJUE avala la amnistía a la luz del derecho europeo, abriendo la vía, sin garantizarlo de inmediato, al regreso de Puigdemont.",
      "Desde 2024, el Govern de <strong>Illa</strong> apuesta por la «normalidad» institucional, desplazando el conflicto catalán hacia la cuestión de la financiación más que de la identidad."

};
</script>

<script>
/* ─── Utilitaires ─── */
const $ = (s,r=document)=>r.querySelector(s);
let LANG = 'fr';
/* T() : renvoie la version dans la langue courante, ou la valeur telle quelle */
const T = v => (v && typeof v==='object' && !Array.isArray(v) && ('fr' in v||'es' in v)) ? (v[LANG] ?? v.fr) : v;

/* ─── Libellés d'interface ─── */
const UI = {
  fr:{ chrono:"Chronologie",
       essentiel:"L'essentiel", reperes:"Repères", quiEstQui:"Qui est qui", acteurs:"Acteurs clés",
       controverse:"Controverse", vocab:"Vocabulaire", lexique:"Lexique bilingue",
       filtrer:"Filtrer le lexique…", terme:"Terme", trad:"Traduction / usage",
       entrainement:"Entraînement", sujets:"Sujets possibles", memoriser:"Mémoriser",
       retenir:"À retenir", synthese:"Synthèse", chapitre:"Chapitre" },
  es:{ chrono:"Cronología",
       essentiel:"Lo esencial", reperes:"Hitos", quiEstQui:"Quién es quién", acteurs:"Actores clave",
       controverse:"Controversia", vocab:"Vocabulario", lexique:"Glosario bilingüe",
       filtrer:"Filtrar el glosario…", terme:"Término", trad:"Traducción / uso",
       entrainement:"Entrenamiento", sujets:"Posibles temas", memoriser:"Memorizar",
       retenir:"Para recordar", synthese:"Síntesis", chapitre:"Capítulo" }
};
const t = k => UI[LANG][k];

/* ─── Rendu des blocs de contenu ─── */
function bloc(b){
  switch(b.t){
    case 'p':      return `<p class="prose">${T(b.c)}</p>`;
    case 'liste':  return `<ul class="liste">${T(b.items).map(i=>`<li>${i}</li>`).join('')}</ul>`;
    case 'faits':  return `<div class="faits">${T(b.items).map(i=>
                     `<div class="fait"><div class="fait-l">${T(i.l)}</div><div class="fait-v">${T(i.v)}</div></div>`).join('')}</div>`;
    case 'stats':  return `<div class="stats">${b.items.map(i=>
                     `<div class="stat" style="--c:${i.c||'var(--a1)'}"><span class="stat-n">${T(i.n)}</span><span class="stat-d">${T(i.d)}</span></div>`).join('')}</div>`;
    case 'citation':return `<blockquote class="citation"><p>« ${T(b.c)} »</p><cite>${T(b.src)}</cite></blockquote>`;
    case 'encadre':return `<div class="encadre" style="--c:${b.c||'var(--a2)'}"><div class="encadre-ic">${b.icon||'💡'}</div>
                     <div><div class="encadre-t">${T(b.titre)}</div><div class="encadre-c">${T(b.c2)}</div></div></div>`;
    case 'def':    return `<div class="def"><div class="def-mot">${T(b.mot)}</div><div class="def-c">${T(b.c)}</div></div>`;
    case 'tableau':return `<div class="tbl-wrap"><table><thead><tr>${T(b.head).map(h=>`<th>${h}</th>`).join('')}</tr></thead>
                     <tbody>${T(b.rows).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tl':     return `<div class="tl">${T(b.items).map(i=>
                     `<div class="tl-item"><div class="tl-d">${T(i.d)}</div><div class="tl-c">${T(i.c)}</div></div>`).join('')}</div>`;
    default:       return '';
  }
}

/* ─── En-tête ─── */
function rendreHero(){
  const m = COURS.meta;
  document.documentElement.dataset.theme = m.theme;
  document.documentElement.lang = LANG;
  document.title = T(m.titre) + ' — Civilisation';
  $('#bc-titre').textContent = m.titre.fr ?? m.titre;   // la nav reste en français
  $('#ft').textContent = `${t('chapitre')} ${m.chapitre}${LANG==='fr'?' : ':': '}${T(m.titre)}`;
  $('#hero').innerHTML = `
    <span class="hero-flag">${m.drapeau}</span>
    <div class="hero-label">${T(m.label)}</div>
    <h1>${T(m.titre)}</h1>
    <p class="hero-sub">${T(m.sousTitre)}</p>`;
}

/* ─── Corps du cours ─── */
function rendreCours(){
  const c = COURS, out = [];

  out.push(`<section class="bloc rev" id="s-essentiel">
    <div class="essentiel"><div class="essentiel-label">${t('essentiel')}</div><p>${T(c.essentiel)}</p></div>
    <div class="stats">${c.chiffres.map((x,i)=>
      `<div class="stat" style="--c:var(--a${(i%4)+1})"><span class="stat-n">${T(x.n)}</span><span class="stat-d">${T(x.d)}</span></div>`).join('')}</div>
  </section>`);

  if(c.chronologie?.length){
    out.push(`<section class="bloc rev chrono-mobile" id="s-chrono">
      <div class="bloc-head"><span class="bloc-kicker">${t('reperes')}</span><h2 class="bloc-title">${t('chrono')}</h2></div>
      ${bloc({t:'tl',items:c.chronologie})}</section>`);
  }

  c.parties.forEach((p,pi)=>{
    let html = `<section class="partie rev" id="p-${pi}" style="--p:${p.couleur}">
      <div class="partie-head"><div class="partie-num">${p.num}</div>
      <div><div class="partie-kicker">${T(p.kicker)}</div><h2 class="partie-title">${T(p.titre)}</h2></div></div>`;
    p.sections.forEach((s,si)=>{
      html += `<div class="section" id="p-${pi}-${si}"><h3 class="section-title"><span class="section-num">${si+1}.</span> ${T(s.titre)}</h3>
        ${s.blocs.map(bloc).join('')}</div>`;
    });
    out.push(html+`</section>`);
  });

  if(c.acteurs?.length){
    out.push(`<section class="bloc rev" id="s-acteurs">
      <div class="bloc-head"><span class="bloc-kicker">${t('quiEstQui')}</span><h2 class="bloc-title">${t('acteurs')}</h2></div>
      <div class="acteurs">${c.acteurs.map(a=>
        `<div class="acteur" style="--c:${a.c}"><div class="acteur-nom">${a.nom}</div>
         <div class="acteur-role">${T(a.role)}</div><div class="acteur-c">${T(a.d)}</div></div>`).join('')}</div></section>`);
  }

  if(c.debat){
    out.push(`<section class="bloc rev" id="s-debat">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a4)">${t('controverse')}</span>
      <h2 class="bloc-title">${T(c.debat.question)}</h2></div>
      <div class="debat">
        <div class="debat-col oui"><div class="debat-t">${T(c.debat.oui.titre)}</div>
          <ul>${T(c.debat.oui.items).map(i=>`<li>${i}</li>`).join('')}</ul></div>
        <div class="debat-col non"><div class="debat-t">${T(c.debat.non.titre)}</div>
          <ul>${T(c.debat.non.items).map(i=>`<li>${i}</li>`).join('')}</ul></div>
      </div>
      ${c.debat.synthese?`<div class="encadre" style="--c:var(--a1);margin-top:14px">
        <div class="encadre-ic">⚖️</div><div><div class="encadre-t">${t('synthese')}</div>
        <div class="encadre-c">${T(c.debat.synthese)}</div></div></div>`:''}
    </section>`);
  }

  if(c.lexique?.length){
    out.push(`<section class="bloc rev" id="s-lexique">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a2)">${t('vocab')}</span>
      <h2 class="bloc-title">${t('lexique')}</h2></div>
      <input class="lex-search" id="lex-search" placeholder="${t('filtrer')}" aria-label="${t('filtrer')}">
      <div class="tbl-wrap"><table class="lex"><thead><tr><th>${t('terme')}</th><th>${t('trad')}</th></tr></thead>
      <tbody id="lex-body">${c.lexique.map(l=>`<tr><td>${l.es}</td><td>${l.fr}</td></tr>`).join('')}</tbody></table></div>
    </section>`);
  }

  if(c.sujets?.length){
    out.push(`<section class="bloc rev" id="s-sujets">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a4)">${t('entrainement')}</span>
      <h2 class="bloc-title">${t('sujets')}</h2></div>
      ${c.sujets.map((s,i)=>`<div class="sujet"><div class="sujet-n">${String(i+1).padStart(2,'0')}</div>
        <div><div class="sujet-q">${T(s.q)}</div><div class="sujet-h">${T(s.h)}</div></div></div>`).join('')}</section>`);
  }

  if(c.retenir?.length){
    out.push(`<section class="bloc rev" id="s-retenir">
      <div class="bloc-head"><span class="bloc-kicker">${t('memoriser')}</span><h2 class="bloc-title">${t('retenir')}</h2></div>
      <div class="retenir"><ul>${T(c.retenir).map(r=>`<li>${r}</li>`).join('')}</ul></div></section>`);
  }

  $('#cours').innerHTML = out.join('');
}

/* ─── Colonne chronologie ─── */
function rendreRail(){
  if(!COURS.chronologie?.length){ $('#rail')?.remove(); return; }
  $('#rail').innerHTML = `<div class="rail-title">${t('chrono')}</div>${bloc({t:'tl',items:COURS.chronologie})}`;
}

/* ─── Recherche dans le lexique ─── */
function brancherLexique(){
  const ls = $('#lex-search'); if(!ls) return;
  ls.addEventListener('input', ()=>{
    const q = ls.value.toLowerCase().trim();
    $('#lex-body').querySelectorAll('tr').forEach(tr=>{
      tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
}

/* ─── Changement de langue ─── */
function setLang(lang){
  LANG = lang;
  $('#ap-btn-fr').classList.toggle('active', lang==='fr');
  $('#ap-btn-es').classList.toggle('active', lang==='es');
  rendreHero(); rendreCours(); rendreRail();
  document.querySelectorAll('.rev').forEach(el=>el.classList.add('vu'));
  brancherLexique();
}

/* ─── Démarrage ─── */
function demarrer(){
  rendreHero(); rendreCours(); rendreRail(); brancherLexique();

  const maj = ()=>{
    const h = document.body.scrollHeight - innerHeight;
    $('#progress').style.width = (h>0 ? (scrollY/h)*100 : 0) + '%';
  };
  addEventListener('scroll', maj, {passive:true}); maj();

  if(!('IntersectionObserver' in window)){
    document.querySelectorAll('.rev').forEach(el=>el.classList.add('vu'));
    return;
  }
  const io = new IntersectionObserver(es=>es.forEach(x=>{
    if(x.isIntersecting){ x.target.classList.add('vu'); io.unobserve(x.target); }
  }), {threshold:.06});
  document.querySelectorAll('.rev').forEach(el=>io.observe(el));
}

demarrer();
</script>
