<!DOCTYPE html>
<html lang="fr" data-theme="espagnol3">
<head>
<script src="../../auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mouvements féministes — Civilisation Hispanophone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- ══════════════════════════════════════════════════════════════════════
     TEMPLATE UNIVERSEL DE COURS DE CIVILISATION — v1
     Pour créer un nouveau cours : dupliquer ce fichier, ne modifier QUE
     le bloc de données (id="donnees") tout en bas. Rien d'autre à toucher.
     ══════════════════════════════════════════════════════════════════════ -->

<style>
  /* ─── PALETTE DE BASE (identique au site) ─── */
  :root{
    --bg:#0d0d0f; --surface:#16161a; --surface2:#1e1e24; --border:#2a2a35;
    --text:#e8e6e0; --text-dim:#8a8880; --text-faint:#4a4845;
    --radius:14px;
  }
  /* ─── THÈMES PAR LANGUE — change data-theme sur <html> ─── */
  html[data-theme="anglais"] { --a1:#c8a96e; --a2:#7c9ec9; --a3:#9ecba0; --a4:#c97c9e; --hero:#16233d; }
  html[data-theme="anglais2"] { --a1:#c9633f; --a2:#5b8f6f; --a3:#6c8fc7; --a4:#a06bb0; --hero:#16241b; }
  html[data-theme="espagnol"]{ --a1:#e0a93e; --a2:#c8553d; --a3:#7fae7a; --a4:#b06fa8; --hero:#3a1a18; }
  html[data-theme="espagnol3"]{ --a1:#c9a24a; --a2:#4d7ea8; --a3:#5aa88f; --a4:#a85a6b; --hero:#101c2c; }
  html[data-theme="espagnol4"]{ --a1:#a98ac9; --a2:#6fa89b; --a3:#cf8f5e; --a4:#c26a8e; --hero:#221a2c; }
  html[data-theme="espagnol5"]{ --a1:#4fae94; --a2:#c98a4b; --a3:#8f9ec9; --a4:#c0566f; --hero:#10251f; }
  html[data-theme="espagnol6"]{ --a1:#5b9bd5; --a2:#d9a441; --a3:#7bb37a; --a4:#b0566e; --hero:#132436; }
  html[data-theme="espagnol7"]{ --a1:#e0954f; --a2:#5f9ea6; --a3:#a878c9; --a4:#b5495b; --hero:#2b1c14; }
  html[data-theme="espagnol8"]{ --a1:#d4534f; --a2:#4f9d8f; --a3:#e0b04a; --a4:#8f5fa8; --hero:#2a1416; }
  html[data-theme="espagnol9"]{ --a1:#3f9e8f; --a2:#d4914a; --a3:#5a8fc7; --a4:#c25b5b; --hero:#142a28; }
  html[data-theme="espagnol10"]{ --a1:#a8447a; --a2:#4a8f7e; --a3:#e0a13e; --a4:#7a5ba8; --hero:#2a1224; }
  html[data-theme="allemand"]{ --a1:#d8b44a; --a2:#8fa4bd; --a3:#84b58e; --a4:#c06060; --hero:#241f1a; }
  html[data-theme="italien"] { --a1:#d5a94e; --a2:#6fae8f; --a3:#a8c07a; --a4:#c4695e; --hero:#152a24; }
  html[data-theme="chinois"] { --a1:#d9a441; --a2:#c05a4a; --a3:#83a98f; --a4:#a97fb0; --hero:#2c1618; }

  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;overflow-x:hidden}

  /* ─── FOND ─── */
  .bg-orb{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;opacity:.08;z-index:0}
  .orb1{width:700px;height:700px;background:var(--a1);top:-300px;right:-250px}
  .orb2{width:600px;height:600px;background:var(--a2);bottom:-250px;left:-250px}

  /* ─── BARRE DE PROGRESSION ─── */
  #progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:200;
    background:linear-gradient(90deg,var(--a1),var(--a2),var(--a4));transition:width .1s linear}

  /* ─── NAV ─── */
  nav{display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding:16px 40px;border-bottom:1px solid var(--border);
    background:rgba(13,13,15,.9);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100}
  .nav-logo{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;color:var(--a1);cursor:pointer}
  .breadcrumb{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--text-dim);flex-wrap:wrap}
  .breadcrumb span{cursor:pointer;transition:color .2s}
  .breadcrumb span:hover{color:var(--a1)}
  .breadcrumb .sep{color:var(--text-faint);cursor:default}
  .breadcrumb .current{color:var(--text);cursor:default}
  .nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .ap-lang-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    color:rgba(255,255,255,.6);font-family:'DM Mono',monospace;font-size:10px;font-weight:700;
    letter-spacing:.12em;padding:5px 14px;border-radius:4px;cursor:pointer;transition:all .2s;text-transform:uppercase}
  .ap-lang-btn.active{background:var(--a1);border-color:var(--a1);color:#12100c}
  .ap-lang-btn:hover:not(.active){background:rgba(255,255,255,.15);color:#fff}

  /* ─── HERO ─── */
  .hero{position:relative;z-index:1;padding:76px 40px 56px;text-align:center;overflow:hidden;
    background:linear-gradient(160deg,var(--hero),#0d0d0f 85%);border-bottom:1px solid var(--border)}
  .hero::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
    width:80px;height:2px;background:var(--a1)}
  .hero-flag{font-size:2.6rem;line-height:1;margin-bottom:18px;display:block}
  .hero-label{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.3em;
    text-transform:uppercase;color:var(--a1);margin-bottom:18px}
  .hero h1{font-family:'Playfair Display',serif;font-weight:900;line-height:1.05;
    font-size:clamp(2.4rem,6vw,4.6rem);max-width:900px;margin:0 auto 18px}
  .hero-sub{font-size:1rem;color:var(--text-dim);max-width:640px;margin:0 auto;line-height:1.6}

  /* ─── LAYOUT ─── */
  .layout{display:flex;gap:48px;max-width:1320px;margin:0 auto;padding:48px 40px 100px;position:relative;z-index:1}
  main{flex:1;min-width:0;max-width:840px}

  /* ─── COLONNE CHRONOLOGIE ─── */
  .rail{width:262px;flex-shrink:0;position:sticky;top:88px;align-self:flex-start;
    max-height:calc(100vh - 118px);overflow-y:auto;padding-right:8px}
  .rail-title{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;
    color:var(--a1);margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border)}
  .rail .tl{padding-left:20px;margin:0 0 0 4px}
  .rail .tl-item{padding-bottom:16px}
  .rail .tl-item::before{left:-26px;top:4px;width:7px;height:7px}
  .rail .tl-d{font-size:.66rem;letter-spacing:.08em}
  .rail .tl-c{font-size:.79rem;line-height:1.5}
  .rail::-webkit-scrollbar{width:3px}
  .rail::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .chrono-mobile{display:none}

  /* ─── BLOC GÉNÉRIQUE ─── */
  .bloc{margin-bottom:64px;scroll-margin-top:88px}
  .bloc-head{display:flex;align-items:baseline;gap:14px;margin-bottom:24px;
    padding-bottom:12px;border-bottom:1px solid var(--border)}
  .bloc-kicker{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--k,var(--a1))}
  .bloc-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--text)}

  /* ─── L'ESSENTIEL ─── */
  .essentiel{background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    border:1px solid var(--border);border-left:3px solid var(--a1);border-radius:var(--radius);
    padding:28px 30px;margin-bottom:36px}
  .essentiel-label{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--a1);margin-bottom:14px}
  .essentiel p{font-size:.98rem;line-height:1.75;color:var(--text);margin-bottom:0}
  .essentiel p strong{color:var(--a1);font-weight:500}

  /* ─── STATS ─── */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0}
  .stat{border-radius:10px;padding:18px 16px;text-align:center;border:1px solid rgba(255,255,255,.08);
    background:linear-gradient(135deg,color-mix(in srgb,var(--c,var(--a1)) 26%,#101014),
    color-mix(in srgb,var(--c,var(--a1)) 8%,#101014))}
  .stat-n{font-family:'DM Mono',monospace;font-size:1.5rem;font-weight:500;color:var(--text);display:block;line-height:1.1}
  .stat-d{font-size:.7rem;color:var(--text-dim);margin-top:7px;display:block;line-height:1.45}

  /* ─── PARTIES ─── */
  .partie{margin-bottom:78px;scroll-margin-top:88px}
  .partie-head{display:flex;align-items:center;gap:22px;margin-bottom:34px;
    padding-bottom:18px;border-bottom:2px solid var(--p)}
  .partie-num{font-family:'Playfair Display',serif;font-size:3.4rem;font-weight:900;
    color:var(--p);opacity:.35;line-height:.9;flex-shrink:0}
  .partie-title{font-family:'Playfair Display',serif;font-size:clamp(1.35rem,3vw,1.95rem);
    font-weight:700;line-height:1.2}
  .partie-kicker{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.24em;
    text-transform:uppercase;color:var(--p);margin-bottom:6px}

  .section{margin-bottom:44px;scroll-margin-top:88px}
  .section-title{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;
    color:var(--text);margin-bottom:18px;padding-left:16px;border-left:3px solid var(--p)}
  .section-num{color:var(--p);font-weight:900}

  /* ─── TEXTE ─── */
  .prose{font-size:.96rem;line-height:1.8;color:rgba(232,230,224,.78);margin-bottom:16px}
  .prose strong{color:var(--text);font-weight:500}
  .prose em{color:var(--p,var(--a1));font-style:normal;font-weight:500}
  .es{font-family:'DM Mono',monospace;font-size:.86em;color:var(--a2)}

  /* ─── LISTE ─── */
  .liste{list-style:none;margin:14px 0 20px}
  .liste li{font-size:.93rem;line-height:1.65;color:rgba(232,230,224,.75);
    padding:9px 0 9px 22px;position:relative;border-bottom:1px solid rgba(255,255,255,.05)}
  .liste li:last-child{border-bottom:none}
  .liste li::before{content:'';position:absolute;left:0;top:17px;width:6px;height:6px;
    border-radius:50%;background:var(--p,var(--a1))}
  .liste li strong{color:var(--text);font-weight:500}

  /* ─── FAITS CLÉS ─── */
  .faits{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;margin:20px 0}
  .fait{background:rgba(255,255,255,.03);border:1px solid var(--border);
    border-left:3px solid var(--p,var(--a1));border-radius:8px;padding:13px 15px}
  .fait-l{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--text-faint);
    text-transform:uppercase;letter-spacing:.14em;margin-bottom:5px}
  .fait-v{font-size:.86rem;font-weight:500;color:var(--text);line-height:1.4}

  /* ─── CITATION ─── */
  .citation{background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
    border:1px solid var(--border);border-left:3px solid var(--a1);border-radius:0 10px 10px 0;
    padding:20px 24px;margin:22px 0}
  .citation p{font-family:'Playfair Display',serif;font-style:italic;font-size:1.02rem;
    line-height:1.6;color:var(--text);margin-bottom:9px}
  .citation cite{font-family:'DM Mono',monospace;font-size:.66rem;letter-spacing:.08em;
    color:var(--a1);font-style:normal}

  /* ─── ENCADRÉ ─── */
  .encadre{display:flex;gap:15px;align-items:flex-start;border-radius:10px;padding:17px 20px;margin:20px 0;
    background:color-mix(in srgb,var(--c,var(--a2)) 7%,transparent);
    border:1px solid color-mix(in srgb,var(--c,var(--a2)) 26%,transparent)}
  .encadre-ic{font-size:1.5rem;flex-shrink:0;line-height:1.2}
  .encadre-t{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.2em;
    text-transform:uppercase;color:var(--c,var(--a2));margin-bottom:7px;font-weight:500}
  .encadre-c{font-size:.89rem;line-height:1.7;color:rgba(232,230,224,.75)}
  .encadre-c strong{color:var(--text);font-weight:500}

  /* ─── DÉFINITION ─── */
  .def{border:1px dashed var(--border);border-radius:10px;padding:15px 18px;margin:18px 0;
    background:rgba(255,255,255,.02)}
  .def-mot{font-family:'Playfair Display',serif;font-weight:700;font-size:1rem;color:var(--a3);margin-bottom:6px}
  .def-c{font-size:.88rem;line-height:1.7;color:rgba(232,230,224,.72)}

  /* ─── TABLEAU ─── */
  .tbl-wrap{overflow-x:auto;margin:20px 0;border:1px solid var(--border);border-radius:10px}
  table{width:100%;border-collapse:collapse;font-size:.83rem}
  thead{background:rgba(255,255,255,.04)}
  thead th{padding:11px 15px;text-align:left;font-family:'DM Mono',monospace;font-size:.6rem;
    letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap}
  tbody tr{border-top:1px solid var(--border)}
  tbody tr:nth-child(even){background:rgba(255,255,255,.015)}
  tbody td{padding:11px 15px;color:rgba(232,230,224,.75);line-height:1.5}
  tbody td:first-child{color:var(--text);font-weight:500}

  /* ─── CHRONOLOGIE ─── */
  .tl{border-left:2px solid var(--border);padding-left:26px;margin:8px 0 8px 6px}
  .tl-item{position:relative;padding-bottom:22px}
  .tl-item:last-child{padding-bottom:0}
  .tl-item::before{content:'';position:absolute;left:-33px;top:5px;width:9px;height:9px;border-radius:50%;
    background:var(--c,var(--a1));box-shadow:0 0 0 3px rgba(13,13,15,1),0 0 0 5px color-mix(in srgb,var(--c,var(--a1)) 35%,transparent)}
  .tl-d{font-family:'DM Mono',monospace;font-size:.72rem;font-weight:500;letter-spacing:.1em;
    color:var(--c,var(--a1));margin-bottom:4px}
  .tl-c{font-size:.9rem;line-height:1.6;color:rgba(232,230,224,.75)}
  .tl-c strong{color:var(--text);font-weight:500}

  /* ─── ACTEURS ─── */
  .acteurs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .acteur{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;
    transition:all .25s;position:relative;overflow:hidden}
  .acteur:hover{border-color:var(--c,var(--a1));transform:translateY(-3px);background:var(--surface2)}
  .acteur-nom{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;margin-bottom:3px}
  .acteur-role{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--c,var(--a1));margin-bottom:10px}
  .acteur-c{font-size:.82rem;line-height:1.6;color:var(--text-dim)}

  /* ─── DÉBAT ─── */
  .debat{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .debat-col{border:1px solid var(--border);border-radius:12px;padding:20px 22px;background:rgba(255,255,255,.02)}
  .debat-col.oui{border-top:3px solid var(--a3)}
  .debat-col.non{border-top:3px solid var(--a4)}
  .debat-t{font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}
  .debat-col.oui .debat-t{color:var(--a3)}
  .debat-col.non .debat-t{color:var(--a4)}
  .debat-col li{font-size:.87rem;line-height:1.6;color:rgba(232,230,224,.75);
    padding:9px 0 9px 18px;position:relative;list-style:none;border-bottom:1px solid rgba(255,255,255,.05)}
  .debat-col li:last-child{border-bottom:none}
  .debat-col li::before{content:'';position:absolute;left:0;top:16px;width:5px;height:5px;border-radius:50%}
  .debat-col.oui li::before{background:var(--a3)}
  .debat-col.non li::before{background:var(--a4)}
  .debat-col li strong{color:var(--text);font-weight:500}

  /* ─── LEXIQUE ─── */
  .lex-search{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-family:'DM Sans',sans-serif;font-size:.88rem;padding:11px 15px;margin-bottom:14px}
  .lex-search:focus{outline:none;border-color:var(--a1)}
  .lex-search::placeholder{color:var(--text-faint)}
  .lex td:first-child{font-family:'DM Mono',monospace;color:var(--a2);font-weight:500}

  /* ─── SUJETS ─── */
  .sujet{border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:10px;
    background:var(--surface);display:flex;gap:16px;align-items:flex-start;transition:all .2s}
  .sujet:hover{border-color:var(--a4);transform:translateX(4px)}
  .sujet-n{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:900;color:var(--text-faint);line-height:1;flex-shrink:0}
  .sujet-q{font-size:.94rem;line-height:1.6;color:var(--text);margin-bottom:5px;font-weight:400}
  .sujet-h{font-size:.79rem;color:var(--text-dim);line-height:1.55}

  /* ─── À RETENIR ─── */
  .retenir{background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 12%,transparent),rgba(255,255,255,.02));
    border:1px solid color-mix(in srgb,var(--a1) 30%,transparent);border-radius:var(--radius);padding:28px 30px}
  .retenir li{font-size:.93rem;line-height:1.65;color:rgba(232,230,224,.82);
    padding:10px 0 10px 26px;position:relative;list-style:none;border-bottom:1px solid rgba(255,255,255,.06)}
  .retenir li:last-child{border-bottom:none}
  .retenir li::before{content:'✓';position:absolute;left:0;top:9px;color:var(--a1);font-size:.85rem}
  .retenir li strong{color:var(--text);font-weight:500}

  /* ─── PIED DE PAGE ─── */
  footer{text-align:center;padding:36px 40px;border-top:1px solid var(--border);
    font-family:'DM Mono',monospace;font-size:.7rem;color:var(--text-dim);letter-spacing:.14em;
    text-transform:uppercase}

  /* ─── ANIMATION ─── */
  .rev{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
  .rev.vu{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){.rev{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
  :focus-visible{outline:2px solid var(--a1);outline-offset:3px}

  /* ─── RESPONSIVE ─── */
  @media(max-width:1080px){
    .rail{display:none}
    .layout{padding:32px 22px 70px}
    .chrono-mobile{display:block}
  }
  @media(max-width:680px){
    nav{padding:12px 18px;flex-wrap:wrap}
    .breadcrumb{font-size:.7rem;order:3;width:100%}
    .hero{padding:52px 20px 40px}
    .debat{grid-template-columns:1fr}
    .partie-head{gap:14px}
    .partie-num{font-size:2.4rem}
  }
  /* ─── IMPRESSION ─── */
  @media print{
    body{background:#fff;color:#111}
    nav,.rail,#progress,.bg-orb,.nav-right{display:none!important}
    .hero{background:none;border-bottom:2px solid #111;padding:0 0 22px}
    .hero h1,.prose,.liste li,.bloc-title{color:#111}
    .layout{display:block;padding:0}
    .partie,.bloc{break-inside:avoid;page-break-inside:avoid}
    .rev{opacity:1;transform:none}
    .chrono-mobile{display:block!important}
  }
</style>
</head>
<body>

<div id="progress"></div>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<nav>
  <div class="nav-logo" onclick="location.href='../../../index.html'">ECG Prépa</div>
  <div class="breadcrumb">
    <span onclick="location.href='../../../index.html'">Accueil</span>
    <span class="sep">/</span>
    <span onclick="location.href='../../index.html'">2ème Année</span>
    <span class="sep">/</span>
    <span onclick="location.href='../index.html'">Civilisation</span>
    <span class="sep">/</span>
    <span class="current" id="bc-titre">—</span>
  </div>
  <div class="nav-right">
    <button id="ap-btn-fr" class="ap-lang-btn active" onclick="setLang('fr')">🇫🇷 FR</button>
    <button id="ap-btn-es" class="ap-lang-btn" onclick="setLang('es')">🇪🇸 ES</button>
  </div>
</nav>

<header class="hero" id="hero"></header>

<div class="layout">
  <aside class="rail" id="rail"></aside>
  <main id="cours"></main>
</div>

<footer id="ft"></footer>

            es:"Ese veredicto, percibido como una negación de la experiencia de bloqueo traumático bien documentada por la psicología clínica, provoca una <strong>oleada de manifestaciones</strong> en todo el país bajo el lema <em>«No es abuso, es violación»</em>. El caso cristaliza, mucho más allá del asunto concreto, una crítica del derecho penal centrado en la prueba de una resistencia activa de la víctima más que en la <strong>ausencia de consentimiento</strong> —debate que estructurará directamente la reforma legislativa de 2022—. En <strong>junio de 2019</strong>, el Tribunal Supremo recalifica finalmente los hechos como <em>agresión sexual</em> y eleva las penas a 15 años de prisión, validando a posteriori la movilización ciudadana."} }

            fr:"Le <strong>8 mars 2018</strong>, portée par plus de 40 syndicats et organisations féministes, l'Espagne connaît la première <strong>grève féministe générale</strong> de son histoire, associant grève du travail salarié, grève de la consommation et grève des tâches domestiques et de soin (<span class='es'>huelga de cuidados</span>) — une innovation stratégique qui vise à rendre visible le travail invisible traditionnellement assumé par les femmes. Plusieurs millions de personnes défilent dans les grandes villes sous le slogan <em>« Si nosotras paramos, se para el mundo »</em> (« Si nous nous arrêtons, le monde s'arrête »).",
            es:"El <strong>8 de marzo de 2018</strong>, impulsada por más de 40 sindicatos y organizaciones feministas, España vive la primera <strong>huelga feminista general</strong> de su historia, que combina huelga laboral, huelga de consumo y huelga de cuidados —una innovación estratégica destinada a visibilizar el trabajo invisible tradicionalmente asumido por las mujeres—. Varios millones de personas desfilan en las grandes ciudades bajo el lema <em>«Si nosotras paramos, se para el mundo»</em>."} },
          { t:"p", c:{

        blocs:[
          { t:"p", c:{
            fr:"Entrée en vigueur le <strong>6 octobre 2022</strong> sous l'impulsion de la ministre de l'Égalité <strong>Irene Montero</strong> (Podemos/Unidas Podemos), la <strong>loi organique 10/2022</strong>, dite <em>« solo sí es sí »</em>, tire directement les leçons de l'affaire La Manada : elle fusionne les anciennes catégories d'<em>abuso</em> et d'<em>agresión sexual</em> en une catégorie unique, fondée sur l'exigence d'un <strong>consentement explicite</strong> — « seul un oui exprimé librement vaut consentement » —, et non plus sur la preuve d'une résistance ou d'une violence physique de la part de l'agresseur.",
            es:"Entrada en vigor el <strong>6 de octubre de 2022</strong> impulsada por la ministra de Igualdad <strong>Irene Montero</strong> (Podemos/Unidas Podemos), la <strong>Ley Orgánica 10/2022</strong>, llamada <em>«solo sí es sí»</em>, extrae directamente las lecciones del caso La Manada: fusiona las antiguas categorías de <em>abuso</em> y <em>agresión sexual</em> en una categoría única, basada en la exigencia de un <strong>consentimiento explícito</strong> —«solo un sí expresado libremente vale como consentimiento»—, y ya no en la prueba de una resistencia o violencia física por parte del agresor."} },
          { t:"p", c:{
            fr:"Dans les semaines suivant son entrée en vigueur, un <strong>effet technique imprévu</strong> apparaît : en fusionnant les deux anciennes infractions, la loi abaisse dans certains cas les peines minimales et maximales prévues par rapport au texte antérieur, ce qui ouvre, en vertu du principe de <strong>rétroactivité de la loi pénale plus favorable</strong> (garanti par la Constitution), la voie à des demandes de révision de peines déjà prononcées. En quelques mois, plusieurs centaines de condamnations sont révisées à la baisse, et plusieurs dizaines de condamnés — dont certains profils jugés dangereux — sortent de prison de façon anticipée, provoquant une onde de choc politique et médiatique considérable.",
            es:"En las semanas siguientes a su entrada en vigor, aparece un <strong>efecto técnico imprevisto</strong>: al fusionar las dos antiguas infracciones, la ley rebaja en ciertos casos las penas mínimas y máximas previstas respecto al texto anterior, lo que abre, en virtud del principio de <strong>retroactividad de la ley penal más favorable</strong> (garantizado por la Constitución), la vía a solicitudes de revisión de penas ya dictadas. En pocos meses, varios centenares de condenas se revisan a la baja, y varias decenas de condenados —algunos de perfil considerado peligroso— salen de prisión de forma anticipada, provocando una onda de choque política y mediática considerable."} },
          { t:"encadre", icon:"⚠️", c:"var(--a4)",
            titre:{fr:"Erreur fréquente en dissertation", es:"Un error frecuente en el ensayo"},
            c2:{fr:"Ne pas présenter le scandale de 2022-2023 comme un échec du principe du <strong>consentement</strong> lui-même : la controverse porte sur une conséquence <strong>technique et non voulue</strong> de la nouvelle échelle des peines, largement reconnue comme telle par l'ensemble des forces politiques, et non sur la philosophie juridique du texte, dont le principe reste défendu au-delà des clivages partisans habituels. C'est précisément cette distinction qui permettra la réforme correctrice de 2023 sans remise en cause du fondement de la loi.",
                es:"No presentar el escándalo de 2022-2023 como un fracaso del principio del <strong>consentimiento</strong> en sí mismo: la controversia se centra en una consecuencia <strong>técnica y no deseada</strong> de la nueva escala de penas, ampliamente reconocida como tal por el conjunto de las fuerzas políticas, y no en la filosofía jurídica del texto, cuyo principio sigue defendiéndose más allá de las divisiones partidistas habituales. Es precisamente esa distinción la que permitirá la reforma correctora de 2023 sin cuestionar el fundamento de la ley."} },
          { t:"p", c:{
            fr:"Sous la pression de l'opinion publique et malgré les réticences initiales de la ministre Montero, le gouvernement fait adopter, le <strong>25 avril 2023</strong>, une <strong>réforme correctrice</strong> qui réintroduit une gradation des peines selon la gravité des faits — proche, sur ce point technique, de l'ancienne distinction entre <em>abuso</em> et <em>agresión</em> — tout en conservant intact le principe central du consentement explicite. L'épisode illustre la difficulté à traduire une avancée conceptuelle en droit pénal sans effets de bord, et laisse une <strong>cicatrice politique</strong> durable, largement instrumentalisée depuis par les oppositions de droite comme d'extrême droite.",
            es:"Bajo la presión de la opinión pública y pese a las reticencias iniciales de la ministra Montero, el Gobierno logra aprobar, el <strong>25 de abril de 2023</strong>, una <strong>reforma correctora</strong> que reintroduce una gradación de las penas según la gravedad de los hechos —próxima, en ese punto técnico, a la antigua distinción entre <em>abuso</em> y <em>agresión</em>— manteniendo intacto el principio central del consentimiento explícito. El episodio ilustra la dificultad de traducir un avance conceptual en derecho penal sin efectos colaterales, y deja una <strong>cicatriz política</strong> duradera, ampliamente instrumentalizada desde entonces por las oposiciones de derecha y de extrema derecha."} }

      {
        titre:{fr:"La loi trans de 2023 : l'autodétermination de genre et la fracture féministe",
               es:"La ley trans de 2023: la autodeterminación de género y la fractura feminista"},
        blocs:[
          { t:"p", c:{
            fr:"Adoptée le <strong>28 février 2023</strong>, la <strong>loi trans</strong> (LO 4/2023) permet à toute personne majeure, ainsi qu'aux mineurs à partir de 16 ans, de faire modifier la mention de sexe sur son état civil par simple <strong>déclaration</strong>, sans exigence de rapport médical, de diagnostic psychiatrique ni de traitement hormonal préalable — principe dit de l'<em>autodétermination de genre</em>. Ce texte, porté également par Irene Montero, s'inscrit dans une évolution internationale plus large (Argentine, Portugal, plusieurs pays nordiques) vers la dépsychiatrisation des parcours trans.",
            es:"Aprobada el <strong>28 de febrero de 2023</strong>, la <strong>ley trans</strong> (LO 4/2023) permite a cualquier persona mayor de edad, así como a los menores a partir de 16 años, modificar la mención de sexo en su registro civil mediante simple <strong>declaración</strong>, sin exigencia de informe médico, diagnóstico psiquiátrico ni tratamiento hormonal previo —principio llamado de <em>autodeterminación de género</em>. Este texto, impulsado también por Irene Montero, se inscribe en una evolución internacional más amplia (Argentina, Portugal, varios países nórdicos) hacia la despsiquiatrización de los itinerarios trans."} },
          { t:"p", c:{
            fr:"La loi provoque une <strong>fracture inédite</strong> au sein même de la gauche et du mouvement féministe espagnol. Une partie du féminisme, dit parfois <em>féminisme radical</em> ou <em>gender-critical</em>, redoute que l'autodétermination ne fragilise des catégories juridiques — les espaces non mixtes, les statistiques de violence machiste, certaines compétitions sportives — construites sur la base du sexe biologique. Cette opposition traverse le PSOE lui-même, où plusieurs figures historiques, dont l'ancienne vice-présidente <strong>Carmen Calvo</strong>, expriment publiquement leurs réserves, provoquant des tensions durables entre le PSOE et son partenaire de coalition Podemos/Sumar sur ce dossier.",
            es:"La ley provoca una <strong>fractura inédita</strong> dentro de la propia izquierda y del movimiento feminista español. Una parte del feminismo, a veces llamado <em>feminismo radical</em> o <em>gender-critical</em>, teme que la autodeterminación fragilice categorías jurídicas —los espacios no mixtos, las estadísticas de violencia machista, ciertas competiciones deportivas— construidas sobre la base del sexo biológico. Esta oposición atraviesa al propio PSOE, donde varias figuras históricas, entre ellas la exvicepresidenta <strong>Carmen Calvo</strong>, expresan públicamente sus reservas, provocando tensiones duraderas entre el PSOE y su socio de coalición Podemos/Sumar en este expediente."} },
          { t:"def", mot:{fr:"Autodeterminación de género",es:"Autodeterminación de género"},
            c:{fr:"Principe selon lequel le changement de la mention de sexe à l'état civil relève d'une décision personnelle librement exprimée, sans validation médicale ou judiciaire préalable. Il s'oppose aux régimes antérieurs, fondés sur un diagnostic de « dysphorie de genre » et un parcours médical encadré.",
               es:"Principio según el cual el cambio de la mención de sexo en el registro civil corresponde a una decisión personal libremente expresada, sin validación médica o judicial previa. Se opone a los regímenes anteriores, basados en un diagnóstico de «disforia de género» y un itinerario médico pautado."} }
        ]

        blocs:[
          { t:"p", c:{
            fr:"Depuis son entrée au Congrès en 2019 (voir chapitre 09), <strong>Vox</strong> conteste frontalement le cadre juridique de 2004, qu'il qualifie d'« idéologie de genre » : le parti propose de remplacer la <em>Ley de Violencia de Género</em> par une <strong>« loi de violence intrafamiliale »</strong> neutre du point de vue du sexe des auteurs et des victimes, et de supprimer les tribunaux spécialisés créés en 2004, arguments qu'il présente comme une défense de l'égalité formelle devant la loi contre ce qu'il perçoit comme une discrimination fondée sur le sexe de l'accusé.",
            es:"Desde su entrada en el Congreso en 2019 (ver capítulo 09), <strong>Vox</strong> impugna frontalmente el marco jurídico de 2004, que califica de «ideología de género»: el partido propone sustituir la <em>Ley de Violencia de Género</em> por una <strong>«ley de violencia intrafamiliar»</strong> neutra respecto al sexo de autores y víctimas, y suprimir los juzgados especializados creados en 2004, argumentos que presenta como una defensa de la igualdad formal ante la ley frente a lo que percibe como una discriminación basada en el sexo del acusado."} },
          { t:"p", c:{
            fr:"Cette contestation, longtemps cantonnée au débat national, s'est traduite depuis <strong>2021-2023</strong> par des effets concrets dans plusieurs communautés autonomes où le PP a formé une coalition ou obtenu le soutien parlementaire de Vox : suppression ou fusion d'organismes régionaux d'égalité, retrait du terme « genre » de certains intitulés administratifs, réduction de subventions à des associations féministes, sans toutefois que le cadre pénal national de 2004 — de compétence exclusivement étatique — ne soit lui-même modifié. Cette tension entre un <strong>consensus national</strong> globalement maintenu au niveau législatif et une <strong>contestation régionale</strong> croissante illustre, sur ce terrain comme sur d'autres (voir chapitres 06 et 07), la manière dont la fragmentation politique espagnole déplace certains combats du Parlement national vers l'échelon autonomique.",
            es:"Esta impugnación, largo tiempo confinada al debate nacional, se ha traducido desde <strong>2021-2023</strong> en efectos concretos en varias comunidades autónomas donde el PP ha formado coalición u obtenido el apoyo parlamentario de Vox: supresión o fusión de organismos regionales de igualdad, retirada del término «género» de ciertos nombres administrativos, reducción de subvenciones a asociaciones feministas, sin que sin embargo el marco penal nacional de 2004 —de competencia exclusivamente estatal— se vea él mismo modificado. Esta tensión entre un <strong>consenso nacional</strong> globalmente mantenido a nivel legislativo y una <strong>impugnación regional</strong> creciente ilustra, en este terreno como en otros (ver capítulos 06 y 07), la manera en que la fragmentación política española desplaza ciertos combates del Parlamento nacional hacia el ámbito autonómico."} },
          { t:"p", c:{
            fr:"Le mouvement féministe espagnol se trouve ainsi, au milieu des années 2020, dans une situation paradoxale : doté d'un arsenal juridique parmi les plus complets d'Europe et d'une capacité de mobilisation de rue toujours vive lors de chaque 8 mars, il doit dans le même temps défendre ce même arsenal contre une contestation politique organisée, tout en gérant des <strong>divisions internes</strong> inédites sur la question trans — un double front qui rend plus difficile qu'au moment du 8M de 2018 l'affichage d'une unité revendicative sans faille.",
            es:"El movimiento feminista español se encuentra así, a mediados de la década de 2020, en una situación paradójica: dotado de un arsenal jurídico entre los más completos de Europa y de una capacidad de movilización callejera siempre viva en cada 8 de marzo, debe al mismo tiempo defender ese mismo arsenal frente a una impugnación política organizada, gestionando a la vez <strong>divisiones internas</strong> inéditas sobre la cuestión trans — un doble frente que dificulta, más que en el momento del 8M de 2018, mostrar una unidad reivindicativa sin fisuras."} }

    synthese: {fr:"Le débat oppose une lecture <em>structurelle</em>, pour qui la loi doit reconnaître juridiquement des rapports de pouvoir inégaux entre groupes sociaux, à une lecture <em>individualiste</em>, pour qui le droit pénal doit traiter chaque acte indépendamment du sexe de ses protagonistes. Les données disponibles sur l'ampleur et la gravité différenciées de la violence conjugale selon le sexe de l'auteur alimentent le premier camp ; les principes généraux d'égalité formelle devant la loi, le second. Vingt ans après son adoption, la loi de 2004 reste un <strong>cas rare</strong> de consensus législatif national qui n'a jamais été remis en cause au niveau des Cortes, tout en devenant, à l'échelon régional, l'un des marqueurs politiques les plus clivants de la période récente.",
               es:"El debate enfrenta una lectura <em>estructural</em>, para la que la ley debe reconocer jurídicamente relaciones de poder desiguales entre grupos sociales, con una lectura <em>individualista</em>, para la que el derecho penal debe tratar cada acto con independencia del sexo de sus protagonistas. Los datos disponibles sobre la magnitud y gravedad diferenciadas de la violencia conyugal según el sexo del autor alimentan al primer bando; los principios generales de igualdad formal ante la ley, al segundo. Veinte años después de su aprobación, la ley de 2004 sigue siendo un <strong>caso raro</strong> de consenso legislativo nacional que nunca ha sido cuestionado a nivel de las Cortes, al tiempo que se convierte, a escala regional, en uno de los marcadores políticos más divisivos del periodo reciente."}
  },

  /* ─── 7. LEXIQUE BILINGUE ─────────────────────────────────────────── */
  lexique: [

    { es:"Violencia doméstica", fr:"Toute violence intrafamiliale, quel que soit le sexe de l'auteur ou de la victime, catégorie plus large que la violencia de género." },
    { es:"Juzgado de Violencia sobre la Mujer", fr:"Tribunal spécialisé créé en 2004, compétent au pénal et au civil pour les affaires liées à la violence de genre." },
    { es:"La Manada", fr:"Agression sexuelle collective de Pampelune (2016) dont le jugement initial trop clément déclenche une mobilisation nationale en 2018." },
    { es:"Huelga feminista", fr:"Grève féministe, notamment celle du 8 mars 2018, combinant arrêt du travail salarié, de la consommation et des tâches domestiques." },
    { es:"8M", fr:"Journée internationale des droits des femmes (8 mars), devenue en Espagne un rendez-vous de mobilisation politique majeure depuis 2018." },
    { es:"Ley del solo sí es sí", fr:"Loi de 2022 fondant les infractions sexuelles sur l'absence de consentement explicite, entachée d'un scandale de remises de peine." },
    { es:"Consentimiento explícito", fr:"Principe juridique selon lequel seul un accord librement exprimé vaut consentement, au cœur de la réforme de 2022." },

    { es:"Autodeterminación de género", fr:"Principe permettant le changement de sexe à l'état civil par simple déclaration personnelle." },
    { es:"Feminismo gender-critical", fr:"Courant féministe critique envers l'autodétermination de genre, craignant une fragilisation des catégories fondées sur le sexe biologique." },
    { es:"Ideología de género", fr:"Expression polémique employée par Vox pour désigner et contester l'ensemble des politiques publiques d'égalité et de lutte contre les violences machistes." },
    { es:"Pulsera antimaltrato", fr:"Bracelet électronique de télésurveillance imposé à certains agresseurs condamnés pour violence de genre." },
    { es:"Ley de Igualdad (2007)", fr:"Loi organique de 2007 instaurant quotas, congés de paternité et plans d'égalité en entreprise." }

  /* ─── 8. SUJETS POSSIBLES ─────────────────────────────────────────── */
  sujets: [
    { q:{fr:"Comment expliquer que l'Espagne se soit dotée, dès 2004, d'un cadre juridique pionnier contre la violence de genre ?",
         es:"¿Cómo explicar que España se dotara, ya en 2004, de un marco jurídico pionero contra la violencia de género?"},
      h:{fr:"Relier le contexte de consensus politique de 2004 à l'héritage spécifique du franquisme sur le statut légal des femmes.",
         es:"Relacionar el contexto de consenso político de 2004 con el legado específico del franquismo sobre el estatuto legal de las mujeres."} },
    { q:{fr:"L'affaire La Manada a-t-elle transformé le droit pénal espagnol en matière d'agressions sexuelles ?",
         es:"¿Transformó el caso La Manada el derecho penal español en materia de agresiones sexuales?"},
      h:{fr:"Retracer le lien direct entre la mobilisation de 2018 et l'introduction du critère du consentement explicite dans la loi de 2022.",
         es:"Trazar el vínculo directo entre la movilización de 2018 y la introducción del criterio del consentimiento explícito en la ley de 2022."} },
    { q:{fr:"Le scandale des remises de peine de 2022-2023 remet-il en cause le principe du consentement dans le droit pénal ?",
         es:"¿Cuestiona el escándalo de las rebajas de pena de 2022-2023 el principio del consentimiento en el derecho penal?"},
      h:{fr:"Distinguer clairement l'effet technique imprévu de la nouvelle échelle des peines et le principe juridique du consentement lui-même.",
         es:"Distinguir claramente el efecto técnico imprevisto de la nueva escala de penas y el principio jurídico del consentimiento en sí mismo."} },

      h:{fr:"Analyser les positions divergentes au sein même de la gauche, entre Podemos/Sumar et certains secteurs du PSOE.",

    ],

      "El <strong>permiso marital</strong> mantiene a las mujeres casadas bajo tutela legal hasta 1975, explicando el vigor del feminismo posfranquista.",
      "La <strong>Ley Orgánica 1/2004</strong> convierte a España en pionera europea contra la violencia de género, con juzgados especializados y agravantes penales.",
      "El caso <strong>La Manada</strong> (2016-2019) desencadena una movilización masiva y prepara el terreno para la reforma del consentimiento de 2022.",
      "El <strong>8 de marzo de 2018</strong> marca la primera huelga feminista general de la historia española, instalando de forma duradera el 8M como cita política.",
      "La ley del <strong>«solo sí es sí»</strong> (2022) basa los delitos sexuales en el consentimiento explícito, pero su fallo técnico provoca un escándalo corregido en 2023.",
      "La <strong>ley trans</strong> de 2023 instaura la autodeterminación de género, fracturando al movimiento feminista y a la propia izquierda.",

    ]
  }
};

<script>
/* ─── Utilitaires ─── */
const $ = (s,r=document)=>r.querySelector(s);
let LANG = 'fr';
/* T() : renvoie la version dans la langue courante, ou la valeur telle quelle */
const T = v => (v && typeof v==='object' && !Array.isArray(v) && ('fr' in v||'es' in v)) ? (v[LANG] ?? v.fr) : v;

/* ─── Libellés d'interface ─── */
const UI = {
  fr:{ chrono:"Chronologie",
       essentiel:"L'essentiel", reperes:"Repères", quiEstQui:"Qui est qui", acteurs:"Acteurs clés",
       controverse:"Controverse", vocab:"Vocabulaire", lexique:"Lexique bilingue",
       filtrer:"Filtrer le lexique…", terme:"Terme", trad:"Traduction / usage",
       entrainement:"Entraînement", sujets:"Sujets possibles", memoriser:"Mémoriser",
       retenir:"À retenir", synthese:"Synthèse", chapitre:"Chapitre" },
  es:{ chrono:"Cronología",
       essentiel:"Lo esencial", reperes:"Hitos", quiEstQui:"Quién es quién", acteurs:"Actores clave",
       controverse:"Controversia", vocab:"Vocabulario", lexique:"Glosario bilingüe",
       filtrer:"Filtrar el glosario…", terme:"Término", trad:"Traducción / uso",
       entrainement:"Entrenamiento", sujets:"Posibles temas", memoriser:"Memorizar",
       retenir:"Para recordar", synthese:"Síntesis", chapitre:"Capítulo" }
};
const t = k => UI[LANG][k];

/* ─── Rendu des blocs de contenu ─── */
function bloc(b){
  switch(b.t){
    case 'p':      return `<p class="prose">${T(b.c)}</p>`;
    case 'liste':  return `<ul class="liste">${T(b.items).map(i=>`<li>${i}</li>`).join('')}</ul>`;
    case 'faits':  return `<div class="faits">${T(b.items).map(i=>
                     `<div class="fait"><div class="fait-l">${T(i.l)}</div><div class="fait-v">${T(i.v)}</div></div>`).join('')}</div>`;
    case 'stats':  return `<div class="stats">${b.items.map(i=>
                     `<div class="stat" style="--c:${i.c||'var(--a1)'}"><span class="stat-n">${T(i.n)}</span><span class="stat-d">${T(i.d)}</span></div>`).join('')}</div>`;
    case 'citation':return `<blockquote class="citation"><p>« ${T(b.c)} »</p><cite>${T(b.src)}</cite></blockquote>`;
    case 'encadre':return `<div class="encadre" style="--c:${b.c||'var(--a2)'}"><div class="encadre-ic">${b.icon||'💡'}</div>
                     <div><div class="encadre-t">${T(b.titre)}</div><div class="encadre-c">${T(b.c2)}</div></div></div>`;
    case 'def':    return `<div class="def"><div class="def-mot">${T(b.mot)}</div><div class="def-c">${T(b.c)}</div></div>`;
    case 'tableau':return `<div class="tbl-wrap"><table><thead><tr>${T(b.head).map(h=>`<th>${h}</th>`).join('')}</tr></thead>
                     <tbody>${T(b.rows).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tl':     return `<div class="tl">${T(b.items).map(i=>
                     `<div class="tl-item"><div class="tl-d">${T(i.d)}</div><div class="tl-c">${T(i.c)}</div></div>`).join('')}</div>`;
    default:       return '';
  }
}

/* ─── En-tête ─── */
function rendreHero(){
  const m = COURS.meta;
  document.documentElement.dataset.theme = m.theme;
  document.documentElement.lang = LANG;
  document.title = T(m.titre) + ' — Civilisation';
  $('#bc-titre').textContent = m.titre.fr ?? m.titre;   // la nav reste en français
  $('#ft').textContent = `${t('chapitre')} ${m.chapitre}${LANG==='fr'?' : ':': '}${T(m.titre)}`;
  $('#hero').innerHTML = `
    <span class="hero-flag">${m.drapeau}</span>
    <div class="hero-label">${T(m.label)}</div>
    <h1>${T(m.titre).replace(/&/g, '<span style="font-family:\'DM Sans\', sans-serif; font-style: normal;">&</span>')}</h1>
    <p class="hero-sub">${T(m.sousTitre)}</p>`;
}

/* ─── Corps du cours ─── */
function rendreCours(){
  const c = COURS, out = [];

  out.push(`<section class="bloc rev" id="s-essentiel">
    <div class="essentiel"><div class="essentiel-label">${t('essentiel')}</div><p>${T(c.essentiel)}</p></div>
    <div class="stats">${c.chiffres.map((x,i)=>
      `<div class="stat" style="--c:var(--a${(i%4)+1})"><span class="stat-n">${T(x.n)}</span><span class="stat-d">${T(x.d)}</span></div>`).join('')}</div>
  </section>`);

  if(c.chronologie?.length){
    out.push(`<section class="bloc rev chrono-mobile" id="s-chrono">
      <div class="bloc-head"><span class="bloc-kicker">${t('reperes')}</span><h2 class="bloc-title">${t('chrono')}</h2></div>
      ${bloc({t:'tl',items:c.chronologie})}</section>`);
  }

  c.parties.forEach((p,pi)=>{
    let html = `<section class="partie rev" id="p-${pi}" style="--p:${p.couleur}">
      <div class="partie-head"><div class="partie-num">${p.num}</div>
      <div><div class="partie-kicker">${T(p.kicker)}</div><h2 class="partie-title">${T(p.titre)}</h2></div></div>`;
    p.sections.forEach((s,si)=>{
      html += `<div class="section" id="p-${pi}-${si}"><h3 class="section-title"><span class="section-num">${si+1}.</span> ${T(s.titre)}</h3>
        ${s.blocs.map(bloc).join('')}</div>`;
    });
    out.push(html+`</section>`);
  });

  if(c.acteurs?.length){
    out.push(`<section class="bloc rev" id="s-acteurs">
      <div class="bloc-head"><span class="bloc-kicker">${t('quiEstQui')}</span><h2 class="bloc-title">${t('acteurs')}</h2></div>
      <div class="acteurs">${c.acteurs.map(a=>
        `<div class="acteur" style="--c:${a.c}"><div class="acteur-nom">${a.nom}</div>
         <div class="acteur-role">${T(a.role)}</div><div class="acteur-c">${T(a.d)}</div></div>`).join('')}</div></section>`);
  }

  if(c.debat){
    out.push(`<section class="bloc rev" id="s-debat">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a4)">${t('controverse')}</span>
      <h2 class="bloc-title">${T(c.debat.question)}</h2></div>
      <div class="debat">
        <div class="debat-col oui"><div class="debat-t">${T(c.debat.oui.titre)}</div>
          <ul>${T(c.debat.oui.items).map(i=>`<li>${i}</li>`).join('')}</ul></div>
        <div class="debat-col non"><div class="debat-t">${T(c.debat.non.titre)}</div>
          <ul>${T(c.debat.non.items).map(i=>`<li>${i}</li>`).join('')}</ul></div>
      </div>
      ${c.debat.synthese?`<div class="encadre" style="--c:var(--a1);margin-top:14px">
        <div class="encadre-ic">⚖️</div><div><div class="encadre-t">${t('synthese')}</div>
        <div class="encadre-c">${T(c.debat.synthese)}</div></div></div>`:''}
    </section>`);
  }

  if(c.lexique?.length){
    out.push(`<section class="bloc rev" id="s-lexique">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a2)">${t('vocab')}</span>
      <h2 class="bloc-title">${t('lexique')}</h2></div>
      <input class="lex-search" id="lex-search" placeholder="${t('filtrer')}" aria-label="${t('filtrer')}">
      <div class="tbl-wrap"><table class="lex"><thead><tr><th>${t('terme')}</th><th>${t('trad')}</th></tr></thead>
      <tbody id="lex-body">${c.lexique.map(l=>`<tr><td>${l.es}</td><td>${l.fr}</td></tr>`).join('')}</tbody></table></div>
    </section>`);
  }

  if(c.sujets?.length){
    out.push(`<section class="bloc rev" id="s-sujets">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a4)">${t('entrainement')}</span>
      <h2 class="bloc-title">${t('sujets')}</h2></div>
      ${c.sujets.map((s,i)=>`<div class="sujet"><div class="sujet-n">${String(i+1).padStart(2,'0')}</div>
        <div><div class="sujet-q">${T(s.q)}</div><div class="sujet-h">${T(s.h)}</div></div></div>`).join('')}</section>`);
  }

  if(c.retenir?.length){
    out.push(`<section class="bloc rev" id="s-retenir">
      <div class="bloc-head"><span class="bloc-kicker">${t('memoriser')}</span><h2 class="bloc-title">${t('retenir')}</h2></div>
      <div class="retenir"><ul>${T(c.retenir).map(r=>`<li>${r}</li>`).join('')}</ul></div></section>`);
  }

  $('#cours').innerHTML = out.join('');
}

/* ─── Colonne chronologie ─── */
function rendreRail(){
  if(!COURS.chronologie?.length){ $('#rail')?.remove(); return; }
  $('#rail').innerHTML = `<div class="rail-title">${t('chrono')}</div>${bloc({t:'tl',items:COURS.chronologie})}`;
}

/* ─── Recherche dans le lexique ─── */
function brancherLexique(){
  const ls = $('#lex-search'); if(!ls) return;
  ls.addEventListener('input', ()=>{
    const q = ls.value.toLowerCase().trim();
    $('#lex-body').querySelectorAll('tr').forEach(tr=>{
      tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
}

/* ─── Changement de langue ─── */
function setLang(lang){
  LANG = lang;
  $('#ap-btn-fr').classList.toggle('active', lang==='fr');
  $('#ap-btn-es').classList.toggle('active', lang==='es');
  rendreHero(); rendreCours(); rendreRail();
  document.querySelectorAll('.rev').forEach(el=>el.classList.add('vu'));
  brancherLexique();
}

/* ─── Démarrage ─── */
function demarrer(){
  rendreHero(); rendreCours(); rendreRail(); brancherLexique();

  const maj = ()=>{
    const h = document.body.scrollHeight - innerHeight;
    $('#progress').style.width = (h>0 ? (scrollY/h)*100 : 0) + '%';
  };
  addEventListener('scroll', maj, {passive:true}); maj();

  if(!('IntersectionObserver' in window)){
    document.querySelectorAll('.rev').forEach(el=>el.classList.add('vu'));
    return;
  }
  const io = new IntersectionObserver(es=>es.forEach(x=>{
    if(x.isIntersecting){ x.target.classList.add('vu'); io.unobserve(x.target); }
  }), {threshold:.06});
  document.querySelectorAll('.rev').forEach(el=>io.observe(el));
}

demarrer();
</script>
</body>
