<!DOCTYPE html>
<html lang="fr" data-theme="espagnol3">
<head>
<script src="../../auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tourisme de masse — Civilisation Hispanophone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- ══════════════════════════════════════════════════════════════════════
     TEMPLATE UNIVERSEL DE COURS DE CIVILISATION — v1
     Pour créer un nouveau cours : dupliquer ce fichier, ne modifier QUE
     le bloc de données (id="donnees") tout en bas. Rien d'autre à toucher.
     ══════════════════════════════════════════════════════════════════════ -->

<style>
  /* ─── PALETTE DE BASE (identique au site) ─── */
  :root{
    --bg:#0d0d0f; --surface:#16161a; --surface2:#1e1e24; --border:#2a2a35;
    --text:#e8e6e0; --text-dim:#8a8880; --text-faint:#4a4845;
    --radius:14px;
  }
  /* ─── THÈMES PAR LANGUE — change data-theme sur <html> ─── */
  html[data-theme="anglais"] { --a1:#c8a96e; --a2:#7c9ec9; --a3:#9ecba0; --a4:#c97c9e; --hero:#16233d; }
  html[data-theme="anglais2"] { --a1:#c9633f; --a2:#5b8f6f; --a3:#6c8fc7; --a4:#a06bb0; --hero:#16241b; }
  html[data-theme="espagnol"]{ --a1:#e0a93e; --a2:#c8553d; --a3:#7fae7a; --a4:#b06fa8; --hero:#3a1a18; }
  html[data-theme="espagnol3"]{ --a1:#c9a24a; --a2:#4d7ea8; --a3:#5aa88f; --a4:#a85a6b; --hero:#101c2c; }
  html[data-theme="espagnol4"]{ --a1:#a98ac9; --a2:#6fa89b; --a3:#cf8f5e; --a4:#c26a8e; --hero:#221a2c; }
  html[data-theme="espagnol5"]{ --a1:#4fae94; --a2:#c98a4b; --a3:#8f9ec9; --a4:#c0566f; --hero:#10251f; }
  html[data-theme="espagnol6"]{ --a1:#5b9bd5; --a2:#d9a441; --a3:#7bb37a; --a4:#b0566e; --hero:#132436; }
  html[data-theme="espagnol7"]{ --a1:#e0954f; --a2:#5f9ea6; --a3:#a878c9; --a4:#b5495b; --hero:#2b1c14; }
  html[data-theme="espagnol8"]{ --a1:#d4534f; --a2:#4f9d8f; --a3:#e0b04a; --a4:#8f5fa8; --hero:#2a1416; }
  html[data-theme="espagnol9"]{ --a1:#3f9e8f; --a2:#d4914a; --a3:#5a8fc7; --a4:#c25b5b; --hero:#142a28; }
  html[data-theme="espagnol10"]{ --a1:#a8447a; --a2:#4a8f7e; --a3:#e0a13e; --a4:#7a5ba8; --hero:#2a1224; }
  html[data-theme="espagnol11"]{ --a1:#c25a3f; --a2:#4a7a9d; --a3:#8f9550; --a4:#a34b6e; --hero:#241c16; }
  html[data-theme="espagnol12"]{ --a1:#2b9bb0; --a2:#e0954a; --a3:#4a8fc7; --a4:#c2564f; --hero:#0f2733; }
  html[data-theme="allemand"]{ --a1:#d8b44a; --a2:#8fa4bd; --a3:#84b58e; --a4:#c06060; --hero:#241f1a; }
  html[data-theme="italien"] { --a1:#d5a94e; --a2:#6fae8f; --a3:#a8c07a; --a4:#c4695e; --hero:#152a24; }
  html[data-theme="chinois"] { --a1:#d9a441; --a2:#c05a4a; --a3:#83a98f; --a4:#a97fb0; --hero:#2c1618; }

  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;overflow-x:hidden}

  /* ─── FOND ─── */
  .bg-orb{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;opacity:.08;z-index:0}
  .orb1{width:700px;height:700px;background:var(--a1);top:-300px;right:-250px}
  .orb2{width:600px;height:600px;background:var(--a2);bottom:-250px;left:-250px}

  /* ─── BARRE DE PROGRESSION ─── */
  #progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:200;
    background:linear-gradient(90deg,var(--a1),var(--a2),var(--a4));transition:width .1s linear}

  /* ─── NAV ─── */
  nav{display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding:16px 40px;border-bottom:1px solid var(--border);
    background:rgba(13,13,15,.9);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100}
  .nav-logo{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;color:var(--a1);cursor:pointer}
  .breadcrumb{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--text-dim);flex-wrap:wrap}
  .breadcrumb span{cursor:pointer;transition:color .2s}
  .breadcrumb span:hover{color:var(--a1)}
  .breadcrumb .sep{color:var(--text-faint);cursor:default}
  .breadcrumb .current{color:var(--text);cursor:default}
  .nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .ap-lang-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    color:rgba(255,255,255,.6);font-family:'DM Mono',monospace;font-size:10px;font-weight:700;
    letter-spacing:.12em;padding:5px 14px;border-radius:4px;cursor:pointer;transition:all .2s;text-transform:uppercase}
  .ap-lang-btn.active{background:var(--a1);border-color:var(--a1);color:#12100c}
  .ap-lang-btn:hover:not(.active){background:rgba(255,255,255,.15);color:#fff}

  /* ─── HERO ─── */
  .hero{position:relative;z-index:1;padding:76px 40px 56px;text-align:center;overflow:hidden;
    background:linear-gradient(160deg,var(--hero),#0d0d0f 85%);border-bottom:1px solid var(--border)}
  .hero::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
    width:80px;height:2px;background:var(--a1)}
  .hero-flag{font-size:2.6rem;line-height:1;margin-bottom:18px;display:block}
  .hero-label{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.3em;
    text-transform:uppercase;color:var(--a1);margin-bottom:18px}
  .hero h1{font-family:'Playfair Display',serif;font-weight:900;line-height:1.05;
    font-size:clamp(2.4rem,6vw,4.6rem);max-width:900px;margin:0 auto 18px}
  .hero-sub{font-size:1rem;color:var(--text-dim);max-width:640px;margin:0 auto;line-height:1.6}

  /* ─── LAYOUT ─── */
  .layout{display:flex;gap:48px;max-width:1320px;margin:0 auto;padding:48px 40px 100px;position:relative;z-index:1}
  main{flex:1;min-width:0;max-width:840px}

  /* ─── COLONNE CHRONOLOGIE ─── */
  .rail{width:262px;flex-shrink:0;position:sticky;top:88px;align-self:flex-start;
    max-height:calc(100vh - 118px);overflow-y:auto;padding-right:8px}
  .rail-title{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;
    color:var(--a1);margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border)}
  .rail .tl{padding-left:20px;margin:0 0 0 4px}
  .rail .tl-item{padding-bottom:16px}
  .rail .tl-item::before{left:-26px;top:4px;width:7px;height:7px}
  .rail .tl-d{font-size:.66rem;letter-spacing:.08em}
  .rail .tl-c{font-size:.79rem;line-height:1.5}
  .rail::-webkit-scrollbar{width:3px}
  .rail::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .chrono-mobile{display:none}

  /* ─── BLOC GÉNÉRIQUE ─── */
  .bloc{margin-bottom:64px;scroll-margin-top:88px}
  .bloc-head{display:flex;align-items:baseline;gap:14px;margin-bottom:24px;
    padding-bottom:12px;border-bottom:1px solid var(--border)}
  .bloc-kicker{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--k,var(--a1))}
  .bloc-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--text)}

  /* ─── L'ESSENTIEL ─── */
  .essentiel{background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    border:1px solid var(--border);border-left:3px solid var(--a1);border-radius:var(--radius);
    padding:28px 30px;margin-bottom:36px}
  .essentiel-label{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--a1);margin-bottom:14px}
  .essentiel p{font-size:.98rem;line-height:1.75;color:var(--text);margin-bottom:0}
  .essentiel p strong{color:var(--a1);font-weight:500}

  /* ─── STATS ─── */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0}
  .stat{border-radius:10px;padding:18px 16px;text-align:center;border:1px solid rgba(255,255,255,.08);
    background:linear-gradient(135deg,color-mix(in srgb,var(--c,var(--a1)) 26%,#101014),
    color-mix(in srgb,var(--c,var(--a1)) 8%,#101014))}
  .stat-n{font-family:'DM Mono',monospace;font-size:1.5rem;font-weight:500;color:var(--text);display:block;line-height:1.1}
  .stat-d{font-size:.7rem;color:var(--text-dim);margin-top:7px;display:block;line-height:1.45}

  /* ─── PARTIES ─── */
  .partie{margin-bottom:78px;scroll-margin-top:88px}
  .partie-head{display:flex;align-items:center;gap:22px;margin-bottom:34px;
    padding-bottom:18px;border-bottom:2px solid var(--p)}
  .partie-num{font-family:'Playfair Display',serif;font-size:3.4rem;font-weight:900;
    color:var(--p);opacity:.35;line-height:.9;flex-shrink:0}
  .partie-title{font-family:'Playfair Display',serif;font-size:clamp(1.35rem,3vw,1.95rem);
    font-weight:700;line-height:1.2}
  .partie-kicker{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.24em;
    text-transform:uppercase;color:var(--p);margin-bottom:6px}

  .section{margin-bottom:44px;scroll-margin-top:88px}
  .section-title{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;
    color:var(--text);margin-bottom:18px;padding-left:16px;border-left:3px solid var(--p)}
  .section-num{color:var(--p);font-weight:900}

  /* ─── TEXTE ─── */
  .prose{font-size:.96rem;line-height:1.8;color:rgba(232,230,224,.78);margin-bottom:16px}
  .prose strong{color:var(--text);font-weight:500}
  .prose em{color:var(--p,var(--a1));font-style:normal;font-weight:500}
  .es{font-family:'DM Mono',monospace;font-size:.86em;color:var(--a2)}

  /* ─── LISTE ─── */
  .liste{list-style:none;margin:14px 0 20px}
  .liste li{font-size:.93rem;line-height:1.65;color:rgba(232,230,224,.75);
    padding:9px 0 9px 22px;position:relative;border-bottom:1px solid rgba(255,255,255,.05)}
  .liste li:last-child{border-bottom:none}
  .liste li::before{content:'';position:absolute;left:0;top:17px;width:6px;height:6px;
    border-radius:50%;background:var(--p,var(--a1))}
  .liste li strong{color:var(--text);font-weight:500}

  /* ─── FAITS CLÉS ─── */
  .faits{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;margin:20px 0}
  .fait{background:rgba(255,255,255,.03);border:1px solid var(--border);
    border-left:3px solid var(--p,var(--a1));border-radius:8px;padding:13px 15px}
  .fait-l{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--text-faint);
    text-transform:uppercase;letter-spacing:.14em;margin-bottom:5px}
  .fait-v{font-size:.86rem;font-weight:500;color:var(--text);line-height:1.4}

  /* ─── CITATION ─── */
  .citation{background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
    border:1px solid var(--border);border-left:3px solid var(--a1);border-radius:0 10px 10px 0;
    padding:20px 24px;margin:22px 0}
  .citation p{font-family:'Playfair Display',serif;font-style:italic;font-size:1.02rem;
    line-height:1.6;color:var(--text);margin-bottom:9px}
  .citation cite{font-family:'DM Mono',monospace;font-size:.66rem;letter-spacing:.08em;
    color:var(--a1);font-style:normal}

  /* ─── ENCADRÉ ─── */
  .encadre{display:flex;gap:15px;align-items:flex-start;border-radius:10px;padding:17px 20px;margin:20px 0;
    background:color-mix(in srgb,var(--c,var(--a2)) 7%,transparent);
    border:1px solid color-mix(in srgb,var(--c,var(--a2)) 26%,transparent)}
  .encadre-ic{font-size:1.5rem;flex-shrink:0;line-height:1.2}
  .encadre-t{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.2em;
    text-transform:uppercase;color:var(--c,var(--a2));margin-bottom:7px;font-weight:500}
  .encadre-c{font-size:.89rem;line-height:1.7;color:rgba(232,230,224,.75)}
  .encadre-c strong{color:var(--text);font-weight:500}

  /* ─── DÉFINITION ─── */
  .def{border:1px dashed var(--border);border-radius:10px;padding:15px 18px;margin:18px 0;
    background:rgba(255,255,255,.02)}
  .def-mot{font-family:'Playfair Display',serif;font-weight:700;font-size:1rem;color:var(--a3);margin-bottom:6px}
  .def-c{font-size:.88rem;line-height:1.7;color:rgba(232,230,224,.72)}

  /* ─── TABLEAU ─── */
  .tbl-wrap{overflow-x:auto;margin:20px 0;border:1px solid var(--border);border-radius:10px}
  table{width:100%;border-collapse:collapse;font-size:.83rem}
  thead{background:rgba(255,255,255,.04)}
  thead th{padding:11px 15px;text-align:left;font-family:'DM Mono',monospace;font-size:.6rem;
    letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap}
  tbody tr{border-top:1px solid var(--border)}
  tbody tr:nth-child(even){background:rgba(255,255,255,.015)}
  tbody td{padding:11px 15px;color:rgba(232,230,224,.75);line-height:1.5}
  tbody td:first-child{color:var(--text);font-weight:500}

  /* ─── CHRONOLOGIE ─── */
  .tl{border-left:2px solid var(--border);padding-left:26px;margin:8px 0 8px 6px}
  .tl-item{position:relative;padding-bottom:22px}
  .tl-item:last-child{padding-bottom:0}
  .tl-item::before{content:'';position:absolute;left:-33px;top:5px;width:9px;height:9px;border-radius:50%;
    background:var(--c,var(--a1));box-shadow:0 0 0 3px rgba(13,13,15,1),0 0 0 5px color-mix(in srgb,var(--c,var(--a1)) 35%,transparent)}
  .tl-d{font-family:'DM Mono',monospace;font-size:.72rem;font-weight:500;letter-spacing:.1em;
    color:var(--c,var(--a1));margin-bottom:4px}
  .tl-c{font-size:.9rem;line-height:1.6;color:rgba(232,230,224,.75)}
  .tl-c strong{color:var(--text);font-weight:500}

  /* ─── ACTEURS ─── */
  .acteurs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .acteur{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;
    transition:all .25s;position:relative;overflow:hidden}
  .acteur:hover{border-color:var(--c,var(--a1));transform:translateY(-3px);background:var(--surface2)}
  .acteur-nom{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;margin-bottom:3px}
  .acteur-role{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--c,var(--a1));margin-bottom:10px}
  .acteur-c{font-size:.82rem;line-height:1.6;color:var(--text-dim)}

  /* ─── DÉBAT ─── */
  .debat{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .debat-col{border:1px solid var(--border);border-radius:12px;padding:20px 22px;background:rgba(255,255,255,.02)}
  .debat-col.oui{border-top:3px solid var(--a3)}
  .debat-col.non{border-top:3px solid var(--a4)}
  .debat-t{font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}
  .debat-col.oui .debat-t{color:var(--a3)}
  .debat-col.non .debat-t{color:var(--a4)}
  .debat-col li{font-size:.87rem;line-height:1.6;color:rgba(232,230,224,.75);
    padding:9px 0 9px 18px;position:relative;list-style:none;border-bottom:1px solid rgba(255,255,255,.05)}
  .debat-col li:last-child{border-bottom:none}
  .debat-col li::before{content:'';position:absolute;left:0;top:16px;width:5px;height:5px;border-radius:50%}
  .debat-col.oui li::before{background:var(--a3)}
  .debat-col.non li::before{background:var(--a4)}
  .debat-col li strong{color:var(--text);font-weight:500}

  /* ─── LEXIQUE ─── */
  .lex-search{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-family:'DM Sans',sans-serif;font-size:.88rem;padding:11px 15px;margin-bottom:14px}
  .lex-search:focus{outline:none;border-color:var(--a1)}
  .lex-search::placeholder{color:var(--text-faint)}
  .lex td:first-child{font-family:'DM Mono',monospace;color:var(--a2);font-weight:500}

  /* ─── SUJETS ─── */
  .sujet{border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:10px;
    background:var(--surface);display:flex;gap:16px;align-items:flex-start;transition:all .2s}
  .sujet:hover{border-color:var(--a4);transform:translateX(4px)}
  .sujet-n{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:900;color:var(--text-faint);line-height:1;flex-shrink:0}
  .sujet-q{font-size:.94rem;line-height:1.6;color:var(--text);margin-bottom:5px;font-weight:400}
  .sujet-h{font-size:.79rem;color:var(--text-dim);line-height:1.55}

  /* ─── À RETENIR ─── */
  .retenir{background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 12%,transparent),rgba(255,255,255,.02));
    border:1px solid color-mix(in srgb,var(--a1) 30%,transparent);border-radius:var(--radius);padding:28px 30px}
  .retenir li{font-size:.93rem;line-height:1.65;color:rgba(232,230,224,.82);
    padding:10px 0 10px 26px;position:relative;list-style:none;border-bottom:1px solid rgba(255,255,255,.06)}
  .retenir li:last-child{border-bottom:none}
  .retenir li::before{content:'✓';position:absolute;left:0;top:9px;color:var(--a1);font-size:.85rem}
  .retenir li strong{color:var(--text);font-weight:500}

  /* ─── PIED DE PAGE ─── */
  footer{text-align:center;padding:36px 40px;border-top:1px solid var(--border);
    font-family:'DM Mono',monospace;font-size:.7rem;color:var(--text-dim);letter-spacing:.14em;
    text-transform:uppercase}

  /* ─── ANIMATION ─── */
  .rev{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
  .rev.vu{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){.rev{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
  :focus-visible{outline:2px solid var(--a1);outline-offset:3px}

  /* ─── RESPONSIVE ─── */
  @media(max-width:1080px){
    .rail{display:none}
    .layout{padding:32px 22px 70px}
    .chrono-mobile{display:block}
  }
  @media(max-width:680px){
    nav{padding:12px 18px;flex-wrap:wrap}
    .breadcrumb{font-size:.7rem;order:3;width:100%}
    .hero{padding:52px 20px 40px}
    .debat{grid-template-columns:1fr}
    .partie-head{gap:14px}
    .partie-num{font-size:2.4rem}
  }
  /* ─── IMPRESSION ─── */
  @media print{
    body{background:#fff;color:#111}
    nav,.rail,#progress,.bg-orb,.nav-right{display:none!important}
    .hero{background:none;border-bottom:2px solid #111;padding:0 0 22px}
    .hero h1,.prose,.liste li,.bloc-title{color:#111}
    .layout{display:block;padding:0}
    .partie,.bloc{break-inside:avoid;page-break-inside:avoid}
    .rev{opacity:1;transform:none}
    .chrono-mobile{display:block!important}
  }
</style>
</head>
<body>

<div id="progress"></div>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<nav>
  <div class="nav-logo" onclick="location.href='../../index.html'">ECG Prépa</div>
  <div class="breadcrumb">
    <span onclick="location.href='../../index.html'">Accueil</span>
    <span class="sep">/</span>
    <span onclick="location.href='../index.html'">2ème Année</span>
    <span class="sep">/</span>
    <span onclick="location.href='index.html'">Civilisation</span>
    <span class="sep">/</span>
    <span class="current" id="bc-titre">—</span>
  </div>
  <div class="nav-right">
    <button id="ap-btn-fr" class="ap-lang-btn active" onclick="setLang('fr')">🇫🇷 FR</button>
    <button id="ap-btn-es" class="ap-lang-btn" onclick="setLang('es')">🇪🇸 ES</button>

            es:"La pandemia de Covid-19 provoca en 2020 un hundimiento espectacular del turismo español —solo <strong>18,9 millones de visitantes</strong>, frente a más de 80 millones en 2019—, el peor año de la historia del sector en términos de ingresos. Este paréntesis, aunque devastador para la economía turística, ofrece paradójicamente un <strong>respiro temporal</strong> a los habitantes de los centros históricos más saturados, que redescubren, durante algunos confinamientos, calles y plazas vacías de visitantes — experiencia que alimentará después, por contraste, la memoria colectiva del «mundo de antes» y la crítica del modelo anterior."} },

            fr:"Ce répit s'avère de courte durée : dès <strong>2022</strong>, le tourisme international renoue avec une croissance rapide, jusqu'à battre en <strong>2024</strong> un record absolu de <strong>94 millions de touristes internationaux</strong> — pour une population espagnole de 48 millions d'habitants —, dépensant environ 126 milliards d'euros et portant le poids du secteur à près de <strong>13 % du PIB national</strong> et 2,7 millions d'emplois directs. Loin d'être un pic isolé, ce chiffre est encore dépassé en <strong>2025</strong>, avec près de 97 millions de visiteurs, faisant de l'Espagne le <strong>deuxième pays le plus visité au monde</strong> après la France, et marquant sa <strong>huitième année consécutive</strong> de record touristique. C'est ce rebond post-pandémique particulièrement violent, ajouté à une pénurie de logements déjà installée, qui va précipiter la crise sociale des années 2024-2026.",
            es:"Este respiro resulta breve: ya en <strong>2022</strong>, el turismo internacional retoma un crecimiento rápido, hasta batir en <strong>2024</strong> un récord absoluto de <strong>94 millones de turistas internacionales</strong> —para una población española de 48 millones de habitantes—, que gastan unos 126 000 millones de euros y elevan el peso del sector a cerca del <strong>13 % del PIB nacional</strong> y 2,7 millones de empleos directos. Lejos de ser un pico aislado, esta cifra se supera de nuevo en <strong>2025</strong>, con cerca de 97 millones de visitantes, convirtiendo a España en el <strong>segundo país más visitado del mundo</strong> tras Francia, y marcando su <strong>octavo año consecutivo</strong> de récord turístico. Es este repunte pospandémico particularmente intenso, sumado a una escasez de vivienda ya instalada, lo que va a precipitar la crisis social de los años 2024-2026."} }
        ]
      }
    ]

    sections:[

        titre:{fr:"La loi du logement de 2023 : premier encadrement national des loyers",

        blocs:[
          { t:"p", c:{
            fr:"Adoptée le <strong>26 mai 2023</strong>, la <strong>Ley por el Derecho a la Vivienda</strong> (loi 12/2023) constitue la première loi nationale du logement de l'histoire démocratique espagnole, un domaine jusque-là laissé presque entièrement aux communautés autonomes. Elle crée la catégorie des <strong>« zones de marché résidentiel tendu »</strong> (<span class='es'>zonas de mercado residencial tensionado</span>), que les communautés volontaires peuvent déclarer pour y plafonner l'évolution des loyers sur la base d'un indice de référence, et abaisse pour ces zones le seuil définissant un <strong>« grand bailleur »</strong> (<span class='es'>gran tenedor</span>) soumis à des obligations renforcées, de dix à cinq logements possédés.",
            es:"Aprobada el <strong>26 de mayo de 2023</strong>, la <strong>Ley por el Derecho a la Vivienda</strong> (Ley 12/2023) constituye la primera ley estatal de vivienda de la historia democrática española, un ámbito hasta entonces dejado casi por completo a las comunidades autónomas. Crea la categoría de <strong>«zonas de mercado residencial tensionado»</strong>, que las comunidades que lo deseen pueden declarar para limitar en ellas la evolución de los alquileres sobre la base de un índice de referencia, y rebaja para esas zonas el umbral que define a un <strong>«gran tenedor»</strong> sometido a obligaciones reforzadas, de diez a cinco viviendas en propiedad."} },
          { t:"p", c:{
            fr:"L'application de la loi reste toutefois <strong>très inégale</strong> selon les territoires, puisque la déclaration de zone tendue demeure une décision volontaire des communautés autonomes : la Catalogne l'active rapidement pour Barcelone et sa périphérie, tandis que les Baléares, dirigées depuis 2023 par un gouvernement conservateur, refusent explicitement d'y recourir malgré la gravité de la crise locative sur l'archipel. Les effets concrets de la loi restent, dès ses premiers mois d'application, disputés : une étude portée par des acteurs du secteur immobilier signale une contraction de plus de 50 % de l'offre locative de longue durée dans certaines zones concernées, ses partisans répondant que ce recul traduit surtout une régularisation d'une offre auparavant non déclarée plutôt qu'une fuite réelle des bailleurs.",
            es:"La aplicación de la ley sigue siendo, sin embargo, muy <strong>desigual</strong> según los territorios, ya que la declaración de zona tensionada sigue siendo una decisión voluntaria de las comunidades autónomas: Cataluña la activa rápidamente para Barcelona y su área metropolitana, mientras que Baleares, gobernada desde 2023 por un ejecutivo conservador, se niega explícitamente a recurrir a ella pese a la gravedad de la crisis del alquiler en el archipiélago. Los efectos concretos de la ley siguen siendo, ya en sus primeros meses de aplicación, disputados: un estudio impulsado por actores del sector inmobiliario señala una contracción de más del 50 % de la oferta de alquiler de larga duración en algunas zonas afectadas, respondiendo sus defensores que ese retroceso traduce sobre todo una regularización de una oferta antes no declarada más que una huida real de los arrendadores."} },
          { t:"def", mot:{fr:"Gran tenedor",es:"Gran tenedor"},
            c:{fr:"« Grand bailleur » : propriétaire, personne physique ou morale, possédant un nombre de logements dépassant un seuil légal (dix en général, abaissé à cinq en zone tendue), soumis à des obligations renforcées de plafonnement des loyers et de justification des hausses de prix.",
               es:"Propietario, persona física o jurídica, que posee un número de viviendas superior a un umbral legal (diez en general, rebajado a cinco en zona tensionada), sometido a obligaciones reforzadas de limitación de alquileres y justificación de las subidas de precio."} }

      {
        titre:{fr:"2024-2025 : la vague de protestation anti-touristique",
               es:"2024-2025: la oleada de protesta antiturística"},
        blocs:[
          { t:"p", c:{
            fr:"Le <strong>20 avril 2024</strong>, entre 20 000 et 50 000 personnes manifestent simultanément dans plusieurs villes des <strong>Canaries</strong>, dénonçant un modèle touristique jugé insoutenable pour l'environnement comme pour le bien-être de la population — l'archipel affichant, en 2023, un taux de pauvreté touchant près d'un tiers de ses habitants malgré une fréquentation touristique record. Le mouvement, soutenu par des organisations environnementales comme Greenpeace et le WWF, est suivi le <strong>26 mai 2024</strong> par des manifestations aux <strong>Baléares</strong> — environ 10 000 personnes à Palma de Majorque, mobilisations également à Minorque et Ibiza —, où les habitants réclament un encadrement de l'achat de biens immobiliers par des non-résidents et un frein à l'ouverture de nouveaux établissements touristiques.",
            es:"El <strong>20 de abril de 2024</strong>, entre 20 000 y 50 000 personas se manifiestan simultáneamente en varias ciudades de <strong>Canarias</strong>, denunciando un modelo turístico considerado insostenible tanto para el medio ambiente como para el bienestar de la población —el archipiélago registraba, en 2023, una tasa de pobreza que afectaba a cerca de un tercio de sus habitantes pese a una afluencia turística récord—. El movimiento, respaldado por organizaciones medioambientales como Greenpeace y WWF, es seguido el <strong>26 de mayo de 2024</strong> por manifestaciones en <strong>Baleares</strong> —unas 10 000 personas en Palma de Mallorca, movilizaciones también en Menorca e Ibiza—, donde los vecinos reclaman una regulación de la compra de inmuebles por no residentes y un freno a la apertura de nuevos establecimientos turísticos."} },
          { t:"p", c:{
            fr:"L'épisode le plus médiatisé survient à <strong>Barcelone</strong> les 6 et 13 juillet 2024 : lors de deux manifestations réunissant environ 3 000 personnes, des militants du collectif <em>Assemblea de Barris pel Decreixement Turístic</em> (Assemblée de quartiers pour la décroissance touristique) aspergent des touristes attablés en terrasse à l'aide de <strong>pistolets à eau</strong>, tout en scellant symboliquement les portes de plusieurs hôtels avec du ruban adhésif. L'image, immédiatement reprise par les médias du monde entier, cristallise la tension espagnole autour du surtourisme, provoquant une réaction critique de la ministre du Tourisme elle-même, qui juge la méthode contre-productive tout en reconnaissant la légitimité du fond des revendications.",
            es:"El episodio más mediatizado ocurre en <strong>Barcelona</strong> los días 6 y 13 de julio de 2024: durante dos manifestaciones que reúnen a unas 3 000 personas, activistas del colectivo <em>Assemblea de Barris pel Decreixement Turístic</em> (Asamblea de Barrios para el Decrecimiento Turístico) rocían con <strong>pistolas de agua</strong> a turistas sentados en terrazas, al tiempo que sellan simbólicamente las puertas de varios hoteles con cinta adhesiva. La imagen, retomada de inmediato por medios de todo el mundo, cristaliza la tensión española en torno al sobreturismo, provocando una reacción crítica de la propia ministra de Turismo, que considera el método contraproducente reconociendo a la vez la legitimidad del fondo de las reivindicaciones."} },
          { t:"p", c:{
            fr:"Ces mobilisations, loin de s'éteindre, culminent le <strong>15 juin 2025</strong> par une <strong>journée de protestation coordonnée</strong> à l'échelle de l'Europe du Sud, associant l'Espagne (Barcelone, Palma, Ibiza, Saint-Sébastien, Grenade), le Portugal et l'Italie, sous le slogan commun <em>« Your holidays, my misery »</em> (« Vos vacances, ma misère »). Les organisateurs insistent alors sur le fait que leur mouvement ne rejette pas le tourisme en tant que tel, mais réclame une réforme structurelle du modèle de croissance touristique — plafonnement des arrivées, régulation stricte des locations de courte durée, réinvestissement des recettes touristiques dans le logement abordable.",
            es:"Estas movilizaciones, lejos de apagarse, culminan el <strong>15 de junio de 2025</strong> con una <strong>jornada de protesta coordinada</strong> a escala del sur de Europa, que asocia a España (Barcelona, Palma, Ibiza, San Sebastián, Granada), Portugal e Italia, bajo el lema común <em>«Your holidays, my misery»</em> («Tus vacaciones, mi miseria»). Los organizadores insisten entonces en que su movimiento no rechaza el turismo como tal, sino que reclama una reforma estructural del modelo de crecimiento turístico —limitación de las llegadas, regulación estricta de los alquileres de corta duración, reinversión de los ingresos turísticos en vivienda asequible."} }

      {
        titre:{fr:"Les réponses institutionnelles : Barcelone et l'horizon 2028",
               es:"Las respuestas institucionales: Barcelona y el horizonte de 2028"},
        blocs:[
          { t:"p", c:{
            fr:"Face à cette pression, les collectivités locales les plus exposées engagent des réformes structurelles. Barcelone avait déjà innové en <strong>août 2021</strong> en devenant la première grande ville européenne à interdire la location touristique de chambres privées au sein de logements occupés. En <strong>juin 2024</strong>, le maire socialiste <strong>Jaume Collboni</strong> franchit une étape supplémentaire en annonçant la <strong>suppression de toutes les licences</strong> de logements touristiques de courte durée d'ici <strong>2028</strong> — une mesure radicale, présentée comme nécessaire pour restituer au marché résidentiel ordinaire plusieurs milliers de logements actuellement dédiés exclusivement au tourisme. Le même été, la municipalité annonce également une hausse substantielle de la taxe touristique appliquée aux passagers de <strong>croisières</strong> effectuant une escale de moins de douze heures.",
            es:"Ante esta presión, las administraciones locales más expuestas emprenden reformas estructurales. Barcelona ya había innovado en <strong>agosto de 2021</strong> al convertirse en la primera gran ciudad europea en prohibir el alquiler turístico de habitaciones privadas dentro de viviendas habitadas. En <strong>junio de 2024</strong>, el alcalde socialista <strong>Jaume Collboni</strong> da un paso más al anunciar la <strong>supresión de todas las licencias</strong> de pisos turísticos de corta duración de aquí a <strong>2028</strong> —una medida radical, presentada como necesaria para devolver al mercado residencial ordinario varios miles de viviendas actualmente dedicadas en exclusiva al turismo—. Ese mismo verano, el ayuntamiento anuncia también una subida sustancial de la tasa turística aplicada a los pasajeros de <strong>cruceros</strong> que hacen escala por menos de doce horas."} },
          { t:"p", c:{
            fr:"D'autres villes développent des réponses plus ciblées : <strong>Saint-Sébastien</strong> limite désormais la taille des groupes touristiques guidés dans l'espace public à 25 personnes et maintient un moratoire de longue date sur les nouvelles licences de location touristique dans son centre historique, tandis que les Baléares, malgré le refus régional d'activer la loi nationale du logement, imposent depuis mars 2024 des <strong>amendes renforcées</strong> pour les comportements antisociaux des touristes (jusqu'à 3 000 euros), sans toutefois s'attaquer directement au volume global des arrivées.",
            es:"Otras ciudades desarrollan respuestas más específicas: <strong>San Sebastián</strong> limita ahora el tamaño de los grupos turísticos guiados en el espacio público a 25 personas y mantiene una moratoria de larga data sobre nuevas licencias de alquiler turístico en su centro histórico, mientras que Baleares, pese a la negativa regional a activar la ley estatal de vivienda, impone desde marzo de 2024 <strong>multas reforzadas</strong> por comportamientos antisociales de los turistas (hasta 3 000 euros), sin abordar sin embargo directamente el volumen global de llegadas."} },
          { t:"encadre", icon:"⚠️", c:"var(--a3)",
            titre:{fr:"Erreur fréquente en dissertation", es:"Un error frecuente en el ensayo"},
            c2:{fr:"Ne pas réduire le mouvement de 2024-2026 à une simple hostilité au visiteur individuel. Les organisateurs des mobilisations insistent systématiquement sur la distinction entre le <strong>touriste</strong>, dont la présence n'est pas en soi contestée, et le <strong>modèle économique</strong> qui organise sa venue — plateformes de location non régulées, croissance illimitée des vols et des croisières, absence de redistribution des bénéfices touristiques vers le logement abordable. Réduire la <em>turismofobia</em> à un rejet xénophobe des étrangers méconnaît le contenu réel des revendications portées, qui restent d'ordre économique et urbanistique.",
                es:"No reducir el movimiento de 2024-2026 a una simple hostilidad hacia el visitante individual. Los organizadores de las movilizaciones insisten sistemáticamente en la distinción entre el <strong>turista</strong>, cuya presencia no se cuestiona en sí misma, y el <strong>modelo económico</strong> que organiza su llegada —plataformas de alquiler no reguladas, crecimiento ilimitado de vuelos y cruceros, ausencia de redistribución de los beneficios turísticos hacia la vivienda asequible—. Reducir la <em>turismofobia</em> a un rechazo xenófobo de los extranjeros desconoce el contenido real de las reivindicaciones planteadas, que siguen siendo de orden económico y urbanístico."} },
          { t:"p", c:{
            fr:"Cette séquence illustre une tension structurelle difficile à résoudre : le tourisme demeure un pilier économique majeur, générateur d'emplois et de devises dans un pays encore marqué par les séquelles de la crise de 2008 (chapitre 16), mais sa croissance ininterrompue entre en collision directe avec le droit au logement d'une population locale de plus en plus précarisée par la hausse des loyers. L'horizon 2028 fixé par Barcelone constitue, à ce titre, le test le plus ambitieux à l'échelle européenne d'une politique de <strong>rééquilibrage volontariste</strong> entre attractivité touristique et vivabilité urbaine — dont le succès ou l'échec influencera probablement les politiques d'autres métropoles touristiques du continent.",
            es:"Esta secuencia ilustra una tensión estructural difícil de resolver: el turismo sigue siendo un pilar económico mayor, generador de empleo y divisas en un país todavía marcado por las secuelas de la crisis de 2008 (capítulo 16), pero su crecimiento ininterrumpido entra en colisión directa con el derecho a la vivienda de una población local cada vez más precarizada por la subida de los alquileres. El horizonte de 2028 fijado por Barcelona constituye, en este sentido, la prueba más ambiciosa a escala europea de una política de <strong>reequilibrio voluntarista</strong> entre atractivo turístico y habitabilidad urbana — cuyo éxito o fracaso influirá probablemente en las políticas de otras metrópolis turísticas del continente."} }
        ]
      }
    ]
  }

    synthese: {fr:"Le débat oppose une lecture <em>de décroissance</em>, pour qui seule une limitation volontaire des flux peut restaurer un équilibre urbain soutenable, à une lecture <em>de régulation ciblée</em>, qui privilégie des correctifs sectoriels (logement, fiscalité) sans remettre en cause le volume global de l'activité. L'échéance barcelonaise de 2028 constitue, à cet égard, une expérience grandeur nature : en s'attaquant directement au <strong>parc de logements touristiques</strong> plutôt qu'au nombre de visiteurs, la municipalité tente une voie médiane — réduire l'impact sur le logement sans renoncer frontalement aux recettes touristiques — dont le succès dépendra largement de la capacité des pouvoirs publics à faire appliquer une mesure qui touche directement aux intérêts patrimoniaux de dizaines de milliers de propriétaires.",
               es:"El debate enfrenta una lectura <em>decrecentista</em>, para la que solo una limitación voluntaria de los flujos puede restaurar un equilibrio urbano sostenible, con una lectura <em>de regulación específica</em>, que privilegia correctivos sectoriales (vivienda, fiscalidad) sin cuestionar el volumen global de la actividad. El plazo barcelonés de 2028 constituye, en este sentido, un experimento a escala real: al atacar directamente el <strong>parque de vivienda turística</strong> en lugar del número de visitantes, el ayuntamiento ensaya una vía intermedia —reducir el impacto sobre la vivienda sin renunciar frontalmente a los ingresos turísticos— cuyo éxito dependerá en gran medida de la capacidad de los poderes públicos para hacer cumplir una medida que afecta directamente a los intereses patrimoniales de decenas de miles de propietarios."}

    { es:"Gran tenedor", fr:"« Grand bailleur » : propriétaire possédant un nombre de logements dépassant un seuil légal, soumis à des obligations renforcées." },
    { es:"Zona de mercado residencial tensionado", fr:"« Zone de marché résidentiel tendu » : zonage créé par la loi du logement de 2023 permettant un encadrement des loyers." },
    { es:"Ley por el Derecho a la Vivienda", fr:"Première loi nationale du logement de l'Espagne démocratique, adoptée le 26 mai 2023." },
    { es:"Sobreturismo / overtourism", fr:"Surtourisme : afflux touristique dépassant la capacité d'accueil sociale, environnementale ou infrastructurelle d'une destination." },
    { es:"Decrecimiento turístico", fr:"« Décroissance touristique » : doctrine militante prônant une réduction volontaire des flux touristiques dans les destinations saturées." },
    { es:"Tasa turística", fr:"Taxe de séjour perçue sur les nuitées touristiques, souvent proposée ou renforcée comme outil de régulation des flux." },
    { es:"Moratoria de licencias", fr:"Gel temporaire ou permanent de la délivrance de nouvelles autorisations de location touristique dans une zone donnée." },
    { es:"Aerolíneas low-cost", fr:"Compagnies aériennes à bas coût, dont l'essor dans les années 2000 a démocratisé les courts séjours vers l'Espagne." },
    { es:"Comportamiento antisocial", fr:"« Comportement antisocial » : catégorie légale utilisée notamment aux Baléares pour sanctionner les incivilités touristiques." },
    { es:"Alquiler de larga duración", fr:"Location résidentielle de longue durée, concurrencée par la location touristique de courte durée sur le marché du logement." },
    { es:"Desplazamiento (gentrificación turística)", fr:"Déplacement de la population locale vers la périphérie sous l'effet de la pression touristique et de la hausse des loyers." }
  ],

  /* ─── 8. SUJETS POSSIBLES ─────────────────────────────────────────── */
  sujets: [
    { q:{fr:"Comment le tourisme est-il devenu, depuis le franquisme, un pilier structurel de l'économie espagnole ?",
         es:"¿Cómo se ha convertido el turismo, desde el franquismo, en un pilar estructural de la economía española?"},
      h:{fr:"Retracer le rôle du Plan de stabilisation de 1959, des JO de 1992 et de la crise de 2008 comme étapes de consolidation successives.",
         es:"Trazar el papel del Plan de Estabilización de 1959, los JJ.OO. de 1992 y la crisis de 2008 como etapas sucesivas de consolidación."} },
    { q:{fr:"Dans quelle mesure les plateformes de location de courte durée ont-elles aggravé la crise du logement urbain en Espagne ?",
         es:"¿En qué medida han agravado las plataformas de alquiler de corta duración la crisis de la vivienda urbana en España?"},
      h:{fr:"S'appuyer sur le cas de Barcelone (perte de 45 % de population résidente dans certains quartiers) et sur le mécanisme de la touristification.",
         es:"Apoyarse en el caso de Barcelona (pérdida del 45 % de población residente en algunos barrios) y en el mecanismo de la turistificación."} },
    { q:{fr:"La vague de manifestations anti-touristiques de 2024-2025 relève-t-elle d'un rejet des visiteurs ou d'une critique d'un modèle économique ?",
         es:"¿Responde la oleada de manifestaciones antiturísticas de 2024-2025 a un rechazo de los visitantes o a una crítica de un modelo económico?"},
      h:{fr:"Analyser le discours des organisateurs (Canaries, Baléares, Barcelone) pour distinguer hostilité individuelle et critique structurelle.",
         es:"Analizar el discurso de los organizadores (Canarias, Baleares, Barcelona) para distinguir hostilidad individual y crítica estructural."} },
    { q:{fr:"L'interdiction des logements touristiques annoncée par Barcelone pour 2028 est-elle une solution réaliste à la crise du logement ?",
         es:"¿Es la prohibición de los pisos turísticos anunciada por Barcelona para 2028 una solución realista a la crisis de la vivienda?"},
      h:{fr:"Mettre en balance l'ampleur du parc de logements concernés et les obstacles juridiques, économiques et politiques à sa mise en œuvre effective.",
         es:"Poner en la balanza la magnitud del parque de viviendas afectado y los obstáculos jurídicos, económicos y políticos a su aplicación efectiva."} }
  ],

  /* ─── 9. À RETENIR ───────────────────────────────────────────────── */
  retenir: {
    fr:[
      "Le tourisme de masse espagnol naît d'une <strong>décision politique</strong> franquiste (Plan de stabilisation de 1959), conçue comme source de devises et de légitimation internationale.",
      "Les <strong>JO de Barcelone</strong> (1992) et l'essor des compagnies low-cost dans les années 2000 diversifient et démocratisent les flux touristiques vers l'Espagne.",
      "Après 2008, le tourisme devient un <strong>pilier de substitution</strong> à la construction sinistrée par la crise (chapitre 16), encourageant une croissance sans réserve du secteur.",
      "L'essor d'<strong>Airbnb</strong> depuis la fin des années 2000 convertit massivement des logements résidentiels en locations touristiques, provoquant la <strong>touristification</strong> des centres historiques.",
      "Barcelone perd jusqu'à <strong>45 % de sa population résidente</strong> dans certains quartiers entre 2007 et 2019, un effet d'éviction directement lié à la pression touristique.",
      "En 2024, l'Espagne bat un record de <strong>94 millions de touristes</strong> (97 millions en 2025), portant le secteur à près de 13 % du PIB national.",
      "La <strong>loi du logement de 2023</strong> instaure un encadrement des loyers, mais son application volontaire par les communautés reste très inégale.",
      "Entre 2024 et 2026, une <strong>vague de manifestations</strong> (Canaries, Baléares, pistolets à eau à Barcelone) débouche sur l'annonce d'une interdiction totale des logements touristiques à Barcelone d'ici <strong>2028</strong>."
    ],
    es:[
      "El turismo de masas español nace de una <strong>decisión política</strong> franquista (Plan de Estabilización de 1959), concebida como fuente de divisas y legitimación internacional.",
      "Los <strong>JJ.OO. de Barcelona</strong> (1992) y el auge de las aerolíneas low-cost en los años 2000 diversifican y democratizan los flujos turísticos hacia España.",
      "Tras 2008, el turismo se convierte en <strong>pilar sustitutivo</strong> de la construcción hundida por la crisis (capítulo 16), fomentando un crecimiento sin reservas del sector.",
      "El auge de <strong>Airbnb</strong> desde finales de los años 2000 convierte masivamente viviendas residenciales en alquileres turísticos, provocando la <strong>turistificación</strong> de los centros históricos.",
      "Barcelona pierde hasta un <strong>45 % de su población residente</strong> en algunos barrios entre 2007 y 2019, un efecto de expulsión directamente ligado a la presión turística.",
      "En 2024, España bate un récord de <strong>94 millones de turistas</strong> (97 millones en 2025), situando al sector en torno al 13 % del PIB nacional.",
      "La <strong>ley de vivienda de 2023</strong> instaura una regulación de los alquileres, pero su aplicación voluntaria por las comunidades sigue siendo muy desigual.",
      "Entre 2024 y 2026, una <strong>oleada de manifestaciones</strong> (Canarias, Baleares, pistolas de agua en Barcelona) desemboca en el anuncio de una prohibición total de los pisos turísticos en Barcelona de aquí a <strong>2028</strong>."
    ]
  }
};
</script>

<script>
/* ─── Utilitaires ─── */
const $ = (s,r=document)=>r.querySelector(s);
let LANG = 'fr';
/* T() : renvoie la version dans la langue courante, ou la valeur telle quelle */
const T = v => (v && typeof v==='object' && !Array.isArray(v) && ('fr' in v||'es' in v)) ? (v[LANG] ?? v.fr) : v;

/* ─── Libellés d'interface ─── */
const UI = {
  fr:{ chrono:"Chronologie",
       essentiel:"L'essentiel", reperes:"Repères", quiEstQui:"Qui est qui", acteurs:"Acteurs clés",
       controverse:"Controverse", vocab:"Vocabulaire", lexique:"Lexique bilingue",
       filtrer:"Filtrer le lexique…", terme:"Terme", trad:"Traduction / usage",
       entrainement:"Entraînement", sujets:"Sujets possibles", memoriser:"Mémoriser",
       retenir:"À retenir", synthese:"Synthèse", chapitre:"Chapitre" },
  es:{ chrono:"Cronología",
       essentiel:"Lo esencial", reperes:"Hitos", quiEstQui:"Quién es quién", acteurs:"Actores clave",
       controverse:"Controversia", vocab:"Vocabulario", lexique:"Glosario bilingüe",
       filtrer:"Filtrar el glosario…", terme:"Término", trad:"Traducción / uso",
       entrainement:"Entrenamiento", sujets:"Posibles temas", memoriser:"Memorizar",
       retenir:"Para recordar", synthese:"Síntesis", chapitre:"Capítulo" }
};
const t = k => UI[LANG][k];

/* ─── Rendu des blocs de contenu ─── */
function bloc(b){
  switch(b.t){
    case 'p':      return `<p class="prose">${T(b.c)}</p>`;
    case 'liste':  return `<ul class="liste">${T(b.items).map(i=>`<li>${i}</li>`).join('')}</ul>`;
    case 'faits':  return `<div class="faits">${T(b.items).map(i=>
                     `<div class="fait"><div class="fait-l">${T(i.l)}</div><div class="fait-v">${T(i.v)}</div></div>`).join('')}</div>`;
    case 'stats':  return `<div class="stats">${b.items.map(i=>
                     `<div class="stat" style="--c:${i.c||'var(--a1)'}"><span class="stat-n">${T(i.n)}</span><span class="stat-d">${T(i.d)}</span></div>`).join('')}</div>`;
    case 'citation':return `<blockquote class="citation"><p>« ${T(b.c)} »</p><cite>${T(b.src)}</cite></blockquote>`;
    case 'encadre':return `<div class="encadre" style="--c:${b.c||'var(--a2)'}"><div class="encadre-ic">${b.icon||'💡'}</div>
                     <div><div class="encadre-t">${T(b.titre)}</div><div class="encadre-c">${T(b.c2)}</div></div></div>`;
    case 'def':    return `<div class="def"><div class="def-mot">${T(b.mot)}</div><div class="def-c">${T(b.c)}</div></div>`;
    case 'tableau':return `<div class="tbl-wrap"><table><thead><tr>${T(b.head).map(h=>`<th>${h}</th>`).join('')}</tr></thead>
                     <tbody>${T(b.rows).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tl':     return `<div class="tl">${T(b.items).map(i=>
                     `<div class="tl-item"><div class="tl-d">${T(i.d)}</div><div class="tl-c">${T(i.c)}</div></div>`).join('')}</div>`;
    default:       return '';
  }
}

/* ─── En-tête ─── */
function rendreHero(){
  const m = COURS.meta;
  document.documentElement.dataset.theme = m.theme;
  document.documentElement.lang = LANG;
  document.title = T(m.titre) + ' — Civilisation';
  $('#bc-titre').textContent = m.titre.fr ?? m.titre;   // la nav reste en français
  $('#ft').textContent = `${t('chapitre')} ${m.chapitre}${LANG==='fr'?' : ':': '}${T(m.titre)}`;
  $('#hero').innerHTML = `
    <span class="hero-flag">${m.drapeau}</span>
    <div class="hero-label">${T(m.label)}</div>
    <h1>${T(m.titre).replace(/&/g, '<span style="font-family:\'DM Sans\', sans-serif; font-style: normal;">&</span>')}</h1>
    <p class="hero-sub">${T(m.sousTitre)}</p>`;
}

/* ─── Corps du cours ─── */
function rendreCours(){
  const c = COURS, out = [];

  out.push(`<section class="bloc rev" id="s-essentiel">
    <div class="essentiel"><div class="essentiel-label">${t('essentiel')}</div><p>${T(c.essentiel)}</p></div>
    <div class="stats">${c.chiffres.map((x,i)=>
      `<div class="stat" style="--c:var(--a${(i%4)+1})"><span class="stat-n">${T(x.n)}</span><span class="stat-d">${T(x.d)}</span></div>`).join('')}</div>
  </section>`);

  if(c.chronologie?.length){
    out.push(`<section class="bloc rev chrono-mobile" id="s-chrono">
      <div class="bloc-head"><span class="bloc-kicker">${t('reperes')}</span><h2 class="bloc-title">${t('chrono')}</h2></div>
      ${bloc({t:'tl',items:c.chronologie})}</section>`);
  }

  c.parties.forEach((p,pi)=>{
    let html = `<section class="partie rev" id="p-${pi}" style="--p:${p.couleur}">
      <div class="partie-head"><div class="partie-num">${p.num}</div>
      <div><div class="partie-kicker">${T(p.kicker)}</div><h2 class="partie-title">${T(p.titre)}</h2></div></div>`;
    p.sections.forEach((s,si)=>{
      html += `<div class="section" id="p-${pi}-${si}"><h3 class="section-title"><span class="section-num">${si+1}.</span> ${T(s.titre)}</h3>
        ${s.blocs.map(bloc).join('')}</div>`;
    });
    out.push(html+`</section>`);
  });

  if(c.acteurs?.length){
    out.push(`<section class="bloc rev" id="s-acteurs">
      <div class="bloc-head"><span class="bloc-kicker">${t('quiEstQui')}</span><h2 class="bloc-title">${t('acteurs')}</h2></div>
      <div class="acteurs">${c.acteurs.map(a=>
        `<div class="acteur" style="--c:${a.c}"><div class="acteur-nom">${a.nom}</div>
         <div class="acteur-role">${T(a.role)}</div><div class="acteur-c">${T(a.d)}</div></div>`).join('')}</div></section>`);
  }

  if(c.debat){
    out.push(`<section class="bloc rev" id="s-debat">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a4)">${t('controverse')}</span>
      <h2 class="bloc-title">${T(c.debat.question)}</h2></div>
      <div class="debat">
        <div class="debat-col oui"><div class="debat-t">${T(c.debat.oui.titre)}</div>
          <ul>${T(c.debat.oui.items).map(i=>`<li>${i}</li>`).join('')}</ul></div>
        <div class="debat-col non"><div class="debat-t">${T(c.debat.non.titre)}</div>
          <ul>${T(c.debat.non.items).map(i=>`<li>${i}</li>`).join('')}</ul></div>
      </div>
      ${c.debat.synthese?`<div class="encadre" style="--c:var(--a1);margin-top:14px">
        <div class="encadre-ic">⚖️</div><div><div class="encadre-t">${t('synthese')}</div>
        <div class="encadre-c">${T(c.debat.synthese)}</div></div></div>`:''}
    </section>`);
  }

  if(c.lexique?.length){
    out.push(`<section class="bloc rev" id="s-lexique">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a2)">${t('vocab')}</span>
      <h2 class="bloc-title">${t('lexique')}</h2></div>
      <input class="lex-search" id="lex-search" placeholder="${t('filtrer')}" aria-label="${t('filtrer')}">
      <div class="tbl-wrap"><table class="lex"><thead><tr><th>${t('terme')}</th><th>${t('trad')}</th></tr></thead>
      <tbody id="lex-body">${c.lexique.map(l=>`<tr><td>${l.es}</td><td>${l.fr}</td></tr>`).join('')}</tbody></table></div>
    </section>`);
  }

  if(c.sujets?.length){
    out.push(`<section class="bloc rev" id="s-sujets">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a4)">${t('entrainement')}</span>
      <h2 class="bloc-title">${t('sujets')}</h2></div>
      ${c.sujets.map((s,i)=>`<div class="sujet"><div class="sujet-n">${String(i+1).padStart(2,'0')}</div>
        <div><div class="sujet-q">${T(s.q)}</div><div class="sujet-h">${T(s.h)}</div></div></div>`).join('')}</section>`);
  }

  if(c.retenir?.length){
    out.push(`<section class="bloc rev" id="s-retenir">
      <div class="bloc-head"><span class="bloc-kicker">${t('memoriser')}</span><h2 class="bloc-title">${t('retenir')}</h2></div>
      <div class="retenir"><ul>${T(c.retenir).map(r=>`<li>${r}</li>`).join('')}</ul></div></section>`);
  }

  $('#cours').innerHTML = out.join('');
}

/* ─── Colonne chronologie ─── */
function rendreRail(){
  if(!COURS.chronologie?.length){ $('#rail')?.remove(); return; }
  $('#rail').innerHTML = `<div class="rail-title">${t('chrono')}</div>${bloc({t:'tl',items:COURS.chronologie})}`;
}

/* ─── Recherche dans le lexique ─── */
function brancherLexique(){
  const ls = $('#lex-search'); if(!ls) return;
  ls.addEventListener('input', ()=>{
    const q = ls.value.toLowerCase().trim();
    $('#lex-body').querySelectorAll('tr').forEach(tr=>{
      tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
}

/* ─── Changement de langue ─── */
function setLang(lang){
  LANG = lang;
  $('#ap-btn-fr').classList.toggle('active', lang==='fr');
  $('#ap-btn-es').classList.toggle('active', lang==='es');
  rendreHero(); rendreCours(); rendreRail();
  document.querySelectorAll('.rev').forEach(el=>el.classList.add('vu'));
  brancherLexique();
}

/* ─── Démarrage ─── */
function demarrer(){
  rendreHero(); rendreCours(); rendreRail(); brancherLexique();

  const maj = ()=>{
    const h = document.body.scrollHeight - innerHeight;
    $('#progress').style.width = (h>0 ? (scrollY/h)*100 : 0) + '%';
  };
  addEventListener('scroll', maj, {passive:true}); maj();

  if(!('IntersectionObserver' in window)){
    document.querySelectorAll('.rev').forEach(el=>el.classList.add('vu'));
    return;
  }
  const io = new IntersectionObserver(es=>es.forEach(x=>{
    if(x.isIntersecting){ x.target.classList.add('vu'); io.unobserve(x.target); }
  }), {threshold:.06});
  document.querySelectorAll('.rev').forEach(el=>io.observe(el));
}

demarrer();
</script>
</body>
