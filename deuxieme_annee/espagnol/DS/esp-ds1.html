<!DOCTYPE html>
<html lang="fr" data-theme="espagnol2">
<head>
<script src="../../../auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le travail de mémoire — Civilisation Hispanophone</title>
<link rel="stylesheet" href="../../../fonts/fonts.css">

<!-- ══════════════════════════════════════════════════════════════════════
     TEMPLATE UNIVERSEL DE COURS DE CIVILISATION — v1
     Pour créer un nouveau cours : dupliquer ce fichier, ne modifier QUE
     le bloc de données (id="donnees") tout en bas. Rien d'autre à toucher.
     ══════════════════════════════════════════════════════════════════════ -->

<style>
  /* ─── PALETTE DE BASE (identique au site) ─── */
  :root{
    --bg:#0d0d0f; --surface:#16161a; --surface2:#1e1e24; --border:#2a2a35;
    --text:#e8e6e0; --text-dim:#8a8880; --text-faint:#4a4845;
    --radius:14px;
  }
  /* ─── THÈMES PAR LANGUE — change data-theme sur <html> ─── */
  html[data-theme="anglais"] { --a1:#c8a96e; --a2:#7c9ec9; --a3:#9ecba0; --a4:#c97c9e; --hero:#16233d; }
  html[data-theme="anglais2"] { --a1:#c9633f; --a2:#5b8f6f; --a3:#6c8fc7; --a4:#a06bb0; --hero:#16241b; }
  html[data-theme="espagnol"]{ --a1:#e0a93e; --a2:#c8553d; --a3:#7fae7a; --a4:#b06fa8; --hero:#3a1a18; }
  html[data-theme="espagnol2"]{ --a1:#b89355; --a2:#6b7d63; --a3:#8c5a4a; --a4:#5f7690; --hero:#211a14; }
  html[data-theme="allemand"]{ --a1:#d8b44a; --a2:#8fa4bd; --a3:#84b58e; --a4:#c06060; --hero:#241f1a; }
  html[data-theme="italien"] { --a1:#d5a94e; --a2:#6fae8f; --a3:#a8c07a; --a4:#c4695e; --hero:#152a24; }
  html[data-theme="chinois"] { --a1:#d9a441; --a2:#c05a4a; --a3:#83a98f; --a4:#a97fb0; --hero:#2c1618; }

  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;overflow-x:hidden}

  /* ─── FOND ─── */
  .bg-orb{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;opacity:.08;z-index:0}
  .orb1{width:700px;height:700px;background:var(--a1);top:-300px;right:-250px}
  .orb2{width:600px;height:600px;background:var(--a2);bottom:-250px;left:-250px}

  /* ─── BARRE DE PROGRESSION ─── */
  #progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:200;
    background:linear-gradient(90deg,var(--a1),var(--a2),var(--a4));transition:width .1s linear}

  /* ─── NAV ─── */
  nav{display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding:16px 40px;border-bottom:1px solid var(--border);
    background:rgba(13,13,15,.9);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100}
  .nav-logo{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;color:var(--a1);cursor:pointer}
  .breadcrumb{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--text-dim);flex-wrap:wrap}
  .breadcrumb span{cursor:pointer;transition:color .2s}
  .breadcrumb span:hover{color:var(--a1)}
  .breadcrumb .sep{color:var(--text-faint);cursor:default}
  .breadcrumb .current{color:var(--text);cursor:default}
  .nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .ap-lang-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    color:rgba(255,255,255,.6);font-family:'DM Mono',monospace;font-size:10px;font-weight:700;
    letter-spacing:.12em;padding:5px 14px;border-radius:4px;cursor:pointer;transition:all .2s;text-transform:uppercase}
  .ap-lang-btn.active{background:var(--a1);border-color:var(--a1);color:#12100c}
  .ap-lang-btn:hover:not(.active){background:rgba(255,255,255,.15);color:#fff}

  /* ─── HERO ─── */
  .hero{position:relative;z-index:1;padding:76px 40px 56px;text-align:center;overflow:hidden;
    background:linear-gradient(160deg,var(--hero),#0d0d0f 85%);border-bottom:1px solid var(--border)}
  .hero::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
    width:80px;height:2px;background:var(--a1)}
  .hero-flag{font-size:2.6rem;line-height:1;margin-bottom:18px;display:block}
  .hero-label{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.3em;
    text-transform:uppercase;color:var(--a1);margin-bottom:18px}
  .hero h1{font-family:'Playfair Display',serif;font-weight:900;line-height:1.05;
    font-size:clamp(2.4rem,6vw,4.6rem);max-width:900px;margin:0 auto 18px}
  .hero-sub{font-size:1rem;color:var(--text-dim);max-width:640px;margin:0 auto;line-height:1.6}

  /* ─── LAYOUT ─── */
  .layout{display:flex;gap:48px;max-width:1320px;margin:0 auto;padding:48px 40px 100px;position:relative;z-index:1}
  main{flex:1;min-width:0;max-width:840px}

  /* ─── COLONNE CHRONOLOGIE ─── */
  .rail{width:262px;flex-shrink:0;position:sticky;top:88px;align-self:flex-start;
    max-height:calc(100vh - 118px);overflow-y:auto;padding-right:8px}
  .rail-title{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;
    color:var(--a1);margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border)}
  .rail .tl{padding-left:20px;margin:0 0 0 4px}
  .rail .tl-item{padding-bottom:16px}
  .rail .tl-item::before{left:-26px;top:4px;width:7px;height:7px}
  .rail .tl-d{font-size:.66rem;letter-spacing:.08em}
  .rail .tl-c{font-size:.79rem;line-height:1.5}
  .rail::-webkit-scrollbar{width:3px}
  .rail::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .chrono-mobile{display:none}

  /* ─── BLOC GÉNÉRIQUE ─── */
  .bloc{margin-bottom:64px;scroll-margin-top:88px}
  .bloc-head{display:flex;align-items:baseline;gap:14px;margin-bottom:24px;
    padding-bottom:12px;border-bottom:1px solid var(--border)}
  .bloc-kicker{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--k,var(--a1))}
  .bloc-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--text)}

  /* ─── L'ESSENTIEL ─── */
  .essentiel{background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    border:1px solid var(--border);border-left:3px solid var(--a1);border-radius:var(--radius);
    padding:28px 30px;margin-bottom:36px}
  .essentiel-label{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--a1);margin-bottom:14px}
  .essentiel p{font-size:.98rem;line-height:1.75;color:var(--text);margin-bottom:0}
  .essentiel p strong{color:var(--a1);font-weight:500}

  /* ─── STATS ─── */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0}
  .stat{border-radius:10px;padding:18px 16px;text-align:center;border:1px solid rgba(255,255,255,.08);
    background:linear-gradient(135deg,color-mix(in srgb,var(--c,var(--a1)) 26%,#101014),
    color-mix(in srgb,var(--c,var(--a1)) 8%,#101014))}
  .stat-n{font-family:'DM Mono',monospace;font-size:1.5rem;font-weight:500;color:var(--text);display:block;line-height:1.1}
  .stat-d{font-size:.7rem;color:var(--text-dim);margin-top:7px;display:block;line-height:1.45}

  /* ─── PARTIES ─── */
  .partie{margin-bottom:78px;scroll-margin-top:88px}
  .partie-head{display:flex;align-items:center;gap:22px;margin-bottom:34px;
    padding-bottom:18px;border-bottom:2px solid var(--p)}
  .partie-num{font-family:'Playfair Display',serif;font-size:3.4rem;font-weight:900;
    color:var(--p);opacity:.35;line-height:.9;flex-shrink:0}
  .partie-title{font-family:'Playfair Display',serif;font-size:clamp(1.35rem,3vw,1.95rem);
    font-weight:700;line-height:1.2}
  .partie-kicker{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.24em;
    text-transform:uppercase;color:var(--p);margin-bottom:6px}

  .section{margin-bottom:44px;scroll-margin-top:88px}
  .section-title{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;
    color:var(--text);margin-bottom:18px;padding-left:16px;border-left:3px solid var(--p)}
  .section-num{color:var(--p);font-weight:900}

  /* ─── TEXTE ─── */
  .prose{font-size:.96rem;line-height:1.8;color:rgba(232,230,224,.78);margin-bottom:16px}
  .prose strong{color:var(--text);font-weight:500}
  .prose em{color:var(--p,var(--a1));font-style:normal;font-weight:500}
  .es{font-family:'DM Mono',monospace;font-size:.86em;color:var(--a2)}

  /* ─── LISTE ─── */
  .liste{list-style:none;margin:14px 0 20px}
  .liste li{font-size:.93rem;line-height:1.65;color:rgba(232,230,224,.75);
    padding:9px 0 9px 22px;position:relative;border-bottom:1px solid rgba(255,255,255,.05)}
  .liste li:last-child{border-bottom:none}
  .liste li::before{content:'';position:absolute;left:0;top:17px;width:6px;height:6px;
    border-radius:50%;background:var(--p,var(--a1))}
  .liste li strong{color:var(--text);font-weight:500}

  /* ─── FAITS CLÉS ─── */
  .faits{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;margin:20px 0}
  .fait{background:rgba(255,255,255,.03);border:1px solid var(--border);
    border-left:3px solid var(--p,var(--a1));border-radius:8px;padding:13px 15px}
  .fait-l{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--text-faint);
    text-transform:uppercase;letter-spacing:.14em;margin-bottom:5px}
  .fait-v{font-size:.86rem;font-weight:500;color:var(--text);line-height:1.4}

  /* ─── CITATION ─── */
  .citation{background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
    border:1px solid var(--border);border-left:3px solid var(--a1);border-radius:0 10px 10px 0;
    padding:20px 24px;margin:22px 0}
  .citation p{font-family:'Playfair Display',serif;font-style:italic;font-size:1.02rem;
    line-height:1.6;color:var(--text);margin-bottom:9px}
  .citation cite{font-family:'DM Mono',monospace;font-size:.66rem;letter-spacing:.08em;
    color:var(--a1);font-style:normal}

  /* ─── ENCADRÉ ─── */
  .encadre{display:flex;gap:15px;align-items:flex-start;border-radius:10px;padding:17px 20px;margin:20px 0;
    background:color-mix(in srgb,var(--c,var(--a2)) 7%,transparent);
    border:1px solid color-mix(in srgb,var(--c,var(--a2)) 26%,transparent)}
  .encadre-ic{font-size:1.5rem;flex-shrink:0;line-height:1.2}
  .encadre-t{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.2em;
    text-transform:uppercase;color:var(--c,var(--a2));margin-bottom:7px;font-weight:500}
  .encadre-c{font-size:.89rem;line-height:1.7;color:rgba(232,230,224,.75)}
  .encadre-c strong{color:var(--text);font-weight:500}

  /* ─── DÉFINITION ─── */
  .def{border:1px dashed var(--border);border-radius:10px;padding:15px 18px;margin:18px 0;
    background:rgba(255,255,255,.02)}
  .def-mot{font-family:'Playfair Display',serif;font-weight:700;font-size:1rem;color:var(--a3);margin-bottom:6px}
  .def-c{font-size:.88rem;line-height:1.7;color:rgba(232,230,224,.72)}

  /* ─── TABLEAU ─── */
  .tbl-wrap{overflow-x:auto;margin:20px 0;border:1px solid var(--border);border-radius:10px}
  table{width:100%;border-collapse:collapse;font-size:.83rem}
  thead{background:rgba(255,255,255,.04)}
  thead th{padding:11px 15px;text-align:left;font-family:'DM Mono',monospace;font-size:.6rem;
    letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap}
  tbody tr{border-top:1px solid var(--border)}
  tbody tr:nth-child(even){background:rgba(255,255,255,.015)}
  tbody td{padding:11px 15px;color:rgba(232,230,224,.75);line-height:1.5}
  tbody td:first-child{color:var(--text);font-weight:500}

  /* ─── CHRONOLOGIE ─── */
  .tl{border-left:2px solid var(--border);padding-left:26px;margin:8px 0 8px 6px}
  .tl-item{position:relative;padding-bottom:22px}
  .tl-item:last-child{padding-bottom:0}
  .tl-item::before{content:'';position:absolute;left:-33px;top:5px;width:9px;height:9px;border-radius:50%;
    background:var(--c,var(--a1));box-shadow:0 0 0 3px rgba(13,13,15,1),0 0 0 5px color-mix(in srgb,var(--c,var(--a1)) 35%,transparent)}
  .tl-d{font-family:'DM Mono',monospace;font-size:.72rem;font-weight:500;letter-spacing:.1em;
    color:var(--c,var(--a1));margin-bottom:4px}
  .tl-c{font-size:.9rem;line-height:1.6;color:rgba(232,230,224,.75)}
  .tl-c strong{color:var(--text);font-weight:500}

  /* ─── ACTEURS ─── */
  .acteurs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .acteur{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;
    transition:all .25s;position:relative;overflow:hidden}
  .acteur:hover{border-color:var(--c,var(--a1));transform:translateY(-3px);background:var(--surface2)}
  .acteur-nom{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;margin-bottom:3px}
  .acteur-role{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--c,var(--a1));margin-bottom:10px}
  .acteur-c{font-size:.82rem;line-height:1.6;color:var(--text-dim)}

  /* ─── DÉBAT ─── */
  .debat{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .debat-col{border:1px solid var(--border);border-radius:12px;padding:20px 22px;background:rgba(255,255,255,.02)}
  .debat-col.oui{border-top:3px solid var(--a3)}
  .debat-col.non{border-top:3px solid var(--a4)}
  .debat-t{font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}
  .debat-col.oui .debat-t{color:var(--a3)}
  .debat-col.non .debat-t{color:var(--a4)}
  .debat-col li{font-size:.87rem;line-height:1.6;color:rgba(232,230,224,.75);
    padding:9px 0 9px 18px;position:relative;list-style:none;border-bottom:1px solid rgba(255,255,255,.05)}
  .debat-col li:last-child{border-bottom:none}
  .debat-col li::before{content:'';position:absolute;left:0;top:16px;width:5px;height:5px;border-radius:50%}
  .debat-col.oui li::before{background:var(--a3)}
  .debat-col.non li::before{background:var(--a4)}
  .debat-col li strong{color:var(--text);font-weight:500}

  /* ─── LEXIQUE ─── */
  .lex-search{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-family:'DM Sans',sans-serif;font-size:.88rem;padding:11px 15px;margin-bottom:14px}
  .lex-search:focus{outline:none;border-color:var(--a1)}
  .lex-search::placeholder{color:var(--text-faint)}
  .lex td:first-child{font-family:'DM Mono',monospace;color:var(--a2);font-weight:500}

  /* ─── SUJETS ─── */
  .sujet{border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:10px;
    background:var(--surface);display:flex;gap:16px;align-items:flex-start;transition:all .2s}
  .sujet:hover{border-color:var(--a4);transform:translateX(4px)}
  .sujet-n{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:900;color:var(--text-faint);line-height:1;flex-shrink:0}
  .sujet-q{font-size:.94rem;line-height:1.6;color:var(--text);margin-bottom:5px;font-weight:400}
  .sujet-h{font-size:.79rem;color:var(--text-dim);line-height:1.55}

  /* ─── À RETENIR ─── */
  .retenir{background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 12%,transparent),rgba(255,255,255,.02));
    border:1px solid color-mix(in srgb,var(--a1) 30%,transparent);border-radius:var(--radius);padding:28px 30px}
  .retenir li{font-size:.93rem;line-height:1.65;color:rgba(232,230,224,.82);
    padding:10px 0 10px 26px;position:relative;list-style:none;border-bottom:1px solid rgba(255,255,255,.06)}
  .retenir li:last-child{border-bottom:none}
  .retenir li::before{content:'✓';position:absolute;left:0;top:9px;color:var(--a1);font-size:.85rem}
  .retenir li strong{color:var(--text);font-weight:500}

  /* ─── PIED DE PAGE ─── */
  footer{text-align:center;padding:36px 40px;border-top:1px solid var(--border);
    font-family:'DM Mono',monospace;font-size:.7rem;color:var(--text-dim);letter-spacing:.14em;
    text-transform:uppercase}

  /* ─── ANIMATION ─── */
  .rev{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
  .rev.vu{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){.rev{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
  :focus-visible{outline:2px solid var(--a1);outline-offset:3px}

  /* ─── RESPONSIVE ─── */
  @media(max-width:1080px){
    .rail{display:none}
    .layout{padding:32px 22px 70px}
    .chrono-mobile{display:block}
  }
  @media(max-width:680px){
    nav{padding:12px 18px;flex-wrap:wrap}
    .breadcrumb{font-size:.7rem;order:3;width:100%}
    .hero{padding:52px 20px 40px}
    .debat{grid-template-columns:1fr}
    .partie-head{gap:14px}
    .partie-num{font-size:2.4rem}
  }
  /* ─── IMPRESSION ─── */
  @page{size:A4;margin:16mm 15mm 18mm;
    @bottom-center{content:counter(page) " / " counter(pages);font-family:'DM Mono',monospace;font-size:8pt;color:#777}}
  @page:first{@bottom-center{content:none}}
  @media print{
    /* Palette claire + accents assombris pour rester lisibles sur papier */
    :root,html[data-theme]{--bg:#fff;--surface:#fff;--surface2:#fff;--border:#cfcac0;
      --text:#111;--text-dim:#444;--text-faint:#777}
    html[data-theme="anglais"]  {--a1:#8a6d33;--a2:#3f6293;--a3:#3f7a45;--a4:#8f3f63}
    html[data-theme="anglais2"] {--a1:#9a4322;--a2:#3b6b4d;--a3:#3d5f97;--a4:#6f3f80}
    html[data-theme="espagnol"] {--a1:#946a12;--a2:#9a3420;--a3:#436d3f;--a4:#7a3a72}
    html[data-theme="espagnol2"]{--a1:#80622c;--a2:#4a5a42;--a3:#7a4434;--a4:#3f5570}
    html[data-theme="allemand"] {--a1:#8a7015;--a2:#4a6380;--a3:#3f7449;--a4:#8f2f2f}
    html[data-theme="italien"]  {--a1:#8a6a1e;--a2:#357a58;--a3:#5e7a2c;--a4:#8f3a31}
    html[data-theme="chinois"]  {--a1:#8a6412;--a2:#8f3526;--a3:#3f6b4d;--a4:#6f4478}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;
      box-shadow:none!important;text-shadow:none!important;transition:none!important;animation:none!important}
    html,body{background:#fff!important;color:#111;font-size:10pt}
    body{overflow:visible}

    /* Éléments d'écran masqués */
    nav,.rail,#progress,.bg-orb,.nav-right,.lex-search{display:none!important}
    .rev{opacity:1!important;transform:none!important}

    /* En-tête */
    .hero{background:none!important;border-bottom:2px solid #111;padding:0 0 14px;margin-bottom:6px;text-align:center}
    .hero::after{display:none}
    .hero-flag{font-size:1.8rem;margin-bottom:6px}
    .hero-label{color:var(--a1);margin-bottom:6px}
    .hero h1{font-size:28pt;margin:0 auto 8px;max-width:none;color:#111}
    .hero-sub{margin:0 auto;max-width:640px;color:#444;font-size:10.5pt}

    /* Mise en page */
    .layout{display:block;padding:14px 0 0;max-width:none;margin:0}
    main{max-width:none}
    .chrono-mobile{display:block!important}
    .bloc{margin-bottom:28px}
    .partie{margin-bottom:0;break-before:page;page-break-before:always}
    .section{margin-bottom:22px}
    .partie-head{margin-bottom:18px;padding-bottom:10px;gap:16px}
    .partie-num{font-size:2.6rem;opacity:.5}
    .partie-title{font-size:17pt}
    #s-acteurs,#s-lexique,#s-retenir{break-before:page;page-break-before:always}

    /* Titres jamais orphelins en bas de page */
    h1,h2,h3,.bloc-head,.partie-head,.section-title,.essentiel-label{break-after:avoid;page-break-after:avoid;color:#111}

            c2:{fr:"Figure centrale de la violence d'État latino-américaine, la <em>desaparición forzada</em> consiste à arrêter une personne puis à nier sa détention et son sort. Elle prive les familles de corps et de deuil : c'est un <strong>crime continu</strong> tant que le sort de la victime n'est pas élucidé, et un <strong>crime contre l'humanité</strong> lorsqu'il est systématique — donc imprescriptible. D'où l'importance des exhumations et de l'anthropologie médico-légale (l'<em>Equipo Argentino de Antropología Forense</em>, fondé en 1984, est devenu une référence mondiale).",
                es:"Figura central de la violencia de Estado latinoamericana, la <em>desaparición forzada</em> consiste en detener a una persona y luego negar su detención y su paradero. Priva a las familias del cuerpo y del duelo: es un <strong>delito permanente</strong> mientras no se esclarezca la suerte de la víctima, y un <strong>crimen de lesa humanidad</strong> cuando es sistemática, y por tanto imprescriptible. De ahí la importancia de las exhumaciones y de la antropología forense (el <em>Equipo Argentino de Antropología Forense</em>, fundado en 1984, se ha convertido en una referencia mundial)."} }

        blocs:[
          { t:"p", c:{
            fr:"Le type de sortie de la violence conditionne largement le travail de mémoire. Une <strong>transition pactée</strong> (Espagne, Chili), où les anciens détenteurs du pouvoir conservent des leviers, favorise l'amnistie et le silence. Une <strong>transition par effondrement</strong> (Argentine, après la défaite des Malouines en 1982) ouvre la voie à des procès rapides. Le <strong>Mexique</strong> n'a pas connu de dictature militaire mais un régime de parti hégémonique (PRI, 1929-2000) : l'alternance de 2000 n'a pas été une rupture. La <strong>Colombie</strong>, démocratie formelle en guerre depuis les années 1960, pratique une justice transitionnelle « sans transition » complète, puisque d'autres groupes armés restent actifs.",
            es:"El tipo de salida de la violencia condiciona en gran medida la labor de memoria. Una <strong>transición pactada</strong> (España, Chile), en la que los antiguos detentadores del poder conservan resortes, favorece la amnistía y el silencio. Una <strong>transición por colapso</strong> (Argentina, tras la derrota de Malvinas en 1982) abre paso a juicios rápidos. <strong>México</strong> no conoció una dictadura militar sino un régimen de partido hegemónico (PRI, 1929-2000): la alternancia de 2000 no fue una ruptura. <strong>Colombia</strong>, democracia formal en guerra desde los años sesenta, practica una justicia transicional «sin transición» completa, ya que otros grupos armados siguen activos."} },

  {

    kicker:{fr:"L'Espagne",es:"España"},
    titre:{fr:"L'Espagne : du « pacte de l'oubli » à la mémoire démocratique",

    couleur:"var(--a2)",
    sections:[
      {
        titre:{fr:"La Transition et le silence (1975-2000)",
               es:"La Transición y el silencio (1975-2000)"},
        blocs:[
          { t:"p", c:{
            fr:"Après la mort de Franco (20 novembre 1975), la <strong>Transition</strong> repose sur un consensus entre réformistes du régime et opposition. La <strong>loi d'amnistie du 15 octobre 1977</strong> (Ley 46/1977), réclamée d'abord par la gauche pour libérer les prisonniers politiques, couvre aussi les crimes commis par les fonctionnaires et agents de l'ordre public : elle rend de fait impossible toute poursuite des crimes franquistes. La politologue <strong>Paloma Aguilar</strong> a montré que la peur de revivre une guerre civile a nourri un <strong>« pacte de l'oubli »</strong> (ou <em>pacto de silencio</em>) : on ne « jette pas le passé à la figure » de l'adversaire. La tentative de coup d'État du <strong>23-F</strong> (23 février 1981) renforce cette prudence.",
            es:"Tras la muerte de Franco (20 de noviembre de 1975), la <strong>Transición</strong> se basa en un consenso entre reformistas del régimen y oposición. La <strong>Ley de Amnistía del 15 de octubre de 1977</strong> (Ley 46/1977), reclamada primero por la izquierda para liberar a los presos políticos, cubre también los delitos cometidos por funcionarios y agentes del orden público: imposibilita de hecho cualquier persecución de los crímenes franquistas. La politóloga <strong>Paloma Aguilar</strong> mostró que el miedo a revivir una guerra civil alimentó un <strong>«pacto del olvido»</strong> (o <em>pacto de silencio</em>): no se «arroja el pasado» a la cara del adversario. El intento de golpe de Estado del <strong>23-F</strong> (23 de febrero de 1981) refuerza esa prudencia."} },
          { t:"p", c:{
            fr:"Ce silence n'est pas total : des pensions sont accordées aux veuves et mutilés républicains dès la fin des années 1970, et l'historiographie, le cinéma et la littérature explorent la guerre. Mais l'État ne mène <strong>ni commission de vérité, ni procès, ni exhumations</strong> : des dizaines de milliers de républicains restent dans des fosses communes, tandis que les « vainqueurs » avaient été honorés et inhumés dès l'après-guerre. Le Valle de los Caídos, où reposent Franco et José Antonio Primo de Rivera, demeure intact.",
            es:"Ese silencio no es total: desde finales de los setenta se conceden pensiones a viudas y mutilados republicanos, y la historiografía, el cine y la literatura exploran la guerra. Pero el Estado no emprende <strong>ni comisión de la verdad, ni juicios, ni exhumaciones</strong>: decenas de miles de republicanos siguen en fosas comunes, mientras que los «vencedores» fueron honrados e inhumados desde la posguerra. El Valle de los Caídos, donde yacen Franco y José Antonio Primo de Rivera, permanece intacto."} },
          { t:"encadre", icon:"⚠️", c:"var(--a4)",
            titre:{fr:"Erreur fréquente en dissertation", es:"Un error frecuente en el ensayo"},
            c2:{fr:"Parler d'« amnésie » espagnole est excessif : Paloma Aguilar et Santos Juliá soulignent que la guerre était très présente dans les esprits — c'est précisément ce souvenir qui a poussé à ne pas l'instrumentaliser politiquement. Le « pacte » est un <strong>oubli politique et judiciaire</strong>, non une absence de mémoire sociale.",
                es:"Hablar de «amnesia» española es excesivo: Paloma Aguilar y Santos Juliá subrayan que la guerra estaba muy presente en las mentes, y que fue precisamente ese recuerdo el que llevó a no instrumentalizarla políticamente. El «pacto» es un <strong>olvido político y judicial</strong>, no una ausencia de memoria social."} }
        ]

      {
        titre:{fr:"Le réveil de la mémoire : associations, lois et justice (2000-2019)",
               es:"El despertar de la memoria: asociaciones, leyes y justicia (2000-2019)"},
        blocs:[
          { t:"p", c:{
            fr:"En <strong>octobre 2000</strong>, le journaliste <strong>Emilio Silva</strong> fait exhumer à Priaranza del Bierzo (León) une fosse contenant treize républicains, dont son grand-père : c'est l'acte fondateur de l'<strong>Asociación para la Recuperación de la Memoria Histórica</strong> (ARMH). La « génération des petits-enfants », qui n'a pas vécu la guerre et ne se sent pas liée par le pacte de la Transition, réclame vérité et réparation. En 2002, le Congrès condamne unanimement le soulèvement de 1936, et l'ONU commence à interpeller l'Espagne sur ses disparus.",
            es:"En <strong>octubre de 2000</strong>, el periodista <strong>Emilio Silva</strong> promueve en Priaranza del Bierzo (León) la exhumación de una fosa con trece republicanos, entre ellos su abuelo: es el acto fundacional de la <strong>Asociación para la Recuperación de la Memoria Histórica</strong> (ARMH). La «generación de los nietos», que no vivió la guerra y no se siente atada por el pacto de la Transición, reclama verdad y reparación. En 2002, el Congreso condena por unanimidad el alzamiento de 1936, y la ONU empieza a interpelar a España por sus desaparecidos."} },
          { t:"p", c:{
            fr:"La <strong>loi de mémoire historique</strong> (Ley 52/2007, 26 décembre 2007), portée par le gouvernement Zapatero, reconnaît le caractère « injuste » des condamnations franquistes, étend les indemnisations, ordonne le retrait des symboles exaltant le soulèvement et la dictature, et prévoit une aide publique aux exhumations — qui restent toutefois à l'initiative des familles. Elle permet aussi aux petits-enfants d'exilés d'acquérir la nationalité espagnole. Critiquée à droite comme une réouverture des blessures, et à gauche comme trop timide (les sentences ne sont pas annulées), elle voit ses crédits supprimés sous le gouvernement Rajoy à partir de 2013.",
            es:"La <strong>Ley de Memoria Histórica</strong> (Ley 52/2007, de 26 de diciembre), impulsada por el gobierno de Zapatero, reconoce el carácter «injusto» de las condenas franquistas, amplía las indemnizaciones, ordena la retirada de los símbolos de exaltación del alzamiento y de la dictadura, y prevé ayudas públicas para las exhumaciones, que siguen dependiendo, sin embargo, de la iniciativa de las familias. También permite a los nietos de exiliados adquirir la nacionalidad española. Criticada por la derecha por reabrir heridas, y por la izquierda por tímida (las sentencias no se anulan), ve suprimidas sus partidas presupuestarias bajo el gobierno de Rajoy a partir de 2013."} },
          { t:"p", c:{
            fr:"Sur le plan judiciaire, le juge <strong>Baltasar Garzón</strong> se déclare compétent en octobre 2008 pour enquêter sur les disparitions du franquisme, qu'il qualifie de crimes contre l'humanité, et recense plus de <strong>114 000 disparus</strong>. Poursuivi pour prévarication, il est <strong>acquitté par le Tribunal suprême en février 2012</strong>, mais celui-ci ferme la voie pénale : amnistie, prescription et non-rétroactivité s'y opposent. (Garzón est la même année exclu de la magistrature dans une autre affaire, celle des écoutes du dossier Gürtel.) Les victimes se tournent alors vers l'étranger : en <strong>avril 2010</strong>, une plainte est déposée à Buenos Aires au nom de la <strong>compétence universelle</strong> — la <em>querella argentina</em>, instruite par la juge <strong>María Servini</strong>, la seule procédure pénale ouverte sur les crimes franquistes.",
            es:"En el plano judicial, el juez <strong>Baltasar Garzón</strong> se declara competente en octubre de 2008 para investigar las desapariciones del franquismo, que califica de crímenes contra la humanidad, y censa más de <strong>114.000 desaparecidos</strong>. Procesado por prevaricación, es <strong>absuelto por el Tribunal Supremo en febrero de 2012</strong>, pero este cierra la vía penal: la amnistía, la prescripción y la irretroactividad lo impiden. (Ese mismo año, Garzón es expulsado de la carrera judicial en otra causa, la de las escuchas del caso Gürtel.) Las víctimas se vuelven entonces hacia el extranjero: en <strong>abril de 2010</strong> se presenta en Buenos Aires una querella en virtud de la <strong>jurisdicción universal</strong> —la <em>querella argentina</em>, instruida por la jueza <strong>María Servini</strong>—, único procedimiento penal abierto sobre los crímenes franquistas."} },
          { t:"p", c:{
            fr:"Le <strong>24 octobre 2019</strong>, après une longue bataille judiciaire avec la famille et l'opposition du prieur bénédictin, le gouvernement de <strong>Pedro Sánchez</strong> fait exhumer la dépouille de Franco du Valle de los Caídos pour l'inhumer au cimetière de Mingorrubio (El Pardo), aux côtés de son épouse. L'événement, retransmis en direct, symbolise la fin du statut d'honneur du dictateur dans un monument public.",
            es:"El <strong>24 de octubre de 2019</strong>, tras una larga batalla judicial con la familia y la oposición del prior benedictino, el gobierno de <strong>Pedro Sánchez</strong> exhuma los restos de Franco del Valle de los Caídos para inhumarlos en el cementerio de Mingorrubio (El Pardo), junto a su esposa. El acontecimiento, retransmitido en directo, simboliza el fin del estatus de honor del dictador en un monumento público."} },

      {
        titre:{fr:"La loi de mémoire démocratique (2022) et ses contestations",
               es:"La Ley de Memoria Democrática (2022) y sus impugnaciones"},
        blocs:[
          { t:"p", c:{
            fr:"La <strong>loi 20/2022 du 19 octobre, de mémoire démocratique</strong>, adoptée de justesse, remplace celle de 2007 et fait de la recherche des disparus une <strong>responsabilité de l'État</strong>. Ses principales mesures : déclaration d'<strong>illégalité et de nullité</strong> des condamnations des tribunaux franquistes ; plan d'exhumations et <strong>banque nationale d'ADN</strong> ; création d'un <strong>procureur spécial</strong> (Fiscal de Sala de Derechos Humanos y Memoria Democrática) et d'une procédure de « déclaration judiciaire des faits passés » ; audit des biens spoliés ; inclusion de la mémoire démocratique dans les programmes scolaires ; interdiction des actes d'exaltation de la dictature et possibilité de dissoudre les fondations qui en font l'apologie (visant la Fundación Nacional Francisco Franco) ; nouvelle voie d'accès à la nationalité pour les descendants d'exilés. Elle institue deux journées : le <strong>31 octobre</strong>, hommage à toutes les victimes du coup d'État, de la guerre et de la dictature, et le <strong>8 mai</strong>, hommage aux victimes de l'exil.",
            es:"La <strong>Ley 20/2022, de 19 de octubre, de Memoria Democrática</strong>, aprobada por estrecho margen, sustituye a la de 2007 y convierte la búsqueda de desaparecidos en una <strong>responsabilidad del Estado</strong>. Sus principales medidas: declaración de <strong>ilegalidad y nulidad</strong> de las condenas de los tribunales franquistas; plan de exhumaciones y <strong>banco nacional de ADN</strong>; creación de una <strong>fiscalía especial</strong> (Fiscal de Sala de Derechos Humanos y Memoria Democrática) y de un procedimiento de «declaración judicial sobre hechos pasados»; auditoría de los bienes incautados; inclusión de la memoria democrática en los currículos escolares; prohibición de actos de exaltación de la dictadura y posibilidad de extinguir las fundaciones que hagan apología de ella (en referencia a la Fundación Nacional Francisco Franco); nueva vía de acceso a la nacionalidad para los descendientes de exiliados. Instituye dos jornadas: el <strong>31 de octubre</strong>, homenaje a todas las víctimas del golpe, la guerra y la dictadura, y el <strong>8 de mayo</strong>, homenaje a las víctimas del exilio."} },
          { t:"p", c:{
            fr:"L'article 54 rebaptise le Valle de los Caídos <strong>« Valle de Cuelgamuros »</strong> et en fait un lieu de mémoire démocratique : ses cryptes deviennent un cimetière civil, les actes d'exaltation y sont interdits et toute dépouille occupant une place prééminente doit être déplacée — d'où l'exhumation de <strong>José Antonio Primo de Rivera</strong> en avril 2023. Un accord avec le Vatican (février 2025) a permis d'engager la <strong>resignification</strong> du site, la basilique et la croix étant conservées, malgré des recours judiciaires de groupes nostalgiques. La loi est aussi le point de discorde le plus visible : le <strong>PP</strong> et <strong>Vox</strong> promettent de l'abroger, et des gouvernements régionaux PP-Vox ont adopté en 2024 des <em>leyes de concordia</em> (Aragon, Communauté valencienne) remplaçant les lois mémorielles régionales, critiquées par des rapporteurs de l'ONU et contestées par le gouvernement central devant le Tribunal constitutionnel.",
            es:"El artículo 54 renombra el Valle de los Caídos como <strong>«Valle de Cuelgamuros»</strong> y lo convierte en lugar de memoria democrática: sus criptas pasan a ser cementerio civil, se prohíben en él los actos de exaltación y todo resto mortal que ocupe un lugar preeminente debe ser reubicado, de ahí la exhumación de <strong>José Antonio Primo de Rivera</strong> en abril de 2023. Un acuerdo con el Vaticano (febrero de 2025) permitió emprender la <strong>resignificación</strong> del recinto, conservando la basílica y la cruz, pese a los recursos judiciales de grupos nostálgicos. La ley es también el principal foco de discordia: el <strong>PP</strong> y <strong>Vox</strong> prometen derogarla, y gobiernos autonómicos PP-Vox aprobaron en 2024 <em>leyes de concordia</em> (Aragón, Comunidad Valenciana) que sustituyen a las leyes autonómicas de memoria, criticadas por relatores de la ONU y recurridas por el Gobierno central ante el Tribunal Constitucional."} },
          { t:"encadre", icon:"🕊️", c:"var(--a3)",
            titre:{fr:"L'autre mémoire : les victimes du terrorisme", es:"La otra memoria: las víctimas del terrorismo"},
            c2:{fr:"La mémoire espagnole ne se limite pas au franquisme. Les victimes d'<strong>ETA</strong> (plus de 850 morts entre 1968 et 2010, dissolution en 2018) et du GAL font l'objet d'une loi spécifique (Ley 29/2011) et d'un <strong>Centre mémorial des victimes du terrorisme</strong> à Vitoria-Gasteiz, inauguré en 2021. La droite oppose souvent cette mémoire à la mémoire « historique », ce qui illustre la <strong>concurrence des mémoires</strong>.",
                es:"La memoria española no se limita al franquismo. Las víctimas de <strong>ETA</strong> (más de 850 muertos entre 1968 y 2010, disolución en 2018) y de los GAL son objeto de una ley específica (Ley 29/2011) y de un <strong>Centro Memorial de las Víctimas del Terrorismo</strong> en Vitoria-Gasteiz, inaugurado en 2021. La derecha suele contraponer esta memoria a la memoria «histórica», lo que ilustra la <strong>competencia de memorias</strong>."} },
          { t:"citation", c:{fr:"Ni olvido ni perdón : verdad, justicia y reparación", es:"Ni olvido ni perdón: verdad, justicia y reparación"},
            src:{fr:"Slogan courant des associations mémorielles espagnoles", es:"Lema habitual de las asociaciones memorialistas españolas"} }
        ]

      {
        titre:{fr:"« La memoria es democracia » : une mémoire qui divise encore",
               es:"«La memoria es democracia»: una memoria que todavía divide"},
        blocs:[
          { t:"p", c:{
            fr:"En octobre 2022, en accompagnant l'adoption de la loi, le gouvernement espagnol diffuse une campagne autour d'un slogan : <strong>« la memoria es democracia »</strong>. L'argument est que connaître le passé n'est pas un règlement de comptes mais une <strong>condition de la démocratie</strong> : reconnaître les victimes, restituer leur dignité, apprendre à identifier ce qui a rendu possible un coup d'État et une dictature, donc garantir la non-répétition. Aux images d'archives de la répression répondent celles des manifestations pour la liberté et des institutions démocratiques : la mémoire y est présentée comme le <em>récit fondateur</em> de la démocratie espagnole, et non comme un héritage partisan.",
            es:"En octubre de 2022, al acompañar la aprobación de la ley, el Gobierno español difunde una campaña en torno a un lema: <strong>«la memoria es democracia»</strong>. El argumento es que conocer el pasado no es un ajuste de cuentas sino una <strong>condición de la democracia</strong>: reconocer a las víctimas, devolverles su dignidad, aprender a identificar lo que hizo posible un golpe de Estado y una dictadura y, por tanto, garantizar la no repetición. A las imágenes de archivo de la represión responden las de las manifestaciones por la libertad y las de las instituciones democráticas: la memoria se presenta como el <em>relato fundacional</em> de la democracia española, y no como una herencia partidista."} },
          { t:"p", c:{
            fr:"Ce discours se heurte à une <strong>méconnaissance réelle du passé</strong>. Une enquête de 40dB pour <em>El País</em> publiée en novembre 2025, pour le cinquantenaire de la mort de Franco, montre que <strong>73,7 %</strong> des Espagnols jugent la démocratie préférable à toute autre forme de gouvernement, mais que <strong>17,4 %</strong> estiment que « dans certaines circonstances » un régime autoritaire peut être préférable — une proportion qui monte à près d'un jeune sur quatre chez la génération Z et les milléniaux. Une part importante des Espagnols ne sait pas situer dans le temps le début de la guerre civile, ignore que le conflit a commencé par un coup d'État militaire contre un <strong>gouvernement légitime</strong>, ou croit que les deux camps ont fait un nombre de morts comparable.",
            es:"Ese discurso choca con un <strong>desconocimiento real del pasado</strong>. Una encuesta de 40dB para <em>El País</em> publicada en noviembre de 2025, en el cincuentenario de la muerte de Franco, muestra que el <strong>73,7 %</strong> de los españoles considera la democracia preferible a cualquier otra forma de gobierno, pero que un <strong>17,4 %</strong> cree que «en determinadas circunstancias» un régimen autoritario puede ser preferible, proporción que sube a casi uno de cada cuatro jóvenes entre la generación Z y los <em>millennials</em>. Una parte importante de los españoles no sabe situar en el tiempo el inicio de la guerra civil, ignora que el conflicto empezó con un golpe de Estado militar contra un <strong>gobierno legítimo</strong>, o cree que ambos bandos causaron una cifra de muertos parecida."} },
          { t:"p", c:{
            fr:"L'<strong>école</strong> est devenue le terrain central de l'affrontement. La loi de 2022 impose d'enseigner la mémoire démocratique, mais les compétences éducatives sont transférées aux <strong>communautés autonomes</strong> : plusieurs dirigeants du PP qualifient ces contenus d'<em>« adoctrinamiento »</em>, et en novembre 2025 le gouvernement d'<strong>Isabel Díaz Ayuso</strong> retire un cours de formation destiné aux enseignants sur la façon d'aborder le franquisme en classe dans la Communauté de Madrid. Vox va plus loin : ses députés dénoncent une « mémoire sectaire », défendent une lecture d'équivalence entre les deux camps, voire relativisent la dictature. À cela s'ajoute une particularité espagnole : l'absence de <strong>condamnation collective et solennelle du franquisme</strong> comparable à la dénazification allemande, et l'absence de musée national de la guerre civile — ce qui explique que des initiatives mémorielles existent hors d'Espagne, comme le musée virtuel de la guerre civile hébergé au Canada (<em>vscw.ca</em>).",
            es:"La <strong>escuela</strong> se ha convertido en el terreno central del enfrentamiento. La ley de 2022 obliga a enseñar la memoria democrática, pero las competencias educativas están transferidas a las <strong>comunidades autónomas</strong>: varios dirigentes del PP califican esos contenidos de <em>«adoctrinamiento»</em>, y en noviembre de 2025 el gobierno de <strong>Isabel Díaz Ayuso</strong> retira un curso de formación para el profesorado sobre cómo abordar el franquismo en las aulas en la Comunidad de Madrid. Vox va más lejos: sus diputados denuncian una «memoria sectaria», defienden una lectura de equivalencia entre ambos bandos, e incluso relativizan la dictadura. A ello se suma una particularidad española: la ausencia de una <strong>condena colectiva y solemne del franquismo</strong> comparable a la desnazificación alemana, y la falta de un museo nacional de la guerra civil, lo que explica que existan iniciativas memorialistas fuera de España, como el museo virtual de la guerra civil alojado en Canadá (<em>vscw.ca</em>)."} },
          { t:"encadre", icon:"🏫", c:"var(--a4)",
            titre:{fr:"À retenir pour l'oral — pourquoi la mémoire est un enjeu démocratique", es:"Para el oral — por qué la memoria es un asunto democrático"},
            c2:{fr:"Trois arguments simples et réutilisables : <strong>1)</strong> sans vérité, les victimes restent des vaincus et non des citoyens réhabilités ; <strong>2)</strong> une société qui ignore comment une démocratie a été détruite est plus vulnérable aux discours autoritaires (d'où le lien entre méconnaissance du franquisme et tolérance envers l'autoritarisme chez les jeunes) ; <strong>3)</strong> la mémoire n'est démocratique que si elle reste <em>discutable</em> : elle établit des faits, pas une interprétation unique imposée par l'État.",
                es:"Tres argumentos sencillos y reutilizables: <strong>1)</strong> sin verdad, las víctimas siguen siendo vencidos y no ciudadanos rehabilitados; <strong>2)</strong> una sociedad que ignora cómo fue destruida una democracia es más vulnerable a los discursos autoritarios (de ahí el vínculo entre desconocimiento del franquismo y tolerancia hacia el autoritarismo entre los jóvenes); <strong>3)</strong> la memoria solo es democrática si sigue siendo <em>discutible</em>: establece hechos, no una interpretación única impuesta por el Estado."} }
        ]
      }

  {
    num:"III",
    kicker:{fr:"Le Cône Sud",es:"El Cono Sur"},
    titre:{fr:"Argentine et Chili : « Nunca Más » et la lutte contre l'impunité",
           es:"Argentina y Chile: «Nunca Más» y la lucha contra la impunidad"},
    couleur:"var(--a4)",
    sections:[
      {
        titre:{fr:"Argentine : un modèle de « Memoria, Verdad y Justicia »",
               es:"Argentina: un modelo de «Memoria, Verdad y Justicia»"},
        blocs:[
          { t:"p", c:{
            fr:"Le coup d'État du <strong>24 mars 1976</strong> installe le « Proceso de Reorganización Nacional » (1976-1983), dirigé par des juntes militaires (Videla, Massera, Agosti). Le <strong>terrorisme d'État</strong> repose sur quelque 800 centres clandestins de détention — dont l'<strong>ESMA</strong> (École de mécanique de la Marine) —, la torture, les « vols de la mort » et l'<strong>appropriation d'enfants</strong> nés en captivité. Dès <strong>avril 1977</strong>, des mères de disparus tournent autour de la pyramide de la place de Mai : les <strong>Madres de Plaza de Mayo</strong>, coiffées d'un foulard blanc, puis les <strong>Abuelas</strong> (fondées en 1977), qui recherchent leurs petits-enfants volés.",
            es:"El golpe del <strong>24 de marzo de 1976</strong> instaura el «Proceso de Reorganización Nacional» (1976-1983), dirigido por juntas militares (Videla, Massera, Agosti). El <strong>terrorismo de Estado</strong> se basa en unos 800 centros clandestinos de detención —entre ellos la <strong>ESMA</strong> (Escuela de Mecánica de la Armada)—, la tortura, los «vuelos de la muerte» y la <strong>apropiación de niños</strong> nacidos en cautiverio. Desde <strong>abril de 1977</strong>, madres de desaparecidos dan vueltas alrededor de la pirámide de Plaza de Mayo: las <strong>Madres de Plaza de Mayo</strong>, con su pañuelo blanco, y luego las <strong>Abuelas</strong> (fundadas en 1977), que buscan a sus nietos robados."} },
          { t:"p", c:{
            fr:"Après la défaite des Malouines, le président <strong>Raúl Alfonsín</strong> crée dès décembre 1983 la <strong>CONADEP</strong>, présidée par l'écrivain Ernesto Sabato. Son rapport <strong><em>Nunca Más</em></strong> (septembre 1984) documente <strong>8 961 disparitions</strong> et 340 centres clandestins ; il devient un best-seller et un modèle pour toute l'Amérique latine. En 1985, le <strong>procès des Juntes</strong> — conduit par le procureur <strong>Julio César Strassera</strong> — aboutit le 9 décembre à la condamnation à perpétuité de Videla et Massera : c'est le premier grand procès de dictateurs par une justice civile nationale depuis Nuremberg (évoqué par le film <em>Argentina, 1985</em>, 2022).",
            es:"Tras la derrota de Malvinas, el presidente <strong>Raúl Alfonsín</strong> crea en diciembre de 1983 la <strong>CONADEP</strong>, presidida por el escritor Ernesto Sabato. Su informe <strong><em>Nunca Más</em></strong> (septiembre de 1984) documenta <strong>8.961 desapariciones</strong> y 340 centros clandestinos; se convierte en un éxito editorial y en un modelo para toda América Latina. En 1985, el <strong>Juicio a las Juntas</strong> —conducido por el fiscal <strong>Julio César Strassera</strong>— culmina el 9 de diciembre con la condena a cadena perpetua de Videla y Massera: es el primer gran juicio a dictadores por una justicia civil nacional desde Núremberg (evocado por la película <em>Argentina, 1985</em>, 2022)."} },
          { t:"p", c:{
            fr:"Sous la pression militaire (soulèvements « carapintadas »), les lois de <strong>Point final</strong> (décembre 1986) et d'<strong>Obéissance due</strong> (juin 1987) arrêtent les poursuites, et <strong>Carlos Menem</strong> gracie les condamnés en 1989-1990. La société civile invente alors d'autres voies : « procès pour la vérité » sans condamnation, <em>escraches</em> de l'association <strong>H.I.J.O.S.</strong> (1995) devant le domicile des tortionnaires, aveux du capitaine <strong>Adolfo Scilingo</strong> sur les vols de la mort (1995), poursuites à l'étranger (Scilingo est condamné en Espagne en 2005). Sous <strong>Néstor Kirchner</strong>, le Congrès déclare nulles les lois d'impunité (2003) et la Cour suprême confirme leur inconstitutionnalité par l'<strong>arrêt Simón</strong> (14 juin 2005) : les procès pour crimes contre l'humanité reprennent et ont abouti à plus de <strong>1 100 condamnations</strong>.",
            es:"Bajo la presión militar (levantamientos «carapintadas»), las leyes de <strong>Punto Final</strong> (diciembre de 1986) y de <strong>Obediencia Debida</strong> (junio de 1987) frenan los procesos, y <strong>Carlos Menem</strong> indulta a los condenados en 1989-1990. La sociedad civil inventa entonces otras vías: «juicios por la verdad» sin condena, <em>escraches</em> de la agrupación <strong>H.I.J.O.S.</strong> (1995) ante los domicilios de los represores, confesión del capitán <strong>Adolfo Scilingo</strong> sobre los vuelos de la muerte (1995), procesos en el extranjero (Scilingo es condenado en España en 2005). Con <strong>Néstor Kirchner</strong>, el Congreso declara nulas las leyes de impunidad (2003) y la Corte Suprema confirma su inconstitucionalidad con el <strong>fallo Simón</strong> (14 de junio de 2005): se reabren los juicios por crímenes de lesa humanidad, que han desembocado en más de <strong>1.100 condenas</strong>."} },
          { t:"p", c:{
            fr:"La mémoire s'inscrit dans l'espace et le calendrier : le <strong>24 mars</strong> est depuis 2002 le « Jour national de la mémoire pour la vérité et la justice » (férié depuis 2006) ; l'ESMA est transformée en <strong>Espacio Memoria y Derechos Humanos</strong> (2004), et son Musée Site de Mémoire est inscrit au <strong>patrimoine mondial de l'UNESCO</strong> en 2023 ; le Parque de la Memoria longe le Río de la Plata. En 2017, l'arrêt « Muiña » de la Cour suprême, qui appliquait le calcul favorable du « 2x1 » à un condamné pour crimes contre l'humanité, provoque une manifestation massive et une loi l'interdisant aussitôt. Les Abuelas ont retrouvé <strong>140 petits-enfants</strong> (le dernier en juillet 2025), grâce notamment à la Banque nationale de données génétiques créée en 1987.",
            es:"La memoria se inscribe en el espacio y en el calendario: el <strong>24 de marzo</strong> es desde 2002 el «Día Nacional de la Memoria por la Verdad y la Justicia» (feriado desde 2006); la ESMA se transforma en <strong>Espacio Memoria y Derechos Humanos</strong> (2004), y su Museo Sitio de Memoria es inscrito en el <strong>Patrimonio Mundial de la UNESCO</strong> en 2023; el Parque de la Memoria bordea el Río de la Plata. En 2017, el fallo «Muiña» de la Corte Suprema, que aplicaba el cómputo favorable del «2x1» a un condenado por lesa humanidad, provoca una movilización masiva y una ley que lo prohíbe de inmediato. Las Abuelas han recuperado a <strong>140 nietos</strong> (el último en julio de 2025), gracias en particular al Banco Nacional de Datos Genéticos creado en 1987."} },
          { t:"encadre", icon:"⚠️", c:"var(--a4)",
            titre:{fr:"Actualité — la « mémoire complète » sous Milei", es:"Actualidad — la «memoria completa» bajo Milei"},
            c2:{fr:"Depuis décembre 2023, le gouvernement de <strong>Javier Milei</strong> et la vice-présidente <strong>Victoria Villarruel</strong> (fondatrice d'une association de « victimes du terrorisme » guérillero) défendent une <strong>« memoria completa »</strong> qui remet en cause le chiffre de 30 000 disparus et relativise le terrorisme d'État en l'assimilant à la violence des guérillas. Coupes budgétaires dans les politiques de mémoire, visite de députés libertariens à des tortionnaires emprisonnés (juillet 2024) : les organismes de droits humains dénoncent un <strong>négationnisme</strong>. Le 50e anniversaire du coup d'État (24 mars 2026) a été marqué par de grandes mobilisations.",
                es:"Desde diciembre de 2023, el gobierno de <strong>Javier Milei</strong> y la vicepresidenta <strong>Victoria Villarruel</strong> (fundadora de una asociación de «víctimas del terrorismo» guerrillero) defienden una <strong>«memoria completa»</strong> que cuestiona la cifra de 30.000 desaparecidos y relativiza el terrorismo de Estado al equipararlo con la violencia de las guerrillas. Recortes presupuestarios en las políticas de memoria, visita de diputados libertarios a represores presos (julio de 2024): los organismos de derechos humanos denuncian un <strong>negacionismo</strong>. El 50.º aniversario del golpe (24 de marzo de 2026) estuvo marcado por grandes movilizaciones."} }

      {
        titre:{fr:"Chili : la vérité d'abord, la justice « dans la mesure du possible »",

        blocs:[
          { t:"p", c:{
            fr:"Le coup d'État du <strong>11 septembre 1973</strong> contre Salvador Allende ouvre dix-sept ans de dictature d'<strong>Augusto Pinochet</strong> : Estadio Nacional transformé en camp, « Caravane de la mort », police politique DINA (dirigée par Manuel Contreras), centres de torture comme Villa Grimaldi, Londres 38 ou la Colonia Dignidad. Le <strong>décret-loi d'amnistie 2191 de 1978</strong> couvre les crimes de 1973-1978. Battu au <strong>plébiscite du 5 octobre 1988</strong> (victoire du « No »), Pinochet quitte la présidence en mars 1990 mais reste commandant en chef de l'armée jusqu'en 1998, puis sénateur à vie : la transition est <strong>sous tutelle</strong>.",
            es:"El golpe del <strong>11 de septiembre de 1973</strong> contra Salvador Allende abre diecisiete años de dictadura de <strong>Augusto Pinochet</strong>: Estadio Nacional convertido en campo de detención, «Caravana de la Muerte», policía política DINA (dirigida por Manuel Contreras), centros de tortura como Villa Grimaldi, Londres 38 o Colonia Dignidad. El <strong>Decreto Ley de Amnistía 2191 de 1978</strong> cubre los crímenes de 1973-1978. Derrotado en el <strong>plebiscito del 5 de octubre de 1988</strong> (victoria del «No»), Pinochet deja la presidencia en marzo de 1990 pero sigue siendo comandante en jefe del Ejército hasta 1998, y luego senador vitalicio: la transición está <strong>tutelada</strong>."} },
          { t:"p", c:{
            fr:"Le président <strong>Patricio Aylwin</strong> promet la justice « dans la mesure du possible » et crée la <strong>Commission nationale vérité et réconciliation</strong>, dite <strong>commission Rettig</strong>, dont le rapport (1991) établit la mort ou la disparition de plus de 2 000 personnes ; présentant ce rapport le 4 mars 1991, Aylwin <strong>demande pardon</strong> aux familles au nom de l'État. Le tournant vient de l'extérieur : l'<strong>arrestation de Pinochet à Londres</strong> le 16 octobre 1998, sur mandat du juge espagnol Garzón, brise son immunité symbolique. Rentré au Chili en mars 2000, il est poursuivi (juge Juan Guzmán) mais meurt le 10 décembre 2006 <strong>sans avoir été condamné</strong>. Les tribunaux chiliens contournent peu à peu l'amnistie en qualifiant les disparitions d'enlèvements permanents, et des centaines d'agents sont condamnés (Contreras cumule plusieurs siècles de peine).",
            es:"El presidente <strong>Patricio Aylwin</strong> promete justicia «en la medida de lo posible» y crea la <strong>Comisión Nacional de Verdad y Reconciliación</strong>, llamada <strong>Comisión Rettig</strong>, cuyo informe (1991) establece la muerte o desaparición de más de 2.000 personas; al presentarlo el 4 de marzo de 1991, Aylwin <strong>pide perdón</strong> a las familias en nombre del Estado. El giro llega desde fuera: la <strong>detención de Pinochet en Londres</strong> el 16 de octubre de 1998, por orden del juez español Garzón, quiebra su inmunidad simbólica. De vuelta en Chile en marzo de 2000, es procesado (juez Juan Guzmán) pero muere el 10 de diciembre de 2006 <strong>sin haber sido condenado</strong>. Los tribunales chilenos sortean poco a poco la amnistía calificando las desapariciones de secuestros permanentes, y cientos de agentes son condenados (Contreras acumula varios siglos de condena)."} },
          { t:"p", c:{
            fr:"La <strong>commission Valech</strong> (2003-2005, puis Valech II en 2010-2011) reconnaît la prison politique et la torture ; au total, l'État chilien reconnaît <strong>plus de 40 000 victimes</strong>, dont environ 3 200 morts et disparus. Les témoignages recueillis par Valech I sont toutefois frappés d'un <strong>secret de 50 ans</strong> (loi 19.992), très contesté. Le <strong>Musée de la Mémoire et des Droits humains</strong> ouvre en janvier 2010 ; en 2023, la Cour suprême confirme les condamnations pour l'assassinat du chanteur <strong>Víctor Jara</strong> (1973). Pour les <strong>50 ans du coup d'État</strong>, le président <strong>Gabriel Boric</strong> lance le <strong>Plan national de recherche</strong> (août 2023), qui fait pour la première fois de l'État le responsable de la recherche des quelque 1 469 victimes dont les restes n'ont pas été rendus ; mais la droite refuse de signer une déclaration commune, et une partie d'entre elle justifie encore le coup d'État.",
            es:"La <strong>Comisión Valech</strong> (2003-2005, y Valech II en 2010-2011) reconoce la prisión política y la tortura; en total, el Estado chileno reconoce <strong>más de 40.000 víctimas</strong>, de ellas unos 3.200 muertos y desaparecidos. Los testimonios recogidos por Valech I están, sin embargo, sujetos a un <strong>secreto de 50 años</strong> (Ley 19.992), muy cuestionado. El <strong>Museo de la Memoria y los Derechos Humanos</strong> abre en enero de 2010; en 2023, la Corte Suprema confirma las condenas por el asesinato del cantautor <strong>Víctor Jara</strong> (1973). Para los <strong>50 años del golpe</strong>, el presidente <strong>Gabriel Boric</strong> lanza el <strong>Plan Nacional de Búsqueda</strong> (agosto de 2023), que por primera vez hace al Estado responsable de buscar a las cerca de 1.469 víctimas cuyos restos no han sido entregados; pero la derecha se niega a firmar una declaración común, y una parte de ella sigue justificando el golpe."} },
          { t:"encadre", icon:"🔄", c:"var(--a2)",
            titre:{fr:"Actualité — le tournant Kast (2026)", es:"Actualidad — el giro de Kast (2026)"},
            c2:{fr:"Au pouvoir depuis <strong>mars 2026</strong>, le président d'extrême droite <strong>José Antonio Kast</strong>, défenseur déclaré de l'héritage de Pinochet, a remplacé les responsables du Programme des droits humains chargé du Plan national de recherche, tout en affirmant maintenir celui-ci, et a annoncé une révision de la liste officielle des disparus. Associations et juristes dénoncent un <strong>démantèlement progressif</strong> des politiques de mémoire (retrait des avocats de l'État de certaines procédures, abandon du projet de lieu de mémoire à la Colonia Dignidad, baisses de crédits).",
                es:"En el poder desde <strong>marzo de 2026</strong>, el presidente de ultraderecha <strong>José Antonio Kast</strong>, defensor declarado del legado de Pinochet, ha sustituido a las jefaturas del Programa de Derechos Humanos encargado del Plan Nacional de Búsqueda, aunque afirma mantenerlo, y ha anunciado una revisión del listado oficial de detenidos desaparecidos. Agrupaciones y juristas denuncian un <strong>desmantelamiento progresivo</strong> de las políticas de memoria (retiro de los abogados del Estado de algunas causas, abandono del proyecto de sitio de memoria en Colonia Dignidad, recortes presupuestarios)."} },

            titre:{fr:"Une tendance régionale à la réhabilitation des dictatures ?", es:"¿Una tendencia regional a la rehabilitación de las dictaduras?"},
            c2:{fr:"Les deux cas se répondent. En Argentine, <strong>Milei</strong> et <strong>Villarruel</strong> contestent le chiffre des 30 000 disparus et mettent sur le même plan terrorisme d'État et guérillas ; au Chili, <strong>Kast</strong> a nommé au gouvernement d'anciens avocats de Pinochet et fragilise les institutions de la mémoire. Points communs : relativisation du bilan des dictatures, valorisation de l'« ordre » face au « chaos » qui les aurait précédées, dénonciation d'une mémoire présentée comme un privilège de la gauche, et coupes budgétaires qui affaiblissent les politiques sans les abroger formellement. Nuance à garder : dans les deux pays, les <strong>condamnations judiciaires restent acquises</strong> et la société civile mémorielle demeure très mobilisée.",
                es:"Ambos casos se responden. En Argentina, <strong>Milei</strong> y <strong>Villarruel</strong> cuestionan la cifra de los 30.000 desaparecidos y equiparan terrorismo de Estado y guerrillas; en Chile, <strong>Kast</strong> ha nombrado en el gobierno a antiguos abogados de Pinochet y debilita la institucionalidad de la memoria. Puntos comunes: relativización del balance de las dictaduras, exaltación del «orden» frente al «caos» que las habría precedido, denuncia de una memoria presentada como un privilegio de la izquierda y recortes presupuestarios que debilitan las políticas sin derogarlas formalmente. Matiz que conviene guardar: en ambos países las <strong>condenas judiciales siguen firmes</strong> y la sociedad civil memorialista sigue muy movilizada."} }

  {

    kicker:{fr:"Mexique et Colombie",es:"México y Colombia"},
    titre:{fr:"Sans rupture de régime : mémoire coloniale au Mexique, conflit armé en Colombie",

    couleur:"var(--a3)",
    sections:[
      {
        titre:{fr:"Mexique : la mémoire de la colonisation, un enjeu diplomatique",
               es:"México: la memoria de la colonización, un asunto diplomático"},
        blocs:[
          { t:"p", c:{
            fr:"Au Mexique, la « labor de memoria » ne porte pas d'abord sur une dictature récente mais sur les <strong>injustices historiques issues de la colonisation</strong>. En <strong>mars 2019</strong>, le président <strong>Andrés Manuel López Obrador</strong> (AMLO) adresse une lettre au roi <strong>Felipe VI</strong> et au pape François pour leur demander des excuses publiques pour les <em>agravios</em> commis pendant la Conquête, dans la perspective des commémorations de 2021 (500 ans de la chute de Tenochtitlan, 200 ans de l'indépendance). Madrid rejette la demande « avec fermeté », ce qui provoque une <strong>crise diplomatique</strong> durable : AMLO gèle les relations, et sa successeuse <strong>Claudia Sheinbaum</strong> n'invite pas le roi à son investiture en octobre 2024 ; l'Espagne n'envoie aucun représentant officiel.",
            es:"En México, la labor de memoria no versa en primer lugar sobre una dictadura reciente, sino sobre las <strong>injusticias históricas derivadas de la colonización</strong>. En <strong>marzo de 2019</strong>, el presidente <strong>Andrés Manuel López Obrador</strong> (AMLO) envía una carta al rey <strong>Felipe VI</strong> y al papa Francisco pidiéndoles disculpas públicas por los <em>agravios</em> cometidos durante la Conquista, con vistas a las conmemoraciones de 2021 (500 años de la caída de Tenochtitlan, 200 de la independencia). Madrid rechaza la petición «con toda firmeza», lo que provoca una <strong>crisis diplomática</strong> duradera: AMLO congela las relaciones, y su sucesora <strong>Claudia Sheinbaum</strong> no invita al rey a su investidura en octubre de 2024; España no envía ninguna representación oficial."} },
          { t:"p", c:{
            fr:"Le dénouement intervient le <strong>16 mars 2026</strong> : en visitant à Madrid l'exposition <em>La mitad del mundo. La mujer en el México indígena</em>, prêtée par le Mexique au Musée archéologique national, <strong>Felipe VI</strong> reconnaît publiquement, pour la première fois, qu'il y a eu « <strong>beaucoup d'abus</strong> » et des « controverses morales et éthiques » pendant la Conquête, tout en appelant à les replacer dans leur contexte historique. Sheinbaum salue « un geste de rapprochement », en précisant que ce n'est « pas tout ce que nous aurions voulu » — il ne s'agit pas d'excuses officielles de l'État espagnol. En Espagne, la déclaration relance le débat sur la <em>leyenda negra</em> et le révisionnisme, la droite et Vox défendant une lecture glorieuse de l'<em>Hispanidad</em>.",
            es:"El desenlace llega el <strong>16 de marzo de 2026</strong>: al visitar en Madrid la exposición <em>La mitad del mundo. La mujer en el México indígena</em>, prestada por México al Museo Arqueológico Nacional, <strong>Felipe VI</strong> reconoce públicamente, por primera vez, que hubo «<strong>mucho abuso</strong>» y «controversias morales y éticas» durante la Conquista, aunque llama a situarlos en su contexto histórico. Sheinbaum saluda «un gesto de acercamiento», precisando que «no fue todo lo que hubiéramos querido»: no se trata de una disculpa oficial del Estado español. En España, la declaración reaviva el debate sobre la <em>leyenda negra</em> y el revisionismo, con la derecha y Vox defendiendo una lectura gloriosa de la <em>Hispanidad</em>."} },
          { t:"encadre", icon:"⚖️", c:"var(--a4)",
            titre:{fr:"La question clé — responsabilité de l'ancienne métropole ou du Mexique indépendant ?", es:"La pregunta clave — ¿responsabilidad de la antigua metrópoli o del México independiente?"},
            c2:{fr:"Réduire la marginalisation des peuples autochtones à la seule faute de l'Espagne coloniale donne une vision <strong>incomplète</strong>. Le <strong>Mexique indépendant</strong> (à partir de 1821) a lui aussi mené des politiques discriminatoires : dépossession des terres communales au XIX<sup>e</sup> siècle, guerres contre les Yaquis et les Mayas, castillanisation forcée à l'école, idéologie du <em>mestizaje</em> qui présentait l'indigène comme un passé à dépasser. Aujourd'hui encore, les populations indigènes cumulent les taux de pauvreté, d'analphabétisme et de mortalité les plus élevés. La mémoire coloniale peut donc servir à <strong>déplacer la responsabilité</strong> vers l'extérieur.",
                es:"Reducir la marginación de los pueblos originarios únicamente a la culpa de la España colonial ofrece una visión <strong>incompleta</strong>. El <strong>México independiente</strong> (desde 1821) también aplicó políticas discriminatorias: despojo de las tierras comunales en el siglo XIX, guerras contra yaquis y mayas, castellanización forzosa en la escuela, ideología del <em>mestizaje</em> que presentaba lo indígena como un pasado que había que superar. Todavía hoy, la población indígena concentra las mayores tasas de pobreza, analfabetismo y mortalidad. La memoria colonial puede servir, pues, para <strong>desplazar la responsabilidad</strong> hacia fuera."} }
        ]
      },
      {
        titre:{fr:"Mexique : dignifier les peuples autochtones, entre avancées et usages politiques",
               es:"México: dignificar a los pueblos originarios, entre avances y usos políticos"},
        blocs:[
          { t:"p", c:{
            fr:"Les gouvernements dits progressistes d'AMLO (2018-2024) et de Sheinbaum (depuis 2024) ont fait de la <strong>dignificación</strong> des peuples originaires un axe officiel : demandes de pardon de l'État aux peuples <strong>maya</strong> (2019) et <strong>yaqui</strong> (2021) pour les exterminations et les spoliations, restitution de terres, plans de justice territoriale, programmes sociaux ciblés, et une <strong>réforme constitutionnelle de 2024</strong> qui reconnaît les peuples indigènes et afro-mexicains comme <em>sujets de droit public</em>, avec un droit à la consultation préalable. Le récit officiel valorise les civilisations préhispaniques (« Mexico-Tenochtitlan, 700 ans ») et réhabilite les résistances indigènes.",
            es:"Los gobiernos llamados progresistas de AMLO (2018-2024) y de Sheinbaum (desde 2024) han hecho de la <strong>dignificación</strong> de los pueblos originarios un eje oficial: peticiones de perdón del Estado a los pueblos <strong>maya</strong> (2019) y <strong>yaqui</strong> (2021) por los exterminios y despojos, restitución de tierras, planes de justicia territorial, programas sociales dirigidos y una <strong>reforma constitucional de 2024</strong> que reconoce a los pueblos indígenas y afromexicanos como <em>sujetos de derecho público</em>, con derecho a la consulta previa. El relato oficial pone en valor las civilizaciones prehispánicas («México-Tenochtitlan, 700 años») y rehabilita las resistencias indígenas."} },
          { t:"p", c:{
            fr:"Mais plusieurs réalités interrogent l'<strong>efficacité et la sincérité</strong> de cette politique. Le <strong>Tren Maya</strong>, grand projet ferroviaire du Sud-Est présenté comme un outil de développement pour les communautés mayas, a été mené à marche forcée : consultations jugées insuffisantes par l'ONU, déforestation, atteintes aux cénotes, expropriations, chantier confié à l'armée et déclaré « de sécurité nationale » pour contourner les recours. Plus largement, la pauvreté, la violence des cartels et des formes d'<strong>exploitation extrême</strong> (travail forcé, esclavage moderne lié au narcotrafic) frappent d'abord les populations indigènes et migrantes. D'où la question à poser en dissertation : une mémoire officielle de la colonisation peut aussi servir à <strong>construire un récit national</strong> et à légitimer le pouvoir, sans se traduire en droits effectifs.",
            es:"Pero varias realidades cuestionan la <strong>eficacia y la sinceridad</strong> de esa política. El <strong>Tren Maya</strong>, gran proyecto ferroviario del sureste presentado como herramienta de desarrollo para las comunidades mayas, se llevó a cabo a marchas forzadas: consultas consideradas insuficientes por la ONU, deforestación, daños a los cenotes, expropiaciones, obra encargada al ejército y declarada «de seguridad nacional» para esquivar los recursos judiciales. De forma más amplia, la pobreza, la violencia de los cárteles y ciertas formas de <strong>explotación extrema</strong> (trabajo forzado, esclavitud moderna ligada al narcotráfico) golpean sobre todo a la población indígena y migrante. De ahí la pregunta que conviene plantear: una memoria oficial de la colonización también puede servir para <strong>construir un relato nacional</strong> y legitimar al gobierno, sin traducirse en derechos efectivos."} },
          { t:"encadre", icon:"🕳️", c:"var(--a2)",
            titre:{fr:"L'autre passé non jugé : Tlatelolco, la guerre sale et les disparus", es:"El otro pasado no juzgado: Tlatelolco, la guerra sucia y los desaparecidos"},
            c2:{fr:"Le Mexique n'a jamais jugé la répression du régime du PRI : massacre étudiant de <strong>Tlatelolco</strong> (2 octobre 1968), <em>Halconazo</em> (1971), « guerre sale » contre les guérillas. Le procureur spécial créé en 2001 (<strong>FEMOSPP</strong>) s'est achevé sans condamnation — l'ex-président <strong>Luis Echeverría</strong>, poursuivi pour génocide, fut définitivement blanchi en 2009 —, et une commission de vérité sur la période 1965-1990 a rendu en 2024 un rapport concluant que « ce fut l'État ». Cette impunité éclaire le présent : plus de <strong>125 000 disparus</strong> enregistrés depuis la « guerre contre le narcotrafic », l'affaire des <strong>43 d'Ayotzinapa</strong> (2014) et des <strong>madres buscadoras</strong> qui fouillent elles-mêmes les fosses.",
                es:"México nunca juzgó la represión del régimen del PRI: matanza estudiantil de <strong>Tlatelolco</strong> (2 de octubre de 1968), <em>Halconazo</em> (1971), «guerra sucia» contra las guerrillas. La fiscalía especial creada en 2001 (<strong>FEMOSPP</strong>) terminó sin condenas —el expresidente <strong>Luis Echeverría</strong>, procesado por genocidio, fue exonerado definitivamente en 2009— y una comisión de la verdad sobre el periodo 1965-1990 entregó en 2024 un informe que concluye que «fue el Estado». Esa impunidad ilumina el presente: más de <strong>125.000 desaparecidos</strong> registrados desde la «guerra contra el narcotráfico», el caso de los <strong>43 de Ayotzinapa</strong> (2014) y unas <strong>madres buscadoras</strong> que excavan ellas mismas las fosas."} },
          { t:"faits", items:[
            { l:{fr:"Demande d'excuses",es:"Petición de disculpas"}, v:{fr:"Lettre d'AMLO à Felipe VI, mars 2019",es:"Carta de AMLO a Felipe VI, marzo de 2019"} },
