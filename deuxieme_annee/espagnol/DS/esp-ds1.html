      {
        titre:{fr:"Colombie : une mémoire au cœur du conflit",
               es:"Colombia: una memoria en medio del conflicto"},
        blocs:[
          { t:"p", c:{
            fr:"Le conflit armé colombien, né dans le sillage de <em>La Violencia</em> (1948-1958) et de la naissance des guérillas <strong>FARC</strong> et <strong>ELN</strong> (1964), oppose l'État, les guérillas, les <strong>paramilitaires</strong> (AUC) et les narcotrafiquants. Le Registre unique des victimes compte <strong>plus de 9 millions de victimes</strong>, dont une majorité de déplacés internes. La démobilisation des paramilitaires encadrée par la loi <strong>Justicia y Paz</strong> (Ley 975 de 2005) crée un premier Groupe de mémoire historique ; son rapport <strong><em>¡Basta ya!</em></strong> (2013) évalue à environ 220 000 le nombre de morts entre 1958 et 2012.",
            es:"El conflicto armado colombiano, surgido a raíz de <em>La Violencia</em> (1948-1958) y del nacimiento de las guerrillas <strong>FARC</strong> y <strong>ELN</strong> (1964), enfrenta al Estado, las guerrillas, los <strong>paramilitares</strong> (AUC) y los narcotraficantes. El Registro Único de Víctimas cuenta <strong>más de 9 millones de víctimas</strong>, en su mayoría desplazados internos. La desmovilización paramilitar enmarcada por la ley de <strong>Justicia y Paz</strong> (Ley 975 de 2005) crea un primer Grupo de Memoria Histórica; su informe <strong><em>¡Basta ya!</em></strong> (2013) calcula en unos 220.000 los muertos entre 1958 y 2012."} },
          { t:"p", c:{
            fr:"La <strong>loi 1448 de 2011</strong> (loi des victimes et de restitution des terres), promulguée par <strong>Juan Manuel Santos</strong>, reconnaît l'existence d'un conflit armé, organise la réparation et crée le <strong>Centre national de mémoire historique</strong> (CNMH) ; le <strong>9 avril</strong> devient la journée nationale de la mémoire et de solidarité avec les victimes. L'<strong>accord de paix avec les FARC</strong>, rejeté de justesse par plébiscite le 2 octobre 2016 (50,2 % de « non »), est renégocié et signé le 24 novembre 2016. Il crée un <strong>Système intégral de vérité, justice, réparation et non-répétition</strong> à trois piliers : la <strong>Juridiction spéciale pour la paix</strong> (JEP), la <strong>Commission de la vérité</strong> et l'<strong>Unité de recherche des personnes disparues</strong> (UBPD). Santos reçoit le prix Nobel de la paix en 2016.",
            es:"La <strong>Ley 1448 de 2011</strong> (Ley de Víctimas y Restitución de Tierras), promulgada por <strong>Juan Manuel Santos</strong>, reconoce la existencia de un conflicto armado, organiza la reparación y crea el <strong>Centro Nacional de Memoria Histórica</strong> (CNMH); el <strong>9 de abril</strong> se convierte en el Día Nacional de la Memoria y Solidaridad con las Víctimas. El <strong>acuerdo de paz con las FARC</strong>, rechazado por estrecho margen en el plebiscito del 2 de octubre de 2016 (50,2 % por el «no»), se renegocia y se firma el 24 de noviembre de 2016. Crea un <strong>Sistema Integral de Verdad, Justicia, Reparación y No Repetición</strong> con tres pilares: la <strong>Jurisdicción Especial para la Paz</strong> (JEP), la <strong>Comisión de la Verdad</strong> y la <strong>Unidad de Búsqueda de Personas dadas por Desaparecidas</strong> (UBPD). Santos recibe el Premio Nobel de la Paz en 2016."} },
          { t:"p", c:{
            fr:"La <strong>Commission de la vérité</strong>, présidée par le jésuite <strong>Francisco de Roux</strong>, remet le 28 juin 2022 son rapport final <strong><em>Hay futuro si hay verdad</em></strong> : il estime à environ <strong>450 000</strong> le nombre d'homicides liés au conflit entre 1985 et 2018 et à plus de <strong>120 000</strong> celui des disparus. La <strong>JEP</strong> fonctionne par « macro-affaires » et privilégie une <strong>justice restaurative</strong> : les responsables qui reconnaissent leurs crimes reçoivent des « sanctions propres » (5 à 8 ans de restriction de liberté et de travaux réparateurs) plutôt que la prison. Elle a établi que <strong>6 402 civils</strong> ont été présentés comme des guérilleros tués au combat par l'armée entre 2002 et 2008 (<strong>« faux positifs »</strong>). Le <strong>16 septembre 2025</strong>, elle prononce sa première sentence : huit ans de sanction restaurative pour les sept membres du dernier Secrétariat des FARC (dont Rodrigo Londoño, « Timochenko »), responsables d'une politique d'enlèvements ayant fait plus de 21 000 victimes — une décision jugée trop clémente par des victimes comme Íngrid Betancourt.",
            es:"La <strong>Comisión de la Verdad</strong>, presidida por el jesuita <strong>Francisco de Roux</strong>, entrega el 28 de junio de 2022 su informe final <strong><em>Hay futuro si hay verdad</em></strong>: estima en unos <strong>450.000</strong> los homicidios ligados al conflicto entre 1985 y 2018 y en más de <strong>120.000</strong> los desaparecidos. La <strong>JEP</strong> funciona por «macrocasos» y privilegia una <strong>justicia restaurativa</strong>: los responsables que reconocen sus crímenes reciben «sanciones propias» (de 5 a 8 años de restricción de libertad y trabajos reparadores) en lugar de cárcel. Ha establecido que <strong>6.402 civiles</strong> fueron presentados por el ejército como guerrilleros muertos en combate entre 2002 y 2008 (<strong>«falsos positivos»</strong>). El <strong>16 de septiembre de 2025</strong> dicta su primera sentencia: ocho años de sanción restaurativa para los siete miembros del último Secretariado de las FARC (entre ellos Rodrigo Londoño, «Timochenko»), responsables de una política de secuestros con más de 21.000 víctimas, una decisión considerada demasiado indulgente por víctimas como Íngrid Betancourt."} },
          { t:"encadre", icon:"🎨", c:"var(--a3)",
            titre:{fr:"Des mémoires disputées et créatrices", es:"Memorias disputadas y creadoras"},
            c2:{fr:"La mémoire colombienne est un terrain de lutte : en 2019, la nomination à la tête du CNMH de l'historien <strong>Darío Acevedo</strong>, qui contestait l'existence même d'un « conflit armé », provoque le retrait de nombreuses victimes. Elle est aussi très créative : l'artiste <strong>Doris Salcedo</strong> a réalisé <em>Fragmentos</em> (2018), un « contre-monument » dont le sol est fait des armes fondues des FARC ; des victimes ont créé des salons de mémoire locaux (Salón del Nunca Más de Granada, Antioquia) ; à Medellín, les fouilles de <strong>La Escombrera</strong> (Comuna 13) ont mis au jour en 2024-2025 des restes humains liés à l'opération Orión (2002).",
                es:"La memoria colombiana es un terreno de disputa: en 2019, el nombramiento al frente del CNMH del historiador <strong>Darío Acevedo</strong>, que cuestionaba la existencia misma de un «conflicto armado», provoca la retirada de numerosas víctimas. También es muy creativa: la artista <strong>Doris Salcedo</strong> realizó <em>Fragmentos</em> (2018), un «contramonumento» cuyo suelo está hecho con las armas fundidas de las FARC; víctimas han creado salones de memoria locales (Salón del Nunca Más de Granada, Antioquia); en Medellín, las excavaciones de <strong>La Escombrera</strong> (Comuna 13) sacaron a la luz en 2024-2025 restos humanos vinculados a la Operación Orión (2002)."} },
          { t:"p", c:{
            fr:"Enquêter et juger y est particulièrement difficile. Le conflit est <strong>long, fragmenté et toujours vivant</strong> : des dizaines de groupes armés (guérillas, paramilitaires, dissidences des FARC, groupes narcotrafiquants), des victimes souvent pauvres et rurales, des témoins menacés, une <strong>collusion</strong> ancienne entre certains secteurs politiques, militaires et économiques et le paramilitarisme (scandale de la <em>parapolítica</em>), et l'assassinat continu de leaders sociaux et d'anciens combattants démobilisés. Comme il n'y a pas eu de vainqueur ni de rupture de régime, la justice doit fonctionner <strong>pendant</strong> la guerre, et non après elle.",
            es:"Investigar y juzgar resulta allí especialmente difícil. El conflicto es <strong>largo, fragmentado y todavía vivo</strong>: decenas de grupos armados (guerrillas, paramilitares, disidencias de las FARC, grupos narcotraficantes), víctimas a menudo pobres y rurales, testigos amenazados, una vieja <strong>connivencia</strong> entre ciertos sectores políticos, militares y económicos y el paramilitarismo (escándalo de la <em>parapolítica</em>), y el asesinato continuo de líderes sociales y de excombatientes desmovilizados. Como no hubo vencedor ni ruptura de régimen, la justicia debe funcionar <strong>durante</strong> la guerra, y no después de ella."} },
          { t:"encadre", icon:"⚖️", c:"var(--a4)",
            titre:{fr:"Débat — « La JEP n'est pas un tribunal, c'est un directoire politique »", es:"Debate — «La JEP no es un tribunal judicial, sino un directorio político»"},
            c2:{fr:"C'est l'accusation portée par ses adversaires, à commencer par le camp d'Álvaro Uribe : la JEP serait partiale, trop clémente envers les FARC (dont sept dirigeants ont obtenu huit ans de travaux réparateurs <strong>sans prison</strong>, tout en ayant siégé au Congrès), et instrumentalisée contre les militaires. Ses défenseurs répondent qu'elle est une juridiction constitutionnelle issue de l'accord de paix, qu'elle a obtenu des <strong>reconnaissances de responsabilité inédites</strong> — impossibles dans un procès ordinaire — et qu'elle a établi l'ampleur des « faux positifs ». Le débat est celui de toute justice transitionnelle : <strong>combien de justice peut-on échanger contre la vérité et la paix ?</strong>",
                es:"Es la acusación de sus adversarios, empezando por el sector de Álvaro Uribe: la JEP sería parcial, demasiado indulgente con las FARC (siete de cuyos dirigentes obtuvieron ocho años de trabajos reparadores <strong>sin cárcel</strong>, habiendo ocupado además escaños en el Congreso) e instrumentalizada contra los militares. Sus defensores responden que es una jurisdicción constitucional nacida del acuerdo de paz, que ha logrado <strong>reconocimientos de responsabilidad inéditos</strong> —imposibles en un proceso ordinario— y que estableció la magnitud de los «falsos positivos». El debate es el de toda justicia transicional: <strong>¿cuánta justicia puede canjearse por verdad y paz?</strong>"} },
          { t:"p", c:{
            fr:"La mémoire colombienne dépend aussi des alternances. Sous <strong>Gustavo Petro</strong> (2022-2026), la politique de « <em>paz total</em> » — négocier avec tous les groupes armés à la fois — n'a pas mis fin aux violences, et le pays reste difficile à réconcilier. Depuis le <strong>7 août 2026</strong>, le nouveau président <strong>Abelardo de la Espriella</strong>, élu sur un programme d'ordre et de fermeté, propose notamment la <strong>suppression de la JEP</strong> : le système issu de l'accord de 2016 se trouve menacé au moment même où il commence à rendre ses premières décisions.",
            es:"La memoria colombiana depende también de las alternancias. Con <strong>Gustavo Petro</strong> (2022-2026), la política de «<em>paz total</em>» —negociar con todos los grupos armados a la vez— no puso fin a la violencia, y el país sigue siendo difícil de reconciliar. Desde el <strong>7 de agosto de 2026</strong>, el nuevo presidente <strong>Abelardo de la Espriella</strong>, elegido con un programa de orden y mano dura, plantea entre otras cosas la <strong>eliminación de la JEP</strong>: el sistema surgido del acuerdo de 2016 queda amenazado justo cuando empieza a dictar sus primeras decisiones."} },
          { t:"faits", items:[
            { l:{fr:"Victimes enregistrées",es:"Víctimas registradas"}, v:{fr:"Plus de 9 millions (majoritairement déplacés)",es:"Más de 9 millones (mayoritariamente desplazados)"} },

  {

    kicker:{fr:"Les enjeux",es:"Los retos"},
    titre:{fr:"Circulations, acteurs et limites du travail de mémoire",

    couleur:"var(--a2)",
    sections:[
      {
        titre:{fr:"Une mémoire transnationale : justice universelle et circulation des modèles",
               es:"Una memoria transnacional: jurisdicción universal y circulación de modelos"},
        blocs:[
          { t:"p", c:{
            fr:"Le monde hispanique forme un <strong>espace mémoriel connecté</strong>. L'Espagne, qui ne jugeait pas ses propres crimes, a jugé ceux des dictatures latino-américaines : arrestation de Pinochet (1998), extradition depuis le Mexique du militaire argentin <strong>Ricardo Cavallo</strong> (2003), condamnation de Scilingo (2005). En retour, l'Argentine instruit les crimes franquistes (2010). Les réformes de 2009 et 2014 ont toutefois fortement restreint la compétence universelle des juges espagnols. Les modèles circulent aussi : le titre <em>Nunca Más</em> a été repris au Brésil, en Uruguay, au Paraguay, en Colombie ; la <strong>Cour interaméricaine des droits de l'homme</strong> a posé dans l'arrêt <em>Barrios Altos</em> (Pérou, 2001) que les amnisties couvrant des violations graves sont incompatibles avec la Convention américaine.",
            es:"El mundo hispánico forma un <strong>espacio memorial conectado</strong>. España, que no juzgaba sus propios crímenes, juzgó los de las dictaduras latinoamericanas: detención de Pinochet (1998), extradición desde México del militar argentino <strong>Ricardo Cavallo</strong> (2003), condena de Scilingo (2005). A su vez, Argentina investiga los crímenes franquistas (2010). Las reformas de 2009 y 2014 restringieron, sin embargo, fuertemente la jurisdicción universal de los jueces españoles. Los modelos también circulan: el título <em>Nunca Más</em> se retomó en Brasil, Uruguay, Paraguay o Colombia; la <strong>Corte Interamericana de Derechos Humanos</strong> estableció en la sentencia <em>Barrios Altos</em> (Perú, 2001) que las amnistías que cubren violaciones graves son incompatibles con la Convención Americana."} },
          { t:"liste", items:{
            fr:[
              "<strong>Les familles et les associations</strong> — Madres et Abuelas (AR), Agrupación de Familiares de Detenidos Desaparecidos (CL), ARMH (ES), madres buscadoras (MX), mouvements de victimes (CO) : les premiers et plus constants « entrepreneurs de mémoire ».",

let LANG = 'fr';
/* T() : renvoie la version dans la langue courante, ou la valeur telle quelle */
const T = v => (v && typeof v==='object' && !Array.isArray(v) && ('fr' in v||'es' in v)) ? (v[LANG] ?? v.fr) : v;

/* ─── Libellés d'interface ─── */
const UI = {
  fr:{ chrono:"Chronologie",
       essentiel:"L'essentiel", reperes:"Repères", quiEstQui:"Qui est qui", acteurs:"Acteurs clés",
       controverse:"Controverse", vocab:"Vocabulaire", lexique:"Lexique bilingue",
       filtrer:"Filtrer le lexique…", terme:"Terme", trad:"Traduction / usage",
       entrainement:"Entraînement", sujets:"Sujets possibles", memoriser:"Mémoriser",
       retenir:"À retenir", synthese:"Synthèse", chapitre:"Chapitre" },
  es:{ chrono:"Cronología",
       essentiel:"Lo esencial", reperes:"Hitos", quiEstQui:"Quién es quién", acteurs:"Actores clave",
       controverse:"Controversia", vocab:"Vocabulario", lexique:"Glosario bilingüe",
       filtrer:"Filtrar el glosario…", terme:"Término", trad:"Traducción / uso",
       entrainement:"Entrenamiento", sujets:"Posibles temas", memoriser:"Memorizar",
       retenir:"Para recordar", synthese:"Síntesis", chapitre:"Capítulo" }
};
const t = k => UI[LANG][k];

/* ─── Rendu des blocs de contenu ─── */
function bloc(b){
  switch(b.t){
    case 'p':      return `<p class="prose">${T(b.c)}</p>`;
    case 'liste':  return `<ul class="liste">${T(b.items).map(i=>`<li>${i}</li>`).join('')}</ul>`;
    case 'faits':  return `<div class="faits">${T(b.items).map(i=>
                     `<div class="fait"><div class="fait-l">${T(i.l)}</div><div class="fait-v">${T(i.v)}</div></div>`).join('')}</div>`;
    case 'stats':  return `<div class="stats">${b.items.map(i=>
                     `<div class="stat" style="--c:${i.c||'var(--a1)'}"><span class="stat-n">${T(i.n)}</span><span class="stat-d">${T(i.d)}</span></div>`).join('')}</div>`;
    case 'citation':return `<blockquote class="citation"><p>« ${T(b.c)} »</p><cite>${T(b.src)}</cite></blockquote>`;
    case 'encadre':return `<div class="encadre" style="--c:${b.c||'var(--a2)'}"><div class="encadre-ic">${b.icon||'💡'}</div>
                     <div><div class="encadre-t">${T(b.titre)}</div><div class="encadre-c">${T(b.c2)}</div></div></div>`;
    case 'def':    return `<div class="def"><div class="def-mot">${T(b.mot)}</div><div class="def-c">${T(b.c)}</div></div>`;
    case 'tableau':return `<div class="tbl-wrap"><table><thead><tr>${T(b.head).map(h=>`<th>${h}</th>`).join('')}</tr></thead>
                     <tbody>${T(b.rows).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tl':     return `<div class="tl">${T(b.items).map(i=>
                     `<div class="tl-item"><div class="tl-d">${T(i.d)}</div><div class="tl-c">${T(i.c)}</div></div>`).join('')}</div>`;
    default:       return '';
  }
}

/* ─── En-tête ─── */
function rendreHero(){
  const m = COURS.meta;
  document.documentElement.dataset.theme = m.theme;
  document.documentElement.lang = LANG;
  document.title = T(m.titre) + ' — Civilisation';
  $('#bc-titre').textContent = m.titre.fr ?? m.titre;   // la nav reste en français
  const pied = m.pied ? T(m.pied) : `${t('chapitre')} ${m.chapitre}`;
  $('#ft').textContent = `${pied}${LANG==='fr'?' : ':': '}${T(m.titre)}`;
  $('#hero').innerHTML = `
    <span class="hero-flag">${m.drapeau}</span>
    <div class="hero-label">${T(m.label)}</div>
    <h1>${T(m.titre)}</h1>
    <p class="hero-sub">${T(m.sousTitre)}</p>`;
}

/* ─── Corps du cours ─── */
function rendreCours(){
  const c = COURS, out = [];

  out.push(`<section class="bloc rev" id="s-essentiel">
    <div class="essentiel"><div class="essentiel-label">${t('essentiel')}</div><p>${T(c.essentiel)}</p></div>
  </section>`);

  if(c.chronologie?.length){
    out.push(`<section class="bloc rev chrono-mobile" id="s-chrono">
      <div class="bloc-head"><span class="bloc-kicker">${t('reperes')}</span><h2 class="bloc-title">${t('chrono')}</h2></div>
      ${bloc({t:'tl',items:c.chronologie})}</section>`);
  }

  c.parties.forEach((p,pi)=>{
    let html = `<section class="partie rev" id="p-${pi}" style="--p:${p.couleur}">
      <div class="partie-head"><div class="partie-num">${p.num}</div>
      <div><div class="partie-kicker">${T(p.kicker)}</div><h2 class="partie-title">${T(p.titre)}</h2></div></div>`;
    p.sections.forEach((s,si)=>{
      html += `<div class="section" id="p-${pi}-${si}"><h3 class="section-title"><span class="section-num">${si+1}.</span> ${T(s.titre)}</h3>
        ${s.blocs.map(bloc).join('')}</div>`;
    });
    out.push(html+`</section>`);
  });

  if(c.acteurs?.length){
    out.push(`<section class="bloc rev" id="s-acteurs">
      <div class="bloc-head"><span class="bloc-kicker">${t('quiEstQui')}</span><h2 class="bloc-title">${t('acteurs')}</h2></div>
      <div class="acteurs">${c.acteurs.map(a=>
        `<div class="acteur" style="--c:${a.c}"><div class="acteur-nom">${a.nom}</div>
         <div class="acteur-role">${T(a.role)}</div><div class="acteur-c">${T(a.d)}</div></div>`).join('')}</div></section>`);
  }

  if(c.debat){
    out.push(`<section class="bloc rev" id="s-debat">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a4)">${t('controverse')}</span>
      <h2 class="bloc-title">${T(c.debat.question)}</h2></div>
      <div class="debat">
        <div class="debat-col oui"><div class="debat-t">${T(c.debat.oui.titre)}</div>
          <ul>${T(c.debat.oui.items).map(i=>`<li>${i}</li>`).join('')}</ul></div>
        <div class="debat-col non"><div class="debat-t">${T(c.debat.non.titre)}</div>
          <ul>${T(c.debat.non.items).map(i=>`<li>${i}</li>`).join('')}</ul></div>
      </div>
      ${c.debat.synthese?`<div class="encadre" style="--c:var(--a1);margin-top:14px">
        <div class="encadre-ic">⚖️</div><div><div class="encadre-t">${t('synthese')}</div>
        <div class="encadre-c">${T(c.debat.synthese)}</div></div></div>`:''}
    </section>`);
  }

  if(c.lexique?.length){
    out.push(`<section class="bloc rev" id="s-lexique">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a2)">${t('vocab')}</span>
      <h2 class="bloc-title">${t('lexique')}</h2></div>
      <input class="lex-search" id="lex-search" placeholder="${t('filtrer')}" aria-label="${t('filtrer')}">
      <div class="tbl-wrap"><table class="lex"><thead><tr><th>${t('terme')}</th><th>${t('trad')}</th></tr></thead>
      <tbody id="lex-body">${c.lexique.map(l=>`<tr><td>${l.es}</td><td>${l.fr}</td></tr>`).join('')}</tbody></table></div>
    </section>`);
  }

  if(c.sujets?.length){
    out.push(`<section class="bloc rev" id="s-sujets">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a4)">${t('entrainement')}</span>
      <h2 class="bloc-title">${t('sujets')}</h2></div>
      ${c.sujets.map((s,i)=>`<div class="sujet"><div class="sujet-n">${String(i+1).padStart(2,'0')}</div>
        <div><div class="sujet-q">${T(s.q)}</div><div class="sujet-h">${T(s.h)}</div></div></div>`).join('')}</section>`);
  }

  if(c.retenir?.length){
    out.push(`<section class="bloc rev" id="s-retenir">
      <div class="bloc-head"><span class="bloc-kicker">${t('memoriser')}</span><h2 class="bloc-title">${t('retenir')}</h2></div>
      <div class="retenir"><ul>${T(c.retenir).map(r=>`<li>${r}</li>`).join('')}</ul></div></section>`);
  }

  $('#cours').innerHTML = out.join('');
}

/* ─── Colonne chronologie ─── */
function rendreRail(){
  if(!COURS.chronologie?.length){ $('#rail')?.remove(); return; }
  $('#rail').innerHTML = `<div class="rail-title">${t('chrono')}</div>${bloc({t:'tl',items:COURS.chronologie})}`;
}

/* ─── Recherche dans le lexique ─── */
function brancherLexique(){
  const ls = $('#lex-search'); if(!ls) return;
  ls.addEventListener('input', ()=>{
    const q = ls.value.toLowerCase().trim();
    $('#lex-body').querySelectorAll('tr').forEach(tr=>{
      tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
}

/* ─── Changement de langue ─── */
function setLang(lang){
  LANG = lang;
  $('#ap-btn-fr').classList.toggle('active', lang==='fr');
  $('#ap-btn-es').classList.toggle('active', lang==='es');
  rendreHero(); rendreCours(); rendreRail();
  document.querySelectorAll('.rev').forEach(el=>el.classList.add('vu'));
  brancherLexique();
}

/* ─── Démarrage ─── */
function demarrer(){
  rendreHero(); rendreCours(); rendreRail(); brancherLexique();

  const maj = ()=>{
    const h = document.body.scrollHeight - innerHeight;
    $('#progress').style.width = (h>0 ? (scrollY/h)*100 : 0) + '%';
  };
  addEventListener('scroll', maj, {passive:true}); maj();

  if(!('IntersectionObserver' in window)){
    document.querySelectorAll('.rev').forEach(el=>el.classList.add('vu'));
    return;
  }
  const io = new IntersectionObserver(es=>es.forEach(x=>{
    if(x.isIntersecting){ x.target.classList.add('vu'); io.unobserve(x.target); }
  }), {threshold:.06});
  document.querySelectorAll('.rev').forEach(el=>io.observe(el));
}

/* ─── Impression : tout afficher, lexique complet ─── */
addEventListener('beforeprint', ()=>{
  document.querySelectorAll('.rev').forEach(el=>el.classList.add('vu'));
  const ls = $('#lex-search'); if(ls && ls.value){ ls.value=''; ls.dispatchEvent(new Event('input')); }
});

demarrer();
</script>
</body>
</html>
