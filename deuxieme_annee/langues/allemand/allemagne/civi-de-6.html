<!DOCTYPE html>
<html lang="fr" data-theme="allemand6">
<head>
<script src="../../../../auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Travail de Mémoire — Civilisation Germanophone</title>
<link rel="stylesheet" href="../../../../fonts/fonts.css">

<!-- ══════════════════════════════════════════════════════════════════════
     TEMPLATE UNIVERSEL DE COURS DE CIVILISATION — v1
     Pour créer un nouveau cours : dupliquer ce fichier, ne modifier QUE
     le bloc de données (id="donnees") tout en bas. Rien d'autre à toucher.
     ══════════════════════════════════════════════════════════════════════ -->

<style>
  /* ─── PALETTE DE BASE (identique au site) ─── */
  :root{
    --bg:#0d0d0f; --surface:#16161a; --surface2:#1e1e24; --border:#2a2a35;
    --text:#e8e6e0; --text-dim:#8a8880; --text-faint:#4a4845;
    --radius:14px;
  }
  /* ─── THÈMES PAR LANGUE — change data-theme sur <html> ─── */
  html[data-theme="anglais"] { --a1:#c8a96e; --a2:#7c9ec9; --a3:#9ecba0; --a4:#c97c9e; --hero:#16233d; }
  html[data-theme="anglais2"] { --a1:#c9633f; --a2:#5b8f6f; --a3:#6c8fc7; --a4:#a06bb0; --hero:#16241b; }
  html[data-theme="espagnol"]{ --a1:#e0a93e; --a2:#c8553d; --a3:#7fae7a; --a4:#b06fa8; --hero:#3a1a18; }
  html[data-theme="espagnol2"]{ --a1:#b89355; --a2:#6b7d63; --a3:#8c5a4a; --a4:#5f7690; --hero:#211a14; }
  html[data-theme="allemand6"]{ --a1:#d4829a; --a2:#6fb0b8; --a3:#9ab86a; --a4:#8a8fd6; --hero:#1d1417; }
  html[data-theme="allemand5"]{ --a1:#b392e6; --a2:#e5927c; --a3:#7fc7a2; --a4:#e4c76e; --hero:#1b1531; }
  html[data-theme="allemand4"]{ --a1:#d0584b; --a2:#8aa8c6; --a3:#d8bb6c; --a4:#7fae8d; --hero:#2a1618; }
  html[data-theme="allemand3"]{ --a1:#d08a54; --a2:#4f9aa8; --a3:#a3b86c; --a4:#9a72b8; --hero:#102129; }
  html[data-theme="allemand"]{ --a1:#d8b44a; --a2:#8fa4bd; --a3:#84b58e; --a4:#c06060; --hero:#241f1a; }
  html[data-theme="italien"] { --a1:#d5a94e; --a2:#6fae8f; --a3:#a8c07a; --a4:#c4695e; --hero:#152a24; }
  html[data-theme="chinois"] { --a1:#d9a441; --a2:#c05a4a; --a3:#83a98f; --a4:#a97fb0; --hero:#2c1618; }

  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;overflow-x:hidden}

  /* ─── FOND ─── */
  .bg-orb{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;opacity:.08;z-index:0}
  .orb1{width:700px;height:700px;background:var(--a1);top:-300px;right:-250px}
  .orb2{width:600px;height:600px;background:var(--a2);bottom:-250px;left:-250px}

  /* ─── BARRE DE PROGRESSION ─── */
  #progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:200;
    background:linear-gradient(90deg,var(--a1),var(--a2),var(--a4));transition:width .1s linear}

  /* ─── NAV ─── */
  nav{display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding:16px 40px;border-bottom:1px solid var(--border);
    background:rgba(13,13,15,.9);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100}
  .nav-logo{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;color:var(--a1);cursor:pointer}
  .breadcrumb{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--text-dim);flex-wrap:wrap}
  .breadcrumb span{cursor:pointer;transition:color .2s}
  .breadcrumb span:hover{color:var(--a1)}
  .breadcrumb .sep{color:var(--text-faint);cursor:default}
  .breadcrumb .current{color:var(--text);cursor:default}
  .nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .ap-lang-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    color:rgba(255,255,255,.6);font-family:'DM Mono',monospace;font-size:10px;font-weight:700;
    letter-spacing:.12em;padding:5px 14px;border-radius:4px;cursor:pointer;transition:all .2s;text-transform:uppercase}
  .ap-lang-btn.active{background:var(--a1);border-color:var(--a1);color:#12100c}
  .ap-lang-btn:hover:not(.active){background:rgba(255,255,255,.15);color:#fff}

  /* ─── HERO ─── */
  .hero{position:relative;z-index:1;padding:76px 40px 56px;text-align:center;overflow:hidden;
    background:linear-gradient(160deg,var(--hero),#0d0d0f 85%);border-bottom:1px solid var(--border)}
  .hero::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
    width:80px;height:2px;background:var(--a1)}
  .hero-flag{font-size:2.6rem;line-height:1;margin-bottom:18px;display:block}
  .hero-label{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.3em;
    text-transform:uppercase;color:var(--a1);margin-bottom:18px}
  .hero h1 .amp{font-family:'DM Sans',sans-serif;font-weight:400}
  .hero h1{font-family:'Playfair Display',serif;font-weight:900;line-height:1.05;
    font-size:clamp(2.4rem,6vw,4.6rem);max-width:900px;margin:0 auto 18px}
  .hero-sub{font-size:1rem;color:var(--text-dim);max-width:920px;margin:0 auto;line-height:1.6}

  /* ─── LAYOUT ─── */
  .layout{display:flex;gap:48px;max-width:1320px;margin:0 auto;padding:48px 40px 100px;position:relative;z-index:1}
  main{flex:1;min-width:0;max-width:840px}

  /* ─── COLONNE CHRONOLOGIE ─── */
  .rail{width:262px;flex-shrink:0;position:sticky;top:88px;align-self:flex-start;
    max-height:calc(100vh - 118px);overflow-y:auto;padding-right:8px}
  .rail-title{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;
    color:var(--a1);margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border)}
  .rail .tl{padding-left:20px;margin:0 0 0 4px}
  .rail .tl-item{padding-bottom:16px}
  .rail .tl-item::before{left:-26px;top:4px;width:7px;height:7px}
  .rail .tl-d{font-size:.66rem;letter-spacing:.08em}
  .rail .tl-c{font-size:.79rem;line-height:1.5}
  .rail::-webkit-scrollbar{width:3px}
  .rail::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .chrono-mobile{display:none}

  /* ─── BLOC GÉNÉRIQUE ─── */
  .bloc{margin-bottom:64px;scroll-margin-top:88px}
  .bloc-head{display:flex;align-items:baseline;gap:14px;margin-bottom:24px;
    padding-bottom:12px;border-bottom:1px solid var(--border)}
  .bloc-kicker{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--k,var(--a1))}
  .bloc-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--text)}

  /* ─── L'ESSENTIEL ─── */
  .essentiel{background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    border:1px solid var(--border);border-left:3px solid var(--a1);border-radius:var(--radius);
    padding:28px 30px;margin-bottom:36px}
  .essentiel-label{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--a1);margin-bottom:14px}
  .essentiel p{font-size:.98rem;line-height:1.75;color:var(--text);margin-bottom:0}
  .essentiel p strong{color:var(--a1);font-weight:500}

  /* ─── STATS ─── */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0}
  .stat{border-radius:10px;padding:18px 16px;text-align:center;border:1px solid rgba(255,255,255,.08);
    background:linear-gradient(135deg,color-mix(in srgb,var(--c,var(--a1)) 26%,#101014),
    color-mix(in srgb,var(--c,var(--a1)) 8%,#101014))}
  .stat-n{font-family:'DM Mono',monospace;font-size:1.5rem;font-weight:500;color:var(--text);display:block;line-height:1.1}
  .stat-d{font-size:.7rem;color:var(--text-dim);margin-top:7px;display:block;line-height:1.45}

  /* ─── PARTIES ─── */
  .partie{margin-bottom:78px;scroll-margin-top:88px}
  .partie-head{display:flex;align-items:center;gap:22px;margin-bottom:34px;
    padding-bottom:18px;border-bottom:2px solid var(--p)}
  .partie-num{font-family:'Playfair Display',serif;font-size:3.4rem;font-weight:900;
    color:var(--p);opacity:.35;line-height:.9;flex-shrink:0}
  .partie-title{font-family:'Playfair Display',serif;font-size:clamp(1.35rem,3vw,1.95rem);
    font-weight:700;line-height:1.2}
  .partie-kicker{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.24em;
    text-transform:uppercase;color:var(--p);margin-bottom:6px}

  .section{margin-bottom:44px;scroll-margin-top:88px}
  .section-title{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;
    color:var(--text);margin-bottom:18px;padding-left:16px;border-left:3px solid var(--p)}
  .section-num{color:var(--p);font-weight:900}

  /* ─── TEXTE ─── */
  .prose{font-size:.96rem;line-height:1.8;color:rgba(232,230,224,.78);margin-bottom:16px}
  .prose strong{color:var(--text);font-weight:500}
  .prose em{color:var(--p,var(--a1));font-style:normal;font-weight:500}
  .de{font-family:'DM Mono',monospace;font-size:.86em;color:var(--a2)}

  /* ─── LISTE ─── */
  .liste{list-style:none;margin:14px 0 20px}
  .liste li{font-size:.93rem;line-height:1.65;color:rgba(232,230,224,.75);
    padding:9px 0 9px 22px;position:relative;border-bottom:1px solid rgba(255,255,255,.05)}
  .liste li:last-child{border-bottom:none}
  .liste li::before{content:'';position:absolute;left:0;top:17px;width:6px;height:6px;
    border-radius:50%;background:var(--p,var(--a1))}
  .liste li strong{color:var(--text);font-weight:500}

  /* ─── FAITS CLÉS ─── */
  .faits{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;margin:20px 0}
  .fait{background:rgba(255,255,255,.03);border:1px solid var(--border);
    border-left:3px solid var(--p,var(--a1));border-radius:8px;padding:13px 15px}
  .fait-l{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--text-faint);
    text-transform:uppercase;letter-spacing:.14em;margin-bottom:5px}
  .fait-v{font-size:.86rem;font-weight:500;color:var(--text);line-height:1.4}

  /* ─── CITATION ─── */
  .citation{background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
    border:1px solid var(--border);border-left:3px solid var(--a1);border-radius:0 10px 10px 0;
    padding:20px 24px;margin:22px 0}
  .citation p{font-family:'Playfair Display',serif;font-style:italic;font-size:1.02rem;
    line-height:1.6;color:var(--text);margin-bottom:9px}
  .citation cite{font-family:'DM Mono',monospace;font-size:.66rem;letter-spacing:.08em;
    color:var(--a1);font-style:normal}

  /* ─── ENCADRÉ ─── */
  .encadre{display:flex;gap:15px;align-items:flex-start;border-radius:10px;padding:17px 20px;margin:20px 0;
    background:color-mix(in srgb,var(--c,var(--a2)) 7%,transparent);
    border:1px solid color-mix(in srgb,var(--c,var(--a2)) 26%,transparent)}
  .encadre-ic{font-size:1.5rem;flex-shrink:0;line-height:1.2}
  .encadre-t{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.2em;
    text-transform:uppercase;color:var(--c,var(--a2));margin-bottom:7px;font-weight:500}
  .encadre-c{font-size:.89rem;line-height:1.7;color:rgba(232,230,224,.75)}
  .encadre-c strong{color:var(--text);font-weight:500}

  /* ─── DÉFINITION ─── */
  .def{border:1px dashed var(--border);border-radius:10px;padding:15px 18px;margin:18px 0;
    background:rgba(255,255,255,.02)}
  .def-mot{font-family:'Playfair Display',serif;font-weight:700;font-size:1rem;color:var(--a3);margin-bottom:6px}
  .def-c{font-size:.88rem;line-height:1.7;color:rgba(232,230,224,.72)}

  /* ─── TABLEAU ─── */
  .tbl-wrap{overflow-x:auto;margin:20px 0;border:1px solid var(--border);border-radius:10px}
  table{width:100%;border-collapse:collapse;font-size:.83rem}
  thead{background:rgba(255,255,255,.04)}
  thead th{padding:11px 15px;text-align:left;font-family:'DM Mono',monospace;font-size:.6rem;
    letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap}
  tbody tr{border-top:1px solid var(--border)}
  tbody tr:nth-child(even){background:rgba(255,255,255,.015)}
  tbody td{padding:11px 15px;color:rgba(232,230,224,.75);line-height:1.5}
  tbody td:first-child{color:var(--text);font-weight:500}

  /* ─── CHRONOLOGIE ─── */
  .tl{border-left:2px solid var(--border);padding-left:26px;margin:8px 0 8px 6px}
  .tl-item{position:relative;padding-bottom:22px}
  .tl-item:last-child{padding-bottom:0}
  .tl-item::before{content:'';position:absolute;left:-33px;top:5px;width:9px;height:9px;border-radius:50%;
    background:var(--c,var(--a1));box-shadow:0 0 0 3px rgba(13,13,15,1),0 0 0 5px color-mix(in srgb,var(--c,var(--a1)) 35%,transparent)}
  .tl-d{font-family:'DM Mono',monospace;font-size:.72rem;font-weight:500;letter-spacing:.1em;
    color:var(--c,var(--a1));margin-bottom:4px}
  .tl-c{font-size:.9rem;line-height:1.6;color:rgba(232,230,224,.75)}
  .tl-c strong{color:var(--text);font-weight:500}

  /* ─── ACTEURS ─── */
  .acteurs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .acteur{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;
    transition:all .25s;position:relative;overflow:hidden}
  .acteur:hover{border-color:var(--c,var(--a1));transform:translateY(-3px);background:var(--surface2)}
  .acteur-nom{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;margin-bottom:3px}
  .acteur-role{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--c,var(--a1));margin-bottom:10px}
  .acteur-c{font-size:.82rem;line-height:1.6;color:var(--text-dim)}

  /* ─── DÉBAT ─── */
  .debat{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .debat-col{border:1px solid var(--border);border-radius:12px;padding:20px 22px;background:rgba(255,255,255,.02)}
  .debat-col.oui{border-top:3px solid var(--a3)}
  .debat-col.non{border-top:3px solid var(--a4)}
  .debat-t{font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}
  .debat-col.oui .debat-t{color:var(--a3)}
  .debat-col.non .debat-t{color:var(--a4)}
  .debat-col li{font-size:.87rem;line-height:1.6;color:rgba(232,230,224,.75);
    padding:9px 0 9px 18px;position:relative;list-style:none;border-bottom:1px solid rgba(255,255,255,.05)}
  .debat-col li:last-child{border-bottom:none}
  .debat-col li::before{content:'';position:absolute;left:0;top:16px;width:5px;height:5px;border-radius:50%}
  .debat-col.oui li::before{background:var(--a3)}
  .debat-col.non li::before{background:var(--a4)}
  .debat-col li strong{color:var(--text);font-weight:500}

  /* ─── LEXIQUE ─── */
  .lex-search{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-family:'DM Sans',sans-serif;font-size:.88rem;padding:11px 15px;margin-bottom:14px}
  .lex-search:focus{outline:none;border-color:var(--a1)}
  .lex-search::placeholder{color:var(--text-faint)}
  .lex td:first-child{font-family:'DM Mono',monospace;color:var(--a2);font-weight:500}

  /* ─── SUJETS ─── */
  .sujet{border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:10px;
    background:var(--surface);display:flex;gap:16px;align-items:flex-start;transition:all .2s}
  .sujet:hover{border-color:var(--a4);transform:translateX(4px)}
  .sujet-n{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:900;color:var(--text-faint);line-height:1;flex-shrink:0}
  .sujet-q{font-size:.94rem;line-height:1.6;color:var(--text);margin-bottom:5px;font-weight:400}
  .sujet-h{font-size:.79rem;color:var(--text-dim);line-height:1.55}

  /* ─── À RETENIR ─── */
  .retenir{background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 12%,transparent),rgba(255,255,255,.02));
    border:1px solid color-mix(in srgb,var(--a1) 30%,transparent);border-radius:var(--radius);padding:28px 30px}
  .retenir li{font-size:.93rem;line-height:1.65;color:rgba(232,230,224,.82);
    padding:10px 0 10px 26px;position:relative;list-style:none;border-bottom:1px solid rgba(255,255,255,.06)}
  .retenir li:last-child{border-bottom:none}
  .retenir li::before{content:'✓';position:absolute;left:0;top:9px;color:var(--a1);font-size:.85rem}
  .retenir li strong{color:var(--text);font-weight:500}

  /* ─── PIED DE PAGE ─── */
  footer{text-align:center;padding:36px 40px;border-top:1px solid var(--border);
    font-family:'DM Mono',monospace;font-size:.7rem;color:var(--text-dim);letter-spacing:.14em;
    text-transform:uppercase}

  /* ─── ANIMATION ─── */
  .rev{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
  .rev.vu{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){.rev{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
  :focus-visible{outline:2px solid var(--a1);outline-offset:3px}

  /* ─── RESPONSIVE ─── */
  @media(max-width:1080px){
    .rail{display:none}
    .layout{padding:32px 22px 70px}
    .chrono-mobile{display:block}
  }
  @media(max-width:680px){
    nav{padding:12px 18px;flex-wrap:wrap}
    .breadcrumb{font-size:.7rem;order:3;width:100%}
    .hero{padding:52px 20px 40px}
    .debat{grid-template-columns:1fr}
    .partie-head{gap:14px}
    .partie-num{font-size:2.4rem}
  }
  /* ─── IMPRESSION ─── */
  @media print{
    body{background:#fff;color:#111}
    nav,.rail,#progress,.bg-orb,.nav-right{display:none!important}
    .hero{background:none;border-bottom:2px solid #111;padding:0 0 22px}
    .hero h1,.prose,.liste li,.bloc-title{color:#111}
    .layout{display:block;padding:0}
    .partie,.bloc{break-inside:avoid;page-break-inside:avoid}
    .rev{opacity:1;transform:none}
    .chrono-mobile{display:block!important}
  }
</style>
</head>
<body>

<div id="progress"></div>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<nav>
  <div class="nav-logo" onclick="location.href='../../../../index.html'">ECG Prépa</div>
  <div class="breadcrumb">
    <span onclick="location.href='../../../../index.html'">Accueil</span>
    <span class="sep">/</span>
    <span onclick="location.href='../../../index.html'">2ème Année</span>
    <span class="sep">/</span>
    <span onclick="location.href='../../index.html'">Langues</span>
    <span class="sep">/</span>
    <span onclick="location.href='../index.html'">Civilisation</span>
    <span class="sep">/</span>
    <span class="current" id="bc-titre">—</span>
  </div>
  <div class="nav-right">
    <button id="ap-btn-fr" class="ap-lang-btn active" onclick="setLang('fr')">🇫🇷 FR</button>
    <button id="ap-btn-de" class="ap-lang-btn" onclick="setLang('de')">🇩🇪 DE</button>
  </div>
</nav>

<header class="hero" id="hero"></header>

<div class="layout">
  <aside class="rail" id="rail"></aside>
  <main id="cours"></main>
</div>

<footer id="ft"></footer>


<!-- ══════════════════════════════════════════════════════════════════
     ⬇⬇⬇  SEULE PARTIE À MODIFIER POUR UN NOUVEAU COURS  ⬇⬇⬇
     ══════════════════════════════════════════════════════════════════ -->
<script id="donnees">
const COURS = {

  /* ─── 1. IDENTITÉ DU COURS ───────────────────────────────────────── */
  meta: {
    theme:     "allemand6",                 // anglais | anglais2 | espagnol | espagnol2 | allemand | allemand3 | allemand4 | allemand5 | allemand6 | italien | chinois
    drapeau:   "🕯️",
    chapitre:  "6",
    label:     { fr:"Allemagne · Chapitre 06", de:"Deutschland · Kapitel 06" },
    titre:     { fr:"Le Travail de Mémoire", de:"Die Erinnerungsarbeit" },

  /* ─── 2. L'ESSENTIEL + CHIFFRES CLÉS ─────────────────────────────── */
  essentiel: {
    fr:"Le <strong>travail de mémoire</strong> (<span class='de'>Vergangenheitsbewältigung</span>, <span class='de'>Aufarbeitung</span>, <span class='de'>Erinnerungskultur</span>) désigne la manière dont l'Allemagne affronte les crimes du <strong>nazisme</strong> et, après 1990, ceux de la <strong>dictature du SED</strong>. Ce processus n'a pas été linéaire : après les <em>procès de Nuremberg</em> et la dénazification, les années 1950 sont marquées par le <strong>silence</strong> et la réintégration de nombreux anciens nazis, malgré une politique de réparation initiée par Adenauer. Le tournant vient dans les <strong>années 1960-1980</strong> : procès d'Auschwitz de Francfort, mouvement de 1968, agenouillement de Willy Brandt, discours de Richard von Weizsäcker (1985), querelle des historiens. Après la réunification, l'Allemagne ouvre les archives de la Stasi et érige des <strong>lieux de mémoire</strong> (Mémorial de l'Holocauste, <em>Stolpersteine</em>). Aujourd'hui, la mémoire reste un enjeu vif : disparition des derniers témoins, société d'immigration, montée de l'extrême droite et de l'antisémitisme, débats sur la mémoire coloniale.",
    de:"Die <strong>Erinnerungsarbeit</strong> (<span class='de'>Vergangenheitsbewältigung</span>, <span class='de'>Aufarbeitung</span>, <span class='de'>Erinnerungskultur</span>) bezeichnet die Art, wie sich Deutschland mit den Verbrechen des <strong>Nationalsozialismus</strong> und nach 1990 mit denen der <strong>SED-Diktatur</strong> auseinandersetzt. Dieser Prozess verlief nicht geradlinig: Nach den <em>Nürnberger Prozessen</em> und der Entnazifizierung sind die 1950er-Jahre von <strong>Schweigen</strong> und der Wiedereingliederung vieler früherer Nationalsozialisten geprägt, trotz einer von Adenauer eingeleiteten Wiedergutmachungspolitik. Die Wende kommt in den <strong>1960er- bis 1980er-Jahren</strong>: Frankfurter Auschwitz-Prozess, 68er-Bewegung, Willy Brandts Kniefall, Richard von Weizsäckers Rede (1985), Historikerstreit. Nach der Wiedervereinigung öffnet Deutschland die Stasi-Akten und errichtet <strong>Erinnerungsorte</strong> (Holocaust-Mahnmal, <em>Stolpersteine</em>). Heute bleibt die Erinnerung ein brisantes Thema: Verschwinden der letzten Zeitzeugen, Einwanderungsgesellschaft, Aufstieg von Rechtsextremismus und Antisemitismus, Debatten über das koloniale Erbe."
  },

        blocs:[
          { t:"p", c:{
            fr:"Dès la fin de la guerre, les Alliés veulent juger les responsables. Le <strong>Tribunal militaire international de Nuremberg</strong> (20 novembre 1945 – 1<sup>er</sup> octobre 1946) juge 22 hauts dirigeants nazis : 12 sont condamnés à mort, 3 acquittés. Il établit les notions de <em>crime contre la paix</em>, <em>crime de guerre</em> et <em>crime contre l'humanité</em>. D'autres procès (médecins, juges, industriels) suivent jusqu'en 1949. À côté de cela, la <strong>dénazification</strong> vise à écarter les nazis de la vie publique : les Alliés, particulièrement les Américains, font remplir à des millions d'Allemands un long questionnaire (<span class='de'>Fragebogen</span>) puis des commissions (<span class='de'>Spruchkammern</span>) classent chaque personne en cinq catégories, de « principal responsable » à « disculpé ».",
            de:"Gleich nach Kriegsende wollen die Alliierten die Verantwortlichen vor Gericht stellen. Der <strong>Internationale Militärgerichtshof in Nürnberg</strong> (20. November 1945 – 1. Oktober 1946) verurteilt 22 hohe NS-Führer: 12 werden zum Tode verurteilt, 3 freigesprochen. Er entwickelt die Begriffe <em>Verbrechen gegen den Frieden</em>, <em>Kriegsverbrechen</em> und <em>Verbrechen gegen die Menschlichkeit</em>. Weitere Prozesse (Ärzte, Juristen, Industrielle) folgen bis 1949. Daneben soll die <strong>Entnazifizierung</strong> Nationalsozialisten aus dem öffentlichen Leben entfernen: Die Alliierten, vor allem die Amerikaner, lassen Millionen Deutsche einen langen Fragebogen ausfüllen, danach ordnen <em>Spruchkammern</em> jeden in eine von fünf Kategorien ein, vom „Hauptschuldigen“ bis zum „Entlasteten“."} },
          { t:"p", c:{
            fr:"Ce dispositif se heurte à des limites. Dans la grande majorité des cas, les personnes sont classées comme simples <strong>« suiveurs »</strong> (<span class='de'>Mitläufer</span>), et de faux certificats de bonne conduite, les <em>Persilscheine</em> (de la marque de lessive Persil, qui « lave plus blanc »), circulent. La guerre froide aggrave les choses : l'Occident a besoin de l'administration, de la justice et de l'économie allemandes pour reconstruire le pays. Des lois d'<strong>amnistie</strong> (1949, 1954) et une loi de 1951 (<em>article 131</em>) permettent à de nombreux anciens fonctionnaires de retrouver leur poste.",
            de:"Dieses Verfahren stößt an Grenzen. In der überwiegenden Mehrheit der Fälle werden die Betroffenen nur als <strong>„Mitläufer“</strong> eingestuft, und gefälschte Entlastungszeugnisse, die <em>Persilscheine</em> (nach dem Waschmittel Persil, das „weißer wäscht“), kursieren. Der Kalte Krieg verschärft das Problem: Der Westen braucht deutsche Verwaltung, Justiz und Wirtschaft für den Wiederaufbau. <strong>Amnestiegesetze</strong> (1949, 1954) und ein Gesetz von 1951 (<em>Artikel 131</em>) erlauben vielen früheren Beamten die Rückkehr in ihre Ämter."} },

          { t:"encadre", icon:"🗂️", c:"var(--a4)",
            titre:{fr:"Le cas Globke : les continuités", de:"Der Fall Globke: die Kontinuitäten"},
            c2:{fr:"<strong>Hans Globke</strong>, haut fonctionnaire qui avait participé à la rédaction d'un commentaire juridique des lois de Nuremberg, devient en 1953 secrétaire d'État à la chancellerie d'Adenauer et l'un de ses plus proches collaborateurs. Son cas symbolise la <em>tension</em> entre la nécessité de reconstruire l'État avec ses cadres existants et l'exigence morale de rupture avec le passé. Les critiques, notamment en RDA, en font un argument de propagande.",
                de:"<strong>Hans Globke</strong>, hoher Beamter, der an einem juristischen Kommentar zu den Nürnberger Gesetzen mitgewirkt hatte, wird 1953 Staatssekretär im Kanzleramt Adenauers und einer seiner engsten Mitarbeiter. Sein Fall symbolisiert die <em>Spannung</em> zwischen der Notwendigkeit, den Staat mit vorhandenem Personal aufzubauen, und dem moralischen Anspruch auf einen Bruch mit der Vergangenheit. Kritiker, besonders in der DDR, nutzen ihn propagandistisch."} }

      {
        titre:{fr:"Les années 1950 : silence et réparation (Wiedergutmachung)",
               de:"Die 1950er-Jahre: Schweigen und Wiedergutmachung"},
        blocs:[
          { t:"p", c:{
            fr:"Dans les années 1950, la société ouest-allemande se concentre sur la reconstruction et le « miracle économique ». Beaucoup d'Allemands se voient surtout comme des <strong>victimes de la guerre</strong> (bombardements, expulsions, prisonniers) et évitent d'évoquer les crimes nazis. On parle d'un « <strong>silence</strong> » collectif, parfois d'un silence « communicatif » : tout le monde sait, mais on n'en parle pas dans la sphère publique. Dans le même temps, l'idée d'une <strong>culpabilité collective</strong> des Allemands est largement rejetée.",
            de:"In den 1950er-Jahren konzentriert sich die westdeutsche Gesellschaft auf den Wiederaufbau und das „Wirtschaftswunder“. Viele Deutsche sehen sich vor allem als <strong>Kriegsopfer</strong> (Bombenkrieg, Vertreibung, Kriegsgefangenschaft) und meiden die Rede von den NS-Verbrechen. Man spricht von einem kollektiven <strong>„Beschweigen“</strong>, mitunter einem „kommunikativen“ Schweigen: Alle wissen Bescheid, aber in der Öffentlichkeit wird nicht darüber gesprochen. Zugleich wird die These einer <strong>Kollektivschuld</strong> der Deutschen weitgehend abgelehnt."} },
          { t:"p", c:{
            fr:"Pourtant, la RFA engage une politique de <strong>réparation</strong> (<span class='de'>Wiedergutmachung</span>). Le <strong>27 septembre 1951</strong>, Adenauer reconnaît devant le Bundestag que des crimes indicibles ont été commis au nom du peuple allemand et que l'Allemagne a un devoir de réparation. L'<strong>accord de Luxembourg</strong> (10 septembre 1952) prévoit environ <strong>3 milliards de marks</strong> versés à Israël et 450 millions à la Conférence sur les revendications matérielles juives contre l'Allemagne. Des lois fédérales d'indemnisation (<em>BEG</em>, 1953-1956) permettent à des victimes individuelles d'obtenir une compensation. L'accord est vivement contesté par une partie de l'opinion allemande, mais aussi en Israël.",
            de:"Dennoch leitet die BRD eine Politik der <strong>Wiedergutmachung</strong> ein. Am <strong>27. September 1951</strong> erkennt Adenauer vor dem Bundestag an, dass im Namen des deutschen Volkes unsägliche Verbrechen begangen wurden und Deutschland zur Wiedergutmachung verpflichtet ist. Das <strong>Luxemburger Abkommen</strong> (10. September 1952) sieht rund <strong>3 Milliarden Mark</strong> für Israel und 450 Millionen für die Claims Conference vor. Bundesgesetze zur Entschädigung (<em>BEG</em>, 1953–1956) ermöglichen einzelnen Opfern Entschädigungen. Das Abkommen ist in Teilen der deutschen Öffentlichkeit, aber auch in Israel heftig umstritten."} },
          { t:"encadre", icon:"💶", c:"var(--a2)",
            titre:{fr:"Notion clé — Wiedergutmachung", de:"Schlüsselbegriff – Wiedergutmachung"},
            c2:{fr:"Le mot signifie littéralement « remettre en bon état ». Il est critiqué car <strong>aucune somme</strong> ne peut « réparer » la Shoah. Les historiens parlent de <em>réparations matérielles</em> sans valeur morale de « pardon ». L'accord de 1952 est tout de même fondateur : il ouvre la voie à des relations diplomatiques avec Israël (<strong>12 mai 1965</strong>) et fait de la reconnaissance des crimes un élément de l'identité politique de la RFA.",
                de:"Das Wort bedeutet wörtlich „wieder in Ordnung bringen“. Es wird kritisiert, weil <strong>keine Summe</strong> die Shoah „wiedergutmachen“ kann. Historiker sprechen von <em>materieller Entschädigung</em> ohne moralische „Vergebung“. Das Abkommen von 1952 ist dennoch grundlegend: Es ebnet den Weg zu diplomatischen Beziehungen mit Israel (<strong>12. Mai 1965</strong>) und macht die Anerkennung der Verbrechen zum Bestandteil der politischen Identität der BRD."} },

            { l:{fr:"Relations diplomatiques RFA-Israël",de:"Diplomatische Beziehungen BRD–Israel"}, v:{fr:"12 mai 1965",de:"12. Mai 1965"} }
          ]}

      {
        titre:{fr:"Les années 1960 : le tournant judiciaire et générationnel",
               de:"Die 1960er-Jahre: der juristische und generationelle Wendepunkt"},
        blocs:[
          { t:"p", c:{
            fr:"À la fin des années 1950, de nouveaux procès rouvrent le débat. Le procès des <em>Einsatzgruppen</em> à Ulm (1958) révèle l'ampleur des massacres à l'Est et conduit à la création, à <strong>Ludwigsbourg</strong>, d'un service central chargé d'enquêter sur les crimes nazis. En 1961, le <strong>procès d'Adolf Eichmann</strong> à Jérusalem, retransmis, force l'opinion à regarder en face les témoignages des survivants. Mais l'événement majeur est le <strong>procès d'Auschwitz de Francfort</strong> (1963-1965), jugé par la justice allemande elle-même, sous l'impulsion du procureur général de Hesse <strong>Fritz Bauer</strong>.",
            de:"Ende der 1950er-Jahre entfachen neue Prozesse die Debatte neu. Der Ulmer <em>Einsatzgruppen</em>-Prozess (1958) offenbart das Ausmaß der Massenmorde im Osten und führt zur Gründung einer Zentralstelle in <strong>Ludwigsburg</strong>, die NS-Verbrechen untersucht. 1961 zwingt der übertragene <strong>Eichmann-Prozess</strong> in Jerusalem die Öffentlichkeit, den Zeugenaussagen von Überlebenden ins Auge zu sehen. Das wichtigste Ereignis ist jedoch der <strong>Frankfurter Auschwitz-Prozess</strong> (1963–1965), von der deutschen Justiz selbst geführt, auf Betreiben des hessischen Generalstaatsanwalts <strong>Fritz Bauer</strong>."} },
          { t:"p", c:{
            fr:"Ce procès, qui réunit 22 accusés (anciens membres de la SS du camp) et des centaines de témoins, fait découvrir au grand public allemand le fonctionnement concret du camp d'extermination. Il aboutit à 17 condamnations, dont 6 à la perpétuité, et à 3 acquittements. Les peines sont jugées par certains trop légères, car la justice se limite aux actes individuels et non à la machine d'extermination dans son ensemble. Le procès a toutefois un effet profond sur la <strong>génération suivante</strong> : les jeunes nés pendant ou après la guerre interrogent leurs parents, ce qui nourrit en partie le <strong>mouvement de 1968</strong> et sa critique de la société.",
            de:"Dieser Prozess mit 22 Angeklagten (frühere SS-Angehörige des Lagers) und Hunderten Zeugen zeigt der deutschen Öffentlichkeit erstmals das konkrete Funktionieren des Vernichtungslagers. Er endet mit 17 Verurteilungen, darunter 6 lebenslange Haftstrafen, und 3 Freisprüchen. Manche halten die Strafen für zu mild, da sich die Justiz auf individuelle Taten beschränkt und nicht auf die gesamte Vernichtungsmaschinerie. Der Prozess wirkt jedoch tief auf die <strong>nachfolgende Generation</strong>: Die nach oder während des Krieges Geborenen befragen ihre Eltern, was die <strong>68er-Bewegung</strong> und ihre Gesellschaftskritik mit prägt."} },
          { t:"encadre", icon:"⚖️", c:"var(--a1)",
            titre:{fr:"Fritz Bauer, un procureur contre l'oubli", de:"Fritz Bauer, ein Staatsanwalt gegen das Vergessen"},
            c2:{fr:"Juif, social-démocrate et ancien exilé, <strong>Fritz Bauer</strong> (1903-1968) est procureur général de Hesse. Convaincu que la justice doit éclairer l'opinion, il lance les poursuites d'Auschwitz malgré l'hostilité de nombreux collègues et aurait contribué, par des informations transmises aux Israéliens, à la capture d'Eichmann. Il meurt en 1968, au moment où sa conviction (juger pour que la société comprenne) commence à être partagée.",
                de:"Als Jude, Sozialdemokrat und früherer Exilant ist <strong>Fritz Bauer</strong> (1903–1968) hessischer Generalstaatsanwalt. Überzeugt, dass die Justiz die Öffentlichkeit aufklären muss, leitet er die Auschwitz-Verfahren trotz der Feindseligkeit vieler Kollegen ein und soll durch Hinweise an die Israelis zur Ergreifung Eichmanns beigetragen haben. Er stirbt 1968, als seine Überzeugung (richten, damit die Gesellschaft versteht) beginnt, geteilt zu werden."} },
          { t:"faits", items:[

            { l:{fr:"Accusés et verdicts",de:"Angeklagte und Urteile"}, v:{fr:"22 accusés ; 17 condamnations dont 6 perpétuités",de:"22 Angeklagte; 17 Verurteilungen, davon 6 lebenslang"} },
            { l:{fr:"Service central de Ludwigsbourg",de:"Zentrale Stelle Ludwigsburg"}, v:{fr:"Créé en 1958 pour enquêter sur les crimes nazis",de:"1958 zur Aufklärung von NS-Verbrechen gegründet"} }
          ]}

    sections:[

        titre:{fr:"Gestes et discours : de Brandt à Weizsäcker",

        blocs:[
          { t:"p", c:{
            fr:"Le <strong>7 décembre 1970</strong>, à Varsovie, le chancelier <strong>Willy Brandt</strong>, qui avait lui-même fui le nazisme, s'agenouille spontanément devant le monument aux héros du ghetto. Ce <em>Kniefall</em> est un geste symbolique d'une grande force : au nom d'un peuple, un dirigeant exprime sa honte. Il divise l'opinion allemande de l'époque, mais devient l'un des moments emblématiques de la mémoire de la RFA. En <strong>1979</strong>, la diffusion à la télévision de la série américaine <strong><em>Holocaust</em></strong> touche des millions d'Allemands par la dimension personnelle de l'histoire d'une famille juive : le mot « Holocaust » entre dans le vocabulaire courant, et le Bundestag abolit la prescription pour les meurtres, ce qui permet de continuer à poursuivre les crimes nazis.",
            de:"Am <strong>7. Dezember 1970</strong> kniet Bundeskanzler <strong>Willy Brandt</strong>, der selbst vor den Nazis geflohen war, in Warschau spontan vor dem Denkmal für die Helden des Ghettos nieder. Dieser <em>Kniefall</em> ist eine symbolisch starke Geste: Im Namen eines Volkes drückt ein Regierungschef seine Scham aus. Er spaltet die damalige deutsche Öffentlichkeit, wird aber zu einem Schlüsselmoment der bundesdeutschen Erinnerung. 1979 erreicht die Ausstrahlung der amerikanischen Serie <strong><em>Holocaust</em></strong> im Fernsehen Millionen Deutsche durch die persönliche Geschichte einer jüdischen Familie: Das Wort „Holocaust“ geht in den allgemeinen Sprachgebrauch ein, und der Bundestag hebt die Verjährung für Mord auf, was die weitere Verfolgung von NS-Verbrechen ermöglicht."} },
          { t:"p", c:{
            fr:"Le <strong>8 mai 1985</strong>, pour le 40ᵉ anniversaire de la capitulation, le président fédéral <strong>Richard von Weizsäcker</strong> prononce devant le Bundestag un discours majeur. Il rompt avec l'idée d'une « défaite » : le 8 mai est aussi un jour de <strong>libération</strong> pour les Allemands, de la dictature nazie. Il appelle à ne pas fuir la vérité, à ne pas parler de culpabilité collective mais de <em>responsabilité</em> des générations suivantes dans la mémoire.",
            de:"Am <strong>8. Mai 1985</strong>, zum 40. Jahrestag der Kapitulation, hält Bundespräsident <strong>Richard von Weizsäcker</strong> vor dem Bundestag eine bedeutende Rede. Er bricht mit der Vorstellung einer bloßen „Niederlage“: Der 8. Mai ist für die Deutschen auch ein Tag der <strong>Befreiung</strong> von der NS-Diktatur. Er mahnt, der Wahrheit nicht auszuweichen, nicht von Kollektivschuld, sondern von der <em>Verantwortung</em> der nachfolgenden Generationen für die Erinnerung zu sprechen."} },
          { t:"citation", c:{fr:"Le 8 mai a été un jour de libération.", de:"Der 8. Mai war ein Tag der Befreiung."},
            src:{fr:"Richard von Weizsäcker, discours devant le Bundestag, 8 mai 1985", de:"Richard von Weizsäcker, Rede vor dem Bundestag, 8. Mai 1985"} },
          { t:"encadre", icon:"⚰️", c:"var(--a4)",
            titre:{fr:"Bitburg (mai 1985) : un geste controversé", de:"Bitburg (Mai 1985): eine umstrittene Geste"},
            c2:{fr:"Quelques jours avant le discours de Weizsäcker, le chancelier <strong>Helmut Kohl</strong> et le président américain Ronald Reagan se recueillent au cimetière militaire de Bitburg, où reposent aussi des membres de la Waffen-SS. Le geste, voulu comme un acte de réconciliation, provoque une vive polémique en Allemagne et aux États-Unis. L'épisode montre la difficulté de concilier le deuil des soldats allemands et la mémoire des victimes du nazisme.",
                de:"Wenige Tage vor Weizsäckers Rede besuchen Bundeskanzler <strong>Helmut Kohl</strong> und US-Präsident Ronald Reagan den Soldatenfriedhof in Bitburg, auf dem auch Angehörige der Waffen-SS ruhen. Die als Versöhnungsakt gedachte Geste löst in Deutschland und den USA heftige Kontroversen aus. Die Episode zeigt, wie schwer es ist, die Trauer um deutsche Soldaten mit dem Gedenken an die Opfer des Nationalsozialismus zu vereinbaren."} }
        ]

      {
        titre:{fr:"Les grandes controverses historiographiques",
               de:"Die großen geschichtswissenschaftlichen Kontroversen"},
        blocs:[
          { t:"p", c:{
            fr:"Les années 1980-1990 sont marquées par de vifs débats publics sur le passé nazi. En <strong>1986-1987</strong>, la <em>querelle des historiens</em> (<span class='de'>Historikerstreit</span>) oppose notamment l'historien <strong>Ernst Nolte</strong>, qui voit dans le nazisme une réaction aux violences du communisme, au philosophe <strong>Jürgen Habermas</strong>, qui y voit une tentative de relativiser la Shoah. Le débat porte sur le caractère <em>singulier</em> du génocide et sur le sens d'une identité allemande « normale ». Habermas défend un <em>patriotisme constitutionnel</em> : s'attacher aux principes démocratiques de la Loi fondamentale plutôt qu'à une identité nationale héritée.",
            de:"Die 1980er- und 1990er-Jahre sind von heftigen öffentlichen Debatten über die NS-Vergangenheit geprägt. 1986/87 stellt der <em>Historikerstreit</em> insbesondere den Historiker <strong>Ernst Nolte</strong>, der im Nationalsozialismus eine Reaktion auf die Gewalt des Kommunismus sieht, dem Philosophen <strong>Jürgen Habermas</strong> gegenüber, der darin einen Versuch sieht, die Shoah zu relativieren. Es geht um den <em>singulären</em> Charakter des Völkermords und den Sinn einer „normalen“ deutschen Identität. Habermas verteidigt einen <em>Verfassungspatriotismus</em>: die Bindung an die demokratischen Prinzipien des Grundgesetzes statt an eine ererbte nationale Identität."} },

          { t:"p", c:{
            fr:"Ces controverses ont un effet durable : l'<strong>exposition sur les crimes de la Wehrmacht</strong> (à partir de 1995) remet en cause le mythe d'une armée « propre » qui aurait ignoré les crimes, tandis que les travaux sur les « hommes ordinaires » (policiers, soldats, fonctionnaires) montrent que la Shoah est aussi l'œuvre de personnes sans responsabilité exceptionnelle. En <strong>1998</strong>, l'écrivain Martin Walser, en recevant le Prix de la paix des libraires allemands, critique ce qu'il perçoit comme un usage de la mémoire d'Auschwitz en « massue morale » (<span class='de'>Moralkeule</span>). Ignatz Bubis, président du Conseil central des Juifs d'Allemagne, lui répond vivement. Le débat illustre la tension entre devoir de mémoire et crainte d'une mémoire ritualisée.",
            de:"Diese Kontroversen wirken nachhaltig: Die <strong>Ausstellung über die Verbrechen der Wehrmacht</strong> (ab 1995) stellt den Mythos einer „sauberen“ Armee infrage, die von den Verbrechen nichts gewusst habe, während Studien zu den „ganz normalen Männern“ (Polizisten, Soldaten, Beamte) zeigen, dass die Shoah auch das Werk von Menschen ohne außergewöhnliche Verantwortung war. 1998 kritisiert der Schriftsteller Martin Walser bei der Verleihung des Friedenspreises des Deutschen Buchhandels, was er als Gebrauch der Auschwitz-Erinnerung als „Moralkeule“ wahrnimmt. Ignatz Bubis, Präsident des Zentralrats der Juden in Deutschland, widerspricht scharf. Die Debatte zeigt die Spannung zwischen Erinnerungspflicht und der Angst vor ritualisiertem Gedenken."} }

      {
        titre:{fr:"La mémoire est-allemande et le travail sur la dictature du SED",
               de:"Die ostdeutsche Erinnerung und die Aufarbeitung der SED-Diktatur"},
        blocs:[
          { t:"p", c:{
            fr:"En <strong>RDA</strong>, la mémoire du nazisme suit un autre récit. L'État se proclame <em>antifasciste</em> : il se présente comme l'héritier des communistes résistants et des victimes du nazisme, et fait du fascisme un produit du capitalisme, dont la RFA serait la continuation. Les lieux de mémoire comme <strong>Buchenwald</strong> (mémorial national, 1958) mettent surtout en avant la résistance communiste. Cette lecture permet à la RDA de se dispenser de toute responsabilité : pas de réparations aux victimes juives, pas de relation avec Israël, et un souvenir de la Shoah relativement discret.",
            de:"In der <strong>DDR</strong> folgt die Erinnerung an den Nationalsozialismus einer anderen Erzählung. Der Staat versteht sich als <em>antifaschistisch</em>: Er sieht sich als Erbe der kommunistischen Widerstandskämpfer und der Opfer des Nationalsozialismus und erklärt den Faschismus zum Produkt des Kapitalismus, dessen Fortsetzung die BRD sei. Gedenkorte wie <strong>Buchenwald</strong> (nationale Mahn- und Gedenkstätte, 1958) betonen vor allem den kommunistischen Widerstand. Diese Lesart erlaubt der DDR, jede Verantwortung abzulehnen: keine Entschädigung für jüdische Opfer, keine Beziehungen zu Israel und eine vergleichsweise zurückhaltende Erinnerung an die Shoah."} },
          { t:"p", c:{
            fr:"Après 1990, l'Allemagne doit faire face à une <strong>double mémoire dictatoriale</strong> : nazie et communiste. Le Bundestag crée deux commissions d'enquête sur la dictature du SED (1992 et 1995). La <strong>loi sur les archives de la Stasi</strong> (décembre 1991) permet à chaque citoyen de consulter son dossier ; le premier responsable de l'office fédéral, <strong>Joachim Gauck</strong> (1990-2000), en devient le symbole. La justice poursuit certains responsables : <strong>Egon Krenz</strong> est condamné en 1997 à six ans et demi de prison, notamment pour la mort de personnes tuées au Mur, tandis que le procès de Honecker est abandonné en 1993 pour raison de santé. L'Allemagne choisit ainsi la <strong>transparence</strong> plutôt que l'amnistie.",
            de:"Nach 1990 muss sich Deutschland einer <strong>doppelten Diktaturerinnerung</strong> stellen: der nationalsozialistischen und der kommunistischen. Der Bundestag richtet zwei Enquete-Kommissionen zur SED-Diktatur ein (1992 und 1995). Das <strong>Stasi-Unterlagen-Gesetz</strong> (Dezember 1991) erlaubt jedem Bürger die Einsicht in seine Akte; der erste Leiter der Bundesbehörde, <strong>Joachim Gauck</strong> (1990–2000), wird dafür zum Symbol. Die Justiz verfolgt einzelne Verantwortliche: <strong>Egon Krenz</strong> wird 1997 zu sechseinhalb Jahren Haft verurteilt, unter anderem für die Toten an der Mauer, während das Verfahren gegen Honecker 1993 aus gesundheitlichen Gründen eingestellt wird. Deutschland entscheidet sich damit für <strong>Transparenz</strong> statt Amnestie."} },
          { t:"encadre", icon:"📂", c:"var(--a4)",
            titre:{fr:"Les archives de la Stasi : un modèle ?", de:"Die Stasi-Akten: ein Modell?"},
            c2:{fr:"L'ouverture des dossiers de la Stasi est souvent citée comme exemple pour d'autres pays sortant d'une dictature. Elle permet aux victimes de savoir qui les a surveillées, mais peut aussi blesser : on découvre que des proches ou des amis étaient informateurs. Certains craignaient qu'elle ne réveille des haines ; d'autres jugent qu'elle est indispensable à la reconstruction de la confiance. Aujourd'hui, ces archives sont placées sous l'autorité des Archives fédérales.",
                de:"Die Öffnung der Stasi-Akten wird oft als Vorbild für andere Länder nach einer Diktatur genannt. Sie erlaubt den Opfern zu wissen, wer sie überwacht hat, kann aber auch verletzen: Man entdeckt, dass Verwandte oder Freunde Informanten waren. Manche fürchteten, sie wecke Hass; andere halten sie für unverzichtbar, um Vertrauen wieder aufzubauen. Heute stehen die Unterlagen unter der Verantwortung des Bundesarchivs."} },

    sections:[

        titre:{fr:"Les lieux de mémoire : monuments, musées et rituels",

        blocs:[
          { t:"p", c:{
            fr:"Depuis la réunification, Berlin et toute l'Allemagne se couvrent de <strong>lieux de mémoire</strong>. Le <strong>Mémorial aux Juifs assassinés d'Europe</strong>, conçu par l'architecte américain Peter Eisenman, est inauguré le <strong>10 mai 2005</strong> près de la porte de Brandebourg : 2 711 stèles de béton de hauteurs variables, dans lesquelles les visiteurs circulent. D'autres sites suivent : le <strong>Musée juif</strong> de Daniel Libeskind (2001), le centre de documentation <em>Topographie de la terreur</em> sur l'ancien siège de la Gestapo (2010), les mémoriaux aux homosexuels persécutés (2008) et aux Sinti et Roms (2012). Les anciens camps (<strong>Dachau, Sachsenhausen, Buchenwald, Bergen-Belsen...</strong>) sont devenus des mémoriaux et lieux d'éducation, visités chaque année par des centaines de milliers de personnes, y compris des classes.",
            de:"Seit der Wiedervereinigung bedecken sich Berlin und ganz Deutschland mit <strong>Erinnerungsorten</strong>. Das vom amerikanischen Architekten Peter Eisenman entworfene <strong>Denkmal für die ermordeten Juden Europas</strong> wird am <strong>10. Mai 2005</strong> nahe dem Brandenburger Tor eingeweiht: 2 711 Betonstelen unterschiedlicher Höhe, zwischen denen die Besucher umhergehen. Weitere Orte folgen: das <strong>Jüdische Museum</strong> von Daniel Libeskind (2001), das Dokumentationszentrum <em>Topographie des Terrors</em> auf dem früheren Gestapo-Gelände (2010), die Denkmäler für die verfolgten Homosexuellen (2008) und für die Sinti und Roma (2012). Die früheren Lager (<strong>Dachau, Sachsenhausen, Buchenwald, Bergen-Belsen …</strong>) sind zu Gedenk- und Bildungsorten geworden, die jedes Jahr Hunderttausende, auch Schulklassen, besuchen."} },
          { t:"p", c:{
            fr:"La mémoire se vit aussi dans l'espace quotidien. Depuis 1992, l'artiste <strong>Gunter Demnig</strong> pose devant les domiciles de victimes du nazisme de petits pavés de laiton, les <strong>Stolpersteine</strong> (« pierres sur lesquelles on trébuche »), portant le nom, la date de naissance et le sort de la personne. Le <strong>27 janvier</strong>, anniversaire de la libération d'Auschwitz, est depuis 1996 une journée officielle du souvenir des victimes du nazisme. Le <strong>9 novembre</strong>, date aussi chargée de souvenirs (1918, 1923, 1938, 1989), est à la fois jour de commémoration de la Nuit de Cristal et de la chute du Mur.",
            de:"Erinnerung findet auch im Alltagsraum statt. Seit 1992 verlegt der Künstler <strong>Gunter Demnig</strong> vor den Wohnhäusern von NS-Opfern kleine Messingplatten, die <strong>Stolpersteine</strong>, mit Namen, Geburtsdatum und Schicksal der Person. Der <strong>27. Januar</strong>, der Jahrestag der Befreiung von Auschwitz, ist seit 1996 offizieller Gedenktag für die Opfer des Nationalsozialismus. Der <strong>9. November</strong>, ein Datum voller Erinnerungen (1918, 1923, 1938, 1989), ist zugleich Gedenktag an die Reichspogromnacht und an den Mauerfall."} },
          { t:"faits", items:[
            { l:{fr:"Mémorial de l'Holocauste, Berlin",de:"Holocaust-Mahnmal, Berlin"}, v:{fr:"Inauguré le 10 mai 2005 ; 2 711 stèles",de:"Eingeweiht am 10. Mai 2005; 2 711 Stelen"} },
            { l:{fr:"Stolpersteine",de:"Stolpersteine"}, v:{fr:"Depuis 1992 ; plus de 100 000 pavés de mémoire",de:"Seit 1992; mehr als 100 000 Steine"} },
            { l:{fr:"Journée du souvenir",de:"Gedenktag"}, v:{fr:"27 janvier, depuis 1996",de:"27. Januar, seit 1996"} }
          ]}
        ]

      {
        titre:{fr:"Justice, réparations et relation avec Israël",
               de:"Justiz, Wiedergutmachung und das Verhältnis zu Israel"},
        blocs:[
          { t:"p", c:{
            fr:"Plus de quatre-vingts ans après la fin de la guerre, la justice allemande continue à juger d'anciens membres de l'appareil d'extermination. Un tournant juridique s'opère avec le procès de <strong>John Demjanjuk</strong> (Munich, 2011), condamné comme complice des meurtres au camp de Sobibor sans qu'il soit nécessaire de prouver un acte précis ; cette approche s'applique ensuite à <strong>Oskar Gröning</strong> (Lunebourg, 2015, complicité à Auschwitz) et à d'autres anciens membres du personnel de camps. Parallèlement, la <strong>fondation « Mémoire, responsabilité et avenir »</strong> (2000), financée par l'État et par des entreprises allemandes, verse des indemnités à d'anciens travailleurs forcés. D'autres chantiers portent sur la restitution des biens spoliés, notamment des œuvres d'art (Principes de Washington, 1998).",
            de:"Mehr als achtzig Jahre nach Kriegsende verfolgt die deutsche Justiz weiterhin frühere Angehörige des Vernichtungsapparats. Ein juristischer Wendepunkt ist der Prozess gegen <strong>John Demjanjuk</strong> (München, 2011), verurteilt als Gehilfe bei den Morden im Lager Sobibor, ohne dass eine konkrete Tat nachgewiesen werden musste; dieser Ansatz wird später auf <strong>Oskar Gröning</strong> (Lüneburg, 2015, Beihilfe in Auschwitz) und andere frühere Lagerangehörige angewandt. Parallel zahlt die <strong>Stiftung „Erinnerung, Verantwortung und Zukunft“</strong> (2000), von Staat und deutschen Unternehmen finanziert, Entschädigungen an frühere Zwangsarbeiter. Weitere Themen sind die Rückgabe geraubten Eigentums, besonders von Kunstwerken (Washingtoner Prinzipien, 1998)."} },

          { t:"encadre", icon:"🕊️", c:"var(--a3)",
            titre:{fr:"Notion clé — la Staatsräson envers Israël", de:"Schlüsselbegriff – die Staatsräson gegenüber Israel"},
            c2:{fr:"En 2008, devant le parlement israélien, la chancelière <strong>Angela Merkel</strong> déclare que la sécurité d'Israël fait partie de la <em>raison d'État</em> (<span class='de'>Staatsräson</span>) de l'Allemagne. L'idée résume le lien particulier de l'Allemagne avec Israël, né de la responsabilité historique pour la Shoah. Elle est discutée : certains y voient un engagement moral fondamental, d'autres s'interrogent sur ses implications concrètes en politique étrangère.",
                de:"2008 erklärt Bundeskanzlerin <strong>Angela Merkel</strong> vor der Knesset, die Sicherheit Israels sei Teil der <em>Staatsräson</em> Deutschlands. Der Gedanke fasst die besondere Verbundenheit Deutschlands mit Israel zusammen, die aus der historischen Verantwortung für die Shoah erwächst. Er ist umstritten: Manche sehen darin eine grundlegende moralische Verpflichtung, andere fragen nach den konkreten außenpolitischen Folgen."} }

      {
        titre:{fr:"Les défis contemporains de la mémoire",
               de:"Aktuelle Herausforderungen des Erinnerns"},
        blocs:[
          { t:"p", c:{
            fr:"La mémoire allemande fait face à plusieurs défis. Le premier est la <strong>disparition des derniers témoins</strong> : la transmission passe de plus en plus par les musées, les archives numériques et l'éducation. Le deuxième est la <strong>société d'immigration</strong> : une partie importante des habitants n'a pas d'ancêtres liés au passé nazi, ce qui amène à repenser comment inclure toutes les histoires. Le troisième est la <strong>poussée de l'extrême droite</strong> : en 2017, un responsable de l'AfD, Björn Höcke, a qualifié le Mémorial de l'Holocauste de monument de la honte et réclamé un tournant radical de la politique de mémoire. Le quatrième est l'<strong>antisémitisme</strong>, avec des actes violents comme l'attentat contre la synagogue de Halle (9 octobre 2019) et une hausse nette des incidents après le 7 octobre 2023.",
            de:"Die deutsche Erinnerung steht vor mehreren Herausforderungen. Die erste ist das <strong>Verschwinden der letzten Zeitzeugen</strong>: Die Weitergabe verläuft zunehmend über Museen, digitale Archive und Bildung. Die zweite ist die <strong>Einwanderungsgesellschaft</strong>: Ein großer Teil der Bevölkerung hat keine Vorfahren mit Bezug zur NS-Vergangenheit, was dazu zwingt, neu zu überlegen, wie alle Geschichten einbezogen werden. Die dritte ist das <strong>Erstarken des Rechtsextremismus</strong>: 2017 bezeichnete der AfD-Politiker Björn Höcke das Holocaust-Mahnmal als Denkmal der Schande und forderte eine radikale Wende der Erinnerungspolitik. Die vierte ist der <strong>Antisemitismus</strong>, mit Gewalttaten wie dem Anschlag auf die Synagoge in Halle (9. Oktober 2019) und einem deutlichen Anstieg von Vorfällen nach dem 7. Oktober 2023."} },
          { t:"p", c:{
            fr:"La mémoire du passé colonial fait aussi débat. L'Allemagne a mené un génocide contre les <strong>Herero et les Nama</strong> en Namibie (1904-1908). En <strong>2021</strong>, le gouvernement fédéral reconnaît officiellement ce génocide et annonce des fonds de développement de plus d'un milliard d'euros sur trente ans, sans parler de réparations juridiques, ce qui est contesté par plusieurs représentants namibiens. Un autre débat, parfois appelé « querelle des historiens 2.0 », oppose ceux qui défendent le caractère singulier de la Shoah à ceux qui veulent l'inscrire dans une histoire plus large des violences coloniales et génocidaires.",

<script>
/* ─── Utilitaires ─── */
const $ = (s,r=document)=>r.querySelector(s);
let LANG = 'fr';
/* T() : renvoie la version dans la langue courante, ou la valeur telle quelle */
const T = v => (v && typeof v==='object' && !Array.isArray(v) && ('fr' in v||'de' in v)) ? (v[LANG] ?? v.fr) : v;

/* ─── Libellés d'interface ─── */
const UI = {
  fr:{ chrono:"Chronologie",
       essentiel:"L'essentiel", reperes:"Repères", quiEstQui:"Qui est qui", acteurs:"Acteurs clés",
       controverse:"Controverse", vocab:"Vocabulaire", lexique:"Lexique bilingue",
       filtrer:"Filtrer le lexique…", terme:"Terme", trad:"Traduction / usage",
       entrainement:"Entraînement", sujets:"Sujets possibles", memoriser:"Mémoriser",
       retenir:"À retenir", synthese:"Synthèse", chapitre:"Chapitre" },
  de:{ chrono:"Chronologie",
       essentiel:"Das Wesentliche", reperes:"Eckdaten", quiEstQui:"Wer ist wer", acteurs:"Schlüsselfiguren",
       controverse:"Kontroverse", vocab:"Vokabular", lexique:"Zweisprachiges Glossar",
       filtrer:"Glossar filtern…", terme:"Begriff", trad:"Übersetzung / Gebrauch",
       entrainement:"Training", sujets:"Mögliche Themen", memoriser:"Einprägen",
       retenir:"Merke", synthese:"Synthese", chapitre:"Kapitel" }
};
const t = k => UI[LANG][k];

/* ─── Rendu des blocs de contenu ─── */
function bloc(b){
  switch(b.t){
    case 'p':      return `<p class="prose">${T(b.c)}</p>`;
    case 'liste':  return `<ul class="liste">${T(b.items).map(i=>`<li>${i}</li>`).join('')}</ul>`;
    case 'faits':  return `<div class="faits">${T(b.items).map(i=>
                     `<div class="fait"><div class="fait-l">${T(i.l)}</div><div class="fait-v">${T(i.v)}</div></div>`).join('')}</div>`;
    case 'stats':  return `<div class="stats">${b.items.map(i=>
                     `<div class="stat" style="--c:${i.c||'var(--a1)'}"><span class="stat-n">${T(i.n)}</span><span class="stat-d">${T(i.d)}</span></div>`).join('')}</div>`;
    case 'citation':return `<blockquote class="citation"><p>« ${T(b.c)} »</p><cite>${T(b.src)}</cite></blockquote>`;
    case 'encadre':return `<div class="encadre" style="--c:${b.c||'var(--a2)'}"><div class="encadre-ic">${b.icon||'💡'}</div>
                     <div><div class="encadre-t">${T(b.titre)}</div><div class="encadre-c">${T(b.c2)}</div></div></div>`;
    case 'def':    return `<div class="def"><div class="def-mot">${T(b.mot)}</div><div class="def-c">${T(b.c)}</div></div>`;
    case 'tableau':return `<div class="tbl-wrap"><table><thead><tr>${T(b.head).map(h=>`<th>${h}</th>`).join('')}</tr></thead>
                     <tbody>${T(b.rows).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tl':     return `<div class="tl">${T(b.items).map(i=>
                     `<div class="tl-item"><div class="tl-d">${T(i.d)}</div><div class="tl-c">${T(i.c)}</div></div>`).join('')}</div>`;
    default:       return '';
  }
}

/* ─── En-tête ─── */
function rendreHero(){
  const m = COURS.meta;
  document.documentElement.dataset.theme = m.theme;
  document.documentElement.lang = LANG;
  document.title = T(m.titre) + ' — Civilisation';
  $('#bc-titre').textContent = m.titre.fr ?? m.titre;   // la nav reste en français
  $('#ft').textContent = `${t('chapitre')} ${m.chapitre}${LANG==='fr'?' : ':': '}${T(m.titre)}`;
  $('#hero').innerHTML = `
    <span class="hero-flag">${m.drapeau}</span>
    <div class="hero-label">${T(m.label)}</div>
    <h1>${String(T(m.titre)).replace(/&/g,'<span class="amp">&amp;</span>')}</h1>
    <p class="hero-sub">${T(m.sousTitre)}</p>`;
}

/* ─── Corps du cours ─── */

  if(c.chronologie?.length){
    out.push(`<section class="bloc rev chrono-mobile" id="s-chrono">

  }

  c.parties.forEach((p,pi)=>{
    let html = `<section class="partie rev" id="p-${pi}" style="--p:${p.couleur}">

      <div><div class="partie-kicker">${T(p.kicker)}</div><h2 class="partie-title">${T(p.titre)}</h2></div></div>`;

      html += `<div class="section" id="p-${pi}-${si}"><h3 class="section-title"><span class="section-num">${si+1}.</span> ${T(s.titre)}</h3>
        ${s.blocs.map(bloc).join('')}</div>`;
    });
    out.push(html+`</section>`);
  });

  if(c.acteurs?.length){
    out.push(`<section class="bloc rev" id="s-acteurs">

        `<div class="acteur" style="--c:${a.c}"><div class="acteur-nom">${a.nom}</div>
         <div class="acteur-role">${T(a.role)}</div><div class="acteur-c">${T(a.d)}</div></div>`).join('')}</div></section>`);
  }


  if(c.lexique?.length){
    out.push(`<section class="bloc rev" id="s-lexique">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a2)">${t('vocab')}</span>
      <h2 class="bloc-title">${t('lexique')}</h2></div>
      <input class="lex-search" id="lex-search" placeholder="${t('filtrer')}" aria-label="${t('filtrer')}">
      <div class="tbl-wrap"><table class="lex"><thead><tr><th>${t('terme')}</th><th>${t('trad')}</th></tr></thead>
      <tbody id="lex-body">${c.lexique.map(l=>`<tr><td>${l.de}</td><td>${l.fr}</td></tr>`).join('')}</tbody></table></div>
    </section>`);
  }


  if(c.retenir?.length){
    out.push(`<section class="bloc rev" id="s-retenir">
      <div class="bloc-head"><span class="bloc-kicker">${t('memoriser')}</span><h2 class="bloc-title">${t('retenir')}</h2></div>
      <div class="retenir"><ul>${T(c.retenir).map(r=>`<li>${r}</li>`).join('')}</ul></div></section>`);
  }

  $('#cours').innerHTML = out.join('');
}

/* ─── Colonne chronologie ─── */
function rendreRail(){
  if(!COURS.chronologie?.length){ $('#rail')?.remove(); return; }
  $('#rail').innerHTML = `<div class="rail-title">${t('chrono')}</div>${bloc({t:'tl',items:COURS.chronologie})}`;
}

/* ─── Recherche dans le lexique ─── */
function brancherLexique(){
  const ls = $('#lex-search'); if(!ls) return;
  ls.addEventListener('input', ()=>{
    const q = ls.value.toLowerCase().trim();
    $('#lex-body').querySelectorAll('tr').forEach(tr=>{
      tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
}

/* ─── Changement de langue ─── */
function setLang(lang){
  LANG = lang;
  $('#ap-btn-fr').classList.toggle('active', lang==='fr');
  $('#ap-btn-de').classList.toggle('active', lang==='de');
  rendreHero(); rendreCours(); rendreRail();
  document.querySelectorAll('.rev').forEach(el=>el.classList.add('vu'));
  brancherLexique();
}

/* ─── Démarrage ─── */
function demarrer(){
  rendreHero(); rendreCours(); rendreRail(); brancherLexique();

  const maj = ()=>{
    const h = document.body.scrollHeight - innerHeight;
    $('#progress').style.width = (h>0 ? (scrollY/h)*100 : 0) + '%';
  };
  addEventListener('scroll', maj, {passive:true}); maj();

  if(!('IntersectionObserver' in window)){
    document.querySelectorAll('.rev').forEach(el=>el.classList.add('vu'));
    return;
  }
  const io = new IntersectionObserver(es=>es.forEach(x=>{
    if(x.isIntersecting){ x.target.classList.add('vu'); io.unobserve(x.target); }
  }), {threshold:.06});
  document.querySelectorAll('.rev').forEach(el=>io.observe(el));
}

demarrer();
</script>
</body>
</html>
