<!DOCTYPE html>
<html lang="fr" data-theme="allemand">
<head>
<script src="../../../../auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'histoire de l'Allemagne — Civilisation Germanophone</title>
<link rel="stylesheet" href="../../../../fonts/fonts.css">

<!-- ══════════════════════════════════════════════════════════════════════
     TEMPLATE UNIVERSEL DE COURS DE CIVILISATION — v1
     Pour créer un nouveau cours : dupliquer ce fichier, ne modifier QUE
     le bloc de données (id="donnees") tout en bas. Rien d'autre à toucher.
     ══════════════════════════════════════════════════════════════════════ -->

<style>
  /* ─── PALETTE DE BASE (identique au site) ─── */
  :root{
    --bg:#0d0d0f; --surface:#16161a; --surface2:#1e1e24; --border:#2a2a35;
    --text:#e8e6e0; --text-dim:#8a8880; --text-faint:#4a4845;
    --radius:14px;
  }
  /* ─── THÈMES PAR LANGUE — change data-theme sur <html> ─── */
  html[data-theme="anglais"] { --a1:#c8a96e; --a2:#7c9ec9; --a3:#9ecba0; --a4:#c97c9e; --hero:#16233d; }
  html[data-theme="anglais2"] { --a1:#c9633f; --a2:#5b8f6f; --a3:#6c8fc7; --a4:#a06bb0; --hero:#16241b; }
  html[data-theme="allemand"]{ --a1:#e0a93e; --a2:#c8553d; --a3:#7fae7a; --a4:#b06fa8; --hero:#3a1a18; }
  html[data-theme="allemand"]{ --a1:#d8b44a; --a2:#8fa4bd; --a3:#84b58e; --a4:#c06060; --hero:#241f1a; }
  html[data-theme="italien"] { --a1:#d5a94e; --a2:#6fae8f; --a3:#a8c07a; --a4:#c4695e; --hero:#152a24; }
  html[data-theme="chinois"] { --a1:#d9a441; --a2:#c05a4a; --a3:#83a98f; --a4:#a97fb0; --hero:#2c1618; }
  html[data-theme="anglais3"]{ --a1:#c1a24b; --a2:#8b3a3a; --a3:#3f6b8a; --a4:#5f7a52; --hero:#241512; }

  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;overflow-x:hidden}

  /* ─── FOND ─── */
  .bg-orb{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;opacity:.08;z-index:0}
  .orb1{width:700px;height:700px;background:var(--a1);top:-300px;right:-250px}
  .orb2{width:600px;height:600px;background:var(--a2);bottom:-250px;left:-250px}

  /* ─── BARRE DE PROGRESSION ─── */
  #progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:200;
    background:linear-gradient(90deg,var(--a1),var(--a2),var(--a4));transition:width .1s linear}

  /* ─── NAV ─── */
  nav{display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding:16px 40px;border-bottom:1px solid var(--border);
    background:rgba(13,13,15,.9);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100}
  .nav-logo{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;color:var(--a1);cursor:pointer}
  .breadcrumb{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--text-dim);flex-wrap:wrap}
  .breadcrumb span{cursor:pointer;transition:color .2s}
  .breadcrumb span:hover{color:var(--a1)}
  .breadcrumb .sep{color:var(--text-faint);cursor:default}
  .breadcrumb .current{color:var(--text);cursor:default}
  .nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .ap-lang-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    color:rgba(255,255,255,.6);font-family:'DM Mono',monospace;font-size:10px;font-weight:700;
    letter-spacing:.12em;padding:5px 14px;border-radius:4px;cursor:pointer;transition:all .2s;text-transform:uppercase}
  .ap-lang-btn.active{background:var(--a1);border-color:var(--a1);color:#12100c}
  .ap-lang-btn:hover:not(.active){background:rgba(255,255,255,.15);color:#fff}

  /* ─── HERO ─── */
  .hero{position:relative;z-index:1;padding:76px 40px 56px;text-align:center;overflow:hidden;
    background:linear-gradient(160deg,var(--hero),#0d0d0f 85%);border-bottom:1px solid var(--border)}
  .hero::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
    width:80px;height:2px;background:var(--a1)}
  .hero-flag{font-size:2.6rem;line-height:1;margin-bottom:18px;display:block}
  .hero-label{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.3em;
    text-transform:uppercase;color:var(--a1);margin-bottom:18px}
  .hero h1{font-family:'Playfair Display',serif;font-weight:900;line-height:1.05;
    font-size:clamp(2.4rem,6vw,4.6rem);max-width:900px;margin:0 auto 18px}
  .hero-sub{font-size:1rem;color:var(--text-dim);max-width:640px;margin:0 auto;line-height:1.6}

  /* ─── LAYOUT ─── */
  .layout{display:flex;gap:48px;max-width:1320px;margin:0 auto;padding:48px 40px 100px;position:relative;z-index:1}
  main{flex:1;min-width:0;max-width:840px}

  /* ─── COLONNE CHRONOLOGIE ─── */
  .rail{width:262px;flex-shrink:0;position:sticky;top:88px;align-self:flex-start;
    max-height:calc(100vh - 118px);overflow-y:auto;padding-right:8px}
  .rail-title{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;
    color:var(--a1);margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border)}
  .rail .tl{padding-left:20px;margin:0 0 0 4px}
  .rail .tl-item{padding-bottom:16px}
  .rail .tl-item::before{left:-26px;top:4px;width:7px;height:7px}
  .rail .tl-d{font-size:.66rem;letter-spacing:.08em}
  .rail .tl-c{font-size:.79rem;line-height:1.5}
  .rail::-webkit-scrollbar{width:3px}
  .rail::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .chrono-mobile{display:none}

  /* ─── BLOC GÉNÉRIQUE ─── */
  .bloc{margin-bottom:64px;scroll-margin-top:88px}
  .bloc-head{display:flex;align-items:baseline;gap:14px;margin-bottom:24px;
    padding-bottom:12px;border-bottom:1px solid var(--border)}
  .bloc-kicker{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--k,var(--a1))}
  .bloc-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--text)}

  /* ─── L'ESSENTIEL ─── */
  .essentiel{background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    border:1px solid var(--border);border-left:3px solid var(--a1);border-radius:var(--radius);
    padding:28px 30px;margin-bottom:36px}
  .essentiel-label{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--a1);margin-bottom:14px}
  .essentiel p{font-size:.98rem;line-height:1.75;color:var(--text);margin-bottom:0}
  .essentiel p strong{color:var(--a1);font-weight:500}

  /* ─── STATS ─── */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0}
  .stat{border-radius:10px;padding:18px 16px;text-align:center;border:1px solid rgba(255,255,255,.08);
    background:linear-gradient(135deg,color-mix(in srgb,var(--c,var(--a1)) 26%,#101014),
    color-mix(in srgb,var(--c,var(--a1)) 8%,#101014))}
  .stat-n{font-family:'DM Mono',monospace;font-size:1.5rem;font-weight:500;color:var(--text);display:block;line-height:1.1}
  .stat-d{font-size:.7rem;color:var(--text-dim);margin-top:7px;display:block;line-height:1.45}

  /* ─── PARTIES ─── */
  .partie{margin-bottom:78px;scroll-margin-top:88px}
  .partie-head{display:flex;align-items:center;gap:22px;margin-bottom:34px;
    padding-bottom:18px;border-bottom:2px solid var(--p)}
  .partie-num{font-family:'Playfair Display',serif;font-size:3.4rem;font-weight:900;
    color:var(--p);opacity:.35;line-height:.9;flex-shrink:0}
  .partie-title{font-family:'Playfair Display',serif;font-size:clamp(1.35rem,3vw,1.95rem);
    font-weight:700;line-height:1.2}
  .partie-kicker{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.24em;
    text-transform:uppercase;color:var(--p);margin-bottom:6px}

  .section{margin-bottom:44px;scroll-margin-top:88px}
  .section-title{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;
    color:var(--text);margin-bottom:18px;padding-left:16px;border-left:3px solid var(--p)}
  .section-num{color:var(--p);font-weight:900}

  /* ─── TEXTE ─── */
  .prose{font-size:.96rem;line-height:1.8;color:rgba(232,230,224,.78);margin-bottom:16px}
  .prose strong{color:var(--text);font-weight:500}
  .prose em{color:var(--p,var(--a1));font-style:normal;font-weight:500}
  .en{font-family:'DM Mono',monospace;font-size:.86em;color:var(--a2)}

  /* ─── LISTE ─── */
  .liste{list-style:none;margin:14px 0 20px}
  .liste li{font-size:.93rem;line-height:1.65;color:rgba(232,230,224,.75);
    padding:9px 0 9px 22px;position:relative;border-bottom:1px solid rgba(255,255,255,.05)}
  .liste li:last-child{border-bottom:none}
  .liste li::before{content:'';position:absolute;left:0;top:17px;width:6px;height:6px;
    border-radius:50%;background:var(--p,var(--a1))}
  .liste li strong{color:var(--text);font-weight:500}

  /* ─── FAITS CLÉS ─── */
  .faits{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;margin:20px 0}
  .fait{background:rgba(255,255,255,.03);border:1px solid var(--border);
    border-left:3px solid var(--p,var(--a1));border-radius:8px;padding:13px 15px}
  .fait-l{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--text-faint);
    text-transform:uppercase;letter-spacing:.14em;margin-bottom:5px}
  .fait-v{font-size:.86rem;font-weight:500;color:var(--text);line-height:1.4}

  /* ─── CITATION ─── */
  .citation{background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
    border:1px solid var(--border);border-left:3px solid var(--a1);border-radius:0 10px 10px 0;
    padding:20px 24px;margin:22px 0}
  .citation p{font-family:'Playfair Display',serif;font-style:italic;font-size:1.02rem;
    line-height:1.6;color:var(--text);margin-bottom:9px}
  .citation cite{font-family:'DM Mono',monospace;font-size:.66rem;letter-spacing:.08em;
    color:var(--a1);font-style:normal}

  /* ─── ENCADRÉ ─── */
  .encadre{display:flex;gap:15px;align-items:flex-start;border-radius:10px;padding:17px 20px;margin:20px 0;
    background:color-mix(in srgb,var(--c,var(--a2)) 7%,transparent);
    border:1px solid color-mix(in srgb,var(--c,var(--a2)) 26%,transparent)}
  .encadre-ic{font-size:1.5rem;flex-shrink:0;line-height:1.2}
  .encadre-t{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.2em;
    text-transform:uppercase;color:var(--c,var(--a2));margin-bottom:7px;font-weight:500}
  .encadre-c{font-size:.89rem;line-height:1.7;color:rgba(232,230,224,.75)}
  .encadre-c strong{color:var(--text);font-weight:500}

  /* ─── DÉFINITION ─── */
  .def{border:1px dashed var(--border);border-radius:10px;padding:15px 18px;margin:18px 0;
    background:rgba(255,255,255,.02)}
  .def-mot{font-family:'Playfair Display',serif;font-weight:700;font-size:1rem;color:var(--a3);margin-bottom:6px}
  .def-c{font-size:.88rem;line-height:1.7;color:rgba(232,230,224,.72)}

  /* ─── TABLEAU ─── */
  .tbl-wrap{overflow-x:auto;margin:20px 0;border:1px solid var(--border);border-radius:10px}
  table{width:100%;border-collapse:collapse;font-size:.83rem}
  thead{background:rgba(255,255,255,.04)}
  thead th{padding:11px 15px;text-align:left;font-family:'DM Mono',monospace;font-size:.6rem;
    letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap}
  tbody tr{border-top:1px solid var(--border)}
  tbody tr:nth-child(even){background:rgba(255,255,255,.015)}
  tbody td{padding:11px 15px;color:rgba(232,230,224,.75);line-height:1.5}
  tbody td:first-child{color:var(--text);font-weight:500}

  /* ─── CHRONOLOGIE ─── */
  .tl{border-left:2px solid var(--border);padding-left:26px;margin:8px 0 8px 6px}
  .tl-item{position:relative;padding-bottom:22px}
  .tl-item:last-child{padding-bottom:0}
  .tl-item::before{content:'';position:absolute;left:-33px;top:5px;width:9px;height:9px;border-radius:50%;
    background:var(--c,var(--a1));box-shadow:0 0 0 3px rgba(13,13,15,1),0 0 0 5px color-mix(in srgb,var(--c,var(--a1)) 35%,transparent)}
  .tl-d{font-family:'DM Mono',monospace;font-size:.72rem;font-weight:500;letter-spacing:.1em;
    color:var(--c,var(--a1));margin-bottom:4px}
  .tl-c{font-size:.9rem;line-height:1.6;color:rgba(232,230,224,.75)}
  .tl-c strong{color:var(--text);font-weight:500}

  /* ─── ACTEURS ─── */
  .acteurs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .acteur{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;
    transition:all .25s;position:relative;overflow:hidden}
  .acteur:hover{border-color:var(--c,var(--a1));transform:translateY(-3px);background:var(--surface2)}
  .acteur-nom{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;margin-bottom:3px}
  .acteur-role{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--c,var(--a1));margin-bottom:10px}
  .acteur-c{font-size:.82rem;line-height:1.6;color:var(--text-dim)}

  /* ─── DÉBAT ─── */
  .debat{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .debat-col{border:1px solid var(--border);border-radius:12px;padding:20px 22px;background:rgba(255,255,255,.02)}
  .debat-col.oui{border-top:3px solid var(--a3)}
  .debat-col.non{border-top:3px solid var(--a4)}
  .debat-t{font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}
  .debat-col.oui .debat-t{color:var(--a3)}
  .debat-col.non .debat-t{color:var(--a4)}
  .debat-col li{font-size:.87rem;line-height:1.6;color:rgba(232,230,224,.75);
    padding:9px 0 9px 18px;position:relative;list-style:none;border-bottom:1px solid rgba(255,255,255,.05)}
  .debat-col li:last-child{border-bottom:none}
  .debat-col li::before{content:'';position:absolute;left:0;top:16px;width:5px;height:5px;border-radius:50%}
  .debat-col.oui li::before{background:var(--a3)}
  .debat-col.non li::before{background:var(--a4)}
  .debat-col li strong{color:var(--text);font-weight:500}

  /* ─── LEXIQUE ─── */
  .lex-search{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-family:'DM Sans',sans-serif;font-size:.88rem;padding:11px 15px;margin-bottom:14px}
  .lex-search:focus{outline:none;border-color:var(--a1)}
  .lex-search::placeholder{color:var(--text-faint)}
  .lex td:first-child{font-family:'DM Mono',monospace;color:var(--a2);font-weight:500}

  /* ─── SUJETS ─── */
  .sujet{border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:10px;
    background:var(--surface);display:flex;gap:16px;align-items:flex-start;transition:all .2s}
  .sujet:hover{border-color:var(--a4);transform:translateX(4px)}
  .sujet-n{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:900;color:var(--text-faint);line-height:1;flex-shrink:0}
  .sujet-q{font-size:.94rem;line-height:1.6;color:var(--text);margin-bottom:5px;font-weight:400}
  .sujet-h{font-size:.79rem;color:var(--text-dim);line-height:1.55}

  /* ─── À RETENIR ─── */
  .retenir{background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 12%,transparent),rgba(255,255,255,.02));
    border:1px solid color-mix(in srgb,var(--a1) 30%,transparent);border-radius:var(--radius);padding:28px 30px}
  .retenir li{font-size:.93rem;line-height:1.65;color:rgba(232,230,224,.82);
    padding:10px 0 10px 26px;position:relative;list-style:none;border-bottom:1px solid rgba(255,255,255,.06)}
  .retenir li:last-child{border-bottom:none}
  .retenir li::before{content:'✓';position:absolute;left:0;top:9px;color:var(--a1);font-size:.85rem}
  .retenir li strong{color:var(--text);font-weight:500}

  /* ─── PIED DE PAGE ─── */
  footer{text-align:center;padding:36px 40px;border-top:1px solid var(--border);
    font-family:'DM Mono',monospace;font-size:.7rem;color:var(--text-dim);letter-spacing:.14em;
    text-transform:uppercase}

  /* ─── ANIMATION ─── */
  .rev{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
  .rev.vu{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){.rev{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
  :focus-visible{outline:2px solid var(--a1);outline-offset:3px}

  /* ─── RESPONSIVE ─── */
  @media(max-width:1080px){
    .rail{display:none}
    .layout{padding:32px 22px 70px}
    .chrono-mobile{display:block}
  }
  @media(max-width:680px){
    nav{padding:12px 18px;flex-wrap:wrap}
    .breadcrumb{font-size:.7rem;order:3;width:100%}
    .hero{padding:52px 20px 40px}
    .debat{grid-template-columns:1fr}
    .partie-head{gap:14px}
    .partie-num{font-size:2.4rem}
  }
  /* ─── IMPRESSION ─── */
  @media print{
    body{background:#fff;color:#111}
    nav,.rail,#progress,.bg-orb,.nav-right{display:none!important}
    .hero{background:none;border-bottom:2px solid #111;padding:0 0 22px}
    .hero h1,.prose,.liste li,.bloc-title{color:#111}
    .layout{display:block;padding:0}
    .partie,.bloc{break-inside:avoid;page-break-inside:avoid}
    .rev{opacity:1;transform:none}
    .chrono-mobile{display:block!important}
  }
</style>
</head>
<body>

<div id="progress"></div>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<nav>
  <div class="nav-logo" onclick="location.href='../../../../index.html'">ECG Prépa</div>
  <div class="breadcrumb">
    <span onclick="location.href='../../../../index.html'">Accueil</span>
    <span class="sep">/</span>
    <span onclick="location.href='../../../index.html'">2ème Année</span>
    <span class="sep">/</span>
    <span onclick="location.href='../../index.html'">Langues</span>
    <span class="sep">/</span>
    <span onclick="location.href='../index.html'">Civilisation</span>
    <span class="sep">/</span>
    <span class="current" id="bc-titre">—</span>
  </div>
  <div class="nav-right">
    <button id="ap-btn-fr" class="ap-lang-btn active" onclick="setLang('fr')">🇫🇷 FR</button>
    <button id="ap-btn-de" class="ap-lang-btn" onclick="setLang('de')">🇩🇪 DE</button>
  </div>
</nav>

<header class="hero" id="hero"></header>

<div class="layout">
  <aside class="rail" id="rail"></aside>
  <main id="cours"></main>
</div>

<footer id="ft"></footer>


<!-- ══════════════════════════════════════════════════════════════════
     ⬇⬇⬇  SEULE PARTIE À MODIFIER POUR UN NOUVEAU COURS  ⬇⬇⬇
     ══════════════════════════════════════════════════════════════════ -->
<script id="donnees">
const COURS = {

  /* ─── 1. IDENTITÉ DU COURS ───────────────────────────────────────── */
  meta: {
    theme:     "allemand",
    drapeau:   "🇩🇪",
    chapitre:  "1",
    label:     { fr:"Allemagne · Chapitre 01", de:"Deutschland · Kapitel 01" },
    titre:     { fr:"L'histoire de l'Allemagne", de:"Die Geschichte Deutschlands" },
    sousTitre: { fr:"Du Saint-Empire à la République fédérale : un espace morcelé, unifié tardivement, puis divisé et réunifié.",
                 de:"Vom Heiligen Römischen Reich zur Bundesrepublik: ein zersplitterter Raum, spät geeint, dann geteilt und wiedervereinigt." }
  },

  /* ─── 2. L'ESSENTIEL + CHIFFRES CLÉS ─────────────────────────────── */
  essentiel: {
    fr:"L'histoire de l'Allemagne est celle d'un <strong>espace politique longtemps fragmenté</strong> : un Saint-Empire de centaines de principautés, une unité réalisée tardivement en <strong>1871</strong> par la Prusse de Bismarck, puis un XXe siècle de ruptures — guerres mondiales, nazisme, <strong>division</strong> de 1949 à 1990. Cette histoire explique le <strong>fédéralisme</strong> actuel, la méfiance envers un pouvoir central trop fort et l'ancrage européen de la République fédérale.",

        blocs:[
          { t:"p", c:{
            fr:"L'espace allemand naît du partage de l'empire de <strong>Charlemagne</strong> (843), dont la partie orientale devient un royaume à dominante germanique. En <strong>962</strong>, le roi saxon <strong>Otton Ier</strong> est couronné empereur à Rome : c'est le début du <strong>Saint-Empire romain germanique</strong>, qui durera jusqu'en 1806. Mais l'empereur est élu — la <strong>Bulle d'or</strong> (1356) fixe à sept le nombre des princes-électeurs — et son pouvoir reste limité face aux princes, aux villes libres et aux évêques.",
            de:"Der deutsche Raum entsteht aus der Teilung des Reiches <strong>Karls des Großen</strong> (843), dessen Ostteil zu einem überwiegend germanischen Königreich wird. Im Jahr <strong>962</strong> wird der Sachsenkönig <strong>Otto I.</strong> in Rom zum Kaiser gekrönt: Das ist der Beginn des <strong>Heiligen Römischen Reiches Deutscher Nation</strong>, das bis 1806 bestehen wird. Doch der Kaiser wird gewählt — die <strong>Goldene Bulle</strong> (1356) legt die Zahl der Kurfürsten auf sieben fest — und seine Macht bleibt gegenüber Fürsten, Reichsstädten und Bischöfen begrenzt." } },
          { t:"p", c:{
            fr:"Au XVIe siècle, l'imprimerie de <strong>Gutenberg</strong> et les <strong>95 thèses de Luther</strong> (1517) provoquent la <strong>Réforme</strong>, qui coupe l'Empire en deux camps confessionnels. La paix d'Augsbourg (1555) laisse chaque prince choisir la religion de ses sujets, mais les tensions dégénèrent dans la <strong>guerre de Trente Ans</strong> (1618-1648), conflit européen mené surtout sur le sol allemand. Les traités de Westphalie (1648) consacrent la souveraineté de plusieurs centaines de territoires : l'Allemagne en sort <strong>ruinée et durablement morcelée</strong>.",
            de:"Im 16. Jahrhundert lösen <strong>Gutenbergs</strong> Buchdruck und <strong>Luthers 95 Thesen</strong> (1517) die <strong>Reformation</strong> aus, die das Reich in zwei Konfessionslager spaltet. Der Augsburger Religionsfriede (1555) überlässt jedem Landesherrn die Wahl der Konfession seiner Untertanen, doch die Spannungen münden im <strong>Dreißigjährigen Krieg</strong> (1618-1648), einem europäischen Konflikt, der vor allem auf deutschem Boden ausgetragen wird. Der Westfälische Frieden (1648) bestätigt die Souveränität mehrerer Hundert Territorien: Deutschland geht daraus <strong>verwüstet und dauerhaft zersplittert</strong> hervor." } },
          { t:"faits", items:[

          ]}

      {
        titre:{fr:"L'ascension de la Prusse et la fin du Saint-Empire",
               de:"Der Aufstieg Preußens und das Ende des Alten Reiches"},
        blocs:[
          { t:"p", c:{
            fr:"Au XVIIIe siècle, deux puissances dominent l'espace allemand : l'<strong>Autriche des Habsbourg</strong> et le <strong>Brandebourg-Prusse</strong>, érigé en royaume en 1701. Sous <strong>Frédéric II</strong> (1740-1786), la Prusse, forte de son armée et de son administration, conquiert la Silésie et s'impose comme grande puissance. Cette rivalité austro-prussienne structure l'histoire allemande jusqu'en 1866.",
            de:"Im 18. Jahrhundert beherrschen zwei Mächte den deutschen Raum: das <strong>habsburgische Österreich</strong> und <strong>Brandenburg-Preußen</strong>, das 1701 zum Königreich erhoben wird. Unter <strong>Friedrich II.</strong> (1740-1786) erobert Preußen dank seines Heeres und seiner Verwaltung Schlesien und steigt zur Großmacht auf. Dieser österreichisch-preußische Dualismus prägt die deutsche Geschichte bis 1866." } },
          { t:"p", c:{
            fr:"Les guerres napoléoniennes mettent fin à l'ancien ordre : en <strong>1806</strong>, François II renonce à la couronne impériale et le Saint-Empire disparaît. Le <strong>Congrès de Vienne</strong> (1815) crée la <strong>Confédération germanique</strong>, une association lâche de 39 États présidée par l'Autriche. Les guerres de libération contre Napoléon ont toutefois éveillé un <strong>sentiment national</strong> allemand, qui réclame désormais l'unité et des libertés constitutionnelles.",
            de:"Die napoleonischen Kriege beenden die alte Ordnung: <strong>1806</strong> legt Franz II. die Kaiserkrone nieder, das Heilige Römische Reich erlischt. Der <strong>Wiener Kongress</strong> (1815) schafft den <strong>Deutschen Bund</strong>, einen losen Zusammenschluss von 39 Staaten unter österreichischem Vorsitz. Die Befreiungskriege gegen Napoleon haben jedoch ein deutsches <strong>Nationalgefühl</strong> geweckt, das nun Einheit und verfassungsmäßige Freiheiten fordert." } },
          { t:"def", mot:{fr:"Kleinstaaterei",de:"Kleinstaaterei"},

               de:"Begriff für die Zersplitterung des deutschen Raums in eine Vielzahl kleiner souveräner Staaten, ein dauerhaftes Hindernis für die nationale Einheit und die wirtschaftliche Entwicklung."} }

        blocs:[
          { t:"p", c:{
            fr:"L'unité économique précède l'unité politique : le <strong>Zollverein</strong> (1834), union douanière dominée par la Prusse et excluant l'Autriche, crée un grand marché intérieur que stimule le chemin de fer. En <strong>1848</strong>, la révolution gagne l'Allemagne : le <strong>Parlement de Francfort</strong>, réuni à l'église Saint-Paul, rédige une constitution libérale et offre la couronne impériale au roi de Prusse. <strong>Frédéric-Guillaume IV</strong> la refuse en 1849 : l'unité par le bas, portée par les libéraux, a échoué.",
            de:"Die wirtschaftliche Einheit geht der politischen voraus: Der <strong>Zollverein</strong> (1834), eine von Preußen dominierte und Österreich ausschließende Zollunion, schafft einen großen Binnenmarkt, den die Eisenbahn beflügelt. <strong>1848</strong> erfasst die Revolution Deutschland: Das <strong>Frankfurter Parlament</strong> in der Paulskirche arbeitet eine liberale Verfassung aus und bietet dem preußischen König die Kaiserkrone an. <strong>Friedrich Wilhelm IV.</strong> lehnt sie 1849 ab: Die Einheit von unten, getragen von den Liberalen, ist gescheitert." } }

      {

        blocs:[
          { t:"p", c:{
            fr:"L'unité viendra d'en haut. Nommé ministre-président de Prusse en 1862, <strong>Otto von Bismarck</strong> proclame que les grandes questions se règlent « par le fer et par le sang ». Trois guerres réalisent l'unité : contre le <strong>Danemark</strong> (1864), contre l'<strong>Autriche</strong> (1866, victoire de Sadowa, qui exclut l'Autriche de l'Allemagne et mène à la Confédération de l'Allemagne du Nord) et contre la <strong>France</strong> (1870-1871). Le 18 janvier 1871, l'<strong>Empire allemand</strong> est proclamé dans la galerie des Glaces de Versailles ; l'Alsace-Lorraine est annexée, ce qui nourrit pour des décennies le ressentiment français.",
            de:"Die Einheit kommt von oben. 1862 zum preußischen Ministerpräsidenten ernannt, verkündet <strong>Otto von Bismarck</strong>, die großen Fragen würden „durch Eisen und Blut“ entschieden. Drei Kriege verwirklichen die Einheit: gegen <strong>Dänemark</strong> (1864), gegen <strong>Österreich</strong> (1866, Sieg bei Königgrätz, der Österreich aus Deutschland ausschließt und zum Norddeutschen Bund führt) und gegen <strong>Frankreich</strong> (1870-1871). Am 18. Januar 1871 wird das <strong>Deutsche Kaiserreich</strong> im Spiegelsaal von Versailles ausgerufen; Elsass-Lothringen wird annektiert, was auf Jahrzehnte den französischen Revanchegedanken nährt." } },
          { t:"p", c:{
            fr:"Le nouvel Empire est une <strong>fédération de 25 États</strong> dominée par la Prusse : l'empereur est aussi roi de Prusse et le chancelier ne répond que devant lui. Bismarck mène le <em>Kulturkampf</em> contre l'Église catholique, combat les socialistes et crée dans les années 1880 les premières <strong>assurances sociales</strong> d'Europe (maladie, accidents, vieillesse). Sur la scène internationale, il pratique une politique d'équilibre et d'alliances pour isoler la France.",
            de:"Das neue Reich ist ein <strong>Bundesstaat aus 25 Ländern</strong> unter preußischer Vorherrschaft: Der Kaiser ist zugleich König von Preußen, der Kanzler ist nur ihm verantwortlich. Bismarck führt den <em>Kulturkampf</em> gegen die katholische Kirche, bekämpft die Sozialisten und schafft in den 1880er Jahren die ersten <strong>Sozialversicherungen</strong> Europas (Kranken-, Unfall- und Rentenversicherung). Außenpolitisch betreibt er eine Politik des Gleichgewichts und der Bündnisse, um Frankreich zu isolieren." } },
          { t:"citation", c:{fr:"Les grandes questions de l'époque ne se résolvent pas par des discours et des votes de majorité, mais par le fer et par le sang.", de:"Nicht durch Reden und Majoritätsbeschlüsse werden die großen Fragen der Zeit entschieden, sondern durch Eisen und Blut."}, src:{fr:"Otto von Bismarck, 1862",de:"Otto von Bismarck, 1862"} }
        ]

      {
        titre:{fr:"Guillaume II, la Weltpolitik et la Grande Guerre",

        blocs:[
          { t:"p", c:{
            fr:"En 1890, le jeune empereur <strong>Guillaume II</strong> congédie Bismarck et engage l'Allemagne dans la <strong>Weltpolitik</strong> : course aux colonies, flotte de guerre rivale de celle du Royaume-Uni, système d'alliances qui l'enferme face à l'Entente. L'Allemagne est alors la première puissance industrielle du continent, mais sa diplomatie inquiète ses voisins. Après l'attentat de Sarajevo (juin 1914), elle soutient l'Autriche-Hongrie et entre dans la <strong>Première Guerre mondiale</strong>.",
            de:"1890 entlässt der junge Kaiser <strong>Wilhelm II.</strong> Bismarck und führt Deutschland in die <strong>Weltpolitik</strong>: Wettlauf um Kolonien, eine Kriegsflotte als Rivalin der britischen, ein Bündnissystem, das das Reich gegenüber der Entente einkreist. Deutschland ist damals die größte Industriemacht des Kontinents, doch seine Diplomatie beunruhigt die Nachbarn. Nach dem Attentat von Sarajevo (Juni 1914) unterstützt es Österreich-Ungarn und tritt in den <strong>Ersten Weltkrieg</strong> ein." } },
          { t:"p", c:{
            fr:"Épuisée par le blocus et les offensives, l'Allemagne s'effondre à l'automne 1918. Le <strong>9 novembre</strong>, Guillaume II abdique et la République est proclamée ; l'armistice est signé le 11 novembre. Le traité de <strong>Versailles</strong> (1919) impose à l'Allemagne la perte de territoires, une limitation de son armée et des réparations, et la rend responsable de la guerre : ce « diktat » pèsera lourd sur la jeune république.",
            de:"Erschöpft durch Blockade und Offensiven bricht Deutschland im Herbst 1918 zusammen. Am <strong>9. November</strong> dankt Wilhelm II. ab, die Republik wird ausgerufen; der Waffenstillstand wird am 11. November unterzeichnet. Der Vertrag von <strong>Versailles</strong> (1919) zwingt Deutschland zu Gebietsabtretungen, einer Begrenzung seines Heeres und Reparationen und macht es für den Krieg verantwortlich: Dieses „Diktat“ wird schwer auf der jungen Republik lasten." } }

            de:"Unter dem Druck der Protestbewegung im Osten und der Grenzöffnung Ungarns <strong>fällt die Mauer am 9. November 1989</strong>. Am <strong>3. Oktober 1990</strong> treten die fünf ostdeutschen <em>Länder</em> der Bundesrepublik bei: Das ist die <strong>Wiedervereinigung</strong>, von den vier ehemaligen Alliierten gebilligt. Seither ist Deutschland mit rund 83 Millionen Einwohnern die größte Volkswirtschaft Europas, geführt von Helmut Kohl, Gerhard Schröder, <strong>Angela Merkel</strong> (2005-2021), Olaf Scholz und zuletzt <strong>Friedrich Merz</strong> (Bundeskanzler seit Mai 2025)." } },
          { t:"encadre", icon:"🧭", c:"var(--a1)",
            titre:{fr:"Pourquoi cette histoire compte aujourd'hui",de:"Warum diese Geschichte heute wichtig ist"},
            c2:{fr:"Le fédéralisme, la prudence envers l'usage de la force, la culture du compromis et l'engagement européen de l'Allemagne actuelle sont autant de réponses aux erreurs d'un passé de centralisation autoritaire et de guerres.",
                de:"Föderalismus, Zurückhaltung beim Einsatz militärischer Gewalt, Kompromisskultur und europäisches Engagement des heutigen Deutschlands sind Antworten auf die Fehlentwicklungen einer Vergangenheit aus autoritärer Zentralisierung und Kriegen."} }
        ]
      }
    ]
  }
  ],

  /* ─── 5. ACTEURS CLÉS ─────────────────────────────────────────────── */
  acteurs: [
    { nom:"Charlemagne", c:"var(--a2)", role:{fr:"Roi des Francs, empereur (800)",de:"König der Franken, Kaiser (800)"},
      d:{fr:"Il unifie une grande partie de l'Europe occidentale ; Aix-la-Chapelle, sa capitale, fait de l'espace germanique un cœur de l'Empire.",
         de:"Er eint einen großen Teil Westeuropas; Aachen, seine Hauptstadt, macht den germanischen Raum zu einem Kernland des Reiches."} },
    { nom:"Martin Luther", c:"var(--a1)", role:{fr:"Théologien (1483-1546)",de:"Theologe (1483-1546)"},
      d:{fr:"Initiateur de la Réforme en 1517, il traduit la Bible en allemand et contribue à fixer la langue écrite.",
         de:"Initiator der Reformation 1517; er übersetzt die Bibel ins Deutsche und prägt die deutsche Schriftsprache mit."} },
    { nom:"Frédéric II", c:"var(--a3)", role:{fr:"Roi de Prusse (1740-1786)",de:"König von Preußen (1740-1786)"},
      d:{fr:"Souverain « éclairé » et chef de guerre, il fait de la Prusse une grande puissance rivale de l'Autriche.",
         de:"„Aufgeklärter“ Herrscher und Feldherr, der Preußen zu einer Großmacht und Rivalin Österreichs macht."} },
    { nom:"Otto von Bismarck", c:"var(--a4)", role:{fr:"Chancelier (1871-1890)",de:"Reichskanzler (1871-1890)"},
      d:{fr:"Artisan de l'unité allemande par la diplomatie et la guerre, il construit un système d'alliances et les premières assurances sociales.",
         de:"Baumeister der deutschen Einheit durch Diplomatie und Krieg; er schafft ein Bündnissystem und die ersten Sozialversicherungen."} },
    { nom:"Guillaume II", c:"var(--a2)", role:{fr:"Empereur (1888-1918)",de:"Kaiser (1888-1918)"},
      d:{fr:"Souverain impulsif, il renvoie Bismarck et mène une Weltpolitik qui contribue à l'isolement de l'Allemagne avant 1914.",
         de:"Impulsiver Herrscher, der Bismarck entlässt und eine Weltpolitik betreibt, die zur Isolierung Deutschlands vor 1914 beiträgt."} },
    { nom:"Angela Merkel", c:"var(--a1)", role:{fr:"Chancelière (2005-2021)",de:"Bundeskanzlerin (2005-2021)"},
      d:{fr:"Première femme chancelière, originaire de l'Est, elle dirige l'Allemagne et pèse sur l'Europe pendant seize ans.",
         de:"Erste Bundeskanzlerin, aus Ostdeutschland stammend; sie führt Deutschland sechzehn Jahre lang und prägt Europa."} }
  ],

  /* ─── 7. LEXIQUE BILINGUE ─────────────────────────────────────────── */
  lexique: [
    { de:"das Heilige Römische Reich", fr:"Le Saint-Empire romain germanique (962-1806)." },

    { de:"die Reformation", fr:"Réforme protestante lancée par Luther en 1517." },
    { de:"der Dreißigjährige Krieg", fr:"Guerre de Trente Ans (1618-1648)." },
    { de:"der Westfälische Friede", fr:"Paix de Westphalie (1648)." },
    { de:"die Kleinstaaterei", fr:"Morcellement de l'Allemagne en petits États." },
    { de:"der Deutsche Bund", fr:"Confédération germanique (1815-1866)." },
    { de:"der Zollverein", fr:"Union douanière allemande, créée en 1834." },
    { de:"die Reichsgründung", fr:"Fondation de l'Empire allemand en 1871." },
    { de:"der Kulturkampf", fr:"Conflit de Bismarck avec l'Église catholique (années 1870)." },
    { de:"die Weltpolitik", fr:"Politique d'expansion mondiale de Guillaume II." },
    { de:"das Kaiserreich", fr:"L'Empire allemand (1871-1918)." },
    { de:"die Wiedervereinigung", fr:"Réunification de l'Allemagne le 3 octobre 1990." }
  ],

  /* ─── 9. À RETENIR ───────────────────────────────────────────────── */
  retenir: {
    fr:[
      "Le <strong>Saint-Empire</strong> (962-1806) est un empire électif sans État centralisé : l'Allemagne reste un <strong>patchwork de territoires</strong> (<em>Kleinstaaterei</em>).",
      "La <strong>Réforme</strong> (1517) puis la <strong>guerre de Trente Ans</strong> (1618-1648) divisent durablement l'espace allemand sur le plan religieux et politique.",
      "Le rival de l'Autriche, la <strong>Prusse</strong>, s'impose au XVIIIe siècle et réalise l'unité en excluant les Habsbourg (1866).",
      "L'unité de <strong>1871</strong> se fait « par le fer et par le sang » : un Empire fédéral dominé par la Prusse, né d'une victoire sur la France.",
      "Après la défaite de 1918, la <strong>République de Weimar</strong> est fragilisée par Versailles, l'inflation et la crise de 1929, avant l'arrivée de <strong>Hitler</strong> en 1933.",
      "De <strong>1949 à 1990</strong>, deux Allemagnes coexistent : la RFA, démocratie ancrée à l'Ouest, et la RDA, dictature socialiste.",
      "La <strong>réunification</strong> (3 octobre 1990) fait de l'Allemagne la première économie européenne, profondément fédérale et tournée vers l'Europe."
    ],
    de:[
      "Das <strong>Heilige Römische Reich</strong> (962-1806) ist ein Wahlreich ohne zentralen Staat: Deutschland bleibt ein <strong>Flickenteppich von Territorien</strong> (<em>Kleinstaaterei</em>).",
      "<strong>Reformation</strong> (1517) und <strong>Dreißigjähriger Krieg</strong> (1618-1648) spalten den deutschen Raum religiös und politisch nachhaltig.",
      "Österreichs Rivale <strong>Preußen</strong> steigt im 18. Jahrhundert auf und vollendet die Einheit unter Ausschluss der Habsburger (1866).",
      "Die Einheit von <strong>1871</strong> entsteht „durch Eisen und Blut“: ein föderales Reich unter preußischer Dominanz, geboren aus einem Sieg über Frankreich.",
      "Nach der Niederlage von 1918 wird die <strong>Weimarer Republik</strong> durch Versailles, Inflation und die Krise von 1929 geschwächt, bevor <strong>Hitler</strong> 1933 an die Macht kommt.",
      "Von <strong>1949 bis 1990</strong> bestehen zwei deutsche Staaten: die BRD, eine im Westen verankerte Demokratie, und die DDR, eine sozialistische Diktatur.",
      "Die <strong>Wiedervereinigung</strong> (3. Oktober 1990) macht Deutschland zur größten Volkswirtschaft Europas, zutiefst föderal und europäisch ausgerichtet."
    ]
  }
};
</script>

     ══════════════════════════════════════════════════════════════════ -->


<script>
/* ─── Utilitaires ─── */
const $ = (s,r=document)=>r.querySelector(s);
let LANG = 'fr';
/* T() : renvoie la version dans la langue courante, ou la valeur telle quelle */
const T = v => (v && typeof v==='object' && !Array.isArray(v) && ('fr' in v||'de' in v)) ? (v[LANG] ?? v.fr) : v;

/* ─── Libellés d'interface ─── */
const UI = {
  fr:{ chrono:"Chronologie",
       essentiel:"L'essentiel", reperes:"Repères", quiEstQui:"Qui est qui", acteurs:"Acteurs clés",
       controverse:"Controverse", vocab:"Vocabulaire", lexique:"Lexique bilingue",
       filtrer:"Filtrer le lexique…", terme:"Terme", trad:"Traduction / usage",
       entrainement:"Entraînement", sujets:"Sujets possibles", memoriser:"Mémoriser",
       retenir:"À retenir", synthese:"Synthèse", chapitre:"Chapitre" },
  de:{ chrono:"Zeittafel",
       essentiel:"Das Wichtigste", reperes:"Eckdaten", quiEstQui:"Wer ist wer", acteurs:"Schlüsselfiguren",
       controverse:"Debatte", vocab:"Vokabular", lexique:"Zweisprachiges Glossar",
       filtrer:"Glossar filtern…", terme:"Begriff", trad:"Übersetzung / Gebrauch",
       entrainement:"Training", sujets:"Mögliche Themen", memoriser:"Wiederholen",
       retenir:"Zum Merken", synthese:"Zusammenfassung", chapitre:"Kapitel" }
};
const t = k => UI[LANG][k];

/* ─── Rendu des blocs de contenu ─── */
function bloc(b){
  switch(b.t){
    case 'p':      return `<p class="prose">${T(b.c)}</p>`;
    case 'liste':  return `<ul class="liste">${T(b.items).map(i=>`<li>${i}</li>`).join('')}</ul>`;
    case 'faits':  return `<div class="faits">${T(b.items).map(i=>
                     `<div class="fait"><div class="fait-l">${T(i.l)}</div><div class="fait-v">${T(i.v)}</div></div>`).join('')}</div>`;
    case 'stats':  return `<div class="stats">${b.items.map(i=>
                     `<div class="stat" style="--c:${i.c||'var(--a1)'}"><span class="stat-n">${T(i.n)}</span><span class="stat-d">${T(i.d)}</span></div>`).join('')}</div>`;
    case 'citation':return `<blockquote class="citation"><p>« ${T(b.c)} »</p><cite>${T(b.src)}</cite></blockquote>`;
    case 'encadre':return `<div class="encadre" style="--c:${b.c||'var(--a2)'}"><div class="encadre-ic">${b.icon||'💡'}</div>
                     <div><div class="encadre-t">${T(b.titre)}</div><div class="encadre-c">${T(b.c2)}</div></div></div>`;
    case 'def':    return `<div class="def"><div class="def-mot">${T(b.mot)}</div><div class="def-c">${T(b.c)}</div></div>`;
    case 'tableau':return `<div class="tbl-wrap"><table><thead><tr>${T(b.head).map(h=>`<th>${h}</th>`).join('')}</tr></thead>
                     <tbody>${T(b.rows).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tl':     return `<div class="tl">${T(b.items).map(i=>
                     `<div class="tl-item"><div class="tl-d">${T(i.d)}</div><div class="tl-c">${T(i.c)}</div></div>`).join('')}</div>`;
    default:       return '';
  }
}

/* ─── En-tête ─── */
function rendreHero(){
  const m = COURS.meta;
  document.documentElement.dataset.theme = m.theme;
  document.documentElement.lang = LANG;
  document.title = T(m.titre) + ' — Civilisation';
  $('#bc-titre').textContent = m.titre.fr ?? m.titre;   // la nav reste en français
  $('#ft').textContent = `${t('chapitre')} ${m.chapitre}${LANG==='fr'?' : ':': '}${T(m.titre)}`;
  $('#hero').innerHTML = `
    <span class="hero-flag">${m.drapeau}</span>
    <div class="hero-label">${T(m.label)}</div>
    <h1>${T(m.titre)}</h1>
    <p class="hero-sub">${T(m.sousTitre)}</p>`;
}

/* ─── Corps du cours ─── */
function rendreCours(){
  const c = COURS, out = [];

  out.push(`<section class="bloc rev" id="s-essentiel">
    <div class="essentiel"><div class="essentiel-label">${t('essentiel')}</div><p>${T(c.essentiel)}</p></div>
    <div class="stats">${c.chiffres.map((x,i)=>
      `<div class="stat" style="--c:var(--a${(i%4)+1})"><span class="stat-n">${T(x.n)}</span><span class="stat-d">${T(x.d)}</span></div>`).join('')}</div>
  </section>`);

  if(c.chronologie?.length){
    out.push(`<section class="bloc rev chrono-mobile" id="s-chrono">
      <div class="bloc-head"><span class="bloc-kicker">${t('reperes')}</span><h2 class="bloc-title">${t('chrono')}</h2></div>
      ${bloc({t:'tl',items:c.chronologie})}</section>`);
  }

  c.parties.forEach((p,pi)=>{
    let html = `<section class="partie rev" id="p-${pi}" style="--p:${p.couleur}">
      <div class="partie-head"><div class="partie-num">${p.num}</div>
      <div><div class="partie-kicker">${T(p.kicker)}</div><h2 class="partie-title">${T(p.titre)}</h2></div></div>`;
    p.sections.forEach((s,si)=>{
      html += `<div class="section" id="p-${pi}-${si}"><h3 class="section-title"><span class="section-num">${si+1}.</span> ${T(s.titre)}</h3>
        ${s.blocs.map(bloc).join('')}</div>`;
    });
    out.push(html+`</section>`);
  });

  if(c.acteurs?.length){
    out.push(`<section class="bloc rev" id="s-acteurs">
      <div class="bloc-head"><span class="bloc-kicker">${t('quiEstQui')}</span><h2 class="bloc-title">${t('acteurs')}</h2></div>
      <div class="acteurs">${c.acteurs.map(a=>
        `<div class="acteur" style="--c:${a.c}"><div class="acteur-nom">${a.nom}</div>
         <div class="acteur-role">${T(a.role)}</div><div class="acteur-c">${T(a.d)}</div></div>`).join('')}</div></section>`);
  }


  if(c.lexique?.length){
    out.push(`<section class="bloc rev" id="s-lexique">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a2)">${t('vocab')}</span>
      <h2 class="bloc-title">${t('lexique')}</h2></div>
      <input class="lex-search" id="lex-search" placeholder="${t('filtrer')}" aria-label="${t('filtrer')}">
      <div class="tbl-wrap"><table class="lex"><thead><tr><th>${t('terme')}</th><th>${t('trad')}</th></tr></thead>
      <tbody id="lex-body">${c.lexique.map(l=>`<tr><td>${l.de}</td><td>${l.fr}</td></tr>`).join('')}</tbody></table></div>
    </section>`);
  }


  if(c.retenir?.length){
    out.push(`<section class="bloc rev" id="s-retenir">
      <div class="bloc-head"><span class="bloc-kicker">${t('memoriser')}</span><h2 class="bloc-title">${t('retenir')}</h2></div>
      <div class="retenir"><ul>${T(c.retenir).map(r=>`<li>${r}</li>`).join('')}</ul></div></section>`);
  }

  $('#cours').innerHTML = out.join('');
}

/* ─── Colonne chronologie ─── */
function rendreRail(){
  if(!COURS.chronologie?.length){ $('#rail')?.remove(); return; }
  $('#rail').innerHTML = `<div class="rail-title">${t('chrono')}</div>${bloc({t:'tl',items:COURS.chronologie})}`;
}

/* ─── Recherche dans le lexique ─── */
function brancherLexique(){
  const ls = $('#lex-search'); if(!ls) return;
  ls.addEventListener('input', ()=>{
    const q = ls.value.toLowerCase().trim();
    $('#lex-body').querySelectorAll('tr').forEach(tr=>{
      tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
}

/* ─── Changement de langue ─── */
function setLang(lang){
  LANG = lang;
  $('#ap-btn-fr').classList.toggle('active', lang==='fr');
  $('#ap-btn-de').classList.toggle('active', lang==='de');
  rendreHero(); rendreCours(); rendreRail();
  document.querySelectorAll('.rev').forEach(el=>el.classList.add('vu'));
  brancherLexique();
}

/* ─── Démarrage ─── */
function demarrer(){
  rendreHero(); rendreCours(); rendreRail(); brancherLexique();

  const maj = ()=>{
    const h = document.body.scrollHeight - innerHeight;
    $('#progress').style.width = (h>0 ? (scrollY/h)*100 : 0) + '%';
  };
  addEventListener('scroll', maj, {passive:true}); maj();

  if(!('IntersectionObserver' in window)){
    document.querySelectorAll('.rev').forEach(el=>el.classList.add('vu'));
    return;
  }
  const io = new IntersectionObserver(es=>es.forEach(x=>{
    if(x.isIntersecting){ x.target.classList.add('vu'); io.unobserve(x.target); }
  }), {threshold:.06});
  document.querySelectorAll('.rev').forEach(el=>io.observe(el));
}

demarrer();
</script>
</body>
