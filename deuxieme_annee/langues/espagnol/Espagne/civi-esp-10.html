        titre: { fr: "2018 : la condamnation du PP et la chute de Rajoy", es: "2018: la condena del PP y la caída de Rajoy" },
        blocs: [
          { t: "image", src: "images/corruption-audiencia-nacional.webp", l: 1280, h: 720, format: "gauche",
            titre: { fr: "L'Audience nationale", es: "La Audiencia Nacional" },
            legende: { fr: "Les salles d'audience de l'Audience nationale à San Fernando de Henares, près de Madrid, où se tiennent les grands procès de corruption, dont celui de Gürtel.", es: "Las salas de vistas de la Audiencia Nacional en San Fernando de Henares, cerca de Madrid, donde se celebran los grandes juicios por corrupción, entre ellos el de Gürtel." },
            alt: { fr: "Bâtiment moderne gris surmonté d'un drapeau espagnol, derrière un mur et deux portails rouges, entre des arbres sans feuilles", es: "Edificio moderno gris coronado por una bandera de España, tras un muro y dos portones rojos, entre árboles sin hojas" } },
          { t: "p", c: {
            fr: "Le <strong>24 mai 2018</strong>, l'Audience nationale condamne 29 accusés de l'affaire Gürtel, dont Francisco Correa à 51 ans de prison et Luis Bárcenas à 33 ans. Pour la première fois, un parti, le PP, est condamné comme <strong>bénéficiaire à titre lucratif</strong> de la corruption. Huit jours plus tard, le 1er juin, Pedro Sánchez fait adopter une <strong>motion de censure</strong> : Rajoy tombe, comme le raconte le <a href=\"civi-esp-9.html\">chapitre 9</a>. Le Tribunal suprême confirme le jugement en 2020.",
            es: "El <strong>24 de mayo de 2018</strong>, la Audiencia Nacional condena a 29 acusados del caso Gürtel, entre ellos Francisco Correa a 51 años de prisión y Luis Bárcenas a 33. Por primera vez, un partido, el PP, es condenado como <strong>partícipe a título lucrativo</strong> de la corrupción. Ocho días después, el 1 de junio, Pedro Sánchez saca adelante una <strong>moción de censura</strong>: Rajoy cae, como cuenta el <a href=\"civi-esp-9.html\">capítulo 9</a>. El Tribunal Supremo confirma la sentencia en 2020." } },
          { t: "p", c: {
            fr: "L'affaire a une suite : l'opération <strong>Kitchen</strong>, une surveillance de Bárcenas organisée en 2013 depuis le ministère de l'Intérieur pour récupérer des documents compromettants pour le PP. Son procès, ouvert le 6 avril 2026 avec l'ancien ministre Jorge Fernández Díaz parmi les huit accusés, est en attente de jugement depuis juillet 2026.",
            es: "El caso tiene una secuela: la operación <strong>Kitchen</strong>, un espionaje a Bárcenas organizado en 2013 desde el Ministerio del Interior para recuperar documentos comprometedores para el PP. Su juicio, abierto el 6 de abril de 2026 con el exministro Jorge Fernández Díaz entre los ocho acusados, está visto para sentencia desde julio de 2026." } },
          { t: "encadre", c: "var(--a4)",
            titre: { fr: "Bénéficiaire à titre lucratif", es: "Partícipe a título lucrativo" },
            c2: {
              fr: "Le PP n'est pas condamné pour avoir commis un délit, mais pour en avoir <strong>profité sans y participer</strong> : il doit rembourser l'argent dont il a bénéficié (environ 245 000 euros). La nuance juridique compte peu politiquement : pour l'opinion, le parti au pouvoir est condamné pour corruption.",
              es: "El PP no es condenado por cometer un delito, sino por <strong>beneficiarse de él sin participar</strong>: debe devolver el dinero del que se aprovechó (unos 245 000 euros). El matiz jurídico importa poco en política: para la opinión, el partido en el poder es condenado por corrupción."
            } }
        ]
      }
    ]
  },
  {
    num: "III",
    kicker: { fr: "Le temps présent", es: "El tiempo presente" },
    titre: { fr: "Le PSOE au pouvoir rattrapé par la justice (2024-2026)", es: "El PSOE en el poder alcanzado por la justicia (2024-2026)" },
    couleur: "var(--a3)",
    sections: [
      {
        titre: { fr: "L'affaire Koldo : des masques aux travaux publics", es: "El caso Koldo: de las mascarillas a la obra pública" },
        blocs: [
                    { t: "image", src: "images/corruption-abalos-2019.webp", l: 960, h: 640, format: "droite",
            titre: {"fr": "José Luis Ábalos", "es": "José Luis Ábalos"},
            legende: {"fr": "Mérida, 16 octobre 2019 : José Luis Ábalos, alors ministre et numéro trois du PSOE (au centre), applaudi lors d'un meeting avec Guillermo Fernández Vara (à gauche).", "es": "Mérida, 16 de octubre de 2019: José Luis Ábalos, entonces ministro y número tres del PSOE (en el centro), aplaudido en un mitin con Guillermo Fernández Vara (a la izquierda)."},
            alt: {"fr": "Trois hommes debout sur une estrade applaudissent devant un panneau rouge du PSOE", "es": "Tres hombres de pie en un estrado aplauden ante un panel rojo del PSOE"} },
          { t: "p", c: {
            fr: "Le 21 février 2024, la Garde civile arrête une vingtaine de personnes, dont <strong>Koldo García</strong>, ancien conseiller du ministre des Transports <strong>José Luis Ábalos</strong>. L'enquête porte d'abord sur l'achat de masques pendant la pandémie : un réseau aurait obtenu des marchés publics pour une entreprise, contre des commissions en liquide. Ábalos, suspendu de militant par le PSOE, garde son siège de député.",
            es: "El 21 de febrero de 2024, la Guardia Civil detiene a una veintena de personas, entre ellas <strong>Koldo García</strong>, antiguo asesor del ministro de Transportes <strong>José Luis Ábalos</strong>. La investigación se centra primero en la compra de mascarillas durante la pandemia: una trama habría conseguido contratos públicos para una empresa, a cambio de comisiones en efectivo. Ábalos, suspendido de militancia por el PSOE, conserva su escaño de diputado." } },
          { t: "p", c: {
            fr: "En juin 2025, un rapport de l'<strong>UCO</strong>, l'unité d'enquête de la Garde civile, met en cause <strong>Santos Cerdán</strong>, secrétaire à l'Organisation et numéro trois du PSOE, pour des commissions sur des travaux publics : il démissionne le 12 juin et passe près de cinq mois en détention provisoire. Pedro Sánchez reconnaît avoir pensé à démissionner et présente, le 9 juillet 2025, un <strong>plan de lutte contre la corruption</strong> de quinze mesures, dont une agence indépendante d'intégrité publique.",
            es: "En junio de 2025, un informe de la <strong>UCO</strong>, la unidad de investigación de la Guardia Civil, implica a <strong>Santos Cerdán</strong>, secretario de Organización y número tres del PSOE, en comisiones por obra pública: dimite el 12 de junio y pasa casi cinco meses en prisión provisional. Pedro Sánchez reconoce que pensó en dimitir y presenta, el 9 de julio de 2025, un <strong>plan contra la corrupción</strong> de quince medidas, entre ellas una agencia independiente de integridad pública." } },
          { t: "p", c: {
            fr: "Le <strong>22 juin 2026</strong>, le Tribunal suprême condamne Ábalos à <strong>24 ans de prison</strong> pour organisation criminelle, corruption, détournement de fonds et trafic d'influence, et Koldo García à 19 ans ; l'homme d'affaires Víctor de Aldama, qui a collaboré avec la justice, évite la prison. Le 5 novembre 2026, une nouvelle pièce de l'enquête, sur <a href=\"../../../../actualites/es/articles/espagne-affaire-koldo-six-arrestations-2026.html\">900 millions d'euros de travaux publics</a>, conduit à six arrestations, à trois semaines des élections du 29 novembre.",
            es: "El <strong>22 de junio de 2026</strong>, el Tribunal Supremo condena a Ábalos a <strong>24 años de prisión</strong> por organización criminal, cohecho, malversación y tráfico de influencias, y a Koldo García a 19; el empresario Víctor de Aldama, que colaboró con la justicia, evita la cárcel. El 5 de noviembre de 2026, una nueva pieza de la investigación, sobre <a href=\"../../../../actualites/es/articles/espagne-affaire-koldo-six-arrestations-2026.html\">900 millones de euros de obra pública</a>, se salda con seis detenciones, a tres semanas de las elecciones del 29 de noviembre." } },
          { t: "citation",
            c: { fr: "Corrupción orgánica, organizada y continuada. (Corruption organique, organisée et continue.)", es: "Corrupción orgánica, organizada y continuada." },
            src: { fr: "Tribunal suprême, jugement de l'affaire des masques, 22 juin 2026", es: "Tribunal Supremo, sentencia del caso mascarillas, 22 de junio de 2026" } }
        ]
      },
      {
        titre: { fr: "L'entourage du président et le procureur général", es: "El entorno del presidente y el fiscal general" },
        blocs: [
          { t: "p", c: {
            fr: "En avril 2024, après une plainte du collectif d'extrême droite Manos Limpias, un juge ouvre une enquête contre <strong>Begoña Gómez</strong>, épouse de Pedro Sánchez, pour trafic d'influence. Le président suspend son agenda pendant cinq jours, puis annonce le 29 avril qu'il reste, en dénonçant une campagne de « harcèlement ». En juillet 2026, la justice confirme qu'elle sera jugée par un jury populaire pour trafic d'influence et détournement de fonds. Le même mois, son frère <strong>David Sánchez</strong> est condamné en première instance à neuf ans d'inéligibilité pour son embauche à la députation de Badajoz ; il a fait appel.",
            es: "En abril de 2024, tras una denuncia del colectivo ultraderechista Manos Limpias, un juez abre una investigación contra <strong>Begoña Gómez</strong>, esposa de Pedro Sánchez, por tráfico de influencias. El presidente suspende su agenda durante cinco días y anuncia el 29 de abril que sigue, denunciando una campaña de «acoso». En julio de 2026, la justicia confirma que será juzgada por un jurado popular por tráfico de influencias y malversación. Ese mismo mes, su hermano <strong>David Sánchez</strong> es condenado en primera instancia a nueve años de inhabilitación por su contratación en la Diputación de Badajoz; ha recurrido." } },
          { t: "p", c: {
            fr: "La crise atteint le parquet lui-même. En mars 2024, le parquet diffuse une note sur une procédure de fraude fiscale visant <strong>Alberto González Amador</strong>, compagnon de la présidente de la région de Madrid, Isabel Díaz Ayuso (PP). Le <strong>20 novembre 2025</strong>, le Tribunal suprême condamne, par cinq voix contre deux, le procureur général de l'État <strong>Álvaro García Ortiz</strong> à deux ans d'interdiction d'exercer pour révélation de données réservées : c'est une première. Il est remplacé par Teresa Peramato, tandis que González Amador doit être jugé pour une fraude de 350 951 euros.",
            es: "La crisis alcanza a la propia Fiscalía. En marzo de 2024, la Fiscalía difunde una nota sobre un procedimiento por fraude fiscal contra <strong>Alberto González Amador</strong>, pareja de la presidenta de la Comunidad de Madrid, Isabel Díaz Ayuso (PP). El <strong>20 de noviembre de 2025</strong>, el Tribunal Supremo condena, por cinco votos frente a dos, al fiscal general del Estado <strong>Álvaro García Ortiz</strong> a dos años de inhabilitación por revelación de datos reservados: es la primera vez. Lo sustituye Teresa Peramato, mientras González Amador debe ser juzgado por un fraude de 350 951 euros." } },
          { t: "encadre", c: "var(--a2)",
            titre: { fr: "« Lawfare » ou justice indépendante ?", es: "¿«Lawfare» o justicia independiente?" },
            c2: {
              fr: "Le gouvernement et ses alliés dénoncent un <em>lawfare</em> : des plaintes d'associations d'extrême droite et des juges qui utiliseraient la justice contre la gauche. L'opposition y voit au contraire la preuve que la justice fonctionne et refuse ce discours, qu'elle juge dangereux pour l'État de droit. Le procureur général étant nommé par le gouvernement, chaque décision devient un enjeu politique.",
              es: "El gobierno y sus aliados denuncian un <em>lawfare</em>: denuncias de asociaciones ultraderechistas y jueces que usarían la justicia contra la izquierda. La oposición ve al contrario la prueba de que la justicia funciona y rechaza ese discurso, que considera peligroso para el Estado de derecho. Como el fiscal general lo nombra el gobierno, cada decisión se convierte en un asunto político."
            } }
        ]
      },
      {
        titre: { fr: "Tous les camps, et une confiance en recul", es: "Todos los bandos, y una confianza en retroceso" },
        blocs: [
          { t: "p", c: {
            fr: "La droite n'est pas épargnée. En juillet 2025, <strong>Cristóbal Montoro</strong>, ministre des Finances de Rajoy de 2011 à 2018, est mis en examen par un juge de Tarragone : son ancien cabinet de conseil, Equipo Económico, aurait été payé par des entreprises gazières pour obtenir des réformes fiscales favorables. Montoro quitte le PP et nie tout délit ; l'enquête se poursuit en 2026. À l'inverse, toutes les accusations ne débouchent pas : l'enquête sur le frère d'Isabel Díaz Ayuso, liée à un contrat de masques, a été classée par le parquet anticorruption en 2022 puis par le parquet européen en 2023.",
            es: "La derecha no se libra. En julio de 2025, <strong>Cristóbal Montoro</strong>, ministro de Hacienda de Rajoy de 2011 a 2018, es imputado por un juez de Tarragona: su antiguo despacho, Equipo Económico, habría cobrado de empresas gasistas a cambio de reformas fiscales favorables. Montoro deja el PP y niega cualquier delito; la investigación sigue en 2026. A la inversa, no todas las acusaciones prosperan: la investigación sobre el hermano de Isabel Díaz Ayuso, ligada a un contrato de mascarillas, fue archivada por la Fiscalía Anticorrupción en 2022 y por la Fiscalía Europea en 2023." } },
          { t: "p", c: {
            fr: "La perception de la corruption se dégrade. Dans l'indice de <strong>Transparency International</strong>, l'Espagne obtient 55 sur 100 en 2025 et tombe au 49e rang sur 182 pays, sa plus mauvaise note depuis que l'indice suit sa méthode actuelle. Le graphique ci-dessous montre ce recul, plus marqué depuis 2023, alors que sa note était restée entre 60 et 62 de 2019 à 2023.",
            es: "La percepción de la corrupción empeora. En el índice de <strong>Transparencia Internacional</strong>, España obtiene 55 sobre 100 en 2025 y cae al puesto 49 de 182 países, su peor nota desde que el índice sigue su método actual. El gráfico siguiente muestra este retroceso, más marcado desde 2023, cuando su nota se había mantenido entre 60 y 62 de 2019 a 2023." } },

ll=\"var(--encre)\">62</text>\n<circle cx=\"288.5\" cy=\"95.2\" r=\"4.5\" fill=\"#fff\" stroke=\"var(--c1)\" stroke-width=\"2.5\"/>\n<text x=\"288.5\" y=\"82.2\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--encre)\">62</text>\n<circle cx=\"349.1\" cy=\"112.0\" r=\"4.5\" fill=\"#fff\" stroke=\"var(--c1)\" stroke-width=\"2.5\"/>\n<text x=\"349.1\" y=\"99.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--encre)\">60</text>\n<circle cx=\"379.4\" cy=\"112.0\" r=\"4.5\" fill=\"#fff\" stroke=\"var(--c1)\" stroke-width=\"2.5\"/>\n<text x=\"379.4\" y=\"99.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--encre)\">60</text>\n<circle cx=\"409.7\" cy=\"145.6\" r=\"4.5\" fill=\"#fff\" stroke=\"var(--c1)\" stroke-width=\"2.5\"/>\n<text x=\"409.7\" y=\"171.6\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--encre)\">56</text>\n<circle cx=\"440.0\" cy=\"154.0\" r=\"6\" fill=\"var(--c1)\" stroke=\"var(--c1)\" stroke-width=\"2.5\"/>\n<text x=\"440.0\" y=\"180.0\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--encre)\">55</text>\n<text x=\"430.0\" y=\"200.0\" text-anchor=\"end\" font-size=\"14\" font-weight=\"700\" fill=\"var(--c1)\">puesto 49</text>\n</g></svg>" },
            legende: { fr: "Transparency International, indice de perception de la corruption (0 = très corrompu, 100 = très intègre). Rang de l'Espagne : 30e en 2012, 46e sur 180 en 2024, 49e sur 182 en 2025. En pointillés, années 2013 à 2018 non représentées.", es: "Transparencia Internacional, Índice de Percepción de la Corrupción (0 = muy corrupto, 100 = muy íntegro). Puesto de España: 30 en 2012, 46 de 180 en 2024, 49 de 182 en 2025. En línea de puntos, años 2013 a 2018 no representados." } },
