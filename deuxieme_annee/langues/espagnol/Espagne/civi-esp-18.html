encre2)\" stroke-width=\"2.2\" marker-end=\"url(#fl18)\"/>\n<path d=\"M246 259 L216 259\" fill=\"none\" stroke=\"var(--encre2)\" stroke-width=\"2.2\" marker-end=\"url(#fl18)\"/>\n<path d=\"M112 233 Q88 206 88 162\" fill=\"none\" stroke=\"var(--encre2)\" stroke-width=\"2.2\" marker-end=\"url(#fl18)\"/>\n<path d=\"M90 110 Q98 66 154 62\" fill=\"none\" stroke=\"var(--encre2)\" stroke-width=\"2.2\" marker-end=\"url(#fl18)\"/>\n<rect x=\"155.0\" y=\"36.0\" width=\"150\" height=\"48\" rx=\"10\" fill=\"#fff\" stroke=\"var(--c1)\" stroke-width=\"2.4\"/>\n<text x=\"230.0\" y=\"57.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"var(--encre)\">Los jóvenes se van</text>\n<text x=\"230.0\" y=\"74.0\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--encre2)\">estudios, empleo fuera</text>\n<rect x=\"297.7\" y=\"112.0\" width=\"150\" height=\"48\" rx=\"10\" fill=\"#fff\" stroke=\"var(--c2)\" stroke-width=\"2.4\"/>\n<text x=\"372.7\" y=\"133.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"var(--encre)\">Menos nacimientos</text>\n<text x=\"372.7\" y=\"150.0\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--encre2)\">y más defunciones</text>\n<rect x=\"243.2\" y=\"235.0\" width=\"150\" height=\"48\" rx=\"10\" fill=\"#fff\" stroke=\"var(--c4)\" stroke-width=\"2.4\"/>\n<text x=\"318.2\" y=\"256.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"var(--encre)\">Cierran los servicios</text>\n<text x=\"318.2\" y=\"273.0\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--encre2)\">escuela, médico, bar</text>\n<rect x=\"66.8\" y=\"235.0\" width=\"150\" height=\"48\" rx=\"10\" fill=\"#fff\" stroke=\"var(--c3)\" stroke-width=\"2.4\"/>\n<text x=\"141.8\" y=\"256.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"var(--encre)\">El pueblo envejece</text>\n<text x=\"141.8\" y=\"273.0\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--encre2)\">menos activos</text>\n<rect x=\"12.3\" y=\"112.0\" width=\"150\" height=\"48\" rx=\"10\" fill=\"#fff\" stroke=\"var(--c1)\" stroke-width=\"2.4\"/>\n<text x=\"87.3\" y=\"133.0\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"800\" fill=\"var(--encre)\">Menos habitantes</text>\n<text x=\"87.3\" y=\"150.0\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--encre2)\">y menos empleos</text>\n<text x=\"230\" y=\"168\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"800\" fill=\"var(--c4)\">Círculo</text><text x=\"230\" y=\"188\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"800\" fill=\"var(--c4)\">vicioso</text>\n</g></svg>" },
            legende: { fr: "Schéma simplifié du mécanisme décrit par les travaux sur le dépeuplement rural. Chaque étape renforce la suivante, ce qui explique qu'une tendance, une fois engagée, soit très difficile à inverser.", es: "Esquema simplificado del mecanismo descrito por los trabajos sobre la despoblación rural. Cada etapa refuerza la siguiente, lo que explica que una tendencia, una vez iniciada, sea muy difícil de invertir." } },
          { t: "encadre", c: "var(--a2)",
            titre: { fr: "Le vide n'est pas qu'une affaire de campagne", es: "El vacío no es sólo cosa del campo" },
            c2: {
              fr: "La carte du vide est aussi celle d'un pays très inégal : Madrid, les littoraux, Barcelone et les archipels concentrent la population et les emplois, tandis que l'intérieur ne compte plus que des villes moyennes isolées, comme Soria ou Teruel. Del Molino juge cette configuration, avec une capitale entourée de centaines de kilomètres de faible densité, très rare en Europe continentale.",
              es: "El mapa del vacío es también el de un país muy desigual: Madrid, los litorales, Barcelona y los archipiélagos concentran la población y los empleos, mientras que el interior sólo cuenta con ciudades medianas aisladas, como Soria o Teruel. Del Molino considera que esta configuración, con una capital rodeada de cientos de kilómetros de baja densidad, es muy rara en la Europa continental."
            } }
        ]
      }

  {
    num: "II",
    kicker: { fr: "La politisation", es: "La politización" },
    titre: { fr: "De l'essai de Del Molino à la Revuelta (2016-2023)", es: "Del ensayo de Del Molino a la Revuelta (2016-2023)" },
    couleur: "var(--a4)",
    sections: [
      {
        titre: { fr: "Un livre qui nomme le vide", es: "Un libro que nombra el vacío" },
        blocs: [
          { t: "image", src: "images/despoblacion-teruel-torico.webp", l: 1280, h: 853, format: "gauche",
            titre: {"fr": "Teruel", "es": "Teruel"},
            legende: {"fr": "Teruel, décembre 2017 : la place du Torico de nuit, au cœur de la capitale de l'une des provinces les moins peuplées d'Espagne.", "es": "Teruel, diciembre de 2017: la plaza del Torico de noche, en el corazón de la capital de una de las provincias menos pobladas de España."},
            alt: {"fr": "Une place éclairée la nuit, avec des façades anciennes et une colonne au centre, presque déserte", "es": "Una plaza iluminada de noche, con fachadas antiguas y una columna en el centro, casi desierta"} },
          { t: "p", c: {
            fr: "Publié en 2016, <em>La España vacía. Viaje por un país que nunca fue</em> de <strong>Sergio del Molino</strong> rencontre un succès de librairie inattendu. Ni pamphlet militant ni travail universitaire, ce mélange de voyage, d'histoire littéraire et d'essai déconstruit les mythes qui opposent depuis le XIX<sup>e</sup> siècle une « Espagne pleine », urbaine et progressiste, à une « Espagne vide », rurale et archaïque. Il donne surtout un mot, et donc un cadre, à des colères jusque-là dispersées et locales.",
            es: "Publicado en 2016, <em>La España vacía. Viaje por un país que nunca fue</em>, de <strong>Sergio del Molino</strong>, obtiene un éxito de librería inesperado. Ni panfleto militante ni trabajo universitario, esta mezcla de viaje, historia literaria y ensayo deconstruye los mitos que oponen desde el siglo XIX una «España llena», urbana y progresista, a una «España vacía», rural y arcaica. Sobre todo da una palabra, y por tanto un marco, a unos enfados hasta entonces dispersos y locales." } },
          { t: "p", c: {
            fr: "Née à la fin des années 1990 pour réclamer des routes, des trains et des services, la plateforme citoyenne <strong>Teruel Existe</strong> joue sur l'invisibilité ressentie de sa province. Elle devient un parti et entre aux Cortes Generales en 2019, où elle obtient <strong>un député</strong> (Tomás Guitarte) et <strong>deux sénateurs</strong>, la première percée nationale d'une liste purement locale.",
            es: "Nacida a finales de los años noventa para reclamar carreteras, trenes y servicios, la plataforma ciudadana <strong>Teruel Existe</strong> juega con la invisibilidad que siente su provincia. Se convierte en partido y entra en las Cortes Generales en 2019, donde obtiene <strong>un diputado</strong> (Tomás Guitarte) y <strong>dos senadores</strong>, el primer avance nacional de una lista puramente local." } }
        ]
      },
      {
        titre: { fr: "31 mars 2019 : la Revuelta de la España Vaciada", es: "31 de marzo de 2019: la Revuelta de la España Vaciada" },
        blocs: [
          { t: "p", c: {
            fr: "Le <strong>31 mars 2019</strong>, à l'appel de dizaines d'associations et de plateformes de toute l'Espagne, une grande manifestation défile à Madrid. Les chiffres varient selon les sources : <strong>50 000</strong> personnes d'après la délégation du gouvernement, plus de <strong>100 000</strong> d'après les organisateurs. Les manifestants réclament un <strong>« pacte d'État »</strong> contre le dépeuplement, l'égalité des chances entre campagne et ville, et une meilleure représentation politique des territoires peu peuplés.",
            es: "El <strong>31 de marzo de 2019</strong>, por convocatoria de decenas de asociaciones y plataformas de toda España, una gran manifestación recorre Madrid. Las cifras varían según las fuentes: <strong>50 000</strong> personas según la Delegación del Gobierno, más de <strong>100 000</strong> según los organizadores. Los manifestantes reclaman un <strong>«pacto de Estado»</strong> contra la despoblación, la igualdad de oportunidades entre campo y ciudad y una mejor representación política de los territorios poco poblados." } },
          { t: "citation", c: { fr: "Ser pocos no está reñido con tener derechos.", es: "Ser pocos no está reñido con tener derechos." },
            src: { fr: "Slogan de la Revuelta de la España Vaciada, repris lors des mobilisations annuelles", es: "Lema de la Revuelta de la España Vaciada, repetido en las movilizaciones anuales" } },
          { t: "p", c: {
            fr: "Cette mobilisation, appelée <strong>« Revuelta de la España Vaciada »</strong>, place pour la première fois la question démographique territoriale au cœur de l'agenda national. Elle se répète chaque année : en 2026, le manifeste du septième anniversaire demande encore que le 31 mars devienne une journée européenne de lutte contre le dépeuplement, et dénonce les centres de données comme une nouvelle forme de colonisation industrielle de l'intérieur.",
            es: "Esta movilización, llamada <strong>«Revuelta de la España Vaciada»</strong>, sitúa por primera vez la cuestión demográfica territorial en el centro de la agenda nacional. Se repite cada año: en 2026, el manifiesto del séptimo aniversario sigue pidiendo que el 31 de marzo sea un día europeo de lucha contra la despoblación, y denuncia los centros de datos como una nueva forma de colonización industrial del interior." } }
        ]
      },
      {
        titre: { fr: "Institutionnalisation, puis reflux (2020-2023)", es: "Institucionalización y después reflujo (2020-2023)" },
        blocs: [
          { t: "p", c: {
            fr: "La reconnaissance est rapide. En <strong>2020</strong>, le gouvernement crée un <strong>ministère pour la Transition écologique et le Défi démographique</strong> ; le plan de 130 mesures de 2021 mobilise plus de 13 milliards d'euros jusqu'en 2024, d'après le ministère. Le mouvement se tourne aussi vers les urnes : le 30 septembre 2021 naît le parti <strong>España Vaciada</strong>, et les listes provinciales entrent dans des parlements régionaux. Aux élections de Castille-et-León de 2022, <strong>Soria ¡Ya!</strong> obtient 3 sièges, l'<strong>UPL</strong> (Union du peuple léonais) 3 et <strong>Por Ávila</strong> 1, soit 7 élus régionalistes ; en 2023, la coalition <strong>Existe</strong> obtient 3 sièges aux Cortes d'Aragon.",
            es: "El reconocimiento es rápido. En <strong>2020</strong>, el Gobierno crea un <strong>Ministerio para la Transición Ecológica y el Reto Demográfico</strong>; el plan de 130 medidas de 2021 moviliza más de 13 000 millones de euros hasta 2024, según el ministerio. El movimiento se vuelca también hacia las urnas: el 30 de septiembre de 2021 nace el partido <strong>España Vaciada</strong>, y las candidaturas provinciales entran en parlamentos autonómicos. En las elecciones de Castilla y León de 2022, <strong>Soria ¡Ya!</strong> obtiene 3 escaños, la <strong>UPL</strong> (Unión del Pueblo Leonés) 3 y <strong>Por Ávila</strong> 1, es decir 7 representantes regionalistas; en 2023, la coalición <strong>Existe</strong> obtiene 3 escaños en las Cortes de Aragón." } },
          { t: "p", c: {
            fr: "Mais la percée nationale ne dure pas. Aux élections générales du <strong>23 juillet 2023</strong>, la plateforme España Vaciada, présente dans dix provinces, recueille 36 397 voix (0,15 %) et <strong>perd tous ses sièges</strong> aux Cortes Generales : le député et les deux sénateurs de Teruel Existe disparaissent. La polarisation entre le bloc PP-Vox et le bloc PSOE-partenaires (voir le <a href=\"civi-esp-9.html\">chapitre 9</a>) pousse les électeurs ruraux à voter pour les grands partis, perçus comme les seuls capables de former un gouvernement. Le graphique suivant résume ce reflux.",
            es: "Pero el avance nacional no dura. En las elecciones generales del <strong>23 de julio de 2023</strong>, la plataforma España Vaciada, presente en diez provincias, obtiene 36 397 votos (0,15 %) y <strong>pierde todos sus escaños</strong> en las Cortes Generales: el diputado y los dos senadores de Teruel Existe desaparecen. La polarización entre el bloque PP-Vox y el bloque PSOE-socios (ver el <a href=\"civi-esp-9.html\">capítulo 9</a>) empuja a los electores rurales a votar a los grandes partidos, percibidos como los únicos capaces de formar gobierno. El gráfico siguiente resume este reflujo." } },
          { t: "schema", compact: true,

a-label=\"Barras: escaños de las candidaturas de la España vaciada. Cortes Generales, 3 en 2019 y 0 en julio de 2023; Castilla y León, 3 en 2022 y 1 en marzo de 2026; Aragón, 3 en 2023 y 2 en febrero de 2026.\">\n<g font-family=\"var(--texte)\">\n<text x=\"14\" y=\"22\" font-size=\"14.5\" font-weight=\"800\" fill=\"var(--encre)\">Cortes Generales (Teruel Existe)</text>\n<rect x=\"14\" y=\"32\" width=\"240\" height=\"20\" rx=\"3\" fill=\"var(--c4)\"/>\n<text x=\"263\" y=\"47\" font-size=\"13.5\" fill=\"var(--encre)\"><tspan font-weight=\"700\">2019</tspan> : 3 escaños</text>\n<rect x=\"14\" y=\"58\" width=\"3\" height=\"20\" rx=\"1\" fill=\"var(--c2)\"/>\n<text x=\"26\" y=\"73\" font-size=\"13.5\" fill=\"var(--encre)\"><tspan font-weight=\"700\">jul. 2023</tspan> : 0 escaño</text>\n<text x=\"14\" y=\"106\" font-size=\"14.5\" font-weight=\"800\" fill=\"var(--encre)\">Castilla y León (Soria ¡Ya!)</text>\n<rect x=\"14\" y=\"116\" width=\"240\" height=\"20\" rx=\"3\" fill=\"var(--c4)\"/>\n<text x=\"263\" y=\"131\" font-size=\"13.5\" fill=\"var(--encre)\"><tspan font-weight=\"700\">2022</tspan> : 3 escaños</text>\n<rect x=\"14\" y=\"142\" width=\"80\" height=\"20\" rx=\"3\" fill=\"var(--c2)\"/>\n<text x=\"103\" y=\"157\" font-size=\"13.5\" fill=\"var(--encre)\"><tspan font-weight=\"700\">mar. 2026</tspan> : 1 escaño</text>\n<text x=\"14\" y=\"190\" font-size=\"14.5\" font-weight=\"800\" fill=\"var(--encre)\">Aragón (Existe)</text>\n<rect x=\"14\" y=\"200\" width=\"240\" height=\"20\" rx=\"3\" fill=\"var(--c4)\"/>\n<text x=\"263\" y=\"215\" font-size=\"13.5\" fill=\"var(--encre)\"><tspan font-weight=\"700\">2023</tspan> : 3 escaños</text>\n<rect x=\"14\" y=\"226\" width=\"160\" height=\"20\" rx=\"3\" fill=\"var(--c2)\"/>\n<text x=\"183\" y=\"241\" font-size=\"13.5\" fill=\"var(--encre)\"><tspan font-weight=\"700\">feb. 2026</tspan> : 2 escaños</text>\n</g></svg>" },

    sections: [

        titre: { fr: "Des villages qui regagnent des habitants, grâce à l'immigration", es: "Pueblos que recuperan habitantes, gracias a la inmigración" },
        blocs: [
          { t: "image", src: "images/despoblacion-medinaceli-calle.webp", l: 1280, h: 853, format: "droite",
            titre: {"fr": "Medinaceli", "es": "Medinaceli"},
            legende: {"fr": "Medinaceli (province de Soria), septembre 2013 : une ruelle pavée bordée de maisons anciennes de pierre, sans un passant.", "es": "Medinaceli (provincia de Soria), septiembre de 2013: una callejuela empedrada con casas antiguas de piedra, sin un solo transeúnte."},
            alt: {"fr": "Une ruelle pavée vide entre des maisons anciennes en pierre, sous un ciel bleu et des arbres", "es": "Una callejuela empedrada vacía entre casas antiguas de piedra, bajo un cielo azul y unos árboles"} },
