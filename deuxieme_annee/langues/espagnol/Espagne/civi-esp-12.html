          { t: "p", c: {
            fr: "Au 1er janvier 2026, selon l'Institut national de la statistique (INE), l'Espagne compte 49,6 millions d'habitants, dont <strong>10 004 581 nés à l'étranger</strong> : pour la première fois, plus de dix millions, environ un habitant sur cinq. 7,2 millions sont de nationalité étrangère (14,6 %), les autres ont acquis la nationalité espagnole. Sans eux, la population baisserait : en 2025, le nombre d'habitants nés en Espagne a encore diminué.",
            es: "A 1 de enero de 2026, según el Instituto Nacional de Estadística (INE), España cuenta con 49,6 millones de habitantes, de los que <strong>10 004 581 han nacido en el extranjero</strong>: por primera vez, más de diez millones, en torno a uno de cada cinco. 7,2 millones tienen nacionalidad extranjera (14,6 %); los demás han adquirido la nacionalidad española. Sin ellos, la población disminuiría: en 2025, el número de habitantes nacidos en España volvió a bajar." } },

            es: "La medida más importante viene de abajo: una <strong>iniciativa legislativa popular</strong> (ILP), apoyada por cientos de asociaciones y cientos de miles de firmas, reclama una regularización. Anunciada en enero de 2026, se aprueba por real decreto: del <strong>16 de abril al 30 de junio de 2026</strong>, los extranjeros presentes en España antes del 1 de enero de 2026 y residentes desde al menos cinco meses pueden presentar una solicitud." } },

          { t: "p", c: {

            es: "El verano de 2026 endurece aún más el debate: a finales de julio, <a href=\"../../../../actualites/es/articles/ceuta-crise-migratoire-espagne.html\">unas 72 000 personas entran en Ceuta</a> desde Marruecos (ver el <a href=\"civi-esp-13.html\">capítulo 13</a>). En Europa, el Pacto de Migración y Asilo se aplica desde junio de 2026, y España es el <a href=\"../../../../actualites/es/articles/espagne-reglement-retours-ue.html\">único país que vota contra el reglamento europeo de retornos</a>, el 1 de octubre." } },
