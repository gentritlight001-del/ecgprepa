            titre: { fr: "L'Ertzaintza", es: "La Ertzaintza" },
            legende: { fr: "Agents antiémeutes de l'Ertzaintza, la police basque créée en 1982, casques rouges et boucliers, lors d'une manifestation dans le centre d'une ville basque en 2005.", es: "Agentes antidisturbios de la Ertzaintza, la policía vasca creada en 1982, con cascos rojos y escudos, durante una manifestación en el centro de una ciudad vasca en 2005." },
            alt: { fr: "Une dizaine de policiers en tenue noire et casques rouges, boucliers transparents, alignés sur une place arborée", es: "Una decena de policías de negro con cascos rojos y escudos transparentes, alineados en una plaza arbolada" } },
          { t: "p", c: {
            fr: "Pour la branche dite « militaire », l'autonomie est une trahison : seule l'indépendance d'Euskal Herria compte. L'autre branche, ETA politico-militaire, se dissout en 1982, et ses membres rejoignent la vie politique. ETA militaire, seule héritière du sigle, frappe désormais des cibles civiles : 21 morts dans le supermarché Hipercor de Barcelone le 19 juin 1987, 11 morts, dont cinq enfants, à la caserne de la Garde civile de Saragosse en décembre de la même année.",
            es: "Para la rama llamada «militar», la autonomía es una traición: solo cuenta la independencia de Euskal Herria. La otra rama, ETA político-militar, se disuelve en 1982 y sus miembros se incorporan a la vida política. ETA militar, única heredera de la sigla, golpea ahora objetivos civiles: 21 muertos en el supermercado Hipercor de Barcelona el 19 de junio de 1987, 11 muertos, cinco de ellos niños, en la casa cuartel de la Guardia Civil de Zaragoza en diciembre del mismo año." } },
          { t: "p", c: {

            es: "La violencia se extiende a toda una sociedad: amenazas, «impuesto revolucionario» extorsionado a los empresarios, escoltas para miles de cargos electos, jueces y periodistas, violencia callejera (<em>kale borroka</em>) a partir de los años noventa. Una parte de la población vive en el miedo o el silencio." } }

      {
        titre: { fr: "Le GAL : la « guerre sale » de l'État", es: "Los GAL: la «guerra sucia» del Estado" },

          { t: "p", c: {
            fr: "Entre 1983 et 1987, les <strong>Groupes antiterroristes de libération</strong> (GAL) assassinent 27 personnes, surtout dans le Pays basque français où se réfugient les militants d'ETA ; plusieurs victimes n'avaient aucun lien avec l'organisation. Révélé par la justice et la presse dans les années 1990, le scandale atteint le gouvernement socialiste de Felipe González : en 1998, l'ancien ministre de l'Intérieur José Barrionuevo et son secrétaire d'État Rafael Vera sont condamnés pour l'enlèvement de Segundo Marey.",
            es: "Entre 1983 y 1987, los <strong>Grupos Antiterroristas de Liberación</strong> (GAL) asesinan a 27 personas, sobre todo en el País Vasco francés, donde se refugian los militantes de ETA; varias víctimas no tenían ninguna relación con la organización. Revelado por la justicia y la prensa en los años noventa, el escándalo alcanza al gobierno socialista de Felipe González: en 1998, el exministro del Interior José Barrionuevo y su secretario de Estado Rafael Vera son condenados por el secuestro de Segundo Marey." } },
          { t: "encadre", c: "var(--a4)",

            c2: {

              es: "Los GAL ilustran la trampa del terrorismo para una democracia: responder a la violencia con violencia ilegal. Durante décadas alimentaron el argumentario de ETA, que se presentaba como víctima de un «conflicto» entre dos bandos. La salida de ese callejón vino de lo contrario: la <strong>cooperación policial y judicial</strong> legal con Francia a partir de finales de los años ochenta, que priva poco a poco a ETA de su retaguardia."
            } }

            legende: { fr: "Hommage à Miguel Ángel Blanco à Madrid, le 11 juillet 2019 : le maire José Luis Martínez-Almeida parle devant une photographie géante des mains blanches levées en juillet 1997.", es: "Homenaje a Miguel Ángel Blanco en Madrid, el 11 de julio de 2019: el alcalde José Luis Martínez-Almeida habla ante una fotografía gigante de las manos blancas alzadas en julio de 1997." },
            alt: { fr: "Un homme en costume et cravate rose parle au micro devant un grand panneau en noir et blanc couvert de mains levées", es: "Un hombre con traje y corbata rosa habla al micrófono ante un gran panel en blanco y negro cubierto de manos alzadas" } },
          { t: "p", c: {
            fr: "Le 10 juillet 1997, ETA enlève <strong>Miguel Ángel Blanco</strong>, conseiller municipal du Parti populaire à Ermua, âgé de 29 ans, et menace de le tuer si le gouvernement ne rapproche pas ses prisonniers du Pays basque. Des foules immenses manifestent, mains peintes en blanc. Le 12 juillet, il est abattu de deux balles dans la tête et meurt le lendemain. L'« esprit d'Ermua » marque un tournant : la société basque descend dans la rue contre ETA, et le mouvement civique ¡Basta Ya! (« Ça suffit ! ») naît en 1999.",
            es: "El 10 de julio de 1997, ETA secuestra a <strong>Miguel Ángel Blanco</strong>, concejal del Partido Popular en Ermua, de 29 años, y amenaza con matarlo si el gobierno no acerca a sus presos al País Vasco. Multitudes inmensas se manifiestan, con las manos pintadas de blanco. El 12 de julio recibe dos tiros en la cabeza y muere al día siguiente. El «espíritu de Ermua» marca un punto de inflexión: la sociedad vasca sale a la calle contra ETA, y el movimiento cívico ¡Basta Ya! nace en 1999." } },

  {

    sections: [
      {
        titre: { fr: "Aiete et la fin sans négociation", es: "Aiete y el final sin negociación" },
        blocs: [
          { t: "p", c: {
            fr: "Décapitée par des arrestations successives en Espagne et en France, privée de soutien dans la société basque, ETA commet son dernier assassinat le 16 mars 2010, en tuant un gendarme français près de Paris. La gauche abertzale, menée par <strong>Arnaldo Otegi</strong>, rompt officiellement avec la violence. Le 17 octobre 2011, une conférence internationale réunit à Saint-Sébastien, au palais d'Aiete, Kofi Annan et Gerry Adams ; trois jours plus tard, le <strong>20 octobre</strong>, ETA annonce la fin définitive de son activité armée.",
            es: "Descabezada por sucesivas detenciones en España y Francia, sin apoyo en la sociedad vasca, ETA comete su último asesinato el 16 de marzo de 2010, al matar a un gendarme francés cerca de París. La izquierda abertzale, dirigida por <strong>Arnaldo Otegi</strong>, rompe oficialmente con la violencia. El 17 de octubre de 2011, una conferencia internacional reúne en San Sebastián, en el palacio de Aiete, a Kofi Annan y Gerry Adams; tres días después, el <strong>20 de octubre</strong>, ETA anuncia el cese definitivo de su actividad armada." } },
          { t: "citation",
            c: { fr: "ETA ha decidido el cese definitivo de su actividad armada. (ETA a décidé la cessation définitive de son activité armée.)", es: "ETA ha decidido el cese definitivo de su actividad armada." },
            src: { fr: "Communiqué d'ETA, 20 octobre 2011", es: "Comunicado de ETA, 20 de octubre de 2011" } },
          { t: "p", c: {
            fr: "À la différence de l'Irlande du Nord, cette fin ne repose sur <strong>aucun accord de paix</strong> : le gouvernement de Mariano Rajoy, au pouvoir à partir de décembre 2011, refuse toute contrepartie politique ou pénale. ETA rend ensuite ses armes et se dissout seule, par étapes, comme le résume l'échelle ci-dessous.",
            es: "A diferencia de Irlanda del Norte, este final no se basa en <strong>ningún acuerdo de paz</strong>: el gobierno de Mariano Rajoy, en el poder desde diciembre de 2011, rechaza cualquier contrapartida política o penal. ETA entrega después sus armas y se disuelve sola, por etapas, como resume la escala siguiente." } },
          { t: "echelle",
            titre: { fr: "La fin d'ETA en cinq marches", es: "El final de ETA en cinco peldaños" },
            gauche: { fr: "Fin des attentats", es: "Fin de los atentados" }, droite: { fr: "Fin de l'organisation", es: "Fin de la organización" },
            marches: [
              { l: { fr: "Dernier meurtre", es: "Último asesinato" }, ex: { fr: "16 mars 2010", es: "16 mar. 2010" } },
              { l: { fr: "Fin de la violence", es: "Fin de la violencia" }, ex: { fr: "20 oct. 2011", es: "20 oct. 2011" } },

            legende: { fr: "Le désarmement se fait par la remise de la liste des caches d'armes, en France, à des intermédiaires de la société civile ; la dissolution est annoncée à Cambo-les-Bains, dans le Pays basque français.", es: "El desarme se hace con la entrega de la lista de zulos, en Francia, a intermediarios de la sociedad civil; la disolución se anuncia en Cambo-les-Bains, en el País Vasco francés." } },
          { t: "p", c: {

            es: "La carta del 20 de abril de 2018 solo pide perdón a las víctimas «sin participación directa en el conflicto»: las asociaciones de víctimas ven en ello una forma de justificar los asesinatos de policías, guardias civiles y militares, que son la mayoría de los muertos." } }

      {
        titre: { fr: "Prisonniers, victimes et mémoire", es: "Presos, víctimas y memoria" },
        blocs: [
          { t: "p", c: {
            fr: "La question des <strong>prisonniers</strong> reste la plus sensible. La politique de dispersion, qui les éloignait du Pays basque depuis 1989, prend fin sous Pedro Sánchez, avec les derniers rapprochements en 2023. Depuis octobre 2021, le gouvernement basque gère lui-même ses prisons : en 2026, il accorde la semi-liberté à plusieurs anciens membres d'ETA condamnés pour assassinat, ce que l'association de victimes Covite dénonce comme une « amnistie déguisée ».",
            es: "La cuestión de los <strong>presos</strong> sigue siendo la más sensible. La política de dispersión, que los alejaba del País Vasco desde 1989, termina con Pedro Sánchez, con los últimos acercamientos en 2023. Desde octubre de 2021, el gobierno vasco gestiona sus propias cárceles: en 2026 concede la semilibertad a varios exmiembros de ETA condenados por asesinato, lo que la asociación de víctimas Covite denuncia como una «amnistía encubierta»." } },
          { t: "p", c: {
            fr: "Les victimes réclament <strong>vérité, justice et mémoire</strong>. Près de 380 assassinats d'ETA n'ont toujours pas d'auteur condamné, et les hommages publics rendus à d'anciens membres à leur sortie de prison (<em>ongi etorri</em>, « bienvenue ») choquent. Ouvert en 2021 à Vitoria, le Centre mémorial des victimes du terrorisme veut transmettre cette histoire : en 2020, un sondage GAD3 montrait que 60 % des jeunes Espagnols ne savaient pas qui était Miguel Ángel Blanco.",
            es: "Las víctimas reclaman <strong>verdad, justicia y memoria</strong>. Cerca de 380 asesinatos de ETA siguen sin autor condenado, y los homenajes públicos a exmiembros al salir de prisión (<em>ongi etorri</em>, «bienvenido») escandalizan. Abierto en 2021 en Vitoria, el Centro Memorial de las Víctimas del Terrorismo quiere transmitir esa historia: en 2020, una encuesta de GAD3 mostraba que el 60 % de los jóvenes españoles no sabía quién era Miguel Ángel Blanco." } },
          { t: "p", c: {
            fr: "Le 20 octobre 2026, quinze ans après la fin de la violence, les médias espagnols reviennent sur une génération qui n'a pas connu ETA. La littérature a aussi porté cette mémoire : le roman <em>Patria</em> de Fernando Aramburu (2016), adapté en série en 2020, raconte deux familles d'un même village déchirées par le terrorisme.",
            es: "El 20 de octubre de 2026, quince años después del fin de la violencia, los medios españoles recuerdan a una generación que no conoció a ETA. La literatura también ha llevado esa memoria: la novela <em>Patria</em> de Fernando Aramburu (2016), adaptada en serie en 2020, cuenta la historia de dos familias de un mismo pueblo destrozadas por el terrorismo." } }
        ]

      {
        titre: { fr: "EH Bildu : de la gauche abertzale aux institutions", es: "EH Bildu: de la izquierda abertzale a las instituciones" },
        blocs: [
          { t: "image", src: "images/eta-arnaldo-otegi.webp", l: 1280, h: 853, format: "gauche",
            titre: { fr: "Arnaldo Otegi", es: "Arnaldo Otegi" },
            legende: { fr: "Arnaldo Otegi en août 2016, peu après sa sortie de prison, lors de la campagne des élections basques : ancien membre d'ETA, il est l'artisan de la rupture de la gauche abertzale avec la violence.", es: "Arnaldo Otegi en agosto de 2016, poco después de salir de prisión, durante la campaña de las elecciones vascas: antiguo miembro de ETA, es el artífice de la ruptura de la izquierda abertzale con la violencia." },
            alt: { fr: "Un homme souriant aux cheveux courts, en chemise blanche, sur un fond clair", es: "Un hombre sonriente de pelo corto, con camisa blanca, sobre un fondo claro" } },
          { t: "p", c: {
            fr: "Après sa rupture avec la violence, la gauche abertzale revient dans les urnes avec la coalition <strong>Bildu</strong> (2011), puis <strong>EH Bildu</strong> (2012), dont Arnaldo Otegi, emprisonné de 2009 à 2016, devient le chef. Elle progresse sans cesse : aux élections basques du 21 avril 2024, elle obtient 27 sièges, autant que le PNV, arrivé de peu en tête en voix. À Madrid, ses députés font partie de la majorité de Pedro Sánchez.",
            es: "Tras su ruptura con la violencia, la izquierda abertzale vuelve a las urnas con la coalición <strong>Bildu</strong> (2011) y luego <strong>EH Bildu</strong> (2012), cuyo líder pasa a ser Arnaldo Otegi, encarcelado de 2009 a 2016. Avanza sin cesar: en las elecciones vascas del 21 de abril de 2024 obtiene 27 escaños, los mismos que el PNV, que queda primero en votos por poco. En Madrid, sus diputados forman parte de la mayoría de Pedro Sánchez." } },
          { t: "p", c: {
            fr: "Cette place reste contestée. En mai 2023, la présence de 44 anciens condamnés d'ETA sur les listes municipales d'EH Bildu, dont sept pour des crimes de sang, provoque un tollé national ; ces sept candidats renoncent à siéger. Le Parti populaire et Vox accusent le gouvernement de s'appuyer sur les « héritiers d'ETA » ; EH Bildu répond qu'elle respecte la démocratie et qu'elle a reconnu la douleur des victimes, sans condamner l'histoire d'ETA.",
            es: "Este lugar sigue siendo discutido. En mayo de 2023, la presencia de 44 excondenados de ETA en las listas municipales de EH Bildu, siete de ellos por delitos de sangre, provoca un escándalo nacional; esos siete candidatos renuncian a ocupar el cargo. El Partido Popular y Vox acusan al gobierno de apoyarse en los «herederos de ETA»; EH Bildu responde que respeta la democracia y que ha reconocido el dolor de las víctimas, sin condenar la historia de ETA." } },
          { t: "encadre", c: "var(--a4)",
            titre: { fr: "Ne pas amalgamer", es: "No confundir" },
            c2: {
              fr: "EH Bildu n'est pas ETA : c'est une coalition légale, validée par le Tribunal constitutionnel, qui a renoncé à la violence et participe aux institutions. Le débat porte sur autre chose : la <strong>mémoire</strong> et la reconnaissance du tort causé aux victimes, que ses adversaires jugent insuffisantes. Il ne se confond pas non plus avec la question de l'autodétermination basque.",
              es: "EH Bildu no es ETA: es una coalición legal, avalada por el Tribunal Constitucional, que ha renunciado a la violencia y participa en las instituciones. El debate es otro: la <strong>memoria</strong> y el reconocimiento del daño causado a las víctimas, que sus adversarios consideran insuficientes. Tampoco se confunde con la cuestión de la autodeterminación vasca."
            } }
        ]

      {
        titre: { fr: "Un Pays basque prospère et un nouveau statut en discussion", es: "Un País Vasco próspero y un nuevo estatuto en discusión" },
        blocs: [
          { t: "image", src: "images/eta-guggenheim-bilbao.webp", l: 960, h: 486, format: "droite",
            titre: { fr: "Le Guggenheim de Bilbao", es: "El Guggenheim de Bilbao" },
            legende: { fr: "Le musée Guggenheim de Frank Gehry, au bord du Nervión, avec l'araignée géante <em>Maman</em> de Louise Bourgeois : le symbole de la reconversion de Bilbao.", es: "El museo Guggenheim de Frank Gehry, a orillas del Nervión, con la araña gigante <em>Maman</em> de Louise Bourgeois: el símbolo de la reconversión de Bilbao." },
            alt: { fr: "Bâtiment aux courbes de titane argenté au bord d'une rivière, avec une sculpture d'araignée géante devant, et des collines en arrière-plan", es: "Edificio de curvas de titanio plateado a orillas de un río, con una escultura de araña gigante delante y colinas al fondo" } },
          { t: "p", c: {
            fr: "La région la plus longtemps meurtrie par la violence est devenue l'une des plus <strong>prospères</strong> d'Espagne : grâce au Concierto Économique, elle lève ses propres impôts, affiche l'un des PIB par habitant les plus élevés du pays et un chômage inférieur à la moyenne nationale, porté par une industrie diversifiée (machines-outils, énergie, aéronautique) et les coopératives de Mondragón. Le musée Guggenheim de Bilbao, ouvert en 1997, symbolise la reconversion d'une ville sidérurgique.",
            es: "La región más largamente golpeada por la violencia se ha convertido en una de las más <strong>prósperas</strong> de España: gracias al Concierto Económico, recauda sus propios impuestos, tiene uno de los PIB por habitante más altos del país y un paro inferior a la media nacional, impulsado por una industria diversificada (máquina herramienta, energía, aeronáutica) y las cooperativas de Mondragón. El museo Guggenheim de Bilbao, abierto en 1997, simboliza la reconversión de una ciudad siderúrgica." } },
          { t: "p", c: {
            fr: "Le PNV, autonomiste modéré, dirige le gouvernement basque depuis 1980, à l'exception des années 2009-2012, quand le socialiste Patxi López est <em>lehendakari</em>. Depuis 2024, <strong>Imanol Pradales</strong> gouverne avec les socialistes, qui lui assurent la majorité absolue. L'indépendance n'y mobilise qu'une minorité : le conflit s'est déplacé vers la négociation de l'autogouvernement.",
            es: "El PNV, autonomista moderado, dirige el gobierno vasco desde 1980, salvo los años 2009-2012, cuando el socialista Patxi López es <em>lehendakari</em>. Desde 2024, <strong>Imanol Pradales</strong> gobierna con los socialistas, que le aseguran la mayoría absoluta. La independencia solo moviliza a una minoría: el conflicto se ha desplazado a la negociación del autogobierno." } },
          { t: "image", src: "images/eta-parlement-basque.webp", l: 1280, h: 961, format: "gauche",
            titre: { fr: "Le Parlement basque", es: "El Parlamento Vasco" },
            legende: { fr: "Le Parlement basque, à Vitoria-Gasteiz, à la tombée de la nuit : c'est ici que se discute depuis 2024 un nouveau statut d'autonomie.", es: "El Parlamento Vasco, en Vitoria-Gasteiz, al anochecer: aquí se discute desde 2024 un nuevo estatuto de autonomía." },
            alt: { fr: "Façade claire d'un bâtiment administratif aux fenêtres éclairées, derrière une grille, sous un ciel bleu nuit", es: "Fachada clara de un edificio administrativo con las ventanas iluminadas, tras una verja, bajo un cielo azul noche" } },
