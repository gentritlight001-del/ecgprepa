            alt: { fr: "Trois policiers casqués vus de dos, gilets marqués « Policia Mossos d'Esquadra », devant une foule assise dans une large avenue", es: "Tres policías con casco vistos de espaldas, con chalecos «Policia Mossos d'Esquadra», ante una multitud sentada en una gran avenida" } },
          { t: "p", c: {
            fr: "Certaines compétences n'appartiennent qu'à quelques communautés : une <strong>police propre</strong> (l'Ertzaintza basque, créée en 1982, les Mossos d'Esquadra catalans, déployés de 1994 à 2008, la police forale de Navarre), un <strong>droit civil propre</strong> (Catalogne, Pays basque, Navarre, Aragon, Galice, Baléares), une <strong>langue co-officielle</strong> (catalan, basque, galicien, valencien). Depuis septembre 2023, ces langues peuvent être employées dans les débats du Congrès des députés.",
            es: "Algunas competencias pertenecen solo a ciertas comunidades: una <strong>policía propia</strong> (la Ertzaintza vasca, creada en 1982, los Mossos d'Esquadra catalanes, desplegados de 1994 a 2008, la Policía Foral de Navarra), un <strong>derecho civil propio</strong> (Cataluña, País Vasco, Navarra, Aragón, Galicia, Baleares), una <strong>lengua cooficial</strong> (catalán, euskera, gallego, valenciano). Desde septiembre de 2023, estas lenguas pueden usarse en los debates del Congreso de los Diputados." } },
          { t: "p", c: {
            fr: "Ces « faits différentiels » (<em>hechos diferenciales</em>) sont au cœur des revendications des nationalismes périphériques, qui y voient la reconnaissance d'une identité nationale plutôt qu'une simple délégation administrative. Le reste des communautés réclame souvent les mêmes moyens : chaque avancée d'une nationalité historique relance la tentation d'un nouveau <em>café para todos</em>.",
            es: "Estos «hechos diferenciales» están en el centro de las reivindicaciones de los nacionalismos periféricos, que ven en ellos el reconocimiento de una identidad nacional más que una simple delegación administrativa. El resto de las comunidades reclama a menudo los mismos medios: cada avance de una nacionalidad histórica reaviva la tentación de un nuevo <em>café para todos</em>." } }
        ]
      },
      {
        titre: { fr: "Le régime foral : le Pays basque et la Navarre lèvent leurs impôts", es: "El régimen foral: el País Vasco y Navarra recaudan sus impuestos" },
        blocs: [
          { t: "image", src: "images/autonomies-arbre-gernika.webp", l: 1280, h: 960, format: "gauche",
            titre: { fr: "L'arbre de Guernica", es: "El árbol de Gernika" },
            legende: { fr: "Le tronc du vieil arbre de Guernica, conservé sous un temple de pierre devant la Maison des assemblées de Biscaye : c'est sous cet arbre que les seigneurs de Biscaye juraient de respecter les fueros.", es: "El tronco del viejo árbol de Gernika, conservado bajo un templete de piedra ante la Casa de Juntas de Vizcaya: bajo este árbol los señores de Vizcaya juraban respetar los fueros." },
            alt: { fr: "Un vieux tronc d'arbre sec abrité par une rotonde de colonnes de pierre entourée d'une grille, sur une pelouse bordée d'arbres", es: "Un viejo tronco de árbol seco protegido por una rotonda de columnas de piedra rodeada de una verja, en un césped bordeado de árboles" } },
          { t: "p", c: {
            fr: "La première disposition additionnelle de la Constitution « protège et respecte les droits historiques des territoires foraux ». Elle ne crée pas ces droits : elle reconnaît les <em>fueros</em>, privilèges médiévaux du Pays basque et de la Navarre, survivants des guerres carlistes du XIXe siècle. Le <strong>Concierto Económico</strong> basque, né en 1878 et supprimé par Franco en 1937 pour la Biscaye et le Guipuscoa, est rétabli en 1981 et rendu permanent en 2002 ; la Navarre dispose d'un <strong>Convenio</strong> équivalent.",
            es: "La disposición adicional primera de la Constitución «ampara y respeta los derechos históricos de los territorios forales». No crea esos derechos: reconoce los <em>fueros</em>, privilegios medievales del País Vasco y Navarra, supervivientes de las guerras carlistas del siglo XIX. El <strong>Concierto Económico</strong> vasco, nacido en 1878 y suprimido por Franco en 1937 para Vizcaya y Guipúzcoa, se restablece en 1981 y se vuelve permanente en 2002; Navarra dispone de un <strong>Convenio</strong> equivalente." } },
          { t: "p", c: {
            fr: "En pratique, ce sont les <strong>Diputaciones forales</strong> des trois provinces basques (Alava, Biscaye, Guipuscoa) qui collectent presque tous les impôts, y compris l'IRPF et la TVA, et en fixent en partie les taux. Elles reversent ensuite à l'État un montant négocié, le <em>cupo</em>, qui paie les services qu'il continue d'assurer : défense, affaires étrangères, une partie de la Sécurité sociale. Une loi votée tous les cinq ans fixe la méthode de calcul.",
            es: "En la práctica, son las <strong>Diputaciones forales</strong> de las tres provincias vascas (Álava, Vizcaya, Guipúzcoa) las que recaudan casi todos los impuestos, incluidos el IRPF y el IVA, y fijan en parte sus tipos. Después abonan al Estado una cantidad negociada, el <em>cupo</em>, que paga los servicios que este sigue prestando: defensa, relaciones exteriores, una parte de la Seguridad Social. Una ley aprobada cada cinco años fija el método de cálculo." } },
          { t: "image", src: "images/autonomies-diputacion-bizkaia.webp", l: 960, h: 720, format: "droite",
            titre: { fr: "Le fisc a une adresse basque", es: "La hacienda tiene sede vasca" },
            legende: { fr: "Le palais de la Diputación foral de Biscaye, sur la Gran Vía de Bilbao (1900) : c'est cette institution provinciale, et non l'État, qui lève l'impôt en Biscaye.", es: "El palacio de la Diputación Foral de Vizcaya, en la Gran Vía de Bilbao (1900): es esta institución provincial, y no el Estado, la que recauda los impuestos en Vizcaya." },
            alt: { fr: "Grand palais de pierre claire de style éclectique, à coupoles et balcons, au coin d'une avenue de Bilbao", es: "Gran palacio de piedra clara de estilo ecléctico, con cúpulas y balcones, en la esquina de una avenida de Bilbao" } },
          { t: "p", c: {
            fr: "En Navarre, le Convenio fonctionne de la même façon : le gouvernement navarrais lève l'impôt et verse à l'État une « contribution » négociée, révisée elle aussi par une commission mixte. Le système renverse la logique du reste du pays : au lieu de recevoir des fonds de l'État, le Pays basque et la Navarre lui en versent. Ses critiques jugent le calcul du cupo trop favorable à des régions parmi les plus riches d'Espagne, qui disposent par habitant de bien plus de ressources que les communautés de régime commun ; ses défenseurs répondent que les institutions basques assument seules le risque d'une baisse de leurs recettes. Fondé sur une légitimité historique, il ne peut guère être étendu à d'autres territoires sans réforme constitutionnelle : c'est pourtant ce modèle que réclament les indépendantistes catalans.",
            es: "En Navarra, el Convenio funciona de la misma manera: el gobierno navarro recauda los impuestos y abona al Estado una «aportación» negociada, revisada también por una comisión mixta. El sistema invierte la lógica del resto del país: en lugar de recibir fondos del Estado, el País Vasco y Navarra se los pagan. Sus críticos consideran el cálculo del cupo demasiado favorable a regiones que están entre las más ricas de España, y que disponen por habitante de muchos más recursos que las comunidades de régimen común; sus defensores responden que las instituciones vascas asumen en solitario el riesgo de una caída de sus ingresos. Basado en una legitimidad histórica, apenas puede extenderse a otros territorios sin reforma constitucional: es, sin embargo, el modelo que reclaman los independentistas catalanes." } }
        ]
      },
      {
        titre: { fr: "Le régime commun : un système redistributif sous tension", es: "El régimen común: un sistema redistributivo bajo tensión" },
        blocs: [
          { t: "p", c: {
            fr: "Les quinze autres communautés, Catalogne comprise, relèvent du <strong>régime commun</strong>, régi par la <strong>LOFCA</strong>, loi organique de financement des communautés autonomes de 1980. L'État perçoit les grands impôts, puis en cède une partie aux communautés et redistribue le reste selon une formule qui combine population, superficie, dispersion de l'habitat et vieillissement. Le schéma suivant compare les deux circuits de l'argent public.",

"215\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--encre)\">Il cède 50 % de l’IRPF et de la TVA</text>\n<text x=\"542.0\" y=\"233\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">et redistribue le reste par des fonds</text>\n<text x=\"542.0\" y=\"286\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--c1)\">L’argent va de l’État vers la région</text>\n</g></svg>", es: "<svg viewBox=\"0 0 720 300\" role=\"img\" aria-label=\"Esquema: en el régimen foral, las Diputaciones recaudan los impuestos y pagan el cupo al Estado; en el régimen común, el Estado recauda los impuestos, cede una parte a las comunidades y redistribuye el resto.\">\n<defs><marker id=\"fl-fisc\" viewBox=\"0 0 10 10\" refX=\"5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--encre2)\"/></marker></defs>\n<g font-family=\"var(--texte)\">\n<rect x=\"4\" y=\"6\" width=\"348\" height=\"34\" rx=\"10\" fill=\"var(--c3)\"/>\n<text x=\"178.0\" y=\"28\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#fff\">Régimen foral · País Vasco, Navarra</text>\n<rect x=\"18\" y=\"54\" width=\"320\" height=\"50\" rx=\"10\" fill=\"color-mix(in srgb,var(--c3) 10%,transparent)\" stroke=\"var(--c3)\" stroke-width=\"1.5\"/>\n<text x=\"178.0\" y=\"75\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--encre)\">Contribuyentes</text>\n<text x=\"178.0\" y=\"93\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">vascos y navarros</text>\n<line x1=\"178.0\" y1=\"106\" x2=\"178.0\" y2=\"120\" stroke=\"var(--encre2)\" stroke-width=\"1.5\" marker-end=\"url(#fl-fisc)\"/>\n<rect x=\"18\" y=\"124\" width=\"320\" height=\"50\" rx=\"10\" fill=\"color-mix(in srgb,var(--c3) 10%,transparent)\" stroke=\"var(--c3)\" stroke-width=\"1.5\"/>\n<text x=\"178.0\" y=\"145\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--encre)\">Diputaciones forales</text>\n<text x=\"178.0\" y=\"163\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">recaudan casi todos los impuestos</text>\n<line x1=\"178.0\" y1=\"176\" x2=\"178.0\" y2=\"190\" stroke=\"var(--encre2)\" stroke-width=\"1.5\" marker-end=\"url(#fl-fisc)\"/>\n<rect x=\"18\" y=\"194\" width=\"320\" height=\"50\" rx=\"10\" fill=\"color-mix(in srgb,var(--c3) 10%,transparent)\" stroke=\"var(--c3)\" stroke-width=\"1.5\"/>\n<text x=\"178.0\" y=\"215\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--encre)\">El cupo se paga al Estado</text>\n<text x=\"178.0\" y=\"233\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">por la defensa, la diplomacia…</text>\n<text x=\"178.0\" y=\"286\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--c3)\">El dinero va de la región al Estado</text>\n<rect x=\"368\" y=\"6\" width=\"348\" height=\"34\" rx=\"10\" fill=\"var(--c1)\"/>\n<text x=\"542.0\" y=\"28\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#fff\">Régimen común · 15 comunidades</text>\n<rect x=\"382\" y=\"54\" width=\"320\" height=\"50\" rx=\"10\" fill=\"color-mix(in srgb,var(--c1) 10%,transparent)\" stroke=\"var(--c1)\" stroke-width=\"1.5\"/>\n<text x=\"542.0\" y=\"75\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--encre)\">Contribuyentes</text>\n<text x=\"542.0\" y=\"93\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">de las quince comunidades</text>\n<line x1=\"542.0\" y1=\"106\" x2=\"542.0\" y2=\"120\" stroke=\"var(--encre2)\" stroke-width=\"1.5\" marker-end=\"url(#fl-fisc)\"/>\n<rect x=\"382\" y=\"124\" width=\"320\" height=\"50\" rx=\"10\" fill=\"color-mix(in srgb,var(--c1) 10%,transparent)\" stroke=\"var(--c1)\" stroke-width=\"1.5\"/>\n<text x=\"542.0\" y=\"145\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--encre)\">El Estado (Agencia Tributaria)</text>\n<text x=\"542.0\" y=\"163\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">recauda IRPF, IVA e impuestos especiales</text>\n<line x1=\"542.0\" y1=\"176\" x2=\"542.0\" y2=\"190\" stroke=\"var(--encre2)\" stroke-width=\"1.5\" marker-end=\"url(#fl-fisc)\"/>\n<rect x=\"382\" y=\"194\" width=\"320\" height=\"50\" rx=\"10\" fill=\"color-mix(in srgb,var(--c1) 10%,transparent)\" stroke=\"var(--c1)\" stroke-width=\"1.5\"/>\n<text x=\"542.0\" y=\"215\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--encre)\">Cede el 50 % del IRPF y del IVA</text>\n<text x=\"542.0\" y=\"233\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">y redistribuye el resto con fondos</text>\n<text x=\"542.0\" y=\"286\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--c1)\">El dinero va del Estado a la región</text>\n</g></svg>" },
            legende: { fr: "Schéma simplifié. Dans le régime commun, le Fonds de garantie des services publics fondamentaux (loi 22/2009) assure à chaque communauté de quoi financer santé, éducation et services sociaux.", es: "Esquema simplificado. En el régimen común, el Fondo de Garantía de Servicios Públicos Fundamentales (Ley 22/2009) asegura a cada comunidad lo necesario para financiar sanidad, educación y servicios sociales." } },
          { t: "p", c: {
            fr: "Au fil des réformes, la part des impôts cédée aux communautés n'a cessé d'augmenter, comme le montre le graphique ci-dessous : 15 % de l'IRPF en 1997 sous José María Aznar, puis 33 % de l'IRPF et 35 % de la TVA en 2002, 50 % des deux en 2009. Le système de la <strong>loi 22/2009</strong> devait être révisé au bout de cinq ans ; faute d'accord entre des communautés aux intérêts opposés, il est resté en vigueur plus de quinze ans.",

          { t: "p", c: {
            fr: "En 2006, la Catalogne se dote d'un nouveau statut, qui définit la Catalogne comme une « nation » dans son préambule, étend ses compétences et prévoit une relation bilatérale avec l'État. Voté par le Parlement catalan, raboté puis adopté par les Cortes, il est approuvé par référendum le 18 juin 2006 avec 73,9 % de « oui », mais une participation de 48,9 %. Le Parti populaire saisit le Tribunal constitutionnel.",
            es: "En 2006, Cataluña se dota de un nuevo Estatuto, que define a Cataluña como «nación» en su preámbulo, amplía sus competencias y prevé una relación bilateral con el Estado. Aprobado por el Parlamento catalán, recortado y aprobado después por las Cortes, se ratifica en referéndum el 18 de junio de 2006 con un 73,9 % de «sí», pero una participación del 48,9 %. El Partido Popular lo recurre ante el Tribunal Constitucional." } },
          { t: "image", src: "images/autonomies-parlament-catalunya.webp", l: 1280, h: 960, format: "droite",
            titre: { fr: "Le Parlement de Catalogne", es: "El Parlamento de Cataluña" },
            legende: { fr: "L'hémicycle du Parlement de Catalogne, dans l'ancien arsenal de la Ciutadella, à Barcelone : c'est ici qu'est voté en 2005 le projet de statut, avant son passage aux Cortes.", es: "El hemiciclo del Parlamento de Cataluña, en el antiguo arsenal de la Ciutadella, en Barcelona: aquí se aprueba en 2005 el proyecto de Estatuto, antes de su paso por las Cortes." },
            alt: { fr: "Salle de séance aux fauteuils rouges en arc de cercle, colonnes de marbre et grands lustres de cristal", es: "Salón de plenos con butacas rojas en semicírculo, columnas de mármol y grandes lámparas de cristal" } },
          { t: "p", c: {
            fr: "Le 28 juin 2010, quatre ans plus tard, son arrêt déclare inconstitutionnels 14 articles, en réinterprète 27 autres et précise que la mention de la « nation » n'a <strong>aucune portée juridique</strong>. Le 10 juillet, des centaines de milliers de personnes défilent à Barcelone derrière le slogan « Som una nació. Nosaltres decidim ». Pour beaucoup de Catalans, la voie d'une autonomie élargie dans la Constitution est fermée : l'arrêt nourrit l'essor de l'indépendantisme.",
            es: "El 28 de junio de 2010, cuatro años después, su sentencia declara inconstitucionales 14 artículos, reinterpreta otros 27 y precisa que la mención de la «nación» <strong>carece de eficacia jurídica</strong>. El 10 de julio, cientos de miles de personas se manifiestan en Barcelona tras el lema «Som una nació. Nosaltres decidim». Para muchos catalanes, la vía de una autonomía ampliada dentro de la Constitución queda cerrada: la sentencia alimenta el auge del independentismo." } },
          { t: "p", c: {
            fr: "La crise culmine en 2017 : après le référendum illégal du 1er octobre et la déclaration d'indépendance du 27, le Sénat autorise pour la première fois l'application de l'<strong>article 155</strong>, qui permet à l'État de prendre des mesures pour contraindre une communauté à respecter ses obligations. Le gouvernement catalan est destitué et des élections sont convoquées le 21 décembre. L'autonomie n'est donc pas un droit absolu : elle s'exerce dans le cadre constitutionnel, sous le contrôle du Tribunal constitutionnel.",
            es: "La crisis culmina en 2017: tras el referéndum ilegal del 1 de octubre y la declaración de independencia del 27, el Senado autoriza por primera vez la aplicación del <strong>artículo 155</strong>, que permite al Estado adoptar medidas para obligar a una comunidad a cumplir sus obligaciones. El gobierno catalán es cesado y se convocan elecciones para el 21 de diciembre. La autonomía no es, pues, un derecho absoluto: se ejerce dentro del marco constitucional, bajo el control del Tribunal Constitucional." } }
        ]

      {
        titre: { fr: "Du « financement singulier » à une réforme générale (2024-2026)", es: "De la «financiación singular» a una reforma general (2024-2026)" },
        blocs: [
          { t: "p", c: {
            fr: "Les élections catalanes de mai 2024 font du socialiste <strong>Salvador Illa</strong> le premier président socialiste de la Generalitat depuis 2010. Investi le 8 août 2024 grâce aux voix d'ERC, il s'est engagé auprès d'elle sur un <strong>« financement singulier »</strong> : une administration fiscale catalane capable de collecter tous les impôts, une contribution versée à l'État pour ses services et une quote-part de solidarité envers les régions plus pauvres. L'idée est de se rapprocher du modèle basque sans quitter le régime commun.",
            es: "Las elecciones catalanas de mayo de 2024 convierten al socialista <strong>Salvador Illa</strong> en el primer presidente socialista de la Generalitat desde 2010. Investido el 8 de agosto de 2024 gracias a los votos de ERC, se comprometió con este partido a impulsar una <strong>«financiación singular»</strong>: una hacienda catalana capaz de recaudar todos los impuestos, una aportación al Estado por sus servicios y una cuota de solidaridad con las regiones más pobres. La idea es acercarse al modelo vasco sin salir del régimen común." } },

            alt: { fr: "Longue façade de brique rouge et de pierre à trois étages, fenêtres à frontons, le long d'une rue de Madrid", es: "Larga fachada de ladrillo rojo y piedra de tres plantas, ventanas con frontones, a lo largo de una calle de Madrid" } },
          { t: "p", c: {
            fr: "En juillet 2025, la commission bilatérale État-Generalitat convient que l'Agence tributaire de Catalogne collectera l'IRPF à partir de 2026, ce qui suppose une réforme de la loi toujours en suspens. Le 8 janvier 2026, Pedro Sánchez et le président d'ERC, Oriol Junqueras, annoncent un accord : 4 700 millions d'euros de plus pour la Catalogne et la reconnaissance du principe d'<strong>ordinalité</strong>. Le lendemain, le ministère des Finances présente un nouveau modèle pour <strong>toutes</strong> les communautés de régime commun : « singulier » pour la Catalogne, il devient général.",
            es: "En julio de 2025, la comisión bilateral Estado-Generalitat acuerda que la Agencia Tributaria de Cataluña recaudará el IRPF a partir de 2026, lo que exige una reforma legal todavía pendiente. El 8 de enero de 2026, Pedro Sánchez y el presidente de ERC, Oriol Junqueras, anuncian un acuerdo: 4 700 millones de euros más para Cataluña y el reconocimiento del principio de <strong>ordinalidad</strong>. Al día siguiente, el Ministerio de Hacienda presenta un nuevo modelo para <strong>todas</strong> las comunidades de régimen común: «singular» para Cataluña, se vuelve general." } },
          { t: "p", c: {
            fr: "Ce modèle promet <strong>20 975 millions d'euros</strong> de plus aux communautés en 2027, pour un total d'environ 224 500 millions. Il porte la part cédée de l'IRPF de 50 à 55 % et celle de la TVA de 50 à 56,5 %, répartit les fonds selon une population « ajustée » qui tient mieux compte du dépeuplement et crée un fonds climatique d'un milliard d'euros. L'État promet en outre 3 300 millions hors du système pour les communautés sous la moyenne, et 400 millions pour que deux d'entre elles ne perdent pas de ressources par habitant.",
            es: "Este modelo promete <strong>20 975 millones de euros</strong> más a las comunidades en 2027, para un total de unos 224 500 millones. Eleva la parte cedida del IRPF del 50 al 55 % y la del IVA del 50 al 56,5 %, reparte los fondos según una población «ajustada» que tiene más en cuenta la despoblación y crea un fondo climático de mil millones de euros. El Estado promete además 3 300 millones fuera del sistema para las comunidades por debajo de la media, y 400 millones para que dos de ellas no pierdan recursos por habitante." } }

      {
        titre: { fr: "Le CPFF du 4 septembre 2026 : une réforme isolée", es: "El CPFF del 4 de septiembre de 2026: una reforma aislada" },
        blocs: [

            es: "El <strong>Consejo de Política Fiscal y Financiera</strong> (CPFF) reúne al ministro de Hacienda y a los consejeros de Hacienda de las comunidades. El 4 de septiembre de 2026, tras más de tres horas de reunión, aprueba el nuevo modelo con el apoyo de solo dos comunidades, Cataluña y Canarias. Las comunidades gobernadas por el PP votan en contra, igual que dos comunidades socialistas, Castilla-La Mancha y Asturias; Madrid no acude." } },
          { t: "p", c: {

      {

        blocs: [
          { t: "p", c: {
            fr: "Au cœur du débat se trouve l'<strong>ordinalité</strong> : une communauté qui contribue davantage ne devrait pas, après redistribution, se retrouver derrière une communauté qui contribue moins, en ressources par habitant. Les régions riches, Catalogne, Madrid, Baléares, dénoncent des reclassements qui les pénalisent. Les régions moins peuplées ou vieillissantes, Estrémadure, Castille-La Manche, Asturies, répondent que la <strong>solidarité</strong> est un principe constitutionnel (articles 2, 138 et 158), destiné à garantir partout des services équivalents.",
            es: "En el centro del debate está la <strong>ordinalidad</strong>: una comunidad que aporta más no debería, tras la redistribución, quedar por detrás de una comunidad que aporta menos, en recursos por habitante. Las regiones ricas, Cataluña, Madrid, Baleares, denuncian reclasificaciones que las penalizan. Las regiones menos pobladas o envejecidas, Extremadura, Castilla-La Mancha, Asturias, responden que la <strong>solidaridad</strong> es un principio constitucional (artículos 2, 138 y 158), destinado a garantizar en todas partes servicios equivalentes." } },

            es: "Para unos, el modelo de 2026 abre una brecha: conceder a una comunidad un trato negociado cara a cara amenaza la igualdad de los españoles ante los servicios públicos e invita a cada región a negociar con sus votos. Para otros, corrige un sistema agotado desde 2014 y no hace más que prolongar una asimetría presente desde 1978 con el régimen foral. El gobierno lo resume con una fórmula: «singular para Cataluña, multilateral para el resto»." } },

            fr: "L'épisode illustre une constante depuis 1978 : chaque tentative de <strong>rationaliser</strong> le système, la carte homogène de 1983, la LOFCA, les réformes de 1996, 2001 et 2009, a fini par susciter de nouvelles demandes d'asymétrie, sous la pression des nationalismes périphériques ou de majorités parlementaires fragiles. L'État des autonomies n'est pas un équilibre acquis une fois pour toutes, mais une <strong>renégociation permanente</strong>, dont le financement de 2026 est le dernier chapitre.",
