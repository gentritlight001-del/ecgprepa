            es: "El <strong>29 de octubre de 2024</strong>, una DANA de intensidad excepcional se abate sobre la región de Valencia: en pocas horas cae el equivalente a varios meses de lluvia, con cerca de 500 mm en Chiva. Los ríos y barrancos se desbordan, en particular el barranco del Poyo, y las riadas sorprenden a miles de personas en sus coches, en las carreteras o en garajes subterráneos. Paiporta, Sedaví, Catarroja y Massanassa, en el cinturón sur de Valencia, figuran entre los municipios más afectados." } },
          { t: "p", c: {
            fr: "Le bilan est le plus lourd d'une catastrophe naturelle en Espagne depuis des décennies. Il a été corrigé au fil de l'enquête : 229 morts dans les décomptes de 2025, puis 232 d'après l'instruction judiciaire en septembre 2026, huit dossiers restant ouverts. Le chiffre de 238 de l'ancien cours n'a pas pu être retrouvé dans les sources actuelles.",
            es: "El balance es el más grave de una catástrofe natural en España en décadas. Se ha ido corrigiendo a lo largo de la investigación: 229 muertos en los recuentos de 2025, y después 232 según la instrucción judicial en septiembre de 2026, con ocho expedientes aún abiertos. La cifra de 238 del antiguo curso no ha podido encontrarse en las fuentes actuales." } },
          { t: "def", mot: { fr: "DANA", es: "DANA" }, c: {
            fr: "<em>Depresión Aislada en Niveles Altos</em> (« dépression isolée en altitude »), l'ancienne « goutte froide » : une poche d'air froid en altitude qui stationne au-dessus de la péninsule et déclenche des pluies très intenses et localisées, d'autant plus violentes que la Méditerranée est chaude.",
            es: "<em>Depresión Aislada en Niveles Altos</em>, la antigua «gota fría»: una bolsa de aire frío en altura que se estaciona sobre la península y desencadena lluvias muy intensas y localizadas, tanto más violentas cuanto más cálido está el Mediterráneo." } }
        ]
      },
      {
        titre: { fr: "Une alerte tardive et une chaîne de décision en cause", es: "Una alerta tardía y una cadena de decisión en entredicho" },
        blocs: [
          { t: "p", c: {
            fr: "La gestion de la crise est très critiquée. L'alerte <strong>ES-Alert</strong>, envoyée sur les téléphones, arrive tard : elle ne touche les habitants que dans la soirée, alors que les crues ont commencé plusieurs heures plus tôt. La lenteur de la chaîne de décision entre l'agence météorologique nationale (AEMET), qui avait lancé une alerte rouge, et la protection civile de la Communauté valencienne, compétente pour déclencher l'alerte, illustre le partage des compétences entre l'État et les régions.",
            es: "La gestión de la crisis es muy criticada. La alerta <strong>ES-Alert</strong>, enviada a los teléfonos, llega tarde: sólo alcanza a los habitantes por la noche, cuando las riadas habían comenzado varias horas antes. La lentitud de la cadena de decisión entre la agencia meteorológica nacional (AEMET), que había lanzado una alerta roja, y la protección civil de la Comunidad Valenciana, competente para activar la alerta, ilustra el reparto de competencias entre el Estado y las regiones." } },
          { t: "p", c: {
            fr: "Le président régional PP, <strong>Carlos Mazón</strong>, est accusé d'avoir tardé à agir. Il annonce sa <strong>démission le 3 novembre 2025</strong>, un an après la catastrophe, sous la pression des associations de victimes. Son successeur, <strong>Juanfran Pérez Llorca</strong>, est investi le 27 novembre 2025 avec 53 voix, celles du PP (40) et de Vox (13) (voir le <a href=\"civi-esp-11.html\">chapitre 11</a>). Dans l'enquête de la juge de Catarroja, deux anciens responsables de l'urgence ont été mis en examen dès mars 2025 ; fin 2025, Mazón ne l'était pas.",
            es: "El presidente regional del PP, <strong>Carlos Mazón</strong>, es acusado de haber tardado en actuar. Anuncia su <strong>dimisión el 3 de noviembre de 2025</strong>, un año después de la catástrofe, bajo la presión de las asociaciones de víctimas. Su sucesor, <strong>Juanfran Pérez Llorca</strong>, es investido el 27 de noviembre de 2025 con 53 votos, los del PP (40) y los de Vox (13) (ver el <a href=\"civi-esp-11.html\">capítulo 11</a>). En la investigación de la jueza de Catarroja, dos antiguos responsables de emergencias fueron imputados en marzo de 2025; a finales de 2025, Mazón no lo estaba." } },
          { t: "encadre", c: "var(--a4)",
            titre: { fr: "Une instruction toujours ouverte", es: "Una instrucción todavía abierta" },
            c2: {
              fr: "La juge Nuria Ruiz Tobarra, du tribunal de Catarroja, instruit pour homicide imprudent. En septembre 2026, elle a obtenu une <strong>prorogation de six mois</strong> à partir du 30 octobre 2026, avec des auditions de maires prévues en octobre. Les responsabilités politiques et pénales restent donc à établir : ne pas présenter l'enquête comme close.",
              es: "La jueza Nuria Ruiz Tobarra, del tribunal de Catarroja, instruye por homicidio imprudente. En septiembre de 2026, obtuvo una <strong>prórroga de seis meses</strong> a partir del 30 de octubre de 2026, con declaraciones de alcaldes previstas en octubre. Las responsabilidades políticas y penales siguen, pues, por establecer: no hay que presentar la investigación como cerrada."
            } }
        ]
      },
      {
        titre: { fr: "Deux ans après : la DANA Adam d'octobre 2026", es: "Dos años después: la DANA Adam de octubre de 2026" },
        blocs: [
          { t: "p", c: {
            fr: "En <strong>octobre 2026</strong>, la <a href=\"../../../../actualites/es/articles/espagne-dana-adam-inondations-2026.html\" class=\"a-lien\">DANA Adam</a>, première DANA baptisée de la saison, déverse plus de 700 litres par mètre carré en deux jours entre la Safor et la Marina Alta, au sud de Valence. L'AEMET place le littoral en alerte rouge ; l'épisode fait au moins quatre morts et plus de 2 100 évacués dans la Communauté valencienne. Cette fois, des messages d'alerte demandent aux habitants de ne pas descendre dans les garages et les sous-sols, signe que le système d'alerte a évolué depuis 2024.",
            es: "En <strong>octubre de 2026</strong>, la <a href=\"../../../../actualites/es/articles/espagne-dana-adam-inondations-2026.html\" class=\"a-lien\">DANA Adam</a>, la primera DANA bautizada de la temporada, descarga más de 700 litros por metro cuadrado en dos días entre la Safor y la Marina Alta, al sur de Valencia. La AEMET sitúa el litoral en alerta roja; el episodio causa al menos cuatro muertos y más de 2 100 evacuados en la Comunidad Valenciana. Esta vez, unos mensajes de alerta piden a los habitantes que no bajen a garajes ni sótanos, señal de que el sistema de alerta ha evolucionado desde 2024." } },
          { t: "p", c: {
            fr: "Pedro Sánchez accuse à cette occasion une Méditerranée de 3 à 4 °C plus chaude que la moyenne d'octobre, qui fournit l'humidité de ces orages. Le schéma de la partie III montre pourquoi sécheresse et pluies torrentielles ne s'opposent pas.",
            es: "Pedro Sánchez señala con este motivo un Mediterráneo de 3 a 4 °C más cálido que la media de octubre, que aporta la humedad de estas tormentas. El esquema de la parte III muestra por qué sequía y lluvias torrenciales no se oponen." } }
        ]
      }
    ]
  },
  {
    num: "III",
    kicker: { fr: "Le temps présent", es: "El presente" },
    titre: { fr: "Des étés de feu et de chaleur, et des réponses politiques (2025-2026)", es: "Veranos de fuego y de calor, y respuestas políticas (2025-2026)" },
    couleur: "var(--a3)",
    sections: [
      {
        titre: { fr: "Incendies : 2025 puis 2026", es: "Incendios: 2025 y 2026" },
        blocs: [
          { t: "image", src: "images/climat-marin-incendio.webp", l: 1280, h: 853, format: "droite",
            titre: {"fr": "Un feu en Galice", "es": "Un fuego en Galicia"},
            legende: {"fr": "Entre Marín et Pontevedra (Galice), juillet 2025 : un panache de fumée au-dessus d'une forêt d'eucalyptus et de maisons.", "es": "Entre Marín y Pontevedra (Galicia), julio de 2025: una columna de humo sobre un bosque de eucaliptos y unas casas."},
            alt: {"fr": "Un panache de fumée brune s'élève derrière une forêt d'eucalyptus, au-dessus de maisons éclairées par le soleil couchant", "es": "Una columna de humo pardo se eleva tras un bosque de eucaliptos, sobre casas iluminadas por el sol del atardecer"} },
          { t: "p", c: {
            fr: "Les incendies deviennent la nouvelle face de la crise. En 2025, le ministère estime à titre provisoire la surface brûlée à <strong>354 793 hectares</strong>, la pire année depuis trente ans, avec quatre morts selon l'agence EFE ; le noroeste (Ourense, Zamora, León) concentre l'essentiel des dégâts. En 2026, le feu de la <a href=\"../../../../actualites/es/articles/incendies-madrid-espagne.html\" class=\"a-lien\">Sierra Oeste</a> brûle plus de 75 000 hectares à Madrid et en Ávila du 22 juillet au 4 août, et déclenche pour la première fois « l'urgence d'intérêt national » pour un feu de forêt.",
            es: "Los incendios se convierten en la nueva cara de la crisis. En 2025, el ministerio estima con carácter provisional la superficie quemada en <strong>354 793 hectáreas</strong>, el peor año en treinta años, con cuatro muertos según la agencia EFE; el noroeste (Ourense, Zamora, León) concentra lo esencial de los daños. En 2026, el fuego de la <a href=\"../../../../actualites/es/articles/incendies-madrid-espagne.html\" class=\"a-lien\">Sierra Oeste</a> quema más de 75 000 hectáreas en Madrid y Ávila del 22 de julio al 4 de agosto, y activa por primera vez la «emergencia de interés nacional» por un incendio forestal." } },
          { t: "p", c: {
            fr: "Au 17 août 2026, le ministère compte <strong>254 730 hectares</strong> brûlés et 42 grands incendies (plus de 500 hectares), le plus grand étant celui de Niebla (Huelva), avec environ 39 800 hectares. Le chiffre est, pour la première fois de la campagne, inférieur à celui de la même date de 2025, mais il reste historiquement très élevé, comme le montre le graphique suivant.",
            es: "A 17 de agosto de 2026, el ministerio contabiliza <strong>254 730 hectáreas</strong> quemadas y 42 grandes incendios (más de 500 hectáreas), el mayor el de Niebla (Huelva), con unas 39 800 hectáreas. La cifra es, por primera vez en la campaña, inferior a la de la misma fecha de 2025, pero sigue siendo históricamente muy elevada, como muestra el gráfico siguiente." } },
          { t: "schema", compact: true,
            titre: { fr: "Surface brûlée en Espagne (en hectares)", es: "Superficie quemada en España (en hectáreas)" },
            svg: { fr: "<svg viewBox=\"0 0 460 200\" role=\"img\" aria-label=\"Barres horizontales : 354 793 hectares brûlés en 2025, 295 580 au 17 août 2025 et 254 730 au 17 août 2026.\">\n<g font-family=\"var(--texte)\">\n<line x1=\"130\" y1=\"14\" x2=\"130\" y2=\"170\" stroke=\"var(--encre2)\" stroke-width=\"1.5\"/>\n<text x=\"120\" y=\"46\" text-anchor=\"end\" font-size=\"14\" font-weight=\"700\" fill=\"var(--encre)\">2025, année</text>\n<rect x=\"130\" y=\"26\" width=\"205.0\" height=\"28\" rx=\"3\" fill=\"var(--c1)\"/>\n<text x=\"343.0\" y=\"46\" font-size=\"14\" font-weight=\"800\" fill=\"var(--encre)\">354 793</text>\n<text x=\"120\" y=\"96\" text-anchor=\"end\" font-size=\"14\" font-weight=\"700\" fill=\"var(--encre)\">17 août 2025</text>\n<rect x=\"130\" y=\"76\" width=\"170.8\" height=\"28\" rx=\"3\" fill=\"var(--c2)\"/>\n<text x=\"308.8\" y=\"96\" font-size=\"14\" font-weight=\"800\" fill=\"var(--encre)\">295 580</text>\n<text x=\"120\" y=\"146\" text-anchor=\"end\" font-size=\"14\" font-weight=\"700\" fill=\"var(--encre)\">17 août 2026</text>\n<rect x=\"130\" y=\"126\" width=\"147.2\" height=\"28\" rx=\"3\" fill=\"var(--c4)\"/>\n<text x=\"285.2\" y=\"146\" font-size=\"14\" font-weight=\"800\" fill=\"var(--encre)\">254 730</text>\n</g></svg>", es: "<svg viewBox=\"0 0 460 200\" role=\"img\" aria-label=\"Barras horizontales: 354 793 hectáreas quemadas en 2025, 295 580 a 17 de agosto de 2025 y 254 730 a 17 de agosto de 2026.\">\n<g font-family=\"var(--texte)\">\n<line x1=\"130\" y1=\"14\" x2=\"130\" y2=\"170\" stroke=\"var(--encre2)\" stroke-width=\"1.5\"/>\n<text x=\"120\" y=\"46\" text-anchor=\"end\" font-size=\"14\" font-weight=\"700\" fill=\"var(--encre)\">2025, año</text>\n<rect x=\"130\" y=\"26\" width=\"205.0\" height=\"28\" rx=\"3\" fill=\"var(--c1)\"/>\n<text x=\"343.0\" y=\"46\" font-size=\"14\" font-weight=\"800\" fill=\"var(--encre)\">354 793</text>\n<text x=\"120\" y=\"96\" text-anchor=\"end\" font-size=\"14\" font-weight=\"700\" fill=\"var(--encre)\">17 agosto 2025</text>\n<rect x=\"130\" y=\"76\" width=\"170.8\" height=\"28\" rx=\"3\" fill=\"var(--c2)\"/>\n<text x=\"308.8\" y=\"96\" font-size=\"14\" font-weight=\"800\" fill=\"var(--encre)\">295 580</text>\n<text x=\"120\" y=\"146\" text-anchor=\"end\" font-size=\"14\" font-weight=\"700\" fill=\"var(--encre)\">17 agosto 2026</text>\n<rect x=\"130\" y=\"126\" width=\"147.2\" height=\"28\" rx=\"3\" fill=\"var(--c4)\"/>\n<text x=\"285.2\" y=\"146\" font-size=\"14\" font-weight=\"800\" fill=\"var(--encre)\">254 730</text>\n</g></svg>" },
            legende: { fr: "Source : ministère pour la Transition écologique et le Défi démographique (MITECO), estimations provisoires : 354 793 ha pour l'ensemble de 2025 ; 295 580 ha au 17 août 2025 ; 254 730 ha au 17 août 2026.", es: "Fuente: Ministerio para la Transición Ecológica y el Reto Demográfico (MITECO), estimaciones provisionales: 354 793 ha en el conjunto de 2025; 295 580 ha a 17 de agosto de 2025; 254 730 ha a 17 de agosto de 2026." } }

      {
        titre: { fr: "L'été 2026 : chaud, sec et deux faces d'un même dérèglement", es: "El verano de 2026: cálido, seco y dos caras de un mismo trastorno" },
        blocs: [
          { t: "p", c: {
            fr: "L'agence météorologique AEMET qualifie l'été 2026 (du 1<sup>er</sup> juin au 31 août) de <strong>plus chaud de la série officielle</strong>, depuis 1961, et de plus chaud depuis au moins 1869 selon les reconstructions : 24,5 °C de moyenne sur la péninsule, soit 2,4 °C au-dessus de la normale. Juillet est le mois le plus chaud jamais enregistré, et quatre vagues de chaleur se succèdent (huit jours en juin, 23 en juillet, 24 de fin juillet à fin août dans la péninsule et aux Baléares). Les précipitations ne représentent que 56 % de la normale, le troisième été le plus sec depuis 1961.",
            es: "La agencia meteorológica AEMET califica el verano de 2026 (del 1 de junio al 31 de agosto) como el <strong>más cálido de la serie oficial</strong>, desde 1961, y el más cálido desde al menos 1869 según las reconstrucciones: 24,5 °C de media en la península, 2,4 °C por encima de lo normal. Julio es el mes más cálido jamás registrado, y se suceden cuatro olas de calor (ocho días en junio, 23 en julio, 24 de finales de julio a finales de agosto en la península y Baleares). Las precipitaciones sólo representan el 56 % de lo normal, el tercer verano más seco desde 1961." } },
          { t: "tableau",

                ["Réserve hydrique, 3 novembre 2026", "56 % (31 402 hm³ sur 56 043), au-dessus de 2025", "MITECO, d'après la presse"],

          { t: "p", c: {
            fr: "Il ne faut pas opposer ces chaleurs et ces sécheresses aux inondations de 2024 et de 2026. Pour la Méditerranée, les projections du GIEC annoncent à la fois une <strong>aridification</strong> tendancielle (moins de pluie au total) et des <strong>pluies extrêmes</strong> plus violentes quand elles surviennent : un air et une mer plus chauds retiennent plus d'humidité et la relâchent brutalement. Le schéma suivant montre cette double conséquence.",
            es: "No hay que oponer estos calores y sequías a las inundaciones de 2024 y de 2026. Para el Mediterráneo, las proyecciones del IPCC anuncian a la vez una <strong>aridificación</strong> tendencial (menos lluvia en total) y <strong>lluvias extremas</strong> más violentas cuando se producen: un aire y un mar más cálidos retienen más humedad y la sueltan bruscamente. El esquema siguiente muestra esta doble consecuencia." } },
          { t: "schema", compact: true,
            titre: { fr: "Deux faces d'un même dérèglement", es: "Dos caras de un mismo trastorno" },
