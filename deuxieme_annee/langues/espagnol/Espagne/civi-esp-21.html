            legende: { fr: "Ordre de grandeur d'après la presse (« une dizaine » de dirigeants au plus haut niveau, selon un média mexicain ; Allamand avait annoncé plus de 14 présidents avant le sommet). Les autres pays étaient représentés par des vice-présidents ou des ministres.", es: "Orden de magnitud según la prensa («una decena» de dirigentes del más alto nivel, según un medio mexicano; Allamand había anunciado más de 14 presidentes antes de la cumbre). Los demás países estuvieron representados por vicepresidentes o ministros." } },
          { t: "p", c: {
            fr: "Le sommet ne marque pas de réconciliation avec l'Argentine. Le 21 octobre, lors d'une visite à Madrid à six semaines des élections du 29 novembre, Milei avait traité Sánchez d'« impresentable dictador » et refusé de voir le roi (voir l'<a href=\"../../../../actualites/es/articles/espagne-milei-madrid-campagne-29n-2026.html\" class=\"a-lien\">article sur sa visite</a>). Le 5 novembre, il échange une brève et distante poignée de main avec Sánchez, sans entretien bilatéral, et il boude la cérémonie d'ouverture et le dîner. Les participants adoptent des documents et une déclaration commune, et le Honduras accueillera le sommet de 2028.",
            es: "La cumbre no marca ninguna reconciliación con Argentina. El 21 de octubre, en una visita a Madrid a seis semanas de las elecciones del 29 de noviembre, Milei había llamado a Sánchez «impresentable dictador» y se había negado a ver al rey (ver el <a href=\"../../../../actualites/es/articles/espagne-milei-madrid-campagne-29n-2026.html\" class=\"a-lien\">artículo sobre su visita</a>). El 5 de noviembre, intercambia un breve y distante saludo con Sánchez, sin entrevista bilateral, y rehúye la ceremonia de apertura y la cena. Los participantes adoptan documentos y una declaración conjunta, y Honduras acogerá la cumbre de 2028." } },

          { t: "p", c: {
            fr: "Le lien humain dépasse donc les crises entre gouvernements. L'Espagne compte plus de 10 millions de résidents nés à l'étranger, et les Colombiens et les Vénézuéliens figurent parmi les principales nationalités arrivées au printemps 2026. L'ampleur de la régularisation extraordinaire adoptée le 14 avril 2026 en témoigne, car environ 91 % des 838 000 immigrés en situation irrégulière estimés début 2025 venaient des Amériques (Migration Policy Institute). Ces liens expliquent que les crises restent des épisodes conjoncturels dans une relation de très longue durée, mais ils pèsent aussi dans la politique intérieure espagnole, à la veille des élections du 29 novembre (voir le <a href=\"civi-esp-12.html\">chapitre 12</a>).",
            es: "El vínculo humano supera, pues, las crisis entre gobiernos. España cuenta con más de 10 millones de residentes nacidos en el extranjero, y los colombianos y los venezolanos figuran entre las principales nacionalidades llegadas en la primavera de 2026. La amplitud de la regularización extraordinaria adoptada el 14 de abril de 2026 lo demuestra, pues cerca del 91 % de los 838 000 inmigrantes en situación irregular estimados a principios de 2025 procedían de las Américas (Migration Policy Institute). Estos vínculos explican que las crisis sigan siendo episodios coyunturales en una relación de muy larga duración, pero pesan también en la política interior española, en vísperas de las elecciones del 29 de noviembre (ver el <a href=\"civi-esp-12.html\">capítulo 12</a>)." } }
