    kicker: { fr: "Empire et déclin", es: "Imperio y declive" },
    titre: { fr: "Le premier empire mondial : apogée et déclin des Habsbourg", es: "El primer imperio mundial: apogeo y declive de los Austrias" },
    couleur: "var(--a2)",
    sections: [
      {
        titre: { fr: "Charles Quint : un empire mondial", es: "Carlos V: un imperio mundial" },
        blocs: [
          { t: "p", c: {
            fr: "En 1516, <strong>Charles Ier</strong>, petit-fils des Rois Catholiques et de l'empereur Maximilien de Habsbourg, hérite des couronnes de Castille et d'Aragon ; élu empereur en 1519, il devient <strong>Charles Quint</strong>. Il règne sur un ensemble sans équivalent en Europe depuis Charlemagne : l'Espagne, les Pays-Bas, la Franche-Comté, le royaume de Naples, puis les immenses territoires conquis en Amérique par Hernán Cortés (Mexique, 1521) et Francisco Pizarro (Pérou, 1533). La conquête et surtout les épidémies venues d'Europe provoquent un effondrement démographique des peuples amérindiens, que les historiens estiment à plus de la moitié de la population en un siècle, et bien davantage dans certaines régions.",
            es: "En 1516, <strong>Carlos I</strong>, nieto de los Reyes Católicos y del emperador Maximiliano de Habsburgo, hereda las coronas de Castilla y Aragón; elegido emperador en 1519, se convierte en <strong>Carlos V</strong>. Reina sobre un conjunto sin equivalente en Europa desde Carlomagno: España, los Países Bajos, el Franco Condado, el reino de Nápoles y luego los inmensos territorios conquistados en América por Hernán Cortés (México, 1521) y Francisco Pizarro (Perú, 1533). La conquista y sobre todo las epidemias llegadas de Europa provocan un hundimiento demográfico de los pueblos amerindios, que los historiadores estiman en más de la mitad de la población en un siglo, y mucho más en algunas regiones." } },
          { t: "p", c: {
            fr: "L'argent des mines de Potosí (découvertes en 1545) et du Mexique afflue à Séville, seul port autorisé à commercer avec l'Amérique. Mais cette accumulation de couronnes suscite dès 1520 la révolte castillane des <em>Comunidades</em>, écrasée à Villalar en 1521 : villes et noblesse voient leurs ressources englouties dans des guerres européennes menées par un souverain jugé étranger. Épuisé, Charles Quint abdique en 1555-1556 et partage son héritage entre son fils Philippe (l'Espagne, l'Italie, les Pays-Bas et l'Amérique) et son frère Ferdinand (les terres autrichiennes et l'Empire).",
            es: "La plata de las minas de Potosí (descubiertas en 1545) y de México afluye a Sevilla, único puerto autorizado a comerciar con América. Pero esta acumulación de coronas provoca ya en 1520 la revuelta castellana de las <em>Comunidades</em>, aplastada en Villalar en 1521: ciudades y nobleza ven sus recursos engullidos por guerras europeas libradas por un soberano considerado extranjero. Agotado, Carlos V abdica en 1555-1556 y reparte su herencia entre su hijo Felipe (España, Italia, los Países Bajos y América) y su hermano Fernando (las tierras austríacas y el Imperio)." } },
          { t: "stats", items: [
            { n: "1521", d: { fr: "chute de Tenochtitlan : Cortés conquiert l'empire aztèque", es: "caída de Tenochtitlan: Cortés conquista el imperio azteca" }, c: "var(--a1)" },
            { n: "1533", d: { fr: "Pizarro prend Cuzco, capitale de l'empire inca", es: "Pizarro toma Cuzco, capital del imperio inca" }, c: "var(--a2)" },
            { n: { fr: "16 886 t", es: "16 886 t" }, d: { fr: "d'argent enregistrées à Séville entre 1503 et 1660, avec 181 t d'or (E. J. Hamilton)", es: "de plata registradas en Sevilla entre 1503 y 1660, con 181 t de oro (E. J. Hamilton)" }, c: "var(--a3)" }
          ] }
        ]
      },
      {
        titre: { fr: "Philippe II et le Siècle d'or", es: "Felipe II y el Siglo de Oro" },
        blocs: [
          { t: "image", src: "images/histoire-escurial.webp", l: 960, h: 720, format: "gauche",
            titre: { fr: "L'Escurial", es: "El Escorial" },
            legende: { fr: "Monastère, palais et panthéon royal bâti de 1563 à 1584 près de Madrid : le cœur austère de la monarchie de Philippe II.", es: "Monasterio, palacio y panteón real construido de 1563 a 1584 cerca de Madrid: el corazón austero de la monarquía de Felipe II." },
            alt: { fr: "Longue façade de granit aux fenêtres régulières et toits d'ardoise du monastère de l'Escurial, avec des promeneurs sur l'esplanade", es: "Larga fachada de granito con ventanas regulares y tejados de pizarra del monasterio de El Escorial, con paseantes en la explanada" } },
          { t: "p", c: {
            fr: "<strong>Philippe II</strong> (1556-1598) fixe la cour à Madrid en 1561 et gouverne depuis l'<em>Escurial</em> un empire « sur lequel le soleil ne se couche jamais » : l'Espagne, l'Amérique, les Philippines (qui portent son nom) et, à partir de 1580, le Portugal et son empire, unis à l'Espagne jusqu'en 1640. Défenseur intransigeant du catholicisme, il remporte sur les Ottomans la bataille navale de <strong>Lépante</strong> (1571), mais s'enlise dans la révolte des Pays-Bas protestants, à partir de 1568, et dans la guerre contre l'Angleterre d'Élisabeth Ire. Malgré l'argent d'Amérique, la Couronne fait plusieurs fois banqueroute (1557, 1560, 1575, 1596).",
            es: "<strong>Felipe II</strong> (1556-1598) fija la corte en Madrid en 1561 y gobierna desde <em>El Escorial</em> un imperio «donde nunca se pone el sol»: España, América, Filipinas (que llevan su nombre) y, a partir de 1580, Portugal y su imperio, unidos a España hasta 1640. Defensor intransigente del catolicismo, vence a los otomanos en la batalla naval de <strong>Lepanto</strong> (1571), pero se empantana en la rebelión de los Países Bajos protestantes, a partir de 1568, y en la guerra contra la Inglaterra de Isabel I. Pese a la plata americana, la Corona declara varias bancarrotas (1557, 1560, 1575, 1596)." } },
          { t: "p", c: {
            fr: "C'est aussi le <strong>Siècle d'or</strong> (<em>Siglo de Oro</em>), sommet de la création espagnole qui s'étend du milieu du XVIe à la fin du XVIIe siècle : Cervantès publie <em>Don Quichotte</em> en 1605 et 1615, Lope de Vega puis Calderón renouvellent le théâtre, Le Greco peint à Tolède et Vélasquez, peintre de Philippe IV, compose <em>Les Ménines</em> en 1656. Ce rayonnement contraste avec des difficultés croissantes : l'afflux de métaux précieux nourrit une inflation durable, la « révolution des prix », tandis que l'agriculture et l'artisanat castillans stagnent.",
            es: "Es también el <strong>Siglo de Oro</strong>, cumbre de la creación española que se extiende de mediados del siglo XVI a finales del XVII: Cervantes publica el <em>Quijote</em> en 1605 y 1615, Lope de Vega y después Calderón renuevan el teatro, El Greco pinta en Toledo y Velázquez, pintor de Felipe IV, compone <em>Las Meninas</em> en 1656. Este esplendor contrasta con dificultades crecientes: la afluencia de metales preciosos alimenta una inflación duradera, la «revolución de los precios», mientras la agricultura y la artesanía castellanas se estancan." } },
          { t: "citation",
            c: { fr: "En un lugar de la Mancha, de cuyo nombre no quiero acordarme… (Dans un village de la Manche, dont je ne veux pas me rappeler le nom…)", es: "En un lugar de la Mancha, de cuyo nombre no quiero acordarme…" },
            src: { fr: "Miguel de Cervantès, Don Quichotte, première phrase, 1605", es: "Miguel de Cervantes, Don Quijote de la Mancha, primera frase, 1605" } }
        ]
      },
      {
        titre: { fr: "1588-1714 : de l'Armada aux Bourbons", es: "1588-1714: de la Armada a los Borbones" },
        blocs: [
          { t: "image", src: "images/histoire-reddition-breda.webp", l: 960, h: 790, format: "droite",
            titre: { fr: "Les Lances", es: "Las lanzas" },
            legende: { fr: "Vélasquez, La Reddition de Breda (1634-1635) : une victoire de 1625 aux Pays-Bas, peinte alors que la puissance espagnole s'essouffle.", es: "Velázquez, La rendición de Breda (1634-1635): una victoria de 1625 en los Países Bajos, pintada cuando el poder español ya se agota." },
            alt: { fr: "Tableau : le général vaincu remet les clés de Breda au vainqueur espagnol, qui lui pose la main sur l'épaule, devant une forêt de lances", es: "Cuadro: el general vencido entrega las llaves de Breda al vencedor español, que le pone la mano en el hombro, ante un bosque de lanzas" } },
          { t: "p", c: {
            fr: "L'échec de l'<strong>Invincible Armada</strong>, flotte envoyée en 1588 pour envahir l'Angleterre protestante, est un choc symbolique plus qu'un effondrement : l'Espagne reste la première puissance d'Europe pendant un demi-siècle. Mais le XVIIe siècle est celui d'un déclin lent. Philippe III, Philippe IV puis <strong>Charles II</strong>, souverain malade et sans descendance, gouvernent par l'intermédiaire de favoris (<em>validos</em>), comme le duc de Lerma ou le comte-duc d'Olivares. En 1640, la Catalogne et le Portugal se soulèvent ; le Portugal recouvre son indépendance. Aux traités de Westphalie (1648) et des Pyrénées (1659), l'Espagne reconnaît les Provinces-Unies et cède à la France le Roussillon et l'Artois.",
            es: "El fracaso de la <strong>Armada Invencible</strong>, flota enviada en 1588 para invadir la Inglaterra protestante, es un golpe simbólico más que un hundimiento: España sigue siendo la primera potencia de Europa durante medio siglo. Pero el siglo XVII es el de un declive lento. Felipe III, Felipe IV y luego <strong>Carlos II</strong>, soberano enfermo y sin descendencia, gobiernan a través de favoritos (<em>validos</em>), como el duque de Lerma o el conde-duque de Olivares. En 1640, Cataluña y Portugal se sublevan; Portugal recupera su independencia. En los tratados de Westfalia (1648) y de los Pirineos (1659), España reconoce a las Provincias Unidas y cede a Francia el Rosellón y el Artois." } },
          { t: "p", c: {
            fr: "La mort sans héritier de Charles II, le 1er novembre 1700, ouvre une crise européenne : il a désigné pour successeur <strong>Philippe d'Anjou</strong>, petit-fils de Louis XIV, ce que refusent l'Autriche, l'Angleterre et les Provinces-Unies, qui craignent une union des couronnes française et espagnole. La <strong>guerre de Succession d'Espagne</strong> (1701-1714) installe les <strong>Bourbons</strong> sur le trône avec Philippe V, mais les traités d'Utrecht (1713) et de Rastatt (1714) coûtent à l'Espagne ses possessions européennes (Pays-Bas, Milan, Naples, Sardaigne, Sicile) et lui retirent Gibraltar et Minorque, cédés au Royaume-Uni. Barcelone, qui soutenait le prétendant autrichien, tombe le 11 septembre 1714, date devenue la fête nationale de la Catalogne, la <em>Diada</em>.",
            es: "La muerte sin heredero de Carlos II, el 1 de noviembre de 1700, abre una crisis europea: ha designado como sucesor a <strong>Felipe de Anjou</strong>, nieto de Luis XIV, lo que rechazan Austria, Inglaterra y las Provincias Unidas, que temen una unión de las coronas francesa y española. La <strong>guerra de Sucesión</strong> (1701-1714) instala a los <strong>Borbones</strong> en el trono con Felipe V, pero los tratados de Utrecht (1713) y Rastatt (1714) le cuestan a España sus posesiones europeas (Países Bajos, Milán, Nápoles, Cerdeña, Sicilia) y le quitan Gibraltar y Menorca, cedidos al Reino Unido. Barcelona, que apoyaba al pretendiente austríaco, cae el 11 de septiembre de 1714, fecha convertida en la fiesta nacional de Cataluña, la <em>Diada</em>." } },
          { t: "p", c: {
            fr: "Le schéma ci-dessous résume cette construction : de 1479 à 1716, un même roi règne sur plusieurs royaumes qui gardent leurs lois, jusqu'à ce que les Bourbons imposent l'uniformité castillane aux vaincus de la guerre.",
            es: "El esquema siguiente resume esta construcción: de 1479 a 1716, un mismo rey reina sobre varios reinos que conservan sus leyes, hasta que los Borbones imponen la uniformidad castellana a los vencidos de la guerra." } },
          { t: "schema",
            titre: { fr: "Une couronne, plusieurs royaumes : la monarchie composée (1479-1716)", es: "Una corona, varios reinos: la monarquía compuesta (1479-1716)" },
            svg: {
              fr: "<svg viewBox=\"0 0 720 300\" role=\"img\" aria-label=\"Schéma : quatre royaumes, Castille (1474), Aragon (1479), Navarre (1512) et Portugal (1580-1640), réunis sous un même roi tout en gardant leurs lois, jusqu’aux décrets de Nueva Planta de 1707-1716.\">\n<defs><marker id=\"fl-np\" viewBox=\"0 0 10 10\" refX=\"5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--encre2)\"/></marker></defs>\n<g font-family=\"var(--texte)\">\n<rect x=\"8\" y=\"8\" width=\"170\" height=\"122\" rx=\"12\" fill=\"color-mix(in srgb,var(--c1) 10%,transparent)\" stroke=\"var(--c1)\" stroke-width=\"1.5\"/>\n<text x=\"93\" y=\"38\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--c1)\">Castille</text>\n<text x=\"93\" y=\"62\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--encre)\">1474</text>\n<text x=\"93\" y=\"92\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">Castille, León, Galice,</text>\n<text x=\"93\" y=\"110\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">Andalousie, Amérique</text>\n<line x1=\"93\" y1=\"132\" x2=\"93\" y2=\"154\" stroke=\"var(--encre2)\" stroke-width=\"1.5\" marker-end=\"url(#fl-np)\"/>\n<rect x=\"186\" y=\"8\" width=\"170\" height=\"122\" rx=\"12\" fill=\"color-mix(in srgb,var(--c2) 10%,transparent)\" stroke=\"var(--c2)\" stroke-width=\"1.5\"/>\n<text x=\"271\" y=\"38\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--c2)\">Aragon</text>\n<text x=\"271\" y=\"62\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--encre)\">1479</text>\n<text x=\"271\" y=\"92\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">Aragon, Catalogne,</text>\n<text x=\"271\" y=\"110\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">Valence, Majorque</text>\n<line x1=\"271\" y1=\"132\" x2=\"271\" y2=\"154\" stroke=\"var(--encre2)\" stroke-width=\"1.5\" marker-end=\"url(#fl-np)\"/>\n<rect x=\"364\" y=\"8\" width=\"170\" height=\"122\" rx=\"12\" fill=\"color-mix(in srgb,var(--c3) 10%,transparent)\" stroke=\"var(--c3)\" stroke-width=\"1.5\"/>\n<text x=\"449\" y=\"38\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--c3)\">Navarre</text>\n<text x=\"449\" y=\"62\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--encre)\">1512</text>\n<text x=\"449\" y=\"92\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">annexée par</text>\n<text x=\"449\" y=\"110\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">Ferdinand</text>\n<line x1=\"449\" y1=\"132\" x2=\"449\" y2=\"154\" stroke=\"var(--encre2)\" stroke-width=\"1.5\" marker-end=\"url(#fl-np)\"/>\n<rect x=\"542\" y=\"8\" width=\"170\" height=\"122\" rx=\"12\" fill=\"color-mix(in srgb,var(--c4) 10%,transparent)\" stroke=\"var(--c4)\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\"/>\n<text x=\"627\" y=\"38\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--c4)\">Portugal</text>\n<text x=\"627\" y=\"62\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--encre)\">1580-1640</text>\n<text x=\"627\" y=\"92\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">uni par Philippe II,</text>\n<text x=\"627\" y=\"110\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">perdu en 1640</text>\n<line x1=\"627\" y1=\"132\" x2=\"627\" y2=\"154\" stroke=\"var(--encre2)\" stroke-width=\"1.5\" marker-end=\"url(#fl-np)\" stroke-dasharray=\"4 3\"/>\n<rect x=\"8\" y=\"160\" width=\"704\" height=\"54\" rx=\"12\" fill=\"color-mix(in srgb,var(--c2) 12%,transparent)\" stroke=\"var(--c2)\" stroke-width=\"1.5\"/>\n<text x=\"360\" y=\"183\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--encre)\">Un même roi, mais chaque royaume garde ses lois, ses Cortes et sa monnaie</text>\n<text x=\"360\" y=\"203\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">1479-1707 : la « monarchie hispanique »</text>\n<line x1=\"360\" y1=\"216\" x2=\"360\" y2=\"234\" stroke=\"var(--encre2)\" stroke-width=\"1.5\" marker-end=\"url(#fl-np)\"/>\n<rect x=\"8\" y=\"240\" width=\"704\" height=\"54\" rx=\"12\" fill=\"var(--c1)\"/>\n<text x=\"360\" y=\"263\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#fff\">1707-1716 : décrets de Nueva Planta, lois de Castille imposées à la couronne d’Aragon</text>\n<text x=\"360\" y=\"283\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#fff\" opacity=\".9\">Les provinces basques et la Navarre gardent leurs fueros</text>\n</g></svg>",
              es: "<svg viewBox=\"0 0 720 300\" role=\"img\" aria-label=\"Esquema: cuatro reinos, Castilla (1474), Aragón (1479), Navarra (1512) y Portugal (1580-1640), reunidos bajo un mismo rey conservando sus leyes, hasta los decretos de Nueva Planta de 1707-1716.\">\n<defs><marker id=\"fl-np\" viewBox=\"0 0 10 10\" refX=\"5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--encre2)\"/></marker></defs>\n<g font-family=\"var(--texte)\">\n<rect x=\"8\" y=\"8\" width=\"170\" height=\"122\" rx=\"12\" fill=\"color-mix(in srgb,var(--c1) 10%,transparent)\" stroke=\"var(--c1)\" stroke-width=\"1.5\"/>\n<text x=\"93\" y=\"38\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--c1)\">Castilla</text>\n<text x=\"93\" y=\"62\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--encre)\">1474</text>\n<text x=\"93\" y=\"92\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">Castilla, León, Galicia,</text>\n<text x=\"93\" y=\"110\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">Andalucía, América</text>\n<line x1=\"93\" y1=\"132\" x2=\"93\" y2=\"154\" stroke=\"var(--encre2)\" stroke-width=\"1.5\" marker-end=\"url(#fl-np)\"/>\n<rect x=\"186\" y=\"8\" width=\"170\" height=\"122\" rx=\"12\" fill=\"color-mix(in srgb,var(--c2) 10%,transparent)\" stroke=\"var(--c2)\" stroke-width=\"1.5\"/>\n<text x=\"271\" y=\"38\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--c2)\">Aragón</text>\n<text x=\"271\" y=\"62\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--encre)\">1479</text>\n<text x=\"271\" y=\"92\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">Aragón, Cataluña,</text>\n<text x=\"271\" y=\"110\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">Valencia, Mallorca</text>\n<line x1=\"271\" y1=\"132\" x2=\"271\" y2=\"154\" stroke=\"var(--encre2)\" stroke-width=\"1.5\" marker-end=\"url(#fl-np)\"/>\n<rect x=\"364\" y=\"8\" width=\"170\" height=\"122\" rx=\"12\" fill=\"color-mix(in srgb,var(--c3) 10%,transparent)\" stroke=\"var(--c3)\" stroke-width=\"1.5\"/>\n<text x=\"449\" y=\"38\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--c3)\">Navarra</text>\n<text x=\"449\" y=\"62\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--encre)\">1512</text>\n<text x=\"449\" y=\"92\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">anexionada por</text>\n<text x=\"449\" y=\"110\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">Fernando</text>\n<line x1=\"449\" y1=\"132\" x2=\"449\" y2=\"154\" stroke=\"var(--encre2)\" stroke-width=\"1.5\" marker-end=\"url(#fl-np)\"/>\n<rect x=\"542\" y=\"8\" width=\"170\" height=\"122\" rx=\"12\" fill=\"color-mix(in srgb,var(--c4) 10%,transparent)\" stroke=\"var(--c4)\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\"/>\n<text x=\"627\" y=\"38\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--c4)\">Portugal</text>\n<text x=\"627\" y=\"62\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--encre)\">1580-1640</text>\n<text x=\"627\" y=\"92\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">unido por Felipe II,</text>\n<text x=\"627\" y=\"110\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">perdido en 1640</text>\n<line x1=\"627\" y1=\"132\" x2=\"627\" y2=\"154\" stroke=\"var(--encre2)\" stroke-width=\"1.5\" marker-end=\"url(#fl-np)\" stroke-dasharray=\"4 3\"/>\n<rect x=\"8\" y=\"160\" width=\"704\" height=\"54\" rx=\"12\" fill=\"color-mix(in srgb,var(--c2) 12%,transparent)\" stroke=\"var(--c2)\" stroke-width=\"1.5\"/>\n<text x=\"360\" y=\"183\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--encre)\">Un mismo rey, pero cada reino conserva sus leyes, sus Cortes y su moneda</text>\n<text x=\"360\" y=\"203\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">1479-1707: la «Monarquía Hispánica»</text>\n<line x1=\"360\" y1=\"216\" x2=\"360\" y2=\"234\" stroke=\"var(--encre2)\" stroke-width=\"1.5\" marker-end=\"url(#fl-np)\"/>\n<rect x=\"8\" y=\"240\" width=\"704\" height=\"54\" rx=\"12\" fill=\"var(--c1)\"/>\n<text x=\"360\" y=\"263\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#fff\">1707-1716: decretos de Nueva Planta, leyes de Castilla impuestas a la Corona de Aragón</text>\n<text x=\"360\" y=\"283\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#fff\" opacity=\".9\">Las provincias vascas y Navarra conservan sus fueros</text>\n</g></svg>"
            },
            legende: {
              fr: "Le Portugal n'est uni à l'Espagne que de 1580 à 1640. Les décrets de Nueva Planta frappent l'Aragon et Valence (1707), Majorque (1715) et la Catalogne (1716).",
              es: "Portugal solo está unido a España de 1580 a 1640. Los decretos de Nueva Planta afectan a Aragón y Valencia (1707), Mallorca (1715) y Cataluña (1716)." } },
          { t: "encadre", c: "var(--a4)",
            titre: { fr: "Notion clé : les décrets de Nueva Planta", es: "Concepto clave: los decretos de Nueva Planta" },
            c2: {
              fr: "Entre 1707 et 1716, Philippe V abolit les <em>fueros</em> (lois et institutions propres) des royaumes de la couronne d'Aragon, qui avaient soutenu son rival, et y impose les lois de Castille. Cette centralisation à la française épargne les provinces basques et la Navarre, restées fidèles. Elle est encore invoquée aujourd'hui dans les débats sur le nationalisme catalan.",

          { t: "p", c: {
            fr: "En 1808, <strong>Napoléon</strong> force Charles IV et Ferdinand VII à abdiquer et donne la couronne à son frère Joseph Bonaparte. Le soulèvement de Madrid, le 2 mai, réprimé dans le sang et peint par Goya, ouvre la <strong>guerre d'indépendance</strong> (1808-1814) : une guérilla acharnée, soutenue par l'armée britannique de Wellington. Assiégés à Cadix, les libéraux réunis en Cortes adoptent le 19 mars 1812 la première <strong>Constitution</strong> du pays, « La Pepa », qui proclame la souveraineté nationale. Ferdinand VII l'abolit dès son retour en 1814 et rétablit l'absolutisme.",
            es: "En 1808, <strong>Napoleón</strong> obliga a Carlos IV y a Fernando VII a abdicar y entrega la corona a su hermano José Bonaparte. El levantamiento de Madrid, el 2 de mayo, reprimido a sangre y fuego y pintado por Goya, abre la <strong>guerra de la Independencia</strong> (1808-1814): una guerrilla encarnizada, apoyada por el ejército británico de Wellington. Sitiados en Cádiz, los liberales reunidos en Cortes aprueban el 19 de marzo de 1812 la primera <strong>Constitución</strong> del país, «La Pepa», que proclama la soberanía nacional. Fernando VII la deroga nada más volver en 1814 y restablece el absolutismo." } },
          { t: "p", c: {
            fr: "Le siècle qui suit est marqué par une instabilité chronique. Profitant de la crise, les colonies continentales d'Amérique conquièrent leur indépendance entre 1810 et 1825 (Ayacucho, 1824). Trois <strong>guerres carlistes</strong> (1833-1840, 1846-1849, 1872-1876) opposent les partisans traditionalistes de don Carlos aux libéraux qui soutiennent sa nièce Isabelle II. Pronunciamientos militaires et révolutions se succèdent : la révolution de 1868 chasse Isabelle II, une brève <em>Première République</em> (1873-1874) échoue, puis la <strong>Restauration</strong> de 1874 ramène les Bourbons avec Alphonse XII. Son architecte, Cánovas del Castillo, organise l'alternance pacifique (<em>turno</em>) entre conservateurs et libéraux.",
            es: "El siglo siguiente está marcado por una inestabilidad crónica. Aprovechando la crisis, las colonias continentales de América conquistan su independencia entre 1810 y 1825 (Ayacucho, 1824). Tres <strong>guerras carlistas</strong> (1833-1840, 1846-1849, 1872-1876) enfrentan a los partidarios tradicionalistas de don Carlos con los liberales que apoyan a su sobrina Isabel II. Pronunciamientos militares y revoluciones se suceden: la revolución de 1868 expulsa a Isabel II, una breve <em>Primera República</em> (1873-1874) fracasa y la <strong>Restauración</strong> de 1874 devuelve a los Borbones con Alfonso XII. Su artífice, Cánovas del Castillo, organiza la alternancia pacífica (<em>turno</em>) entre conservadores y liberales." } }

        blocs: [
          { t: "p", c: {
            fr: "En 1898, la guerre contre les États-Unis, entrés dans le conflit cubain après l'explosion du cuirassé <em>Maine</em> à La Havane, tourne au désastre : les flottes espagnoles sont détruites à Cavite et à Santiago de Cuba, et le traité de Paris (10 décembre 1898) fait perdre à l'Espagne <strong>Cuba</strong>, <strong>Porto Rico</strong> et les <strong>Philippines</strong>, ses dernières grandes colonies. Ce « <strong>Désastre</strong> » provoque un traumatisme intellectuel profond. La <em>génération de 98</em> (Unamuno, Machado, Azorín, Baroja) s'interroge sur le retard et l'« âme » de l'Espagne, tandis que le <em>régénérationnisme</em> de Joaquín Costa réclame « l'école et le garde-manger ».",
            es: "En 1898, la guerra contra Estados Unidos, que entra en el conflicto cubano tras la explosión del acorazado <em>Maine</em> en La Habana, se convierte en un desastre: las flotas españolas son destruidas en Cavite y en Santiago de Cuba, y el tratado de París (10 de diciembre de 1898) hace perder a España <strong>Cuba</strong>, <strong>Puerto Rico</strong> y <strong>Filipinas</strong>, sus últimas grandes colonias. Este «<strong>Desastre</strong>» provoca un profundo trauma intelectual. La <em>generación del 98</em> (Unamuno, Machado, Azorín, Baroja) se interroga sobre el atraso y el «alma» de España, mientras el <em>regeneracionismo</em> de Joaquín Costa reclama «escuela y despensa»." } },
          { t: "p", c: {

            es: "El régimen de la Restauración, basado en una alternancia pactada y en un fraude electoral organizado por los notables locales (el <em>caciquismo</em>), no logra responder a las tensiones: auge del movimiento obrero y del anarquismo, Semana Trágica de Barcelona (1909), auge del catalanismo, guerra colonial en Marruecos y desastre de Annual (1921). El 13 de septiembre de 1923, el general <strong>Primo de Rivera</strong> toma el poder con el acuerdo del rey Alfonso XIII e instaura una dictadura, que desacredita con ella a la monarquía." } },

      {
        titre: { fr: "La Seconde République et la Guerre civile (1931-1939)", es: "La Segunda República y la Guerra Civil (1931-1939)" },
        blocs: [
          { t: "p", c: {
            fr: "Après la chute de Primo de Rivera (1930), les républicains l'emportent dans les grandes villes aux élections municipales du 12 avril 1931. Alphonse XIII quitte le pays et la <strong>Seconde République</strong> est proclamée le 14 avril dans l'enthousiasme. Sa Constitution définit l'Espagne comme « une République démocratique de travailleurs de toute classe ». Le nouveau régime engage des réformes ambitieuses : séparation de l'Église et de l'État, réforme agraire, réforme de l'armée, statut d'autonomie de la Catalogne (1932) et droit de vote des femmes, défendu par Clara Campoamor, reconnu en 1931 et exercé pour la première fois en 1933. Mais il se heurte à la polarisation entre une gauche révolutionnaire et une droite catholique et monarchiste.",
            es: "Tras la caída de Primo de Rivera (1930), los republicanos ganan en las grandes ciudades en las elecciones municipales del 12 de abril de 1931. Alfonso XIII abandona el país y la <strong>Segunda República</strong> se proclama el 14 de abril entre el entusiasmo popular. Su Constitución define España como «una República democrática de trabajadores de toda clase». El nuevo régimen emprende reformas ambiciosas: separación de la Iglesia y el Estado, reforma agraria, reforma del ejército, estatuto de autonomía de Cataluña (1932) y voto femenino, defendido por Clara Campoamor, reconocido en 1931 y ejercido por primera vez en 1933. Pero choca con la polarización entre una izquierda revolucionaria y una derecha católica y monárquica." } },
          { t: "p", c: {
            fr: "La victoire du <strong>Front populaire</strong> aux élections de février 1936 précipite la crise : les 17 et 18 juillet 1936, une partie de l'armée se soulève contre la République, sous la direction, dès octobre, du général <strong>Francisco Franco</strong>. Le pays bascule dans une <strong>guerre civile</strong> de près de trois ans, internationalisée : l'Allemagne nazie (qui bombarde Guernica le 26 avril 1937) et l'Italie fasciste aident les nationalistes, l'URSS et les Brigades internationales les républicains, tandis que la France et le Royaume-Uni choisissent la non-intervention. Franco proclame la victoire le 1er avril 1939. La guerre fait environ 500 000 morts selon l'historien Paul Preston, dont près de 200 000 personnes tuées loin du front, et pousse près d'un demi-million de réfugiés vers la France lors de la <em>Retirada</em>.",
            es: "La victoria del <strong>Frente Popular</strong> en las elecciones de febrero de 1936 precipita la crisis: el 17 y el 18 de julio de 1936, una parte del ejército se subleva contra la República, bajo la dirección, desde octubre, del general <strong>Francisco Franco</strong>. El país se hunde en una <strong>guerra civil</strong> de casi tres años, internacionalizada: la Alemania nazi (que bombardea Guernica el 26 de abril de 1937) y la Italia fascista ayudan a los sublevados, la URSS y las Brigadas Internacionales a los republicanos, mientras Francia y el Reino Unido optan por la no intervención. Franco proclama la victoria el 1 de abril de 1939. La guerra causa unos 500 000 muertos según el historiador Paul Preston, de ellos cerca de 200 000 personas asesinadas lejos del frente, y empuja a casi medio millón de refugiados hacia Francia durante la <em>Retirada</em>." } },

          { t: "p", c: {
            fr: "La <strong>dictature franquiste</strong> (1939-1975) s'appuie sur l'armée, l'Église et un parti unique, et pratique une répression massive. Isolé après 1945, le régime est réintégré dans le bloc occidental par la guerre froide (accords avec les États-Unis et Concordat en 1953, ONU en 1955), puis connaît le « miracle économique » des années 1960. Franco désigne en 1969 <strong>Juan Carlos de Bourbon</strong> comme successeur. À sa mort, le 20 novembre 1975, le roi pilote avec Adolfo Suárez une <strong>Transition</strong> négociée : loi pour la réforme politique (1976), premières élections libres le 15 juin 1977, puis <strong>Constitution</strong> approuvée par référendum le 6 décembre 1978 avec 87,8 % de « oui ». La démocratie résiste au coup d'État manqué du 23 février 1981, et l'Espagne entre dans la Communauté européenne le 1er janvier 1986.",
            es: "La <strong>dictadura franquista</strong> (1939-1975) se apoya en el ejército, la Iglesia y un partido único, y practica una represión masiva. Aislado tras 1945, el régimen es reintegrado en el bloque occidental por la guerra fría (acuerdos con Estados Unidos y Concordato en 1953, ONU en 1955) y vive después el «milagro económico» de los años sesenta. Franco designa en 1969 a <strong>Juan Carlos de Borbón</strong> como sucesor. A su muerte, el 20 de noviembre de 1975, el rey pilota con Adolfo Suárez una <strong>Transición</strong> pactada: ley para la reforma política (1976), primeras elecciones libres el 15 de junio de 1977 y <strong>Constitución</strong> aprobada en referéndum el 6 de diciembre de 1978 con un 87,8 % de «sí». La democracia resiste al golpe de Estado fallido del 23 de febrero de 1981, y España entra en la Comunidad Europea el 1 de enero de 1986." } },
          { t: "p", c: {
            fr: "Ce passé reste vif. La loi de mémoire démocratique de 2022 a prolongé l'exhumation de Franco de 2019 hors du Valle de los Caídos, rebaptisé Cuelgamuros, et le cinquantenaire de sa mort, en 2025, a divisé la classe politique. La mémoire de l'empire revient aussi : le 31 octobre 2025, le ministre des Affaires étrangères José Manuel Albares reconnaît « la douleur et l'injustice » subies par les peuples autochtones du Mexique, et en mars 2026 Felipe VI admet qu'il y eut « beaucoup d'abus » pendant la conquête. Le 17 février 2026, enfin, les Cortes ont célébré la Constitution de 1978, devenue la plus durable de l'histoire du pays, comme le montre le tableau suivant.",
            es: "Ese pasado sigue vivo. La ley de memoria democrática de 2022 prolongó la exhumación de Franco en 2019 fuera del Valle de los Caídos, rebautizado Cuelgamuros, y el cincuentenario de su muerte, en 2025, dividió a la clase política. También vuelve la memoria del imperio: el 31 de octubre de 2025, el ministro de Asuntos Exteriores José Manuel Albares reconoce «el dolor y la injusticia» sufridos por los pueblos originarios de México, y en marzo de 2026 Felipe VI admite que hubo «mucho abuso» durante la conquista. El 17 de febrero de 2026, por último, las Cortes celebraron la Constitución de 1978, convertida en la más longeva de la historia del país, como muestra la tabla siguiente." } },
