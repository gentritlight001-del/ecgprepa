ont-weight=\"400\" fill=\"var(--encre)\">tournés vers les visiteurs</text>\n</g></svg>", es: "<svg viewBox=\"0 0 460 376\" role=\"img\" aria-label=\"Esquema en cinco etapas: una vivienda alquilada por noches, menos viviendas para los residentes, subida de alquileres, vecinos empujados hacia la periferia, barrio orientado al visitante.\">\n<g font-family=\"var(--texte)\">\n<rect x=\"20\" y=\"8\" width=\"420\" height=\"56\" rx=\"10\" fill=\"#fff\" stroke=\"var(--c1)\" stroke-width=\"2.2\"/><rect x=\"20\" y=\"8\" width=\"96\" height=\"56\" rx=\"10\" fill=\"var(--c1)\"/><rect x=\"104\" y=\"8\" width=\"12\" height=\"56\" fill=\"var(--c1)\"/>\n<text x=\"68.0\" y=\"41.0\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"800\" fill=\"#fff\">Vivienda</text>\n<text x=\"130\" y=\"32.0\" font-size=\"14\" font-weight=\"700\" fill=\"var(--encre)\">Alquilada por noches</text>\n<text x=\"130\" y=\"50.0\" font-size=\"14\" font-weight=\"400\" fill=\"var(--encre)\">en vez de por años</text>\n<line x1=\"230\" y1=\"66\" x2=\"230\" y2=\"77\" stroke=\"var(--encre2)\" stroke-width=\"2.2\"/><path d=\"M224 73 L230 82 L236 73 Z\" fill=\"var(--encre2)\"/>\n<rect x=\"20\" y=\"84\" width=\"420\" height=\"56\" rx=\"10\" fill=\"#fff\" stroke=\"var(--c2)\" stroke-width=\"2.2\"/><rect x=\"20\" y=\"84\" width=\"96\" height=\"56\" rx=\"10\" fill=\"var(--c2)\"/><rect x=\"104\" y=\"84\" width=\"12\" height=\"56\" fill=\"var(--c2)\"/>\n<text x=\"68.0\" y=\"117.0\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"800\" fill=\"#fff\">Oferta</text>\n<text x=\"130\" y=\"108.0\" font-size=\"14\" font-weight=\"700\" fill=\"var(--encre)\">Menos viviendas</text>\n<text x=\"130\" y=\"126.0\" font-size=\"14\" font-weight=\"400\" fill=\"var(--encre)\">para los residentes</text>\n<line x1=\"230\" y1=\"142\" x2=\"230\" y2=\"153\" stroke=\"var(--encre2)\" stroke-width=\"2.2\"/><path d=\"M224 149 L230 158 L236 149 Z\" fill=\"var(--encre2)\"/>\n<rect x=\"20\" y=\"160\" width=\"420\" height=\"56\" rx=\"10\" fill=\"#fff\" stroke=\"var(--c4)\" stroke-width=\"2.2\"/><rect x=\"20\" y=\"160\" width=\"96\" height=\"56\" rx=\"10\" fill=\"var(--c4)\"/><rect x=\"104\" y=\"160\" width=\"12\" height=\"56\" fill=\"var(--c4)\"/>\n<text x=\"68.0\" y=\"193.0\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"800\" fill=\"#fff\">Alquileres</text>\n<text x=\"130\" y=\"184.0\" font-size=\"14\" font-weight=\"700\" fill=\"var(--encre)\">Suben los alquileres</text>\n<text x=\"130\" y=\"202.0\" font-size=\"14\" font-weight=\"400\" fill=\"var(--encre)\">y los precios del barrio</text>\n<line x1=\"230\" y1=\"218\" x2=\"230\" y2=\"229\" stroke=\"var(--encre2)\" stroke-width=\"2.2\"/><path d=\"M224 225 L230 234 L236 225 Z\" fill=\"var(--encre2)\"/>\n<rect x=\"20\" y=\"236\" width=\"420\" height=\"56\" rx=\"10\" fill=\"#fff\" stroke=\"var(--c3)\" stroke-width=\"2.2\"/><rect x=\"20\" y=\"236\" width=\"96\" height=\"56\" rx=\"10\" fill=\"var(--c3)\"/><rect x=\"104\" y=\"236\" width=\"12\" height=\"56\" fill=\"var(--c3)\"/>\n<text x=\"68.0\" y=\"269.0\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"800\" fill=\"#fff\">Vecinos</text>\n<text x=\"130\" y=\"260.0\" font-size=\"14\" font-weight=\"700\" fill=\"var(--encre)\">Empujados hacia</text>\n<text x=\"130\" y=\"278.0\" font-size=\"14\" font-weight=\"400\" fill=\"var(--encre)\">la periferia</text>\n<line x1=\"230\" y1=\"294\" x2=\"230\" y2=\"305\" stroke=\"var(--encre2)\" stroke-width=\"2.2\"/><path d=\"M224 301 L230 310 L236 301 Z\" fill=\"var(--encre2)\"/>\n<rect x=\"20\" y=\"312\" width=\"420\" height=\"56\" rx=\"10\" fill=\"#fff\" stroke=\"var(--c1)\" stroke-width=\"2.2\"/><rect x=\"20\" y=\"312\" width=\"96\" height=\"56\" rx=\"10\" fill=\"var(--c1)\"/><rect x=\"104\" y=\"312\" width=\"12\" height=\"56\" fill=\"var(--c1)\"/>\n<text x=\"68.0\" y=\"345.0\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"800\" fill=\"#fff\">Barrio</text>\n<text x=\"130\" y=\"336.0\" font-size=\"14\" font-weight=\"700\" fill=\"var(--encre)\">Comercios y servicios</text>\n<text x=\"130\" y=\"354.0\" font-size=\"14\" font-weight=\"400\" fill=\"var(--encre)\">orientados al visitante</text>\n</g></svg>" },
            legende: { fr: "Schéma simplifié du mécanisme décrit par les chercheurs. Les loyers dépendent aussi d'autres facteurs, comme le nombre de logements construits et la demande des résidents.", es: "Esquema simplificado del mecanismo descrito por los investigadores. Los alquileres dependen también de otros factores, como el número de viviendas construidas y la demanda de los residentes." } },
          { t: "encadre", c: "var(--a4)",
            titre: { fr: "La touristification", es: "La turistificación" },
            c2: {
              fr: "Processus par lequel un quartier est réorganisé autour de la consommation touristique : commerces de proximité remplacés par des boutiques de souvenirs, logements convertis en locations de courte durée, hausse des loyers et des prix. Le phénomène existe à Venise, Lisbonne ou Amsterdam, mais l'ampleur du parc de logements touristiques et la concentration des flux le rendent très aigu en Espagne.",
              es: "Proceso por el cual un barrio se reorganiza en torno al consumo turístico: comercios de proximidad sustituidos por tiendas de recuerdos, viviendas convertidas en alquileres de corta duración, subida de alquileres y de precios. El fenómeno existe en Venecia, Lisboa o Ámsterdam, pero la magnitud del parque de viviendas turísticas y la concentración de los flujos lo hacen muy agudo en España."
            } }
        ]
      },
      {
        titre: { fr: "De la pandémie au rebond record", es: "De la pandemia al rebote récord" },
        blocs: [
          { t: "p", c: {
            fr: "En 2020, la pandémie fait tomber le tourisme à <strong>18,9 millions</strong> de visiteurs, contre plus de 80 millions en 2019 : une parenthèse dévastatrice pour le secteur, mais un répit pour les habitants des centres saturés, qui redécouvrent des rues désertées par les visiteurs. Ce répit est bref : dès 2022, la croissance repart, jusqu'à <strong>93,8 millions</strong> de touristes en 2024 et un nouveau record de <strong>96,8 millions</strong> en 2025, avec 134,7 milliards d'euros dépensés (+ 6,8 %).",
            es: "En 2020, la pandemia hace caer el turismo a <strong>18,9 millones</strong> de visitantes, frente a más de 80 millones en 2019: un paréntesis devastador para el sector, pero un respiro para los habitantes de los centros saturados, que redescubren calles vacías de visitantes. Este respiro es breve: desde 2022, el crecimiento se reanuda, hasta <strong>93,8 millones</strong> de turistas en 2024 y un nuevo récord de <strong>96,8 millones</strong> en 2025, con 134 700 millones de euros gastados (+ 6,8 %)." } },
          { t: "p", c: {
            fr: "La tendance se poursuit en 2026 : l'INE compte plus de 80,5 millions de touristes internationaux sur les neuf premiers mois, soit 5,2 % de plus qu'un an plus tôt. Selon l'ONU Tourisme, l'Espagne est le deuxième pays le plus visité au monde, derrière la France. Ce rebond, joint à une pénurie de logements déjà installée, prépare la crise sociale des années 2024-2026.",
            es: "La tendencia continúa en 2026: el INE cuenta más de 80,5 millones de turistas internacionales en los nueve primeros meses, un 5,2 % más que un año antes. Según ONU Turismo, España es el segundo país más visitado del mundo, detrás de Francia. Este rebote, unido a una escasez de vivienda ya instalada, prepara la crisis social de los años 2024-2026." } }
        ]
      },
      {
        titre: { fr: "La loi du logement de 2023", es: "La ley de vivienda de 2023" },
        blocs: [
          { t: "p", c: {
            fr: "La <em>Ley por el Derecho a la Vivienda</em> (loi 12/2023, du 24 mai 2023) est la première loi nationale du logement de l'Espagne démocratique, un domaine jusque-là laissé aux communautés autonomes (voir le <a href=\"civi-esp-6.html\">chapitre 6</a>). Elle crée les « zones de marché résidentiel tendu » (<em>zonas tensionadas</em>), que les communautés peuvent déclarer pour y plafonner la hausse des loyers, et abaisse de dix à cinq logements le seuil du « grand bailleur » (<em>gran tenedor</em>).",
            es: "La <em>Ley por el Derecho a la Vivienda</em> (ley 12/2023, de 24 de mayo de 2023) es la primera ley nacional de vivienda de la España democrática, un ámbito dejado hasta entonces a las comunidades autónomas (ver el <a href=\"civi-esp-6.html\">capítulo 6</a>). Crea las «zonas de mercado residencial tensionado», que las comunidades pueden declarar para limitar el alza de los alquileres, y baja de diez a cinco viviendas el umbral del «gran tenedor»." } },
          { t: "p", c: {
            fr: "Son application est inégale : la déclaration de zone tendue reste volontaire. La Catalogne l'active pour Barcelone et sa région, tandis que les Baléares, gouvernées par la droite, refusent d'y recourir. Le bilan est disputé, comme le montre le tableau.",
            es: "Su aplicación es desigual: la declaración de zona tensionada sigue siendo voluntaria. Cataluña la activa para Barcelona y su región, mientras que las Baleares, gobernadas por la derecha, se niegan a recurrir a ella. El balance es discutido, como muestra la tabla." } },
          { t: "tableau",
            head: { fr: ["Indicateur", "Chiffre", "Source"], es: ["Indicador", "Cifra", "Fuente"] },
            rows: {

                ["Zones tendues de Catalogne depuis 2024", "+ 0,7 % de loyers, contre + 11 % hors zones tendues", "Presse, d'après les données publiques"],

                ["Zonas tensionadas de Cataluña desde 2024", "+ 0,7 % de alquileres, frente a + 11 % fuera de las zonas tensionadas", "Prensa, según datos públicos"],
                ["Tres años de ley", "Alquileres + 31 %, oferta de larga duración − 30 % (cifras discutidas)", "Idealista"]
              ]
            } },
          { t: "def", mot: { fr: "Gran tenedor", es: "Gran tenedor" }, c: {
            fr: "« Grand bailleur » : propriétaire qui possède plus de dix logements (cinq en zone tendue). Il est soumis à des règles plus strictes de plafonnement des loyers.",
            es: "Propietario que posee más de diez viviendas (cinco en zona tensionada). Está sometido a reglas más estrictas de limitación de los alquileres." } }

  {
    num: "III",
    kicker: { fr: "Le temps présent", es: "El tiempo presente" },
    titre: { fr: "La révolte contre le surtourisme et le logement (2024-2026)", es: "La revuelta contra el sobreturismo y por la vivienda (2024-2026)" },
    couleur: "var(--a3)",
    sections: [
      {
        titre: { fr: "2024-2026 : la vague de protestation", es: "2024-2026: la ola de protesta" },
        blocs: [
          { t: "image", src: "images/tourisme-tourist-go-home.webp", l: 1280, h: 853, format: "gauche",
            titre: {"fr": "« Tourist go home »", "es": "«Tourist go home»"},
            legende: {"fr": "Barcelone, novembre 2019 : le graffiti « Tourist go home » sur un mur blanchi, au bord d'un escalier planté d'arbres.", "es": "Barcelona, noviembre de 2019: la pintada «Tourist go home» en un muro encalado, junto a una escalera con árboles."},
            alt: {"fr": "Un graffiti noir « Tourist go home » avec un symbole d'anarchie sur un mur de pierre blanchi, sous des arbres", "es": "Una pintada negra «Tourist go home» con un símbolo anarquista en un muro de piedra encalado, bajo unos árboles"} },
          { t: "p", c: {
            fr: "Le 20 avril 2024, des dizaines de milliers de personnes manifestent dans plusieurs villes des <strong>Canaries</strong>, contre un modèle touristique jugé insoutenable pour l'environnement et la population. Le 26 mai 2024, environ 10 000 personnes défilent à Palma, aux <strong>Baléares</strong>, au cri de « <em>Menys turisme, més vida</em> » (moins de tourisme, plus de vie). Le 6 juillet 2024 à <strong>Barcelone</strong>, des militants aspergent des touristes en terrasse avec des pistolets à eau : l'image fait le tour du monde.",
            es: "El 20 de abril de 2024, decenas de miles de personas se manifiestan en varias ciudades de <strong>Canarias</strong>, contra un modelo turístico considerado insostenible para el medio ambiente y la población. El 26 de mayo de 2024, unas 10 000 personas desfilan en Palma, en las <strong>Baleares</strong>, al grito de «<em>Menys turisme, més vida</em>». El 6 de julio de 2024 en <strong>Barcelona</strong>, unos activistas rocían con pistolas de agua a turistas en una terraza: la imagen da la vuelta al mundo." } },
          { t: "p", c: {
            fr: "Le mouvement se coordonne ensuite à l'échelle de l'Europe du Sud : le 15 juin 2025, des manifestations ont lieu en Espagne, au Portugal et en Italie sous le slogan « <em>Your holidays, my misery</em> » (vos vacances, ma misère). Le 26 juillet 2026, des dizaines de milliers de personnes défilent encore à Palma. Les organisateurs disent ne pas rejeter le visiteur, mais un modèle de croissance sans limite ; et la presse note que le logement devient le premier motif de colère, devant le simple nombre de touristes.",
            es: "El movimiento se coordina después a escala del sur de Europa: el 15 de junio de 2025, hay manifestaciones en España, Portugal e Italia bajo el lema «<em>Your holidays, my misery</em>» (vuestras vacaciones, mi miseria). El 26 de julio de 2026, decenas de miles de personas desfilan de nuevo en Palma. Los organizadores dicen no rechazar al visitante, sino un modelo de crecimiento sin límite; y la prensa señala que la vivienda se convierte en el primer motivo de enfado, por delante del simple número de turistas." } },
          { t: "encadre", c: "var(--a3)",
            titre: { fr: "Le modèle visé, pas le visiteur", es: "El modelo señalado, no el visitante" },
            c2: {
              fr: "Il ne faut pas réduire ces mobilisations à l'hostilité envers les touristes (la <em>turismofobia</em>, terme contesté). Les organisateurs distinguent le visiteur et le modèle qui organise sa venue : plateformes non régulées, croissance illimitée des vols et des croisières, bénéfices qui ne reviennent pas au logement abordable. Les revendications sont économiques et urbaines plus que xénophobes.",
              es: "No hay que reducir estas movilizaciones a la hostilidad hacia los turistas (la <em>turismofobia</em>, término discutido). Los organizadores distinguen al visitante del modelo que organiza su llegada: plataformas sin regular, crecimiento ilimitado de vuelos y cruceros, beneficios que no revierten en vivienda asequible. Las reivindicaciones son económicas y urbanas más que xenófobas."
            } }
        ]
      },
      {
        titre: { fr: "Les réponses : Barcelone, l'État et les régions", es: "Las respuestas: Barcelona, el Estado y las regiones" },
        blocs: [
          { t: "p", c: {
            fr: "Barcelone va le plus loin : en juin 2024, le maire socialiste Jaume Collboni annonce que la ville ne délivrera plus de licences de logement touristique et laissera s'éteindre les licences existantes en <strong>novembre 2028</strong>, soit environ 10 000 logements. Le Tribunal constitutionnel a validé le décret-loi catalan qui encadre ces licences. À Saint-Sébastien, les groupes de touristes guidés sont limités à 25 personnes, et les Baléares ont renforcé les amendes pour comportements incivils.",
            es: "Barcelona es la que va más lejos: en junio de 2024, el alcalde socialista Jaume Collboni anuncia que la ciudad no concederá más licencias de vivienda turística y dejará extinguirse las existentes en <strong>noviembre de 2028</strong>, unas 10 000 viviendas. El Tribunal Constitucional ha validado el decreto-ley catalán que regula estas licencias. En San Sebastián, los grupos de turistas guiados se limitan a 25 personas, y las Baleares han reforzado las multas por comportamientos incívicos." } },
          { t: "p", c: {
            fr: "L'État, lui, voit sa tentative d'harmonisation limitée par la justice : le Tribunal suprême annule le 19 mai 2026 le registre unique national des locations de courte durée, créé par le décret royal 1312/2024, car l'État a excédé ses compétences, et rend aux communautés autonomes la régulation de ces locations. La carte du logement touristique reste donc un patchwork régional.",
            es: "El Estado, por su parte, ve su intento de armonización limitado por la justicia: el Tribunal Supremo anula el 19 de mayo de 2026 el registro único nacional de alquileres de corta duración, creado por el real decreto 1312/2024, porque el Estado excedió sus competencias, y devuelve a las comunidades autónomas la regulación de estos alquileres. El mapa de la vivienda turística sigue siendo, pues, un mosaico regional." } }
        ]
      },
      {
        titre: { fr: "Le logement au cœur de la campagne", es: "La vivienda en el centro de la campaña" },
        blocs: [
          { t: "p", c: {
            fr: "À l'approche des élections du 29 novembre 2026, le logement devient l'enjeu central. Le 11 novembre, <a href=\"../../../../actualites/es/articles/espagne-greve-generale-logement-11n-2026.html\">la première grève générale soutenue par CCOO et UGT depuis 2012</a> porte sur le logement, les salaires et les prix. Un mois plus tôt, <a href=\"../../../../actualites/es/articles/espagne-mort-maricarmen-symbole.html\">la mort de Maricarmen, 87 ans, expulsée le 23 septembre</a>, est devenue le symbole de la crise. Et les actifs de la bulle de 2008 servent désormais le logement public : une partie du parc de la SAREB passe à l'entreprise publique Casa 47 (voir le <a href=\"civi-esp-16.html\">chapitre 16</a>).",
            es: "A medida que se acercan las elecciones del 29 de noviembre de 2026, la vivienda se convierte en el asunto central. El 11 de noviembre, <a href=\"../../../../actualites/es/articles/espagne-greve-generale-logement-11n-2026.html\">la primera huelga general apoyada por CCOO y UGT desde 2012</a> gira en torno a la vivienda, los salarios y los precios. Un mes antes, <a href=\"../../../../actualites/es/articles/espagne-mort-maricarmen-symbole.html\">la muerte de Maricarmen, de 87 años, desahuciada el 23 de septiembre</a>, se ha convertido en el símbolo de la crisis. Y los activos de la burbuja de 2008 sirven ahora a la vivienda pública: parte del parque de la SAREB pasa a la empresa pública Casa 47 (ver el <a href=\"civi-esp-16.html\">capítulo 16</a>)." } },
          { t: "p", c: {
            fr: "Cette séquence illustre une tension difficile à résoudre : le tourisme reste un pilier économique, créateur d'emplois et de devises dans un pays marqué par la crise de 2008, mais sa croissance continue entre en collision avec le droit au logement d'habitants fragilisés par la hausse des loyers (voir le <a href=\"civi-esp-15.html\">chapitre 15</a> pour les jeunes). L'horizon 2028 de Barcelone est le test européen le plus ambitieux d'un rééquilibrage entre attractivité touristique et vie urbaine.",
