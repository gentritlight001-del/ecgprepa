          { t: "encadre", c: "var(--a2)",
            titre: { fr: "Violencia de género ou violencia doméstica ?", es: "¿Violencia de género o violencia doméstica?" },
            c2: {
              fr: "La loi de 2004 distingue la <strong>violencia de género</strong>, exercée par un homme sur sa conjointe ou ex-conjointe, de la <strong>violencia doméstica</strong>, qui couvre toute violence familiale quels que soient le sexe de l'auteur et de la victime. Ses défenseurs y voient la reconnaissance d'un rapport de domination, ses opposants une rupture de l'égalité devant la loi : c'est le point de friction politique le plus vif, vingt ans après.",
              es: "La ley de 2004 distingue la <strong>violencia de género</strong>, ejercida por un hombre sobre su pareja o expareja, de la <strong>violencia doméstica</strong>, que abarca toda violencia familiar sea cual sea el sexo del autor y de la víctima. Sus defensores ven en ella el reconocimiento de una relación de dominación, sus detractores una ruptura de la igualdad ante la ley: es el punto de fricción política más vivo, veinte años después."
            } }

    titre: { fr: "De La Manada au 8M : un mouvement de masse (2016-2019)", es: "De La Manada al 8M: un movimiento de masas (2016-2019)" },

    sections: [
      {
        titre: { fr: "L'affaire La Manada : d'un jugement à une mobilisation", es: "El caso de La Manada: de una sentencia a una movilización" },
        blocs: [
                    { t: "p", c: {
            fr: "En juillet 2016, pendant les fêtes de la San Fermín à Pampelune, une jeune femme de 18 ans est agressée par cinq hommes qui se faisaient appeler « <em>La Manada</em> » (la meute) et filment les faits. En avril 2018, l'<em>Audiencia</em> de Navarre les condamne à neuf ans de prison non pour <em>agresión sexual</em> (viol), mais pour le délit moindre d'<em>abuso sexual</em>, car il n'y aurait eu ni violence ni intimidation : un juge demande même leur acquittement.",
            es: "En julio de 2016, durante los Sanfermines de Pamplona, una joven de 18 años es agredida por cinco hombres que se hacían llamar «La Manada» y graban los hechos. En abril de 2018, la Audiencia de Navarra los condena a nueve años de prisión no por <em>agresión sexual</em> (violación), sino por el delito menor de <em>abuso sexual</em>, porque no habría habido ni violencia ni intimidación: un magistrado pide incluso su absolución." } },
          { t: "p", c: {
            fr: "Le verdict provoque des manifestations dans tout le pays sous les slogans « <em>Yo sí te creo</em> » et « <em>No es abuso, es violación</em> ». Le droit pénal exigeait en pratique de prouver la résistance de la victime, pas l'absence de consentement. En juin 2019, le Tribunal suprême requalifie les faits en viol et porte les peines à quinze ans de prison : l'affaire a changé la jurisprudence, puis la loi.",
            es: "La sentencia provoca manifestaciones en todo el país bajo los lemas «Yo sí te creo» y «No es abuso, es violación». El derecho penal exigía en la práctica probar la resistencia de la víctima, no la ausencia de consentimiento. En junio de 2019, el Tribunal Supremo recalifica los hechos como violación y eleva las penas a quince años de prisión: el caso cambió la jurisprudencia, y después la ley." } }
        ]
      },
      {
        titre: { fr: "Le 8 mars 2018 : la première grève féministe générale", es: "El 8 de marzo de 2018: la primera huelga feminista general" },
        blocs: [
                    { t: "image", src: "images/feminisme-8m-2018-perruques.webp", l: 1276, h: 851, format: "droite",
            titre: {"fr": "Violet et perruques", "es": "Violeta y pelucas"},
            legende: {"fr": "Madrid, 8 mars 2018 : des manifestantes en perruques roses, violettes et vertes, aux couleurs festives de la grève féministe.", "es": "Madrid, 8 de marzo de 2018: manifestantes con pelucas rosas, moradas y verdes, en los colores festivos de la huelga feminista."},
            alt: {"fr": "Des femmes vues de dos, en perruques roses, violettes et vertes, devant des immeubles du centre de Madrid", "es": "Mujeres vistas de espaldas, con pelucas rosas, moradas y verdes, ante edificios del centro de Madrid"} },
          { t: "p", c: {
            fr: "Le <strong>8 mars 2018</strong>, l'Espagne connaît la première <strong>grève féministe générale</strong> de son histoire. Elle est lancée par la Commission 8M, soutenue par des syndicats et des centaines d'associations, et combine quatre grèves : du travail salarié, de la consommation, des soins et des tâches domestiques (<em>huelga de cuidados</em>), et des études. Les syndicats CCOO et UGT appellent à un arrêt de deux heures, que près de six millions de travailleuses suivent selon eux ; plus de cent manifestations ont lieu dans le pays sous le slogan « <em>Si nosotras paramos, se para el mundo</em> ».",
            es: "El <strong>8 de marzo de 2018</strong>, España vive la primera <strong>huelga feminista general</strong> de su historia. La lanza la Comisión 8M, con el apoyo de sindicatos y cientos de asociaciones, y combina cuatro huelgas: del trabajo asalariado, del consumo, de los cuidados y de las tareas domésticas (<em>huelga de cuidados</em>), y de los estudios. Los sindicatos CCOO y UGT convocan un paro de dos horas que, según ellos, secundan casi seis millones de trabajadoras; se celebran más de cien manifestaciones en el país bajo el lema «Si nosotras paramos, se para el mundo»." } },
          { t: "p", c: {
            fr: "Le succès fait du 8M un rendez-vous politique majeur du calendrier espagnol. Il confirme aussi l'effet du mouvement <strong>#MeToo</strong>, né aux États-Unis en 2017 et que l'Espagne prolonge surtout dans la rue plutôt que sur les seuls réseaux sociaux. Ce que le mouvement réclame, au-delà de l'égalité salariale, c'est de rendre visible le travail invisible assumé par les femmes, et d'inscrire la lutte contre les violences au cœur des politiques publiques.",
            es: "El éxito convierte el 8M en una cita política mayor del calendario español. Confirma también el efecto del movimiento <strong>#MeToo</strong>, nacido en Estados Unidos en 2017 y que España prolonga sobre todo en la calle más que solo en las redes sociales. Lo que el movimiento reclama, más allá de la igualdad salarial, es hacer visible el trabajo invisible asumido por las mujeres e inscribir la lucha contra las violencias en el centro de las políticas públicas." } },
          { t: "citation",
            c: { fr: "Si nosotras paramos, se para el mundo. (Si nous nous arrêtons, le monde s'arrête.)", es: "Si nosotras paramos, se para el mundo." },
            src: { fr: "Slogan de la grève féministe du 8 mars 2018", es: "Lema de la huelga feminista del 8 de marzo de 2018" } }
        ]
      }
    ]
  },

          { t: "p", c: {
            fr: "Entrée en vigueur en octobre 2022 à l'initiative de la ministre de l'Égalité Irene Montero (Podemos), la <strong>loi organique 10/2022</strong> tire les leçons de La Manada. Elle fusionne <em>abuso</em> et <em>agresión</em> en un seul délit d'agression sexuelle, fondé sur l'absence de consentement explicite : seul un accord librement exprimé vaut consentement, sans qu'il faille prouver la résistance de la victime. Le schéma suivant montre pourquoi une avancée conceptuelle a produit un scandale.",
            es: "Entrada en vigor en octubre de 2022 por iniciativa de la ministra de Igualdad Irene Montero (Podemos), la <strong>ley orgánica 10/2022</strong> extrae las lecciones de La Manada. Fusiona <em>abuso</em> y <em>agresión</em> en un solo delito de agresión sexual, basado en la ausencia de consentimiento explícito: solo un acuerdo libremente expresado vale como consentimiento, sin que haya que probar la resistencia de la víctima. El esquema siguiente muestra por qué un avance conceptual produjo un escándalo." } },

height=\"56\" rx=\"10\" fill=\"#fff\" stroke=\"var(--c1)\" stroke-width=\"2.2\"/>\n<rect x=\"20\" y=\"236\" width=\"96\" height=\"56\" rx=\"10\" fill=\"var(--c1)\"/>\n<rect x=\"104\" y=\"236\" width=\"12\" height=\"56\" fill=\"var(--c1)\"/>\n<text x=\"68.0\" y=\"261.0\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"800\" fill=\"#fff\">2022-</text>\n<text x=\"68.0\" y=\"278.0\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"800\" fill=\"#fff\">2023</text>\n<text x=\"130\" y=\"260.0\" font-size=\"14\" font-weight=\"700\" fill=\"var(--encre)\">Penas mínimas rebajadas</text>\n<text x=\"130\" y=\"278.0\" font-size=\"14\" font-weight=\"400\" fill=\"var(--encre)\">y 1 127 rebajas (junio de 2023)</text>\n<line x1=\"230\" y1=\"294\" x2=\"230\" y2=\"305\" stroke=\"var(--encre2)\" stroke-width=\"2.2\"/>\n<path d=\"M224 301 L230 310 L236 301 Z\" fill=\"var(--encre2)\"/>\n<rect x=\"20\" y=\"312\" width=\"420\" height=\"56\" rx=\"10\" fill=\"#fff\" stroke=\"var(--c2)\" stroke-width=\"2.2\"/>\n<rect x=\"20\" y=\"312\" width=\"96\" height=\"56\" rx=\"10\" fill=\"var(--c2)\"/>\n<rect x=\"104\" y=\"312\" width=\"12\" height=\"56\" fill=\"var(--c2)\"/>\n<text x=\"68.0\" y=\"337.0\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"800\" fill=\"#fff\">Abril</text>\n<text x=\"68.0\" y=\"354.0\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"800\" fill=\"#fff\">2023</text>\n<text x=\"130\" y=\"336.0\" font-size=\"14\" font-weight=\"700\" fill=\"var(--encre)\">Reforma correctora</text>\n<text x=\"130\" y=\"354.0\" font-size=\"14\" font-weight=\"400\" fill=\"var(--encre)\">penas graduadas, consentimiento intacto</text>\n</g></svg>" },
            legende: { fr: "Schéma simplifié des causes et des effets. La réforme de 2023 maintient le principe du consentement et rétablit des peines graduées.", es: "Esquema simplificado de causas y efectos. La reforma de 2023 mantiene el principio del consentimiento y restablece unas penas graduadas." } },
          { t: "p", c: {
            fr: "En fusionnant les deux délits, la loi abaisse dans certains cas la peine minimale ou maximale. Or une loi pénale plus favorable s'applique aux condamnations déjà prononcées : les détenus demandent la révision de leurs peines. Selon le Conseil général du pouvoir judiciaire (CGPJ), au 1er juin 2023 les tribunaux avaient accordé au moins 1 127 réductions de peine, et 115 condamnés avaient été libérés avant terme. Sous la pression de l'opinion, et malgré les réticences de la ministre, une <strong>réforme correctrice</strong> est adoptée en avril 2023 avec les voix du PSOE et du PP : elle rétablit une graduation des peines, sans toucher au principe du consentement.",
            es: "Al fusionar los dos delitos, la ley rebaja en algunos casos la pena mínima o máxima. Ahora bien, una ley penal más favorable se aplica a las condenas ya dictadas: los presos piden la revisión de sus penas. Según el Consejo General del Poder Judicial (CGPJ), a 1 de junio de 2023 los tribunales habían concedido al menos 1 127 rebajas de pena, y 115 condenados habían salido de prisión antes de tiempo. Bajo la presión de la opinión pública, y pese a las reticencias de la ministra, se aprueba una <strong>reforma correctora</strong> en abril de 2023 con los votos del PSOE y el PP: restablece una graduación de las penas, sin tocar el principio del consentimiento." } },
          { t: "encadre", c: "var(--a4)",
            titre: { fr: "Un effet technique, pas un rejet du consentement", es: "Un efecto técnico, no un rechazo del consentimiento" },
            c2: {
              fr: "Le scandale de 2022-2023 ne remet pas en cause le principe du consentement, défendu par presque tous les partis : il vient d'une échelle des peines mal calibrée, que la réforme corrige. L'épisode laisse pourtant une cicatrice politique durable, utilisée depuis par la droite et l'extrême droite contre le gouvernement et le féminisme institutionnel.",
              es: "El escándalo de 2022-2023 no cuestiona el principio del consentimiento, defendido por casi todos los partidos: viene de una escala de penas mal calibrada, que la reforma corrige. El episodio deja sin embargo una cicatriz política duradera, utilizada desde entonces por la derecha y la extrema derecha contra el gobierno y el feminismo institucional."
            } },
          { t: "p", c: {
            fr: "Le consentement entre aussi dans le débat public bien au-delà des tribunaux : en août 2023, le président de la Fédération espagnole de football, Luis Rubiales, embrasse de force la joueuse Jenni Hermoso sur la bouche lors de la remise des médailles de la Coupe du monde féminine, et les joueuses répondent par un communiqué intitulé « <em>Se acabó</em> » (c'est fini). Il est condamné en février 2025 pour agression sexuelle à une amende de 10 800 euros, confirmée en appel en juin 2025.",
            es: "El consentimiento entra también en el debate público mucho más allá de los tribunales: en agosto de 2023, el presidente de la Federación Española de Fútbol, Luis Rubiales, besa a la fuerza en la boca a la jugadora Jenni Hermoso durante la entrega de medallas del Mundial femenino, y las futbolistas responden con un comunicado titulado «Se acabó». Es condenado en febrero de 2025 por agresión sexual a una multa de 10 800 euros, confirmada en apelación en junio de 2025." } }
        ]
      },
      {
        titre: { fr: "La loi trans et la fracture du féminisme", es: "La ley trans y la fractura del feminismo" },
        blocs: [
                    { t: "p", c: {
            fr: "Adoptée en février 2023 et portée aussi par Irene Montero, la <strong>loi trans</strong> (<em>Ley 4/2023</em>) permet de changer la mention du sexe à l'état civil par simple déclaration, sans rapport médical ni traitement hormonal : c'est l'<strong>autodétermination de genre</strong>. Elle s'inscrit dans un mouvement international (Argentine, Portugal, pays nordiques) de dépsychiatrisation des parcours trans.",
            es: "Aprobada en febrero de 2023 e impulsada también por Irene Montero, la <strong>ley trans</strong> (<em>Ley 4/2023</em>) permite cambiar la mención del sexo en el registro civil por simple declaración, sin informe médico ni tratamiento hormonal: es la <strong>autodeterminación de género</strong>. Se inscribe en un movimiento internacional (Argentina, Portugal, países nórdicos) de despatologización de los procesos trans." } },
          { t: "p", c: {
            fr: "Elle fracture le féminisme, et la gauche elle-même. Un courant dit abolitionniste ou critique du genre craint que l'autodétermination fragilise les catégories fondées sur le sexe (statistiques de violence, espaces non mixtes, sport) ; au sein du PSOE, l'ancienne vice-présidente Carmen Calvo exprime des réserves. Les marches du 8M se tiennent depuis 2022 en deux cortèges à Madrid, et celle de 2026 oppose la Commission 8M, « transinclusive » et antifasciste, au Mouvement féministe de Madrid, abolitionniste de la prostitution et hostile à la loi trans : 24 000 et 11 000 personnes selon la Délégation du gouvernement.",
            es: "Fractura el feminismo, y a la propia izquierda. Una corriente llamada abolicionista o crítica con el género teme que la autodeterminación debilite las categorías basadas en el sexo (estadísticas de violencia, espacios no mixtos, deporte); dentro del PSOE, la exvicepresidenta Carmen Calvo expresa reservas. Las marchas del 8M se celebran desde 2022 en dos cortejos en Madrid, y la de 2026 enfrenta a la Comisión 8M, «transinclusiva» y antifascista, con el Movimiento Feminista de Madrid, abolicionista de la prostitución y contrario a la ley trans: 24 000 y 11 000 personas según la Delegación del Gobierno." } },
          { t: "def", mot: { fr: "Autodeterminación de género", es: "Autodeterminación de género" }, c: {
            fr: "Principe selon lequel le changement de la mention du sexe à l'état civil relève d'une déclaration personnelle, sans diagnostic médical ni décision de justice. Il s'oppose aux régimes fondés sur un diagnostic de « dysphorie de genre ».",
            es: "Principio según el cual el cambio de la mención del sexo en el registro civil depende de una declaración personal, sin diagnóstico médico ni decisión judicial. Se opone a los regímenes basados en un diagnóstico de «disforia de género»." } }
        ]
      },
      {
        titre: { fr: "Un cadre renforcé, des failles", es: "Un marco reforzado, unas grietas" },
        blocs: [
                    { t: "image", src: "images/feminisme-25n-barcelone-2018.webp", l: 1279, h: 853, format: "gauche",
            titre: {"fr": "Le 25N à Barcelone", "es": "El 25N en Barcelona"},
            legende: {"fr": "Barcelone, novembre 2018 : lecture du manifeste de la marche du 25 novembre, journée contre les violences faites aux femmes, devant une banderole « Novembre féministe ».", "es": "Barcelona, noviembre de 2018: lectura del manifiesto de la marcha del 25 de noviembre, día contra la violencia hacia las mujeres, ante una pancarta «Noviembre feminista»."},
            alt: {"fr": "Cinq femmes sur une scène couverte, dont l'une lit un texte au micro, devant une banderole violette de la marche", "es": "Cinco mujeres en un escenario cubierto, una de ellas lee un texto al micrófono, ante una pancarta violeta de la marcha"} },
          { t: "p", c: {
            fr: "En février 2025, le Congrès renouvelle le <strong>Pacte d'État contre la violence de genre</strong> : plus de 460 mesures sur cinq ans, qui font entrer dans le droit la violence économique et numérique et la violence vicaire (contre les enfants pour atteindre la mère). Vox est le seul groupe à voter contre. Les chiffres vont dans le bon sens : 47 femmes sont tuées en 2025 par leur partenaire ou ex-partenaire, selon le ministère de l'Égalité, le plus bas de la série commencée en 2003.",
            es: "En febrero de 2025, el Congreso renueva el <strong>Pacto de Estado contra la Violencia de Género</strong>: más de 460 medidas a cinco años, que incorporan al derecho la violencia económica y digital y la violencia vicaria (contra los hijos para herir a la madre). Vox es el único grupo que vota en contra. Las cifras van en el buen sentido: 47 mujeres son asesinadas en 2025 por su pareja o expareja, según el Ministerio de Igualdad, la cifra más baja de la serie iniciada en 2003." } },
          { t: "p", c: {
            fr: "Mais les failles apparaissent. En septembre 2025, une enquête révèle des défaillances du système de bracelets électroniques de télésurveillance : le Congrès désavoue la ministre Ana Redondo avec les voix du PP et de Vox, et demande sa démission, qu'elle refuse. En 2026, 43 femmes ont été tuées au 22 octobre, dont 31 n'avaient jamais porté plainte : le chiffre est plus élevé qu'à la même date en 2025, et il montre la limite d'un dispositif qui ne protège que les victimes qui entrent dans le circuit.",
            es: "Pero aparecen las grietas. En septiembre de 2025, se revelan fallos del sistema de pulseras electrónicas de telecontrol: el Congreso reprueba a la ministra Ana Redondo con los votos del PP y Vox, y pide su cese, que ella rechaza. En 2026, 43 mujeres han sido asesinadas a 22 de octubre, 31 de ellas sin denuncia previa: la cifra es más alta que en la misma fecha de 2025, y muestra el límite de un dispositivo que solo protege a las víctimas que entran en el circuito." } }
        ]
      },
      {
        titre: { fr: "Vox, le PP et la contestation du cadre de 2004", es: "Vox, el PP y la impugnación del marco de 2004" },
        blocs: [
          { t: "p", c: {
            fr: "Depuis son arrivée au Congrès en 2019 (voir le <a href=\"civi-esp-11.html\">chapitre 11</a>), Vox conteste frontalement la loi de 2004, qu'il juge « idéologique » : il propose de la remplacer par une loi de « violence intrafamiliale » neutre quant au sexe de l'auteur et de supprimer les tribunaux spécialisés. En 2023, certains pactes régionaux avec le PP évoquaient la « violence intrafamiliale ». Ceux de 2026 en Estrémadure, en Aragon et en Castille-et-León ne mentionnent ni la violence de genre ni la violence intrafamiliale, selon la presse : <a href=\"../../../../actualites/es/articles/vox-questions-societales.html\">Vox met en sourdine l'avortement et le genre</a> pour gouverner. Le cadre pénal national, de compétence exclusive de l'État, n'est pas modifié.",
            es: "Desde su llegada al Congreso en 2019 (ver el <a href=\"civi-esp-11.html\">capítulo 11</a>), Vox impugna frontalmente la ley de 2004, que considera «ideológica»: propone sustituirla por una ley de «violencia intrafamiliar» neutra respecto al sexo del autor y suprimir los juzgados especializados. En 2023, algunos pactos regionales con el PP mencionaban la «violencia intrafamiliar». Los de 2026 en Extremadura, Aragón y Castilla y León no mencionan ni la violencia de género ni la violencia intrafamiliar, según la prensa: <a href=\"../../../../actualites/es/articles/vox-questions-societales.html\">Vox rebaja el aborto y el género</a> para gobernar. El marco penal nacional, de competencia exclusiva del Estado, no se modifica." } },
          { t: "p", c: {
            fr: "La campagne des élections du 29 novembre 2026 relance le débat. La dissolution des Cortes fait tomber les projets de l'Égalité, comme la loi sur la violence vicaire et la réforme constitutionnelle du droit à l'avortement proposée en avril 2026. Le 23 octobre, Alberto Núñez Feijóo (PP) annonce qu'il intégrera le ministère de l'Égalité à un autre ministère et rouvrira le débat sur l'avortement. Le <a href=\"../../../../actualites/es/articles/sanchez-dissolution-cortes.html\">choix de la dissolution</a> place donc le féminisme au cœur du scrutin.",
            es: "La campaña de las elecciones del 29 de noviembre de 2026 reaviva el debate. La disolución de las Cortes hace decaer los proyectos de Igualdad, como la ley de violencia vicaria y la reforma constitucional del derecho al aborto propuesta en abril de 2026. El 23 de octubre, Alberto Núñez Feijóo (PP) anuncia que integrará el Ministerio de Igualdad en otro ministerio y reabrirá el debate sobre el aborto. La <a href=\"../../../../actualites/es/articles/sanchez-dissolution-cortes.html\">decisión de disolver</a> sitúa pues el feminismo en el centro de la votación." } },
          { t: "encadre", c: "var(--a3)",
            titre: { fr: "Un consensus qui se fissure", es: "Un consenso que se resquebraja" },
            c2: {
              fr: "Le féminisme espagnol est dans une situation paradoxale : il dispose d'un arsenal juridique parmi les plus complets d'Europe et d'une capacité de mobilisation intacte chaque 8 mars, mais il doit défendre cet arsenal contre une contestation politique organisée tout en gérant ses divisions internes sur la question trans. L'unité de 2018 est plus difficile à afficher.",
              es: "El feminismo español está en una situación paradójica: dispone de un arsenal jurídico de los más completos de Europa y de una capacidad de movilización intacta cada 8M, pero debe defender ese arsenal frente a una impugnación política organizada mientras gestiona sus divisiones internas sobre la cuestión trans. La unidad de 2018 es más difícil de exhibir."
            } }
        ]
      }
    ]
  }
  ],

  focus: {
