          { t: "p", c: {

            es: "La crisis social se lee en los <em>desahucios</em> (lanzamientos por impago hipotecario): según el Consejo General del Poder Judicial, casi 500 000 procedimientos de ejecución hipotecaria se inician entre 2008 y 2013. El derecho español no prevé la <strong>dación en pago</strong>: incluso tras perder la vivienda, el hogar sigue debiendo el saldo del préstamo." } },
          { t: "p", c: {

            es: "En 2009 nace la <strong>PAH</strong> (Plataforma de Afectados por la Hipoteca), movimiento ciudadano animado en particular por Ada Colau, futura alcaldesa de Barcelona, que organiza resistencias a los desahucios. La ley 1/2013 refuerza la protección de los deudores hipotecarios y el número de desahucios retrocede después." } },
          { t: "def", mot: { fr: "Dación en pago", es: "Dación en pago" }, c: {

      {
        titre: { fr: "Bankia et le sauvetage bancaire de 2012", es: "Bankia y el rescate bancario de 2012" },

            legende: {"fr": "Madrid, septembre 2020 : sur l'ancienne agence Bankia de la rue d'Embajadores, une fresque proclame « Quién roba, ladrón ».", "es": "Madrid, septiembre de 2020: en la antigua sucursal de Bankia de la calle de Embajadores, un mural proclama «Quién roba, ladrón»."},

          { t: "p", c: {
            fr: "<strong>Bankia</strong>, née de la fusion précipitée de sept caisses d'épargne (dont Caja Madrid et Bancaja), incarne l'échec d'un sauvetage par consolidation. Introduite en Bourse en juillet 2011 sur des comptes qui se révéleront surestimés, elle doit être nationalisée en mai 2012, révélant un trou de dizaines de milliards d'euros dû à des crédits immobiliers irrécouvrables. Son président, Rodrigo Rato, ancien ministre de l'Économie, sera condamné dans une affaire distincte, celle des « cartes black » (voir le <a href=\"civi-esp-10.html\">chapitre 10</a>).",
            es: "<strong>Bankia</strong>, nacida de la fusión precipitada de siete cajas de ahorros (entre ellas Caja Madrid y Bancaja), encarna el fracaso de un rescate por consolidación. Salida a Bolsa en julio de 2011 con unas cuentas que resultarán sobrevaloradas, debe ser nacionalizada en mayo de 2012, lo que revela un agujero de decenas de miles de millones de euros debido a créditos inmobiliarios irrecuperables. Su presidente, Rodrigo Rato, exministro de Economía, será condenado en un asunto distinto, el de las «tarjetas black» (ver el <a href=\"civi-esp-10.html\">capítulo 10</a>)." } },
          { t: "p", c: {
            fr: "Face au risque de contagion, le gouvernement Rajoy demande le 25 juin 2012 une aide européenne ciblée sur les banques. Le <em>Memorandum of Understanding</em> du 20 juillet 2012 avec l'Eurogroupe ouvre jusqu'à 100 milliards d'euros, contre un audit des banques et une restructuration du secteur ; en pratique, l'Espagne n'en utilise qu'environ 41,3 milliards. En novembre 2012, la <strong>SAREB</strong>, la « banque poubelle », est créée pour absorber les actifs immobiliers toxiques. Le tableau compare ce « <em>rescate</em> » aux plans d'aide des autres pays.",
            es: "Ante el riesgo de contagio, el gobierno de Rajoy pide el 25 de junio de 2012 una ayuda europea dirigida a los bancos. El <em>Memorandum of Understanding</em> del 20 de julio de 2012 con el Eurogrupo abre hasta 100 000 millones de euros, a cambio de una auditoría de los bancos y una reestructuración del sector; en la práctica, España solo utiliza unos 41 300 millones. En noviembre de 2012 se crea la <strong>SAREB</strong>, el «banco malo», para absorber los activos inmobiliarios tóxicos. La tabla compara este «rescate» con los planes de ayuda de otros países." } },

  {
    num: "III",
    kicker: { fr: "L'héritage", es: "La herencia" },
    titre: { fr: "Sortir de la crise, en porter les cicatrices (2013-2026)", es: "Salir de la crisis, cargar con las cicatrices (2013-2026)" },
    couleur: "var(--a3)",
    sections: [
      {
        titre: { fr: "Une reprise réelle mais inégale", es: "Una recuperación real pero desigual" },
        blocs: [
          { t: "p", c: {
            fr: "La croissance du PIB reprend en 2014, portée par la baisse du pétrole, la faiblesse de l'euro et les effets de la dévaluation interne : exportations et <strong>tourisme</strong> (voir le <a href=\"civi-esp-17.html\">chapitre 17</a>) deviennent les moteurs de la reprise. L'Espagne sort du programme d'assistance bancaire fin 2013, et le PIB retrouve son niveau d'avant la crise en 2017, soit près d'une décennie de richesse perdue.",
            es: "El crecimiento del PIB se reanuda en 2014, impulsado por la bajada del petróleo, la debilidad del euro y los efectos de la devaluación interna: las exportaciones y el <strong>turismo</strong> (ver el <a href=\"civi-esp-17.html\">capítulo 17</a>) se convierten en los motores de la recuperación. España sale del programa de asistencia bancaria a finales de 2013, y el PIB recupera su nivel previo a la crisis en 2017, casi una década de riqueza perdida." } },
          { t: "p", c: {
            fr: "Les séquelles sont durables : une précarité de l'emploi accrue, des inégalités qui se creusent, et un chômage qui ne repasse durablement sous 15 % qu'à la fin des années 2010. Après le choc du Covid, l'économie est redevenue l'une des plus dynamiques de la zone euro : au troisième trimestre 2026, le PIB progresse de 2,7 % sur un an et l'Espagne compte 22,85 millions de personnes en emploi, mais le taux de chômage reste de 10,18 %.",
            es: "Las secuelas son duraderas: una mayor precariedad del empleo, desigualdades que se agrandan, y un paro que solo baja de forma duradera del 15 % a finales de los años 2010. Tras el choque del covid, la economía vuelve a ser una de las más dinámicas de la zona euro: en el tercer trimestre de 2026, el PIB crece un 2,7 % interanual y España cuenta con 22,85 millones de personas ocupadas, pero la tasa de paro sigue siendo del 10,18 %." } }
        ]
      },
      {
        titre: { fr: "La dette publique, trace budgétaire de la crise", es: "La deuda pública, huella presupuestaria de la crisis" },
        blocs: [
          { t: "p", c: {
            fr: "La dette publique passe d'environ 36 % du PIB en 2007 à plus de 100 % au milieu des années 2010, puis remonte à plus de 120 % avec le Covid. Sa décrue depuis est lente : la Banque d'Espagne la situe à 101,4 % du PIB au deuxième trimestre 2026, et à 99,9 % en juillet 2026, première fois sous les 100 % depuis février 2020. Le gouvernement vise 99,3 % fin 2026, mais le plafond de 60 % des règles européennes reste lointain : la trace budgétaire de 2008 n'est pas effacée, dix-huit ans après.",
            es: "La deuda pública pasa de alrededor del 36 % del PIB en 2007 a más del 100 % a mediados de los años 2010, y vuelve a superar el 120 % con la covid. Su descenso desde entonces es lento: el Banco de España la sitúa en el 101,4 % del PIB en el segundo trimestre de 2026, y en el 99,9 % en julio de 2026, la primera vez por debajo del 100 % desde febrero de 2020. El Gobierno apunta al 99,3 % a finales de 2026, pero el límite del 60 % de las reglas europeas sigue lejano: la huella presupuestaria de 2008 no se ha borrado, dieciocho años después." } },
          { t: "p", c: {
            fr: "Les actifs du sauvetage pèsent encore. La SAREB, qui doit entrer en liquidation en novembre 2027, cumule environ 12,8 milliards d'euros de pertes, et une partie de son parc, plus de 40 000 logements selon la presse, passe à une nouvelle entreprise publique de logement, Casa 47 : le béton de la bulle devient un outil de politique du logement (voir le <a href=\"civi-esp-17.html\">chapitre 17</a>).",
            es: "Los activos del rescate pesan todavía. La SAREB, que debe entrar en liquidación en noviembre de 2027, acumula unos 12 800 millones de euros de pérdidas, y parte de su parque, más de 40 000 viviendas según la prensa, pasa a una nueva empresa pública de vivienda, Casa 47: el ladrillo de la burbuja se convierte en una herramienta de política de vivienda (ver el <a href=\"civi-esp-17.html\">capítulo 17</a>)." } }
        ]
      },
      {
        titre: { fr: "Une transformation politique durable", es: "Una transformación política duradera" },
        blocs: [
