              fr: "Le <em>consenso</em> est la méthode par laquelle les grandes forces politiques, y compris d'anciens ennemis de la guerre civile, choisissent de négocier plutôt que d'imposer leurs vues, pour éviter une nouvelle fracture. Il structure les Pactes de la Moncloa comme la rédaction de la Constitution.",
              es: "El <em>consenso</em> es el método por el que las grandes fuerzas políticas, incluidos antiguos enemigos de la guerra civil, eligen negociar en lugar de imponer sus puntos de vista, para evitar una nueva fractura. Estructura tanto los Pactos de la Moncloa como la redacción de la Constitución." } }

      {
        titre: { fr: "La Constitution de 1978, une monarchie parlementaire", es: "La Constitución de 1978, una monarquía parlamentaria" },
        blocs: [

            titre: { fr: "L'original de 1978", es: "El original de 1978" },
            legende: { fr: "L'exemplaire original, conservé au Congrès des députés, ouvert sur la signature du roi.", es: "El ejemplar original, conservado en el Congreso de los Diputados, abierto por la firma del rey." },
            alt: { fr: "Un grand livre ouvert dans un coffret, sur une page calligraphiée qui porte des signatures", es: "Un gran libro abierto en un estuche, por una página caligrafiada con firmas" } },
          { t: "p", c: {
            fr: "La Constitution est rédigée par une commission de sept députés, les « pères de la Constitution », qui représentent presque tout l'éventail politique. Approuvée par les Cortes le 31 octobre 1978, puis par référendum le 6 décembre avec 87,8 % de « oui », elle est promulguée le 27 décembre. Elle fait de l'Espagne une <strong>monarchie parlementaire</strong> : le roi, chef de l'État, a un rôle de symbole et d'arbitre, et le pouvoir exécutif revient au président du gouvernement, responsable devant le Congrès des députés.",
            es: "La Constitución la redacta una ponencia de siete diputados, los «padres de la Constitución», que representan casi todo el abanico político. Aprobada por las Cortes el 31 de octubre de 1978 y luego en referéndum el 6 de diciembre con un 87,8 % de «sí», se promulga el 27 de diciembre. Convierte a España en una <strong>monarquía parlamentaria</strong>: el rey, jefe del Estado, tiene un papel de símbolo y árbitro, y el poder ejecutivo corresponde al presidente del gobierno, responsable ante el Congreso de los Diputados." } },
          { t: "p", c: {
            fr: "Deux innovations marquent le texte. D'abord une longue déclaration de droits, comparable à celles des démocraties européennes, qui rompt avec les libertés fictives du Fuero de los Españoles. Ensuite l'<strong>État des autonomies</strong>, compromis entre État unitaire et fédéralisme : l'article 2 proclame « l'unité indissoluble de la nation espagnole » tout en reconnaissant le droit à l'autonomie des « nationalités et régions », une ambiguïté voulue pour satisfaire à la fois Catalans et Basques et défenseurs de l'unité. Le tableau suivant montre l'équilibre politique de la commission.",
            es: "Dos innovaciones marcan el texto. Primero, una amplia declaración de derechos, comparable a las de las democracias europeas, que rompe con las libertades ficticias del Fuero de los Españoles. Después, el <strong>Estado de las autonomías</strong>, compromiso entre Estado unitario y federalismo: el artículo 2 proclama «la indisoluble unidad de la Nación española» a la vez que reconoce el derecho a la autonomía de las «nacionalidades y regiones», una ambigüedad buscada para contentar a la vez a catalanes y vascos y a los defensores de la unidad. La tabla siguiente muestra el equilibrio político de la ponencia." } },
          { t: "tableau",
            head: { fr: ["Parti", "Pères de la Constitution"], es: ["Partido", "Padres de la Constitución"] },

          { t: "encadre", c: "var(--a4)",
            titre: { fr: "Une fondation, pas une restauration", es: "Una fundación, no una restauración" },
            c2: {
              fr: "L'Espagne n'avait connu qu'une démocratie brève et instable, la Seconde République. La Constitution de 1978 est donc une fondation, pensée pour éviter les fractures qui avaient mené à la guerre civile. Le seul grand absent est le Parti nationaliste basque, écarté de la commission, qui appelle à l'abstention : au Pays basque, la participation tombe à 44,7 % et moins d'un inscrit sur trois vote « oui ».",
              es: "España solo había conocido una democracia breve e inestable, la Segunda República. La Constitución de 1978 es por tanto una fundación, pensada para evitar las fracturas que habían llevado a la guerra civil. El único gran ausente es el Partido Nacionalista Vasco, apartado de la ponencia, que pide la abstención: en el País Vasco, la participación cae al 44,7 % y menos de un inscrito de cada tres vota «sí»." } }

    couleur: "var(--a3)",
    sections: [
      {
        titre: { fr: "L'État des autonomies en construction", es: "El Estado de las autonomías en construcción" },
        blocs: [
          { t: "p", c: {
            fr: "De 1979 à 1983, dix-sept communautés autonomes se dotent d'un <strong>statut d'autonomie</strong>, leur loi fondamentale, qui fixe leurs institutions et leurs compétences. Le Pays basque et la Catalogne, dont les langues avaient été réprimées sous Franco, obtiennent les premiers en décembre 1979 ; la Galice et l'Andalousie suivent. Des régions sans revendication historique comparable, comme l'Estrémadure ou La Rioja, accèdent ensuite à une autonomie proche : c'est le « café pour tous » (<em>café para todos</em>), souvent critiqué pour avoir dilué la reconnaissance des nations historiques. Les villes de Ceuta et Melilla deviennent villes autonomes en 1995.",
            es: "De 1979 a 1983, diecisiete comunidades autónomas se dotan de un <strong>Estatuto de Autonomía</strong>, su norma fundamental, que fija sus instituciones y competencias. El País Vasco y Cataluña, cuyas lenguas habían sido reprimidas con Franco, lo obtienen primero, en diciembre de 1979; Galicia y Andalucía les siguen. Regiones sin una reivindicación histórica comparable, como Extremadura o La Rioja, acceden después a una autonomía parecida: es el «café para todos», a menudo criticado por diluir el reconocimiento de las nacionalidades históricas. Ceuta y Melilla se convierten en ciudades autónomas en 1995." } },
          { t: "def", mot: { fr: "Estado de las autonomías", es: "Estado de las autonomías" }, c: {
            fr: "Modèle territorial à mi-chemin entre l'État unitaire et le fédéralisme : la Constitution ne fixe pas une liste fermée de compétences régionales, d'où des négociations permanentes entre Madrid et les communautés.",

      {
        titre: { fr: "Le 23 février 1981 : la démocratie à l'épreuve", es: "El 23 de febrero de 1981: la democracia a prueba" },
        blocs: [
          { t: "image", src: "images/transition-23f-impacts.webp", l: 1280, h: 960, format: "droite",
            titre: { fr: "Les impacts du 23-F", es: "Los impactos del 23-F" },
            legende: { fr: "Les trous laissés par les balles des gardes civils dans le plafond de l'hémicycle du Congrès, conservés en souvenir.", es: "Los agujeros de las balas de los guardias civiles en el techo del hemiciclo del Congreso, conservados como recuerdo." },
            alt: { fr: "Deux impacts de balle dans un plafond orné de moulures dorées et peintes", es: "Dos impactos de bala en un techo adornado con molduras doradas y pintadas" } },
          { t: "p", c: {
            fr: "Réélu en mars 1979, Adolfo Suárez s'use vite : son parti se divise, le terrorisme de l'ETA frappe durement et l'armée supporte mal les concessions aux autonomies. Il démissionne le 29 janvier 1981. Le 23 février, pendant le vote d'investiture de son successeur, Leopoldo Calvo-Sotelo, le lieutenant-colonel <strong>Antonio Tejero</strong> fait irruption dans le Congrès avec quelque 200 gardes civils et tire en l'air ; à Valence, le général Milans del Bosch fait sortir les chars dans les rues.",
            es: "Reelegido en marzo de 1979, Adolfo Suárez se desgasta rápidamente: su partido se divide, el terrorismo de ETA golpea con dureza y el ejército soporta mal las concesiones a las autonomías. Dimite el 29 de enero de 1981. El 23 de febrero, durante la votación de investidura de su sucesor, Leopoldo Calvo-Sotelo, el teniente coronel <strong>Antonio Tejero</strong> irrumpe en el Congreso con unos 200 guardias civiles y dispara al aire; en Valencia, el general Milans del Bosch saca los tanques a la calle." } },
          { t: "p", c: {
            fr: "Le coup échoue en quelques heures, en grande partie grâce au roi, qui apparaît à la télévision vers 1 h 15 du matin en uniforme de capitaine général et ordonne à l'armée de respecter l'ordre constitutionnel. Le <strong>23-F</strong> devient un moment fondateur de la légitimité de la monarchie, même si des zones d'ombre ont nourri les soupçons pendant des décennies. Pour le 45e anniversaire, le 25 février 2026, le gouvernement a déclassifié 153 documents de la Défense, de l'Intérieur et des Affaires étrangères sur le coup.",
            es: "El golpe fracasa en pocas horas, en gran parte gracias al rey, que aparece en televisión hacia la 1.15 de la madrugada con uniforme de capitán general y ordena al ejército respetar el orden constitucional. El <strong>23-F</strong> se convierte en un momento fundacional de la legitimidad de la monarquía, aunque algunas zonas de sombra alimentaron las sospechas durante décadas. Por el 45.º aniversario, el 25 de febrero de 2026, el gobierno desclasificó 153 documentos de Defensa, Interior y Exteriores sobre el golpe." } },
          { t: "citation",
            c: { fr: "La Corona, símbolo de la permanencia y unidad de la Patria, no puede tolerar en forma alguna acciones o actitudes de personas que pretendan interrumpir por la fuerza el proceso democrático. (La Couronne, symbole de la permanence et de l'unité de la patrie, ne peut tolérer en aucune façon des actions ou attitudes de personnes qui prétendent interrompre par la force le processus démocratique.)", es: "La Corona, símbolo de la permanencia y unidad de la Patria, no puede tolerar en forma alguna acciones o actitudes de personas que pretendan interrumpir por la fuerza el proceso democrático." },
            src: { fr: "Juan Carlos Ier, message télévisé, nuit du 23 au 24 février 1981", es: "Juan Carlos I, mensaje televisado, noche del 23 al 24 de febrero de 1981" } }

      {
        titre: { fr: "1982 : l'alternance, fin de la Transition", es: "1982: la alternancia, fin de la Transición" },
        blocs: [
          { t: "image", src: "images/transition-alternance-1982.webp", l: 1280, h: 958, format: "gauche",
            titre: { fr: "La passation de 1982", es: "El traspaso de 1982" },
            legende: { fr: "3 novembre 1982, palais de la Moncloa : le président sortant Leopoldo Calvo-Sotelo (à gauche) et Felipe González préparent le transfert du pouvoir.", es: "3 de noviembre de 1982, palacio de la Moncloa: el presidente saliente Leopoldo Calvo-Sotelo (a la izquierda) y Felipe González preparan el traspaso de poderes." },
            alt: { fr: "Photographie en noir et blanc : deux hommes en costume assis à une table, documents devant eux, dans un salon", es: "Fotografía en blanco y negro: dos hombres de traje sentados a una mesa, con documentos delante, en un salón" } },
          { t: "p", c: {
            fr: "L'échec du putsch n'enraye pas le déclin de l'UCD, qui se déchire. Aux élections du 28 octobre 1982, le PSOE de <strong>Felipe González</strong>, recentré depuis qu'il a abandonné la référence au marxisme en 1979, remporte une victoire écrasante : 48,1 % des voix et 202 sièges sur 350. L'UCD s'effondre à 11 sièges, et l'Alliance populaire de Fraga devient le premier parti d'opposition.",
            es: "El fracaso del golpe no frena el declive de la UCD, que se desgarra. En las elecciones del 28 de octubre de 1982, el PSOE de <strong>Felipe González</strong>, que se ha desplazado hacia el centro desde que abandonó la referencia al marxismo en 1979, logra una victoria aplastante: el 48,1 % de los votos y 202 escaños de 350. La UCD se hunde hasta 11 escaños, y la Alianza Popular de Fraga se convierte en el primer partido de la oposición." } },
          { t: "p", c: {
            fr: "Pour la plupart des historiens, cette <strong>alternance</strong> marque la fin de la Transition : un parti issu de l'opposition au franquisme arrive au pouvoir par les urnes, sans réaction de l'armée, preuve que les institutions nées de la réforme pactée supportent désormais une rotation normale du pouvoir. L'entrée dans l'OTAN (1982) puis dans la Communauté européenne (1986) ancre l'Espagne dans le camp occidental.",
            es: "Para la mayoría de los historiadores, esta <strong>alternancia</strong> marca el final de la Transición: un partido procedente de la oposición al franquismo llega al poder por las urnas, sin reacción del ejército, prueba de que las instituciones nacidas de la reforma pactada soportan ya una rotación normal del poder. La entrada en la OTAN (1982) y luego en la Comunidad Europea (1986) ancla a España en el bando occidental." } }

      {
        titre: { fr: "Un modèle ou un mythe ? La Transition en débat", es: "¿Un modelo o un mito? La Transición en debate" },
        blocs: [
          { t: "p", c: {
            fr: "Longtemps présentée comme un modèle de passage pacifique à la démocratie, la Transition n'a pourtant rien d'un processus sans violence. L'historienne Sophie Baby recense au moins 714 morts de la violence politique entre 1975 et 1982 : plus de la moitié sont des victimes de l'ETA, mais près de 180 sont tuées par les forces de l'ordre, et l'extrême droite comme le GRAPO tuent chacun plusieurs dizaines de personnes. Le graphique suivant donne l'ordre de grandeur.",
            es: "Presentada durante mucho tiempo como un modelo de paso pacífico a la democracia, la Transición no fue sin embargo un proceso sin violencia. La historiadora Sophie Baby contabiliza al menos 714 muertos por la violencia política entre 1975 y 1982: más de la mitad son víctimas de ETA, pero cerca de 180 mueren a manos de las fuerzas del orden, y tanto la extrema derecha como los GRAPO matan cada uno a varias decenas de personas. El gráfico siguiente da el orden de magnitud." } },
          { t: "schema", compact: true,

            svg: { fr: "<svg viewBox=\"0 0 480 220\" role=\"img\" aria-label=\"Graphique en barres : ETA 376 morts, forces de l’ordre 178, extrême droite 67, GRAPO 66, sur au moins 714 morts entre 1975 et 1982.\"><g font-family=\"var(--texte)\"><text x=\"0\" y=\"36\" font-size=\"15\" font-weight=\"700\" fill=\"var(--encre)\">ETA</text><rect x=\"150\" y=\"18\" width=\"253.8\" height=\"28\" rx=\"5\" fill=\"var(--c1)\"/><text x=\"411.8\" y=\"38\" font-size=\"16\" font-weight=\"700\" fill=\"var(--encre)\">376</text><text x=\"0\" y=\"88\" font-size=\"15\" font-weight=\"700\" fill=\"var(--encre)\">Forces de l’ordre</text><rect x=\"150\" y=\"70\" width=\"120.2\" height=\"28\" rx=\"5\" fill=\"var(--c4)\"/><text x=\"278.1\" y=\"90\" font-size=\"16\" font-weight=\"700\" fill=\"var(--encre)\">178</text><text x=\"0\" y=\"140\" font-size=\"15\" font-weight=\"700\" fill=\"var(--encre)\">Extrême droite</text><rect x=\"150\" y=\"122\" width=\"45.2\" height=\"28\" rx=\"5\" fill=\"var(--c2)\"/><text x=\"203.2\" y=\"142\" font-size=\"16\" font-weight=\"700\" fill=\"var(--encre)\">67</text><text x=\"0\" y=\"192\" font-size=\"15\" font-weight=\"700\" fill=\"var(--encre)\">GRAPO</text><rect x=\"150\" y=\"174\" width=\"44.6\" height=\"28\" rx=\"5\" fill=\"var(--c3)\"/><text x=\"202.6\" y=\"194\" font-size=\"16\" font-weight=\"700\" fill=\"var(--encre)\">66</text></g></svg>", es: "<svg viewBox=\"0 0 480 220\" role=\"img\" aria-label=\"Gráfico de barras: ETA 376 muertos, fuerzas del orden 178, extrema derecha 67, GRAPO 66, de al menos 714 muertos entre 1975 y 1982.\"><g font-family=\"var(--texte)\"><text x=\"0\" y=\"36\" font-size=\"15\" font-weight=\"700\" fill=\"var(--encre)\">ETA</text><rect x=\"150\" y=\"18\" width=\"253.8\" height=\"28\" rx=\"5\" fill=\"var(--c1)\"/><text x=\"411.8\" y=\"38\" font-size=\"16\" font-weight=\"700\" fill=\"var(--encre)\">376</text><text x=\"0\" y=\"88\" font-size=\"15\" font-weight=\"700\" fill=\"var(--encre)\">Fuerzas del orden</text><rect x=\"150\" y=\"70\" width=\"120.2\" height=\"28\" rx=\"5\" fill=\"var(--c4)\"/><text x=\"278.1\" y=\"90\" font-size=\"16\" font-weight=\"700\" fill=\"var(--encre)\">178</text><text x=\"0\" y=\"140\" font-size=\"15\" font-weight=\"700\" fill=\"var(--encre)\">Extrema derecha</text><rect x=\"150\" y=\"122\" width=\"45.2\" height=\"28\" rx=\"5\" fill=\"var(--c2)\"/><text x=\"203.2\" y=\"142\" font-size=\"16\" font-weight=\"700\" fill=\"var(--encre)\">67</text><text x=\"0\" y=\"192\" font-size=\"15\" font-weight=\"700\" fill=\"var(--encre)\">GRAPO</text><rect x=\"150\" y=\"174\" width=\"44.6\" height=\"28\" rx=\"5\" fill=\"var(--c3)\"/><text x=\"202.6\" y=\"194\" font-size=\"16\" font-weight=\"700\" fill=\"var(--encre)\">66</text></g></svg>" },
            legende: {
              fr: "D'après Sophie Baby, Le Mythe de la transition pacifique, 2012 (estimation minimale ; les décomptes varient selon les sources, notamment pour le GRAPO). Le reste des 714 morts relève d'autres groupes ou d'auteurs inconnus.",
              es: "Según Sophie Baby, El mito de la transición pacífica, 2012 (estimación mínima; los recuentos varían según las fuentes, sobre todo para los GRAPO). El resto de los 714 muertos corresponde a otros grupos o a autores desconocidos." } },
          { t: "p", c: {
            fr: "Le compromis a aussi un prix mémoriel. La loi d'amnistie de 1977 couvre à la fois les opposants et les agents de la dictature, ce qui empêche de juger les crimes du franquisme : c'est le « pacte de l'oubli ». Depuis les années 2000, les petits-enfants des vaincus réclament vérité et réparation, et la loi de mémoire démocratique de 2022 prévoit même d'étudier les violations des droits commises jusqu'en 1983. En 2025, les mémoires de Juan Carlos Ier, <em>Réconciliation</em>, qui revendiquent son rôle central et décrivent avec bienveillance sa relation avec Franco, ont relancé la polémique, tandis que la Constitution de 1978 devenait en février 2026 la plus durable de l'histoire espagnole.",
            es: "El compromiso tiene también un precio de memoria. La Ley de Amnistía de 1977 ampara a la vez a los opositores y a los agentes de la dictadura, lo que impide juzgar los crímenes del franquismo: es el «pacto del olvido». Desde los años 2000, los nietos de los vencidos reclaman verdad y reparación, y la Ley de Memoria Democrática de 2022 prevé incluso estudiar las vulneraciones de derechos cometidas hasta 1983. En 2025, las memorias de Juan Carlos I, <em>Reconciliación</em>, que reivindican su papel central y describen con benevolencia su relación con Franco, reavivaron la polémica, mientras la Constitución de 1978 se convertía en febrero de 2026 en la más longeva de la historia de España." } },
          { t: "encadre", c: "var(--a4)",
            titre: { fr: "Débat : modèle ou mythe ?", es: "Debate: ¿modelo o mito?" },
            c2: {
              fr: "Les uns saluent une sortie de dictature négociée, sans guerre civile, devenue un exemple pour l'Amérique latine et l'Europe de l'Est. Les autres y voient une démocratie octroyée par le haut, qui a laissé en place juges, policiers et militaires du régime et a fait de l'oubli le prix de la paix. Les deux lectures se nourrissent des mêmes faits.",
              es: "Unos celebran una salida negociada de la dictadura, sin guerra civil, convertida en ejemplo para América Latina y Europa del Este. Otros ven en ella una democracia otorgada desde arriba, que dejó en su sitio a jueces, policías y militares del régimen e hizo del olvido el precio de la paz. Ambas lecturas se nutren de los mismos hechos." } }
