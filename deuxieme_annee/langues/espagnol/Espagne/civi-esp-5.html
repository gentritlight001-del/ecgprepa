arker-end=\"url(#fl-ref)\"/>\n<rect x=\"364\" y=\"8\" width=\"166\" height=\"128\" rx=\"12\" fill=\"color-mix(in srgb,var(--c1) 10%,transparent)\" stroke=\"var(--c1)\" stroke-width=\"1.5\"/>\n<text x=\"447\" y=\"38\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--c1)\">Contresigner</text>\n<text x=\"447\" y=\"62\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--encre)\">Président ou ministre</text>\n<text x=\"447\" y=\"92\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">sans refrendo,</text>\n<text x=\"447\" y=\"110\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">l’acte est nul</text>\n<line x1=\"532\" y1=\"72\" x2=\"542\" y2=\"72\" stroke=\"var(--encre2)\" stroke-width=\"1.5\" marker-end=\"url(#fl-ref)\"/>\n<rect x=\"544\" y=\"8\" width=\"166\" height=\"128\" rx=\"12\" fill=\"color-mix(in srgb,var(--c4) 10%,transparent)\" stroke=\"var(--c4)\" stroke-width=\"1.5\"/>\n<text x=\"627\" y=\"38\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--c4)\">Répondre</text>\n<text x=\"627\" y=\"62\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--encre)\">Le signataire</text>\n<text x=\"627\" y=\"92\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">responsable devant</text>\n<text x=\"627\" y=\"110\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">les Cortes</text>\n<rect x=\"4\" y=\"160\" width=\"712\" height=\"54\" rx=\"12\" fill=\"color-mix(in srgb,var(--c2) 12%,transparent)\" stroke=\"var(--c2)\" stroke-width=\"1.5\"/>\n<text x=\"360\" y=\"183\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--encre)\">Exemple : le roi propose et nomme le président du gouvernement,</text>\n<text x=\"360\" y=\"202\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--encre2)\">mais c’est le président du Congrès qui contresigne (art. 64.1)</text>\n<rect x=\"4\" y=\"236\" width=\"712\" height=\"58\" rx=\"12\" fill=\"var(--c1)\"/>\n<text x=\"360\" y=\"260\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">Art. 56.3 : la personne du roi est inviolable et n’est pas soumise à responsabilité</text>\n<text x=\"360\" y=\"281\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#fff\" opacity=\".92\">Contrepartie : il ne décide rien seul. Seule exception, il nomme librement sa Maison (art. 65.2)</text>\n</g></svg>", es: "<svg viewBox=\"0 0 720 300\" role=\"img\" aria-label=\"Esquema: el gobierno y las Cortes deciden, el rey firma, un presidente o un ministro refrenda y responde ante las Cortes; el rey, inviolable, no responde de nada.\">\n<defs><marker id=\"fl-ref\" viewBox=\"0 0 10 10\" refX=\"5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--encre2)\"/></marker></defs>\n<g font-family=\"var(--texte)\">\n<rect x=\"4\" y=\"8\" width=\"166\" height=\"128\" rx=\"12\" fill=\"color-mix(in srgb,var(--c3) 10%,transparent)\" stroke=\"var(--c3)\" stroke-width=\"1.5\"/>\n<text x=\"87\" y=\"38\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--c3)\">Decidir</text>\n<text x=\"87\" y=\"62\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--encre)\">Gobierno, Cortes</text>\n<text x=\"87\" y=\"92\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">eligen, votan,</text>\n<text x=\"87\" y=\"110\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">proponen</text>\n<line x1=\"172\" y1=\"72\" x2=\"182\" y2=\"72\" stroke=\"var(--encre2)\" stroke-width=\"1.5\" marker-end=\"url(#fl-ref)\"/>\n<rect x=\"184\" y=\"8\" width=\"166\" height=\"128\" rx=\"12\" fill=\"color-mix(in srgb,var(--c2) 10%,transparent)\" stroke=\"var(--c2)\" stroke-width=\"1.5\"/>\n<text x=\"267\" y=\"38\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--c2)\">Firmar</text>\n<text x=\"267\" y=\"62\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--encre)\">El rey</text>\n<text x=\"267\" y=\"92\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">sanciona, promulga,</text>\n<text x=\"267\" y=\"110\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">nombra, convoca</text>\n<line x1=\"352\" y1=\"72\" x2=\"362\" y2=\"72\" stroke=\"var(--encre2)\" stroke-width=\"1.5\" marker-end=\"url(#fl-ref)\"/>\n<rect x=\"364\" y=\"8\" width=\"166\" height=\"128\" rx=\"12\" fill=\"color-mix(in srgb,var(--c1) 10%,transparent)\" stroke=\"var(--c1)\" stroke-width=\"1.5\"/>\n<text x=\"447\" y=\"38\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--c1)\">Refrendar</text>\n<text x=\"447\" y=\"62\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--encre)\">Presidente o ministro</text>\n<text x=\"447\" y=\"92\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">sin refrendo,</text>\n<text x=\"447\" y=\"110\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">el acto es nulo</text>\n<line x1=\"532\" y1=\"72\" x2=\"542\" y2=\"72\" stroke=\"var(--encre2)\" stroke-width=\"1.5\" marker-end=\"url(#fl-ref)\"/>\n<rect x=\"544\" y=\"8\" width=\"166\" height=\"128\" rx=\"12\" fill=\"color-mix(in srgb,var(--c4) 10%,transparent)\" stroke=\"var(--c4)\" stroke-width=\"1.5\"/>\n<text x=\"627\" y=\"38\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--c4)\">Responder</text>\n<text x=\"627\" y=\"62\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--encre)\">Quien refrenda</text>\n<text x=\"627\" y=\"92\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">responsable ante</text>\n<text x=\"627\" y=\"110\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--encre2)\">las Cortes</text>\n<rect x=\"4\" y=\"160\" width=\"712\" height=\"54\" rx=\"12\" fill=\"color-mix(in srgb,var(--c2) 12%,transparent)\" stroke=\"var(--c2)\" stroke-width=\"1.5\"/>\n<text x=\"360\" y=\"183\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--encre)\">Ejemplo: el rey propone y nombra al presidente del gobierno,</text>\n<text x=\"360\" y=\"202\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--encre2)\">pero es el presidente del Congreso quien refrenda (art. 64.1)</text>\n<rect x=\"4\" y=\"236\" width=\"712\" height=\"58\" rx=\"12\" fill=\"var(--c1)\"/>\n<text x=\"360\" y=\"260\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">Art. 56.3: la persona del rey es inviolable y no está sujeta a responsabilidad</text>\n<text x=\"360\" y=\"281\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#fff\" opacity=\".92\">Contrapartida: no decide nada por sí solo. Única excepción, nombra libremente su Casa (art. 65.2)</text>\n</g></svg>" },
            legende: { fr: "D'après les articles 56.3, 64 et 65.2 de la Constitution de 1978.", es: "Según los artículos 56.3, 64 y 65.2 de la Constitución de 1978." } }
        ]
      },
      {
        titre: { fr: "Le 23-F : une légitimité gagnée par l'exercice", es: "El 23-F: una legitimidad ganada con el ejercicio" },
        blocs: [
          { t: "p", c: {
            fr: "Le <strong>23 février 1981</strong>, le lieutenant-colonel Tejero prend le Congrès en otage pendant l'investiture de Leopoldo Calvo-Sotelo, et des chars sortent dans les rues de Valence. Vers 1 h 15 du matin, le roi apparaît à la télévision en uniforme de capitaine général et ordonne à l'armée de respecter l'ordre constitutionnel. Le coup échoue. Juan Carlos transforme ainsi une prérogative symbolique, le commandement suprême des armées, en acte politique décisif : il cesse d'être « le roi de Franco » pour devenir le <strong>garant de la démocratie</strong>.",
            es: "El <strong>23 de febrero de 1981</strong>, el teniente coronel Tejero toma como rehén el Congreso durante la investidura de Leopoldo Calvo-Sotelo, y los tanques salen a las calles de Valencia. Hacia la 1.15 de la madrugada, el rey aparece en televisión con uniforme de capitán general y ordena al ejército respetar el orden constitucional. El golpe fracasa. Juan Carlos convierte así una prerrogativa simbólica, el mando supremo de las fuerzas armadas, en un acto político decisivo: deja de ser «el rey de Franco» para convertirse en el <strong>garante de la democracia</strong>." } },
          { t: "p", c: {
            fr: "Les zones d'ombre n'ont jamais disparu : le général Armada, ancien secrétaire du roi, figurait parmi les organisateurs, et certains ont soupçonné le palais d'avoir connu des projets d'« opération » politique. Pour le 45e anniversaire, le 25 février 2026, le gouvernement a déclassifié 153 documents de la Défense, de l'Intérieur et des Affaires étrangères, sans clore le débat. Pour la grande majorité des Espagnols, pourtant, la nuit du 23-F a fondé un lien personnel avec le roi.",
            es: "Las zonas de sombra nunca han desaparecido: el general Armada, antiguo secretario del rey, figuraba entre los organizadores, y algunos han sospechado que palacio conocía proyectos de «operación» política. Por el 45.º aniversario, el 25 de febrero de 2026, el gobierno desclasificó 153 documentos de Defensa, Interior y Exteriores, sin cerrar el debate. Para la gran mayoría de los españoles, sin embargo, la noche del 23-F fundó un vínculo personal con el rey." } },
          { t: "encadre", c: "var(--a1)",
            titre: { fr: "Notion clé : le juancarlismo", es: "Noción clave: el juancarlismo" },
            c2: {
              fr: "Le <em>juancarlismo</em> désigne l'adhésion à la <strong>personne</strong> du roi plutôt qu'à l'institution monarchique. Beaucoup d'Espagnols de gauche, républicains de conviction, ont soutenu Juan Carlos pour ce qu'il avait fait en 1981. Cette légitimité est efficace mais <strong>non transmissible</strong> : elle explique la popularité exceptionnelle des années 1980 et 1990, quand la Couronne est l'institution la mieux notée des baromètres du CIS, et la brutalité de la chute des années 2010, puisqu'un roi discrédité entraîne alors l'institution entière.",
              es: "El <em>juancarlismo</em> designa la adhesión a la <strong>persona</strong> del rey más que a la institución monárquica. Muchos españoles de izquierdas, republicanos de convicción, apoyaron a Juan Carlos por lo que había hecho en 1981. Esta legitimidad es eficaz pero <strong>no transmisible</strong>: explica la popularidad excepcional de los años ochenta y noventa, cuando la Corona es la institución mejor valorada en los barómetros del CIS, y la brutalidad de la caída de los años 2010, ya que un rey desacreditado arrastra entonces a toda la institución."
            } },
          { t: "p", c: {
            fr: "La Couronne repose ainsi sur trois légitimités superposées : une origine juridique franquiste (1947-1969), une légitimation démocratique par le référendum de 1978, et une légitimation par l'exercice, gagnée la nuit du 23-F. La troisième est la plus forte, mais aussi la plus fragile : ce qu'un roi gagne par ses actes, il peut le perdre par ses actes.",
            es: "La Corona descansa así en tres legitimidades superpuestas: un origen jurídico franquista (1947-1969), una legitimación democrática por el referéndum de 1978 y una legitimación por el ejercicio, ganada la noche del 23-F. La tercera es la más fuerte, pero también la más frágil: lo que un rey gana con sus actos, puede perderlo con sus actos." } }
        ]
      }
    ]
  },
  {
    num: "II",
    kicker: { fr: "L'usure", es: "El desgaste" },
    titre: { fr: "Scandales, discrédit et abdication (2007-2014)", es: "Escándalos, descrédito y abdicación (2007-2014)" },
    couleur: "var(--a2)",
    sections: [
      {
        titre: { fr: "Nóos et Botswana : la crise rend l'exemplarité obligatoire", es: "Nóos y Botsuana: la crisis vuelve obligatoria la ejemplaridad" },
        blocs: [
          { t: "p", c: {
            fr: "À partir de 2011, l'<strong>affaire Nóos</strong> met en cause <strong>Iñaki Urdangarin</strong>, gendre du roi : l'institut Nóos, présenté comme une association sans but lucratif, a obtenu des contrats publics des gouvernements des Baléares et de Valence, et l'argent a été détourné. L'infante <strong>Cristina</strong> est inculpée, une première pour un membre de la famille royale. En février 2017, elle est acquittée ; son mari est condamné, et le Tribunal suprême fixe sa peine à 5 ans et 10 mois de prison en 2018. Dès juin 2015, Felipe VI a retiré à sa sœur le titre de duchesse de Palma.",
            es: "A partir de 2011, el <strong>caso Nóos</strong> salpica a <strong>Iñaki Urdangarin</strong>, yerno del rey: el Instituto Nóos, presentado como una asociación sin ánimo de lucro, obtuvo contratos públicos de los gobiernos balear y valenciano, y el dinero fue desviado. La infanta <strong>Cristina</strong> es imputada, algo inédito para un miembro de la familia real. En febrero de 2017 es absuelta; su marido es condenado, y el Tribunal Supremo fija su pena en 5 años y 10 meses de prisión en 2018. Ya en junio de 2015, Felipe VI había retirado a su hermana el título de duquesa de Palma." } },
          { t: "p", c: {
            fr: "En <strong>avril 2012</strong>, alors que le chômage dépasse 24 %, les Espagnols apprennent que le roi s'est fracturé la hanche lors d'une chasse à l'éléphant au <strong>Botswana</strong>, voyage payé par un homme d'affaires saoudien. À sa sortie de l'hôpital, il prononce devant une caméra des excuses inédites dans l'histoire de la monarchie. Dans un pays frappé par la crise de 2008, les expulsions de logement et l'austérité, l'écart entre le sacrifice demandé aux citoyens et les usages de la Couronne devient insupportable.",
            es: "En <strong>abril de 2012</strong>, con un paro de más del 24 %, los españoles descubren que el rey se ha roto la cadera durante una cacería de elefantes en <strong>Botsuana</strong>, un viaje pagado por un empresario saudí. Al salir del hospital, pronuncia ante una cámara unas disculpas inéditas en la historia de la monarquía. En un país golpeado por la crisis de 2008, los desahucios y la austeridad, la distancia entre el sacrificio exigido a los ciudadanos y los usos de la Corona se vuelve insoportable." } },
          { t: "citation",
            c: { fr: "Lo siento mucho. Me he equivocado y no volverá a ocurrir. (Je suis vraiment désolé. Je me suis trompé et cela ne se reproduira pas.)", es: "Lo siento mucho. Me he equivocado y no volverá a ocurrir." },
            src: { fr: "Juan Carlos Ier, à sa sortie de l'hôpital, 18 avril 2012", es: "Juan Carlos I, a su salida del hospital, 18 de abril de 2012" } },
          { t: "p", c: {
            fr: "La Couronne, longtemps l'institution la mieux notée, passe sous la moyenne dans les baromètres du <strong>CIS</strong> en 2011 ; après avril 2015, l'institut public cesse de poser la question. Les critiques y voient une manière de protéger l'institution, ses défenseurs une simple réorganisation des enquêtes. Le divorce est surtout générationnel : les Espagnols nés après la Transition n'ont pas connu le 23-F, et le <em>juancarlismo</em> ne leur dit rien.",
            es: "La Corona, durante mucho tiempo la institución mejor valorada, cae por debajo del aprobado en los barómetros del <strong>CIS</strong> en 2011; después de abril de 2015, el instituto público deja de hacer la pregunta. Los críticos ven en ello una manera de proteger la institución; sus defensores, una simple reorganización de las encuestas. El divorcio es sobre todo generacional: los españoles nacidos después de la Transición no vivieron el 23-F, y el <em>juancarlismo</em> no les dice nada." } }
        ]
      },
      {
        titre: { fr: "L'abdication de juin 2014 : sauver l'institution en changeant de titulaire", es: "La abdicación de junio de 2014: salvar la institución cambiando de titular" },
        blocs: [
          { t: "image", src: "images/monarchie-loi-abdication.webp", l: 960, h: 638, format: "droite",
            titre: { fr: "La dernière signature", es: "La última firma" },
            legende: { fr: "Au palais royal de Madrid, le 18 juin 2014, Juan Carlos Ier signe la loi organique qui rend effective sa propre abdication ; Mariano Rajoy, à gauche, attend de la contresigner.", es: "En el Palacio Real de Madrid, el 18 de junio de 2014, Juan Carlos I firma la ley orgánica que hace efectiva su propia abdicación; Mariano Rajoy, a la izquierda, espera para refrendarla." },
            alt: { fr: "Le roi Juan Carlos, penché sur une table dorée soutenue par des sphinx, signe un document devant une rangée de drapeaux des communautés autonomes ; Mariano Rajoy se tient debout à gauche", es: "El rey Juan Carlos, inclinado sobre una mesa dorada sostenida por esfinges, firma un documento ante una fila de banderas de las comunidades autónomas; Mariano Rajoy está de pie a la izquierda" } },
          { t: "p", c: {
            fr: "Le <strong>2 juin 2014</strong>, Mariano Rajoy annonce l'abdication du roi, qui explique ensuite à la télévision vouloir laisser la place à « une génération plus jeune ». Le calcul est clair : la légitimité personnelle sur laquelle reposait la monarchie s'étant effondrée, seul un changement de titulaire peut la reconstituer. La Constitution ne prévoit aucune procédure : l'article 57.5 renvoie à une <strong>loi organique</strong>, adoptée par le Congrès le 11 juin par 299 voix contre 19 et 23 abstentions, puis par le Sénat.",
            es: "El <strong>2 de junio de 2014</strong>, Mariano Rajoy anuncia la abdicación del rey, que explica luego en televisión que quiere dejar paso a «una generación más joven». El cálculo es claro: hundida la legitimidad personal en la que descansaba la monarquía, solo un cambio de titular puede reconstruirla. La Constitución no prevé ningún procedimiento: el artículo 57.5 remite a una <strong>ley orgánica</strong>, aprobada por el Congreso el 11 de junio por 299 votos contra 19 y 23 abstenciones, y luego por el Senado." } },
          { t: "p", c: {
            fr: "Le roi signe la loi le 18 juin, et la scène illustre le refrendo jusqu'au bout : même son abdication est contresignée par le président du gouvernement. Le lendemain, <strong>19 juin 2014</strong>, Felipe VI prête serment devant les Cortes Generales et prononce un discours, sans couronnement ni messe solennelle : la couronne est posée à côté de lui, sur un coussin. Leonor, 8 ans, devient princesse des Asturies.",
            es: "El rey firma la ley el 18 de junio, y la escena ilustra el refrendo hasta el final: incluso su abdicación la refrenda el presidente del gobierno. Al día siguiente, el <strong>19 de junio de 2014</strong>, Felipe VI jura ante las Cortes Generales y pronuncia un discurso, sin coronación ni misa solemne: la corona está a su lado, sobre un cojín. Leonor, con 8 años, se convierte en princesa de Asturias." } },
          { t: "image", src: "images/monarchie-manifestation-sol.webp", l: 960, h: 720, format: "gauche",
            titre: { fr: "« Référendum ! »", es: "«¡Referéndum!»" },
            legende: { fr: "Manifestation républicaine à la Puerta del Sol, à Madrid, le soir de l'annonce de l'abdication, le 2 juin 2014 : drapeaux tricolores de la IIe République et pancartes réclamant un référendum.", es: "Manifestación republicana en la Puerta del Sol, en Madrid, la tarde del anuncio de la abdicación, el 2 de junio de 2014: banderas tricolores de la II República y pancartas que piden un referéndum." },
            alt: { fr: "Foule agitant des drapeaux rouge, jaune et violet sous la statue équestre de Charles III, devant des façades à balcons", es: "Multitud que agita banderas rojas, amarillas y moradas bajo la estatua ecuestre de Carlos III, ante fachadas con balcones" } },
          { t: "p", c: {
            fr: "Dès le soir du 2 juin, des dizaines de milliers de personnes réclament dans plusieurs villes un <strong>référendum sur la forme de l'État</strong>. Elles restent minoritaires, mais elles rappellent une réalité durable : la monarchie n'a jamais été soumise à un vote séparé. Elle a été approuvée en 1978 à l'intérieur d'un texte constitutionnel global, qu'il était difficile de rejeter en bloc au sortir de la dictature. Izquierda Unida et les nationalistes de gauche, qui votent contre la loi d'abdication, soutiennent cette demande ; le PP et le PSOE la rejettent. Depuis, chaque crise de la Couronne ravive la demande : à partir de 2020, Unidas Podemos et les partis nationalistes réclament à plusieurs reprises une commission d'enquête parlementaire sur les affaires du roi émérite, que la majorité du bureau du Congrès refuse.",
            es: "Desde la tarde del 2 de junio, decenas de miles de personas reclaman en varias ciudades un <strong>referéndum sobre la forma del Estado</strong>. Son minoritarias, pero recuerdan una realidad duradera: la monarquía nunca se ha sometido a una votación separada. Se aprobó en 1978 dentro de un texto constitucional global, difícil de rechazar en bloque al salir de la dictadura. Izquierda Unida y los nacionalistas de izquierdas, que votan contra la ley de abdicación, apoyan esta petición; el PP y el PSOE la rechazan. Desde entonces, cada crisis de la Corona reaviva la reivindicación: a partir de 2020, Unidas Podemos y los partidos nacionalistas piden en varias ocasiones una comisión de investigación parlamentaria sobre los asuntos del rey emérito, que la mayoría de la Mesa del Congreso rechaza." } }
        ]
      },
      {
        titre: { fr: "Inviolabilité n'est pas impunité", es: "Inviolabilidad no es impunidad" },
        blocs: [
          { t: "p", c: {

            es: "Abdicar es también perder la <strong>inviolabilidad</strong>, que solo protege al rey en el ejercicio de su cargo. Una ley orgánica de julio de 2014 concede únicamente a Juan Carlos un <strong>aforamiento</strong>: solo puede juzgarlo el Tribunal Supremo. Ahora bien, a partir de 2018, la prensa y luego una investigación de la Fiscalía de Ginebra revelan una fortuna oculta: 100 millones de dólares abonados en 2008 por el rey de Arabia Saudí en una cuenta en Suiza, tarjetas de crédito pagadas por un empresario mexicano, un fideicomiso en Jersey." } },
          { t: "p", c: {

            es: "La Fiscalía del Tribunal Supremo archiva sus tres investigaciones el 2 de marzo de 2022, sin juicio. La tabla siguiente muestra por qué: no se trata de una inmunidad absoluta, sino de la suma de la inviolabilidad para los hechos anteriores a junio de 2014, la prescripción y dos regularizaciones fiscales espontáneas, que extinguen la acción penal. El rey emérito ve en ello una inocencia demostrada; sus detractores, una justicia de dos velocidades." } },

        blocs: [
          { t: "p", c: {
            fr: "Dans son discours de proclamation, Felipe VI promet une monarchie « rénovée pour un temps nouveau ». Il réduit la <strong>famille royale</strong> officielle au roi, à la reine, à leurs filles et à ses parents, adopte un code de conduite qui interdit les cadeaux de valeur et fait auditer les comptes de la Maison du roi. Depuis un décret d'avril 2022, la Cour des comptes contrôle sa gestion, et le roi a publié son patrimoine personnel : 2,57 millions d'euros, en dépôts et en placements.",
            es: "En su discurso de proclamación, Felipe VI promete una monarquía «renovada para un tiempo nuevo». Reduce la <strong>familia real</strong> oficial al rey, la reina, sus hijas y sus padres, adopta un código de conducta que prohíbe los regalos de valor y hace auditar las cuentas de la Casa del Rey. Desde un decreto de abril de 2022, el Tribunal de Cuentas fiscaliza su gestión, y el rey ha publicado su patrimonio personal: 2,57 millones de euros, en depósitos y valores." } },
          { t: "image", src: "images/monarchie-felipe-famille-2014.webp", l: 960, h: 638, format: "gauche",

            legende: { fr: "Le 19 juin 2014, Felipe VI reçoit les honneurs militaires devant le Congrès, avec la reine Letizia, la princesse Leonor et l'infante Sofía ; derrière, Mariano Rajoy et les présidents des chambres.", es: "El 19 de junio de 2014, Felipe VI recibe honores militares ante el Congreso, con la reina Letizia, la princesa Leonor y la infanta Sofía; detrás, Mariano Rajoy y los presidentes de las cámaras." },
            alt: { fr: "Le roi en uniforme fait le salut militaire sur une estrade rouge, la reine en blanc à sa droite et ses deux filles en robe claire devant lui ; derrière, des hommes en jaquette", es: "El rey de uniforme hace el saludo militar sobre una tarima roja, la reina de blanco a su derecha y sus dos hijas con vestido claro delante; detrás, hombres de chaqué" } },
          { t: "p", c: {
            fr: "La dotation publique reste modeste au regard des autres monarchies européennes : <strong>8 431 150 euros</strong> par an, montant inchangé depuis 2021 parce que le budget de 2023 est prorogé faute de nouveaux budgets. En 2025, la Maison du roi a dû puiser dans ses réserves pour couvrir des dépenses supérieures à 9 millions. La décision la plus spectaculaire est pourtant familiale : le <strong>15 mars 2020</strong>, Felipe VI renonce à l'héritage de son père et lui retire sa dotation.",
            es: "La dotación pública sigue siendo modesta si se compara con otras monarquías europeas: <strong>8 431 150 euros</strong> al año, importe sin cambios desde 2021 porque el presupuesto de 2023 está prorrogado a falta de nuevas cuentas. En 2025, la Casa del Rey tuvo que recurrir a sus remanentes para cubrir gastos superiores a 9 millones. La decisión más espectacular es, sin embargo, familiar: el <strong>15 de marzo de 2020</strong>, Felipe VI renuncia a la herencia de su padre y le retira su asignación." } },
          { t: "p", c: {
            fr: "Le <strong>3 août 2020</strong>, Juan Carlos quitte l'Espagne pour <strong>Abou Dabi</strong>, où il réside toujours. Ses mémoires, <em>Reconciliación</em> (fin 2025), où il défend son bilan, puis la déclassification des documents du 23-F en février 2026 relancent le débat sur son retour : réclamé par le PP, refusé par la gauche. La Zarzuela répond qu'il peut revenir quand il le souhaite, à condition de rétablir sa résidence fiscale en Espagne. Lors des cinquante ans de son accession au trône, en novembre 2025, il est tenu à l'écart des actes officiels.",
            es: "El <strong>3 de agosto de 2020</strong>, Juan Carlos abandona España rumbo a <strong>Abu Dabi</strong>, donde sigue residiendo. Sus memorias, <em>Reconciliación</em> (finales de 2025), en las que defiende su balance, y la desclasificación de los documentos del 23-F en febrero de 2026 reabren el debate sobre su regreso: reclamado por el PP, rechazado por la izquierda. La Zarzuela responde que puede volver cuando quiera, a condición de recuperar su residencia fiscal en España. En los cincuenta años de su llegada al trono, en noviembre de 2025, queda al margen de los actos oficiales." } },

      {
        titre: { fr: "Le roi dans la crise territoriale : le discours du 3 octobre 2017", es: "El rey en la crisis territorial: el discurso del 3 de octubre de 2017" },
        blocs: [
          { t: "p", c: {
            fr: "Deux jours après le référendum d'indépendance illégal du 1er octobre 2017 en Catalogne, Felipe VI prononce une allocution télévisée d'une fermeté inhabituelle : il accuse les autorités catalanes d'une « déloyauté inadmissible envers les pouvoirs de l'État » et appelle à garantir l'ordre constitutionnel. Le discours, préparé avec le gouvernement de Mariano Rajoy, donc couvert par le refrendo, est salué par la droite et le centre comme un acte de responsabilité.",
            es: "Dos días después del referéndum de independencia ilegal del 1 de octubre de 2017 en Cataluña, Felipe VI pronuncia un mensaje televisado de una firmeza inusual: acusa a las autoridades catalanas de una «deslealtad inadmisible hacia los poderes del Estado» y llama a garantizar el orden constitucional. El discurso, preparado con el gobierno de Mariano Rajoy y por tanto cubierto por el refrendo, es celebrado por la derecha y el centro como un acto de responsabilidad." } },
          { t: "image", src: "images/monarchie-compostelle-2014.webp", l: 960, h: 739, format: "droite",
            titre: { fr: "Deux républiques dans un même cortège", es: "Dos repúblicas en una misma marcha" },
            legende: { fr: "À Saint-Jacques-de-Compostelle, le 2 juin 2014, drapeaux de la IIe République et drapeaux nationalistes galiciens à étoile rouge se mêlent : dans les nationalismes périphériques, le rejet du roi va avec celui de l'État central.", es: "En Santiago de Compostela, el 2 de junio de 2014, banderas de la II República y banderas nacionalistas gallegas con estrella roja se mezclan: en los nacionalismos periféricos, el rechazo al rey va unido al del Estado central." },
            alt: { fr: "Foule vue de dos dans une rue de pierre ; au-dessus, des drapeaux blancs à bande bleue et étoile rouge et quelques drapeaux tricolores républicains", es: "Multitud de espaldas en una calle de piedra; encima, banderas blancas con franja azul y estrella roja y algunas banderas tricolores republicanas" } },
          { t: "p", c: {
            fr: "En Catalogne, l'effet est inverse et durable. Beaucoup y voient l'abandon de la fonction d'<strong>arbitre et modérateur</strong> au profit d'une prise de parti, d'autant que le roi ne mentionne ni les charges policières du 1er octobre ni la possibilité d'un dialogue. Le monarque devient une cible symbolique du souverainisme : conseils municipaux qui le déclarent persona non grata, chaises vides des élus indépendantistes, sifflets lors de ses visites.",
            es: "En Cataluña, el efecto es el contrario y duradero. Muchos ven en ello el abandono de la función de <strong>árbitro y moderador</strong> en favor de una toma de partido, tanto más cuanto que el rey no menciona ni las cargas policiales del 1 de octubre ni la posibilidad de un diálogo. El monarca se convierte en un blanco simbólico del soberanismo: ayuntamientos que lo declaran persona non grata, sillas vacías de los cargos independentistas, pitadas en sus visitas." } },
          { t: "p", c: {
            fr: "Le dilemme est structurel : se taire dans une crise institutionnelle grave, c'est renoncer à la fonction de garant de la Constitution ; parler, c'est contrarier un camp. La neutralité d'un chef d'État symbolique n'est confortable que dans un pays sans conflit territorial ouvert, ce que l'Espagne n'est pas. Le roi incarne pourtant toujours l'unité du pays : le 13 octobre 2026, Felipe VI et Letizia font à <a href=\"../../../../actualites/es/articles/espagne-reyes-visite-ceuta-2026.html\" class=\"a-lien\">Ceuta</a> la première visite d'un roi depuis 2007, pour affirmer que sa souveraineté n'est « pas négociable ».",
            es: "El dilema es estructural: callar ante una crisis institucional grave es renunciar a la función de garante de la Constitución; hablar es contrariar a un bando. La neutralidad de un jefe de Estado simbólico solo es cómoda en un país sin conflicto territorial abierto, y España no lo es. El rey sigue encarnando, sin embargo, la unidad del país: el 13 de octubre de 2026, Felipe VI y Letizia realizan en <a href=\"../../../../actualites/es/articles/espagne-reyes-visite-ceuta-2026.html\" class=\"a-lien\">Ceuta</a> la primera visita de un rey desde 2007, para afirmar que su soberanía «no es negociable»." } }

      {
        titre: { fr: "Leonor, la succession et l'article 57.1", es: "Leonor, la sucesión y el artículo 57.1" },

            fr: "La préparation de l'héritière est un instrument politique en soi. <strong>Leonor</strong>, princesse des Asturies, a juré la Constitution devant les Cortes le jour de ses 18 ans, le <strong>31 octobre 2023</strong>. Elle a ensuite suivi trois années de formation militaire, une par armée : l'Académie générale militaire de Saragosse, l'École navale de Marín, avec la croisière du navire-école <em>Juan Sebastián de Elcano</em> en 2025, puis l'Académie générale de l'air de San Javier, achevée le 10 juillet 2026.",
            es: "La preparación de la heredera es un instrumento político en sí. <strong>Leonor</strong>, princesa de Asturias, juró la Constitución ante las Cortes el día de su 18.º cumpleaños, el <strong>31 de octubre de 2023</strong>. Después siguió tres años de formación militar, uno por ejército: la Academia General Militar de Zaragoza, la Escuela Naval de Marín, con el crucero del buque escuela <em>Juan Sebastián de Elcano</em> en 2025, y la Academia General del Aire de San Javier, terminada el 10 de julio de 2026." } },

            alt: { fr: "Façade à colonnes du Congrès couverte d'une immense tenture rouge aux armes royales ; devant, une longue rangée de personnes sur un tapis rouge entre deux lions de bronze", es: "Fachada de columnas del Congreso cubierta por un enorme tapiz rojo con el escudo real; delante, una larga fila de personas sobre una alfombra roja entre dos leones de bronce" } },
          { t: "p", c: {
            fr: "En septembre 2026, elle entre à l'université Carlos III de Madrid pour étudier les sciences politiques. Ce parcours, calqué sur celui de son père, vise à construire une légitimité par la <strong>compétence et le service</strong>, à défaut de pouvoir invoquer un 23-F. Il en fera la première reine régnante depuis Isabelle II (1833-1868).",
            es: "En septiembre de 2026, ingresa en la Universidad Carlos III de Madrid para estudiar Ciencias Políticas. Este recorrido, calcado del de su padre, busca construir una legitimidad basada en la <strong>competencia y el servicio</strong>, a falta de poder invocar un 23-F. La convertirá en la primera reina reinante desde Isabel II (1833-1868)." } },
          { t: "p", c: {
            fr: "Un anachronisme demeure : l'<strong>article 57.1</strong> maintient, à degré égal, la préférence de l'homme sur la femme. Leonor n'ayant qu'une sœur cadette, la règle ne joue pas pour elle, mais elle reste dans le texte. La supprimer suppose de toucher au titre II, donc la procédure de révision aggravée de l'<strong>article 168</strong>, résumée ci-dessous. Aucun gouvernement n'a voulu l'ouvrir, de peur que le débat ne s'élargisse à la forme même de l'État.",

      {
        titre: { fr: "Monarchie ou république : un débat sans issue institutionnelle", es: "Monarquía o república: un debate sin salida institucional" },
        blocs: [
          { t: "p", c: {
            fr: "Le débat républicain ne se répartit pas au hasard. Il est plus fort chez les <strong>moins de 35 ans</strong>, à gauche (Podemos, Sumar) et dans les territoires à forte identité nationale, Catalogne, Pays basque et Galice, tandis que la monarchie garde un large soutien chez les électeurs plus âgés et de droite. Faute d'enquête publique, les sondages privés divergent selon la question : en 2020, une enquête de 40dB pour des médias indépendants donnait 40,9 % pour la république et 34,9 % pour la monarchie.",
            es: "El debate republicano no se reparte al azar. Es más fuerte entre los <strong>menores de 35 años</strong>, en la izquierda (Podemos, Sumar) y en los territorios con fuerte identidad nacional, Cataluña, País Vasco y Galicia, mientras que la monarquía conserva un amplio apoyo entre los votantes de más edad y de derechas. A falta de encuesta pública, los sondeos privados divergen según la pregunta: en 2020, una encuesta de 40dB para medios independientes daba un 40,9 % a la república y un 34,9 % a la monarquía." } },
          { t: "p", c: {
            fr: "Les défenseurs de la Couronne avancent quatre arguments : elle a été approuvée avec la Constitution en 1978 ; un chef d'État sans pouvoir assure une continuité au-dessus des majorités changeantes, comme dans les démocraties stables du nord de l'Europe ; le 23-F a montré son utilité dans une crise ; Felipe VI a engagé une régénération réelle. Ses adversaires répondent que les Espagnols n'ont jamais voté sur la monarchie seule, que l'hérédité contredit l'égalité, que l'inviolabilité a empêché de juger le roi émérite, et que la Couronne tient son origine d'une désignation par Franco.",
            es: "Los defensores de la Corona esgrimen cuatro argumentos: fue aprobada con la Constitución en 1978; un jefe de Estado sin poder asegura una continuidad por encima de las mayorías cambiantes, como en las democracias estables del norte de Europa; el 23-F demostró su utilidad en una crisis; Felipe VI ha emprendido una regeneración real. Sus adversarios responden que los españoles nunca votaron sobre la monarquía en sí, que la herencia contradice la igualdad, que la inviolabilidad impidió juzgar al rey emérito y que la Corona tiene su origen en una designación de Franco." } },
          { t: "p", c: {

            es: "Ninguna fuerza de gobierno lo convierte, sin embargo, en una prioridad: pasar a la república exige el procedimiento del artículo 168, con dos votaciones por dos tercios y un referéndum de resultado incierto. El PSOE, republicano por tradición, apoya la monarquía parlamentaria desde 1978; el PP y Vox la defienden como símbolo de la unidad nacional. La monarquía española vive así una situación singular: <strong>discutida, pero protegida por la dificultad misma de cuestionarla</strong>." } }
