            alt: { fr: "Un homme en costume sourit devant un bâtiment de briques ; derrière lui, une femme âgée au foulard blanc porte des photos de disparus", es: "Un hombre de traje sonríe ante un edificio de ladrillo; detrás, una mujer mayor con pañuelo blanco lleva fotos de desaparecidos" } },
          { t: "p", c: {
            fr: "Le 16 octobre 2008, le juge d'instruction <strong>Baltasar Garzón</strong>, connu pour avoir fait arrêter Pinochet à Londres en 1998 au nom de la compétence universelle, se déclare compétent pour enquêter sur les disparitions forcées commises de 1936 à 1951, qu'il chiffre à 114 226. Il les qualifie de crimes contre l'humanité, donc imprescriptibles et non couverts par l'amnistie. Dessaisi quelques semaines plus tard, il est poursuivi pour prévarication à la demande d'organisations d'extrême droite.",
            es: "El 16 de octubre de 2008, el juez de instrucción <strong>Baltasar Garzón</strong>, conocido por haber hecho detener a Pinochet en Londres en 1998 en nombre de la jurisdicción universal, se declara competente para investigar las desapariciones forzadas cometidas de 1936 a 1951, que cifra en 114 226. Las califica de crímenes contra la humanidad, por tanto imprescriptibles y no cubiertos por la amnistía. Apartado pocas semanas después, es procesado por prevaricación a instancia de organizaciones de extrema derecha." } },
          { t: "p", c: {
            fr: "Le 27 février 2012, le Tribunal suprême l'acquitte, tout en fermant la porte : les crimes du franquisme ne peuvent être jugés en Espagne, à cause de l'amnistie, de la prescription et de la non-rétroactivité de la loi pénale. Garzón a d'ailleurs déjà été exclu de la magistrature au début du même mois, condamné dans une autre affaire. Les victimes se tournent alors vers l'étranger : c'est la <em>querella argentina</em>, déposée à Buenos Aires en avril 2010 devant la juge María Servini, qui lance en 2013 des mandats d'arrêt contre d'anciens policiers accusés de torture ; l'Espagne refuse de les extrader.",
            es: "El 27 de febrero de 2012, el Tribunal Supremo lo absuelve, pero cierra la puerta: los crímenes del franquismo no pueden juzgarse en España, a causa de la amnistía, la prescripción y la irretroactividad de la ley penal. Garzón, por lo demás, ya había sido expulsado de la carrera judicial a principios de ese mismo mes, condenado en otra causa. Las víctimas se vuelven entonces hacia el extranjero: es la <em>querella argentina</em>, presentada en Buenos Aires en abril de 2010 ante la jueza María Servini, que dicta en 2013 órdenes de detención contra antiguos policías acusados de torturas; España se niega a extraditarlos." } },
          { t: "def", mot: { fr: "Compétence universelle", es: "Jurisdicción universal" }, c: {

            es: "Tras las elecciones autonómicas de mayo de 2023, los acuerdos de gobierno entre PP y Vox prevén en varias comunidades sustituir las leyes autonómicas de memoria por <strong>«leyes de concordia»</strong>. Aragón aprueba una en 2024 y la Comunidad Valenciana en 2025; en otros lugares, los proyectos se estancan tras la salida de Vox de los gobiernos autonómicos en julio de 2024. Estos textos se remontan a 1931, incluyen a las víctimas del terrorismo y suprimen los organismos encargados de las exhumaciones. El gobierno central acude al Tribunal Constitucional, que suspende varias de sus disposiciones." } },
