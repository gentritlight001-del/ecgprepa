            legende: { fr: "Décembre 1959 : Franco reçoit le président américain Dwight Eisenhower, signe que le dictateur est devenu un allié de l'Occident.", es: "Diciembre de 1959: Franco recibe al presidente estadounidense Dwight Eisenhower, señal de que el dictador se ha convertido en aliado de Occidente." },
            alt: { fr: "Photographie en noir et blanc : Eisenhower en chapeau et Franco en uniforme, debout parmi des officiels et des soldats", es: "Fotografía en blanco y negro: Eisenhower con sombrero y Franco de uniforme, de pie entre autoridades y soldados" } },
          { t: "p", c: {
            fr: "Pendant la Seconde Guerre mondiale, l'Espagne, ruinée, se déclare d'abord neutre, puis « non belligérante » en juin 1940. Le 23 octobre 1940, à <strong>Hendaye</strong>, Franco rencontre Hitler : il réclame trop (Gibraltar, le Maroc français, des vivres) pour un pays incapable de combattre, et l'Espagne n'entre pas en guerre. Elle envoie pourtant sur le front de l'Est la <strong>División Azul</strong>, environ 45 000 volontaires de 1941 à 1943, avant de revenir à la neutralité quand le vent tourne.",
            es: "Durante la Segunda Guerra Mundial, España, arruinada, se declara primero neutral y luego «no beligerante» en junio de 1940. El 23 de octubre de 1940, en <strong>Hendaya</strong>, Franco se reúne con Hitler: pide demasiado (Gibraltar, el Marruecos francés, víveres) para un país incapaz de combatir, y España no entra en la guerra. Envía sin embargo al frente del Este la <strong>División Azul</strong>, unos 45 000 voluntarios de 1941 a 1943, antes de volver a la neutralidad cuando cambia el viento." } },
          { t: "p", c: {

            es: "La victoria aliada aísla al régimen. El 12 de diciembre de 1946, la ONU recomienda a sus miembros retirar a sus embajadores de Madrid, y España queda excluida del plan Marshall. Franco borra entonces la fachada fascista y se presenta como baluarte católico contra el comunismo. La guerra fría lo salva: en 1953, el <strong>Concordato</strong> con la Santa Sede y los <strong>pactos de Madrid</strong> con Estados Unidos, que obtienen bases militares a cambio de ayuda económica, le devuelven una legitimidad internacional. España entra en la ONU en 1955, y la visita de Eisenhower en 1959 consagra esta rehabilitación." } }

  {

    titre: { fr: "Institutions, répression et économie", es: "Instituciones, represión y economía" },

    sections: [
      {
        titre: { fr: "Les Lois fondamentales : une dictature sans constitution", es: "Las Leyes Fundamentales: una dictadura sin constitución" },
        blocs: [
          { t: "p", c: {
            fr: "Le régime ne se dote jamais d'une constitution unique. Il construit par étapes, de 1938 à 1967, sept <strong>Lois fondamentales</strong> : le Fuero del Trabajo (1938), la loi constitutive des Cortes (1942), le Fuero de los Españoles (1945), la loi du référendum national (1945), la <strong>loi de succession</strong> (1947), les Principes du Mouvement national (1958) et la loi organique de l'État, approuvée par référendum en décembre 1966 et promulguée en janvier 1967. Ensemble, elles tiennent lieu de charte, mais une charte que Franco peut modifier seul, par décret ou par un référendum qu'il contrôle.",
            es: "El régimen nunca se dota de una constitución única. Construye por etapas, de 1938 a 1967, siete <strong>Leyes Fundamentales</strong>: el Fuero del Trabajo (1938), la Ley Constitutiva de las Cortes (1942), el Fuero de los Españoles (1945), la Ley del Referéndum Nacional (1945), la <strong>Ley de Sucesión</strong> (1947), los Principios del Movimiento Nacional (1958) y la Ley Orgánica del Estado, aprobada en referéndum en diciembre de 1966 y promulgada en enero de 1967. Juntas hacen las veces de carta magna, pero de una carta que Franco puede modificar solo, por decreto o mediante un referéndum que controla." } },
          { t: "p", c: {
            fr: "Les <strong>Cortes</strong>, créées en 1942, ne sont pas un parlement souverain : leurs membres, les <em>procuradores</em>, ne sont pas élus au suffrage universel mais désignés par « tiers » corporatistes (famille, municipalités, syndicat vertical). Elles discutent des projets de loi, mais Franco garde tout le pouvoir exécutif, légifère par décret-loi et nomme les juges des tribunaux d'exception. Le tableau suivant compare ce système à une démocratie parlementaire.",
            es: "Las <strong>Cortes</strong>, creadas en 1942, no son un parlamento soberano: sus miembros, los <em>procuradores</em>, no se eligen por sufragio universal sino que se designan por «tercios» corporativos (familia, municipios, sindicato vertical). Debaten los proyectos de ley, pero Franco conserva todo el poder ejecutivo, legisla por decreto-ley y nombra a los jueces de los tribunales de excepción. La tabla siguiente compara este sistema con una democracia parlamentaria." } },

          { t: "encadre", c: "var(--a4)",
            titre: { fr: "Un « royaume sans roi »", es: "Un «reino sin rey»" },
            c2: {
              fr: "La loi de succession de 1947, approuvée par référendum, fait de l'Espagne un royaume, mais sans roi : Franco en est le chef à vie et choisira lui-même son successeur « à titre de roi ». Ces lois ne limitent jamais son pouvoir ; elles l'organisent et préparent sa transmission.",
              es: "La Ley de Sucesión de 1947, aprobada en referéndum, convierte a España en un reino, pero sin rey: Franco es su jefe vitalicio y elegirá él mismo a su sucesor «a título de rey». Estas leyes nunca limitan su poder; lo organizan y preparan su transmisión." } }

      {
        titre: { fr: "Répression, censure et contrôle de la société", es: "Represión, censura y control de la sociedad" },
        blocs: [
          { t: "p", c: {
            fr: "Dès février 1939, la loi des responsabilités politiques punit rétroactivement tout soutien, même passif, à la République depuis 1934. Suivent des tribunaux militaires expéditifs, des camps de concentration, des bataillons de travailleurs forcés et des prisons surpeuplées. Les historiens estiment les exécutions de l'après-guerre entre 20 000 (Paul Preston) et plus de 50 000, selon les sources et les périodes retenues. Des centaines de milliers de républicains partent en <em>exil</em>, vers la France, le Mexique et l'Amérique latine, et l'Espagne perd pour des décennies une partie de ses intellectuels et de ses cadres.",
            es: "Ya en febrero de 1939, la Ley de Responsabilidades Políticas castiga con carácter retroactivo todo apoyo, incluso pasivo, a la República desde 1934. Siguen tribunales militares sumarísimos, campos de concentración, batallones de trabajadores forzados y cárceles abarrotadas. Los historiadores estiman las ejecuciones de la posguerra entre 20 000 (Paul Preston) y más de 50 000, según las fuentes y los periodos considerados. Cientos de miles de republicanos se marchan al <em>exilio</em>, hacia Francia, México y América Latina, y España pierde durante décadas a parte de sus intelectuales y cuadros." } },
          { t: "p", c: {
            fr: "Le contrôle passe aussi par la <strong>censure</strong> préalable de la presse, du cinéma et des livres, que la loi de presse de Manuel Fraga (1966) remplace par des sanctions après publication, ce qui pousse à l'autocensure. L'école, largement confiée à l'Église, diffuse une morale national-catholique stricte. Les femmes, encadrées par la Section féminine de la Phalange, perdent les droits acquis sous la République : il leur faut l'autorisation du mari, le <em>permiso marital</em>, pour travailler, ouvrir un compte ou signer un contrat, jusqu'à sa suppression en 1975.",
            es: "El control pasa también por la <strong>censura</strong> previa de la prensa, el cine y los libros, que la Ley de Prensa de Manuel Fraga (1966) sustituye por sanciones a posteriori, lo que empuja a la autocensura. La escuela, confiada en gran parte a la Iglesia, difunde una moral nacionalcatólica estricta. Las mujeres, encuadradas por la Sección Femenina de la Falange, pierden los derechos adquiridos con la República: necesitan la autorización del marido, la <em>licencia marital</em>, para trabajar, abrir una cuenta o firmar un contrato, hasta su supresión en 1975." } },

      {
        titre: { fr: "De l'autarcie au « miracle » espagnol", es: "De la autarquía al «milagro» español" },
        blocs: [
          { t: "image", src: "images/franquisme-cartilla-1945.webp", l: 1280, h: 853, format: "gauche",
            titre: { fr: "La carte de rationnement", es: "La cartilla de racionamiento" },
            legende: { fr: "Carnet de tickets de 1945 : le rationnement des vivres dure en Espagne jusqu'en 1952.", es: "Cartilla de cupones de 1945: el racionamiento de alimentos dura en España hasta 1952." },
            alt: { fr: "Un carnet ouvert de l'« Estado español » avec des colonnes de coupons numérotés", es: "Una cartilla abierta del «Estado español» con columnas de cupones numerados" } },
          { t: "p", c: {
            fr: "De 1939 à 1959, le régime choisit l'<strong>autarcie</strong> : fermeture aux échanges, contrôle des prix et de la production, rationnement par la <em>cartilla</em>, maintenu jusqu'en 1952. Le résultat est un marasme durable, aggravé par l'isolement : les années 1940 sont celles de la faim, et le marché noir, l'<em>estraperlo</em>, enrichit les mieux placés. Il faut attendre le début des années 1950 pour que la production retrouve son niveau d'avant-guerre.",
            es: "De 1939 a 1959, el régimen elige la <strong>autarquía</strong>: cierre a los intercambios, control de precios y de la producción, racionamiento mediante la <em>cartilla</em>, mantenida hasta 1952. El resultado es un marasmo duradero, agravado por el aislamiento: los años cuarenta son los del hambre, y el mercado negro, el <em>estraperlo</em>, enriquece a los mejor situados. Hay que esperar a principios de los años cincuenta para que la producción recupere su nivel de antes de la guerra." } },
          { t: "p", c: {
            fr: "Au bord de la faillite, Franco fait entrer au gouvernement en 1957 des <strong>technocrates</strong> liés à l'Opus Dei (Alberto Ullastres, Mariano Navarro Rubio, puis Laureano López Rodó). Avec l'appui du FMI et de l'OCDE, ils lancent en juillet 1959 le <strong>Plan de stabilisation</strong> : dévaluation de la peseta, ouverture aux capitaux étrangers, fin de l'autarcie. Les plans de développement (1964, 1968, 1972) accompagnent ensuite une croissance d'environ 7 % par an dans les années 1960, la plus forte du monde développé après celle du Japon.",
            es: "Al borde de la quiebra, Franco hace entrar en el gobierno en 1957 a <strong>tecnócratas</strong> vinculados al Opus Dei (Alberto Ullastres, Mariano Navarro Rubio y luego Laureano López Rodó). Con el apoyo del FMI y de la OCDE, lanzan en julio de 1959 el <strong>Plan de Estabilización</strong>: devaluación de la peseta, apertura a los capitales extranjeros, fin de la autarquía. Los planes de desarrollo (1964, 1968, 1972) acompañan después un crecimiento de alrededor del 7 % anual en los años sesenta, el más fuerte de Europa y solo superado por Japón en el mundo desarrollado." } },
          { t: "encadre", c: "var(--a3)",
            titre: { fr: "Débat : un miracle grâce à la dictature ?", es: "Debate: ¿un milagro gracias a la dictadura?" },
            c2: {
              fr: "Les historiens divergent. Les uns créditent les réformes des technocrates ; les autres rappellent que l'Espagne profite surtout de la croissance européenne des Trente Glorieuses, par le tourisme et les envois d'argent des émigrés, et que la dictature a d'abord coûté deux décennies d'autarcie.",
              es: "Los historiadores discrepan. Unos atribuyen el mérito a las reformas de los tecnócratas; otros recuerdan que España se beneficia sobre todo del crecimiento europeo de los Treinta Gloriosos, mediante el turismo y las remesas de los emigrantes, y que la dictadura costó primero dos décadas de autarquía." } }

          { t: "p", c: {

5\" rx=\"6\" fill=\"var(--c1)\"/><text x=\"240\" y=\"55.5\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"var(--encre)\">31,6 M</text><text x=\"240\" y=\"236\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--encre2)\">1973</text><rect x=\"330\" y=\"84.7\" width=\"100\" height=\"125.3\" rx=\"6\" fill=\"var(--c2)\"/><text x=\"380\" y=\"74.7\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"var(--encre)\">27,4 M</text><text x=\"380\" y=\"236\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--encre2)\">1975</text></g></svg>" },

      {
        titre: { fr: "Une opposition qui grandit", es: "Una oposición que crece" },
        blocs: [
          { t: "p", c: {
            fr: "À partir de la fin des années 1950, l'opposition se diversifie malgré la répression. Les étudiants manifestent à Madrid dès 1956 ; les <strong>Commissions ouvrières</strong> (Comisiones Obreras), syndicat clandestin né à la fin des années 1950, organisent des grèves alors que les syndicats libres sont interdits ; le Parti communiste, dirigé depuis l'exil par Santiago Carrillo, coordonne une résistance souterraine. Au Pays basque naît en 1959 l'<strong>ETA</strong>, qui commet son premier assassinat en 1968. Le procès de Burgos (1970), où seize militants basques sont jugés par un tribunal militaire, provoque une vague de protestations en Europe.",
            es: "A partir de finales de los años cincuenta, la oposición se diversifica pese a la represión. Los estudiantes se manifiestan en Madrid ya en 1956; las <strong>Comisiones Obreras</strong>, sindicato clandestino nacido a finales de los cincuenta, organizan huelgas cuando los sindicatos libres están prohibidos; el Partido Comunista, dirigido desde el exilio por Santiago Carrillo, coordina una resistencia clandestina. En el País Vasco nace en 1959 <strong>ETA</strong>, que comete su primer asesinato en 1968. El proceso de Burgos (1970), en el que dieciséis militantes vascos son juzgados por un tribunal militar, provoca una oleada de protestas en Europa." } },

      {

            legende: { fr: "Franco et le prince Juan Carlos, en uniforme, dans une tribune officielle au début des années 1970.", es: "Franco y el príncipe Juan Carlos, de uniforme, en una tribuna oficial a principios de los años setenta." },
            alt: { fr: "Photographie en noir et blanc : Juan Carlos, jeune, en casquette militaire, se tient derrière Franco âgé, en lunettes noires", es: "Fotografía en blanco y negro: Juan Carlos, joven, con gorra militar, detrás de un Franco anciano con gafas oscuras" } },
          { t: "p", c: {
            fr: "Le 22 juillet 1969, Franco désigne comme successeur « à titre de roi » <strong>Juan Carlos de Bourbon</strong>, petit-fils d'Alphonse XIII, en écartant son père, don Juan, jugé trop libéral. Il mise sur un prince élevé en Espagne sous sa tutelle. Pour garantir la continuité, il nomme en 1973 président du gouvernement l'amiral <strong>Luis Carrero Blanco</strong>, son plus fidèle bras droit. Mais le 20 décembre 1973, l'ETA le tue à Madrid en faisant exploser une charge sous sa voiture : le pilier du « continuisme » disparaît.",
