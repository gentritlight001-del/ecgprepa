            es: "El referéndum del <strong>23 de junio de 2016</strong> sitúa a Gibraltar en una situación paradójica: el 96 % de sus electores vota por permanecer en la Unión Europea, pero el resultado nacional lo arrastra fuera (ver el <a href=\"../../anglais/royaume-uni/civi-uk-3.html\">capítulo 3 de civilización británica</a>). Ahora bien, unos <strong>15 000 trabajadores transfronterizos</strong>, en su mayoría españoles, cruzan cada día la frontera: según Fabian Picardo, ministro principal de Gibraltar, forman casi la mitad de la población activa del territorio. Un «Brexit duro» podría haber roto esta interdependencia." } },
          { t: "p", c: {
            fr: "Un accord politique de dernière minute, conclu le <strong>31 décembre 2020</strong>, évite une frontière dure le jour même de la fin de la période de transition. Il ne devait être que provisoire : il ouvre en fait plusieurs années de négociations entre la Commission européenne, le Royaume-Uni et l'Espagne, auxquelles participe le gouvernement de Gibraltar sans en être partie décisionnaire.",
            es: "Un acuerdo político de última hora, alcanzado el <strong>31 de diciembre de 2020</strong>, evita una frontera dura el mismo día del final del periodo de transición. Debía ser sólo provisional: en realidad abre varios años de negociaciones entre la Comisión Europea, el Reino Unido y España, en las que participa el Gobierno de Gibraltar sin ser parte decisoria." } }

            legende: {"fr": "Frontière entre l'Espagne et Gibraltar, 26 juillet 2026 : le poste frontière, vu côté espagnol, au pied du Rocher.", "es": "Frontera entre España y Gibraltar, 26 de julio de 2026: el puesto fronterizo, visto desde el lado español, al pie del Peñón."},

          { t: "p", c: {
            fr: "L'<strong>accord UE-Royaume-Uni relatif à Gibraltar</strong> est signé le <strong>14 juillet 2026</strong> à Bruxelles par Maroš Šefčovič pour l'Union, Stephen Doughty pour le Royaume-Uni, José Manuel Albares pour l'Espagne et Fabian Picardo pour Gibraltar. Il s'applique à titre provisoire dès le 15 juillet, en attendant la ratification, qui passe par le Parlement européen. Dès ce jour, la <strong>Verja</strong> n'a plus de contrôle de passeport : les résidents passent en Espagne avec leur carte de résident, et les Espagnols entrent à Gibraltar avec leur carte d'identité.",
            es: "El <strong>acuerdo UE-Reino Unido relativo a Gibraltar</strong> se firma el <strong>14 de julio de 2026</strong> en Bruselas por Maroš Šefčovič por la Unión, Stephen Doughty por el Reino Unido, José Manuel Albares por España y Fabian Picardo por Gibraltar. Se aplica con carácter provisional desde el 15 de julio, a la espera de la ratificación, que pasa por el Parlamento Europeo. Desde ese día, la <strong>Verja</strong> ya no tiene control de pasaportes: los residentes pasan a España con su tarjeta de residente, y los españoles entran en Gibraltar con su documento de identidad." } },

var(--encre)\">contrôle conjoint</text>\n<text x=\"270\" y=\"129\" font-size=\"12.5\" fill=\"var(--encre)\">Espagne : Schengen,</text>\n<text x=\"270\" y=\"150\" font-size=\"12.5\" fill=\"var(--encre)\">permis de séjour</text>\n<text x=\"270\" y=\"171\" font-size=\"12.5\" fill=\"var(--encre)\">Marchandises :</text>\n<text x=\"270\" y=\"192\" font-size=\"12.5\" fill=\"var(--encre)\">douane espagnole</text>\n<path d=\"M206 115 L252 115\" fill=\"none\" stroke=\"var(--encre2)\" stroke-width=\"2.4\" marker-end=\"url(#fl20)\"/>\n</g></svg>", es: "<svg viewBox=\"0 0 460 230\" role=\"img\" aria-label=\"Dos columnas: antes del 15 de julio de 2026, una Verja con controles de pasaporte y de aduana en la frontera terrestre; desde entonces, sin control de pasaportes en la Verja, control conjunto en el aeropuerto y el puerto, controles Schengen asumidos por España.\">\n<defs><marker id=\"fl20\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"var(--encre2)\"/></marker></defs>\n<g font-family=\"var(--texte)\">\n<rect x=\"6\" y=\"10\" width=\"196\" height=\"212\" rx=\"10\" fill=\"#fff\" stroke=\"var(--c1)\" stroke-width=\"2.4\"/><rect x=\"6\" y=\"10\" width=\"196\" height=\"32\" rx=\"10\" fill=\"var(--c1)\"/><rect x=\"6\" y=\"28\" width=\"196\" height=\"14\" fill=\"var(--c1)\"/>\n<text x=\"104.0\" y=\"32\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"800\" fill=\"#fff\">Antes del 15 de julio</text>\n<text x=\"18\" y=\"66\" font-size=\"12.5\" fill=\"var(--encre)\">Verja: control de pasaporte</text>\n<text x=\"18\" y=\"87\" font-size=\"12.5\" fill=\"var(--encre)\">Aduana en la frontera</text>\n<text x=\"18\" y=\"108\" font-size=\"12.5\" fill=\"var(--encre)\">terrestre</text>\n<text x=\"18\" y=\"129\" font-size=\"12.5\" fill=\"var(--encre)\">Colas</text>\n<rect x=\"258\" y=\"10\" width=\"196\" height=\"212\" rx=\"10\" fill=\"#fff\" stroke=\"var(--c3)\" stroke-width=\"2.4\"/><rect x=\"258\"             legende: { fr: "Schéma simplifié, d'après le ministère espagnol des Affaires étrangères (14 juillet 2026) et la presse. Les marchandises sont contrôlées par l'Espagne ; les voyageurs non Schengen passent par le système européen EES.", es: "Esquema simplificado, según el Ministerio español de Asuntos Exteriores (14 de julio de 2026) y la prensa. Las mercancías las controla España; los viajeros no Schengen pasan por el sistema europeo EES." } },
          { t: "p", c: {
            fr: "Le traité crée aussi une <strong>union douanière</strong> entre l'UE et Gibraltar, où s'appliquera un impôt indirect équivalent à la TVA (15 % au début, puis une hausse vers 17 % en trois ans selon la presse), avec des règles européennes sur le tabac. Il prévoit une coopération policière et la protection des travailleurs frontaliers. Il protège le fonctionnement autonome des installations militaires britanniques, mais une polémique porte sur l'exemption de certains militaires britanniques des contrôles Schengen.",
            es: "El tratado crea también una <strong>unión aduanera</strong> entre la UE y Gibraltar, donde se aplicará un impuesto indirecto equivalente al IVA (15 % al principio, y después una subida hacia el 17 % en tres años según la prensa), con normas europeas sobre el tabaco. Prevé una cooperación policial y la protección de los trabajadores transfronterizos. Protege el funcionamiento autónomo de las instalaciones militares británicas, pero una polémica se centra en la exención de ciertos militares británicos de los controles Schengen." } }
        ]

      {
        titre: { fr: "Réactions et premiers effets", es: "Reacciones y primeros efectos" },
        blocs: [

            legende: {"fr": "Fabian Picardo, ministre en chef de Gibraltar, lors d'une conférence de presse, en janvier 2018.", "es": "Fabian Picardo, ministro principal de Gibraltar, en una rueda de prensa, en enero de 2018."},
            alt: {"fr": "Un homme en costume sombre s'exprime devant deux micros, à côté d'un drapeau européen", "es": "Un hombre con traje oscuro habla ante dos micrófonos, junto a una bandera europea"} },
          { t: "p", c: {
            fr: "À Madrid, le gouvernement défend un accord qui « ne change pas une virgule » à la revendication espagnole sur la souveraineté, selon José Manuel Albares. L'article 2 du traité précise qu'il ne constitue la base d'aucune affirmation ni négation de souveraineté. Le <strong>PP</strong> et <strong>Vox</strong> dénoncent au contraire une perte de position, parlent de cession pour Vox, et réclament un vote du Congrès, que le gouvernement juge inutile, la ratification du Parlement européen et l'accord unanime du Conseil suffisant à ses yeux (voir le <a href=\"civi-esp-11.html\">chapitre 11</a>).",
            es: "En Madrid, el Gobierno defiende un acuerdo que «no cambia una coma» de la reivindicación española sobre la soberanía, según José Manuel Albares. El artículo 2 del tratado precisa que no constituye la base de ninguna afirmación ni negación de soberanía. El <strong>PP</strong> y <strong>Vox</strong> denuncian, por el contrario, una pérdida de posición, hablan de cesión en el caso de Vox, y reclaman una votación del Congreso, que el Gobierno juzga innecesaria, pues considera suficientes la ratificación del Parlamento Europeo y el acuerdo unánime del Consejo (ver el <a href=\"civi-esp-11.html\">capítulo 11</a>)." } },
          { t: "p", c: {
            fr: "Sur le terrain, les premiers jours marquent la fin des files d'attente à la frontière, mais de nouvelles formalités douanières créent des files de camions, le 23 juillet, et des policiers nationaux craignent que le dispositif relègue le contrôle espagnol et donne plus de poids à Frontex. À Gibraltar, le Parlement a approuvé le traité à l'unanimité, et Fabian Picardo, qui le présente comme un bouclier pour les travailleurs frontaliers, a annoncé le 19 octobre 2026 sa prochaine retraite. Des élections générales ont lieu en Espagne le 29 novembre 2026 : Picardo juge qu'un éventuel gouvernement PP-Vox serait « bête » de défaire l'accord.",
            es: "Sobre el terreno, los primeros días marcan el fin de las colas en la frontera, pero nuevos trámites aduaneros crean colas de camiones el 23 de julio, y policías nacionales temen que el dispositivo relegue el control español y dé más peso a Frontex. En Gibraltar, el Parlamento aprobó el tratado por unanimidad, y Fabian Picardo, que lo presenta como un escudo para los trabajadores transfronterizos, anunció el 19 de octubre de 2026 su próxima retirada. En España hay elecciones generales el 29 de noviembre de 2026: Picardo estima que un eventual gobierno PP-Vox sería «tonto» si deshiciera el acuerdo." } }

      {
        titre: { fr: "Un accord fonctionnel, pas un règlement de souveraineté", es: "Un acuerdo funcional, no un arreglo de soberanía" },
        blocs: [
          { t: "encadre", c: "var(--a3)",
            titre: { fr: "Frontière ouverte, souveraineté intacte", es: "Frontera abierta, soberanía intacta" },
            c2: {
              fr: "Ne pas confondre la disparition de la <strong>frontière physique</strong> avec un règlement de la <strong>souveraineté</strong>. Le traité préserve les positions juridiques de l'Espagne (qui réclame toujours la rétrocession) et du Royaume-Uni (qui garde sa souveraineté) : c'est un accord pratique sur la circulation des personnes et des marchandises. Il est aussi provisoire : l'Espagne a l'initiative de le suspendre, d'appliquer des sauvegardes ou d'y mettre fin.",
              es: "No hay que confundir la desaparición de la <strong>frontera física</strong> con un arreglo de la <strong>soberanía</strong>. El tratado preserva las posiciones jurídicas de España (que sigue reclamando la retrocesión) y del Reino Unido (que conserva su soberanía): es un acuerdo práctico sobre la circulación de personas y mercancías. Es también provisional: España tiene la iniciativa de suspenderlo, aplicar salvaguardas o ponerle fin."
            } },
          { t: "p", c: {
            fr: "Le débat oppose une lecture <strong>fonctionnaliste</strong>, pour qui il faut régler les problèmes concrets de circulation et d'emploi sans attendre une solution sur la souveraineté, à une lecture <strong>souverainiste</strong>, qui voit dans la coopération renforcée un renoncement de fait. Pour l'Espagne, l'accord est un paradoxe : elle gagne un rôle sans précédent depuis 1713 (contrôles Schengen, mot final sur les séjours), mais elle ne gagne rien sur le fond. Son succès dépendra de la ratification, de la façon dont la frontière fonctionnera au quotidien et de la stabilité politique des deux côtés, y compris à Madrid après les élections de novembre 2026. La même question de frontière extérieure européenne se pose à Ceuta et Melilla (voir le <a href=\"civi-esp-13.html\">chapitre 13</a>).",
            es: "El debate opone una lectura <strong>funcionalista</strong>, para la que hay que resolver los problemas concretos de circulación y empleo sin esperar una solución sobre la soberanía, a una lectura <strong>soberanista</strong>, que ve en la cooperación reforzada una renuncia de hecho. Para España, el acuerdo es una paradoja: gana un papel sin precedentes desde 1713 (controles Schengen, última palabra sobre las residencias), pero no gana nada en el fondo. Su éxito dependerá de la ratificación, de cómo funcione la frontera en el día a día y de la estabilidad política de ambos lados, incluida Madrid tras las elecciones de noviembre de 2026. La misma cuestión de frontera exterior europea se plantea en Ceuta y Melilla (ver el <a href=\"civi-esp-13.html\">capítulo 13</a>)." } }
        ]
