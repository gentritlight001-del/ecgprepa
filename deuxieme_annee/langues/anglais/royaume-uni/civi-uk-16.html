          "titre": {
            "fr": "Un prêt remboursé selon le revenu",

          "blocs": [

              "t": "p",
              "c": {
                "fr": "Les étudiants ne paient pas les frais au moment de l'inscription : un <strong>prêt public</strong> les couvre, avec une part des frais de vie. Le remboursement est prélevé sur le salaire <strong>seulement au-delà d'un seuil de revenu</strong> (9 % de la part qui dépasse le seuil) et le solde est <strong>effacé</strong> après 30 ans pour les étudiants entrés de 2012 à 2022 (« Plan 2 ») et après 40 ans pour ceux entrés depuis 2023 (« Plan 5 », seuil de 25 000 £). La logique ressemble donc moins à celle d'un crédit bancaire qu'à celle d'un <strong>impôt différé</strong> sur les diplômés.",
                "en": "Students do not pay fees upfront: a <strong>public loan</strong> covers them, plus part of living costs. Repayment is deducted from salary <strong>only above an income threshold</strong> (9% of the part above the threshold) and the balance is <strong>written off</strong> after 30 years for those who entered in 2012-2022 (“Plan 2”) and after 40 years for those entering since 2023 (“Plan 5”, threshold £25,000). The logic is therefore less that of a bank loan than of a <strong>deferred tax</strong> on graduates."
              }
            },
            {
              "t": "p",
              "c": {
                "fr": "Les montants sont pourtant élevés : la dette moyenne des emprunteurs du Plan 2 atteint <strong>52 100 £</strong> (DfE). Beaucoup de diplômés à salaire moyen ne la rembourseront jamais entièrement, tandis que les intérêts font grossir la dette tant qu'ils la remboursent. Les défenseurs du système soulignent que les bas salaires sont protégés et que les non-diplômés ne financent pas l'université par l'impôt ; ses critiques y voient un fardeau psychologique et une dissuasion pour les jeunes de milieux modestes.",
                "en": "The sums are nonetheless high: the mean debt of Plan 2 borrowers reaches <strong>£52,100</strong> (DfE). Many average-earning graduates will never repay it in full, while interest makes the debt grow as long as they repay. Defenders of the system stress that low earners are protected and non-graduates do not fund university through taxes; critics see a psychological burden and a deterrent for young people from modest backgrounds."
              }
            },
            {
              "t": "encadre",
              "icon": "⚠️",
              "c": "var(--a4)",
              "titre": {
                "fr": "Dette nominale et poids réel",
                "en": "Nominal debt and real burden"
              },
              "c2": {
                "fr": "Distinguer le <strong>montant affiché</strong> de la dette, souvent spectaculaire, de son <strong>coût réel</strong>, qui dépend du salaire : un diplômé à bas revenu rembourse peu, puis voit le solde effacé. On ne compare donc pas ce système au modèle américain, où les prêts restent dus quel que soit le revenu.",
                "en": "Distinguish the <strong>headline amount</strong> of the debt, often spectacular, from its <strong>real cost</strong>, which depends on earnings: a low-income graduate repays little, then sees the balance written off. The system should therefore not be compared with the American model, where loans remain due regardless of income."

              "c": {
                "fr": "Les frais n'ont pas mis les universités à l'abri : gelés pendant huit ans, ils ont perdu de la valeur réelle, et les établissements ont compensé en recrutant des <strong>étudiants étrangers</strong>, dont les frais ne sont pas plafonnés. Selon l'<em>Office for Students</em>, <strong>36 %</strong> des établissements anglais ont déclaré un déficit sur l'exercice le plus récent. Or le nombre d'étudiants internationaux a reculé de 7,7 % en 2024-2025, après le durcissement des règles d'immigration.",
                "en": "Fees have not protected universities: frozen for eight years, they lost real value, and institutions compensated by recruiting <strong>international students</strong>, whose fees are uncapped. According to the <em>Office for Students</em>, <strong>36%</strong> of English institutions reported a deficit in the latest year. Yet the number of international students fell by 7.7% in 2024-25, after the tightening of immigration rules."

                "en": "The Labour government answered with the October 2025 post-16 education white paper: annual indexation of fees to inflation, an announced <strong>£925 levy per international student</strong> from 2028 and a gradual return of maintenance grants by the end of the decade. The stakes go beyond management: a sector that attracts the world must fund its research without depending on students whom migration policy deters."

            {
              "t": "p",
              "c": {
                "fr": "<strong>Ofsted</strong> (<em>Office for Standards in Education</em>), créé en 1992, inspecte les écoles anglaises. Jusqu'en 2024, il attribuait à chacune une <strong>note globale en un mot</strong>, d'<span class='en'>« outstanding »</span> à <span class='en'>« inadequate »</span>, que la presse locale et les parents lisent comme un classement. En novembre 2022, l'école primaire de Caversham, près de Reading, passe d'<span class='en'>« outstanding »</span> à <span class='en'>« inadequate »</span> ; sa directrice <strong>Ruth Perry</strong> se suicide en janvier 2023, avant la publication du rapport. En décembre 2023, la coroner conclut que l'inspection a contribué à sa mort.",
                "en": "<strong>Ofsted</strong> (the <em>Office for Standards in Education</em>), created in 1992, inspects English schools. Until 2024 it gave each one an <strong>overall one-word grade</strong>, from <span class='en'>“outstanding”</span> to <span class='en'>“inadequate”</span>, which local press and parents read as a ranking. In November 2022, Caversham primary school, near Reading, fell from <span class='en'>“outstanding”</span> to <span class='en'>“inadequate”</span>; its headteacher <strong>Ruth Perry</strong> took her own life in January 2023, before the report was published. In December 2023, the coroner concluded that the inspection had contributed to her death."
              }
            },
            {
              "t": "p",
              "c": {
                "fr": "Le drame mobilise les syndicats d'enseignants. En <strong>septembre 2024</strong>, le gouvernement travailliste supprime les notes globales en un mot. Depuis le <strong>10 novembre 2025</strong>, Ofsted publie des <strong>« report cards »</strong> : au lieu d'une note unique, un barème en cinq niveaux (de « exceptionnel » à « amélioration urgente ») dans six domaines, la protection des élèves étant jugée à part (« remplie » ou « non remplie »). Les écoles pas encore réinspectées gardent leur ancienne note jusqu'à leur prochain contrôle.",
                "en": "The tragedy mobilised teachers' unions. In <strong>September 2024</strong>, the Labour government scrapped one-word overall grades. Since <strong>10 November 2025</strong>, Ofsted has published <strong>“report cards”</strong>: instead of a single grade, a five-level scale (from “exceptional” to “urgent improvement”) across six areas, with safeguarding judged separately (“met” or “not met”). Schools not yet reinspected keep their old grade until their next inspection."
              }

                "en": "Do not write that inspection has disappeared: only the <strong>single-word overall grade</strong> is replaced by a more detailed report. Ofsted still inspects schools; unions see the reform as useful but wait to see whether pressure really falls."

                "en": "English schools lack teachers, especially in science, mathematics and languages. The causes are well known: pay seen as too low against other careers, a heavy <strong>workload</strong>, burnout after the pandemic. The government pledged to recruit <strong>6,500 additional teachers</strong> and published a delivery plan in February 2026. Results are disputed: the department points to secondary vacancies at a five-year low, but the total number of state-school teachers fell by about 1,900 in a year according to its own figures, and secondary initial training remains well short of its targets."

                "en": "Pupils with <strong>special educational needs</strong> (<span class='en'>SEND</span>) are the other pressure point. More than 600,000 children have a legal support plan, the <span class='en'>EHCP</span>, whose cost weighs on local budgets. The white paper <em>Every Child Achieving and Thriving</em> of <strong>23 February 2026</strong> proposes to reserve the EHCP for the most complex needs and to create individual support plans guaranteed in mainstream schools, backed by £4 billion. Parent groups and charities fear that the EHCP's retreat will weaken an enforceable right; the government promises more inclusion instead."

                "en": "The state sector is changing too. Since September 2026, all children in families receiving <em>Universal Credit</em> are entitled to <strong>free school meals</strong>, about 500,000 more pupils. And the <em>Curriculum and Assessment Review</em> delivered on <strong>5 November 2025</strong> recommends scrapping the <em>EBacc</em> measure that had constrained subject choices, and creating <strong>“V-levels”</strong>, a third route beside A-levels and T-levels, whose first courses would start in 2027. The government pledges for its part to shorten GCSE exams by two and a half to three hours on average."

    "q": {
      "fr": "Le système éducatif britannique garantit-il l'égalité des chances, malgré ses examens précoces, ses écoles privées et ses frais universitaires ?",
      "en": "Does the British education system guarantee equal opportunity despite early exams, private schools and university fees?"
    },
    "these": {
