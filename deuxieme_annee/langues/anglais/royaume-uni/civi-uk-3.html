<!DOCTYPE html>
<html lang="fr" data-langue="anglais">
<head>
<script src="../../../../auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Brexit — Civilisation Anglophone</title>
<link rel="stylesheet" href="../../../../fonts/fonts.css">

<!-- ══════════════════════════════════════════════════════════════════════
     GABARIT DE COURS DE CIVILISATION « MANUEL » (v2, illustré)
     Le contenu est dans le bloc de données (id="donnees") en bas de page.
     Blocs disponibles : p, encadre, citation, def, liste, faits, tl, stats,
     tableau, image, images, graphique, periodes, echelle, schema.
     Les couleurs viennent de data-langue (anglais, espagnol, allemand).
     ══════════════════════════════════════════════════════════════════════ -->

<style>
/* Proposition D « Manuel » : un manuel scolaire haut de gamme. Page blanche, ouverture de chapitre avec grand numéro,
   texte large, chronologie collée à droite, photos dans le texte. Toutes les couleurs viennent de 4 jetons par langue. */
:root{
  --c1:#1f3a68; --c2:#b3282d; --c3:#2f7d62; --c4:#8a5a9e;
  --page:#ffffff; --fond:color-mix(in srgb,var(--c1) 4%,#ffffff); --encre:#1c1f26; --encre2:#5b6070; --filet:#e3e5ea;
  --titre:'Literata',Georgia,serif; --texte:'Figtree',system-ui,sans-serif;
  color-scheme:light;
}
html[data-langue="espagnol"]{--c1:#a3261f;--c2:#c08310;--c3:#2f7a5c;--c4:#5a4e9a}
html[data-langue="allemand"]{--c1:#2a2f36;--c2:#b8292f;--c3:#a67c0c;--c4:#34698f}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--encre);font:400 17px/1.65 var(--texte)}
#cours{padding-inline:16px}
a{color:inherit}
.ton-1{--t:var(--c1)} .ton-2{--t:var(--c2)} .ton-3{--t:var(--c3)} .ton-4{--t:var(--c4)}
.etiquette{font:700 .74rem/1 var(--texte);letter-spacing:.12em;text-transform:uppercase;color:var(--c1);margin:0 0 16px}

.barre{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:20px;margin-inline:-16px;padding:12px 24px;
  background:var(--page);border-bottom:1px solid var(--filet)}
.logo{font:700 1.08rem var(--titre);text-decoration:none;color:var(--c1)}
.ariane{flex:1;font-size:.82rem;color:var(--encre2);display:flex;gap:8px;flex-wrap:wrap;min-width:0}
.ariane i{font-style:normal;opacity:.4} .ariane b{color:var(--encre);font-weight:600}
.langues{margin-left:auto;display:flex;background:var(--fond);border-radius:8px;padding:3px}
.langues button{font:700 .74rem var(--texte);letter-spacing:.06em;border:0;background:none;color:var(--encre2);padding:6px 12px;border-radius:6px;cursor:pointer}
.langues button.on{background:var(--c1);color:#fff}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--c2);outline-offset:2px}
.progression{position:fixed;left:0;right:0;top:0;height:3px;z-index:11} .progression span{display:block;height:100%;width:0;background:var(--c2)}

.heros{max-width:1240px;margin:28px auto 0;background:var(--page);border-radius:18px;border:1px solid var(--filet);padding:48px 48px 36px;overflow:hidden}
.heros-in{position:relative}
.heros-chap{position:absolute;right:-8px;top:-40px;font:700 clamp(7rem,18vw,13rem)/1 var(--titre);color:color-mix(in srgb,var(--c1) 9%,transparent);letter-spacing:-.04em;pointer-events:none}
.heros-label{display:flex;align-items:center;gap:10px;font:700 .78rem var(--texte);letter-spacing:.12em;text-transform:uppercase;color:var(--c2);margin:0 0 16px}
.heros-drapeau{font-size:1.3rem;letter-spacing:0}
.heros h1{position:relative;font:700 clamp(2.4rem,6vw,4.2rem)/1.04 var(--titre);letter-spacing:-.02em;margin:0 0 16px;max-width:15em;text-wrap:balance;color:var(--c1)}
.heros-sous{position:relative;font-size:1.12rem;color:var(--encre2);max-width:52ch;margin:0 0 28px;text-wrap:pretty}
.heros-meta{list-style:none;margin:0;padding:20px 0 0;border-top:1px solid var(--filet);display:flex;flex-wrap:wrap;gap:8px 32px;font-size:.88rem;color:var(--encre2)}
.heros-meta b{font:700 1.3rem var(--titre);color:var(--encre);margin-right:4px;font-variant-numeric:tabular-nums}

.essentiel{max-width:1240px;margin:20px auto 0;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.ess-texte{background:var(--page);border:1px solid var(--filet);border-radius:18px;padding:28px 32px;min-width:0}
.ess-texte p{margin:0;font:400 1.1rem/1.7 var(--titre)}
.ess-chiffres{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chiffre{background:var(--c1);color:#fff;border-radius:16px;padding:18px 20px}
.chiffre:nth-child(2){background:var(--c2)} .chiffre:nth-child(3){background:var(--c3)} .chiffre:nth-child(4){background:var(--c4)}
.chiffre b{display:block;font:700 1.8rem/1.1 var(--titre);font-variant-numeric:tabular-nums}
.chiffre span{display:block;font-size:.8rem;line-height:1.35;opacity:.9;margin-top:4px}

.page{max-width:1240px;margin:20px auto 0;display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;align-items:start}
.frise{position:sticky;top:72px;max-height:calc(100vh - 92px);overflow:auto;background:var(--page);border:1px solid var(--filet);border-radius:18px;padding:20px;scrollbar-width:thin}
.frise ol{list-style:none;margin:0;padding:0}
.frise li{padding:10px 0 10px 16px;border-left:2px solid var(--filet);position:relative;font-size:.8rem;line-height:1.4}
.frise li::before{content:'';position:absolute;left:-6px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--page);border:2px solid var(--c2)}
.frise .d{display:block;font-weight:700;color:var(--c1)} .frise .c{color:var(--encre2)} .frise strong{color:var(--encre)}

.corps{background:var(--page);border:1px solid var(--filet);border-radius:18px;padding:44px 56px;min-width:0}
.partie+.partie{margin-top:56px;padding-top:40px;border-top:1px solid var(--filet)}
.partie-tete{margin-bottom:8px}
.partie-num{display:none}
.partie-kicker{display:inline-block;font:700 .74rem var(--texte);letter-spacing:.1em;text-transform:uppercase;color:var(--t);background:color-mix(in srgb,var(--t) 10%,transparent);padding:5px 10px;border-radius:6px;margin:0 0 12px}
.partie h2{font:700 clamp(1.6rem,3vw,2.1rem)/1.15 var(--titre);margin:0;text-wrap:balance}
.sous{margin-top:32px}
.sous h3{display:flex;gap:12px;align-items:baseline;font:600 1.25rem/1.3 var(--titre);margin:0 0 12px;text-wrap:balance}
.sous-num{flex-shrink:0;font:700 .8rem var(--texte);color:var(--t);font-variant-numeric:tabular-nums}
.b-p{margin:0 0 14px} .b-p .en{font-style:italic;color:var(--c1)}
.b-encadre{margin:20px 0;padding:18px 20px;border-radius:14px;background:color-mix(in srgb,var(--t) 7%,var(--page));border:1px solid color-mix(in srgb,var(--t) 22%,var(--page))}
.b-encadre p{margin:0;font-size:.96rem}
.b-encadre .b-encadre-titre{font-weight:700;color:var(--t);margin-bottom:6px}
.b-citation{margin:24px 0;padding:20px 24px;border-radius:14px;background:var(--fond)}
.b-citation blockquote{margin:0;font:italic 500 1.25rem/1.45 var(--titre)}
.b-citation blockquote::before{content:'«\00a0';color:var(--c2)} .b-citation blockquote::after{content:'\00a0»';color:var(--c2)}
.b-citation figcaption{margin-top:10px;font-size:.8rem;color:var(--encre2)}
.b-def{margin:20px 0;display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:16px;padding:16px 20px;border:1.5px solid var(--c1);border-radius:14px}
.b-def dt{font:700 1.1rem var(--titre);color:var(--c1)} .b-def dt span{display:block;font:700 .66rem var(--texte);letter-spacing:.12em;text-transform:uppercase;color:var(--encre2)}
.b-def dd{margin:0;font-size:.95rem}
.b-liste{margin:0 0 16px;padding-left:1.2em} .b-liste li{margin-bottom:8px} .b-liste li::marker{color:var(--t)}
.b-faits{margin:20px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.b-faits div{background:var(--fond);border-radius:12px;padding:12px 16px}
.b-faits dt{font:700 .7rem var(--texte);letter-spacing:.08em;text-transform:uppercase;color:var(--t)} .b-faits dd{margin:2px 0 0;font-weight:600;font-size:.95rem}
.b-tl{list-style:none;margin:20px 0;padding:0;display:grid;gap:6px}
.b-tl li{display:grid;grid-template-columns:130px 1fr;gap:12px;font-size:.94rem} .b-tl .d{font-weight:700;color:var(--t)}
.b-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:20px 0}
.stat{border-radius:12px;padding:14px 16px;background:color-mix(in srgb,var(--t) 9%,var(--page))}
.stat b{display:block;font:700 1.5rem var(--titre);color:var(--t)} .stat span{display:block;font-size:.78rem;line-height:1.35;color:var(--encre2)}
.b-tableau{overflow-x:auto;margin:20px 0;border:1px solid var(--filet);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.88rem;line-height:1.45;font-variant-numeric:tabular-nums}
thead th{background:var(--fond);text-align:left;padding:10px 14px;font-weight:700;color:var(--c1)}
td,tbody th{padding:9px 14px;border-top:1px solid var(--filet);text-align:left;vertical-align:top} tbody th{font-weight:600}

.annexe{max-width:1240px;margin:20px auto 0;background:var(--page);border:1px solid var(--filet);border-radius:18px;padding:36px 40px}
.annexe-titre{font:700 1.6rem/1.1 var(--titre);letter-spacing:0;text-transform:none;color:var(--encre);margin-bottom:24px}
.acteurs-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.acteur{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-content:start;padding:16px;border:1px solid var(--filet);border-radius:14px}
.initiales{grid-row:span 2;width:42px;height:42px;border-radius:50%;background:var(--t);color:#fff;display:grid;place-items:center;font:700 .85rem var(--texte)}
.acteur h3{margin:0;font:700 1rem var(--titre)} .acteur .role{margin:0;font-size:.76rem;font-weight:600;color:var(--t)}
.acteur-d{grid-column:1/-1;margin:10px 0 0;font-size:.88rem;color:var(--encre2);line-height:1.5}
.debat-q{font:700 clamp(1.4rem,3vw,1.9rem)/1.2 var(--titre);color:var(--c1);margin:0 0 20px}
.debat-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.debat-col{border-radius:14px;padding:20px 22px;min-width:0}
.debat-oui{background:color-mix(in srgb,var(--c3) 9%,var(--page))} .debat-non{background:color-mix(in srgb,var(--c2) 8%,var(--page))}
.debat-col h3{font:700 1rem var(--titre);margin:0 0 10px} .debat-oui h3{color:var(--c3)} .debat-non h3{color:var(--c2)}
.debat-col ul{margin:0;padding-left:1.1em} .debat-col li{margin-bottom:6px;font-size:.94rem}
.debat-syn{margin-top:12px;padding:20px 22px;border-radius:14px;border:1.5px solid var(--c1)} .debat-syn p:last-child{margin:0}
.lex-liste{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 32px;margin:0}
.lex-liste div{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--filet);font-size:.92rem}
.lex-liste dt{font-weight:700;color:var(--c1)} .lex-liste dd{margin:0;color:var(--encre2)}
.sujets-liste{margin:0;padding-left:1.4em;display:grid;gap:6px} .sujets-liste li::marker{font-weight:700;color:var(--c2)}
summary{cursor:pointer;font:600 1.05rem/1.4 var(--titre);padding:8px 0}
details p{margin:0 0 12px;font-size:.92rem;color:var(--encre2)}
.ret-liste{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.ret-liste li{padding:14px 16px 14px 44px;border-radius:12px;background:var(--fond);position:relative;font-size:.92rem}
.ret-liste li::before{content:'✓';position:absolute;left:16px;top:14px;font-weight:700;color:var(--c3)}

@media (max-width:1180px){.page{grid-template-columns:minmax(0,1fr)}.frise{grid-row:1;position:static;max-height:none}
  .frise ol{display:flex;overflow-x:auto;gap:14px}.frise li{flex:0 0 200px;border-left:0;border-top:2px solid var(--filet);padding:14px 0 0}.frise li::before{left:0;top:-6px}}
@media (max-width:860px){.essentiel{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .ariane{display:none}.barre{padding-inline:16px}
  .heros{padding:32px 20px 24px}.corps,.annexe,.ess-texte{padding:24px 18px}
  .debat-cols,.lex-liste,.b-def{grid-template-columns:minmax(0,1fr)} .b-tl li{grid-template-columns:1fr;gap:0}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* ─── Illustrations (images, graphiques, schémas) ─── */
:root{--leave:#c4323a;--remain:#3a6bc4}
.heros{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:center}
.heros-image{margin:0;position:relative;align-self:stretch;min-height:320px}
.heros-image img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px}
.heros-image figcaption{position:absolute;left:12px;right:12px;bottom:12px;padding:8px 12px;border-radius:10px;background:#000000a6;color:#fff;font-size:.74rem;line-height:1.35;backdrop-filter:blur(6px)}
.heros-image small{display:block;opacity:.75;font-size:.66rem;margin-top:2px}
.heros-in .heros-chap{display:none}
.b-image{margin:26px 0}
.b-image img{display:block;width:100%;height:auto;border-radius:12px;background:var(--fond)}
.b-image.large{margin-inline:-56px}
.b-image.large img{border-radius:0}
.b-image.large figcaption{padding-inline:56px}
.b-image figcaption{margin-top:10px;font-size:.84rem;line-height:1.45;color:var(--encre2);display:grid;gap:2px}
.b-image figcaption span{color:var(--encre)}
.b-image small,.b-note{font-size:.72rem;color:var(--encre2)}
.b-image a,.b-note a{color:inherit}
.b-schema,.b-graph,.b-periodes,.b-echelle{margin:28px 0;padding:22px 24px;border:1px solid var(--filet);border-radius:14px;background:var(--page)}
.b-schema-titre{font:700 1.02rem/1.3 var(--titre);margin-bottom:14px;color:var(--encre)}
.b-schema-svg svg{display:block;width:100%;height:auto;font-family:var(--texte)}
.b-note{margin:12px 0 0;line-height:1.45}
.g-legende{list-style:none;margin:0 0 12px;padding:0;display:flex;gap:18px;font-size:.8rem;font-weight:600}
.g-legende i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.g-corps{position:relative;display:grid;gap:6px}
.g-ligne,.g-reperes{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:center}
.g-lib{font-size:.82rem;line-height:1.25;color:var(--encre2)}
.g-ligne.fort .g-lib{font-weight:700;color:var(--encre)}
.g-piste{display:flex;gap:2px;height:26px;position:relative}
.g-seg{display:flex;align-items:center;padding:0 8px;color:#fff;font-size:.74rem;min-width:0;overflow:hidden;white-space:nowrap;font-variant-numeric:tabular-nums}
.g-seg:first-child{border-radius:4px 0 0 4px;justify-content:flex-start}.g-seg:last-child{border-radius:0 4px 4px 0;justify-content:flex-end}
.g-seg:only-child{border-radius:0 4px 4px 0;justify-content:flex-end}
.g-ligne.fort .g-seg{font-weight:700}
.g-seg:hover{filter:brightness(1.12)}
.g-reperes{position:absolute;inset:0;pointer-events:none}
.g-reperes .g-piste{height:100%}
.g-repere{position:absolute;top:-6px;bottom:-22px;border-left:1.5px dashed var(--encre)}
.g-repere em{position:absolute;bottom:0;left:6px;font:600 .68rem var(--texte);font-style:normal;white-space:nowrap;color:var(--encre)}
.b-graph .g-corps{padding-bottom:22px}
.p-corps{position:relative;display:grid;gap:5px;padding-top:24px}
.p-axe{position:absolute;top:0;left:172px;right:0;height:18px}
.p-axe span{position:absolute;transform:translateX(-50%);font-size:.7rem;color:var(--encre2);font-variant-numeric:tabular-nums}
.p-ligne{display:grid;grid-template-columns:160px minmax(0,1fr);gap:12px;align-items:center}
.p-lib{display:grid;line-height:1.2}.p-lib b{font-size:.84rem}.p-lib small{font-size:.7rem;color:var(--encre2)}
.p-piste{position:relative;height:22px;border-radius:4px;background:var(--fond)}
.p-piste i{position:absolute;top:0;bottom:0;border-left:1px solid var(--filet)}
.p-barre{position:absolute;top:3px;bottom:3px;border-radius:4px}
.e-sens{display:flex;justify-content:space-between;font:700 .7rem var(--texte);letter-spacing:.08em;text-transform:uppercase;color:var(--encre2);margin-bottom:8px}
.e-sens span:first-child::before{content:'← '}.e-sens span:last-child::after{content:' →'}
.e-marches{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.e-marches li{position:relative;padding:12px 12px 14px;border-radius:10px;background:color-mix(in srgb,var(--c1) calc(30% - var(--i,0) * 6%),var(--page));display:flex;flex-direction:column;gap:4px;min-width:0}
.e-marches li:nth-child(1){--i:0}.e-marches li:nth-child(2){--i:1}.e-marches li:nth-child(3){--i:2}.e-marches li:nth-child(4){--i:3}.e-marches li:nth-child(5){--i:4}
.e-num{font:700 .7rem var(--texte);color:var(--c1)}
.e-marches b{font:700 .92rem/1.2 var(--titre)}
.e-ex{font-size:.74rem;line-height:1.35;color:var(--encre2)}
.e-marches li.ici{outline:2.5px solid var(--c2);outline-offset:-2.5px}
.e-marches li.cible{outline:2px dashed var(--c3);outline-offset:-2px}
.e-tag{margin-top:auto;padding-top:6px;font:700 .7rem/1.3 var(--texte);font-style:normal;color:var(--c2)}
.e-marches li.cible .e-tag{color:var(--c3)}
@media (max-width:860px){.heros{grid-template-columns:minmax(0,1fr)}.heros-image{min-height:220px;order:-1}}
@media (max-width:640px){
  .b-image.large{margin-inline:-18px}.b-image.large figcaption{padding-inline:18px}
  .b-schema,.b-graph,.b-periodes,.b-echelle{padding:16px 14px;margin-inline:-6px}
  .g-ligne,.g-reperes{grid-template-columns:96px minmax(0,1fr);gap:8px}
  .p-ligne{grid-template-columns:96px minmax(0,1fr);gap:8px}.p-axe{left:104px}
  .e-marches{grid-template-columns:minmax(0,1fr)}
}

/* Photos dans le texte, comme les figures d'HGG : format « droite » ou « gauche » */
.sous-corps{display:flow-root}
.b-image figcaption{padding-left:10px;border-left:2px solid var(--filet)}
.b-image small{order:-1;font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c1)}
.b-image.droite,.b-image.gauche{width:40%;margin-top:4px;margin-bottom:16px}
.b-image.droite{float:right;margin-left:28px}
.b-image.gauche{float:left;margin-right:28px}
.b-image.droite img,.b-image.gauche img{aspect-ratio:3/2;object-fit:cover;border-radius:8px}
.b-image.droite figcaption,.b-image.gauche figcaption{font-size:.76rem}
.b-encadre,.b-def,.b-citation,.b-faits,.b-liste{display:flow-root}
.b-schema,.b-graph,.b-periodes,.b-echelle,.b-images,.b-tableau,.b-stats,.b-tl,.b-image.large{clear:both}
@media (max-width:640px){
  .b-image.droite,.b-image.gauche{float:none;width:auto;margin:22px 0}
}
.b-images{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:26px 0}
.b-images .b-image{margin:0}.b-images img{aspect-ratio:4/3;object-fit:cover}
@media (max-width:640px){.b-images{grid-template-columns:minmax(0,1fr)}}
.b-glisser{display:none}
@media (max-width:640px){.b-schema-svg{overflow-x:auto;margin-inline:-4px}.b-schema-svg svg{min-width:580px}.b-glisser{display:block;margin:6px 0 0;font-size:.72rem;font-weight:600;color:var(--c1)}}

/* ─── Intégration au site ─── */
html{scroll-behavior:smooth;scroll-padding-top:80px}
.barre{margin-inline:0}

        {
          "titre": {
            "fr": "Trois ans et demi de crise constitutionnelle",
            "en": "Three and a half years of constitutional crisis"
          },
          "blocs": [
            {
              "t": "p",
              "c": {
                "fr": "Theresa May déclenche l'article 50 en mars 2017 puis convoque des élections anticipées pour renforcer sa main : elle y <strong>perd sa majorité</strong> et doit gouverner avec le soutien du DUP nord-irlandais. Son accord de retrait est rejeté trois fois par les Communes, dont une fois par 230 voix d'écart — la <strong>plus lourde défaite d'un gouvernement</strong> dans l'histoire parlementaire moderne.",
                "en": "Theresa May triggered Article 50 in March 2017, then called a snap election to strengthen her hand: she <strong>lost her majority</strong> and had to govern with the support of Northern Ireland's DUP. Her Withdrawal Agreement was rejected three times by the Commons, once by 230 votes — the <strong>heaviest government defeat</strong> in modern parliamentary history."
              }
            },
            {
              "t": "p",
              "c": {
                "fr": "Bruxelles impose d'emblée un <strong>séquençage</strong> : régler le divorce avant de parler d'avenir. Trois dossiers doivent être clos — les <strong>droits des citoyens</strong> (3,7 millions d'Européens au Royaume-Uni, 1,2 million de Britanniques dans l'UE), le <strong>règlement financier</strong> (environ 39 milliards de livres) et la <strong>frontière irlandaise</strong>. Londres découvre alors une asymétrie brutale : face à un marché de 450 millions de consommateurs négociant d'une seule voix, le Royaume-Uni pèse peu, et la menace du <span class='en'>no deal</span> se retourne d'abord contre lui.",
                "en": "Brussels immediately imposed a <strong>sequencing</strong>: settle the divorce before discussing the future. Three files had to be closed — <strong>citizens' rights</strong> (3.7 million EU nationals in the UK, 1.2 million Britons in the EU), the <strong>financial settlement</strong> (around £39bn) and the <strong>Irish border</strong>. London discovered a brutal asymmetry: against a market of 450 million consumers negotiating with one voice, Britain carried little weight, and the <span class='en'>no deal</span> threat rebounded first on itself."
              }
            },

              "c": {
                "fr": "À Lancaster House en janvier 2017, May fixe des lignes rouges maximalistes : sortie du marché unique, de l'union douanière et de la juridiction de la Cour de justice. Le plan de <strong>Chequers</strong> (juillet 2018), qui tente un compromis sur les biens, provoque les démissions de David Davis puis de Boris Johnson. Les Européens raillent le <span class='en'>cakeism</span> britannique — vouloir le beurre et l'argent du beurre — tandis que le camp du Leave dénonce une trahison. May tombe entre les deux.",
                "en": "At Lancaster House in January 2017, May set maximalist red lines: out of the single market, out of the customs union, out of the jurisdiction of the Court of Justice. The <strong>Chequers</strong> plan of July 2018, which attempted a compromise on goods, triggered the resignations of David Davis and then Boris Johnson. Europeans mocked British <span class='en'>cakeism</span> — having your cake and eating it — while Leavers denounced a betrayal. May fell between the two."

            {
              "t": "p",
              "c": {
                "fr": "Boris Johnson lui succède en juillet 2019 et tente de suspendre le Parlement (<span class='en'>prorogation</span>) : la <strong>Cour suprême</strong> juge la manœuvre illégale à l'unanimité en septembre 2019. L'épisode illustre un paradoxe majeur : un référendum conduit au nom de la souveraineté du Parlement a produit la crise la plus grave entre exécutif, législatif et judiciaire depuis des décennies.",
                "en": "Boris Johnson succeeded her in July 2019 and attempted to suspend Parliament (<span class='en'>prorogation</span>): the <strong>Supreme Court</strong> unanimously ruled the move unlawful in September 2019. The episode captures a major paradox: a referendum fought in the name of parliamentary sovereignty produced the gravest clash between executive, legislature and judiciary in decades."
              }

              "c": {
                "fr": "Le problème irlandais était insoluble par construction. L'<strong>accord du Vendredi saint</strong> (1998) repose sur une frontière invisible entre les deux Irlandes ; sortir du marché unique et de l'union douanière imposait mécaniquement des contrôles quelque part. D'où le <span class='en'>backstop</span> de May, rejeté par les unionistes, puis le <strong>protocole nord-irlandais</strong> de Johnson qui déplace la frontière en mer d'Irlande — solution que les unionistes jugent contraire à leur place dans le Royaume-Uni.",
                "en": "The Irish problem was insoluble by design. The <strong>Good Friday Agreement</strong> (1998) rests on an invisible border between the two Irelands; leaving the single market and the customs union mechanically required checks somewhere. Hence May's <span class='en'>backstop</span>, rejected by unionists, and then Johnson's <strong>Northern Ireland Protocol</strong>, which moved the border into the Irish Sea — a solution unionists regard as undermining their place in the United Kingdom."

      "Quatre nations, deux résultats opposés : <strong>Angleterre et pays de Galles</strong> pour la sortie, <strong>Écosse et Irlande du Nord</strong> pour le maintien.",
      "Le meilleur prédicteur du vote reste le <strong>niveau de diplôme</strong>, devant le revenu.",
      "Trois causes à articuler : <strong>euroscepticisme structurel</strong>, <strong>fracture territoriale</strong>, <strong>calcul partisan</strong>.",
      "Le paradoxe central : un référendum souverainiste qui a fait triompher les <strong>juges et le Parlement</strong> contre l'exécutif.",
      "Le référendum était <strong>consultatif</strong>, sans seuil ni majorité qualifiée : un choix constitutionnel décidé à la majorité simple.",
      "« <strong>Global Britain</strong> » : gains commerciaux marginaux (CPTPP, + 0,08 %), mais un rang diplomatique intact (OTAN, Ukraine, AUKUS).",
      "Aucun <strong>effet domino</strong> dans l'UE : le Brexit a servi de contre-exemple et renforcé l'unité des Vingt-Sept.",
      "Depuis 2020 : <strong>TCA</strong> (2020) → <strong>Windsor</strong> (2023) → <strong>« reset »</strong> (2025-2026). Le curseur bouge, les lignes rouges tiennent."
    ],
    "en": [
      "<strong>51.9% / 48.1%</strong>, on a <strong>72.2%</strong> turnout, on 23 June 2016.",
      "Four nations, two opposite results: <strong>England and Wales</strong> for leaving, <strong>Scotland and Northern Ireland</strong> for remaining.",
      "The single best predictor of the vote remains <strong>educational attainment</strong>, ahead of income.",
      "Three causes to combine: <strong>structural euroscepticism</strong>, <strong>territorial divide</strong>, <strong>party calculation</strong>.",
      "The central paradox: a sovereigntist referendum that handed victory to <strong>judges and Parliament</strong> against the executive.",
      "The referendum was <strong>advisory</strong>, with no threshold or qualified majority: a constitutional choice made on a simple majority.",
      "“<strong>Global Britain</strong>”: marginal trade gains (CPTPP, +0.08%), but an intact diplomatic rank (NATO, Ukraine, AUKUS).",
      "No <strong>domino effect</strong> in the EU: Brexit served as a counter-example and strengthened the unity of the Twenty-Seven.",
      "Since 2020: <strong>TCA</strong> (2020) → <strong>Windsor</strong> (2023) → <strong>“reset”</strong> (2025-2026). The dial moves, the red lines hold."
    ]
  }
};
</script>

<script>
/* Rendu du cours de civilisation (gabarit « Manuel », v2). Lit le bloc COURS ci-dessus : rien d'autre à modifier. */
(function () {
  const OPT = {};
  let lang = 'fr', onglet = 'cours';

  const UI = {
    fr: { filtrer: 'Filtrer le lexique…', ess: "L'essentiel", frise: 'Chronologie', som: 'Sommaire', act: 'Acteurs clés', deb: 'Le débat', syn: 'Synthèse',
          lex: 'Lexique', sujets: 'Sujets de dissertation', ret: 'À retenir', piste: 'Piste', partie: 'Partie', def: 'Définition',
          cours: 'Le cours', parties: 'parties', sections: 'sections', dates: 'dates', min: 'min de lecture', chap: 'Chapitre' },
    en: { filtrer: 'Filter the glossary…', ess: 'Key points', frise: 'Timeline', som: 'Contents', act: 'Key figures', deb: 'The debate', syn: 'Synthesis',
          lex: 'Glossary', sujets: 'Essay questions', ret: 'Takeaways', piste: 'Hint', partie: 'Part', def: 'Definition',
          cours: 'The lesson', parties: 'parts', sections: 'sections', dates: 'dates', min: 'min read', chap: 'Chapter' },
    es: { filtrer: 'Filtrar el léxico…', ess: 'Lo esencial', frise: 'Cronología', som: 'Índice', act: 'Actores clave', deb: 'El debate', syn: 'Síntesis',
          lex: 'Léxico', sujets: 'Temas de disertación', ret: 'Para recordar', piste: 'Pista', partie: 'Parte', def: 'Definición',
          cours: 'La lección', parties: 'partes', sections: 'secciones', dates: 'fechas', min: 'min de lectura', chap: 'Capítulo' },
    de: { filtrer: 'Wortschatz filtern…', ess: 'Das Wesentliche', frise: 'Zeitleiste', som: 'Inhalt', act: 'Schlüsselfiguren', deb: 'Die Debatte', syn: 'Synthese',
          lex: 'Wortschatz', sujets: 'Aufsatzthemen', ret: 'Merksätze', piste: 'Hinweis', partie: 'Teil', def: 'Definition',
          cours: 'Die Lektion', parties: 'Teile', sections: 'Abschnitte', dates: 'Daten', min: 'Min. Lesezeit', chap: 'Kapitel' }
  };
  const LANGUE = { en: 'anglais', es: 'espagnol', de: 'allemand' };
  const DRAPEAU = { fr: '🇫🇷', en: '🇬🇧', es: '🇪🇸', de: '🇩🇪' };

  const typo = s => String(s ?? '').replace(/ ([:;!?»%])/g, ' $1').replace(/« /g, '« ');
  const estTraduit = v => v && typeof v === 'object' && !Array.isArray(v) && ('fr' in v || 'en' in v || 'es' in v || 'de' in v);
  const R = v => estTraduit(v) ? (v[lang] ?? v.fr) : v;
  const L = v => { const x = R(v); return lang === 'fr' ? typo(x) : String(x ?? ''); };
  const A = v => { const x = R(v); return Array.isArray(x) ? x : []; };
  const ton = c => { const m = /--a(\d)/.exec(c || ''); return 'ton-' + (m ? m[1] : '1'); };
  const mots = s => String(s || '').replace(/<[^>]+>/g, ' ').split(/\s+/).filter(Boolean).length;

  function bloc(b) {
    switch (b.t) {
      case 'p': return `<p class="b-p">${L(b.c)}</p>`;
      case 'encadre': return `<aside class="b-encadre ${ton(b.c)}"><p class="b-encadre-titre">${L(b.titre)}</p><p>${L(b.c2)}</p></aside>`;
      case 'citation': return `<figure class="b-citation"><blockquote>${L(b.c)}</blockquote><figcaption>${L(b.src)}</figcaption></figure>`;
      case 'def': return `<dl class="b-def"><dt><span>${UI[lang].def}</span>${L(b.mot)}</dt><dd>${L(b.c)}</dd></dl>`;
      case 'liste': return `<ul class="b-liste">${A(b.items).map(i => `<li>${L(i)}</li>`).join('')}</ul>`;
      case 'faits': return `<dl class="b-faits">${A(b.items).map(i => `<div><dt>${L(i.l)}</dt><dd>${L(i.v)}</dd></div>`).join('')}</dl>`;
      case 'tl': return `<ol class="b-tl">${A(b.items).map(i => `<li><span class="d">${L(i.d)}</span><span class="c">${L(i.c)}</span></li>`).join('')}</ol>`;
      case 'stats': return `<div class="b-stats">${A(b.items).map(i => `<div class="stat ${ton(i.c)}"><b>${L(i.n)}</b><span>${L(i.d)}</span></div>`).join('')}</div>`;
      case 'image': return `<figure class="b-image ${b.format || ''}"><img src="${b.src}" alt="${L(b.alt)}" loading="lazy" width="${b.l || 1280}" height="${b.h || 853}">
        <figcaption><span>${L(b.legende)}</span>${b.credit ? `<small>${b.credit}</small>` : ''}</figcaption></figure>`;
      case 'images': return `<div class="b-images">${b.items.map(i => `<figure class="b-image"><img src="${i.src}" alt="${L(i.alt)}" loading="lazy" width="${i.l}" height="${i.h}"><figcaption><span>${L(i.legende)}</span>${i.credit ? `<small>${i.credit}</small>` : ''}</figcaption></figure>`).join('')}</div>`;
      case 'schema': return `<figure class="b-schema"><figcaption class="b-schema-titre">${L(b.titre)}</figcaption>
        <div class="b-schema-svg">${R(b.svg)}</div><p class="b-glisser" aria-hidden="true">${lang === 'fr' ? 'Faire glisser le schéma →' : 'Swipe to see the diagram →'}</p>${b.legende ? `<p class="b-note">${L(b.legende)}</p>` : ''}</figure>`;
      case 'graphique': {
        const series = b.series || [];
        const leg = series.length > 1 ? `<ul class="g-legende">${series.map(x => `<li><i style="background:${x.c}"></i>${L(x.l)}</li>`).join('')}</ul>` : '';
        const max = b.max || 100;
        const nb = v => (b.dec ? v.toFixed(b.dec) : String(v)).replace('.', lang === 'fr' ? ',' : '.');
        const lignes = b.items.map(it => {
          const segs = it.v.map((v, i) => `<span class="g-seg" style="width:${100 * v / max}%;background:${series[i].c}" title="${L(it.l)} · ${L(series[i].l)} : ${nb(v)} %"><b>${nb(v)}${lang === 'fr' ? ' ' : ''}%</b></span>`).join('');
          return `<div class="g-ligne${it.fort ? ' fort' : ''}"><span class="g-lib">${L(it.l)}</span><span class="g-piste">${segs}</span></div>`;
        }).join('');
        const repere = b.repere != null ? `<span class="g-repere" style="left:${100 * b.repere / max}%"><em>${L(b.repereL)}</em></span>` : '';
        return `<figure class="b-graph"><figcaption class="b-schema-titre">${L(b.titre)}</figcaption>${leg}
          <div class="g-corps">${lignes}<div class="g-reperes" aria-hidden="true"><span class="g-lib"></span><span class="g-piste">${repere}</span></div></div>
          ${b.source ? `<p class="b-note">${L(b.source)}</p>` : ''}</figure>`;
      }
      case 'periodes': {
        const t0 = b.debut, t1 = b.fin, pc = x => 100 * (x - t0) / (t1 - t0);
        const ans = []; for (let a = Math.ceil(t0); a <= t1; a += (b.pas || 2)) ans.push(a);
        return `<figure class="b-periodes"><figcaption class="b-schema-titre">${L(b.titre)}</figcaption>
          <div class="p-corps"><div class="p-axe">${ans.map(a => `<span style="left:${pc(a)}%">${a}</span>`).join('')}</div>
          ${b.items.map(it => `<div class="p-ligne"><span class="p-lib"><b>${L(it.l)}</b><small>${L(it.d)}</small></span>
            <span class="p-piste">${ans.map(a => `<i style="left:${pc(a)}%"></i>`).join('')}<span class="p-barre" style="left:${pc(it.a)}%;width:${Math.max(.6, pc(it.b) - pc(it.a))}%;background:${it.c}" title="${L(it.l)} : ${L(it.d)}"></span></span></div>`).join('')}</div>
          ${b.legende ? `<p class="b-note">${L(b.legende)}</p>` : ''}</figure>`;
      }
      case 'echelle': return `<figure class="b-echelle"><figcaption class="b-schema-titre">${L(b.titre)}</figcaption>
        <div class="e-sens"><span>${L(b.gauche)}</span><span>${L(b.droite)}</span></div>
        <ol class="e-marches">${b.marches.map((m, i) => `<li class="${m.ici ? 'ici' : ''}${m.cible ? ' cible' : ''}"><span class="e-num">${i + 1}</span><b>${L(m.l)}</b><span class="e-ex">${L(m.ex)}</span>${m.tag ? `<em class="e-tag">${L(m.tag)}</em>` : ''}</li>`).join('')}</ol>
        ${b.legende ? `<p class="b-note">${L(b.legende)}</p>` : ''}</figure>`;
      case 'tableau': {
        const h = A(b.head), r = A(b.rows);
        return `<div class="b-tableau"><table>${h.length ? `<thead><tr>${h.map(x => `<th>${L(x)}</th>`).join('')}</tr></thead>` : ''}<tbody>${
          r.map(row => `<tr>${row.map((x, i) => i ? `<td>${L(x)}</td>` : `<th scope="row">${L(x)}</th>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      }
    }
    return '';
  }

  function rendre() {
    const C = COURS, m = C.meta;
    const l2 = Object.keys(m.titre).find(k => k !== 'fr');
    if (lang !== 'fr' && lang !== l2) lang = 'fr';
    const t = UI[lang];
    document.documentElement.lang = lang;
    document.documentElement.dataset.langue = LANGUE[l2] || 'anglais';

    let nbMots = mots(R(C.essentiel)), nbSec = 0;
    C.parties.forEach(p => p.sections.forEach(s => { nbSec++; s.blocs.forEach(b => { nbMots += mots(R(b.c)) + mots(R(b.c2)); }); }));
    const minutes = Math.max(5, Math.round(nbMots / 200 / 5) * 5);

    const parties = C.parties.map((p, pi) => `
      <section class="partie ${ton(p.couleur)}" id="partie-${pi + 1}">
        <header class="partie-tete">
          <span class="partie-num">${p.num}</span>
          <p class="partie-kicker">${t.partie} ${p.num} · ${L(p.kicker)}</p>
          <h2>${L(p.titre)}</h2>
        </header>
        ${p.sections.map((s, si) => `
          <section class="sous" id="s-${pi + 1}-${si + 1}">
            <h3><span class="sous-num">${pi + 1}.${si + 1}</span><span class="sous-titre">${L(s.titre)}</span></h3>
            <div class="sous-corps">${s.blocs.map(bloc).join('')}</div>
          </section>`).join('')}
      </section>`).join('');

    const annexes = [];
    if (C.acteurs) annexes.push(['acteurs', t.act, `<div class="acteurs-grille">${C.acteurs.map(a => `<article class="acteur ${ton(a.c)}">
          <span class="initiales" aria-hidden="true">${a.nom.replace(/\(.*?\)/g, '').split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0]).join('')}</span>
          <h3>${a.nom}</h3><p class="role">${L(a.role)}</p><p class="acteur-d">${L(a.d)}</p></article>`).join('')}</div>`]);
    if (C.debat) annexes.push(['debat', t.deb, `<p class="debat-q">${L(C.debat.question)}</p>
        <div class="debat-cols">${['oui', 'non'].map(k => `<div class="debat-col debat-${k}"><h3>${L(C.debat[k].titre)}</h3>
          <ul>${A(C.debat[k].items).map(i => `<li>${L(i)}</li>`).join('')}</ul></div>`).join('')}</div>
        <div class="debat-syn"><p class="etiquette">${t.syn}</p><p>${L(C.debat.synthese)}</p></div>`]);
    if (C.lexique) annexes.push(['lexique', t.lex, `<input class="lex-filtre" id="lex-filtre" type="search" placeholder="${t.filtrer}" aria-label="${t.filtrer}"><dl class="lex-liste">${C.lexique.map(x => `<div><dt lang="${l2}">${x[l2] ?? ''}</dt><dd>${typo(x.fr)}</dd></div>`).join('')}</dl>`]);
    if (C.sujets) annexes.push(['sujets', t.sujets, `<ol class="sujets-liste">${C.sujets.map(s => `<li><details><summary>${L(s.q)}</summary><p><b>${t.piste}${lang === 'fr' ? ' ' : ''}:</b> ${L(s.h)}</p></details></li>`).join('')}</ol>`]);
    if (C.retenir) annexes.push(['retenir', t.ret, `<ul class="ret-liste">${A(C.retenir).map(r => `<li>${L(r)}</li>`).join('')}</ul>`]);

    const frise = `<aside class="frise" aria-label="${t.frise}"><p class="etiquette">${t.frise}</p>
          <ol>${C.chronologie.map(c => `<li><span class="d">${L(c.d)}</span><span class="c">${L(c.c)}</span></li>`).join('')}</ol></aside>`;
    const annexeHTML = ([id, titre, html]) => `<section class="annexe ${id}" id="${id}"><h2 class="etiquette annexe-titre">${titre}</h2>${html}</section>`;

    const onglets = [['cours', t.cours], ['frise', t.frise], ...annexes.map(a => [a[0], a[1]])];
    const corpsOnglets = OPT.onglets ? `
      <div class="onglets" role="tablist">${onglets.map(([id, nom]) => `<button type="button" role="tab" data-o="${id}" aria-selected="${id === onglet}">${nom}</button>`).join('')}</div>
      <div class="panneau" data-p="cours" ${onglet === 'cours' ? '' : 'hidden'}><div class="page"><main class="corps">${parties}</main></div></div>
      <div class="panneau" data-p="frise" ${onglet === 'frise' ? '' : 'hidden'}>${frise}</div>
      ${annexes.map(a => `<div class="panneau" data-p="${a[0]}" ${onglet === a[0] ? '' : 'hidden'}>${annexeHTML(a)}</div>`).join('')}`
      : `<div class="page"><main class="corps">${parties}</main>${frise}</div>${annexes.map(annexeHTML).join('')}`;

    document.getElementById('cours').innerHTML = `
      <div class="progression"><span></span></div>
      <header class="heros" id="haut">
        <div class="heros-in">
          <span class="heros-chap" aria-hidden="true">${String(m.chapitre || '').padStart(2, '0')}</span>
          <p class="heros-label"><span class="heros-drapeau" aria-hidden="true">${m.drapeau || ''}</span>${L(m.label)}</p>
          <h1>${L(m.titre)}</h1>
          <p class="heros-sous">${L(m.sousTitre)}</p>
          <ul class="heros-meta">
            <li><b>${C.parties.length}</b> ${t.parties}</li><li><b>${nbSec}</b> ${t.sections}</li>
            <li><b>${C.chronologie.length}</b> ${t.dates}</li><li><b>${minutes}</b> ${t.min}</li>
          </ul>
        </div>
        ${m.image ? `<figure class="heros-image"><img src="${m.image.src}" alt="${L(m.image.alt)}"><figcaption>${L(m.image.legende)} <small>${m.image.credit || ''}</small></figcaption></figure>` : ''}
      </header>
      <section class="essentiel" id="essentiel">
        <div class="ess-texte"><h2 class="etiquette">${t.ess}</h2><p>${L(C.essentiel)}</p></div>
        ${C.chiffres ? `<div class="ess-chiffres">${C.chiffres.map(c => `<div class="chiffre"><b>${L(c.n)}</b><span>${L(c.d)}</span></div>`).join('')}</div>` : ''}
      </section>
      ${corpsOnglets}`;

    document.querySelectorAll('.langues button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
    const bt = document.getElementById('bc-titre'); if (bt) bt.innerHTML = L(m.titre);
    const ls = document.getElementById('lex-filtre');
    if (ls) ls.addEventListener('input', () => {
      const q = ls.value.toLowerCase().trim();
      document.querySelectorAll('.lex-liste > div').forEach(d => { d.hidden = !!q && !d.textContent.toLowerCase().includes(q); });
    });
    document.querySelectorAll('.onglets button').forEach(b => b.addEventListener('click', () => {
      onglet = b.dataset.o; rendre();
      document.querySelector('.onglets').scrollIntoView({ block: 'start' });
    }));
  }

  document.querySelectorAll('.langues button').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.l; const y = scrollY; rendre(); scrollTo(0, y);
  }));
  addEventListener('scroll', () => {
    const p = document.querySelector('.progression span');
    if (p) p.style.width = (100 * scrollY / Math.max(1, document.documentElement.scrollHeight - innerHeight)) + '%';
  }, { passive: true });
  rendre();
})();
</script>
</body>
</html>
