<!DOCTYPE html>
<html lang="fr" data-theme="specialrel">
<head>
<script src="../../../../auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Special Relationship — Civilisation Anglophone</title>
<link rel="stylesheet" href="../../../../fonts/fonts.css">

<!-- ══════════════════════════════════════════════════════════════════════
     TEMPLATE UNIVERSEL DE COURS DE CIVILISATION — v1
     Pour créer un nouveau cours : dupliquer ce fichier, ne modifier QUE
     le bloc de données (id="donnees") tout en bas. Rien d'autre à toucher.
     ══════════════════════════════════════════════════════════════════════ -->

<style>
  /* ─── PALETTE DE BASE (identique au site) ─── */
  :root{
    --bg:#0d0d0f; --surface:#16161a; --surface2:#1e1e24; --border:#2a2a35;
    --text:#e8e6e0; --text-dim:#8a8880; --text-faint:#4a4845;
    --radius:14px;
  }
  /* ─── THÈMES PAR LANGUE — change data-theme sur <html> ─── */
  html[data-theme="anglais"] { --a1:#c8a96e; --a2:#7c9ec9; --a3:#9ecba0; --a4:#c97c9e; --hero:#16233d; }
  html[data-theme="espagnol"]{ --a1:#e0a93e; --a2:#c8553d; --a3:#7fae7a; --a4:#b06fa8; --hero:#3a1a18; }
  html[data-theme="allemand"]{ --a1:#d8b44a; --a2:#8fa4bd; --a3:#84b58e; --a4:#c06060; --hero:#241f1a; }
  html[data-theme="italien"] { --a1:#d5a94e; --a2:#6fae8f; --a3:#a8c07a; --a4:#c4695e; --hero:#152a24; }
  html[data-theme="chinois"] { --a1:#d9a441; --a2:#c05a4a; --a3:#83a98f; --a4:#a97fb0; --hero:#2c1618; }
  html[data-theme="royal"]   { --a1:#c9a24c; --a2:#6f7db3; --a3:#7c9e75; --a4:#a34f68; --hero:#241a35; }
  html[data-theme="sante"]   { --a1:#4f9d92; --a2:#5f8fc4; --a3:#7cae6e; --a4:#c26a5a; --hero:#0f2b2a; }
  html[data-theme="commonwealth"] { --a1:#d9a84c; --a2:#4d7fa3; --a3:#5f9e6f; --a4:#c17a4a; --hero:#16262e; }
  html[data-theme="specialrel"]   { --a1:#a8434a; --a2:#3f6c96; --a3:#c9a24c; --a4:#6f7580; --hero:#1a1e2c; }

  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;overflow-x:hidden}

  /* ─── FOND ─── */
  .bg-orb{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;opacity:.08;z-index:0}
  .orb1{width:700px;height:700px;background:var(--a1);top:-300px;right:-250px}
  .orb2{width:600px;height:600px;background:var(--a2);bottom:-250px;left:-250px}

  /* ─── BARRE DE PROGRESSION ─── */
  #progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:200;
    background:linear-gradient(90deg,var(--a1),var(--a2),var(--a4));transition:width .1s linear}

  /* ─── NAV ─── */
  nav{display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding:16px 40px;border-bottom:1px solid var(--border);
    background:rgba(13,13,15,.9);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100}
  .nav-logo{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;color:var(--a1);cursor:pointer}
  .breadcrumb{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--text-dim);flex-wrap:wrap}
  .breadcrumb span{cursor:pointer;transition:color .2s}
  .breadcrumb span:hover{color:var(--a1)}
  .breadcrumb .sep{color:var(--text-faint);cursor:default}
  .breadcrumb .current{color:var(--text);cursor:default}
  .nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .ap-lang-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    color:rgba(255,255,255,.6);font-family:'DM Mono',monospace;font-size:10px;font-weight:700;
    letter-spacing:.12em;padding:5px 14px;border-radius:4px;cursor:pointer;transition:all .2s;text-transform:uppercase}
  .ap-lang-btn.active{background:var(--a1);border-color:var(--a1);color:#12100c}
  .ap-lang-btn:hover:not(.active){background:rgba(255,255,255,.15);color:#fff}

  /* ─── HERO ─── */
  .hero{position:relative;z-index:1;padding:76px 40px 56px;text-align:center;overflow:hidden;
    background:linear-gradient(160deg,var(--hero),#0d0d0f 85%);border-bottom:1px solid var(--border)}
  .hero::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
    width:80px;height:2px;background:var(--a1)}
  .hero-flag{font-size:2.6rem;line-height:1;margin-bottom:18px;display:block}
  .hero-label{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.3em;
    text-transform:uppercase;color:var(--a1);margin-bottom:18px}
  .hero h1{font-family:'Playfair Display',serif;font-weight:900;line-height:1.05;
    font-size:clamp(2.4rem,6vw,4.6rem);max-width:900px;margin:0 auto 18px}
  .hero h1 .amp{font-family:'DM Sans',sans-serif;font-weight:400}
  .hero-sub{font-size:1rem;color:var(--text-dim);max-width:640px;margin:0 auto;line-height:1.6}

  /* ─── LAYOUT ─── */
  .layout{display:flex;gap:48px;max-width:1320px;margin:0 auto;padding:48px 40px 100px;position:relative;z-index:1}
  main{flex:1;min-width:0;max-width:840px}

  /* ─── COLONNE CHRONOLOGIE ─── */
  .rail{width:262px;flex-shrink:0;position:sticky;top:88px;align-self:flex-start;
    max-height:calc(100vh - 118px);overflow-y:auto;padding-right:8px}
  .rail-title{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;
    color:var(--a1);margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border)}
  .rail .tl{padding-left:20px;margin:0 0 0 4px}
  .rail .tl-item{padding-bottom:16px}
  .rail .tl-item::before{left:-26px;top:4px;width:7px;height:7px}
  .rail .tl-d{font-size:.66rem;letter-spacing:.08em}
  .rail .tl-c{font-size:.79rem;line-height:1.5}
  .rail::-webkit-scrollbar{width:3px}
  .rail::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .chrono-mobile{display:none}

  /* ─── BLOC GÉNÉRIQUE ─── */
  .bloc{margin-bottom:64px;scroll-margin-top:88px}
  .bloc-head{display:flex;align-items:baseline;gap:14px;margin-bottom:24px;
    padding-bottom:12px;border-bottom:1px solid var(--border)}
  .bloc-kicker{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--k,var(--a1))}
  .bloc-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--text)}

  /* ─── L'ESSENTIEL ─── */
  .essentiel{background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    border:1px solid var(--border);border-left:3px solid var(--a1);border-radius:var(--radius);
    padding:28px 30px;margin-bottom:36px}
  .essentiel-label{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--a1);margin-bottom:14px}
  .essentiel p{font-size:.98rem;line-height:1.75;color:var(--text);margin-bottom:0}
  .essentiel p strong{color:var(--a1);font-weight:500}

  /* ─── STATS ─── */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0}
  .stat{border-radius:10px;padding:18px 16px;text-align:center;border:1px solid rgba(255,255,255,.08);
    background:linear-gradient(135deg,color-mix(in srgb,var(--c,var(--a1)) 26%,#101014),
    color-mix(in srgb,var(--c,var(--a1)) 8%,#101014))}
  .stat-n{font-family:'DM Mono',monospace;font-size:1.5rem;font-weight:500;color:var(--text);display:block;line-height:1.1}
  .stat-d{font-size:.7rem;color:var(--text-dim);margin-top:7px;display:block;line-height:1.45}

  /* ─── PARTIES ─── */
  .partie{margin-bottom:78px;scroll-margin-top:88px}
  .partie-head{display:flex;align-items:center;gap:22px;margin-bottom:34px;
    padding-bottom:18px;border-bottom:2px solid var(--p)}
  .partie-num{font-family:'Playfair Display',serif;font-size:3.4rem;font-weight:900;
    color:var(--p);opacity:.35;line-height:.9;flex-shrink:0}
  .partie-title{font-family:'Playfair Display',serif;font-size:clamp(1.35rem,3vw,1.95rem);
    font-weight:700;line-height:1.2}
  .partie-kicker{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.24em;
    text-transform:uppercase;color:var(--p);margin-bottom:6px}

  .section{margin-bottom:44px;scroll-margin-top:88px}
  .section-title{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;
    color:var(--text);margin-bottom:18px;padding-left:16px;border-left:3px solid var(--p)}
  .section-num{color:var(--p);font-weight:900}

  /* ─── TEXTE ─── */
  .prose{font-size:.96rem;line-height:1.8;color:rgba(232,230,224,.78);margin-bottom:16px}
  .prose strong{color:var(--text);font-weight:500}
  .prose em{color:var(--p,var(--a1));font-style:normal;font-weight:500}
  .en{font-family:'DM Mono',monospace;font-size:.86em;color:var(--a2)}

  /* ─── LISTE ─── */
  .liste{list-style:none;margin:14px 0 20px}
  .liste li{font-size:.93rem;line-height:1.65;color:rgba(232,230,224,.75);
    padding:9px 0 9px 22px;position:relative;border-bottom:1px solid rgba(255,255,255,.05)}
  .liste li:last-child{border-bottom:none}
  .liste li::before{content:'';position:absolute;left:0;top:17px;width:6px;height:6px;
    border-radius:50%;background:var(--p,var(--a1))}
  .liste li strong{color:var(--text);font-weight:500}

  /* ─── FAITS CLÉS ─── */
  .faits{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;margin:20px 0}
  .fait{background:rgba(255,255,255,.03);border:1px solid var(--border);
    border-left:3px solid var(--p,var(--a1));border-radius:8px;padding:13px 15px}
  .fait-l{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--text-faint);
    text-transform:uppercase;letter-spacing:.14em;margin-bottom:5px}
  .fait-v{font-size:.86rem;font-weight:500;color:var(--text);line-height:1.4}

  /* ─── CITATION ─── */
  .citation{background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
    border:1px solid var(--border);border-left:3px solid var(--a1);border-radius:0 10px 10px 0;
    padding:20px 24px;margin:22px 0}
  .citation p{font-family:'Playfair Display',serif;font-style:italic;font-size:1.02rem;
    line-height:1.6;color:var(--text);margin-bottom:9px}
  .citation cite{font-family:'DM Mono',monospace;font-size:.66rem;letter-spacing:.08em;
    color:var(--a1);font-style:normal}

  /* ─── ENCADRÉ ─── */
  .encadre{display:flex;gap:15px;align-items:flex-start;border-radius:10px;padding:17px 20px;margin:20px 0;
    background:color-mix(in srgb,var(--c,var(--a2)) 7%,transparent);
    border:1px solid color-mix(in srgb,var(--c,var(--a2)) 26%,transparent)}
  .encadre-ic{font-size:1.5rem;flex-shrink:0;line-height:1.2}
  .encadre-t{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.2em;
    text-transform:uppercase;color:var(--c,var(--a2));margin-bottom:7px;font-weight:500}
  .encadre-c{font-size:.89rem;line-height:1.7;color:rgba(232,230,224,.75)}
  .encadre-c strong{color:var(--text);font-weight:500}

  /* ─── DÉFINITION ─── */
  .def{border:1px dashed var(--border);border-radius:10px;padding:15px 18px;margin:18px 0;
    background:rgba(255,255,255,.02)}
  .def-mot{font-family:'Playfair Display',serif;font-weight:700;font-size:1rem;color:var(--a3);margin-bottom:6px}
  .def-c{font-size:.88rem;line-height:1.7;color:rgba(232,230,224,.72)}

  /* ─── TABLEAU ─── */
  .tbl-wrap{overflow-x:auto;margin:20px 0;border:1px solid var(--border);border-radius:10px}
  table{width:100%;border-collapse:collapse;font-size:.83rem}
  thead{background:rgba(255,255,255,.04)}
  thead th{padding:11px 15px;text-align:left;font-family:'DM Mono',monospace;font-size:.6rem;
    letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap}
  tbody tr{border-top:1px solid var(--border)}
  tbody tr:nth-child(even){background:rgba(255,255,255,.015)}
  tbody td{padding:11px 15px;color:rgba(232,230,224,.75);line-height:1.5}
  tbody td:first-child{color:var(--text);font-weight:500}

  /* ─── CHRONOLOGIE ─── */
  .tl{border-left:2px solid var(--border);padding-left:26px;margin:8px 0 8px 6px}
  .tl-item{position:relative;padding-bottom:22px}
  .tl-item:last-child{padding-bottom:0}
  .tl-item::before{content:'';position:absolute;left:-33px;top:5px;width:9px;height:9px;border-radius:50%;
    background:var(--c,var(--a1));box-shadow:0 0 0 3px rgba(13,13,15,1),0 0 0 5px color-mix(in srgb,var(--c,var(--a1)) 35%,transparent)}
  .tl-d{font-family:'DM Mono',monospace;font-size:.72rem;font-weight:500;letter-spacing:.1em;
    color:var(--c,var(--a1));margin-bottom:4px}
  .tl-c{font-size:.9rem;line-height:1.6;color:rgba(232,230,224,.75)}
  .tl-c strong{color:var(--text);font-weight:500}

  /* ─── ACTEURS ─── */
  .acteurs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .acteur{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;
    transition:all .25s;position:relative;overflow:hidden}
  .acteur:hover{border-color:var(--c,var(--a1));transform:translateY(-3px);background:var(--surface2)}
  .acteur-nom{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;margin-bottom:3px}
  .acteur-role{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--c,var(--a1));margin-bottom:10px}
  .acteur-c{font-size:.82rem;line-height:1.6;color:var(--text-dim)}

  /* ─── DÉBAT ─── */
  .debat{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .debat-col{border:1px solid var(--border);border-radius:12px;padding:20px 22px;background:rgba(255,255,255,.02)}
  .debat-col.oui{border-top:3px solid var(--a3)}
  .debat-col.non{border-top:3px solid var(--a4)}
  .debat-t{font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}
  .debat-col.oui .debat-t{color:var(--a3)}
  .debat-col.non .debat-t{color:var(--a4)}
  .debat-col li{font-size:.87rem;line-height:1.6;color:rgba(232,230,224,.75);
    padding:9px 0 9px 18px;position:relative;list-style:none;border-bottom:1px solid rgba(255,255,255,.05)}
  .debat-col li:last-child{border-bottom:none}
  .debat-col li::before{content:'';position:absolute;left:0;top:16px;width:5px;height:5px;border-radius:50%}
  .debat-col.oui li::before{background:var(--a3)}
  .debat-col.non li::before{background:var(--a4)}
  .debat-col li strong{color:var(--text);font-weight:500}

  /* ─── LEXIQUE ─── */
  .lex-search{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-family:'DM Sans',sans-serif;font-size:.88rem;padding:11px 15px;margin-bottom:14px}
  .lex-search:focus{outline:none;border-color:var(--a1)}
  .lex-search::placeholder{color:var(--text-faint)}
  .lex td:first-child{font-family:'DM Mono',monospace;color:var(--a2);font-weight:500}

  /* ─── SUJETS ─── */
  .sujet{border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:10px;
    background:var(--surface);display:flex;gap:16px;align-items:flex-start;transition:all .2s}
  .sujet:hover{border-color:var(--a4);transform:translateX(4px)}
  .sujet-n{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:900;color:var(--text-faint);line-height:1;flex-shrink:0}
  .sujet-q{font-size:.94rem;line-height:1.6;color:var(--text);margin-bottom:5px;font-weight:400}
  .sujet-h{font-size:.79rem;color:var(--text-dim);line-height:1.55}

  /* ─── À RETENIR ─── */
  .retenir{background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 12%,transparent),rgba(255,255,255,.02));
    border:1px solid color-mix(in srgb,var(--a1) 30%,transparent);border-radius:var(--radius);padding:28px 30px}
  .retenir li{font-size:.93rem;line-height:1.65;color:rgba(232,230,224,.82);
    padding:10px 0 10px 26px;position:relative;list-style:none;border-bottom:1px solid rgba(255,255,255,.06)}
  .retenir li:last-child{border-bottom:none}
  .retenir li::before{content:'✓';position:absolute;left:0;top:9px;color:var(--a1);font-size:.85rem}
  .retenir li strong{color:var(--text);font-weight:500}

  /* ─── PIED DE PAGE ─── */
  footer{text-align:center;padding:36px 40px;border-top:1px solid var(--border);
    font-family:'DM Mono',monospace;font-size:.7rem;color:var(--text-dim);letter-spacing:.14em;
    text-transform:uppercase}

  /* ─── ANIMATION ─── */
  .rev{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
  .rev.vu{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){.rev{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
  :focus-visible{outline:2px solid var(--a1);outline-offset:3px}

  /* ─── RESPONSIVE ─── */
  @media(max-width:1080px){
    .rail{display:none}
    .layout{padding:32px 22px 70px}
    .chrono-mobile{display:block}
  }
  @media(max-width:680px){
    nav{padding:12px 18px;flex-wrap:wrap}
    .breadcrumb{font-size:.7rem;order:3;width:100%}
    .hero{padding:52px 20px 40px}
    .debat{grid-template-columns:1fr}
    .partie-head{gap:14px}
    .partie-num{font-size:2.4rem}
  }
  /* ─── IMPRESSION ─── */
  @media print{
    body{background:#fff;color:#111}
    nav,.rail,#progress,.bg-orb,.nav-right{display:none!important}
    .hero{background:none;border-bottom:2px solid #111;padding:0 0 22px}
    .hero h1,.prose,.liste li,.bloc-title{color:#111}
    .layout{display:block;padding:0}
    .partie,.bloc{break-inside:avoid;page-break-inside:avoid}
    .rev{opacity:1;transform:none}
    .chrono-mobile{display:block!important}
  }
</style>
</head>
<body>

<div id="progress"></div>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<nav>
  <div class="nav-logo" onclick="location.href='../../../../index.html'">ECG Prépa</div>
  <div class="breadcrumb">
    <span onclick="location.href='../../../../index.html'">Accueil</span>
    <span class="sep">/</span>
    <span onclick="location.href='../../../index.html'">2ème Année</span>
    <span class="sep">/</span>
    <span onclick="location.href='../../index.html'">Langues</span>
    <span class="sep">/</span>
    <span onclick="location.href='../index.html'">Civilisation</span>
    <span class="sep">/</span>
    <span class="current" id="bc-titre">—</span>
  </div>
  <div class="nav-right">
    <button id="ap-btn-fr" class="ap-lang-btn active" onclick="setLang('fr')">🇫🇷 FR</button>
    <button id="ap-btn-en" class="ap-lang-btn" onclick="setLang('en')">🇬🇧 EN</button>
  </div>
</nav>

<header class="hero" id="hero"></header>

<div class="layout">
  <aside class="rail" id="rail"></aside>
  <main id="cours"></main>
</div>

<footer id="ft"></footer>


<!-- ══════════════════════════════════════════════════════════════════
     ⬇⬇⬇  SEULE PARTIE À MODIFIER POUR UN NOUVEAU COURS  ⬇⬇⬇
     ══════════════════════════════════════════════════════════════════ -->
<script id="donnees">
const COURS = {

  /* ─── 1. IDENTITÉ DU COURS ───────────────────────────────────────── */
  meta: {
    theme:     "specialrel",
    drapeau:   "🤝",
    chapitre:  "8",
    label:     { fr:"Royaume-Uni · Chapitre 08", en:"United Kingdom · Chapter 08" },
    titre:     { fr:"La Special Relationship <span class=\"amp\">&</span> la Politique Étrangère", en:"The Special Relationship <span class=\"amp\">&</span> Foreign Policy" },
    sousTitre: { fr:"De Churchill à Trump : alliance stratégique indéfectible ou fiction diplomatique entretenue par un partenaire structurellement plus faible ?",
                 en:"From Churchill to Trump: an unbreakable strategic alliance, or a diplomatic fiction sustained by a structurally weaker partner?" }
  },

  /* ─── 2. L'ESSENTIEL + CHIFFRES CLÉS ─────────────────────────────── */
  essentiel: {
    fr:"L'expression <strong>« special relationship »</strong>, popularisée par <strong>Winston Churchill</strong> dans son discours de Fulton en 1946, désigne le lien privilégié unissant le Royaume-Uni aux États-Unis depuis l'alliance de guerre — coopération de <strong>renseignement</strong> unique au monde (accord UKUSA de 1946, base du réseau <em>Five Eyes</em>), <strong>partage nucléaire</strong> (Mutual Defense Agreement de 1958) et solidarité diplomatique quasi systématique. Mais cette relation reste structurellement <strong>asymétrique</strong> : la crise de Suez (1956) l'a démontré une fois pour toutes, et chaque décennie révèle de nouvelles tensions — guerre d'Irak (2003), Brexit et le mirage du <em>« Global Britain »</em>, jusqu'à la crise ouverte de 2026 entre <strong>Donald Trump</strong> et le gouvernement britannique autour de la guerre en Iran, qui a vu le Premier ministre <strong>Keir Starmer</strong> démissionner en juillet 2026, remplacé par <strong>Andy Burnham</strong>.",
    en:"The phrase <strong>“special relationship,”</strong> popularised by <strong>Winston Churchill</strong> in his 1946 Fulton speech, describes the privileged bond between the UK and the US since their wartime alliance — a uniquely deep <strong>intelligence partnership</strong> (the 1946 UKUSA Agreement, foundation of the <em>Five Eyes</em> network), <strong>nuclear sharing</strong> (the 1958 Mutual Defense Agreement) and near-systematic diplomatic solidarity. But the relationship remains structurally <strong>asymmetric</strong>: the 1956 Suez Crisis proved it once and for all, and each decade has revealed fresh tensions — the Iraq War (2003), Brexit and the mirage of <em>“Global Britain,”</em> up to the open 2026 rift between <strong>Donald Trump</strong> and the British government over the Iran war, which saw Prime Minister <strong>Keir Starmer</strong> resign in July 2026, replaced by <strong>Andy Burnham</strong>."
  },

        blocs:[
          { t:"p", c:{
            fr:"L'expression <strong>« special relationship »</strong> naît formellement le 5 mars 1946, lorsque <strong>Winston Churchill</strong>, alors chef de l'opposition, prononce à <strong>Fulton (Missouri)</strong> son célèbre discours sur le « rideau de fer », dans lequel il appelle à une <em>« association fraternelle des peuples anglophones »</em> face à la menace soviétique. Le terme capitalise sur une alliance de guerre déjà exceptionnelle : le programme de <strong>Lend-Lease</strong> (1941), par lequel Washington arme et ravitaille massivement le Royaume-Uni avant même l'entrée en guerre américaine, ainsi que l'intégration militaire poussée des états-majors alliés (SHAEF) sous Eisenhower.",
            en:"The phrase <strong>“special relationship”</strong> was formally coined on 5 March 1946, when <strong>Winston Churchill</strong>, then Leader of the Opposition, delivered his famous “Iron Curtain” speech at <strong>Fulton, Missouri</strong>, calling for a <em>“fraternal association of the English-speaking peoples”</em> against the Soviet threat. The term built on an already exceptional wartime alliance: the <strong>Lend-Lease</strong> programme (1941), through which Washington massively armed and supplied Britain even before entering the war, and the deep military integration of Allied command (SHAEF) under Eisenhower."} },
          { t:"p", c:{
            fr:"Dès 1946, cette proximité se traduit institutionnellement par l'<strong>accord UKUSA</strong>, un traité de partage de renseignement d'origine secrète qui deviendra, en s'élargissant au Canada, à l'Australie et à la Nouvelle-Zélande, le réseau <strong>Five Eyes</strong> — la coopération de renseignement électronique la plus intégrée au monde, encore active aujourd'hui.",
            en:"By 1946, this closeness was institutionalised through the <strong>UKUSA Agreement</strong>, an originally secret intelligence-sharing treaty which, once expanded to Canada, Australia and New Zealand, became the <strong>Five Eyes</strong> network — the world's most integrated signals-intelligence partnership, still active today."} },

            en:"The <strong>Suez Crisis</strong> (1956) was the relationship's first great trauma. When Britain, France and Israel invaded Egypt after Nasser nationalised the canal, US President <strong>Eisenhower</strong>, furious at not being consulted and worried about Cold War fallout, forced a <strong>humiliating withdrawal</strong> by threatening to destabilise the pound sterling on financial markets. The episode showed, as early as the 1950s, that the “special relationship” guarantees the UK <strong>no strategic autonomy</strong> whenever American interests diverge."} },

    { nom:"Andy Burnham", role:{fr:"Premier ministre depuis juillet 2026",en:"Prime Minister since July 2026"}, c:"var(--a1)",
      d:{fr:"Succède à Starmer ; orientation encore incertaine de sa politique envers Washington.",
         en:"Succeeded Starmer; his approach to Washington remains largely untested."} }
  ],

  /* ─── 6. DÉBAT (pour la dissertation) ────────────────────────────── */
  debat: {
    question: {fr:"La « special relationship » est-elle un mythe diplomatique ou une réalité stratégique ?", en:"Is the “special relationship” a diplomatic myth or a strategic reality?"},
    oui: {
      titre:{fr:"Thèse — une coopération réelle et sans équivalent", en:"Thesis — real, unparalleled cooperation"},
      items:{
        fr:[
          "Un partage de <strong>renseignement</strong> (Five Eyes) plus intégré qu'entre tout autre couple d'alliés occidentaux.",
          "Le <strong>seul accord nucléaire</strong> jamais signé par les États-Unis avec un pays tiers (1958).",
          "Une solidarité militaire concrète et répétée : Malouines (1982), Golfe (1991), Irak (2003), AUKUS (2021).",
          "Un accord commercial obtenu <strong>avant</strong> la plupart des autres partenaires de Washington en 2025.",
          "Une proximité culturelle et linguistique qui facilite une coordination diplomatique rapide."
        ],
        en:[
          "<strong>Intelligence sharing</strong> (Five Eyes) more integrated than between any other pair of Western allies.",
          "The <strong>only nuclear agreement</strong> the US has ever signed with another country (1958).",
          "Concrete, repeated military solidarity: the Falklands (1982), the Gulf (1991), Iraq (2003), AUKUS (2021).",
          "A trade deal secured <strong>ahead of</strong> most of Washington's other partners in 2025.",
          "Cultural and linguistic closeness that eases rapid diplomatic coordination."
        ]
      }
    },
    non: {
      titre:{fr:"Antithèse — une relation structurellement asymétrique", en:"Antithesis — a structurally asymmetric relationship"},
      items:{
        fr:[
          "<strong>Suez (1956)</strong> a démontré, une fois pour toutes, l'absence d'autonomie stratégique réelle du Royaume-Uni.",
          "L'<strong>Irak (2003)</strong> illustre le risque de suivisme diplomatique coûteux pour le partenaire britannique.",
          "La crise de <strong>2026</strong> montre que la moindre divergence (Iran, Chagos, Groenland) fragilise durablement le lien.",
          "Le Royaume-Uni reste un partenaire <strong>secondaire</strong> pour Washington face à des priorités indo-pacifiques ou chinoises.",
          "La chute de <strong>Starmer</strong> illustre le coût politique intérieur d'un alignement perçu comme trop risqué."
        ],
        en:[
          "<strong>Suez (1956)</strong> proved once and for all Britain's lack of real strategic autonomy.",
          "<strong>Iraq (2003)</strong> illustrates the risk of costly diplomatic followership for the British partner.",
          "The <strong>2026</strong> crisis shows that even minor divergence (Iran, Chagos, Greenland) durably weakens the bond.",
          "The UK remains a <strong>secondary</strong> partner for Washington against Indo-Pacific or China-focused priorities.",
          "<strong>Starmer's</strong> fall illustrates the domestic political cost of alignment perceived as too risky."
        ]
      }
    },
    synthese: {
      fr:"La special relationship n'est ni un mythe pur ni une alliance d'égal à égal : c'est une <strong>coopération institutionnelle réelle</strong> (renseignement, nucléaire) doublée d'une <strong>dépendance politique structurelle</strong> qui expose régulièrement le Royaume-Uni à un choix impossible entre solidarité atlantique et souveraineté diplomatique — un dilemme que la crise de 2026 et la chute de Starmer viennent, une fois de plus, illustrer.",
      en:"The special relationship is neither a pure myth nor an alliance of equals: it is <strong>real institutional cooperation</strong> (intelligence, nuclear) coupled with a <strong>structural political dependency</strong> that regularly forces the UK into an impossible choice between Atlantic solidarity and diplomatic sovereignty — a dilemma the 2026 crisis and Starmer's fall have, once again, illustrated."
    }
  },

  /* ─── 7. LEXIQUE BILINGUE ────────────────────────────────────────── */
  lexique: [
    { en:"the special relationship",     fr:"la relation privilégiée UK-USA" },
    { en:"the Fulton speech",            fr:"le discours de Fulton (Churchill, 1946)" },
    { en:"the UKUSA Agreement",          fr:"l'accord de renseignement de 1946" },
    { en:"the Five Eyes",                fr:"le réseau de renseignement à cinq pays" },
    { en:"Lend-Lease",                   fr:"le programme américain de prêt-bail (1941)" },
    { en:"the Mutual Defense Agreement", fr:"l'accord de coopération nucléaire de 1958" },
    { en:"AUKUS",                        fr:"le pacte de défense UK-USA-Australie (2021)" },
    { en:"Global Britain",               fr:"la doctrine diplomatique post-Brexit" },
    { en:"a state visit",                fr:"une visite d'État" },
    { en:"tariffs",                      fr:"les droits de douane" },
    { en:"regime change",                fr:"le changement de régime (imposé de l'extérieur)" },
    { en:"a junior partner",             fr:"un partenaire subalterne (dans une alliance asymétrique)" },
    { en:"strategic autonomy",           fr:"l'autonomie stratégique" },
    { en:"a diplomatic rift",            fr:"une brouille/rupture diplomatique" },
    { en:"to resign",                    fr:"démissionner" }
  ],

  /* ─── 8. SUJETS DE DISSERTATION ──────────────────────────────────── */
  sujets: [
    { q:{fr:"La « special relationship » a-t-elle jamais été une relation d'égal à égal ?",
         en:"Has the “special relationship” ever been a relationship of equals?"},
      h:{fr:"S'appuyer sur Suez (1956) comme moment fondateur de la démonstration d'asymétrie.",
         en:"Use Suez (1956) as the founding moment proving structural asymmetry."} },
    { q:{fr:"Le Brexit a-t-il renforcé ou fragilisé la relation entre le Royaume-Uni et les États-Unis ?",
         en:"Has Brexit strengthened or weakened UK-US relations?"},
      h:{fr:"Nuancer entre le récit politique de « Global Britain » et les résultats concrets (accord de 2025, tensions 2026).",
         en:"Contrast the “Global Britain” political narrative with concrete outcomes (2025 deal, 2026 tensions)."} },
    { q:{fr:"La crise de 2026 marque-t-elle la fin de la special relationship ?",
         en:"Does the 2026 crisis mark the end of the special relationship?"},
      h:{fr:"Distinguer la fragilité conjoncturelle (personnalités, Iran) de la solidité institutionnelle (Five Eyes, nucléaire).",
         en:"Distinguish conjunctural fragility (personalities, Iran) from institutional solidity (Five Eyes, nuclear)."} }
  ],

  /* ─── 9. À RETENIR ───────────────────────────────────────────────── */
  retenir: {
    fr:[
      "L'expression naît du discours de <strong>Fulton</strong> (Churchill, 1946) ; ce n'est jamais un traité officiel.",
      "L'<strong>accord UKUSA</strong> (1946) fonde le réseau de renseignement <strong>Five Eyes</strong>, toujours actif.",
      "Le <strong>Mutual Defense Agreement</strong> (1958) reste l'unique accord nucléaire américain avec un pays tiers.",
      "La <strong>crise de Suez</strong> (1956) a démontré dès l'origine l'absence d'autonomie stratégique britannique.",
      "<strong>Blair</strong> et l'Irak (2003) illustrent le risque politique d'un alignement trop marqué sur Washington.",
      "Le pacte <strong>AUKUS</strong> (2021) illustre la persistance d'un axe stratégique anglo-saxon post-Brexit.",
      "La crise <strong>Iran 2026</strong> (refus initial de Starmer) provoque une rupture ouverte avec Trump.",
      "<strong>Keir Starmer</strong> démissionne en juin 2026, remplacé par <strong>Andy Burnham</strong> en juillet 2026."
    ],
    en:[
      "The phrase originates in Churchill's <strong>Fulton speech</strong> (1946); it was never an official treaty.",
      "The <strong>UKUSA Agreement</strong> (1946) founded the <strong>Five Eyes</strong> intelligence network, still active today.",
      "The <strong>Mutual Defense Agreement</strong> (1958) remains the only US nuclear deal with another country.",
      "The <strong>Suez Crisis</strong> (1956) exposed Britain's lack of strategic autonomy from the very start.",
      "<strong>Blair</strong> and Iraq (2003) show the political risk of aligning too closely with Washington.",
      "The <strong>AUKUS</strong> pact (2021) shows the persistence of a post-Brexit Anglo-Saxon strategic axis.",
      "The <strong>2026 Iran crisis</strong> (Starmer's initial refusal) triggered an open rift with Trump.",
      "<strong>Keir Starmer</strong> resigned in June 2026, succeeded by <strong>Andy Burnham</strong> in July 2026."
    ]
  }
};
</script>

<script>
/* ─── Utilitaires ─── */
const $ = (s,r=document)=>r.querySelector(s);
let LANG = 'fr';
/* T() : renvoie la version dans la langue courante, ou la valeur telle quelle */
const T = v => (v && typeof v==='object' && !Array.isArray(v) && ('fr' in v||'en' in v)) ? (v[LANG] ?? v.fr) : v;

/* ─── Libellés d'interface ─── */
const UI = {
  fr:{ chrono:"Chronologie",
       essentiel:"L'essentiel", reperes:"Repères", quiEstQui:"Qui est qui", acteurs:"Acteurs clés",
       controverse:"Controverse", vocab:"Vocabulaire", lexique:"Lexique bilingue",
       filtrer:"Filtrer le lexique…", terme:"Terme", trad:"Traduction / usage",
       entrainement:"Entraînement", sujets:"Sujets possibles", memoriser:"Mémoriser",
       retenir:"À retenir", synthese:"Synthèse", chapitre:"Chapitre" },
  en:{ chrono:"Timeline",
       essentiel:"In brief", reperes:"Key dates", quiEstQui:"Who's who", acteurs:"Key figures",
       controverse:"Debate", vocab:"Vocabulary", lexique:"Bilingual glossary",
       filtrer:"Filter the glossary…", terme:"Term", trad:"Translation / usage",
       entrainement:"Practice", sujets:"Essay questions", memoriser:"Revise",
       retenir:"Key takeaways", synthese:"Synthesis", chapitre:"Chapter" }
};
const t = k => UI[LANG][k];

/* ─── Rendu des blocs de contenu ─── */
function bloc(b){
  switch(b.t){
    case 'p':      return `<p class="prose">${T(b.c)}</p>`;
    case 'liste':  return `<ul class="liste">${T(b.items).map(i=>`<li>${i}</li>`).join('')}</ul>`;
    case 'faits':  return `<div class="faits">${T(b.items).map(i=>
                     `<div class="fait"><div class="fait-l">${T(i.l)}</div><div class="fait-v">${T(i.v)}</div></div>`).join('')}</div>`;
    case 'stats':  return `<div class="stats">${b.items.map(i=>
                     `<div class="stat" style="--c:${i.c||'var(--a1)'}"><span class="stat-n">${T(i.n)}</span><span class="stat-d">${T(i.d)}</span></div>`).join('')}</div>`;
    case 'citation':return `<blockquote class="citation"><p>« ${T(b.c)} »</p><cite>${T(b.src)}</cite></blockquote>`;
    case 'encadre':return `<div class="encadre" style="--c:${b.c||'var(--a2)'}"><div class="encadre-ic">${b.icon||'💡'}</div>
                     <div><div class="encadre-t">${T(b.titre)}</div><div class="encadre-c">${T(b.c2)}</div></div></div>`;
    case 'def':    return `<div class="def"><div class="def-mot">${T(b.mot)}</div><div class="def-c">${T(b.c)}</div></div>`;
    case 'tableau':return `<div class="tbl-wrap"><table><thead><tr>${T(b.head).map(h=>`<th>${h}</th>`).join('')}</tr></thead>
                     <tbody>${T(b.rows).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tl':     return `<div class="tl">${T(b.items).map(i=>
                     `<div class="tl-item"><div class="tl-d">${T(i.d)}</div><div class="tl-c">${T(i.c)}</div></div>`).join('')}</div>`;
    default:       return '';
  }
}

/* ─── En-tête ─── */
function rendreHero(){
  const m = COURS.meta;
  document.documentElement.dataset.theme = m.theme;
  document.documentElement.lang = LANG;
  document.title = T(m.titre).replace(/<[^>]+>/g,'') + ' — Civilisation';
  $('#bc-titre').textContent = (m.titre.fr ?? m.titre).replace(/<[^>]+>/g,'');   // la nav reste en français
  $('#ft').textContent = `${t('chapitre')} ${m.chapitre}${LANG==='fr'?' : ':': '}${T(m.titre).replace(/<[^>]+>/g,'')}`;
  $('#hero').innerHTML = `
    <span class="hero-flag">${m.drapeau}</span>
    <div class="hero-label">${T(m.label)}</div>
    <h1>${T(m.titre)}</h1>
    <p class="hero-sub">${T(m.sousTitre)}</p>`;
}

/* ─── Corps du cours ─── */
function rendreCours(){
  const c = COURS, out = [];

  out.push(`<section class="bloc rev" id="s-essentiel">
    <div class="essentiel"><div class="essentiel-label">${t('essentiel')}</div><p>${T(c.essentiel)}</p></div>
    <div class="stats">${c.chiffres.map((x,i)=>
      `<div class="stat" style="--c:var(--a${(i%4)+1})"><span class="stat-n">${T(x.n)}</span><span class="stat-d">${T(x.d)}</span></div>`).join('')}</div>
  </section>`);

  if(c.chronologie?.length){
    out.push(`<section class="bloc rev chrono-mobile" id="s-chrono">
      <div class="bloc-head"><span class="bloc-kicker">${t('reperes')}</span><h2 class="bloc-title">${t('chrono')}</h2></div>
      ${bloc({t:'tl',items:c.chronologie})}</section>`);
  }

  c.parties.forEach((p,pi)=>{
    let html = `<section class="partie rev" id="p-${pi}" style="--p:${p.couleur}">
      <div class="partie-head"><div class="partie-num">${p.num}</div>
      <div><div class="partie-kicker">${T(p.kicker)}</div><h2 class="partie-title">${T(p.titre)}</h2></div></div>`;
    p.sections.forEach((s,si)=>{
      html += `<div class="section" id="p-${pi}-${si}"><h3 class="section-title"><span class="section-num">${si+1}.</span> ${T(s.titre)}</h3>
        ${s.blocs.map(bloc).join('')}</div>`;
    });
    out.push(html+`</section>`);
  });

  if(c.acteurs?.length){
    out.push(`<section class="bloc rev" id="s-acteurs">
      <div class="bloc-head"><span class="bloc-kicker">${t('quiEstQui')}</span><h2 class="bloc-title">${t('acteurs')}</h2></div>
      <div class="acteurs">${c.acteurs.map(a=>
        `<div class="acteur" style="--c:${a.c}"><div class="acteur-nom">${a.nom}</div>
         <div class="acteur-role">${T(a.role)}</div><div class="acteur-c">${T(a.d)}</div></div>`).join('')}</div></section>`);
  }

  if(c.debat){
    out.push(`<section class="bloc rev" id="s-debat">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a4)">${t('controverse')}</span>
      <h2 class="bloc-title">${T(c.debat.question)}</h2></div>
      <div class="debat">
        <div class="debat-col oui"><div class="debat-t">${T(c.debat.oui.titre)}</div>
          <ul>${T(c.debat.oui.items).map(i=>`<li>${i}</li>`).join('')}</ul></div>
        <div class="debat-col non"><div class="debat-t">${T(c.debat.non.titre)}</div>
          <ul>${T(c.debat.non.items).map(i=>`<li>${i}</li>`).join('')}</ul></div>
      </div>
      ${c.debat.synthese?`<div class="encadre" style="--c:var(--a1);margin-top:14px">
        <div class="encadre-ic">⚖️</div><div><div class="encadre-t">${t('synthese')}</div>
        <div class="encadre-c">${T(c.debat.synthese)}</div></div></div>`:''}
    </section>`);
  }

  if(c.lexique?.length){
    out.push(`<section class="bloc rev" id="s-lexique">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a2)">${t('vocab')}</span>
      <h2 class="bloc-title">${t('lexique')}</h2></div>
      <input class="lex-search" id="lex-search" placeholder="${t('filtrer')}" aria-label="${t('filtrer')}">
      <div class="tbl-wrap"><table class="lex"><thead><tr><th>${t('terme')}</th><th>${t('trad')}</th></tr></thead>
      <tbody id="lex-body">${c.lexique.map(l=>`<tr><td>${l.en}</td><td>${l.fr}</td></tr>`).join('')}</tbody></table></div>
    </section>`);
  }

  if(c.sujets?.length){
    out.push(`<section class="bloc rev" id="s-sujets">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a4)">${t('entrainement')}</span>
      <h2 class="bloc-title">${t('sujets')}</h2></div>
      ${c.sujets.map((s,i)=>`<div class="sujet"><div class="sujet-n">${String(i+1).padStart(2,'0')}</div>
        <div><div class="sujet-q">${T(s.q)}</div><div class="sujet-h">${T(s.h)}</div></div></div>`).join('')}</section>`);
  }

  if(c.retenir?.length){
    out.push(`<section class="bloc rev" id="s-retenir">
      <div class="bloc-head"><span class="bloc-kicker">${t('memoriser')}</span><h2 class="bloc-title">${t('retenir')}</h2></div>
      <div class="retenir"><ul>${T(c.retenir).map(r=>`<li>${r}</li>`).join('')}</ul></div></section>`);
  }

  $('#cours').innerHTML = out.join('');
}

/* ─── Colonne chronologie ─── */
function rendreRail(){
  if(!COURS.chronologie?.length){ $('#rail')?.remove(); return; }
  $('#rail').innerHTML = `<div class="rail-title">${t('chrono')}</div>${bloc({t:'tl',items:COURS.chronologie})}`;
}

/* ─── Recherche dans le lexique ─── */
function brancherLexique(){
  const ls = $('#lex-search'); if(!ls) return;
  ls.addEventListener('input', ()=>{
    const q = ls.value.toLowerCase().trim();
    $('#lex-body').querySelectorAll('tr').forEach(tr=>{
      tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
}

/* ─── Changement de langue ─── */
function setLang(lang){
  LANG = lang;
  $('#ap-btn-fr').classList.toggle('active', lang==='fr');
  $('#ap-btn-en').classList.toggle('active', lang==='en');
  rendreHero(); rendreCours(); rendreRail();
  document.querySelectorAll('.rev').forEach(el=>el.classList.add('vu'));
  brancherLexique();
}

/* ─── Démarrage ─── */
function demarrer(){
  rendreHero(); rendreCours(); rendreRail(); brancherLexique();

  const maj = ()=>{
    const h = document.body.scrollHeight - innerHeight;
    $('#progress').style.width = (h>0 ? (scrollY/h)*100 : 0) + '%';
  };
  addEventListener('scroll', maj, {passive:true}); maj();

  if(!('IntersectionObserver' in window)){
    document.querySelectorAll('.rev').forEach(el=>el.classList.add('vu'));
    return;
  }
  const io = new IntersectionObserver(es=>es.forEach(x=>{
    if(x.isIntersecting){ x.target.classList.add('vu'); io.unobserve(x.target); }
  }), {threshold:.06});
  document.querySelectorAll('.rev').forEach(el=>io.observe(el));
}

demarrer();
</script>
