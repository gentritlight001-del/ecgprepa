              "c": {
                "fr": "À partir de 2022, une <strong>inflation exceptionnellement élevée</strong> (dépassant 11 % en fin d'année, un niveau inédit depuis les années 1980) frappe le Royaume-Uni, sous l'effet conjugué de la reprise post-Covid, de la guerre en Ukraine sur les prix de l'énergie, et de tensions spécifiquement britanniques liées au Brexit sur les chaînes d'approvisionnement. Ce choc, baptisé <strong>« cost of living crisis »</strong> (crise du coût de la vie) dans le débat public, touche en priorité les <strong>dépenses contraintes</strong> (énergie, alimentation, logement) qui pèsent proportionnellement bien plus lourd dans le budget des ménages modestes que dans celui des ménages aisés.",
                "en": "From 2022, <strong>exceptionally high inflation</strong> (exceeding 11% by year's end, a level unseen since the 1980s) hit the UK, driven by the post-Covid recovery, the war in Ukraine's impact on energy prices, and Brexit-specific supply-chain strains. This shock, dubbed the <strong>“cost of living crisis”</strong> in public debate, hit <strong>essential spending</strong> hardest (energy, food, housing) which weighs proportionally far more heavily on low-income households' budgets than on wealthier ones."

                "fr": "Les <strong>prix de l'énergie</strong> cristallisent particulièrement la crise : le plafonnement réglementaire des tarifs (<span class='en'>« energy price cap »</span>) est relevé à plusieurs reprises en 2022, entraînant une explosion des factures de gaz et d'électricité qui pousse un nombre croissant de ménages dans une situation de <strong>« fuel poverty »</strong> (précarité énergétique), définie comme l'incapacité à chauffer correctement son logement à un coût raisonnable.",
                "en": "<strong>Energy prices</strong> crystallised the crisis in particular: the regulatory tariff cap (the <span class='en'>“energy price cap”</span>) was raised several times in 2022, causing gas and electricity bills to soar and pushing a growing number of households into <strong>“fuel poverty”</strong>, defined as being unable to adequately heat one's home at a reasonable cost."
              }

              },
              "c2": {
                "fr": "L'expression <span class='en'>« heating or eating »</span> (« se chauffer ou manger »), popularisée par la presse britannique durant l'hiver 2022-2023, résume le dilemme concret vécu par de nombreux ménages modestes, contraints d'arbitrer entre deux besoins fondamentaux faute de revenus suffisants pour couvrir les deux, une formule devenue symbole médiatique de la crise du coût de la vie.",
                "en": "The phrase <span class='en'>“heating or eating”</span>, popularised by the British press during the winter of 2022-23, sums up the concrete dilemma faced by many low-income households, forced to choose between two basic needs for lack of income to cover both, a phrase that became a media symbol of the cost-of-living crisis."

            "fr": "L'Universal Credit : simplification ou paupérisation ?",
            "en": "Universal Credit: simplification or impoverishment?"

              "t": "p",
              "c": {
                "fr": "L'<strong>Universal Credit</strong>, déployé progressivement depuis 2013, fusionne six prestations sociales distinctes (aide au logement, allocation chômage, crédit d'impôt, etc.) en un <strong>versement mensuel unique</strong>. Présentée par ses concepteurs comme une simplification bienvenue et une incitation renforcée à la reprise d'emploi, cette réforme s'est heurtée à des critiques persistantes : délai initial de versement de cinq semaines, poussant certains bénéficiaires vers l'endettement ou les banques alimentaires en attendant leur premier paiement, et complexité du système en ligne, source de difficultés pour les publics les moins à l'aise avec le numérique.",
                "en": "<strong>Universal Credit</strong>, progressively rolled out since 2013, merges six separate benefits (housing support, unemployment benefit, tax credits, etc.) into a <strong>single monthly payment</strong>. Presented by its designers as a welcome simplification and a stronger incentive to return to work, the reform has faced persistent criticism: an initial five-week wait for payment, pushing some claimants into debt or towards food banks while awaiting their first payment, and a complex online system, a source of difficulty for those less comfortable with digital tools."
              }
            },
            {
              "t": "p",
              "c": {
                "fr": "Durant la pandémie de Covid-19, le gouvernement instaure temporairement une <strong>majoration de 20 £ par semaine</strong> de l'Universal Credit, reconnaissant implicitement l'insuffisance du niveau de base des prestations. Ce complément, largement salué par les associations de lutte contre la pauvreté, est cependant <strong>supprimé</strong> en octobre 2021, alors même que l'inflation commence à s'accélérer, une décision jugée, rétrospectivement, particulièrement mal calibrée par de nombreux économistes.",
                "en": "During the Covid-19 pandemic, the government temporarily introduced a <strong>£20-a-week uplift</strong> to Universal Credit, implicitly acknowledging the base level of benefits was insufficient. This top-up, widely welcomed by anti-poverty charities, was nonetheless <strong>withdrawn</strong> in October 2021, just as inflation began accelerating, a decision many economists have retrospectively judged particularly badly timed."
              }
            }

                "en": "After its election in July 2024, <strong>Keir Starmer</strong>'s Labour government launched a <strong>“Child Poverty Strategy”</strong>, published on 5 December 2025: it projects 550,000 fewer children in relative poverty in 2029-30, notably through free school meals for all children in Universal Credit households from September 2026. Above all, the law abolishing the <strong>“two-child limit”</strong> received Royal Assent on 18 March 2026 and took effect on 6 April: the JRF estimates that about 400,000 fewer children are in poverty after that date."

                "en": "These gains remain fragile: the DWP still projects 3.6 million children in relative poverty after housing costs in 2029-30 (July 2026 projection), and the <strong>stated aim</strong> of reducing poverty collides with strict <strong>budget constraints</strong>, against a background of high public debt, a trade-off that cuts across governments of every colour."

                "fr": "Une pauvreté née de choix politiques cumulés",
                "en": "Poverty born of cumulative policy choices"

              "c2": {
                "fr": "La pauvreté britannique contemporaine n'est pas seulement un problème de <strong>revenu insuffisant</strong> : c'est un révélateur de choix politiques cumulés (austérité, réforme des aides sociales, plafonnement des prestations) dont les effets se combinent avec des chocs externes (inflation, Brexit) pour produire une situation où le <strong>travail lui-même</strong> ne garantit plus systématiquement d'échapper à la pauvreté, une rupture majeure avec le contrat social d'après-guerre.",
