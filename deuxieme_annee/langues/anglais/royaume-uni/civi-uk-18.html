              "t": "p",
              "c": {
                "fr": "Au début des années 2000, le <strong>grime</strong> naît dans les quartiers populaires de l'est de Londres (Bow, Hackney), au croisement du UK garage, du hip-hop et du jungle, porté par des <strong>radios pirates</strong> échappant à toute régulation. Dizzee Rascal et Wiley, souvent issus de la classe ouvrière et des minorités noires britanniques, y développent un flow rapide et agressif qui décrit le quotidien de leurs quartiers, longtemps ignoré des médias dominants et de la BBC.",
                "en": "In the early 2000s, <strong>grime</strong> was born in the working-class neighbourhoods of east London (Bow, Hackney), at the crossing of UK garage, hip-hop and jungle, carried by <strong>pirate radio</strong> stations outside any regulation. Dizzee Rascal and Wiley, often from working-class and Black British backgrounds, developed a fast, aggressive flow describing everyday life in their neighbourhoods, long ignored by mainstream media and the BBC."
              }
            },
            {
              "t": "p",
              "c": {
                "fr": "La reconnaissance vient par étapes : Dizzee Rascal remporte le <strong>Mercury Prize</strong> dès 2003 pour <em>Boy in da Corner</em>, puis Skepta le remporte en 2016 avec <em>Konnichiwa</em>, ce qui installe le genre dans le paysage culturel. Aujourd'hui, le grime est étudié à l'université au même titre que le rock ou le jazz.",
                "en": "Recognition came in stages: Dizzee Rascal won the <strong>Mercury Prize</strong> as early as 2003 for <em>Boy in da Corner</em>, then Skepta won it in 2016 with <em>Konnichiwa</em>, which set the genre in the cultural landscape. Today, grime is studied at university alongside rock or jazz."
              }

            "fr": "Le drill et le contrôle policier",

              "c": {
                "fr": "Héritier du grime, le <strong>drill</strong> britannique se développe dans le sud de Londres à partir des années 2010, avec des textes plus violents qui évoquent les rivalités entre bandes. Face à la hausse de la violence armée chez les jeunes, la police métropolitaine obtient dès 2018 le retrait de dizaines de clips de YouTube. Des juges prononcent aussi des <span class='en'>« criminal behaviour orders »</span> qui interdisent à des artistes de mentionner certains lieux ou personnes : en janvier 2019, les rappeurs Skengdo et AM reçoivent des peines avec sursis pour avoir joué un titre en violation d'une telle ordonnance.",
                "en": "An heir to grime, British <strong>drill</strong> developed in south London from the 2010s, with more violent lyrics evoking gang rivalries. Faced with rising youth gun violence, the Metropolitan Police obtained the removal of dozens of YouTube videos from 2018. Judges also issued <span class='en'>“criminal behaviour orders”</span> banning artists from mentioning certain places or people: in January 2019, rappers Skengdo and AM received suspended sentences for performing a track in breach of such an order."
              }
            },
            {
              "t": "p",
              "c": {
                "fr": "Deux lectures s'affrontent. Pour les autorités, il s'agit d'une préoccupation de sécurité légitime face à des drames parfois liés à des rivalités mises en scène dans les clips. Pour des artistes et des chercheurs, c'est une censure disproportionnée contre une musique associée à la jeunesse noire. Le conflit a un précédent : le <strong>Form 696</strong>, formulaire de sécurité exigé des organisateurs de concerts à Londres depuis 2005, accusé de cibler le grime, le garage et le R&B, a été abandonné par la police en novembre 2017.",
                "en": "Two readings clash. For the authorities, it is a legitimate safety concern in the face of tragedies sometimes linked to rivalries staged in videos. For artists and researchers, it is disproportionate censorship of a music associated with Black youth. The conflict has a precedent: <strong>Form 696</strong>, a risk assessment demanded of event organisers in London since 2005, accused of targeting grime, garage and R&B, was dropped by the police in November 2017."

            },

              "icon": "⚠️",

                "en": "Grime and drill: two distinct scenes"

              "c2": {
                "fr": "Ne pas confondre grime et drill : le premier, né dans les années 2000, est aujourd'hui largement reconnu et primé ; le second, plus récent et plus controversé, reste au cœur des tensions avec les autorités. Ne pas non plus attribuer le Form 696 au drill : il visait les soirées, et il est antérieur.",
                "en": "Do not confuse grime and drill: the first, born in the 2000s, is now widely recognised and awarded; the second, more recent and more controversial, remains at the heart of tensions with the authorities. Nor attribute Form 696 to drill: it targeted events, and predates it."

            "en": "Stormzy and the move into the mainstream"

              "c": {
                "fr": "En 2019, <strong>Stormzy</strong> devient le premier artiste noir britannique à assurer seul la tête d'affiche de Glastonbury, consécration du grime. Il investit sa notoriété dans des bourses pour étudiants noirs à l'université de Cambridge et lance une maison d'édition, <em>Merky Books</em>. Sa trajectoire s'inscrit dans une diversification plus large : Adele, Ed Sheeran, Dua Lipa ou Raye côtoient une génération issue des scènes urbaines.",
                "en": "In 2019, <strong>Stormzy</strong> became the first Black British artist to headline Glastonbury solo, the consecration of grime. He invests his fame in scholarships for Black students at Cambridge University and launched a publishing imprint, <em>Merky Books</em>. His path is part of a broader diversification: Adele, Ed Sheeran, Dua Lipa or Raye stand alongside a generation from the urban scenes."
