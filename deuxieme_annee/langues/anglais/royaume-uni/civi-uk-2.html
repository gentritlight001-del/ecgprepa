                "en": "The <strong>Prime Minister</strong> is not directly elected by anyone: by convention, they are the leader of the party holding (or able to form) a majority in the House of Commons, appointed by the monarch. They choose a <strong>Cabinet</strong> from among MPs (and a few Lords), govern under the principle of <strong>collective responsibility</strong> (a minister who disagrees with a Cabinet decision must resign or publicly back it), and answer individually for their own department before Parliament."

              "c": {
                "fr": "Le Royaume-Uni reste juridiquement un <strong>État unitaire</strong> : Westminster demeure souverain et pourrait, en théorie, abolir les institutions dévolues. Mais depuis 1998, l'Écosse, le pays de Galles et l'Irlande du Nord disposent de <strong>parlements ou assemblées propres</strong>, aux compétences croissantes (santé, éducation, une partie de la fiscalité pour l'Écosse) tandis que l'Angleterre, elle, ne dispose d'aucune institution équivalente et reste directement gouvernée par Westminster.",
                "en": "The UK legally remains a <strong>unitary state</strong>: Westminster remains sovereign and could, in theory, abolish the devolved institutions. But since 1998 Scotland, Wales and Northern Ireland have had their <strong>own parliaments or assemblies</strong>, with growing powers (health, education, and some tax powers for Scotland) while England has no equivalent institution and remains directly governed by Westminster."

                "fr": "L'Irlande du Nord illustre la fragilité de cet équilibre : l'exécutif de <strong>Stormont</strong> repose sur un partage obligatoire du pouvoir entre unionistes et nationalistes, et peut être suspendu si l'un des deux camps se retire, ce que le DUP a fait pendant deux ans après le Brexit. Le retour de l'exécutif en 2024, avec <strong>Michelle O'Neill</strong> (Sinn Féin) comme <span class='en'>First Minister</span>, marque un tournant symbolique fort dans l'histoire de la province.",
                "en": "Northern Ireland illustrates the fragility of this balance: the <strong>Stormont</strong> executive rests on mandatory power-sharing between unionists and nationalists, and can be suspended if either side withdraws, as the DUP did for two years after Brexit. The executive's return in 2024, with <strong>Michelle O'Neill</strong> (Sinn Féin) as <span class='en'>First Minister</span>, marked a powerful symbolic turning point in the province's history."

            {

              "c": {
                "fr": "En Écosse, la dévolution n'a pas éteint la question de l'indépendance : elle lui a donné une tribune institutionnelle. Le référendum de 2014 (55 % pour le maintien) devait clore le débat ; le Brexit, rejeté par 62 % des Écossais, l'a rouvert. La <strong>Cour suprême</strong> a jugé en novembre 2022 que le Parlement écossais ne pouvait organiser seul un second référendum sans l'accord de Westminster : preuve que la dévolution ne remet pas en cause la souveraineté ultime du Parlement central.",
                "en": "In Scotland, devolution did not close down the independence question: it gave it an institutional platform. The 2014 referendum (55% for staying) was meant to settle the matter; Brexit, rejected by 62% of Scots, reopened it. The <strong>Supreme Court</strong> ruled in November 2022 that the Scottish Parliament could not hold a second referendum alone, without Westminster's consent: proof that devolution does not challenge the ultimate sovereignty of the central Parliament."

                "en": "The elections of <strong>7 May 2026</strong> confirmed this divergence. In Wales, the Senedd was elected by <strong>list proportional representation</strong> for the first time: 96 members, six in each of 16 constituencies. Plaid Cymru came first (43 seats), ahead of Reform UK (34), while Labour, in power since 1999, fell to 9 seats. In Scotland, the SNP remained the largest party with 58 of 129 seats, and pro-independence parties kept their majority with the Greens. For the first time, all three devolved nations are led by pro-independence parties, which <a href=\"../../../../actualites/en/articles/uk-first-ministers-independence-cardiff-2026.html\">met in Cardiff</a> in September."

            {
              "t": "p",
              "c": {
                "fr": "Pendant l'essentiel du XXe siècle, la vie politique britannique alterne entre <strong>Conservateurs</strong> et <strong>Labour</strong>, les Libéraux-démocrates jouant un rôle d'appoint. Ce bipartisme, déjà érodé par la percée nationaliste écossaise et galloise à partir des années 1970, s'est fissuré plus profondément depuis le Brexit : montée du <strong>Reform UK</strong> de Nigel Farage à droite, poids durable du SNP en Écosse, progression des Verts et des Libéraux-démocrates.",
                "en": "For most of the 20th century, British politics alternated between <strong>Conservative</strong> and <strong>Labour</strong>, with the Liberal Democrats playing a supporting role. This two-party system, already eroded by Scottish and Welsh nationalist gains from the 1970s onward, has fractured more deeply since Brexit: the rise of Nigel Farage's <strong>Reform UK</strong> on the right, the SNP's lasting weight in Scotland, and gains for the Greens and Liberal Democrats."

              "t": "p",
              "c": {
                "fr": "Les élections locales du 7 mai 2026 en donnent la mesure. Sur plus de 5 000 sièges de conseillers en jeu en Angleterre, Reform UK en gagne plus de 1 400, quand le Labour en perd près de 1 500. Un parti qui n'avait que cinq députés en 2024 devient ainsi la première force du pays dans les sondages, et la défaite déclenche la chute de Keir Starmer.",
                "en": "The local elections of 7 May 2026 showed the scale of the shift. Of more than 5,000 council seats at stake in England, Reform UK gained over 1,400, while Labour lost almost 1,500. A party with only five MPs in 2024 thus became the country's leading force in the polls, and the defeat triggered Keir Starmer's downfall."

                "en": "In 2026, polls regularly put <strong>Reform UK ahead</strong> in national voting intentions: an unprecedented shift not seen since the emergence of the Labour party over a century ago. <span class='en'>First-Past-The-Post</span>, designed for a two-way contest, produces increasingly unpredictable results in this context, fuelling debate about replacing it."
