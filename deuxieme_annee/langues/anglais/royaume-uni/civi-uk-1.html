                "en": "<strong>World War I</strong> (1914-1918) cost the UK close to a million dead and permanently shook confidence in progress and the imperial order. <strong>World War II</strong> (1939-1945) struck the home territory directly with the <strong>Blitz</strong>, the Luftwaffe's massive bombing of British cities from 1940 onward; <strong>Winston Churchill</strong>, Prime Minister from May 1940, embodied national resistance against Nazi Germany through to victory in 1945."
