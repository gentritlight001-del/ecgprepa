                "fr": "Le déploiement, initialement prévu pour 2017, prend près d'une décennie de retard et fait l'objet de critiques récurrentes : le <strong>délai de cinq semaines</strong> avant le premier versement pousse de nombreux ménages vers l'endettement et le recours aux <em>food banks</em> (banques alimentaires), tandis que la mensualisation du paiement, calquée sur la logique d'un salaire, s'avère mal adaptée à des budgets déjà précaires.",

      "sections": [
        {
          "titre": {
            "fr": "L'austérité des années 2010 et ses effets sociaux",
            "en": "2010s austerity and its social effects"
          },
          "blocs": [
            {
              "t": "p",
              "c": {
                "fr": "À partir de 2010, le gouvernement de coalition conservateurs-libéraux-démocrates engage un vaste programme d'<strong>austérité</strong> pour réduire le déficit hérité de la crise de 2008 : gel des prestations sociales, plafonnement du montant total des aides par foyer (<span class='en'>benefit cap</span>), et surtout suppression progressive du lien automatique entre prestations et inflation. Le recours aux <strong>banques alimentaires</strong> explose, passant de quelques dizaines à plus de deux mille points de distribution à travers le pays, un phénomène quasiment inexistant avant 2010 : en 2025, le Trussell Trust distribue plus de 2,6 millions de colis, soit 45 % de plus qu'en 2019.",
                "en": "From 2010 the Conservative-Liberal Democrat coalition launched a vast <strong>austerity</strong> programme to cut the deficit inherited from the 2008 crisis: a freeze on benefits, a cap on the total aid per household (the <span class='en'>benefit cap</span>), and above all the gradual removal of the automatic link between benefits and inflation. Use of <strong>food banks</strong> soared, from a few dozen to over two thousand distribution points across the country, a phenomenon almost non-existent before 2010: in 2025 the Trussell Trust hands out more than 2.6 million parcels, 45% more than in 2019."
              }
            },
            {
              "t": "p",
              "c": {
                "fr": "La pandémie de <strong>Covid-19</strong> (2020) constitue une parenthèse : le <em>furlough scheme</em> (chômage partiel financé par l'État) protège des millions d'emplois, et l'Universal Credit bénéficie d'une hausse temporaire de <strong>20£ par semaine</strong>. Sa suppression en octobre 2021, en pleine inflation galopante, est largement critiquée comme la plus grande coupe budgétaire dans les prestations sociales depuis la création du Welfare State.",
                "en": "The <strong>Covid-19</strong> pandemic (2020) was a brief exception: the <em>furlough scheme</em> protected millions of jobs, and Universal Credit received a temporary <strong>£20-a-week uplift</strong>. Its removal in October 2021, amid soaring inflation, was widely criticised as the largest single cut to social security since the Welfare State's creation."
              }
            },
            {
              "t": "encadre",
              "icon": "📊",
              "c": "var(--a4)",
              "titre": {
                "fr": "Chiffre à retenir",
                "en": "A figure to remember"
              },
              "c2": {
                "fr": "Fin 2025, <strong>3,5 millions</strong> de personnes touchent le volet santé de l'Universal Credit, soit 41 % de plus qu'un an plus tôt, ce qui alimente le débat sur la soutenabilité du système face à une population vieillissante et à une hausse des troubles de santé mentale déclarés.",
                "en": "At the end of 2025, <strong>3.5 million</strong> people receive the Universal Credit health element, 41% more than a year earlier, fuelling the debate on the system's sustainability in the face of an ageing population and a rise in reported mental health conditions."
              }
            }

        {
          "titre": {
            "fr": "Les réformes 2025-2026 : Pathways to Work et ses limites",
            "en": "The 2025-2026 reforms: Pathways to Work and its limits"
          },
          "blocs": [
            {
              "t": "p",
              "c": {
                "fr": "En mars 2025, la ministre travailliste du Travail et des Retraites de l'époque, Liz Kendall, publie le livre vert « <span class='en'>Pathways to Work</span> », présenté comme la « plus grande réforme du Welfare State en une génération ». Le texte prévoit notamment de durcir les critères d'éligibilité à la <strong>Personal Independence Payment</strong> (PIP), en exigeant un score minimal de 4 points sur au moins une activité de la vie quotidienne, une mesure censée générer environ 3,5 milliards de livres d'économies d'ici 2029.",
                "en": "In March 2025 the then Labour Work and Pensions Secretary, Liz Kendall, published the green paper “<span class='en'>Pathways to Work</span>”, presented as the “biggest reform of the welfare state in a generation”. It notably planned to tighten eligibility for the <strong>Personal Independence Payment</strong> (PIP), requiring a minimum score of 4 points on at least one daily-living activity, a measure expected to save about £3.5 billion by 2029."
              }
            },
            {
              "t": "p",
              "c": {
                "fr": "Face à une fronde de députés travaillistes, le gouvernement recule en juillet 2025 : les nouveaux critères du PIP sont retirés du projet de loi et renvoyés à la <strong>revue Timms</strong>, dont le rapport intermédiaire du 9 juillet 2026 juge le PIP « inadapté à son objet » (<span class='en'>no longer fit for purpose</span>), avec des recommandations finales attendues à l'automne 2026. D'autres réformes entrent tout de même en vigueur en 2026 : baisse du volet santé de l'Universal Credit pour les nouveaux demandeurs (d'environ 423 £ à 217 £ par mois), réforme du <span class='en'>Statutory Sick Pay</span> (suppression du délai de carence), et report des réformes les plus structurelles (évaluation de la capacité de travail) à 2028-2029.",
                "en": "Facing a revolt by Labour MPs, the government backs down in July 2025: the new PIP criteria are removed from the bill and referred to the <strong>Timms review</strong>, whose interim report of 9 July 2026 finds PIP “no longer fit for purpose”, with final recommendations due in autumn 2026. Other reforms still take effect in 2026: a cut to the Universal Credit health element for new claimants (from about £423 to £217 a month), a reform of <span class='en'>Statutory Sick Pay</span> (removal of the waiting period), and the postponement of the most structural reforms (work capability assessment) to 2028-2029."
              }
            },
            {
              "t": "image",
              "src": "images/brexit-burnham-2026.webp",
              "l": 1476,
              "h": 828,
              "format": "droite",
              "titre": {

                "en": "Andy Burnham"

              "legende": {
                "fr": "Andy Burnham, Premier ministre depuis le 20 juillet 2026, promet de « prendre au sérieux » la facture sociale.",
                "en": "Andy Burnham, Prime Minister since 20 July 2026, promises to “get serious” about the welfare bill."
              },
              "alt": {
                "fr": "Andy Burnham souriant à la tribune, devant un fond rouge",
                "en": "Andy Burnham smiling at the podium in front of a red backdrop"
              }
            },
            {
              "t": "p",
              "c": {
                "fr": "Le 6 avril 2026, le <strong>plafond de deux enfants</strong>, qui privait de prestations les troisièmes enfants nés depuis avril 2017, est supprimé : près de 496 000 ménages à l'Universal Credit étaient concernés en avril 2026, mais le plafonnement global des aides par foyer demeure. Devenu Premier ministre le 20 juillet 2026, Andy Burnham écarte les « coupes brutales » tout en promettant de « prendre au sérieux » la facture sociale ; Pat McFadden reste ministre du Travail et des Retraites et attend les conclusions de la revue Timms.",
                "en": "On 6 April 2026 the <strong>two-child limit</strong>, which denied benefits to third children born since April 2017, was abolished: nearly 496,000 Universal Credit households were affected in April 2026, but the overall household benefit cap remains. Prime Minister since 20 July 2026, Andy Burnham rules out “crude cuts” while promising to “get serious” about the welfare bill; Pat McFadden remains Work and Pensions Secretary and awaits the Timms review's conclusions."
              }
            },
            {
              "t": "p",
              "c": {
                "fr": "En parallèle, le parti populiste <strong>Reform UK</strong>, en tête des sondages en 2026, présente en août 2026, par la voix de son porte-parole au Trésor Robert Jenrick, une réforme radicalement plus ambitieuse : la suppression pure et simple du PIP et du volet santé de l'Universal Credit pour les actifs, remplacés par une nouvelle « <span class='en'>Health Security Allowance</span> » réservée aux cas les plus graves, pour une économie annoncée de 50 milliards de livres. Ce projet, salué par une partie de l'opinion inquiète du coût du système, est vivement dénoncé par les associations de défense des personnes handicapées comme un retour en arrière historique.",
                "en": "At the same time the populist party <strong>Reform UK</strong>, leading the polls in 2026, unveils in August 2026, through its Treasury spokesman Robert Jenrick, a far more ambitious reform: the outright abolition of PIP and the Universal Credit health element for working-age adults, replaced by a new “<span class='en'>Health Security Allowance</span>” reserved for the most severe cases, for an announced saving of £50 billion. This plan, welcomed by part of a public worried about the system's cost, is fiercely denounced by disability charities as a historic step backwards."
              }
            },
            {
              "t": "encadre",
              "icon": "🎯",
              "c": "var(--a1)",
              "titre": {
                "fr": "Beveridge, quatre-vingts ans après",
                "en": "Beveridge, eighty years on"
              },
              "c2": {
                "fr": "Quatre-vingts ans après Beveridge, le débat britannique reste structuré par la <strong>même tension originelle</strong> : jusqu'où un État peut-il garantir une sécurité universelle sans décourager le travail, et jusqu'où peut-il cibler l'aide sans abandonner les plus vulnérables ? La percée électorale de Reform UK montre que ce débat, loin d'être clos, redevient un <strong>clivage politique central</strong>.",
                "en": "Eighty years after Beveridge, British debate is still structured by the <strong>same original tension</strong>: how far can a state guarantee universal security without discouraging work, and how far can it target support without abandoning the most vulnerable? Reform UK's electoral surge shows this debate, far from settled, is becoming a <strong>central political fault line</strong> once again."
              }
            }
