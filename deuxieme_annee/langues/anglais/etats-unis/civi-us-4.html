                "en": "Do not write that “Americans elect their president”: they elect <strong>electors</strong>, state by state, and the vast majority live in a state whose result is a foregone conclusion. Another confusion to avoid: the Electoral College does not <em>create</em> geographic polarisation, it <strong>amplifies</strong> it. And it structurally favours neither party: its advantage depends on the territorial distribution of electorates at a given moment, and it worked in the Republicans' favour in 2000 and 2016."
