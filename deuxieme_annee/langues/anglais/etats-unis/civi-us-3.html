                "fr": "Les treize colonies devenues États en 1776 tiennent farouchement à leur autonomie : les Articles de Confédération leur laissent une souveraineté quasi complète et condamnent le Congrès à l'impuissance. Mais la décennie 1780 (impossibilité de lever l'impôt, guerres commerciales entre États, insurrections locales) montre qu'une union purement contractuelle ne tient pas. Les constituants de 1787 inventent une troisième voie : un gouvernement central qui agit directement sur les citoyens, mais dont les compétences sont limitativement énumérées. Le <a href=\"civi-us-2.html\">chapitre précédent</a> en décrit le cadre constitutionnel.",

                "en": "Until the 1930s, <strong>dual federalism</strong> prevails, the “layer cake”: two juxtaposed spheres with clearly separate powers. The New Deal tips the system towards <strong>cooperative federalism</strong>, the “marble cake”: both levels co-fund and co-administer the same policies, from highways to welfare. This expansion rests on a very broad reading of the Commerce Clause, pushed to its limit by <em>Wickard v. Filburn</em> (1942), which brings even wheat consumed on the farm under federal power."

                "en": "Cooperative federalism also means the Union imposing on states a right they refuse. After <em>Brown v. Board of Education</em> (1954), Arkansas governor Orval Faubus uses his state's National Guard to stop nine Black students from entering Little Rock's Central High School; in September 1957, Eisenhower <strong>federalises the Guard</strong> and sends in the 101st Airborne Division. “States' rights” then become the argument of Southern resistance, which the <a href=\"civi-us-5.html\">civil rights movement</a> and the 1964-65 laws eventually overcome."

                "fr": "Depuis janvier 2025, le conflit entre l'exécutif fédéral et les États dirigés par l'opposition s'est institutionnalisé. Sur l'immigration, le ministère de la Justice poursuit des villes, des comtés et des États qui pratiquent des politiques dites sanctuaires ; ces derniers invoquent l'anti-commandeering pour refuser de mobiliser leurs polices au service des expulsions. Sur le terrain de l'ordre public, la fédéralisation de la Garde nationale, force placée en temps normal sous l'autorité des gouverneurs, a été tentée en Californie, en Oregon puis en Illinois.",
                "en": "Since January 2025, the conflict between the federal executive and opposition-led states has become institutionalised. On immigration, the Justice Department sues cities, counties and states that run so-called sanctuary policies; the latter invoke anti-commandeering to refuse to mobilise their police for deportations. On public order, the federalisation of the National Guard, a force that is normally under governors' authority, was attempted in California, Oregon and then Illinois."

                "en": "In forty-three states, the attorney general is directly elected, which gives them a legitimacy of their own and wide freedom of action. For some fifteen years these officials have formed partisan coalitions that systematically challenge the policies of the opposing president: Republican attorneys general against Obama then Biden, Democratic ones against both Trump administrations. Federalist litigation has become an ordinary form of opposition, doubling parliamentary debate with a permanent judicial confrontation."
