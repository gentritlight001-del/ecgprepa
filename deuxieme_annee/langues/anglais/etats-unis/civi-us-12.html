<!DOCTYPE html>
<html lang="fr" data-theme="americain2">
<head>
<script src="../../../../auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Armes à feu et société — Civilisation Anglophone</title>
<link rel="stylesheet" href="../../../../fonts/fonts.css">

<!-- ══════════════════════════════════════════════════════════════════════
     TEMPLATE UNIVERSEL DE COURS DE CIVILISATION — v1
     Pour créer un nouveau cours : dupliquer ce fichier, ne modifier QUE
     le bloc de données (id="donnees") tout en bas. Rien d'autre à toucher.
     ══════════════════════════════════════════════════════════════════════ -->

<style>
  /* ─── PALETTE DE BASE (identique au site) ─── */
  :root{
    --bg:#0d0d0f; --surface:#16161a; --surface2:#1e1e24; --border:#2a2a35;
    --text:#e8e6e0; --text-dim:#8a8880; --text-faint:#4a4845;
    --radius:14px;
  }
  /* ─── THÈMES PAR LANGUE — change data-theme sur <html> ─── */
  html[data-theme="anglais"] { --a1:#c8a96e; --a2:#7c9ec9; --a3:#9ecba0; --a4:#c97c9e; --hero:#16233d; }
  html[data-theme="anglais2"] { --a1:#c9633f; --a2:#5b8f6f; --a3:#6c8fc7; --a4:#a06bb0; --hero:#16241b; }
  html[data-theme="espagnol"]{ --a1:#e0a93e; --a2:#c8553d; --a3:#7fae7a; --a4:#b06fa8; --hero:#3a1a18; }
  html[data-theme="allemand"]{ --a1:#d8b44a; --a2:#8fa4bd; --a3:#84b58e; --a4:#c06060; --hero:#241f1a; }
  html[data-theme="italien"] { --a1:#d5a94e; --a2:#6fae8f; --a3:#a8c07a; --a4:#c4695e; --hero:#152a24; }
  html[data-theme="chinois"] { --a1:#d9a441; --a2:#c05a4a; --a3:#83a98f; --a4:#a97fb0; --hero:#2c1618; }
  html[data-theme="americain"] { --a1:#5c86c4; --a2:#c05f57; --a3:#c2a35e; --a4:#8c86c9; --hero:#111c33; }
  html[data-theme="americain2"]{ --a1:#4f9d8d; --a2:#c4794a; --a3:#a8bd6a; --a4:#b0709c; --hero:#11282b; }

  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;overflow-x:hidden}

  /* ─── FOND ─── */
  .bg-orb{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;opacity:.08;z-index:0}
  .orb1{width:700px;height:700px;background:var(--a1);top:-300px;right:-250px}
  .orb2{width:600px;height:600px;background:var(--a2);bottom:-250px;left:-250px}

  /* ─── BARRE DE PROGRESSION ─── */
  #progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:200;
    background:linear-gradient(90deg,var(--a1),var(--a2),var(--a4));transition:width .1s linear}

  /* ─── NAV ─── */
  nav{display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding:16px 40px;border-bottom:1px solid var(--border);
    background:rgba(13,13,15,.9);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100}
  .nav-logo{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;color:var(--a1);cursor:pointer}
  .breadcrumb{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--text-dim);flex-wrap:wrap}
  .breadcrumb span{cursor:pointer;transition:color .2s}
  .breadcrumb span:hover{color:var(--a1)}
  .breadcrumb .sep{color:var(--text-faint);cursor:default}
  .breadcrumb .current{color:var(--text);cursor:default}
  .nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .ap-lang-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    color:rgba(255,255,255,.6);font-family:'DM Mono',monospace;font-size:10px;font-weight:700;
    letter-spacing:.12em;padding:5px 14px;border-radius:4px;cursor:pointer;transition:all .2s;text-transform:uppercase}
  .ap-lang-btn.active{background:var(--a1);border-color:var(--a1);color:#12100c}
  .ap-lang-btn:hover:not(.active){background:rgba(255,255,255,.15);color:#fff}

  /* ─── HERO ─── */
  .hero{position:relative;z-index:1;padding:76px 40px 56px;text-align:center;overflow:hidden;
    background:linear-gradient(160deg,var(--hero),#0d0d0f 85%);border-bottom:1px solid var(--border)}
  .hero::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
    width:80px;height:2px;background:var(--a1)}
  .hero-flag{font-size:2.6rem;line-height:1;margin-bottom:18px;display:block}
  .hero-label{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.3em;
    text-transform:uppercase;color:var(--a1);margin-bottom:18px}
  .hero h1{font-family:'Playfair Display',serif;font-weight:900;line-height:1.05;
    font-size:clamp(2.4rem,6vw,4.6rem);max-width:900px;margin:0 auto 18px}
  .hero-sub{font-size:1rem;color:var(--text-dim);max-width:640px;margin:0 auto;line-height:1.6}

  /* ─── LAYOUT ─── */
  .layout{display:flex;gap:48px;max-width:1320px;margin:0 auto;padding:48px 40px 100px;position:relative;z-index:1}
  main{flex:1;min-width:0;max-width:840px}

  /* ─── COLONNE CHRONOLOGIE ─── */
  .rail{width:262px;flex-shrink:0;position:sticky;top:88px;align-self:flex-start;
    max-height:calc(100vh - 118px);overflow-y:auto;padding-right:8px}
  .rail-title{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;
    color:var(--a1);margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border)}
  .rail .tl{padding-left:20px;margin:0 0 0 4px}
  .rail .tl-item{padding-bottom:16px}
  .rail .tl-item::before{left:-26px;top:4px;width:7px;height:7px}
  .rail .tl-d{font-size:.66rem;letter-spacing:.08em}
  .rail .tl-c{font-size:.79rem;line-height:1.5}
  .rail::-webkit-scrollbar{width:3px}
  .rail::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .chrono-mobile{display:none}

  /* ─── BLOC GÉNÉRIQUE ─── */
  .bloc{margin-bottom:64px;scroll-margin-top:88px}
  .bloc-head{display:flex;align-items:baseline;gap:14px;margin-bottom:24px;
    padding-bottom:12px;border-bottom:1px solid var(--border)}
  .bloc-kicker{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--k,var(--a1))}
  .bloc-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--text)}

  /* ─── L'ESSENTIEL ─── */
  .essentiel{background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    border:1px solid var(--border);border-left:3px solid var(--a1);border-radius:var(--radius);
    padding:28px 30px;margin-bottom:36px}
  .essentiel-label{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--a1);margin-bottom:14px}
  .essentiel p{font-size:.98rem;line-height:1.75;color:var(--text);margin-bottom:0}
  .essentiel p strong{color:var(--a1);font-weight:500}

  /* ─── STATS ─── */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0}
  .stat{border-radius:10px;padding:18px 16px;text-align:center;border:1px solid rgba(255,255,255,.08);
    background:linear-gradient(135deg,color-mix(in srgb,var(--c,var(--a1)) 26%,#101014),
    color-mix(in srgb,var(--c,var(--a1)) 8%,#101014))}
  .stat-n{font-family:'DM Mono',monospace;font-size:1.5rem;font-weight:500;color:var(--text);display:block;line-height:1.1}
  .stat-d{font-size:.7rem;color:var(--text-dim);margin-top:7px;display:block;line-height:1.45}

  /* ─── PARTIES ─── */
  .partie{margin-bottom:78px;scroll-margin-top:88px}
  .partie-head{display:flex;align-items:center;gap:22px;margin-bottom:34px;
    padding-bottom:18px;border-bottom:2px solid var(--p)}
  .partie-num{font-family:'Playfair Display',serif;font-size:3.4rem;font-weight:900;
    color:var(--p);opacity:.35;line-height:.9;flex-shrink:0}
  .partie-title{font-family:'Playfair Display',serif;font-size:clamp(1.35rem,3vw,1.95rem);
    font-weight:700;line-height:1.2}
  .partie-kicker{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.24em;
    text-transform:uppercase;color:var(--p);margin-bottom:6px}

  .section{margin-bottom:44px;scroll-margin-top:88px}
  .section-title{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;
    color:var(--text);margin-bottom:18px;padding-left:16px;border-left:3px solid var(--p)}
  .section-num{color:var(--p);font-weight:900}

  /* ─── TEXTE ─── */
  .prose{font-size:.96rem;line-height:1.8;color:rgba(232,230,224,.78);margin-bottom:16px}
  .prose strong{color:var(--text);font-weight:500}
  .prose em{color:var(--p,var(--a1));font-style:normal;font-weight:500}
  .en{font-family:'DM Mono',monospace;font-size:.86em;color:var(--a2)}

  /* ─── LISTE ─── */
  .liste{list-style:none;margin:14px 0 20px}
  .liste li{font-size:.93rem;line-height:1.65;color:rgba(232,230,224,.75);
    padding:9px 0 9px 22px;position:relative;border-bottom:1px solid rgba(255,255,255,.05)}
  .liste li:last-child{border-bottom:none}
  .liste li::before{content:'';position:absolute;left:0;top:17px;width:6px;height:6px;
    border-radius:50%;background:var(--p,var(--a1))}
  .liste li strong{color:var(--text);font-weight:500}

  /* ─── FAITS CLÉS ─── */
  .faits{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;margin:20px 0}
  .fait{background:rgba(255,255,255,.03);border:1px solid var(--border);
    border-left:3px solid var(--p,var(--a1));border-radius:8px;padding:13px 15px}
  .fait-l{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--text-faint);
    text-transform:uppercase;letter-spacing:.14em;margin-bottom:5px}
  .fait-v{font-size:.86rem;font-weight:500;color:var(--text);line-height:1.4}

  /* ─── CITATION ─── */
  .citation{background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
    border:1px solid var(--border);border-left:3px solid var(--a1);border-radius:0 10px 10px 0;
    padding:20px 24px;margin:22px 0}
  .citation p{font-family:'Playfair Display',serif;font-style:italic;font-size:1.02rem;
    line-height:1.6;color:var(--text);margin-bottom:9px}
  .citation cite{font-family:'DM Mono',monospace;font-size:.66rem;letter-spacing:.08em;
    color:var(--a1);font-style:normal}

  /* ─── ENCADRÉ ─── */
  .encadre{display:flex;gap:15px;align-items:flex-start;border-radius:10px;padding:17px 20px;margin:20px 0;
    background:color-mix(in srgb,var(--c,var(--a2)) 7%,transparent);
    border:1px solid color-mix(in srgb,var(--c,var(--a2)) 26%,transparent)}
  .encadre-ic{font-size:1.5rem;flex-shrink:0;line-height:1.2}
  .encadre-t{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.2em;
    text-transform:uppercase;color:var(--c,var(--a2));margin-bottom:7px;font-weight:500}
  .encadre-c{font-size:.89rem;line-height:1.7;color:rgba(232,230,224,.75)}
  .encadre-c strong{color:var(--text);font-weight:500}

  /* ─── DÉFINITION ─── */
  .def{border:1px dashed var(--border);border-radius:10px;padding:15px 18px;margin:18px 0;
    background:rgba(255,255,255,.02)}
  .def-mot{font-family:'Playfair Display',serif;font-weight:700;font-size:1rem;color:var(--a3);margin-bottom:6px}
  .def-c{font-size:.88rem;line-height:1.7;color:rgba(232,230,224,.72)}

  /* ─── TABLEAU ─── */
  .tbl-wrap{overflow-x:auto;margin:20px 0;border:1px solid var(--border);border-radius:10px}
  table{width:100%;border-collapse:collapse;font-size:.83rem}
  thead{background:rgba(255,255,255,.04)}
  thead th{padding:11px 15px;text-align:left;font-family:'DM Mono',monospace;font-size:.6rem;
    letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap}
  tbody tr{border-top:1px solid var(--border)}
  tbody tr:nth-child(even){background:rgba(255,255,255,.015)}
  tbody td{padding:11px 15px;color:rgba(232,230,224,.75);line-height:1.5}
  tbody td:first-child{color:var(--text);font-weight:500}

  /* ─── CHRONOLOGIE ─── */
  .tl{border-left:2px solid var(--border);padding-left:26px;margin:8px 0 8px 6px}
  .tl-item{position:relative;padding-bottom:22px}
  .tl-item:last-child{padding-bottom:0}
  .tl-item::before{content:'';position:absolute;left:-33px;top:5px;width:9px;height:9px;border-radius:50%;
    background:var(--c,var(--a1));box-shadow:0 0 0 3px rgba(13,13,15,1),0 0 0 5px color-mix(in srgb,var(--c,var(--a1)) 35%,transparent)}
  .tl-d{font-family:'DM Mono',monospace;font-size:.72rem;font-weight:500;letter-spacing:.1em;
    color:var(--c,var(--a1));margin-bottom:4px}
  .tl-c{font-size:.9rem;line-height:1.6;color:rgba(232,230,224,.75)}
  .tl-c strong{color:var(--text);font-weight:500}

  /* ─── ACTEURS ─── */
  .acteurs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .acteur{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;
    transition:all .25s;position:relative;overflow:hidden}
  .acteur:hover{border-color:var(--c,var(--a1));transform:translateY(-3px);background:var(--surface2)}
  .acteur-nom{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;margin-bottom:3px}
  .acteur-role{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--c,var(--a1));margin-bottom:10px}
  .acteur-c{font-size:.82rem;line-height:1.6;color:var(--text-dim)}

  /* ─── DÉBAT ─── */
  .debat{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .debat-col{border:1px solid var(--border);border-radius:12px;padding:20px 22px;background:rgba(255,255,255,.02)}
  .debat-col.oui{border-top:3px solid var(--a3)}
  .debat-col.non{border-top:3px solid var(--a4)}
  .debat-t{font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}
  .debat-col.oui .debat-t{color:var(--a3)}
  .debat-col.non .debat-t{color:var(--a4)}
  .debat-col li{font-size:.87rem;line-height:1.6;color:rgba(232,230,224,.75);
    padding:9px 0 9px 18px;position:relative;list-style:none;border-bottom:1px solid rgba(255,255,255,.05)}
  .debat-col li:last-child{border-bottom:none}
  .debat-col li::before{content:'';position:absolute;left:0;top:16px;width:5px;height:5px;border-radius:50%}
  .debat-col.oui li::before{background:var(--a3)}
  .debat-col.non li::before{background:var(--a4)}
  .debat-col li strong{color:var(--text);font-weight:500}

  /* ─── LEXIQUE ─── */
  .lex-search{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-family:'DM Sans',sans-serif;font-size:.88rem;padding:11px 15px;margin-bottom:14px}
  .lex-search:focus{outline:none;border-color:var(--a1)}
  .lex-search::placeholder{color:var(--text-faint)}
  .lex td:first-child{font-family:'DM Mono',monospace;color:var(--a2);font-weight:500}

  /* ─── SUJETS ─── */
  .sujet{border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:10px;
    background:var(--surface);display:flex;gap:16px;align-items:flex-start;transition:all .2s}
  .sujet:hover{border-color:var(--a4);transform:translateX(4px)}
  .sujet-n{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:900;color:var(--text-faint);line-height:1;flex-shrink:0}
  .sujet-q{font-size:.94rem;line-height:1.6;color:var(--text);margin-bottom:5px;font-weight:400}
  .sujet-h{font-size:.79rem;color:var(--text-dim);line-height:1.55}

  /* ─── À RETENIR ─── */
  .retenir{background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 12%,transparent),rgba(255,255,255,.02));
    border:1px solid color-mix(in srgb,var(--a1) 30%,transparent);border-radius:var(--radius);padding:28px 30px}
  .retenir li{font-size:.93rem;line-height:1.65;color:rgba(232,230,224,.82);
    padding:10px 0 10px 26px;position:relative;list-style:none;border-bottom:1px solid rgba(255,255,255,.06)}
  .retenir li:last-child{border-bottom:none}
  .retenir li::before{content:'✓';position:absolute;left:0;top:9px;color:var(--a1);font-size:.85rem}
  .retenir li strong{color:var(--text);font-weight:500}

  /* ─── PIED DE PAGE ─── */
  footer{text-align:center;padding:36px 40px;border-top:1px solid var(--border);
    font-family:'DM Mono',monospace;font-size:.7rem;color:var(--text-dim);letter-spacing:.14em;
    text-transform:uppercase}

  /* ─── ANIMATION ─── */
  .rev{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
  .rev.vu{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){.rev{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
  :focus-visible{outline:2px solid var(--a1);outline-offset:3px}

  /* ─── RESPONSIVE ─── */
  @media(max-width:1080px){
    .rail{display:none}
    .layout{padding:32px 22px 70px}
    .chrono-mobile{display:block}
  }
  @media(max-width:680px){
    nav{padding:12px 18px;flex-wrap:wrap}
    .breadcrumb{font-size:.7rem;order:3;width:100%}
    .hero{padding:52px 20px 40px}
    .debat{grid-template-columns:1fr}
    .partie-head{gap:14px}
    .partie-num{font-size:2.4rem}
  }
  /* ─── IMPRESSION ─── */
  @media print{
    body{background:#fff;color:#111}
    nav,.rail,#progress,.bg-orb,.nav-right{display:none!important}
    .hero{background:none;border-bottom:2px solid #111;padding:0 0 22px}
    .hero h1,.prose,.liste li,.bloc-title{color:#111}
    .layout{display:block;padding:0}
    .partie,.bloc{break-inside:avoid;page-break-inside:avoid}
    .rev{opacity:1;transform:none}
    .chrono-mobile{display:block!important}
  }
</style>
</head>
<body>

<div id="progress"></div>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<nav>
  <div class="nav-logo" onclick="location.href='../../../../index.html'">ECG Prépa</div>
  <div class="breadcrumb">
    <span onclick="location.href='../../../../index.html'">Accueil</span>
    <span class="sep">/</span>
    <span onclick="location.href='../../../index.html'">2ème Année</span>
    <span class="sep">/</span>
    <span onclick="location.href='../../index.html'">Langues</span>
    <span class="sep">/</span>
    <span onclick="location.href='../index.html'">Civilisation</span>
    <span class="sep">/</span>
    <span class="current" id="bc-titre">—</span>
  </div>
  <div class="nav-right">
    <button id="ap-btn-fr" class="ap-lang-btn active" onclick="setLang('fr')">🇫🇷 FR</button>
    <button id="ap-btn-en" class="ap-lang-btn" onclick="setLang('en')">🇬🇧 EN</button>
  </div>
</nav>

<header class="hero" id="hero"></header>

<div class="layout">
  <aside class="rail" id="rail"></aside>
  <main id="cours"></main>
</div>

<footer id="ft"></footer>


<!-- ══════════════════════════════════════════════════════════════════
     ⬇⬇⬇  SEULE PARTIE À MODIFIER POUR UN NOUVEAU COURS  ⬇⬇⬇
     ══════════════════════════════════════════════════════════════════ -->
<script id="donnees">
const COURS = {

  /* ─── 1. IDENTITÉ DU COURS ───────────────────────────────────────── */
  meta: {
    theme:     "americain2",                 // anglais | anglais2 | americain | americain2 | espagnol | allemand | italien | chinois
    drapeau:   "🇺🇸",
    chapitre:  "12",
    label:     { fr:"États-Unis · Chapitre 12", en:"United States · Chapter 12" },
    titre:     { fr:"Armes à feu & société", en:"Guns & society" },
    sousTitre: { fr:"Du silence constitutionnel à Heller et Bruen : comment un droit longtemps dormant est devenu le champ de bataille juridique le plus actif du pays.",
                 en:"From constitutional silence to Heller and Bruen: how a long-dormant right became the country's most active legal battleground." }
  },

  /* ─── 2. L'ESSENTIEL + CHIFFRES CLÉS ─────────────────────────────── */
  essentiel: {
    fr:"Le <strong>Second Amendement</strong> (1791) protège « le droit du peuple de détenir et de porter des armes », au nom d'une « milice bien organisée nécessaire à la sécurité d'un État libre ». Cette formule à double clause a nourri deux siècles de débat : droit <strong>individuel</strong> de tout citoyen, ou droit <strong>collectif</strong> lié au service dans une milice ? Pendant près de deux siècles, la Cour suprême n'a presque jamais tranché, laissant le Congrès réguler les armes via son pouvoir sur le commerce. Tout bascule en <strong>2008</strong> avec <em>District of Columbia v. Heller</em>, qui consacre un droit individuel à l'autodéfense au domicile, puis en <strong>2022</strong> avec <em>NYSRPA v. Bruen</em>, qui impose aux lois sur les armes de s'ancrer dans la « tradition historique » du pays plutôt que dans un simple test d'utilité publique. Depuis, chaque fusillade de masse, chaque loi d'État et chaque décision de la Cour suprême — <em>Rahimi</em> (2024), <em>VanDerStok</em> (2025), <em>Hemani</em> (2026) — redessine une frontière devenue mouvante entre liberté individuelle et sécurité collective.",
    en:"The <strong>Second Amendment</strong> (1791) protects “the right of the people to keep and bear arms,” in the name of “a well regulated militia, necessary to the security of a free state.” That two-clause formula has fuelled two centuries of debate: an <strong>individual</strong> right held by every citizen, or a <strong>collective</strong> right tied to militia service? For nearly two centuries the Supreme Court almost never settled the question, leaving Congress to regulate firearms through its power over commerce. Everything changed in <strong>2008</strong> with <em>District of Columbia v. Heller</em>, which recognised an individual right to self-defence at home, and again in <strong>2022</strong> with <em>NYSRPA v. Bruen</em>, which requires gun laws to be grounded in the nation's “historical tradition” rather than a simple public-interest test. Since then, every mass shooting, every state law and every Supreme Court ruling — <em>Rahimi</em> (2024), <em>VanDerStok</em> (2025), <em>Hemani</em> (2026) — has reshaped a boundary that has become genuinely unsettled between individual liberty and collective security."
  },

    sections:[
      {
        titre:{fr:"Milice ou droit individuel ? Une phrase à deux clauses",

        blocs:[
          { t:"p", c:{
            fr:"Le Second Amendement tient en une phrase inhabituellement construite : « Une milice bien organisée étant nécessaire à la sécurité d'un État libre, le droit du peuple de détenir et de porter des armes ne sera pas transgressé. » Cette rédaction en deux temps — une clause <strong>préambulaire</strong> sur la milice, une clause <strong>opérative</strong> sur le droit du peuple — a nourri deux lectures concurrentes pendant deux siècles. La lecture <strong>collective</strong> y voit un droit des États à maintenir des milices citoyennes face à une armée fédérale permanente, crainte typique de l'époque révolutionnaire. La lecture <strong>individuelle</strong> y voit un droit de chaque citoyen à détenir une arme, la référence à la milice n'étant qu'une justification parmi d'autres et non une condition d'exercice.",
            en:"The Second Amendment is an unusually constructed sentence: “A well regulated militia, being necessary to the security of a free state, the right of the people to keep and bear arms, shall not be infringed.” This two-part drafting — a <strong>prefatory clause</strong> on the militia, an <strong>operative clause</strong> on the people's right — fed two competing readings for two centuries. The <strong>collective</strong> reading sees a right of the states to maintain citizen militias against a standing federal army, a fear typical of the revolutionary era. The <strong>individual</strong> reading sees a right of every citizen to keep a weapon, with the militia reference being merely one justification among others rather than a condition of exercise."} },
          { t:"def", mot:{fr:"Milice bien organisée (well regulated militia)",en:"Well regulated militia"},
            c:{fr:"À la fin du XVIIIe siècle, la « milice » désigne l'ensemble des hommes valides d'une communauté, susceptibles d'être appelés à défendre leur État avec leurs propres armes — non un corps professionnel distinct du peuple. C'est cette identité entre « le peuple » et « la milice » que met en avant la lecture individuelle : armer le citoyen ordinaire, c'est armer la milice elle-même.",
               en:"In the late eighteenth century, the “militia” meant the able-bodied men of a community, liable to be called up to defend their state with their own weapons — not a professional body distinct from the people. It is this identity between “the people” and “the militia” that the individual-right reading emphasises: arming the ordinary citizen is arming the militia itself."} },
          { t:"encadre", icon:"📜", c:"var(--a1)",
            titre:{fr:"Notion clé — la peur des armées permanentes", en:"Key concept — fear of standing armies"},
            c2:{fr:"Les constituants sortent d'une guerre d'indépendance où les milices coloniales se sont opposées à l'armée régulière britannique. La méfiance envers une <strong>armée permanente</strong> contrôlée par un pouvoir central, jugée porte ouverte à la tyrannie, explique en partie l'insertion du Second Amendement dans le Bill of Rights : des citoyens armés forment un contrepoids possible à l'État lui-même — un argument encore invoqué aujourd'hui par les partisans d'une lecture large du droit individuel.",
                en:"The framers had just fought a war of independence in which colonial militias faced the regular British army. Distrust of a <strong>standing army</strong> controlled by a central power, seen as an open door to tyranny, partly explains the Second Amendment's place in the Bill of Rights: armed citizens form a possible counterweight to the state itself — an argument still invoked today by advocates of a broad individual-right reading."} }

      {
        titre:{fr:"Un long silence jurisprudentiel : réguler sans trancher (1791-2008)",
               en:"A long judicial silence: regulating without deciding (1791-2008)"},
        blocs:[
          { t:"p", c:{
            fr:"Pendant près de deux siècles, la Cour suprême évite de trancher clairement la nature du droit. <strong>Presser v. Illinois</strong> (1886) juge que le Second Amendement ne s'oppose alors qu'au Congrès fédéral, non aux États — la doctrine de l'incorporation n'existant pas encore en la matière. <strong>United States v. Miller</strong> (1939), seul grand arrêt du XXe siècle sur le sujet, valide l'interdiction fédérale des fusils à canon scié en jugeant qu'une arme n'est protégée que si elle a un lien raisonnable avec l'efficacité d'une milice organisée — sans dire si le droit lui-même est individuel ou collectif. Ce flou laisse le champ libre au Congrès : la régulation des armes se construit pendant tout le XXe siècle par la voie ordinaire de la loi fédérale, sans jamais buter sur un obstacle constitutionnel sérieux.",
            en:"For nearly two centuries the Supreme Court avoided clearly settling the right's nature. <strong>Presser v. Illinois</strong> (1886) held that the Second Amendment at that point restrained only the federal Congress, not the states — the incorporation doctrine not yet existing in this area. <strong>United States v. Miller</strong> (1939), the only major twentieth-century ruling on the subject, upheld the federal ban on sawed-off shotguns by reasoning that a weapon is protected only if it bears a reasonable relationship to the effectiveness of an organised militia — without saying whether the right itself was individual or collective. That ambiguity left Congress a free hand: gun regulation was built throughout the twentieth century through ordinary federal legislation, never running into a serious constitutional obstacle."} },

      {
        titre:{fr:"Heller (2008) et McDonald (2010) : la naissance d'un droit individuel opposable",
               en:"Heller (2008) and McDonald (2010): the birth of an enforceable individual right"},
        blocs:[
          { t:"p", c:{
            fr:"<strong>District of Columbia v. Heller</strong> (2008) rompt deux siècles d'ambiguïté. Par cinq voix contre quatre, la Cour, sous la plume du juge <strong>Antonin Scalia</strong>, juge que le Second Amendement protège un droit <strong>individuel</strong>, détaché de tout service dans une milice, à détenir une arme pour des usages traditionnellement licites, au premier rang desquels l'autodéfense au domicile. La loi de Washington D.C., qui interdisait quasiment toute arme de poing, est invalidée. Scalia précise toutefois que ce droit n'est <strong>pas absolu</strong> : il ne remet pas en cause, par exemple, l'interdiction de détention par les criminels ou malades mentaux, ni les restrictions dans les lieux « sensibles » (écoles, bâtiments publics).",
            en:"<strong>District of Columbia v. Heller</strong> (2008) broke two centuries of ambiguity. By five votes to four, the Court, in an opinion by Justice <strong>Antonin Scalia</strong>, held that the Second Amendment protects an <strong>individual</strong> right, detached from any militia service, to keep a weapon for traditionally lawful purposes, foremost among them self-defence at home. Washington D.C.'s near-total handgun ban was struck down. Scalia made clear, however, that the right is <strong>not absolute</strong>: it does not, for instance, disturb bans on possession by felons or the mentally ill, nor restrictions in “sensitive” places such as schools and government buildings."} },
          { t:"p", c:{
            fr:"<strong>McDonald v. City of Chicago</strong> (2010) complète l'édifice : par la doctrine de l'<strong>incorporation</strong> via le 14e amendement, le droit reconnu dans <em>Heller</em> s'impose désormais aux États et aux collectivités locales, et non plus seulement au gouvernement fédéral. Cette double décision transforme le Second Amendement, resté largement théorique pendant deux siècles, en un instrument de contrôle judiciaire actif de toute loi — fédérale, étatique ou locale — touchant à la détention d'armes.",
            en:"<strong>McDonald v. City of Chicago</strong> (2010) completed the structure: through the doctrine of <strong>incorporation</strong> via the Fourteenth Amendment, the right recognised in <em>Heller</em> now binds states and local governments, not merely the federal government. Together, the two rulings turned the Second Amendment, largely theoretical for two centuries, into an active instrument of judicial review over any law — federal, state or local — touching on gun possession."} },

  {

    titre:{fr:"Bruen et le tournant historique : un test qui bouleverse tout",

    sections:[
      {
        titre:{fr:"Bruen (2022) : le texte, l'histoire et la tradition remplacent l'utilité publique",
               en:"Bruen (2022): text, history and tradition replace public-interest balancing"},
        blocs:[
          { t:"p", c:{
            fr:"Après <em>Heller</em>, les cours d'appel avaient développé un test à deux étapes empruntant aux autres libertés constitutionnelles : vérifier d'abord si l'activité entre dans le champ du Second Amendement, puis appliquer un <strong>contrôle de proportionnalité</strong> comparant l'atteinte au droit et l'intérêt public poursuivi. <strong>New York State Rifle & Pistol Association v. Bruen</strong> (2022) rejette entièrement cette méthode. Sous la plume du juge <strong>Clarence Thomas</strong>, la Cour invalide la loi new-yorkaise exigeant une « juste cause » pour porter une arme dissimulée, et impose un test radicalement différent : une régulation moderne n'est constitutionnelle que si le gouvernement démontre qu'elle est <strong>« conforme à la tradition historique »</strong> de réglementation des armes aux États-Unis, en cherchant des équivalents ou des « analogues » dans les lois du XVIIIe et du XIXe siècle.",
            en:"After <em>Heller</em>, appeals courts had developed a two-step test borrowed from other constitutional freedoms: first check whether the conduct falls within the Second Amendment's scope, then apply a <strong>proportionality review</strong> weighing the burden on the right against the public interest served. <strong>New York State Rifle & Pistol Association v. Bruen</strong> (2022) rejected that method outright. Writing for the Court, Justice <strong>Clarence Thomas</strong> struck down New York's law requiring “proper cause” to carry a concealed weapon, and imposed a radically different test: a modern regulation is constitutional only if the government shows it is <strong>“consistent with the historical tradition”</strong> of firearms regulation in the United States, by finding equivalents or “analogues” in eighteenth- and nineteenth-century laws."} },
          { t:"def", mot:{fr:"Le test « texte, histoire et tradition »",en:"The “text, history, and tradition” test"},
            c:{fr:"Depuis <em>Bruen</em>, une loi sur les armes doit franchir deux étapes : (1) la conduite visée entre-t-elle dans le texte ordinaire du Second Amendement — « le peuple », « détenir », « porter », « armes » ? Si oui, elle est <strong>présumée protégée</strong>. (2) Le gouvernement doit alors prouver que sa régulation trouve un <strong>analogue historique</strong> suffisamment proche dans la tradition américaine de réglementation des armes, sans exiger un jumeau parfait (nuance apportée par <em>Rahimi</em> en 2024).",
               en:"Since <em>Bruen</em>, a gun law must clear two steps: (1) does the targeted conduct fall within the ordinary text of the Second Amendment — “the people,” “keep,” “bear,” “arms”? If so, it is <strong>presumptively protected</strong>. (2) The government must then show its regulation has a sufficiently close <strong>historical analogue</strong> in America's tradition of firearms regulation, without requiring an exact historical twin (a nuance added by <em>Rahimi</em> in 2024)."} },
          { t:"encadre", icon:"⚠️", c:"var(--a4)",
            titre:{fr:"Erreur fréquente en dissertation", en:"A common mistake in essays"},
            c2:{fr:"Ne pas présenter <em>Bruen</em> comme un simple durcissement de <em>Heller</em> : c'est un <strong>changement de méthode</strong>. L'ancien test permettait de peser l'intérêt de sécurité publique contre l'atteinte au droit ; le nouveau l'interdit explicitement — seule compte l'existence d'un précédent historique, ce qui défavorise structurellement les régulations portant sur des technologies ou des risques inconnus des fondateurs (armes semi-automatiques modernes, armes imprimées en 3D).",
                en:"Do not present <em>Bruen</em> as a simple tightening of <em>Heller</em>: it is a <strong>change of method</strong>. The old test allowed weighing public-safety interests against the burden on the right; the new one explicitly forbids that — only the existence of a historical precedent counts, which structurally disadvantages regulations addressing technologies or risks unknown to the founders (modern semi-automatic weapons, 3D-printed guns)."} }
        ]
      },
      {
        titre:{fr:"Rahimi et Hemani : la Cour ajuste (et divise) le test historique",
               en:"Rahimi and Hemani: the Court adjusts (and divides over) the historical test"},
        blocs:[
          { t:"p", c:{
            fr:"Le test de <em>Bruen</em> se révèle vite source de confusion dans les cours inférieures : jusqu'où pousser l'exigence d'un « analogue historique » ? <strong>United States v. Rahimi</strong> (2024) apporte une première clarification bienvenue. La loi fédérale interdisant la détention d'arme à toute personne visée par une ordonnance de protection pour violences conjugales est validée à <strong>huit voix contre une</strong>. Le juge en chef Roberts y assouplit sensiblement <em>Bruen</em> : point n'est besoin d'un « jumeau » historique identique, il suffit que la régulation moderne soit <strong>« conforme aux principes »</strong> qui sous-tendent la tradition américaine — ici, la possibilité ancienne de désarmer temporairement un individu représentant une menace concrète pour autrui.",
            en:"The <em>Bruen</em> test soon proved a source of confusion in lower courts: how far must the “historical analogue” requirement be pushed? <strong>United States v. Rahimi</strong> (2024) offered a welcome first clarification. The federal law barring firearm possession by anyone subject to a domestic-violence restraining order was upheld <strong>eight votes to one</strong>. Chief Justice Roberts noticeably softened <em>Bruen</em>: no identical historical “twin” is required, it suffices that the modern regulation is <strong>“consistent with the principles”</strong> underlying America's tradition — here, the longstanding possibility of temporarily disarming someone who poses a concrete threat to others."} },
          { t:"p", c:{

            en:"<strong>United States v. Hemani</strong> (18 June 2026) illustrates, conversely, the limits the Court intends to set on federal regulation: it held unconstitutional the federal ban on firearm possession by any <strong>habitual</strong> drug user, for lack of a sufficient historical analogue and of proof of individualised dangerousness comparable to that found in <em>Rahimi</em>. Between the two rulings a ridgeline emerges: the Court upholds <strong>individualised</strong> disarmament grounded in a concrete, demonstrated threat, but shows far more reluctance toward <strong>categorical</strong> bans targeting an entire class of people without individual review."} },

            en:"The rise of <strong>weapon parts kits</strong> that let a functional firearm be assembled in minutes, without a serial number or background check, led the federal <span class='en'>ATF</span> agency to revise its regulatory definition of “firearm” in 2022 to cover such kits and unfinished frames. Manufacturers challenged the extension as administrative overreach and won before the Fifth Circuit. On <strong>26 March 2025</strong>, the Supreme Court ruled the other way in <strong>Bondi v. VanDerStok</strong>: by seven votes to two, in an opinion by Justice Gorsuch, it held that the 1968 Gun Control Act, properly interpreted, does cover certain kits and frames “readily convertible” into functional firearms."} },

            fr:"Depuis <em>Bruen</em>, la question la plus explosive reste en suspens : les fusils semi-automatiques de type <strong>AR-15</strong>, parmi les plus vendus du pays, bénéficient-ils de la protection du Second Amendement ? Toutes les cours d'appel fédérales ayant tranché la question depuis 2022 ont validé les interdictions d'État, au nom soit de l'absence de protection constitutionnelle de ces armes, soit d'un analogue historique jugé suffisant. La Cour suprême a pourtant refusé à deux reprises d'examiner le fond — dont <em>Snope v. Brown</em> en juin 2025 — malgré les dissidences répétées des juges Thomas, Alito et Gorsuch, et une déclaration du juge Kavanaugh appelant la Cour à trancher « d'ici un an ou deux ».",
            en:"Since <em>Bruen</em>, the most explosive question has remained unresolved: do semi-automatic <strong>AR-15</strong>-style rifles, among the best-selling firearms in the country, enjoy Second Amendment protection? Every federal appeals court to rule on the question since 2022 has upheld state bans, citing either the absence of constitutional protection for such weapons or a sufficient historical analogue. Yet the Supreme Court twice declined to hear the merits — including <em>Snope v. Brown</em> in June 2025 — despite repeated dissents from Justices Thomas, Alito and Gorsuch, and a statement from Justice Kavanaugh urging the Court to decide “in the next Term or two”."} },
          { t:"p", c:{

            en:"On <strong>1 July 2026</strong>, the Court reversed course and agreed to hear together <strong>Viramontes v. Cook County</strong> (Illinois) and <strong>Grant v. Higgins</strong> (Connecticut, whose law dates to the Sandy Hook shooting). The question presented is direct: do the Second and Fourteenth Amendments guarantee a right to possess AR-15-style rifles and similar weapons? A ruling for the plaintiffs would instantly invalidate the laws of about a dozen states and the District of Columbia, following the logical extension of the “common use” doctrine set out in <em>Heller</em> — a weapon as widespread as the AR-15 being hard to call unusual. The ruling, expected at the end of the 2026-2027 term, will likely be the most consequential gun decision since <em>Bruen</em>."} },

    { q:{fr:"Comparer la régulation des armes à feu aux États-Unis et dans l'Union européenne : deux conceptions du droit et de la sécurité.",
         en:"Compare firearms regulation in the United States and the European Union: two conceptions of rights and safety."},
      h:{fr:"Mobiliser l'absence d'équivalent au Second Amendement en droit européen.",
         en:"Draw on the absence of any European equivalent to the Second Amendment."} },

         en:"Can mass shootings change American constitutional gun law?"},

  ],

  /* ─── 9. À RETENIR ───────────────────────────────────────────────── */
  retenir: {

      "<strong>Bruen</strong> (2022) impose un test fondé sur le <em>texte, l'histoire et la tradition</em>, écartant tout critère d'utilité publique.",
      "<strong>Rahimi</strong> (2024) valide le désarmement <em>individualisé</em> fondé sur une menace démontrée ; <strong>Hemani</strong> (2026) invalide une interdiction <em>catégorielle</em>.",
      "<strong>VanDerStok</strong> (2025) confirme que la régulation de la vente commerciale (armes fantômes) reste possible sans heurter le Second Amendement.",
      "Faute de consensus fédéral, les <strong>États</strong> définissent l'essentiel de la politique concrète des armes, créant une forte fragmentation territoriale.",
      "Le mandat <strong>2026-2027</strong> (Viramontes, Grant) pourrait trancher le sort des interdictions d'armes d'assaut dans une douzaine d'États."
    ],
    en:[
      "The Second Amendment (1791) is one ambiguous sentence: a “well regulated militia” and “the right of the people to keep and bear arms.”",
      "For nearly two centuries the Supreme Court almost never settled the right's nature, leaving Congress to regulate through ordinary law.",
      "<strong>Heller</strong> (2008) recognises an <em>individual</em> right; <strong>McDonald</strong> (2010) binds the states to it through incorporation.",
      "<strong>Bruen</strong> (2022) imposes a <em>text, history, and tradition</em> test, discarding any public-interest balancing.",
      "<strong>Rahimi</strong> (2024) upholds <em>individualised</em> disarmament grounded in a demonstrated threat; <strong>Hemani</strong> (2026) strikes down a <em>categorical</em> ban.",
      "<strong>VanDerStok</strong> (2025) confirms that regulating commercial sale (ghost guns) remains possible without violating the Second Amendment.",
      "Absent federal consensus, the <strong>states</strong> shape most concrete gun policy, producing sharp territorial fragmentation.",
      "The <strong>2026-2027</strong> term (Viramontes, Grant) could settle the fate of assault weapons bans in about a dozen states."
    ]
  }
};

<script>
/* ─── Utilitaires ─── */
const $ = (s,r=document)=>r.querySelector(s);
let LANG = 'fr';
/* T() : renvoie la version dans la langue courante, ou la valeur telle quelle */
const T = v => (v && typeof v==='object' && !Array.isArray(v) && ('fr' in v||'en' in v)) ? (v[LANG] ?? v.fr) : v;

/* ─── Libellés d'interface ─── */
const UI = {
  fr:{ chrono:"Chronologie",
       essentiel:"L'essentiel", reperes:"Repères", quiEstQui:"Qui est qui", acteurs:"Acteurs clés",
       controverse:"Controverse", vocab:"Vocabulaire", lexique:"Lexique bilingue",
       filtrer:"Filtrer le lexique…", terme:"Terme", trad:"Traduction / usage",
       entrainement:"Entraînement", sujets:"Sujets possibles", memoriser:"Mémoriser",
       retenir:"À retenir", synthese:"Synthèse", chapitre:"Chapitre" },
  en:{ chrono:"Timeline",
       essentiel:"In brief", reperes:"Key dates", quiEstQui:"Who's who", acteurs:"Key figures",
       controverse:"Debate", vocab:"Vocabulary", lexique:"Bilingual glossary",
       filtrer:"Filter the glossary…", terme:"Term", trad:"Translation / usage",
       entrainement:"Practice", sujets:"Essay questions", memoriser:"Revise",
       retenir:"Key takeaways", synthese:"Synthesis", chapitre:"Chapter" }
};
const t = k => UI[LANG][k];

/* ─── Rendu des blocs de contenu ─── */
function bloc(b){
  switch(b.t){
    case 'p':      return `<p class="prose">${T(b.c)}</p>`;
    case 'liste':  return `<ul class="liste">${T(b.items).map(i=>`<li>${i}</li>`).join('')}</ul>`;
    case 'faits':  return `<div class="faits">${T(b.items).map(i=>
                     `<div class="fait"><div class="fait-l">${T(i.l)}</div><div class="fait-v">${T(i.v)}</div></div>`).join('')}</div>`;
    case 'stats':  return `<div class="stats">${b.items.map(i=>
                     `<div class="stat" style="--c:${i.c||'var(--a1)'}"><span class="stat-n">${T(i.n)}</span><span class="stat-d">${T(i.d)}</span></div>`).join('')}</div>`;
    case 'citation':return `<blockquote class="citation"><p>« ${T(b.c)} »</p><cite>${T(b.src)}</cite></blockquote>`;
    case 'encadre':return `<div class="encadre" style="--c:${b.c||'var(--a2)'}"><div class="encadre-ic">${b.icon||'💡'}</div>
                     <div><div class="encadre-t">${T(b.titre)}</div><div class="encadre-c">${T(b.c2)}</div></div></div>`;
    case 'def':    return `<div class="def"><div class="def-mot">${T(b.mot)}</div><div class="def-c">${T(b.c)}</div></div>`;
    case 'tableau':return `<div class="tbl-wrap"><table><thead><tr>${T(b.head).map(h=>`<th>${h}</th>`).join('')}</tr></thead>
                     <tbody>${T(b.rows).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tl':     return `<div class="tl">${T(b.items).map(i=>
                     `<div class="tl-item"><div class="tl-d">${T(i.d)}</div><div class="tl-c">${T(i.c)}</div></div>`).join('')}</div>`;
    default:       return '';
  }
}

/* ─── En-tête ─── */
function rendreHero(){
  const m = COURS.meta;
  document.documentElement.dataset.theme = m.theme;
  document.documentElement.lang = LANG;
  document.title = T(m.titre) + ' — Civilisation';
  $('#bc-titre').textContent = m.titre.fr ?? m.titre;   // la nav reste en français
  $('#ft').textContent = `${t('chapitre')} ${m.chapitre}${LANG==='fr'?' : ':': '}${T(m.titre)}`;
  $('#hero').innerHTML = `
    <span class="hero-flag">${m.drapeau}</span>
    <div class="hero-label">${T(m.label)}</div>
    <h1>${T(m.titre)}</h1>
    <p class="hero-sub">${T(m.sousTitre)}</p>`;
}

/* ─── Corps du cours ─── */
function rendreCours(){
  const c = COURS, out = [];

  out.push(`<section class="bloc rev" id="s-essentiel">
    <div class="essentiel"><div class="essentiel-label">${t('essentiel')}</div><p>${T(c.essentiel)}</p></div>
    <div class="stats">${c.chiffres.map((x,i)=>
      `<div class="stat" style="--c:var(--a${(i%4)+1})"><span class="stat-n">${T(x.n)}</span><span class="stat-d">${T(x.d)}</span></div>`).join('')}</div>
  </section>`);

  if(c.chronologie?.length){
    out.push(`<section class="bloc rev chrono-mobile" id="s-chrono">
      <div class="bloc-head"><span class="bloc-kicker">${t('reperes')}</span><h2 class="bloc-title">${t('chrono')}</h2></div>
      ${bloc({t:'tl',items:c.chronologie})}</section>`);
  }

  c.parties.forEach((p,pi)=>{
    let html = `<section class="partie rev" id="p-${pi}" style="--p:${p.couleur}">
      <div class="partie-head"><div class="partie-num">${p.num}</div>
      <div><div class="partie-kicker">${T(p.kicker)}</div><h2 class="partie-title">${T(p.titre)}</h2></div></div>`;
    p.sections.forEach((s,si)=>{
      html += `<div class="section" id="p-${pi}-${si}"><h3 class="section-title"><span class="section-num">${si+1}.</span> ${T(s.titre)}</h3>
        ${s.blocs.map(bloc).join('')}</div>`;
    });
    out.push(html+`</section>`);
  });

  if(c.acteurs?.length){
    out.push(`<section class="bloc rev" id="s-acteurs">
      <div class="bloc-head"><span class="bloc-kicker">${t('quiEstQui')}</span><h2 class="bloc-title">${t('acteurs')}</h2></div>
      <div class="acteurs">${c.acteurs.map(a=>
        `<div class="acteur" style="--c:${a.c}"><div class="acteur-nom">${a.nom}</div>
         <div class="acteur-role">${T(a.role)}</div><div class="acteur-c">${T(a.d)}</div></div>`).join('')}</div></section>`);
  }

  if(c.debat){
    out.push(`<section class="bloc rev" id="s-debat">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a4)">${t('controverse')}</span>
      <h2 class="bloc-title">${T(c.debat.question)}</h2></div>
      <div class="debat">
        <div class="debat-col oui"><div class="debat-t">${T(c.debat.oui.titre)}</div>
          <ul>${T(c.debat.oui.items).map(i=>`<li>${i}</li>`).join('')}</ul></div>
        <div class="debat-col non"><div class="debat-t">${T(c.debat.non.titre)}</div>
          <ul>${T(c.debat.non.items).map(i=>`<li>${i}</li>`).join('')}</ul></div>
      </div>
      ${c.debat.synthese?`<div class="encadre" style="--c:var(--a1);margin-top:14px">
        <div class="encadre-ic">⚖️</div><div><div class="encadre-t">${t('synthese')}</div>
        <div class="encadre-c">${T(c.debat.synthese)}</div></div></div>`:''}
    </section>`);
  }

  if(c.lexique?.length){
    out.push(`<section class="bloc rev" id="s-lexique">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a2)">${t('vocab')}</span>
      <h2 class="bloc-title">${t('lexique')}</h2></div>
      <input class="lex-search" id="lex-search" placeholder="${t('filtrer')}" aria-label="${t('filtrer')}">
      <div class="tbl-wrap"><table class="lex"><thead><tr><th>${t('terme')}</th><th>${t('trad')}</th></tr></thead>
      <tbody id="lex-body">${c.lexique.map(l=>`<tr><td>${l.en}</td><td>${l.fr}</td></tr>`).join('')}</tbody></table></div>
    </section>`);
  }

  if(c.sujets?.length){
    out.push(`<section class="bloc rev" id="s-sujets">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a4)">${t('entrainement')}</span>
      <h2 class="bloc-title">${t('sujets')}</h2></div>
      ${c.sujets.map((s,i)=>`<div class="sujet"><div class="sujet-n">${String(i+1).padStart(2,'0')}</div>
        <div><div class="sujet-q">${T(s.q)}</div><div class="sujet-h">${T(s.h)}</div></div></div>`).join('')}</section>`);
  }

  if(c.retenir?.length){
    out.push(`<section class="bloc rev" id="s-retenir">
      <div class="bloc-head"><span class="bloc-kicker">${t('memoriser')}</span><h2 class="bloc-title">${t('retenir')}</h2></div>
      <div class="retenir"><ul>${T(c.retenir).map(r=>`<li>${r}</li>`).join('')}</ul></div></section>`);
  }

  $('#cours').innerHTML = out.join('');
}

/* ─── Colonne chronologie ─── */
function rendreRail(){
  if(!COURS.chronologie?.length){ $('#rail')?.remove(); return; }
  $('#rail').innerHTML = `<div class="rail-title">${t('chrono')}</div>${bloc({t:'tl',items:COURS.chronologie})}`;
}

/* ─── Recherche dans le lexique ─── */
function brancherLexique(){
  const ls = $('#lex-search'); if(!ls) return;
  ls.addEventListener('input', ()=>{
    const q = ls.value.toLowerCase().trim();
    $('#lex-body').querySelectorAll('tr').forEach(tr=>{
      tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
}

/* ─── Changement de langue ─── */
function setLang(lang){
  LANG = lang;
  $('#ap-btn-fr').classList.toggle('active', lang==='fr');
  $('#ap-btn-en').classList.toggle('active', lang==='en');
  rendreHero(); rendreCours(); rendreRail();
  document.querySelectorAll('.rev').forEach(el=>el.classList.add('vu'));
  brancherLexique();
}

/* ─── Démarrage ─── */
function demarrer(){
  rendreHero(); rendreCours(); rendreRail(); brancherLexique();

  const maj = ()=>{
    const h = document.body.scrollHeight - innerHeight;
    $('#progress').style.width = (h>0 ? (scrollY/h)*100 : 0) + '%';
  };
  addEventListener('scroll', maj, {passive:true}); maj();

  if(!('IntersectionObserver' in window)){
    document.querySelectorAll('.rev').forEach(el=>el.classList.add('vu'));
    return;
  }
  const io = new IntersectionObserver(es=>es.forEach(x=>{
    if(x.isIntersecting){ x.target.classList.add('vu'); io.unobserve(x.target); }
  }), {threshold:.06});
  document.querySelectorAll('.rev').forEach(el=>io.observe(el));
}

demarrer();
</script>
</body>
