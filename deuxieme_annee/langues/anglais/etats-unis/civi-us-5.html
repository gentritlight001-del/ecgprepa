<!DOCTYPE html>
<html lang="fr" data-theme="americain4">
<head>
<script src="../../../../auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le mouvement des droits civiques — Civilisation Anglophone</title>
<link rel="stylesheet" href="../../../../fonts/fonts.css">

<!-- ══════════════════════════════════════════════════════════════════════
     TEMPLATE UNIVERSEL DE COURS DE CIVILISATION — v1
     Pour créer un nouveau cours : dupliquer ce fichier, ne modifier QUE
     le bloc de données (id="donnees") tout en bas. Rien d'autre à toucher.
     ══════════════════════════════════════════════════════════════════════ -->

<style>
  /* ─── PALETTE DE BASE (identique au site) ─── */
  :root{
    --bg:#0d0d0f; --surface:#16161a; --surface2:#1e1e24; --border:#2a2a35;
    --text:#e8e6e0; --text-dim:#8a8880; --text-faint:#4a4845;
    --radius:14px;
  }
  /* ─── THÈMES PAR LANGUE — change data-theme sur <html> ─── */
  html[data-theme="anglais"] { --a1:#c8a96e; --a2:#7c9ec9; --a3:#9ecba0; --a4:#c97c9e; --hero:#16233d; }
  html[data-theme="anglais2"] { --a1:#c9633f; --a2:#5b8f6f; --a3:#6c8fc7; --a4:#a06bb0; --hero:#16241b; }
  html[data-theme="espagnol"]{ --a1:#e0a93e; --a2:#c8553d; --a3:#7fae7a; --a4:#b06fa8; --hero:#3a1a18; }
  html[data-theme="allemand"]{ --a1:#d8b44a; --a2:#8fa4bd; --a3:#84b58e; --a4:#c06060; --hero:#241f1a; }
  html[data-theme="italien"] { --a1:#d5a94e; --a2:#6fae8f; --a3:#a8c07a; --a4:#c4695e; --hero:#152a24; }
  html[data-theme="chinois"] { --a1:#d9a441; --a2:#c05a4a; --a3:#83a98f; --a4:#a97fb0; --hero:#2c1618; }
  html[data-theme="americain"] { --a1:#5c86c4; --a2:#c05f57; --a3:#c2a35e; --a4:#8c86c9; --hero:#111c33; }
  html[data-theme="americain2"]{ --a1:#4f9d8d; --a2:#c4794a; --a3:#a8bd6a; --a4:#b0709c; --hero:#11282b; }
  html[data-theme="americain4"]{ --a1:#c08a4e; --a2:#9a76b8; --a3:#6f9cb8; --a4:#c4685c; --hero:#2a1a20; }

  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;overflow-x:hidden}

  /* ─── FOND ─── */
  .bg-orb{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;opacity:.08;z-index:0}
  .orb1{width:700px;height:700px;background:var(--a1);top:-300px;right:-250px}
  .orb2{width:600px;height:600px;background:var(--a2);bottom:-250px;left:-250px}

  /* ─── BARRE DE PROGRESSION ─── */
  #progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:200;
    background:linear-gradient(90deg,var(--a1),var(--a2),var(--a4));transition:width .1s linear}

  /* ─── NAV ─── */
  nav{display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding:16px 40px;border-bottom:1px solid var(--border);
    background:rgba(13,13,15,.9);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100}
  .nav-logo{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;color:var(--a1);cursor:pointer}
  .breadcrumb{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--text-dim);flex-wrap:wrap}
  .breadcrumb span{cursor:pointer;transition:color .2s}
  .breadcrumb span:hover{color:var(--a1)}
  .breadcrumb .sep{color:var(--text-faint);cursor:default}
  .breadcrumb .current{color:var(--text);cursor:default}
  .nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .ap-lang-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    color:rgba(255,255,255,.6);font-family:'DM Mono',monospace;font-size:10px;font-weight:700;
    letter-spacing:.12em;padding:5px 14px;border-radius:4px;cursor:pointer;transition:all .2s;text-transform:uppercase}
  .ap-lang-btn.active{background:var(--a1);border-color:var(--a1);color:#12100c}
  .ap-lang-btn:hover:not(.active){background:rgba(255,255,255,.15);color:#fff}

  /* ─── HERO ─── */
  .hero{position:relative;z-index:1;padding:76px 40px 56px;text-align:center;overflow:hidden;
    background:linear-gradient(160deg,var(--hero),#0d0d0f 85%);border-bottom:1px solid var(--border)}
  .hero::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
    width:80px;height:2px;background:var(--a1)}
  .hero-flag{font-size:2.6rem;line-height:1;margin-bottom:18px;display:block}
  .hero-label{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.3em;
    text-transform:uppercase;color:var(--a1);margin-bottom:18px}
  .hero h1{font-family:'Playfair Display',serif;font-weight:900;line-height:1.05;
    font-size:clamp(2.4rem,6vw,4.6rem);max-width:900px;margin:0 auto 18px}
  .hero-sub{font-size:1rem;color:var(--text-dim);max-width:640px;margin:0 auto;line-height:1.6}

  /* ─── LAYOUT ─── */
  .layout{display:flex;gap:48px;max-width:1320px;margin:0 auto;padding:48px 40px 100px;position:relative;z-index:1}
  main{flex:1;min-width:0;max-width:840px}

  /* ─── COLONNE CHRONOLOGIE ─── */
  .rail{width:262px;flex-shrink:0;position:sticky;top:88px;align-self:flex-start;
    max-height:calc(100vh - 118px);overflow-y:auto;padding-right:8px}
  .rail-title{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;
    color:var(--a1);margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border)}
  .rail .tl{padding-left:20px;margin:0 0 0 4px}
  .rail .tl-item{padding-bottom:16px}
  .rail .tl-item::before{left:-26px;top:4px;width:7px;height:7px}
  .rail .tl-d{font-size:.66rem;letter-spacing:.08em}
  .rail .tl-c{font-size:.79rem;line-height:1.5}
  .rail::-webkit-scrollbar{width:3px}
  .rail::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .chrono-mobile{display:none}

  /* ─── BLOC GÉNÉRIQUE ─── */
  .bloc{margin-bottom:64px;scroll-margin-top:88px}
  .bloc-head{display:flex;align-items:baseline;gap:14px;margin-bottom:24px;
    padding-bottom:12px;border-bottom:1px solid var(--border)}
  .bloc-kicker{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--k,var(--a1))}
  .bloc-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--text)}

  /* ─── L'ESSENTIEL ─── */
  .essentiel{background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    border:1px solid var(--border);border-left:3px solid var(--a1);border-radius:var(--radius);
    padding:28px 30px;margin-bottom:36px}
  .essentiel-label{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--a1);margin-bottom:14px}
  .essentiel p{font-size:.98rem;line-height:1.75;color:var(--text);margin-bottom:0}
  .essentiel p strong{color:var(--a1);font-weight:500}

  /* ─── STATS ─── */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0}
  .stat{border-radius:10px;padding:18px 16px;text-align:center;border:1px solid rgba(255,255,255,.08);
    background:linear-gradient(135deg,color-mix(in srgb,var(--c,var(--a1)) 26%,#101014),
    color-mix(in srgb,var(--c,var(--a1)) 8%,#101014))}
  .stat-n{font-family:'DM Mono',monospace;font-size:1.5rem;font-weight:500;color:var(--text);display:block;line-height:1.1}
  .stat-d{font-size:.7rem;color:var(--text-dim);margin-top:7px;display:block;line-height:1.45}

  /* ─── PARTIES ─── */
  .partie{margin-bottom:78px;scroll-margin-top:88px}
  .partie-head{display:flex;align-items:center;gap:22px;margin-bottom:34px;
    padding-bottom:18px;border-bottom:2px solid var(--p)}
  .partie-num{font-family:'Playfair Display',serif;font-size:3.4rem;font-weight:900;
    color:var(--p);opacity:.35;line-height:.9;flex-shrink:0}
  .partie-title{font-family:'Playfair Display',serif;font-size:clamp(1.35rem,3vw,1.95rem);
    font-weight:700;line-height:1.2}
  .partie-kicker{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.24em;
    text-transform:uppercase;color:var(--p);margin-bottom:6px}

  .section{margin-bottom:44px;scroll-margin-top:88px}
  .section-title{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;
    color:var(--text);margin-bottom:18px;padding-left:16px;border-left:3px solid var(--p)}
  .section-num{color:var(--p);font-weight:900}

  /* ─── TEXTE ─── */
  .prose{font-size:.96rem;line-height:1.8;color:rgba(232,230,224,.78);margin-bottom:16px}
  .prose strong{color:var(--text);font-weight:500}
  .prose em{color:var(--p,var(--a1));font-style:normal;font-weight:500}
  .en{font-family:'DM Mono',monospace;font-size:.86em;color:var(--a2)}

  /* ─── LISTE ─── */
  .liste{list-style:none;margin:14px 0 20px}
  .liste li{font-size:.93rem;line-height:1.65;color:rgba(232,230,224,.75);
    padding:9px 0 9px 22px;position:relative;border-bottom:1px solid rgba(255,255,255,.05)}
  .liste li:last-child{border-bottom:none}
  .liste li::before{content:'';position:absolute;left:0;top:17px;width:6px;height:6px;
    border-radius:50%;background:var(--p,var(--a1))}
  .liste li strong{color:var(--text);font-weight:500}

  /* ─── FAITS CLÉS ─── */
  .faits{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;margin:20px 0}
  .fait{background:rgba(255,255,255,.03);border:1px solid var(--border);
    border-left:3px solid var(--p,var(--a1));border-radius:8px;padding:13px 15px}
  .fait-l{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--text-faint);
    text-transform:uppercase;letter-spacing:.14em;margin-bottom:5px}
  .fait-v{font-size:.86rem;font-weight:500;color:var(--text);line-height:1.4}

  /* ─── CITATION ─── */
  .citation{background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
    border:1px solid var(--border);border-left:3px solid var(--a1);border-radius:0 10px 10px 0;
    padding:20px 24px;margin:22px 0}
  .citation p{font-family:'Playfair Display',serif;font-style:italic;font-size:1.02rem;
    line-height:1.6;color:var(--text);margin-bottom:9px}
  .citation cite{font-family:'DM Mono',monospace;font-size:.66rem;letter-spacing:.08em;
    color:var(--a1);font-style:normal}

  /* ─── ENCADRÉ ─── */
  .encadre{display:flex;gap:15px;align-items:flex-start;border-radius:10px;padding:17px 20px;margin:20px 0;
    background:color-mix(in srgb,var(--c,var(--a2)) 7%,transparent);
    border:1px solid color-mix(in srgb,var(--c,var(--a2)) 26%,transparent)}
  .encadre-ic{font-size:1.5rem;flex-shrink:0;line-height:1.2}
  .encadre-t{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.2em;
    text-transform:uppercase;color:var(--c,var(--a2));margin-bottom:7px;font-weight:500}
  .encadre-c{font-size:.89rem;line-height:1.7;color:rgba(232,230,224,.75)}
  .encadre-c strong{color:var(--text);font-weight:500}

  /* ─── DÉFINITION ─── */
  .def{border:1px dashed var(--border);border-radius:10px;padding:15px 18px;margin:18px 0;
    background:rgba(255,255,255,.02)}
  .def-mot{font-family:'Playfair Display',serif;font-weight:700;font-size:1rem;color:var(--a3);margin-bottom:6px}
  .def-c{font-size:.88rem;line-height:1.7;color:rgba(232,230,224,.72)}

  /* ─── TABLEAU ─── */
  .tbl-wrap{overflow-x:auto;margin:20px 0;border:1px solid var(--border);border-radius:10px}
  table{width:100%;border-collapse:collapse;font-size:.83rem}
  thead{background:rgba(255,255,255,.04)}
  thead th{padding:11px 15px;text-align:left;font-family:'DM Mono',monospace;font-size:.6rem;
    letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap}
  tbody tr{border-top:1px solid var(--border)}
  tbody tr:nth-child(even){background:rgba(255,255,255,.015)}
  tbody td{padding:11px 15px;color:rgba(232,230,224,.75);line-height:1.5}
  tbody td:first-child{color:var(--text);font-weight:500}

  /* ─── CHRONOLOGIE ─── */
  .tl{border-left:2px solid var(--border);padding-left:26px;margin:8px 0 8px 6px}
  .tl-item{position:relative;padding-bottom:22px}
  .tl-item:last-child{padding-bottom:0}
  .tl-item::before{content:'';position:absolute;left:-33px;top:5px;width:9px;height:9px;border-radius:50%;
    background:var(--c,var(--a1));box-shadow:0 0 0 3px rgba(13,13,15,1),0 0 0 5px color-mix(in srgb,var(--c,var(--a1)) 35%,transparent)}
  .tl-d{font-family:'DM Mono',monospace;font-size:.72rem;font-weight:500;letter-spacing:.1em;
    color:var(--c,var(--a1));margin-bottom:4px}
  .tl-c{font-size:.9rem;line-height:1.6;color:rgba(232,230,224,.75)}
  .tl-c strong{color:var(--text);font-weight:500}

  /* ─── ACTEURS ─── */
  .acteurs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .acteur{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;
    transition:all .25s;position:relative;overflow:hidden}
  .acteur:hover{border-color:var(--c,var(--a1));transform:translateY(-3px);background:var(--surface2)}
  .acteur-nom{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;margin-bottom:3px}
  .acteur-role{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--c,var(--a1));margin-bottom:10px}
  .acteur-c{font-size:.82rem;line-height:1.6;color:var(--text-dim)}

  /* ─── DÉBAT ─── */
  .debat{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .debat-col{border:1px solid var(--border);border-radius:12px;padding:20px 22px;background:rgba(255,255,255,.02)}
  .debat-col.oui{border-top:3px solid var(--a3)}
  .debat-col.non{border-top:3px solid var(--a4)}
  .debat-t{font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}
  .debat-col.oui .debat-t{color:var(--a3)}
  .debat-col.non .debat-t{color:var(--a4)}
  .debat-col li{font-size:.87rem;line-height:1.6;color:rgba(232,230,224,.75);
    padding:9px 0 9px 18px;position:relative;list-style:none;border-bottom:1px solid rgba(255,255,255,.05)}
  .debat-col li:last-child{border-bottom:none}
  .debat-col li::before{content:'';position:absolute;left:0;top:16px;width:5px;height:5px;border-radius:50%}
  .debat-col.oui li::before{background:var(--a3)}
  .debat-col.non li::before{background:var(--a4)}
  .debat-col li strong{color:var(--text);font-weight:500}

  /* ─── LEXIQUE ─── */
  .lex-search{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-family:'DM Sans',sans-serif;font-size:.88rem;padding:11px 15px;margin-bottom:14px}
  .lex-search:focus{outline:none;border-color:var(--a1)}
  .lex-search::placeholder{color:var(--text-faint)}
  .lex td:first-child{font-family:'DM Mono',monospace;color:var(--a2);font-weight:500}

  /* ─── SUJETS ─── */
  .sujet{border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:10px;
    background:var(--surface);display:flex;gap:16px;align-items:flex-start;transition:all .2s}
  .sujet:hover{border-color:var(--a4);transform:translateX(4px)}
  .sujet-n{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:900;color:var(--text-faint);line-height:1;flex-shrink:0}
  .sujet-q{font-size:.94rem;line-height:1.6;color:var(--text);margin-bottom:5px;font-weight:400}
  .sujet-h{font-size:.79rem;color:var(--text-dim);line-height:1.55}

  /* ─── À RETENIR ─── */
  .retenir{background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 12%,transparent),rgba(255,255,255,.02));
    border:1px solid color-mix(in srgb,var(--a1) 30%,transparent);border-radius:var(--radius);padding:28px 30px}
  .retenir li{font-size:.93rem;line-height:1.65;color:rgba(232,230,224,.82);
    padding:10px 0 10px 26px;position:relative;list-style:none;border-bottom:1px solid rgba(255,255,255,.06)}
  .retenir li:last-child{border-bottom:none}
  .retenir li::before{content:'✓';position:absolute;left:0;top:9px;color:var(--a1);font-size:.85rem}
  .retenir li strong{color:var(--text);font-weight:500}

  /* ─── PIED DE PAGE ─── */
  footer{text-align:center;padding:36px 40px;border-top:1px solid var(--border);
    font-family:'DM Mono',monospace;font-size:.7rem;color:var(--text-dim);letter-spacing:.14em;
    text-transform:uppercase}

  /* ─── ANIMATION ─── */
  .rev{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
  .rev.vu{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){.rev{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
  :focus-visible{outline:2px solid var(--a1);outline-offset:3px}

  /* ─── RESPONSIVE ─── */
  @media(max-width:1080px){
    .rail{display:none}
    .layout{padding:32px 22px 70px}
    .chrono-mobile{display:block}
  }
  @media(max-width:680px){
    nav{padding:12px 18px;flex-wrap:wrap}
    .breadcrumb{font-size:.7rem;order:3;width:100%}
    .hero{padding:52px 20px 40px}
    .debat{grid-template-columns:1fr}
    .partie-head{gap:14px}
    .partie-num{font-size:2.4rem}
  }
  /* ─── IMPRESSION ─── */
  @media print{
    body{background:#fff;color:#111}
    nav,.rail,#progress,.bg-orb,.nav-right{display:none!important}
    .hero{background:none;border-bottom:2px solid #111;padding:0 0 22px}
    .hero h1,.prose,.liste li,.bloc-title{color:#111}
    .layout{display:block;padding:0}
    .partie,.bloc{break-inside:avoid;page-break-inside:avoid}
    .rev{opacity:1;transform:none}
    .chrono-mobile{display:block!important}
  }
</style>
</head>
<body>

<div id="progress"></div>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<nav>
  <div class="nav-logo" onclick="location.href='../../../../index.html'">ECG Prépa</div>
  <div class="breadcrumb">
    <span onclick="location.href='../../../../index.html'">Accueil</span>
    <span class="sep">/</span>
    <span onclick="location.href='../../../index.html'">2ème Année</span>
    <span class="sep">/</span>
    <span onclick="location.href='../../index.html'">Langues</span>
    <span class="sep">/</span>
    <span onclick="location.href='../index.html'">Civilisation</span>
    <span class="sep">/</span>
    <span class="current" id="bc-titre">—</span>
  </div>
  <div class="nav-right">
    <button id="ap-btn-fr" class="ap-lang-btn active" onclick="setLang('fr')">🇫🇷 FR</button>
    <button id="ap-btn-en" class="ap-lang-btn" onclick="setLang('en')">🇬🇧 EN</button>
  </div>
</nav>

<header class="hero" id="hero"></header>

<div class="layout">
  <aside class="rail" id="rail"></aside>
  <main id="cours"></main>
</div>

<footer id="ft"></footer>


<!-- ══════════════════════════════════════════════════════════════════
     ⬇⬇⬇  SEULE PARTIE À MODIFIER POUR UN NOUVEAU COURS  ⬇⬇⬇
     ══════════════════════════════════════════════════════════════════ -->
<script id="donnees">
const COURS = {

  /* ─── 1. IDENTITÉ DU COURS ───────────────────────────────────────── */
  meta: {
    theme:     "americain4",                 // anglais | anglais2 | americain | americain2 | americain3 | americain4 | espagnol | allemand | italien | chinois
    drapeau:   "🇺🇸",
    chapitre:  "5",
    label:     { fr:"États-Unis · Chapitre 05", en:"United States · Chapter 05" },
    titre:     { fr:"Le mouvement des droits civiques", en:"The Civil Rights Movement" },
    sousTitre: { fr:"Un siècle après l'abolition, la longue conquête de l'égalité réelle : tribunaux, boycotts, marches — et un héritage aujourd'hui contesté.",
                 en:"A century after abolition, the long struggle for real equality: courtrooms, boycotts, marches — and a legacy now under challenge." }
  },

  /* ─── 2. L'ESSENTIEL + CHIFFRES CLÉS ─────────────────────────────── */
  essentiel: {
    fr:"L'esclavage est aboli en 1865, mais l'égalité ne l'accompagne pas. Après l'échec de la <strong>Reconstruction</strong>, le Sud reconstruit une domination raciale légale — les lois <em>Jim Crow</em> — validée par la Cour suprême dans <strong>Plessy v. Ferguson</strong> (1896) sous la formule « séparés mais égaux », et adossée à la privation méthodique du droit de vote et à la violence. Le mouvement des droits civiques est la mobilisation qui démantèle cet édifice entre 1954 et 1968, par une combinaison rare : une <strong>stratégie judiciaire</strong> patiemment construite par la NAACP, qui aboutit à <em>Brown</em> (1954) ; une <strong>action directe non violente</strong> — boycotts, sit-ins, marches — conçue pour rendre la violence ségrégationniste visible à la télévision ; et une pression politique qui arrache au Congrès le <strong>Civil Rights Act</strong> de 1964 et le <strong>Voting Rights Act</strong> de 1965. La victoire est juridique et incontestable, mais elle laisse intactes les inégalités économiques et la ségrégation de fait du Nord, d'où la radicalisation du <em>Black Power</em> après 1965. Depuis 2013, et plus vivement depuis 2025, c'est l'appareil de protection issu de ces années qui est démonté pièce par pièce.",
    en:"Slavery was abolished in 1865, but equality did not follow. After the failure of <strong>Reconstruction</strong>, the South rebuilt a legal racial order — the <em>Jim Crow</em> laws — upheld by the Supreme Court in <strong>Plessy v. Ferguson</strong> (1896) under the formula “separate but equal”, and backed by the methodical denial of the vote and by violence. The Civil Rights Movement is the mobilisation that dismantled that structure between 1954 and 1968, through a rare combination: a <strong>legal strategy</strong> patiently built by the NAACP, culminating in <em>Brown</em> (1954); <strong>nonviolent direct action</strong> — boycotts, sit-ins, marches — designed to make segregationist violence visible on television; and political pressure that wrung from Congress the <strong>Civil Rights Act</strong> of 1964 and the <strong>Voting Rights Act</strong> of 1965. The victory was legal and beyond dispute, but it left economic inequality and the North's de facto segregation untouched, hence the radicalisation of <em>Black Power</em> after 1965. Since 2013, and far more sharply since 2025, the protective machinery built in those years has been dismantled piece by piece."
  },

        blocs:[
          { t:"p", c:{
            fr:"Entre 1865 et 1877, le Sud vaincu est réorganisé sous contrôle fédéral : trois amendements abolissent l'esclavage, garantissent l'<strong>égale protection des lois</strong> et interdisent de refuser le vote pour motif racial. Des centaines d'élus noirs siègent dans les législatures d'État, seize au Congrès. Mais l'expérience est brève : le compromis de <strong>1877</strong>, qui règle une élection présidentielle contestée, entraîne le retrait des troupes fédérales. Privés de protection, les affranchis basculent dans un système de <strong>métayage</strong> qui reconstitue une dépendance économique, tandis que la terreur paramilitaire élimine les élus noirs.",
            en:"Between 1865 and 1877 the defeated South was reorganised under federal control: three amendments abolished slavery, guaranteed <strong>equal protection of the laws</strong> and barred the denial of the vote on racial grounds. Hundreds of Black officials sat in state legislatures, sixteen in Congress. But the experiment was brief: the compromise of <strong>1877</strong>, settling a disputed presidential election, brought the withdrawal of federal troops. Left unprotected, the freedmen fell into a system of <strong>sharecropping</strong> that rebuilt economic dependence, while paramilitary terror drove Black officials out."} },
          { t:"p", c:{
            fr:"La Cour suprême accompagne ce reflux. Dès 1883, elle juge que le 14e amendement n'interdit que les discriminations imposées par les <strong>États</strong>, non par les particuliers : hôtels, trains et théâtres peuvent donc exclure librement. En <strong>1896</strong>, <em>Plessy v. Ferguson</em> parachève l'édifice en admettant des équipements « séparés mais égaux ». Le mot <em>égaux</em> restera lettre morte : dans les années 1930, plusieurs États du Sud dépensent trois à cinq fois plus par élève blanc que par élève noir. La ségrégation n'est donc pas une survivance de l'esclavage : c'est une <strong>construction juridique postérieure</strong>, contemporaine de la modernité industrielle.",
            en:"The Supreme Court accompanied this retreat. As early as 1883 it held that the Fourteenth Amendment forbade only discrimination imposed by <strong>states</strong>, not by private parties: hotels, trains and theatres could therefore exclude at will. In <strong>1896</strong>, <em>Plessy v. Ferguson</em> completed the structure by allowing “separate but equal” facilities. The word <em>equal</em> remained a dead letter: in the 1930s several Southern states spent three to five times more per white pupil than per Black pupil. Segregation was thus not a survival of slavery but a <strong>later legal construction</strong>, contemporary with industrial modernity."} },
          { t:"citation",

          { t:"encadre", icon:"📌", c:"var(--a1)",
            titre:{fr:"Attention — une phrase à manier avec précaution", en:"Careful — a phrase to handle with caution"},
            c2:{fr:"Cette dissidence solitaire de 1896 est devenue l'un des textes les plus cités du droit américain — mais par les deux camps. Les militants des droits civiques l'ont invoquée pour abattre la ségrégation ; depuis les années 1990, les adversaires de la discrimination positive s'en servent pour combattre <em>toute</em> prise en compte de la race, y compris correctrice. C'est l'ambiguïté centrale du <strong>colorblindness</strong> : neutralité raciale comme <em>objectif</em> ou comme <em>méthode</em> ? La réponse à cette question sépare aujourd'hui encore les deux lectures de l'héritage de 1964.",
                en:"This lone 1896 dissent has become one of the most cited texts in American law — but by both camps. Civil rights campaigners invoked it to bring down segregation; since the 1990s, opponents of affirmative action have used it to fight <em>any</em> consideration of race, including remedial. That is the central ambiguity of <strong>colorblindness</strong>: racial neutrality as a <em>goal</em> or as a <em>method</em>? The answer still separates the two readings of the legacy of 1964."} }

        blocs:[
          { t:"p", c:{
            fr:"Le système repose sur trois piliers complémentaires. Des <strong>lois de séparation</strong> d'abord, qui régissent écoles, transports, hôpitaux, cimetières, jusqu'aux fontaines et aux bibles des tribunaux. Une <strong>privation du droit de vote</strong> ensuite, obtenue par des dispositifs formellement neutres — taxe électorale, test de lecture arbitrairement noté, clause du grand-père — qui font tomber l'inscription des électeurs noirs à moins de 5 % dans plusieurs États. Une <strong>violence extra-légale</strong> enfin, du lynchage à l'intimidation économique, qui garantit l'obéissance sans laisser de trace juridique.",
            en:"The system rested on three complementary pillars. First, <strong>separation laws</strong> governing schools, transport, hospitals, cemeteries, down to drinking fountains and courtroom bibles. Second, <strong>disenfranchisement</strong>, achieved through formally neutral devices — the poll tax, arbitrarily graded literacy tests, the grandfather clause — that pushed Black registration below 5% in several states. Third, <strong>extra-legal violence</strong>, from lynching to economic intimidation, securing obedience while leaving no legal trace."} },

          { t:"def", mot:{fr:"Ségrégation de jure et de facto",en:"De jure and de facto segregation"},
            c:{fr:"La ségrégation <strong>de jure</strong> est imposée par la loi : c'est le Sud de Jim Crow, et c'est elle que le mouvement abat entre 1954 et 1965. La ségrégation <strong>de facto</strong> résulte de pratiques privées et de politiques publiques indirectes — <em>redlining</em> bancaire, zonage, financement des écoles par l'impôt foncier local : c'est celle du Nord, et elle survit intacte aux lois de 1964-1965. Comprendre cette distinction est indispensable, car elle explique à la fois le succès du mouvement dans le Sud et son échec relatif à Chicago ou Detroit.",
               en:"<strong>De jure</strong> segregation is imposed by law: this is the Jim Crow South, and it is what the movement brought down between 1954 and 1965. <strong>De facto</strong> segregation results from private practices and indirect public policy — bank <em>redlining</em>, zoning, school funding from local property taxes: this is the North's, and it survived the laws of 1964-1965 intact. Grasping this distinction is essential, since it explains both the movement's success in the South and its relative failure in Chicago or Detroit."} }

            en:"Three developments made the movement possible. The <strong>Great Migration</strong> carried six million Black Southerners to Chicago, Detroit and New York, where they voted, organised, funded newspapers and became an electorate northern Democrats could no longer ignore. The <strong>Second World War</strong> created an untenable contradiction — fighting Nazi racism with a segregated army — which the <em>Double V</em> campaign highlighted. Finally, the <strong>Cold War</strong> turned every image of racist violence into a Soviet argument: the State Department itself argued in <em>Brown</em> that segregation damaged America's international standing."} },

        blocs:[
          { t:"p", c:{
            fr:"L'attaque frontale contre <em>Plessy</em> aurait été perdue d'avance. Le juriste <strong>Charles Hamilton Houston</strong>, puis son élève <strong>Thurgood Marshall</strong>, conçoivent donc une stratégie incrémentale : attaquer d'abord l'<em>inégalité</em> des équipements séparés, dans l'enseignement supérieur où l'absence de faculté de droit noire est indéfendable. Chaque victoire prépare la suivante. En 1954, la NAACP peut enfin porter la question de front, en s'appuyant sur des travaux de psychologie sociale montrant les effets de la séparation sur les enfants. <strong>Brown v. Board of Education</strong> est rendu à l'unanimité : dans l'éducation publique, séparé signifie par nature inégal.",
            en:"A frontal attack on <em>Plessy</em> would have been lost in advance. The lawyer <strong>Charles Hamilton Houston</strong>, and then his student <strong>Thurgood Marshall</strong>, therefore devised an incremental strategy: attack first the <em>inequality</em> of separate facilities, in higher education where the absence of a Black law school was indefensible. Each victory prepared the next. By 1954 the NAACP could take the question head on, drawing on social-psychology research on the effects of separation on children. <strong>Brown v. Board of Education</strong> was decided unanimously: in public education, separate is inherently unequal."} },
          { t:"p", c:{
            fr:"La décision est un séisme juridique, mais son exécution est confiée l'année suivante aux juges locaux, avec une formule d'une prudence fatale : « avec toute la lenteur délibérée requise ». Le Sud organise la <strong>résistance massive</strong> : cent une signatures d'élus du Congrès en 1956 dénonçant l'arrêt, fermeture d'écoles publiques, subventions à des écoles privées blanches. Dix ans après <em>Brown</em>, moins de 2 % des élèves noirs du Sud profond fréquentent une école mixte. La leçon est décisive pour le mouvement : <strong>une victoire en droit ne vaut rien sans rapport de force politique</strong>.",
            en:"The decision was a legal earthquake, but its enforcement was handed the following year to local judges, with a fatally cautious formula: “with all deliberate speed”. The South organised <strong>massive resistance</strong>: 101 signatures from members of Congress in 1956 denouncing the ruling, closures of public schools, subsidies to white private schools. Ten years after <em>Brown</em>, fewer than 2% of Black pupils in the Deep South attended a mixed school. The lesson was decisive for the movement: <strong>a legal victory is worthless without political leverage</strong>."} },
          { t:"encadre", icon:"🏫", c:"var(--a3)",
            titre:{fr:"Cas d'école — Little Rock, 1957", en:"Case study — Little Rock, 1957"},
            c2:{fr:"Lorsque neuf lycéens noirs doivent entrer au lycée central de Little Rock, le gouverneur de l'Arkansas mobilise la Garde nationale de l'État pour les en empêcher. Eisenhower, pourtant réticent, place cette garde sous <strong>autorité fédérale</strong> et envoie des parachutistes escorter les élèves. L'épisode est le premier recours à la force fédérale contre un État sur la question raciale depuis la Reconstruction : il montre que la <strong>suprématie du droit fédéral</strong> n'est effective que si le président accepte d'en assumer le coût politique. C'est aussi un point de jonction parfait avec le chapitre sur le fédéralisme.",
                en:"When nine Black students were due to enter Little Rock Central High School, the governor of Arkansas mobilised the state National Guard to keep them out. Eisenhower, though reluctant, placed that Guard under <strong>federal authority</strong> and sent paratroopers to escort the students. The episode was the first use of federal force against a state on race since Reconstruction: it showed that the <strong>supremacy of federal law</strong> is effective only if a president accepts its political cost. It is also a perfect link to the chapter on federalism."} }
        ]

      {
        titre:{fr:"L'action directe : rendre la violence visible",

        blocs:[
          { t:"p", c:{
            fr:"À partir de 1955, le centre de gravité se déplace des prétoires vers la rue. Le <strong>boycott des bus de Montgomery</strong>, déclenché par l'arrestation de Rosa Parks — militante formée de la NAACP, et non passante fatiguée —, dure 381 jours et démontre trois choses : la capacité d'organisation autonome des Églises noires, l'efficacité du levier économique, et l'utilité d'un porte-parole jeune et éloquent, Martin Luther King. Suivent les <strong>sit-ins</strong> de 1960, lancés par quatre étudiants de Greensboro, puis les <strong>Freedom Rides</strong> de 1961, qui forcent l'administration Kennedy à faire appliquer une déségrégation déjà décidée en droit.",
            en:"From 1955 the centre of gravity shifted from courtrooms to the streets. The <strong>Montgomery bus boycott</strong>, triggered by the arrest of Rosa Parks — a trained NAACP activist, not a tired passer-by — lasted 381 days and demonstrated three things: the autonomous organising capacity of Black churches, the effectiveness of economic leverage, and the value of a young, eloquent spokesman, Martin Luther King. Then came the <strong>sit-ins</strong> of 1960, launched by four students in Greensboro, and the <strong>Freedom Rides</strong> of 1961, which forced the Kennedy administration to enforce a desegregation already decided in law."} },
          { t:"p", c:{

            en:"<strong>Nonviolence</strong> was not merely an ethic inherited from Gandhi and Black Christianity: it was a media strategy. After the failure at Albany in 1962, where a shrewd sheriff made arrests without brutality and denied the movement images, King deliberately chose <strong>Birmingham</strong> in 1963 for its police chief's violent reputation. The calculation worked: photographs of police dogs and fire hoses turned on teenagers travelled the world within hours and made federal inaction untenable."} },

            c2:{fr:"Réduire les droits civiques à Martin Luther King est l'erreur la plus répandue. Le mouvement est une <strong>coalition d'organisations rivales</strong> aux méthodes distinctes : la NAACP et son contentieux, la SCLC et ses campagnes médiatiques, le SNCC et son travail de terrain, le CORE et ses actions directes. Des organisatrices comme <strong>Ella Baker</strong>, qui défendait un leadership collectif contre le culte du grand homme, ou <strong>Fannie Lou Hamer</strong>, métayère devenue porte-parole du Mississippi, sont indispensables à toute copie sérieuse.",
                en:"Reducing civil rights to Martin Luther King is the commonest error. The movement was a <strong>coalition of rival organisations</strong> with distinct methods: the NAACP and its litigation, the SCLC and its media campaigns, the SNCC and its grassroots work, CORE and its direct action. Organisers such as <strong>Ella Baker</strong>, who defended collective leadership against the cult of the great man, and <strong>Fannie Lou Hamer</strong>, a sharecropper turned spokeswoman for Mississippi, are indispensable to any serious answer."} }

            en:"The <strong>Civil Rights Act</strong> of 2 July 1964, wrung out after more than two months of Senate obstruction, banned segregation in all places open to the public, discrimination in hiring — on race, but also on sex, added by an amendment meant to sink the bill — and allowed federal funds to be cut off from any discriminating institution. Legally it rested not on the Fourteenth Amendment, circumvented since 1883, but on the <strong>Commerce Clause</strong>: a shrewd choice, upheld by the Court as early as December 1964."} },

            en:"The <strong>Voting Rights Act</strong> of 6 August 1965, passed in the weeks after the images from Selma, went further still: it suspended literacy tests, sent federal examiners to register voters and, above all, required states with a discriminatory past to obtain <strong>prior approval</strong> from Washington before any change to their election law. The effect was immediate: in Mississippi, Black registration rose from about 7% to over 60% in three years. It was by far the most effective statute of the whole period."} },

            en:"Five days after the <em>Voting Rights Act</em> was signed, the <strong>Watts</strong> district of Los Angeles erupted. The paradox is telling: the new laws had just brought down the South's legal segregation, but they had no purchase on unemployment, slum housing and police violence in northern ghettos. King himself failed in Chicago in 1966, facing popular hostility whose virulence surprised him. A new generation, embodied by <strong>Stokely Carmichael</strong>, judged nonviolence humiliating and integration illusory: the <strong>Black Power</strong> slogan claimed pride, economic autonomy and self-defence."} },
          { t:"p", c:{

            en:"<strong>Malcolm X</strong>, long a spokesman for the Nation of Islam, had formulated this critique earlier: denouncing integration as a search for approval, rejecting nonviolence as an absolute principle, and above all placing the Black American question in an international, anti-colonial frame. Assassinated in 1965, he became after his death the major reference for a generation. In parallel, the <strong>Black Panther Party</strong> combined armed police-monitoring patrols with social programmes — school breakfasts, clinics — before being methodically dismantled by the FBI's counter-intelligence programme."} },
          { t:"def", mot:{fr:"Backlash",en:"Backlash"},

               en:"The conservative political reaction provoked by civil rights advances. From 1968 the Republican <strong>Southern strategy</strong> captured the white Southern electorate, until then Democratic, by replacing explicit segregationist language with a vocabulary of <em>law and order</em>, <em>states' rights</em> and opposition to “quotas”. Within a generation the South shifted durably to the right: one of the most important electoral realignments of the American twentieth century, and proof that Johnson was right to fear losing the South for a long time."} }

        blocs:[
          { t:"p", c:{
            fr:"L'héritage législatif de 1964-1965 est démonté par trois voies successives. Par la <strong>jurisprudence</strong> d'abord : <em>Shelby County</em> (2013) neutralise le contrôle préalable au motif que le Sud a changé ; <em>Students for Fair Admissions</em> (2023) interdit la prise en compte de la race dans l'admission à l'université ; <em>Louisiana v. Callais</em> (29 avril 2026) resserre à son tour la section 2 du <em>Voting Rights Act</em>, huit mois après le soixantième anniversaire du texte. Chacune de ces décisions s'appuie sur le principe de <strong>neutralité raciale</strong> — l'argument de Harlan retourné contre les politiques correctrices.",
            en:"The legislative legacy of 1964-1965 has been taken apart along three successive routes. First through <strong>case law</strong>: <em>Shelby County</em> (2013) neutralised preclearance on the ground that the South had changed; <em>Students for Fair Admissions</em> (2023) barred the consideration of race in university admissions; <em>Louisiana v. Callais</em> (29 April 2026) in turn narrowed Section 2 of the <em>Voting Rights Act</em>, eight months after the statute's sixtieth anniversary. Each of these rulings rests on the principle of <strong>racial neutrality</strong> — Harlan's argument turned against remedial policies."} },
          { t:"p", c:{
            fr:"Par le <strong>pouvoir exécutif</strong> ensuite. En janvier 2025, un décret abroge l'obligation d'action positive imposée depuis 1965 aux entreprises titulaires de marchés fédéraux et prescrit la suppression des programmes de diversité dans l'administration. En avril 2025, un second décret ordonne d'éliminer, autant que le droit le permet, la responsabilité pour <strong>impact disparate</strong> — la doctrine qui permettait d'attaquer une pratique statistiquement discriminatoire sans avoir à prouver l'intention. Par la <strong>réglementation</strong> enfin : le ministère de la Justice supprime les dispositions correspondantes du titre VI en décembre 2025, le ministère de l'Éducation en juillet 2026.",
            en:"Then through <strong>executive power</strong>. In January 2025 an order repealed the affirmative-action obligation imposed since 1965 on federal contractors and directed the elimination of diversity programmes across the administration. In April 2025 a second order instructed agencies to eliminate, so far as the law allows, <strong>disparate impact</strong> liability — the doctrine that made it possible to challenge a statistically discriminatory practice without proving intent. And finally through <strong>regulation</strong>: the Justice Department removed the corresponding Title VI provisions in December 2025, the Education Department in July 2026."} },

            c2:{fr:"Formulée par la Cour suprême en 1971, la doctrine de l'<strong>impact disparate</strong> permet de contester une règle apparemment neutre — un test d'embauche, un critère de logement — dès lors qu'elle produit un effet nettement défavorable sur un groupe protégé et qu'elle n'est pas justifiée par une nécessité professionnelle. Elle est l'outil qui a rendu le <em>Civil Rights Act</em> réellement opérant, puisque presque personne n'affiche plus une intention discriminatoire. Sa suppression administrative en 2025-2026 ne modifie pas la loi de 1964, mais elle en <strong>vide largement l'application</strong> : c'est l'exemple le plus net de ce qu'on peut défaire sans passer par le Congrès.",
                en:"Formulated by the Supreme Court in 1971, the <strong>disparate impact</strong> doctrine allows an apparently neutral rule — a hiring test, a housing criterion — to be challenged where it markedly disadvantages a protected group and is not justified by business necessity. It is the tool that made the <em>Civil Rights Act</em> genuinely operative, since almost nobody now displays discriminatory intent. Its administrative removal in 2025-2026 does not change the 1964 statute, but it <strong>largely empties its enforcement</strong>: the clearest example of what can be undone without going through Congress."} },

    { en:"Disenfranchisement", fr:"Privation du droit de vote par des dispositifs formellement neutres." },
    { en:"Poll tax", fr:"Taxe électorale ; abolie aux scrutins fédéraux par le 24e amendement (1964)." },
    { en:"Literacy test", fr:"Test de lecture noté arbitrairement pour écarter les électeurs noirs." },
    { en:"Grandfather clause", fr:"Dispense réservée aux descendants d'électeurs d'avant 1867." },
    { en:"Sharecropping", fr:"Métayage : dépendance économique reconstituée après l'abolition." },
    { en:"Great Migration", fr:"Départ de six millions d'Afro-Américains du Sud vers le Nord (1910-1970)." },
    { en:"Redlining", fr:"Refus de prêt fondé sur la composition raciale d'un quartier." },
    { en:"Sit-in", fr:"Occupation pacifique d'un lieu réservé aux Blancs, à partir de 1960." },
    { en:"Freedom Ride", fr:"Voyage en autocar mixte destiné à tester la déségrégation des transports." },
    { en:"Nonviolent direct action", fr:"Action directe non violente : boycotts, marches, désobéissance civile." },
    { en:"Massive resistance", fr:"Résistance organisée du Sud à l'application de Brown après 1954." },

    { en:"Desegregation / integration", fr:"Suppression de la ségrégation / mélange effectif des populations." },
    { en:"Busing", fr:"Transport scolaire organisé pour rééquilibrer la composition des écoles." },
    { en:"Affirmative action", fr:"Discrimination positive ; encadrée en 1978, interdite à l'université en 2023." },
    { en:"Disparate impact", fr:"Effet discriminatoire d'une règle neutre, sans preuve d'intention." },
    { en:"Colorblindness", fr:"Neutralité raciale du droit, invoquée par les deux camps du débat." },
    { en:"Black Power", fr:"Mot d'ordre de 1966 : fierté, autonomie et autodéfense." },
    { en:"Backlash", fr:"Réaction conservatrice suscitée par les avancées des droits civiques." },
    { en:"Southern strategy", fr:"Stratégie républicaine de conquête de l'électorat blanc du Sud après 1968." },
    { en:"Mass incarceration", fr:"Incarcération de masse, aux effets très inégaux selon les groupes." }
  ],

  /* ─── 8. SUJETS POSSIBLES ─────────────────────────────────────────── */
  sujets: [
    { q:{fr:"Le mouvement des droits civiques a-t-il été une révolution ou l'achèvement d'une promesse constitutionnelle ?",
         en:"Was the Civil Rights Movement a revolution or the fulfilment of a constitutional promise?"},
      h:{fr:"Mobiliser les 14e et 15e amendements, l'échec de la Reconstruction et la formule de Harlan.",
         en:"Draw on the 14th and 15th Amendments, the failure of Reconstruction and Harlan's formula."} },
    { q:{fr:"Dans quelle mesure la télévision a-t-elle fait le succès du mouvement des droits civiques ?",
         en:"To what extent did television make the Civil Rights Movement succeed?"},
      h:{fr:"Comparer l'échec d'Albany (1962) et la réussite de Birmingham (1963) et Selma (1965).",
         en:"Compare the failure at Albany (1962) with the successes at Birmingham (1963) and Selma (1965)."} },
    { q:{fr:"Le droit suffit-il à produire l'égalité ? L'exemple américain depuis 1954.",
         en:"Is law enough to produce equality? The American example since 1954."},
      h:{fr:"Opposer ségrégation de jure et de facto ; écart de patrimoine et reségrégation scolaire.",
         en:"Contrast de jure and de facto segregation; the wealth gap and school resegregation."} },
    { q:{fr:"La neutralité raciale du droit est-elle devenue un obstacle à l'égalité ?",
         en:"Has the racial neutrality of the law become an obstacle to equality?"},
      h:{fr:"De Harlan (1896) à SFFA (2023), Callais (2026) et la suppression de l'impact disparate.",
         en:"From Harlan (1896) to SFFA (2023), Callais (2026) and the removal of disparate impact."} }
  ],

  /* ─── 9. À RETENIR ───────────────────────────────────────────────── */
  retenir: {
    fr:[
      "La ségrégation n'est pas un héritage direct de l'esclavage : c'est une <strong>construction juridique</strong> d'après 1877, validée par <em>Plessy</em> (1896).",
      "Elle repose sur trois piliers : lois de séparation, <strong>privation du droit de vote</strong>, violence extra-légale.",
      "La <strong>NAACP</strong> conduit une stratégie judiciaire de trente ans qui aboutit à <em>Brown</em> (1954) — victoire en droit, sans effet immédiat.",
      "L'<strong>action directe non violente</strong> est une stratégie médiatique autant qu'une éthique : Albany échoue, Birmingham et Selma réussissent.",
      "Le mouvement n'a pas de chef unique : <strong>NAACP, SCLC, SNCC, CORE</strong>, et des organisatrices comme Ella Baker et Fannie Lou Hamer.",
      "Les deux textes décisifs sont le <strong>Civil Rights Act</strong> (1964) et le <strong>Voting Rights Act</strong> (1965), le second étant le plus efficace.",
      "Après 1965, la ségrégation <strong>de facto</strong> du Nord résiste : Watts, l'échec de Chicago, la radicalisation du <em>Black Power</em>.",
      "Le bilan est <strong>juridique et politique</strong> plutôt qu'économique : l'écart de patrimoine est quasi inchangé depuis 1968.",
      "Depuis 2013 et surtout 2025-2026, l'héritage est démonté par la <strong>jurisprudence, les décrets et la réglementation</strong>, au nom de la neutralité raciale."
    ],
    en:[
      "Segregation is not a direct legacy of slavery: it is a <strong>legal construction</strong> after 1877, upheld by <em>Plessy</em> (1896).",
      "It rested on three pillars: separation laws, <strong>denial of the vote</strong>, and extra-legal violence.",
      "The <strong>NAACP</strong> ran a thirty-year legal strategy culminating in <em>Brown</em> (1954) — a victory in law with no immediate effect.",
      "<strong>Nonviolent direct action</strong> was a media strategy as much as an ethic: Albany failed, Birmingham and Selma succeeded.",
      "The movement had no single leader: <strong>NAACP, SCLC, SNCC, CORE</strong>, and organisers such as Ella Baker and Fannie Lou Hamer.",
      "The two decisive statutes are the <strong>Civil Rights Act</strong> (1964) and the <strong>Voting Rights Act</strong> (1965), the latter the more effective.",
      "After 1965 the North's <strong>de facto</strong> segregation held out: Watts, the failure in Chicago, the radicalisation of <em>Black Power</em>.",
      "The record is <strong>legal and political</strong> rather than economic: the wealth gap is almost unchanged since 1968.",
      "Since 2013 and above all 2025-2026, the legacy has been dismantled by <strong>courts, executive orders and regulation</strong>, in the name of racial neutrality."
    ]
  }
};
</script>

<script>
/* ─── Utilitaires ─── */
const $ = (s,r=document)=>r.querySelector(s);
let LANG = 'fr';
/* T() : renvoie la version dans la langue courante, ou la valeur telle quelle */
const T = v => (v && typeof v==='object' && !Array.isArray(v) && ('fr' in v||'en' in v)) ? (v[LANG] ?? v.fr) : v;

/* ─── Libellés d'interface ─── */
const UI = {
  fr:{ chrono:"Chronologie",
       essentiel:"L'essentiel", reperes:"Repères", quiEstQui:"Qui est qui", acteurs:"Acteurs clés",
       controverse:"Controverse", vocab:"Vocabulaire", lexique:"Lexique bilingue",
       filtrer:"Filtrer le lexique…", terme:"Terme", trad:"Traduction / usage",
       entrainement:"Entraînement", sujets:"Sujets possibles", memoriser:"Mémoriser",
       retenir:"À retenir", synthese:"Synthèse", chapitre:"Chapitre" },
  en:{ chrono:"Timeline",
       essentiel:"In brief", reperes:"Key dates", quiEstQui:"Who's who", acteurs:"Key figures",
       controverse:"Debate", vocab:"Vocabulary", lexique:"Bilingual glossary",
       filtrer:"Filter the glossary…", terme:"Term", trad:"Translation / usage",
       entrainement:"Practice", sujets:"Essay questions", memoriser:"Revise",
       retenir:"Key takeaways", synthese:"Synthesis", chapitre:"Chapter" }
};
const t = k => UI[LANG][k];

/* ─── Rendu des blocs de contenu ─── */
function bloc(b){
  switch(b.t){
    case 'p':      return `<p class="prose">${T(b.c)}</p>`;
    case 'liste':  return `<ul class="liste">${T(b.items).map(i=>`<li>${i}</li>`).join('')}</ul>`;
    case 'faits':  return `<div class="faits">${T(b.items).map(i=>
                     `<div class="fait"><div class="fait-l">${T(i.l)}</div><div class="fait-v">${T(i.v)}</div></div>`).join('')}</div>`;
    case 'stats':  return `<div class="stats">${b.items.map(i=>
                     `<div class="stat" style="--c:${i.c||'var(--a1)'}"><span class="stat-n">${T(i.n)}</span><span class="stat-d">${T(i.d)}</span></div>`).join('')}</div>`;
    case 'citation':return `<blockquote class="citation"><p>« ${T(b.c)} »</p><cite>${T(b.src)}</cite></blockquote>`;
    case 'encadre':return `<div class="encadre" style="--c:${b.c||'var(--a2)'}"><div class="encadre-ic">${b.icon||'💡'}</div>
                     <div><div class="encadre-t">${T(b.titre)}</div><div class="encadre-c">${T(b.c2)}</div></div></div>`;
    case 'def':    return `<div class="def"><div class="def-mot">${T(b.mot)}</div><div class="def-c">${T(b.c)}</div></div>`;
    case 'tableau':return `<div class="tbl-wrap"><table><thead><tr>${T(b.head).map(h=>`<th>${h}</th>`).join('')}</tr></thead>
                     <tbody>${T(b.rows).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tl':     return `<div class="tl">${T(b.items).map(i=>
                     `<div class="tl-item"><div class="tl-d">${T(i.d)}</div><div class="tl-c">${T(i.c)}</div></div>`).join('')}</div>`;
    default:       return '';
  }
}

/* ─── En-tête ─── */
function rendreHero(){
  const m = COURS.meta;
  document.documentElement.dataset.theme = m.theme;
  document.documentElement.lang = LANG;
  document.title = T(m.titre) + ' — Civilisation';
  $('#bc-titre').textContent = m.titre.fr ?? m.titre;   // la nav reste en français
  $('#ft').textContent = `${t('chapitre')} ${m.chapitre}${LANG==='fr'?' : ':': '}${T(m.titre)}`;
  $('#hero').innerHTML = `
    <span class="hero-flag">${m.drapeau}</span>
    <div class="hero-label">${T(m.label)}</div>
    <h1>${T(m.titre)}</h1>
    <p class="hero-sub">${T(m.sousTitre)}</p>`;
}

/* ─── Corps du cours ─── */
function rendreCours(){
  const c = COURS, out = [];

  out.push(`<section class="bloc rev" id="s-essentiel">
    <div class="essentiel"><div class="essentiel-label">${t('essentiel')}</div><p>${T(c.essentiel)}</p></div>
    <div class="stats">${c.chiffres.map((x,i)=>
      `<div class="stat" style="--c:var(--a${(i%4)+1})"><span class="stat-n">${T(x.n)}</span><span class="stat-d">${T(x.d)}</span></div>`).join('')}</div>
  </section>`);

  if(c.chronologie?.length){
    out.push(`<section class="bloc rev chrono-mobile" id="s-chrono">
      <div class="bloc-head"><span class="bloc-kicker">${t('reperes')}</span><h2 class="bloc-title">${t('chrono')}</h2></div>
      ${bloc({t:'tl',items:c.chronologie})}</section>`);
  }

  c.parties.forEach((p,pi)=>{
    let html = `<section class="partie rev" id="p-${pi}" style="--p:${p.couleur}">
      <div class="partie-head"><div class="partie-num">${p.num}</div>
      <div><div class="partie-kicker">${T(p.kicker)}</div><h2 class="partie-title">${T(p.titre)}</h2></div></div>`;
    p.sections.forEach((s,si)=>{
      html += `<div class="section" id="p-${pi}-${si}"><h3 class="section-title"><span class="section-num">${si+1}.</span> ${T(s.titre)}</h3>
        ${s.blocs.map(bloc).join('')}</div>`;
    });
    out.push(html+`</section>`);
  });

  if(c.acteurs?.length){
    out.push(`<section class="bloc rev" id="s-acteurs">
      <div class="bloc-head"><span class="bloc-kicker">${t('quiEstQui')}</span><h2 class="bloc-title">${t('acteurs')}</h2></div>
      <div class="acteurs">${c.acteurs.map(a=>
        `<div class="acteur" style="--c:${a.c}"><div class="acteur-nom">${a.nom}</div>
         <div class="acteur-role">${T(a.role)}</div><div class="acteur-c">${T(a.d)}</div></div>`).join('')}</div></section>`);
  }

  if(c.debat){
    out.push(`<section class="bloc rev" id="s-debat">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a4)">${t('controverse')}</span>
      <h2 class="bloc-title">${T(c.debat.question)}</h2></div>
      <div class="debat">
        <div class="debat-col oui"><div class="debat-t">${T(c.debat.oui.titre)}</div>
          <ul>${T(c.debat.oui.items).map(i=>`<li>${i}</li>`).join('')}</ul></div>
        <div class="debat-col non"><div class="debat-t">${T(c.debat.non.titre)}</div>
          <ul>${T(c.debat.non.items).map(i=>`<li>${i}</li>`).join('')}</ul></div>
      </div>
      ${c.debat.synthese?`<div class="encadre" style="--c:var(--a1);margin-top:14px">
        <div class="encadre-ic">⚖️</div><div><div class="encadre-t">${t('synthese')}</div>
        <div class="encadre-c">${T(c.debat.synthese)}</div></div></div>`:''}
    </section>`);
  }

  if(c.lexique?.length){
    out.push(`<section class="bloc rev" id="s-lexique">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a2)">${t('vocab')}</span>
      <h2 class="bloc-title">${t('lexique')}</h2></div>
      <input class="lex-search" id="lex-search" placeholder="${t('filtrer')}" aria-label="${t('filtrer')}">
      <div class="tbl-wrap"><table class="lex"><thead><tr><th>${t('terme')}</th><th>${t('trad')}</th></tr></thead>
      <tbody id="lex-body">${c.lexique.map(l=>`<tr><td>${l.en}</td><td>${l.fr}</td></tr>`).join('')}</tbody></table></div>
    </section>`);
  }

  if(c.sujets?.length){
    out.push(`<section class="bloc rev" id="s-sujets">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a4)">${t('entrainement')}</span>
      <h2 class="bloc-title">${t('sujets')}</h2></div>
      ${c.sujets.map((s,i)=>`<div class="sujet"><div class="sujet-n">${String(i+1).padStart(2,'0')}</div>
        <div><div class="sujet-q">${T(s.q)}</div><div class="sujet-h">${T(s.h)}</div></div></div>`).join('')}</section>`);
  }

  if(c.retenir?.length){
    out.push(`<section class="bloc rev" id="s-retenir">
      <div class="bloc-head"><span class="bloc-kicker">${t('memoriser')}</span><h2 class="bloc-title">${t('retenir')}</h2></div>
      <div class="retenir"><ul>${T(c.retenir).map(r=>`<li>${r}</li>`).join('')}</ul></div></section>`);
  }

  $('#cours').innerHTML = out.join('');
}

/* ─── Colonne chronologie ─── */
function rendreRail(){
  if(!COURS.chronologie?.length){ $('#rail')?.remove(); return; }
  $('#rail').innerHTML = `<div class="rail-title">${t('chrono')}</div>${bloc({t:'tl',items:COURS.chronologie})}`;
}

/* ─── Recherche dans le lexique ─── */
function brancherLexique(){
  const ls = $('#lex-search'); if(!ls) return;
  ls.addEventListener('input', ()=>{
    const q = ls.value.toLowerCase().trim();
    $('#lex-body').querySelectorAll('tr').forEach(tr=>{
      tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
}

/* ─── Changement de langue ─── */
function setLang(lang){
  LANG = lang;
  $('#ap-btn-fr').classList.toggle('active', lang==='fr');
  $('#ap-btn-en').classList.toggle('active', lang==='en');
  rendreHero(); rendreCours(); rendreRail();
  document.querySelectorAll('.rev').forEach(el=>el.classList.add('vu'));
  brancherLexique();
}

/* ─── Démarrage ─── */
function demarrer(){
  rendreHero(); rendreCours(); rendreRail(); brancherLexique();

  const maj = ()=>{
    const h = document.body.scrollHeight - innerHeight;
    $('#progress').style.width = (h>0 ? (scrollY/h)*100 : 0) + '%';
  };
  addEventListener('scroll', maj, {passive:true}); maj();

  if(!('IntersectionObserver' in window)){
    document.querySelectorAll('.rev').forEach(el=>el.classList.add('vu'));
    return;
  }
  const io = new IntersectionObserver(es=>es.forEach(x=>{
    if(x.isIntersecting){ x.target.classList.add('vu'); io.unobserve(x.target); }
  }), {threshold:.06});
  document.querySelectorAll('.rev').forEach(el=>io.observe(el));
}

demarrer();
</script>
