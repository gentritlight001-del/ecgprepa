    "fr": "Rédigée à Philadelphie en <strong>1787</strong> et en vigueur depuis 1789, la Constitution des États-Unis est la plus ancienne constitution écrite encore appliquée au monde. Elle repose sur trois principes : la <strong>séparation des pouvoirs</strong> entre le Congrès, le président et les juges, un système de <strong>freins et contrepoids</strong> (<span class='en'>checks and balances</span>) qui oblige chaque branche à compter avec les autres, et un <strong>fédéralisme</strong> qui partage la souveraineté entre l'Union et les cinquante États. Très courte et presque impossible à réviser (<strong>27 amendements</strong> en plus de deux siècles), elle s'adapte surtout par l'<strong>interprétation des juges</strong>, ce qui fait de la Cour suprême un acteur politique de premier plan. Depuis le retour de Donald Trump à la Maison-Blanche (janvier 2025), les contrepoids sont mis à l'épreuve : décrets en série, droits de douane d'urgence invalidés (février 2026), citoyenneté par la naissance sauvée par la Cour (30 juin 2026), puis victoire des démocrates au Congrès aux élections du <strong>3 novembre 2026</strong>.",

              "c2": {
                "fr": "Il ne faut pas confondre le régime <strong>présidentiel</strong> américain avec un régime « présidentialiste ». Le président ne peut ni dissoudre le Congrès, ni légiférer, ni être renversé par un vote de défiance : il est puissant <em>malgré</em> la séparation des pouvoirs, non grâce à elle. Le contraste avec le Royaume-Uni, où l'exécutif est <strong>fusionné</strong> au législatif, est un classique de dissertation.",
                "en": "The American <strong>presidential</strong> system must not be confused with a “presidentialist” one. The president cannot dissolve Congress, cannot legislate and cannot be removed by a no-confidence vote: he is powerful <em>despite</em> the separation of powers, not because of it. The contrast with the United Kingdom, where the executive is <strong>fused</strong> with the legislature, is a classic essay theme."

              "t": "p",
              "c": {
                "fr": "Le second pilier est le <strong>fédéralisme</strong>. La Constitution énumère les compétences de l'Union (commerce entre États, monnaie, défense, traités) et le <strong>10e amendement</strong> réserve aux États tout ce qui n'est pas délégué : police, éducation, droit pénal ordinaire, droit de la famille, organisation des élections. Trois clauses ont pourtant permis d'étendre considérablement le pouvoir fédéral : la clause des <strong>pouvoirs implicites</strong> (<span class='en'>Necessary and Proper Clause</span>, consacrée par <em>McCulloch v. Maryland</em> en 1819), la clause de <strong>commerce</strong>, largement interprétée depuis le New Deal, et la clause de <strong>suprématie</strong> (article VI), qui fait primer le droit fédéral sur celui des États. Le <a href=\"civi-us-3.html\">fédéralisme américain</a> fait l'objet d'un chapitre à part.",
                "en": "The second pillar is <strong>federalism</strong>. The Constitution lists the powers of the Union (commerce among the states, currency, defence, treaties) and the <strong>10th Amendment</strong> reserves to the states everything not delegated: policing, education, ordinary criminal law, family law, the running of elections. Three clauses have nevertheless allowed federal power to grow considerably: the <strong>implied powers</strong> clause (<span class='en'>Necessary and Proper Clause</span>, upheld in <em>McCulloch v. Maryland</em> in 1819), the <strong>Commerce Clause</strong>, broadly read since the New Deal, and the <strong>Supremacy Clause</strong> (Article VI), under which federal law prevails over state law. <a href=\"civi-us-3.html\">American federalism</a> has a chapter of its own."
              }

                "fr": "Depuis le 20 janvier 2025, le second mandat de Donald Trump repose sur la doctrine de l'<strong>exécutif unitaire</strong> : l'article II confiant « le pouvoir exécutif » au seul président, aucun organe indépendant ne devrait lui échapper. Elle s'est traduite par des droits de douane décrétés au titre des pouvoirs d'urgence économique, la révocation de responsables d'agences indépendantes, la fédéralisation de la Garde nationale dans plusieurs villes, et un décret redéfinissant la citoyenneté par la naissance, signé dès le premier jour.",
                "en": "Since 20 January 2025, Donald Trump's second term has rested on the doctrine of the <strong>unitary executive</strong>: since Article II vests “the executive power” in the president alone, no independent body should escape him. It has meant tariffs decreed under emergency economic powers, the removal of heads of independent agencies, the federalisation of the National Guard in several cities, and an order redefining birthright citizenship, signed on day one."

              "c2": {
                "fr": "Ces décisions montrent que les contrepoids <strong>fonctionnent encore</strong>, mais de façon sélective et tardive : la Cour statue souvent des mois après l'entrée en vigueur des mesures, et l'administration revient à la charge sous une autre forme juridique. Le débat ne porte donc plus sur l'existence du contrôle, mais sur son <strong>efficacité réelle</strong> face à un exécutif qui agit vite et seul. Et c'est la Cour, non le Congrès, qui a fait jouer le contrepoids : le <a href=\"../../../../actualites/en/articles/trump-tariffs-supreme-court.html\" class=\"a-lien\">dossier des droits de douane</a> l'illustre.",
                "en": "These decisions show that the checks <strong>still work</strong>, but selectively and late: the Court often rules months after measures take effect, and the administration returns to the charge in another legal form. The debate is no longer about whether review exists but about its <strong>real effectiveness</strong> against an executive that acts fast and alone. And it is the Court, not Congress, that has made the check work: the <a href=\"../../../../actualites/en/articles/trump-tariffs-supreme-court.html\" class=\"a-lien\">tariffs case</a> illustrates it."

                "fr": "Le fédéralisme n'est plus seulement un partage de compétences : il est devenu un <strong>champ de bataille partisan</strong>. Les procureurs généraux des États multiplient les recours contre les décisions fédérales (les États démocrates contre l'administration Trump, comme les républicains contre Biden), ce qui fait des tribunaux de district un contrepoids de première ligne. Et le renvoi de compétences aux États produit une <strong>fragmentation des droits</strong> : depuis <em>Dobbs</em> (2022), l'accès à l'avortement dépend de l'État de résidence, de l'interdiction quasi totale à la protection constitutionnelle locale. Le thème est détaillé dans l'article sur <a href=\"../../../../actualites/en/articles/abortion-usa-2026.html\" class=\"a-lien\">l'avortement après Dobbs</a>.",
                "en": "Federalism is no longer just a division of powers: it has become a <strong>partisan battlefield</strong>. State attorneys general file a growing number of suits against federal decisions (Democratic states against the Trump administration, as Republican ones did against Biden), which makes district courts a front-line check. And returning powers to the states produces a <strong>fragmentation of rights</strong>: since <em>Dobbs</em> (2022), access to abortion depends on the state of residence, from a near-total ban to local constitutional protection. The topic is detailed in the article on <a href=\"../../../../actualites/en/articles/abortion-usa-2026.html\" class=\"a-lien\">abortion after Dobbs</a>."

            {

              "c": {
                "fr": "Les États organisent aussi les élections, y compris fédérales, et fixent donc les circonscriptions. Neuf États (Texas, Californie, Missouri, Caroline du Nord, Ohio, Utah, Floride, Tennessee, Alabama) ont <strong>redessiné leur carte</strong> en cours de décennie pour les élections de 2026, la plupart à l'appel de Trump, la Californie en riposte (Proposition 50) : l'ampleur est inhabituelle. Le 29 avril 2026, l'arrêt <strong>Louisiana v. Callais</strong> (6-3, sous la plume du juge Alito) a jugé qu'une deuxième circonscription à majorité noire était un découpage racial inconstitutionnel et réduit fortement la portée de l'article 2 du <em>Voting Rights Act</em> de 1965, ce qui facilite de nouveaux redécoupages. Les résultats du 3 novembre montrent toutefois que ces manœuvres n'ont pas suffi à retenir la vague démocrate.",
                "en": "The states also run elections, including federal ones, and so draw the districts. Nine states (Texas, California, Missouri, North Carolina, Ohio, Utah, Florida, Tennessee, Alabama) have <strong>redrawn their maps</strong> mid-decade for the 2026 elections, most at Trump's urging, California in response (Proposition 50): the scale is unusual. On 29 April 2026, <strong>Louisiana v. Callais</strong> (6-3, written by Justice Alito) ruled that a second majority-Black district was an unconstitutional racial gerrymander and sharply narrowed the reach of Section 2 of the 1965 <em>Voting Rights Act</em>, which makes further redistricting easier. The 3 November results show, however, that these manoeuvres were not enough to hold back the Democratic wave."

                "en": "Drawing district lines to favour a party: opposing voters are concentrated in a few already-lost districts (<em>packing</em>) or scattered to make them a minority everywhere (<em>cracking</em>). The word comes from Massachusetts governor Elbridge Gerry (1812). The Supreme Court ruled in 2019 (<em>Rucho v. Common Cause</em>) that <strong>partisan</strong> gerrymandering is beyond federal judges' reach: only racially motivated districting remains open to challenge."

                "fr": "Le 3 novembre 2026, les démocrates ont repris la <strong>Chambre et le Sénat</strong> (les décomptes étaient encore provisoires au 13 novembre). Ils siégeront en janvier 2027 face à un président dont le veto ne se surmonte qu'aux deux tiers : le pays entre dans une période de <strong>gouvernement divisé</strong>, où le contrepoids politique du Congrès, longtemps absent, peut redevenir réel. Les <a href=\"../../../../actualites/en/articles/us-midterms-democrats-congress-2026.html\" class=\"a-lien\">midterms</a> relancent aussi les propositions de réforme institutionnelle, qui butent toutes sur la même difficulté : l'article V.",
                "en": "On 3 November 2026, Democrats retook the <strong>House and the Senate</strong> (counts were still provisional on 13 November). They will take their seats in January 2027 facing a president whose veto can only be overridden by two thirds: the country enters a period of <strong>divided government</strong>, in which Congress's political check, long absent, may become real again. The <a href=\"../../../../actualites/en/articles/us-midterms-democrats-congress-2026.html\" class=\"a-lien\">midterms</a> also revive proposals for institutional reform, all of which stumble on the same difficulty: Article V."

                  "<strong>The Electoral College</strong>: scrapping it would take an amendment. Hence the <em>National Popular Vote</em> interstate compact, which commits 18 states and the District of Columbia (222 electoral votes, after Virginia joined in April 2026) to award their votes to the national popular-vote winner, but takes effect only at 270.",

                "fr": "Le débat oppose deux lectures d'un même constat. Pour les uns, la longévité du texte prouve sa capacité d'adaptation, et les arrêts de 2026 montrent que les contrepoids jouent encore. Pour les autres, elle masque une paralysie institutionnelle qui reporte sur neuf juges non élus des arbitrages que le politique n'arrive plus à rendre. La question posée par les dissertations n'est donc pas de savoir si la Constitution est bonne, mais si une <strong>rigidité de 1787</strong> peut encore protéger la démocratie d'une présidence de 2026.",
