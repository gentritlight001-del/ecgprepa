<!DOCTYPE html>
<html lang="fr" data-theme="americain6">
<head>
<script src="../../../../auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'immigration et le melting pot — Civilisation Anglophone</title>
<link rel="stylesheet" href="../../../../fonts/fonts.css">

<!-- ══════════════════════════════════════════════════════════════════════
     TEMPLATE UNIVERSEL DE COURS DE CIVILISATION — v1
     Pour créer un nouveau cours : dupliquer ce fichier, ne modifier QUE
     le bloc de données (id="donnees") tout en bas. Rien d'autre à toucher.
     ══════════════════════════════════════════════════════════════════════ -->

<style>
  /* ─── PALETTE DE BASE (identique au site) ─── */
  :root{
    --bg:#0d0d0f; --surface:#16161a; --surface2:#1e1e24; --border:#2a2a35;
    --text:#e8e6e0; --text-dim:#8a8880; --text-faint:#4a4845;
    --radius:14px;
  }
  /* ─── THÈMES PAR LANGUE — change data-theme sur <html> ─── */
  html[data-theme="anglais"] { --a1:#c8a96e; --a2:#7c9ec9; --a3:#9ecba0; --a4:#c97c9e; --hero:#16233d; }
  html[data-theme="anglais2"] { --a1:#c9633f; --a2:#5b8f6f; --a3:#6c8fc7; --a4:#a06bb0; --hero:#16241b; }
  html[data-theme="espagnol"]{ --a1:#e0a93e; --a2:#c8553d; --a3:#7fae7a; --a4:#b06fa8; --hero:#3a1a18; }
  html[data-theme="allemand"]{ --a1:#d8b44a; --a2:#8fa4bd; --a3:#84b58e; --a4:#c06060; --hero:#241f1a; }
  html[data-theme="italien"] { --a1:#d5a94e; --a2:#6fae8f; --a3:#a8c07a; --a4:#c4695e; --hero:#152a24; }
  html[data-theme="chinois"] { --a1:#d9a441; --a2:#c05a4a; --a3:#83a98f; --a4:#a97fb0; --hero:#2c1618; }
  html[data-theme="americain"] { --a1:#5c86c4; --a2:#c05f57; --a3:#c2a35e; --a4:#8c86c9; --hero:#111c33; }
  html[data-theme="americain2"]{ --a1:#4f9d8d; --a2:#c4794a; --a3:#a8bd6a; --a4:#b0709c; --hero:#11282b; }
  html[data-theme="americain6"]{ --a1:#c9a83f; --a2:#5aa8a0; --a3:#b5648a; --a4:#7d8fd0; --hero:#221d33; }

  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;overflow-x:hidden}

  /* ─── FOND ─── */
  .bg-orb{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;opacity:.08;z-index:0}
  .orb1{width:700px;height:700px;background:var(--a1);top:-300px;right:-250px}
  .orb2{width:600px;height:600px;background:var(--a2);bottom:-250px;left:-250px}

  /* ─── BARRE DE PROGRESSION ─── */
  #progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:200;
    background:linear-gradient(90deg,var(--a1),var(--a2),var(--a4));transition:width .1s linear}

  /* ─── NAV ─── */
  nav{display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding:16px 40px;border-bottom:1px solid var(--border);
    background:rgba(13,13,15,.9);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100}
  .nav-logo{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;color:var(--a1);cursor:pointer}
  .breadcrumb{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--text-dim);flex-wrap:wrap}
  .breadcrumb span{cursor:pointer;transition:color .2s}
  .breadcrumb span:hover{color:var(--a1)}
  .breadcrumb .sep{color:var(--text-faint);cursor:default}
  .breadcrumb .current{color:var(--text);cursor:default}
  .nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .ap-lang-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    color:rgba(255,255,255,.6);font-family:'DM Mono',monospace;font-size:10px;font-weight:700;
    letter-spacing:.12em;padding:5px 14px;border-radius:4px;cursor:pointer;transition:all .2s;text-transform:uppercase}
  .ap-lang-btn.active{background:var(--a1);border-color:var(--a1);color:#12100c}
  .ap-lang-btn:hover:not(.active){background:rgba(255,255,255,.15);color:#fff}

  /* ─── HERO ─── */
  .hero{position:relative;z-index:1;padding:76px 40px 56px;text-align:center;overflow:hidden;
    background:linear-gradient(160deg,var(--hero),#0d0d0f 85%);border-bottom:1px solid var(--border)}
  .hero::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
    width:80px;height:2px;background:var(--a1)}
  .hero-flag{font-size:2.6rem;line-height:1;margin-bottom:18px;display:block}
  .hero-label{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.3em;
    text-transform:uppercase;color:var(--a1);margin-bottom:18px}
  .hero h1{font-family:'Playfair Display',serif;font-weight:900;line-height:1.05;
    font-size:clamp(2.4rem,6vw,4.6rem);max-width:900px;margin:0 auto 18px}
  .hero-sub{font-size:1rem;color:var(--text-dim);max-width:640px;margin:0 auto;line-height:1.6}

  /* ─── LAYOUT ─── */
  .layout{display:flex;gap:48px;max-width:1320px;margin:0 auto;padding:48px 40px 100px;position:relative;z-index:1}
  main{flex:1;min-width:0;max-width:840px}

  /* ─── COLONNE CHRONOLOGIE ─── */
  .rail{width:262px;flex-shrink:0;position:sticky;top:88px;align-self:flex-start;
    max-height:calc(100vh - 118px);overflow-y:auto;padding-right:8px}
  .rail-title{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;
    color:var(--a1);margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border)}
  .rail .tl{padding-left:20px;margin:0 0 0 4px}
  .rail .tl-item{padding-bottom:16px}
  .rail .tl-item::before{left:-26px;top:4px;width:7px;height:7px}
  .rail .tl-d{font-size:.66rem;letter-spacing:.08em}
  .rail .tl-c{font-size:.79rem;line-height:1.5}
  .rail::-webkit-scrollbar{width:3px}
  .rail::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .chrono-mobile{display:none}

  /* ─── BLOC GÉNÉRIQUE ─── */
  .bloc{margin-bottom:64px;scroll-margin-top:88px}
  .bloc-head{display:flex;align-items:baseline;gap:14px;margin-bottom:24px;
    padding-bottom:12px;border-bottom:1px solid var(--border)}
  .bloc-kicker{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--k,var(--a1))}
  .bloc-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--text)}

  /* ─── L'ESSENTIEL ─── */
  .essentiel{background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    border:1px solid var(--border);border-left:3px solid var(--a1);border-radius:var(--radius);
    padding:28px 30px;margin-bottom:36px}
  .essentiel-label{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--a1);margin-bottom:14px}
  .essentiel p{font-size:.98rem;line-height:1.75;color:var(--text);margin-bottom:0}
  .essentiel p strong{color:var(--a1);font-weight:500}

  /* ─── STATS ─── */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0}
  .stat{border-radius:10px;padding:18px 16px;text-align:center;border:1px solid rgba(255,255,255,.08);
    background:linear-gradient(135deg,color-mix(in srgb,var(--c,var(--a1)) 26%,#101014),
    color-mix(in srgb,var(--c,var(--a1)) 8%,#101014))}
  .stat-n{font-family:'DM Mono',monospace;font-size:1.5rem;font-weight:500;color:var(--text);display:block;line-height:1.1}
  .stat-d{font-size:.7rem;color:var(--text-dim);margin-top:7px;display:block;line-height:1.45}

  /* ─── PARTIES ─── */
  .partie{margin-bottom:78px;scroll-margin-top:88px}
  .partie-head{display:flex;align-items:center;gap:22px;margin-bottom:34px;
    padding-bottom:18px;border-bottom:2px solid var(--p)}
  .partie-num{font-family:'Playfair Display',serif;font-size:3.4rem;font-weight:900;
    color:var(--p);opacity:.35;line-height:.9;flex-shrink:0}
  .partie-title{font-family:'Playfair Display',serif;font-size:clamp(1.35rem,3vw,1.95rem);
    font-weight:700;line-height:1.2}
  .partie-kicker{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.24em;
    text-transform:uppercase;color:var(--p);margin-bottom:6px}

  .section{margin-bottom:44px;scroll-margin-top:88px}
  .section-title{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;
    color:var(--text);margin-bottom:18px;padding-left:16px;border-left:3px solid var(--p)}
  .section-num{color:var(--p);font-weight:900}

  /* ─── TEXTE ─── */
  .prose{font-size:.96rem;line-height:1.8;color:rgba(232,230,224,.78);margin-bottom:16px}
  .prose strong{color:var(--text);font-weight:500}
  .prose em{color:var(--p,var(--a1));font-style:normal;font-weight:500}
  .en{font-family:'DM Mono',monospace;font-size:.86em;color:var(--a2)}

  /* ─── LISTE ─── */
  .liste{list-style:none;margin:14px 0 20px}
  .liste li{font-size:.93rem;line-height:1.65;color:rgba(232,230,224,.75);
    padding:9px 0 9px 22px;position:relative;border-bottom:1px solid rgba(255,255,255,.05)}
  .liste li:last-child{border-bottom:none}
  .liste li::before{content:'';position:absolute;left:0;top:17px;width:6px;height:6px;
    border-radius:50%;background:var(--p,var(--a1))}
  .liste li strong{color:var(--text);font-weight:500}

  /* ─── FAITS CLÉS ─── */
  .faits{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;margin:20px 0}
  .fait{background:rgba(255,255,255,.03);border:1px solid var(--border);
    border-left:3px solid var(--p,var(--a1));border-radius:8px;padding:13px 15px}
  .fait-l{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--text-faint);
    text-transform:uppercase;letter-spacing:.14em;margin-bottom:5px}
  .fait-v{font-size:.86rem;font-weight:500;color:var(--text);line-height:1.4}

  /* ─── CITATION ─── */
  .citation{background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
    border:1px solid var(--border);border-left:3px solid var(--a1);border-radius:0 10px 10px 0;
    padding:20px 24px;margin:22px 0}
  .citation p{font-family:'Playfair Display',serif;font-style:italic;font-size:1.02rem;
    line-height:1.6;color:var(--text);margin-bottom:9px}
  .citation cite{font-family:'DM Mono',monospace;font-size:.66rem;letter-spacing:.08em;
    color:var(--a1);font-style:normal}

  /* ─── ENCADRÉ ─── */
  .encadre{display:flex;gap:15px;align-items:flex-start;border-radius:10px;padding:17px 20px;margin:20px 0;
    background:color-mix(in srgb,var(--c,var(--a2)) 7%,transparent);
    border:1px solid color-mix(in srgb,var(--c,var(--a2)) 26%,transparent)}
  .encadre-ic{font-size:1.5rem;flex-shrink:0;line-height:1.2}
  .encadre-t{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.2em;
    text-transform:uppercase;color:var(--c,var(--a2));margin-bottom:7px;font-weight:500}
  .encadre-c{font-size:.89rem;line-height:1.7;color:rgba(232,230,224,.75)}
  .encadre-c strong{color:var(--text);font-weight:500}

  /* ─── DÉFINITION ─── */
  .def{border:1px dashed var(--border);border-radius:10px;padding:15px 18px;margin:18px 0;
    background:rgba(255,255,255,.02)}
  .def-mot{font-family:'Playfair Display',serif;font-weight:700;font-size:1rem;color:var(--a3);margin-bottom:6px}
  .def-c{font-size:.88rem;line-height:1.7;color:rgba(232,230,224,.72)}

  /* ─── TABLEAU ─── */
  .tbl-wrap{overflow-x:auto;margin:20px 0;border:1px solid var(--border);border-radius:10px}
  table{width:100%;border-collapse:collapse;font-size:.83rem}
  thead{background:rgba(255,255,255,.04)}
  thead th{padding:11px 15px;text-align:left;font-family:'DM Mono',monospace;font-size:.6rem;
    letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap}
  tbody tr{border-top:1px solid var(--border)}
  tbody tr:nth-child(even){background:rgba(255,255,255,.015)}
  tbody td{padding:11px 15px;color:rgba(232,230,224,.75);line-height:1.5}
  tbody td:first-child{color:var(--text);font-weight:500}

  /* ─── CHRONOLOGIE ─── */
  .tl{border-left:2px solid var(--border);padding-left:26px;margin:8px 0 8px 6px}
  .tl-item{position:relative;padding-bottom:22px}
  .tl-item:last-child{padding-bottom:0}
  .tl-item::before{content:'';position:absolute;left:-33px;top:5px;width:9px;height:9px;border-radius:50%;
    background:var(--c,var(--a1));box-shadow:0 0 0 3px rgba(13,13,15,1),0 0 0 5px color-mix(in srgb,var(--c,var(--a1)) 35%,transparent)}
  .tl-d{font-family:'DM Mono',monospace;font-size:.72rem;font-weight:500;letter-spacing:.1em;
    color:var(--c,var(--a1));margin-bottom:4px}
  .tl-c{font-size:.9rem;line-height:1.6;color:rgba(232,230,224,.75)}
  .tl-c strong{color:var(--text);font-weight:500}

  /* ─── ACTEURS ─── */
  .acteurs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .acteur{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;
    transition:all .25s;position:relative;overflow:hidden}
  .acteur:hover{border-color:var(--c,var(--a1));transform:translateY(-3px);background:var(--surface2)}
  .acteur-nom{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;margin-bottom:3px}
  .acteur-role{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--c,var(--a1));margin-bottom:10px}
  .acteur-c{font-size:.82rem;line-height:1.6;color:var(--text-dim)}

  /* ─── DÉBAT ─── */
  .debat{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .debat-col{border:1px solid var(--border);border-radius:12px;padding:20px 22px;background:rgba(255,255,255,.02)}
  .debat-col.oui{border-top:3px solid var(--a3)}
  .debat-col.non{border-top:3px solid var(--a4)}
  .debat-t{font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}
  .debat-col.oui .debat-t{color:var(--a3)}
  .debat-col.non .debat-t{color:var(--a4)}
  .debat-col li{font-size:.87rem;line-height:1.6;color:rgba(232,230,224,.75);
    padding:9px 0 9px 18px;position:relative;list-style:none;border-bottom:1px solid rgba(255,255,255,.05)}
  .debat-col li:last-child{border-bottom:none}
  .debat-col li::before{content:'';position:absolute;left:0;top:16px;width:5px;height:5px;border-radius:50%}
  .debat-col.oui li::before{background:var(--a3)}
  .debat-col.non li::before{background:var(--a4)}
  .debat-col li strong{color:var(--text);font-weight:500}

  /* ─── LEXIQUE ─── */
  .lex-search{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-family:'DM Sans',sans-serif;font-size:.88rem;padding:11px 15px;margin-bottom:14px}
  .lex-search:focus{outline:none;border-color:var(--a1)}
  .lex-search::placeholder{color:var(--text-faint)}
  .lex td:first-child{font-family:'DM Mono',monospace;color:var(--a2);font-weight:500}

  /* ─── SUJETS ─── */
  .sujet{border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:10px;
    background:var(--surface);display:flex;gap:16px;align-items:flex-start;transition:all .2s}
  .sujet:hover{border-color:var(--a4);transform:translateX(4px)}
  .sujet-n{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:900;color:var(--text-faint);line-height:1;flex-shrink:0}
  .sujet-q{font-size:.94rem;line-height:1.6;color:var(--text);margin-bottom:5px;font-weight:400}
  .sujet-h{font-size:.79rem;color:var(--text-dim);line-height:1.55}

  /* ─── À RETENIR ─── */
  .retenir{background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 12%,transparent),rgba(255,255,255,.02));
    border:1px solid color-mix(in srgb,var(--a1) 30%,transparent);border-radius:var(--radius);padding:28px 30px}
  .retenir li{font-size:.93rem;line-height:1.65;color:rgba(232,230,224,.82);
    padding:10px 0 10px 26px;position:relative;list-style:none;border-bottom:1px solid rgba(255,255,255,.06)}
  .retenir li:last-child{border-bottom:none}
  .retenir li::before{content:'✓';position:absolute;left:0;top:9px;color:var(--a1);font-size:.85rem}
  .retenir li strong{color:var(--text);font-weight:500}

  /* ─── PIED DE PAGE ─── */
  footer{text-align:center;padding:36px 40px;border-top:1px solid var(--border);
    font-family:'DM Mono',monospace;font-size:.7rem;color:var(--text-dim);letter-spacing:.14em;
    text-transform:uppercase}

  /* ─── ANIMATION ─── */
  .rev{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
  .rev.vu{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){.rev{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
  :focus-visible{outline:2px solid var(--a1);outline-offset:3px}

  /* ─── RESPONSIVE ─── */
  @media(max-width:1080px){
    .rail{display:none}
    .layout{padding:32px 22px 70px}
    .chrono-mobile{display:block}
  }
  @media(max-width:680px){
    nav{padding:12px 18px;flex-wrap:wrap}
    .breadcrumb{font-size:.7rem;order:3;width:100%}
    .hero{padding:52px 20px 40px}
    .debat{grid-template-columns:1fr}
    .partie-head{gap:14px}
    .partie-num{font-size:2.4rem}
  }
  /* ─── IMPRESSION ─── */
  @media print{
    body{background:#fff;color:#111}
    nav,.rail,#progress,.bg-orb,.nav-right{display:none!important}
    .hero{background:none;border-bottom:2px solid #111;padding:0 0 22px}
    .hero h1,.prose,.liste li,.bloc-title{color:#111}
    .layout{display:block;padding:0}
    .partie,.bloc{break-inside:avoid;page-break-inside:avoid}
    .rev{opacity:1;transform:none}
    .chrono-mobile{display:block!important}
  }
</style>
</head>
<body>

<div id="progress"></div>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<nav>
  <div class="nav-logo" onclick="location.href='../../../../index.html'">ECG Prépa</div>
  <div class="breadcrumb">
    <span onclick="location.href='../../../../index.html'">Accueil</span>
    <span class="sep">/</span>
    <span onclick="location.href='../../../index.html'">2ème Année</span>
    <span class="sep">/</span>
    <span onclick="location.href='../../index.html'">Langues</span>
    <span class="sep">/</span>
    <span onclick="location.href='../index.html'">Civilisation</span>
    <span class="sep">/</span>
    <span class="current" id="bc-titre">—</span>
  </div>
  <div class="nav-right">
    <button id="ap-btn-fr" class="ap-lang-btn active" onclick="setLang('fr')">🇫🇷 FR</button>
    <button id="ap-btn-en" class="ap-lang-btn" onclick="setLang('en')">🇬🇧 EN</button>
  </div>
</nav>

<header class="hero" id="hero"></header>

<div class="layout">
  <aside class="rail" id="rail"></aside>
  <main id="cours"></main>
</div>

<footer id="ft"></footer>


<!-- ══════════════════════════════════════════════════════════════════
     ⬇⬇⬇  SEULE PARTIE À MODIFIER POUR UN NOUVEAU COURS  ⬇⬇⬇
     ══════════════════════════════════════════════════════════════════ -->
<script id="donnees">
const COURS = {

  /* ─── 1. IDENTITÉ DU COURS ───────────────────────────────────────── */
  meta: {
    theme:     "americain6",                 // anglais | anglais2 | americain | americain2 | americain3 | americain4 | americain5 | americain6 | espagnol | allemand | italien | chinois
    drapeau:   "🇺🇸",
    chapitre:  "7",
    label:     { fr:"États-Unis · Chapitre 07", en:"United States · Chapter 07" },
    titre:     { fr:"L'immigration et le melting pot", en:"Immigration and the melting pot" },
    sousTitre: { fr:"Un pays construit par l'arrivée d'étrangers et qui n'a jamais cessé de trier ceux qu'il accueille — jusqu'au renversement de 2025-2026.",
                 en:"A country built by the arrival of foreigners that has never stopped sorting whom it admits — up to the reversal of 2025-2026." }
  },

  /* ─── 2. L'ESSENTIEL + CHIFFRES CLÉS ─────────────────────────────── */
  essentiel: {
    fr:"Les États-Unis sont le premier pays d'immigration au monde et fondent leur identité sur ce récit — mais leur histoire migratoire est faite d'<strong>alternances entre ouverture et fermeture</strong>. Après trois grandes vagues européennes, la loi de <strong>1924</strong> instaure des quotas par origine nationale qui referment le pays pendant quarante ans ; la loi <strong>Hart-Celler de 1965</strong> les abolit et redessine complètement la démographie américaine, en donnant la priorité au <strong>regroupement familial</strong> et en ouvrant de fait l'immigration à l'Asie et à l'Amérique latine. Ce système, jamais réformé en profondeur depuis, produit deux effets structurels : des <strong>files d'attente de plusieurs décennies</strong> pour les voies légales, et une population sans papiers importante, dont une part considérable est entrée légalement puis restée au-delà de son visa. La question s'est déplacée du débat économique vers le terrain identitaire et sécuritaire, jusqu'à la rupture de 2025-2026 : expulsions massives, restriction de l'asile, tentative d'abolir le <strong>droit du sol</strong> — censurée par la Cour suprême en juin 2026 — et, pour la première fois depuis les années 1930, un <strong>solde migratoire négatif</strong>.",
    en:"The United States is the world's leading country of immigration and founds its identity on that story — yet its migration history is one of <strong>alternating opening and closure</strong>. After three great European waves, the law of <strong>1924</strong> imposed national-origin quotas that shut the country for forty years; the <strong>Hart-Celler Act of 1965</strong> abolished them and completely redrew American demography, prioritising <strong>family reunification</strong> and effectively opening immigration to Asia and Latin America. That system, never deeply reformed since, produces two structural effects: <strong>waiting lists of several decades</strong> on the legal routes, and a large undocumented population, a considerable share of which entered legally and then overstayed. The debate has shifted from economics to identity and security, up to the rupture of 2025-2026: mass removals, restricted asylum, an attempt to abolish <strong>birthright citizenship</strong> — struck down by the Supreme Court in June 2026 — and, for the first time since the 1930s, <strong>negative net migration</strong>."
  },

            en:"Four sequences are conventionally distinguished. The first, colonial and British, shaped the country's cultural matrix. The second, around <strong>1845-1855</strong>, brought Irish fleeing famine and Germans fleeing revolution: the arrival of Catholics in a Protestant country triggered the first organised <strong>nativist</strong> reaction. The third, between <strong>1880 and 1920</strong>, was the largest — some twenty million people from Italy, Poland, Russia and Greece — and transformed the industrial cities. The fourth, opened after 1965, came from Asia and Latin America and continues still."} },

            fr:"La loi <strong>Johnson-Reed</strong> de 1924 est le tournant le plus radical de l'histoire migratoire américaine. Elle attribue à chaque nationalité un quota calculé sur la composition de la population américaine plusieurs décennies plus tôt — un procédé conçu pour favoriser l'Europe du Nord-Ouest et réduire à presque rien l'immigration italienne, polonaise ou juive d'Europe orientale. Elle exclut par ailleurs quasiment toute l'Asie. Ses conséquences dépassent le domaine migratoire : elle contribue au refus d'accueillir des réfugiés juifs dans les années 1930, et elle crée en 1924 la <strong>police des frontières</strong>.",
            en:"The <strong>Johnson-Reed</strong> Act of 1924 is the most radical turning point in American migration history. It assigned each nationality a quota calculated on the composition of the American population decades earlier — a device designed to favour north-western Europe and reduce Italian, Polish and eastern European Jewish immigration to almost nothing. It also excluded virtually all of Asia. Its consequences went beyond migration: it contributed to the refusal to take in Jewish refugees in the 1930s, and it created the <strong>Border Patrol</strong> in 1924."} },
          { t:"p", c:{
            fr:"Cette fermeture n'empêche pas le recours au travail étranger : elle le rend seulement temporaire et sans droits. Le programme <strong>Bracero</strong>, de 1942 à 1964, importe des millions de travailleurs agricoles mexicains sous contrat, sans perspective d'installation, et habitue employeurs comme travailleurs à des circulations qui se poursuivront hors de tout cadre légal après la fin du programme. C'est l'un des mécanismes qui explique la formation d'une immigration mexicaine <strong>irrégulière et structurelle</strong> : elle est le résidu d'une politique de main-d'œuvre, pas un accident.",
            en:"That closure did not stop the use of foreign labour: it merely made it temporary and rightless. The <strong>Bracero</strong> programme, from 1942 to 1964, brought in millions of contracted Mexican farm workers with no prospect of settlement, and accustomed employers and workers alike to movements that would continue outside any legal framework once the programme ended. This is one of the mechanisms explaining the formation of a <strong>structural, irregular</strong> Mexican migration: it is the residue of a labour policy, not an accident."} }

            fr:"Portée par le climat des droits civiques — il devenait intenable de trier les entrants par origine ethnique —, la loi <strong>Hart-Celler</strong> supprime les quotas nationaux et les remplace par un système de <strong>préférences</strong> donnant la priorité aux liens familiaux, puis aux qualifications professionnelles. Ses promoteurs assurent que l'équilibre démographique du pays n'en sera pas modifié. C'est exactement l'inverse qui se produit : le regroupement familial fonctionne comme un multiplicateur, et les origines des immigrants basculent en une génération de l'Europe vers l'Asie et l'Amérique latine.",
            en:"Driven by the civil rights climate — sorting entrants by ethnic origin had become untenable — the <strong>Hart-Celler</strong> Act abolished national quotas and replaced them with a system of <strong>preferences</strong> giving priority to family ties, then to professional qualifications. Its promoters insisted the country's demographic balance would not change. Exactly the opposite happened: family reunification worked as a multiplier, and the origins of immigrants shifted within a generation from Europe to Asia and Latin America."} },

            c:{fr:"Le choix du mot est ici un marqueur politique explicite, qu'un candidat doit savoir manier. <strong>Illegal alien</strong> est le terme du droit fédéral, repris par les partisans de la fermeture ; <strong>undocumented</strong> est privilégié par les associations et une partie de la presse, au motif que l'illégalité qualifie un acte et non une personne ; <strong>unauthorized</strong> est la formule des statisticiens, jugée la plus neutre. En anglais oral, employer l'un ou l'autre revient déjà à <strong>indiquer une position</strong> — mieux vaut donc le faire sciemment.",
               en:"The choice of word is here an explicit political marker that a candidate should know how to handle. <strong>Illegal alien</strong> is the term of federal law, taken up by supporters of closure; <strong>undocumented</strong> is preferred by advocacy groups and part of the press, on the ground that illegality describes an act and not a person; <strong>unauthorized</strong> is the statisticians' formula, considered the most neutral. In spoken English, using one or the other already <strong>signals a position</strong> — better, then, to do it knowingly."} }

            fr:"La frontière méridionale s'étend sur plus de trois mille kilomètres, dont une large part de désert. Les opérations de bouclage des zones urbaines engagées à partir de 1994 n'ont pas réduit les passages : elles les ont déplacés vers des itinéraires plus longs et plus dangereux, professionnalisant du même coup les réseaux de passeurs et faisant fortement monter le nombre de morts. Ce mécanisme, largement documenté, est un cas d'école de <strong>politique publique produisant l'effet inverse de celui recherché</strong> — argument à mobiliser dans toute dissertation sur l'efficacité des murs.",
            en:"The southern border runs for more than three thousand kilometres, much of it desert. The urban sealing operations launched from 1994 did not reduce crossings: they displaced them onto longer and more dangerous routes, professionalising smuggling networks in the process and sharply raising the death toll. This mechanism, extensively documented, is a textbook case of <strong>public policy producing the opposite of its intended effect</strong> — an argument to deploy in any essay on the effectiveness of walls."} },

            fr:"La frontière est aussi une <strong>scène</strong>. Elle concentre l'attention médiatique alors qu'elle ne représente qu'une partie du phénomène migratoire, et sa visibilité permet d'afficher une action là où la réforme législative est bloquée depuis <strong>2013</strong>, date à laquelle un compromis bipartisan voté au Sénat n'a jamais été soumis au vote de la Chambre. Faute de loi, chaque président gouverne l'immigration par <strong>décret et circulaire</strong> — d'où des revirements complets à chaque alternance, et une insécurité juridique permanente pour les personnes concernées.",
            en:"The border is also a <strong>stage</strong>. It concentrates media attention although it represents only part of the migration phenomenon, and its visibility allows action to be displayed where legislative reform has been blocked since <strong>2013</strong>, when a bipartisan compromise passed by the Senate was never brought to a vote in the House. For want of a statute, each president governs immigration by <strong>executive order and administrative guidance</strong> — hence complete reversals at every change of administration, and permanent legal insecurity for those concerned."} }

        blocs:[
          { t:"p", c:{
            fr:"La métaphore du creuset, popularisée par une pièce de théâtre de <strong>1908</strong>, décrit une fusion : les origines se dissolvent dans une identité américaine nouvelle. Elle a été contestée dès les années 1960 par le modèle du <strong>saladier</strong>, ou multiculturalisme, où chaque groupe conserve sa culture tout en partageant une citoyenneté. Une troisième lecture, plus critique, souligne que le creuset a longtemps été <strong>sélectif</strong> : il a effectivement fondu les Européens entre eux, en produisant une identité blanche commune, tout en maintenant à l'écart Africains-Américains, Autochtones et Asiatiques.",
            en:"The crucible metaphor, popularised by a <strong>1908</strong> play, describes a fusion: origins dissolve into a new American identity. It was contested from the 1960s by the <strong>salad bowl</strong> model, or multiculturalism, in which each group keeps its culture while sharing a citizenship. A third, more critical reading stresses that the crucible was long <strong>selective</strong>: it did indeed melt Europeans into one another, producing a common white identity, while keeping African Americans, Indigenous peoples and Asians outside."} },
          { t:"p", c:{
            fr:"Les données d'assimilation, elles, sont plutôt rassurantes et souvent mal connues : la <strong>deuxième génération</strong> parle anglais couramment, dépasse ses parents en niveau d'études et en revenus, et se marie fréquemment hors de son groupe d'origine. L'espagnol, contrairement à une inquiétude fréquemment exprimée, se transmet mal au-delà de la troisième génération. Le vrai débat porte donc moins sur la capacité d'intégration que sur son <strong>rythme</strong>, sur le coût public de court terme et sur la manière dont la nation se raconte elle-même.",
            en:"The assimilation data, by contrast, are rather reassuring and often poorly known: the <strong>second generation</strong> speaks fluent English, surpasses its parents in education and income, and frequently marries outside its group of origin. Spanish, contrary to a frequently expressed anxiety, transmits poorly beyond the third generation. The real debate is therefore less about the capacity to integrate than about its <strong>pace</strong>, the short-term public cost, and the way the nation tells its own story."} },
          { t:"encadre", icon:"🥗", c:"var(--a2)",
            titre:{fr:"À manier avec précision en dissertation", en:"To be handled precisely in an essay"},
            c2:{fr:"Écrire que « les États-Unis sont un melting pot » est un lieu commun sans valeur. Ce qui compte, c'est de préciser <strong>de quoi la métaphore est le nom</strong> : un modèle assimilationniste ancien, contesté depuis les années 1960 ; un idéal jamais appliqué aux minorités racialisées ; et aujourd'hui un enjeu de politique publique, puisque la fin des programmes de diversité et les débats sur l'enseignement de l'histoire portent précisément sur le choix entre creuset et mosaïque. Employez la formule comme <strong>objet d'analyse</strong>, jamais comme description.",
                en:"Writing that “the United States is a melting pot” is a worthless commonplace. What matters is specifying <strong>what the metaphor is the name of</strong>: an old assimilationist model, contested since the 1960s; an ideal never applied to racialised minorities; and today a matter of public policy, since the ending of diversity programmes and the debates on teaching history bear precisely on the choice between crucible and mosaic. Use the phrase as an <strong>object of analysis</strong>, never as a description."} }

        blocs:[
          { t:"p", c:{
            fr:"Le bilan économique dépend entièrement de l'échelle retenue. À <strong>court terme et à l'échelon local</strong>, l'accueil pèse sur les budgets : scolarisation, santé, logement d'urgence relèvent des États et des municipalités. À <strong>long terme et à l'échelon fédéral</strong>, le solde est généralement positif, car les immigrants arrivent en âge de travailler sans que le pays ait financé leur éducation, et parce que leurs enfants sont contributeurs nets. Cette asymétrie entre coûts locaux immédiats et bénéfices fédéraux différés explique une grande part du conflit politique — chacun a raison depuis son budget.",
            en:"The economic balance depends entirely on the scale chosen. In the <strong>short term and locally</strong>, reception weighs on budgets: schooling, health care and emergency housing fall to states and municipalities. In the <strong>long term and federally</strong>, the balance is generally positive, since immigrants arrive of working age without the country having paid for their education, and because their children are net contributors. This asymmetry between immediate local costs and deferred federal benefits explains much of the political conflict — everyone is right from within their own budget."} },

        blocs:[
          { t:"p", c:{
            fr:"Le second mandat ouvert en janvier 2025 marque une rupture d'échelle. Les mesures combinent expulsions intérieures massives, fermeture quasi totale de l'accès à l'asile, fin du <strong>statut de protection temporaire</strong> pour plusieurs nationalités, et suspension de fait du programme de réinstallation des réfugiés. Le résultat démographique est sans précédent récent : selon les données du recensement, le solde migratoire net s'est effondré, et l'analyse des enquêtes mensuelles de population conclut à une baisse d'environ <strong>2,9 millions</strong> de personnes nées à l'étranger entre janvier 2025 et juillet 2026 — soit, pour la première fois depuis les années 1930, un <strong>solde migratoire négatif</strong>.",
            en:"The second term opened in January 2025 marks a change of scale. Measures combine mass interior removals, near-total closure of access to asylum, the ending of <strong>Temporary Protected Status</strong> for several nationalities, and the de facto suspension of the refugee resettlement programme. The demographic result has no recent precedent: according to census data, net migration has collapsed, and analysis of the monthly population surveys concludes there was a fall of about <strong>2.9 million</strong> foreign-born people between January 2025 and July 2026 — that is, for the first time since the 1930s, <strong>negative net migration</strong>."} },
          { t:"p", c:{
            fr:"La bataille la plus lourde de conséquences a toutefois porté sur le <strong>droit du sol</strong>. Un décret du 20 janvier 2025 prétendait refuser la citoyenneté aux enfants nés sur le territoire de parents sans statut ou en séjour temporaire. Après un premier arrêt de juin 2025 portant seulement sur la procédure — la Cour suprême y limite les injonctions à portée nationale sans se prononcer sur le fond —, la Cour tranche le <strong>30 juin 2026</strong> dans <em>Trump v. Barbara</em> : le décret est contraire au 14e amendement, dont la clause de citoyenneté ne souffre que des exceptions étroites, comme les enfants de diplomates. Un nouveau décret d'août 2026, visant le « tourisme de naissance », est immédiatement contesté.",
            en:"The most consequential battle, however, concerned <strong>birthright citizenship</strong>. An order of 20 January 2025 purported to deny citizenship to children born on the territory to parents without status or temporarily present. After a first ruling in June 2025 dealing only with procedure — the Supreme Court there limited nationwide injunctions without addressing the merits — the Court decided on <strong>30 June 2026</strong> in <em>Trump v. Barbara</em>: the order contravenes the Fourteenth Amendment, whose citizenship clause admits only narrow exceptions, such as the children of diplomats. A further order of August 2026, targeting “birth tourism”, was immediately challenged."} },

            c2:{fr:"L'arrêt de juin 2026 est utilisable dans au moins trois autres chapitres. Il rappelle qu'un <strong>décret ne peut pas modifier la Constitution</strong>, ce qui vaut aussi pour les élections et pour les droits civiques. Il montre qu'une Cour majoritairement conservatrice peut censurer l'exécutif sur un texte clair, nuance utile contre l'idée d'une juridiction alignée. Et il rappelle que le droit du sol américain, issu du 14e amendement de <strong>1868</strong>, avait précisément pour objet de garantir la citoyenneté des anciens esclaves : y toucher, c'est rouvrir la question réglée à la sortie de la guerre de Sécession.",
                en:"The June 2026 ruling can be used in at least three other chapters. It is a reminder that <strong>an executive order cannot amend the Constitution</strong>, which holds for elections and civil rights too. It shows that a majority-conservative Court can strike down the executive on a clear text, a useful nuance against the idea of an aligned judiciary. And it recalls that American birthright citizenship, from the Fourteenth Amendment of <strong>1868</strong>, was designed precisely to guarantee the citizenship of former slaves: touching it means reopening the question settled at the end of the Civil War."} },

      "In 2025-2026 net migration turns <strong>negative</strong> for the first time since the 1930s, and the Supreme Court upholds <strong>birthright citizenship</strong>."
    ]
  }
};
</script>
<!-- ══════════════════════════════════════════════════════════════════
     ⬆⬆⬆  FIN DES DONNÉES — NE RIEN MODIFIER EN DESSOUS  ⬆⬆⬆
     ══════════════════════════════════════════════════════════════════ -->


<script>
/* ─── Utilitaires ─── */
const $ = (s,r=document)=>r.querySelector(s);
let LANG = 'fr';
/* T() : renvoie la version dans la langue courante, ou la valeur telle quelle */
const T = v => (v && typeof v==='object' && !Array.isArray(v) && ('fr' in v||'en' in v)) ? (v[LANG] ?? v.fr) : v;

/* ─── Libellés d'interface ─── */
const UI = {
  fr:{ chrono:"Chronologie",
       essentiel:"L'essentiel", reperes:"Repères", quiEstQui:"Qui est qui", acteurs:"Acteurs clés",
       controverse:"Controverse", vocab:"Vocabulaire", lexique:"Lexique bilingue",
       filtrer:"Filtrer le lexique…", terme:"Terme", trad:"Traduction / usage",
       entrainement:"Entraînement", sujets:"Sujets possibles", memoriser:"Mémoriser",
       retenir:"À retenir", synthese:"Synthèse", chapitre:"Chapitre" },
  en:{ chrono:"Timeline",
       essentiel:"In brief", reperes:"Key dates", quiEstQui:"Who's who", acteurs:"Key figures",
       controverse:"Debate", vocab:"Vocabulary", lexique:"Bilingual glossary",
       filtrer:"Filter the glossary…", terme:"Term", trad:"Translation / usage",
       entrainement:"Practice", sujets:"Essay questions", memoriser:"Revise",
       retenir:"Key takeaways", synthese:"Synthesis", chapitre:"Chapter" }
};
const t = k => UI[LANG][k];

/* ─── Rendu des blocs de contenu ─── */
function bloc(b){
  switch(b.t){
    case 'p':      return `<p class="prose">${T(b.c)}</p>`;
    case 'liste':  return `<ul class="liste">${T(b.items).map(i=>`<li>${i}</li>`).join('')}</ul>`;
    case 'faits':  return `<div class="faits">${T(b.items).map(i=>
                     `<div class="fait"><div class="fait-l">${T(i.l)}</div><div class="fait-v">${T(i.v)}</div></div>`).join('')}</div>`;
    case 'stats':  return `<div class="stats">${b.items.map(i=>
                     `<div class="stat" style="--c:${i.c||'var(--a1)'}"><span class="stat-n">${T(i.n)}</span><span class="stat-d">${T(i.d)}</span></div>`).join('')}</div>`;
    case 'citation':return `<blockquote class="citation"><p>« ${T(b.c)} »</p><cite>${T(b.src)}</cite></blockquote>`;
    case 'encadre':return `<div class="encadre" style="--c:${b.c||'var(--a2)'}"><div class="encadre-ic">${b.icon||'💡'}</div>
                     <div><div class="encadre-t">${T(b.titre)}</div><div class="encadre-c">${T(b.c2)}</div></div></div>`;
    case 'def':    return `<div class="def"><div class="def-mot">${T(b.mot)}</div><div class="def-c">${T(b.c)}</div></div>`;
    case 'tableau':return `<div class="tbl-wrap"><table><thead><tr>${T(b.head).map(h=>`<th>${h}</th>`).join('')}</tr></thead>
                     <tbody>${T(b.rows).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tl':     return `<div class="tl">${T(b.items).map(i=>
                     `<div class="tl-item"><div class="tl-d">${T(i.d)}</div><div class="tl-c">${T(i.c)}</div></div>`).join('')}</div>`;
    default:       return '';
  }
}

/* ─── En-tête ─── */
function rendreHero(){
  const m = COURS.meta;
  document.documentElement.dataset.theme = m.theme;
  document.documentElement.lang = LANG;
  document.title = T(m.titre) + ' — Civilisation';
  $('#bc-titre').textContent = m.titre.fr ?? m.titre;   // la nav reste en français
  $('#ft').textContent = `${t('chapitre')} ${m.chapitre}${LANG==='fr'?' : ':': '}${T(m.titre)}`;
  $('#hero').innerHTML = `
    <span class="hero-flag">${m.drapeau}</span>
    <div class="hero-label">${T(m.label)}</div>
    <h1>${T(m.titre)}</h1>
    <p class="hero-sub">${T(m.sousTitre)}</p>`;
}

/* ─── Corps du cours ─── */
function rendreCours(){
  const c = COURS, out = [];

  out.push(`<section class="bloc rev" id="s-essentiel">
    <div class="essentiel"><div class="essentiel-label">${t('essentiel')}</div><p>${T(c.essentiel)}</p></div>
    <div class="stats">${c.chiffres.map((x,i)=>
      `<div class="stat" style="--c:var(--a${(i%4)+1})"><span class="stat-n">${T(x.n)}</span><span class="stat-d">${T(x.d)}</span></div>`).join('')}</div>
  </section>`);

  if(c.chronologie?.length){
    out.push(`<section class="bloc rev chrono-mobile" id="s-chrono">
      <div class="bloc-head"><span class="bloc-kicker">${t('reperes')}</span><h2 class="bloc-title">${t('chrono')}</h2></div>
      ${bloc({t:'tl',items:c.chronologie})}</section>`);
  }

  c.parties.forEach((p,pi)=>{
    let html = `<section class="partie rev" id="p-${pi}" style="--p:${p.couleur}">
      <div class="partie-head"><div class="partie-num">${p.num}</div>
      <div><div class="partie-kicker">${T(p.kicker)}</div><h2 class="partie-title">${T(p.titre)}</h2></div></div>`;
    p.sections.forEach((s,si)=>{
      html += `<div class="section" id="p-${pi}-${si}"><h3 class="section-title"><span class="section-num">${si+1}.</span> ${T(s.titre)}</h3>
        ${s.blocs.map(bloc).join('')}</div>`;
    });
    out.push(html+`</section>`);
  });

  if(c.acteurs?.length){
    out.push(`<section class="bloc rev" id="s-acteurs">
      <div class="bloc-head"><span class="bloc-kicker">${t('quiEstQui')}</span><h2 class="bloc-title">${t('acteurs')}</h2></div>
      <div class="acteurs">${c.acteurs.map(a=>
        `<div class="acteur" style="--c:${a.c}"><div class="acteur-nom">${a.nom}</div>
         <div class="acteur-role">${T(a.role)}</div><div class="acteur-c">${T(a.d)}</div></div>`).join('')}</div></section>`);
  }

  if(c.debat){
    out.push(`<section class="bloc rev" id="s-debat">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a4)">${t('controverse')}</span>
      <h2 class="bloc-title">${T(c.debat.question)}</h2></div>
      <div class="debat">
        <div class="debat-col oui"><div class="debat-t">${T(c.debat.oui.titre)}</div>
          <ul>${T(c.debat.oui.items).map(i=>`<li>${i}</li>`).join('')}</ul></div>
        <div class="debat-col non"><div class="debat-t">${T(c.debat.non.titre)}</div>
          <ul>${T(c.debat.non.items).map(i=>`<li>${i}</li>`).join('')}</ul></div>
      </div>
      ${c.debat.synthese?`<div class="encadre" style="--c:var(--a1);margin-top:14px">
        <div class="encadre-ic">⚖️</div><div><div class="encadre-t">${t('synthese')}</div>
        <div class="encadre-c">${T(c.debat.synthese)}</div></div></div>`:''}
    </section>`);
  }

  if(c.lexique?.length){
    out.push(`<section class="bloc rev" id="s-lexique">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a2)">${t('vocab')}</span>
      <h2 class="bloc-title">${t('lexique')}</h2></div>
      <input class="lex-search" id="lex-search" placeholder="${t('filtrer')}" aria-label="${t('filtrer')}">
      <div class="tbl-wrap"><table class="lex"><thead><tr><th>${t('terme')}</th><th>${t('trad')}</th></tr></thead>
      <tbody id="lex-body">${c.lexique.map(l=>`<tr><td>${l.en}</td><td>${l.fr}</td></tr>`).join('')}</tbody></table></div>
    </section>`);
  }

  if(c.sujets?.length){
    out.push(`<section class="bloc rev" id="s-sujets">
      <div class="bloc-head"><span class="bloc-kicker" style="--k:var(--a4)">${t('entrainement')}</span>
      <h2 class="bloc-title">${t('sujets')}</h2></div>
      ${c.sujets.map((s,i)=>`<div class="sujet"><div class="sujet-n">${String(i+1).padStart(2,'0')}</div>
        <div><div class="sujet-q">${T(s.q)}</div><div class="sujet-h">${T(s.h)}</div></div></div>`).join('')}</section>`);
  }

  if(c.retenir?.length){
    out.push(`<section class="bloc rev" id="s-retenir">
      <div class="bloc-head"><span class="bloc-kicker">${t('memoriser')}</span><h2 class="bloc-title">${t('retenir')}</h2></div>
      <div class="retenir"><ul>${T(c.retenir).map(r=>`<li>${r}</li>`).join('')}</ul></div></section>`);
  }

  $('#cours').innerHTML = out.join('');
}

/* ─── Colonne chronologie ─── */
function rendreRail(){
  if(!COURS.chronologie?.length){ $('#rail')?.remove(); return; }
  $('#rail').innerHTML = `<div class="rail-title">${t('chrono')}</div>${bloc({t:'tl',items:COURS.chronologie})}`;
}

/* ─── Recherche dans le lexique ─── */
function brancherLexique(){
  const ls = $('#lex-search'); if(!ls) return;
  ls.addEventListener('input', ()=>{
    const q = ls.value.toLowerCase().trim();
    $('#lex-body').querySelectorAll('tr').forEach(tr=>{
      tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
}

/* ─── Changement de langue ─── */
function setLang(lang){
  LANG = lang;
  $('#ap-btn-fr').classList.toggle('active', lang==='fr');
  $('#ap-btn-en').classList.toggle('active', lang==='en');
  rendreHero(); rendreCours(); rendreRail();
  document.querySelectorAll('.rev').forEach(el=>el.classList.add('vu'));
  brancherLexique();
}

/* ─── Démarrage ─── */
function demarrer(){
  rendreHero(); rendreCours(); rendreRail(); brancherLexique();

  const maj = ()=>{
    const h = document.body.scrollHeight - innerHeight;
    $('#progress').style.width = (h>0 ? (scrollY/h)*100 : 0) + '%';
  };
  addEventListener('scroll', maj, {passive:true}); maj();

  if(!('IntersectionObserver' in window)){
    document.querySelectorAll('.rev').forEach(el=>el.classList.add('vu'));
    return;
  }
  const io = new IntersectionObserver(es=>es.forEach(x=>{
    if(x.isIntersecting){ x.target.classList.add('vu'); io.unobserve(x.target); }
  }), {threshold:.06});
  document.querySelectorAll('.rev').forEach(el=>io.observe(el));
}

demarrer();
</script>
