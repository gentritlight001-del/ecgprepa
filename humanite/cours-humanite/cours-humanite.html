<!DOCTYPE html>
<html lang="fr">
<head>
<script src="../../auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECG Prépa — Cours Humanité · L'Humanité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: #2a2a35;
    --accent: #c8a96e;
    --accent2: #7c9ec9;
    --accent3: #9ecba0;
    --accent4: #c97c9e;
    --text: #e8e6e0;
    --text-dim: #8a8880;
    --text-faint: #4a4845;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }

  .bg-orb { position: fixed; border-radius: 50%; filter: blur(140px); pointer-events: none; opacity: 0.09; z-index: 0; }
  .orb1 { width: 700px; height: 700px; background: var(--accent); top: -300px; right: -250px; }
  .orb2 { width: 600px; height: 600px; background: var(--accent2); bottom: -250px; left: -250px; }

  /* ─── NAV ─── */
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 48px; border-bottom: 1px solid var(--border);
    background: rgba(13,13,15,0.9); backdrop-filter: blur(16px);
    position: sticky; top: 0; z-index: 100;
  }
  .nav-logo { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; color: var(--accent); letter-spacing: 0.02em; cursor: pointer; }
  .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-dim); flex-wrap: wrap; }
  .breadcrumb span { cursor: pointer; transition: color 0.2s; }
  .breadcrumb span:hover { color: var(--accent); }
  .breadcrumb .sep { color: var(--text-faint); }
  .breadcrumb .current { color: var(--text); cursor: default; }

  /* ─── PAGE HEADER ─── */
  .page-header { padding: 60px 64px 40px; border-bottom: 1px solid var(--border); position: relative; z-index: 1; }
  .page-header::after { content: ''; position: absolute; bottom: -1px; left: 64px; width: 60px; height: 2px; background: var(--accent); }
  .page-eyebrow { font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; font-weight: 500; font-family: 'DM Mono', monospace; }
  .page-title { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 4vw, 3.2rem); font-weight: 900; color: var(--text); }

  /* ─── CHOICE CARDS ─── */
  .choices-container { padding: 60px 64px; flex: 1; position: relative; z-index: 1; }
  .choices-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; max-width: 1000px; }
  .choice-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 32px 28px; cursor: pointer; transition: all 0.25s; position: relative; overflow: hidden; }
  .choice-card:hover { border-color: var(--card-color, var(--accent)); background: var(--surface2); transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.35); }
  .choice-card .card-icon { font-size: 1.8rem; margin-bottom: 14px; display: block; }
  .choice-card .card-title { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 700; margin-bottom: 6px; color: var(--text); }
  .choice-card .card-desc { font-size: 0.8rem; color: var(--text-dim); line-height: 1.6; font-weight: 300; }

  /* ─── ANIMATIONS ─── */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  .fade-up { animation: fadeUp 0.5s ease forwards; opacity: 0; }
  .fade-up:nth-child(1) { animation-delay: 0s; }
  .fade-up:nth-child(2) { animation-delay: 0.08s; }

  @media (max-width: 768px) {
    nav { padding: 14px 20px; }
    .page-header { padding: 40px 24px 30px; }
    .page-header::after { left: 24px; }
    .choices-container { padding: 32px 24px; }
  }
</style>
</head>
<body>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<nav>
  <div class="nav-logo" onclick="window.location.href='../../index.html'">ECG Prépa</div>
  <div class="breadcrumb">
    <span onclick="window.location.href='../../index.html'">Accueil</span>
    <span class="sep">/</span>
    <span onclick="window.location.href='../../humanite.html'">L'Humanité</span>
    <span class="sep">/</span>
    <span class="current">Cours Humanité</span>
  </div>
</nav>

<div class="page-header">
  <div class="page-eyebrow">📖 L'Humanité</div>
  <div class="page-title">Cours Humanité</div>
</div>

<div class="choices-container">
  <div class="choices-grid">
    <div class="choice-card fade-up" style="--card-color:#9ecba0" onclick="window.location.href='Cours/cours.html'">
      <span class="card-icon">📖</span>
      <div class="card-title">Cours</div>
      <div class="card-desc">Les cours sur la notion d'humanité</div>
    </div>
    <div class="choice-card fade-up" style="--card-color:#c8a96e" onclick="window.location.href='Fiches%20auteurs/fiches-auteurs.html'">
      <span class="card-icon">🖋️</span>
      <div class="card-title">Fiches auteurs</div>
      <div class="card-desc">Synthèses des auteurs clés sur l'humanité</div>
    </div>
  </div>
</div>

</body>
</html>
