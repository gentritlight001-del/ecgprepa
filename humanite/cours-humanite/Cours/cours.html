<!DOCTYPE html>
<html lang="fr">
<head>
<script src="../../../auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECG Prépa — Cours · Cours Humanité</title>
<link rel="stylesheet" href="../../../fonts/fonts.css">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: #2a2a35;
    --accent: #c8a96e;
    --accent2: #7c9ec9;
    --accent3: #9ecba0;
    --accent4: #c97c9e;
    --text: #e8e6e0;
    --text-dim: #8a8880;
    --text-faint: #4a4845;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }

  .bg-orb { position: fixed; border-radius: 50%; filter: blur(140px); pointer-events: none; opacity: 0.09; z-index: 0; }
  .orb1 { width: 700px; height: 700px; background: var(--accent); top: -300px; right: -250px; }
  .orb2 { width: 600px; height: 600px; background: var(--accent2); bottom: -250px; left: -250px; }

  /* ─── NAV ─── */
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 48px; border-bottom: 1px solid var(--border);
    background: rgba(13,13,15,0.9); backdrop-filter: blur(16px);
    position: sticky; top: 0; z-index: 100;
  }
  .nav-logo { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; color: var(--accent); letter-spacing: 0.02em; cursor: pointer; }
  .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-dim); flex-wrap: wrap; }
  .breadcrumb span { cursor: pointer; transition: color 0.2s; }
  .breadcrumb span:hover { color: var(--accent); }
  .breadcrumb .sep { color: var(--text-faint); }
  .breadcrumb .current { color: var(--text); cursor: default; }

  /* ─── PAGE HEADER ─── */
  .page-header { padding: 60px 64px 40px; border-bottom: 1px solid var(--border); position: relative; z-index: 1; }
  .page-header::after { content: ''; position: absolute; bottom: -1px; left: 64px; width: 60px; height: 2px; background: var(--accent); }
  .page-eyebrow { font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; font-weight: 500; font-family: 'DM Mono', monospace; }
  .page-title { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 4vw, 3.2rem); font-weight: 900; color: var(--text); }

  /* ─── PAGE BODY (list + sidebar) ─── */
  .page-body { display: flex; align-items: stretch; gap: 40px; padding: 0 64px 48px; position: relative; z-index: 1; }
  .page-body .chapters-container { flex: 1; padding: 48px 32px 48px 0; border-right: 1px solid var(--border); max-width: none; }

  .sidebar { width: 300px; flex-shrink: 0; align-self: flex-start; position: sticky; top: 90px; margin-top: 48px; display: flex; flex-direction: column; gap: 20px; }
  .motif-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 20px 16px; }
  .motif-card svg { width: 100%; height: auto; display: block; }
  .motif-caption { text-align: center; margin-top: 10px; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim); font-family: 'DM Mono', monospace; }

  /* ─── CHAPTER LIST ─── */
  .chapters-container { padding: 48px 64px; max-width: 900px; position: relative; z-index: 1; }
  .chapter-item { display: flex; align-items: center; gap: 20px; padding: 20px 24px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; background: var(--surface); text-decoration: none; }
  .chapter-item:hover { border-color: var(--accent); background: var(--surface2); transform: translateX(4px); }
  .chapter-num { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 900; color: var(--text-faint); min-width: 48px; line-height: 1; }
  .chapter-info { flex: 1; }
  .chapter-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--text-dim); margin-bottom: 4px; font-family: 'DM Mono', monospace; }
  .chapter-name { font-size: 1.05rem; font-weight: 500; color: var(--text); font-family: 'Playfair Display', serif; }
  .chapter-arrow { color: var(--text-faint); font-size: 1.1rem; transition: all 0.2s; }
  .chapter-item:hover .chapter-arrow { color: var(--accent); transform: translateX(4px); }

  .chapter-item.locked { cursor: not-allowed; opacity: 0.5; }
  .chapter-item.locked:hover { border-color: var(--border); background: var(--surface); transform: none; }
  .chapter-item.locked .chapter-num,
  .chapter-item.locked .chapter-name { color: var(--text-faint); }
  .chapter-item.locked .chapter-label { color: var(--text-faint); }
  .chapter-item.locked .chapter-arrow { font-size: 0.95rem; }
  .chapter-item.locked:hover .chapter-arrow { color: var(--text-faint); transform: none; }

  @media (max-width: 768px) {
    nav { padding: 14px 20px; }
    .page-header { padding: 40px 24px 30px; }
    .page-header::after { left: 24px; }
    .chapters-container { padding: 32px 24px; }
    .page-body { padding: 0 24px 32px; flex-direction: column; }
    .page-body .chapters-container { padding: 32px 0 0; border-right: none; }
    .sidebar { display: none; }
  }
</style>
</head>
<body>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<nav>
  <div class="nav-logo" onclick="window.location.href='../../../index.html'">ECG Prépa</div>
  <div class="breadcrumb">
    <span onclick="window.location.href='../../../index.html'">Accueil</span>
    <span class="sep">/</span>
    <span onclick="window.location.href='../../../humanite.html'">L'Humanité</span>
    <span class="sep">/</span>
    <span onclick="window.location.href='../cours-humanite.html'">Cours Humanité</span>
    <span class="sep">/</span>
    <span class="current">Cours</span>
  </div>
</nav>

<div class="page-header">
  <div class="page-eyebrow">📖 Cours Humanité</div>
  <div class="page-title">Cours disponibles</div>
</div>

<div class="page-body">
  <div class="chapters-container">
    <div class="chapter-item locked" aria-disabled="true">
      <div class="chapter-num">1</div>
      <div class="chapter-info">
        <div class="chapter-label">Cours 1</div>
        <div class="chapter-name">Qu'est-ce que l'humanité ?</div>
      </div>
      <div class="chapter-arrow">🔒</div>
    </div>
  </div>

  <aside class="sidebar">
    <div class="motif-card">
      <svg viewBox="0 0 260 320" xmlns="http://www.w3.org/2000/svg">
        <!-- frame circle -->
        <circle cx="130" cy="140" r="110" fill="none" stroke="var(--accent)" stroke-width="1" opacity="0.8" />
        <circle cx="130" cy="140" r="92" fill="none" stroke="var(--accent2)" stroke-width="0.6" opacity="0.4" />

        <!-- ground line -->
        <line x1="55" y1="232" x2="205" y2="232" stroke="var(--text-faint)" stroke-width="0.8" opacity="0.6" />

        <!-- three simple human silhouettes -->
        <g opacity="0.9">
          <!-- left figure -->
          <circle cx="88" cy="150" r="14" fill="var(--accent2)" opacity="0.85" />
          <path d="M66 232 C 64 196, 72 178, 88 172 C 104 178, 112 196, 110 232 Z" fill="var(--accent2)" opacity="0.85" />

          <!-- centre figure, taller -->
          <circle cx="130" cy="128" r="16" fill="var(--accent)" opacity="0.9" />
          <path d="M104 232 C 101 186, 111 164, 130 156 C 149 164, 159 186, 156 232 Z" fill="var(--accent)" opacity="0.9" />

          <!-- right figure -->
          <circle cx="172" cy="150" r="14" fill="var(--accent4)" opacity="0.85" />
          <path d="M150 232 C 148 196, 156 178, 172 172 C 188 178, 196 196, 194 232 Z" fill="var(--accent4)" opacity="0.85" />
        </g>

        <!-- small laurel sprig beneath -->
        <g fill="none" stroke="var(--accent3)" stroke-width="1" opacity="0.6">
          <path d="M118 268 C 112 260, 113 251, 121 245" />
          <path d="M116 262 C 110 260, 106 256, 105 250" />
          <path d="M142 268 C 148 260, 147 251, 139 245" />
          <path d="M144 262 C 150 260, 154 256, 155 250" />
        </g>
      </svg>
      <div class="motif-caption">Humanité</div>
    </div>
  </aside>
</div>

</body>
</html>
