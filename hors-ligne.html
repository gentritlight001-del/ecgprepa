<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hors ligne — ECG Prépa</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0d0d0f">
<link rel="stylesheet" href="fonts/fonts.css">
<script src="auth.js"></script>
<style>
  :root{
    --bg:#0d0d0f; --border:#2a2a35;
    --accent:#c8a96e; --accent2:#7c9ec9;
    --text:#e8e6e0; --dim:#a9a79f; --faint:#8a8880;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:'DM Sans',system-ui,sans-serif;line-height:1.6;
    display:flex;align-items:center;justify-content:center;
    padding:32px 24px;overflow:hidden;
  }
  .orb{position:fixed;border-radius:50%;filter:blur(150px);pointer-events:none;opacity:.09;z-index:0}
  .orb1{width:680px;height:680px;background:var(--accent);top:-320px;right:-240px}
  .orb2{width:560px;height:560px;background:var(--accent2);bottom:-260px;left:-220px}

  main{position:relative;z-index:1;max-width:620px;width:100%;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:20px}
  .code{font-family:'DM Mono',monospace;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
  .gros{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(5rem,16vw,7.5rem);line-height:.9;color:var(--border)}
  h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,2.6rem);font-weight:900;line-height:1.1}
  p{font-size:1.05rem;line-height:1.65;font-weight:300;color:var(--dim);max-width:460px}
  .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
  .btn{display:inline-block;text-decoration:none;font-size:1rem;font-weight:500;padding:15px 28px;min-height:44px;border-radius:999px;font-family:inherit;cursor:pointer;
    transition:filter .2s,transform .2s;border:1px solid var(--accent)}
  .btn.primary{background:var(--accent);color:#0d0d0f}
  .btn.primary:hover{filter:brightness(1.08);transform:translateY(-2px)}
  .btn.ghost{background:none;color:var(--text);border-color:#3a3a46}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
  .etat{font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .etat.en-ligne{color:#9ecba0}
  .icone{width:72px;height:72px}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="orb orb1"></div><div class="orb orb2"></div>

<main>
  <div class="code">Hors ligne</div>
  <svg class="icone" viewBox="0 0 72 72" fill="none" stroke="#4a4845" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M10 28c14-12 38-12 52 0M20 38c9-7 23-7 32 0M30 48c4-3 8-3 12 0"/><circle cx="36" cy="58" r="2.5" fill="#4a4845"/><path d="M12 12l48 48" stroke="#c8a96e"/></svg>
  <h1>Pas de connexion pour l'instant</h1>
  <p>Cette page n'a pas encore été consultée sur cet appareil, elle ne peut donc pas s'afficher sans
    réseau. Les fiches déjà ouvertes récemment, elles, restent accessibles.</p>
  <div class="actions">
    <button type="button" class="btn primary" id="reessayer">Réessayer</button>
    <a class="btn ghost" href="accueil.html">Retour à l'accueil</a>
  </div>
  <div class="etat" id="etatReseau" role="status">Connexion : vérification…</div>
</main>

<script>
(function () {
  var etat = document.getElementById('etatReseau');

  function majEtat() {
    if (navigator.onLine) {
      etat.textContent = 'Connexion : revenue — tu peux réessayer';
      etat.classList.add('en-ligne');
    } else {
      etat.textContent = 'Connexion : toujours absente';
      etat.classList.remove('en-ligne');
    }
  }
  majEtat();
  window.addEventListener('online', majEtat);
  window.addEventListener('offline', majEtat);

  document.getElementById('reessayer').addEventListener('click', function () {
    location.reload();
  });
})();
</script>
</body>
</html>
