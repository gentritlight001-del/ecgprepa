<!DOCTYPE html>
<html lang="fr">
<head>
<script src="auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>ECG Prépa — Espace rédaction</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --bg: #0d0d0f; --surface: #16161a; --surface2: #1e1e24; --border: #2a2a35;
    --accent: #c8a96e; --accent2: #7c9ec9; --accent3: #9ecba0; --accent4: #c97c9e;
    --danger: #e08a8a; --text: #e8e6e0; --text-dim: #a9a79f; --text-faint: #8a8880;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', system-ui, sans-serif; min-height: 100vh; overflow-x: hidden; }
  .bg-orb { position: fixed; border-radius: 50%; filter: blur(140px); pointer-events: none; opacity: 0.09; z-index: 0; }
  .orb1 { width: 700px; height: 700px; background: var(--accent); top: -300px; right: -250px; }
  .orb2 { width: 600px; height: 600px; background: var(--accent2); bottom: -250px; left: -250px; }

  nav { display: flex; align-items: center; justify-content: space-between; padding: 18px 48px; border-bottom: 1px solid var(--border);
    background: rgba(13,13,15,0.9); backdrop-filter: blur(16px); position: sticky; top: 0; z-index: 100; }
  .nav-logo { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; color: var(--accent); cursor: pointer; }
  .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-dim); }
  .breadcrumb a { color: var(--text-dim); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .current { color: var(--text); }
  .nav-right { display: flex; align-items: center; }

  .page-header { padding: 56px 48px 32px; position: relative; z-index: 1; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .page-eyebrow { font-size: .75rem; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; font-family: 'DM Mono', monospace; }
  .page-title { font-family: 'Playfair Display', serif; font-size: clamp(2.2rem, 4.5vw, 3.5rem); font-weight: 900; line-height: 1.05; }
  .page-subtitle { font-size: 1rem; color: var(--text-dim); margin-top: 10px; font-weight: 300; max-width: 640px; line-height: 1.6; }
  .lien-admin { color: var(--accent2); font-size: .9rem; text-decoration: none; border: 1px solid rgba(124,158,201,.35); padding: 10px 18px; border-radius: 999px; }
  .lien-admin:hover { background: rgba(124,158,201,.1); }

  main { position: relative; z-index: 1; padding: 0 48px 80px; }
  .onglets { display: flex; gap: 8px; margin-bottom: 26px; flex-wrap: wrap; }
  .onglet { font-family: inherit; border: 0; border-radius: 999px; padding: 10px 18px; min-height: 40px; font-size: .9rem; cursor: pointer; background: var(--surface2); color: var(--text-dim); }
  .onglet:hover { color: var(--text); }
  .onglet.on { background: var(--accent); color: #0d0d0f; }
  .onglet em { font-style: normal; font-family: 'DM Mono', monospace; font-size: .72rem; margin-left: 6px; opacity: .75; }

  .filtres { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
  .chip { font-family: inherit; font-size: .8rem; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; }
  .chip.on { border-color: var(--accent); color: var(--text); background: var(--surface2); }

  .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  .sujet { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; transition: border-color .2s, transform .2s; }
  .sujet:hover { border-color: #3a3a46; transform: translateY(-2px); }
  .sujet .vignette { aspect-ratio: 16/8; background: #111 center/cover no-repeat; }
  .sujet .vignette.cg { background: linear-gradient(135deg, #e6ddd0, #cdbba3); display: flex; align-items: center; justify-content: center; font-size: 2.4rem; }
  .sujet .corps { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .sujet .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .74rem; color: var(--text-faint); }
  .sujet h3 { font-family: 'Playfair Display', serif; font-size: 1.15rem; line-height: 1.3; }
  .sujet .consignes { font-size: .84rem; color: var(--text-dim); line-height: 1.55; white-space: pre-wrap; max-height: 7.8em; overflow: hidden; }
  .sujet .remarque { font-size: .82rem; color: #f0b0b0; background: rgba(224,138,138,.08); border: 1px solid rgba(224,138,138,.25); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; }
  .sujet .actions { display: flex; gap: 8px; margin-top: auto; padding-top: 6px; flex-wrap: wrap; }
  .pastille { display: inline-block; font-size: .72rem; padding: 3px 10px; border-radius: 999px; border: 1px solid currentColor; }
  .btn { font-family: inherit; font-size: .85rem; border-radius: 999px; padding: 9px 18px; min-height: 38px; cursor: pointer; border: 1px solid var(--border); background: var(--surface2); color: var(--text); text-decoration: none; display: inline-flex; align-items: center; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primaire { background: var(--accent); border-color: var(--accent); color: #0d0d0f; font-weight: 500; }
  .btn.primaire:hover { filter: brightness(1.08); color: #0d0d0f; }
  .btn.discret { background: transparent; color: var(--text-faint); }
  .btn.discret:hover { color: var(--danger); border-color: var(--danger); }

  .vide { text-align: center; padding: 70px 20px; color: var(--text-faint); border: 1px dashed var(--border); border-radius: 16px; }
  .vide b { display: block; font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--text-dim); margin-bottom: 6px; }
  .message { margin-bottom: 20px; padding: 12px 16px; border-radius: 12px; font-size: .9rem; display: none; }
  .message.ok { display: block; background: rgba(158,203,160,.1); border: 1px solid rgba(158,203,160,.35); color: var(--accent3); }
  .message.err { display: block; background: rgba(224,138,138,.1); border: 1px solid rgba(224,138,138,.35); color: var(--danger); }

  @media (max-width: 900px) {
    nav { padding: 14px 20px; } .breadcrumb { display: none; }
    .page-header { padding: 36px 20px 24px; } main { padding: 0 16px 60px; }
    .grille { grid-template-columns: 1fr; }
  }
</style>
<link rel="stylesheet" href="admin-refonte.css">
</head>
<body>
<div class="bg-orb orb1"></div><div class="bg-orb orb2"></div>

<nav>
  <div class="nav-logo" onclick="location.href='index.html'">ECG Prépa</div>
  <div class="breadcrumb"><a href="index.html">Accueil</a><span>/</span><span class="current">Espace rédaction</span></div>
  <div class="nav-right"></div>
</nav>

<div class="page-header">
  <div>
    <div class="page-eyebrow">✍️ Rédaction</div>
    <div class="page-title">Espace rédaction</div>
    <div class="page-subtitle">Choisis un sujet proposé par l'administrateur, rédige-le dans l'éditeur, puis soumets-le pour relecture.</div>
  </div>
  <a class="lien-admin" id="lien-admin" href="admin-redaction.html" style="display:none">Gérer les sujets →</a>
</div>

<main>
  <div class="message" id="message"></div>
  <div class="onglets" id="onglets">
    <button class="onglet on" data-o="dispo">Sujets disponibles<em id="n-dispo">0</em></button>
    <button class="onglet" data-o="miens">Mes articles<em id="n-miens">0</em></button>
  </div>
  <div class="filtres" id="filtres"></div>
  <div class="grille" id="grille"><div class="vide">Chargement…</div></div>
</main>

<script src="redaction/redaction.js"></script>
<script>
(function () {
  'use strict';
  var R = window.Redac, A = window.ECGAuth;
  var $ = function (s) { return document.querySelector(s); };
  var client, moi, sujets = [], onglet = 'dispo', filtre = '';

  if (new URLSearchParams(location.search).get('soumis')) message('Article soumis : l\'administrateur va le relire. Merci !', false);

  A.client().then(function (c) {
    client = c; moi = A.current() || {};
    if (moi.role === 'admin') $('#lien-admin').style.display = '';
    charger();
  });

  function message(t, err) { var m = $('#message'); m.textContent = t; m.className = 'message ' + (err ? 'err' : 'ok'); }

  function charger() {
    client.from('redaction_sujets')
      .select('id,type,edition,titre,consignes,image_url,statut,redacteur,redacteur_nom,commentaire,cree_le,pris_le,soumis_le,maj_le')
      .order('cree_le', { ascending: false })
      .then(function (r) {
        if (r.error) throw r.error;
        sujets = r.data || [];
        rendre();
      }).catch(function (e) { $('#grille').innerHTML = '<div class="vide"><b>Erreur</b>' + R.esc(R.erreur(e)) + '</div>'; });
  }

  function dispo() { return sujets.filter(function (s) { return s.statut === 'disponible'; }); }
  function miens() { return sujets.filter(function (s) { return s.redacteur === moi.id; }); }

  function rendre() {
    $('#n-dispo').textContent = dispo().length;
    $('#n-miens').textContent = miens().length;
    var liste = onglet === 'dispo' ? dispo() : miens();

    /* Filtres : type pour les sujets libres, statut pour les miens. */
    var choix = onglet === 'dispo'
      ? [['', 'Tous'], ['article', '📰 Actualités'], ['cg', '🧠 Culture générale']]
      : [['', 'Tous'], ['en_cours', 'En cours'], ['a_revoir', 'À revoir'], ['soumis', 'Soumis'], ['valide', 'Validés'], ['publie', 'Publiés']];
    $('#filtres').innerHTML = choix.map(function (c) {
      return '<button class="chip' + (filtre === c[0] ? ' on' : '') + '" data-f="' + c[0] + '">' + c[1] + '</button>';
    }).join('');
    if (filtre) liste = liste.filter(function (s) { return onglet === 'dispo' ? s.type === filtre : s.statut === filtre; });
    if (onglet === 'miens') {
      var ordre = { a_revoir: 0, en_cours: 1, soumis: 2, valide: 3, publie: 4 };
      liste.sort(function (a, b) { return (ordre[a.statut] || 0) - (ordre[b.statut] || 0); });
    }

    if (!liste.length) {
      $('#grille').innerHTML = onglet === 'dispo'
        ? '<div class="vide"><b>Aucun sujet disponible</b>Les nouveaux sujets proposés par l\'administrateur apparaîtront ici.</div>'
        : '<div class="vide"><b>Aucun article pour l\'instant</b>Prends un sujet dans l\'onglet « Sujets disponibles ».</div>';
      return;
    }
    $('#grille').innerHTML = liste.map(carte).join('');
  }

  function carte(s) {
    var st = R.STATUTS[s.statut] || {};
    var vignette = s.type === 'cg'
      ? '<div class="vignette cg">🧠</div>'
      : '<div class="vignette" style="background-image:url(\'' + R.esc(s.image_url || '') + '\')"></div>';
    var actions = '';
    if (s.statut === 'disponible') actions = '<button class="btn primaire" data-a="prendre" data-id="' + s.id + '">Je prends ce sujet</button>';
    else if (s.redacteur === moi.id) {
      var ecrire = s.statut === 'en_cours' || s.statut === 'a_revoir';
      actions = '<a class="btn' + (ecrire ? ' primaire' : '') + '" href="redaction-editeur.html?id=' + s.id + '">' + (ecrire ? 'Continuer la rédaction' : 'Voir l\'article') + '</a>';
      if (ecrire) actions += '<button class="btn discret" data-a="rendre" data-id="' + s.id + '">Rendre le sujet</button>';
    }
    return '<div class="sujet">' + vignette +
      '<div class="corps">' +
        '<div class="meta"><span>' + R.esc(R.libelleType(s)) + '</span>' +
          (s.statut !== 'disponible' ? '<span class="pastille" style="color:' + st.c + '">' + st.l + '</span>' : '<span>proposé le ' + R.dateCourte(s.cree_le) + '</span>') + '</div>' +
        '<h3>' + R.esc(s.titre) + '</h3>' +
        (s.consignes ? '<div class="consignes">' + R.esc(s.consignes) + '</div>' : '') +
        (s.statut === 'a_revoir' && s.commentaire ? '<div class="remarque"><b>Remarques :</b> ' + R.esc(s.commentaire) + '</div>' : '') +
        '<div class="actions">' + actions + '</div>' +
      '</div></div>';
  }

  $('#onglets').addEventListener('click', function (e) {
    var b = e.target.closest('[data-o]'); if (!b) return;
    onglet = b.dataset.o; filtre = '';
    document.querySelectorAll('.onglet').forEach(function (x) { x.classList.toggle('on', x === b); });
    rendre();
  });
  $('#filtres').addEventListener('click', function (e) {
    var b = e.target.closest('[data-f]'); if (!b) return;
    filtre = b.dataset.f; rendre();
  });

  $('#grille').addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]'); if (!b) return;
    var id = b.dataset.id;
    if (b.dataset.a === 'prendre') {
      b.disabled = true; b.textContent = 'Un instant…';
      client.rpc('redaction_prendre', { p_id: id }).then(function (r) {
        if (r.error) throw r.error;
        if (!r.data || !r.data.ok) {
          message(r.data && r.data.raison === 'deja_pris' ? 'Trop tard : un autre rédacteur vient de prendre ce sujet.' : 'Action refusée.', true);
          return charger();
        }
        location.href = 'redaction-editeur.html?id=' + id;
      }).catch(function (e) { message(R.erreur(e), true); charger(); });
    }
    if (b.dataset.a === 'rendre') {
      if (!confirm('Rendre ce sujet ?\n\nIl redeviendra disponible pour les autres rédacteurs et ton brouillon sera effacé.')) return;
      client.rpc('redaction_abandonner', { p_id: id }).then(function (r) {
        if (r.error) throw r.error;
        message('Sujet rendu : il est de nouveau disponible.', false);
        charger();
      }).catch(function (e) { message(R.erreur(e), true); });
    }
  });
})();
</script>
</body>
</html>
