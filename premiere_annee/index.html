<!DOCTYPE html>
<html lang="fr">
<head>
<script src="../auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECG Prépa — 1ère Année</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: #2a2a35;
    --accent: #c8a96e;
    --accent2: #7c9ec9;
    --accent3: #9ecba0;
    --accent4: #c97c9e;
    --text: #e8e6e0;
    --text-dim: #8a8880;
    --text-faint: #4a4845;
    /* HGG light theme vars */
    --cream: #F5F0E8;
    --dark: #1A1208;
    --brown: #3D2B1F;
    --gold: #C9A84C;
    --rust: #8B3A2A;
    --muted: #7A6A5A;
    --light-brown: #E8DDD0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }

  /* ─── PAGES ─── */
  .page { display: none; min-height: 100vh; flex-direction: column; }
  .page.active { display: flex; }

  /* ─── BACKGROUND — subtle gradient blobs, no grid ─── */
  .bg-orb { position: fixed; border-radius: 50%; filter: blur(140px); pointer-events: none; opacity: 0.09; z-index: 0; }
  .orb1 { width: 700px; height: 700px; background: var(--accent); top: -300px; right: -250px; }
  .orb2 { width: 600px; height: 600px; background: var(--accent2); bottom: -250px; left: -250px; }
  .orb3 { width: 400px; height: 400px; background: var(--accent4); top: 40%; left: 30%; opacity: 0.05; }

  /* ─── NAV ─── */
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 48px; border-bottom: 1px solid var(--border);
    background: rgba(13,13,15,0.9); backdrop-filter: blur(16px);
    position: sticky; top: 0; z-index: 100;
  }
  .nav-logo { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; color: var(--accent); cursor: pointer; letter-spacing: 0.02em; }
  .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-dim); flex-wrap: wrap; }
  .breadcrumb span { cursor: pointer; transition: color 0.2s; }
  .breadcrumb span:hover { color: var(--accent); }
  .breadcrumb .sep { color: var(--text-faint); }
  .breadcrumb .current { color: var(--text); cursor: default; }

  /* ─── ACCUEIL ─── */
  #page-accueil { justify-content: center; align-items: center; }
  .hero { text-align: center; padding: 80px 48px; position: relative; z-index: 1; }
  .hero-eyebrow { font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 24px; font-family: 'DM Mono', monospace; }
  .hero h1 { font-family: 'Playfair Display', serif; font-size: clamp(3rem, 7vw, 6rem); font-weight: 900; line-height: 1.0; margin-bottom: 20px; color: var(--text); }
  .hero-sub { font-size: 1rem; color: var(--text-dim); margin-bottom: 72px; font-weight: 300; letter-spacing: 0.05em; }

  .home-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; max-width: 860px; width: 100%; }
  .home-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 40px 36px; cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden; text-align: left; }
  .home-card::before { content: ''; position: absolute; inset: 0; background: var(--card-color, var(--accent)); opacity: 0; transition: opacity 0.3s; }
  .home-card:hover::before { opacity: 0.06; }
  .home-card:hover { border-color: var(--card-color, var(--accent)); transform: translateY(-4px); box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
  .card-icon { font-size: 2.4rem; margin-bottom: 20px; display: block; }
  .card-number { font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--card-color, var(--accent)); margin-bottom: 10px; font-weight: 500; font-family: 'DM Mono', monospace; }
  .card-title { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 700; margin-bottom: 10px; color: var(--text); }
  .card-desc { font-size: 0.85rem; color: var(--text-dim); line-height: 1.6; font-weight: 300; }
  .card-arrow { position: absolute; bottom: 24px; right: 28px; font-size: 1.2rem; color: var(--card-color, var(--accent)); opacity: 0; transform: translateX(-8px); transition: all 0.3s; }
  .home-card:hover .card-arrow { opacity: 1; transform: translateX(0); }

  /* ─── PAGE HEADER ─── */
  .page-header { padding: 60px 64px 40px; border-bottom: 1px solid var(--border); position: relative; z-index: 1; }
  .page-header::after { content: ''; position: absolute; bottom: -1px; left: 64px; width: 60px; height: 2px; background: var(--accent); }
  .page-eyebrow { font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; font-weight: 500; font-family: 'DM Mono', monospace; }
  .page-title { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 4vw, 3.2rem); font-weight: 900; color: var(--text); }

  /* ─── CHOICES ─── */
  .choices-container { padding: 60px 64px; flex: 1; position: relative; z-index: 1; }
  .choices-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; max-width: 1000px; }
  .choice-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 32px 28px; cursor: pointer; transition: all 0.25s; position: relative; overflow: hidden; }
  .choice-card:hover { border-color: var(--card-color, var(--accent)); background: var(--surface2); transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.35); }
  .choice-card .card-icon { font-size: 1.8rem; margin-bottom: 14px; }
  .choice-card .card-title { font-size: 1.15rem; margin-bottom: 6px; }
  .choice-card .card-desc { font-size: 0.8rem; }
  .choice-card.disabled { opacity: 0.45; cursor: default; pointer-events: none; }

  /* ─── CHAPTER LIST ─── */
  .chapters-container { padding: 48px 64px; flex: 1; position: relative; z-index: 1; }
  .chapter-item { display: flex; align-items: center; gap: 20px; padding: 20px 24px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; background: var(--surface); }
  .chapter-item:hover { border-color: var(--accent); background: var(--surface2); transform: translateX(4px); }
  .chapter-num { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 900; color: var(--text-faint); min-width: 48px; line-height: 1; }
  .chapter-info { flex: 1; }
  .chapter-info .chapter-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--text-dim); margin-bottom: 4px; font-family: 'DM Mono', monospace; }
  .chapter-info .chapter-name { font-size: 1rem; font-weight: 500; color: var(--text); }
  .chapter-arrow { color: var(--text-faint); font-size: 1.1rem; transition: all 0.2s; }
  .chapter-item:hover .chapter-arrow { color: var(--accent); transform: translateX(4px); }

  /* ─── HGG COURSE VIEWER (light theme matching uploaded HTML) ─── */
  #page-hgg-course { background: var(--cream); color: var(--dark); }
  #page-hgg-course nav { background: var(--dark); border-bottom: 1px solid rgba(201,168,76,0.2); }
  #page-hgg-course .nav-logo { color: var(--gold); }
  #page-hgg-course .breadcrumb { color: rgba(245,240,232,0.5); }
  #page-hgg-course .breadcrumb span:hover { color: var(--gold); }
  #page-hgg-course .breadcrumb .current { color: var(--cream); }
  #page-hgg-course .breadcrumb .sep { color: rgba(245,240,232,0.25); }

  .hgg-chapter-header {
    padding: 6rem 2rem 4rem; text-align: center; position: relative;
  }
  .hgg-chapter-header.ch1 { background: #3D1F2B; }
  .hgg-chapter-header.ch2 { background: #3D2B1F; }
  .hgg-chapter-header.ch3 { background: #1F3D2B; }
  .hgg-chapter-header.ch4 { background: #2A3D5F; }
  .hgg-chapter-header.ch5 { background: #2D1F3D; }
  .hgg-chapter-header.ch6 { background: #3D2200; }
  .hgg-chapter-header.ch7 { background: #1F2D3D; }
  .hgg-chapter-header.ch8 { background: #1A2A1A; }
  .hgg-chapter-header.ch9 { background: #1F2A3D; }
  .hgg-chapter-header.ch10 { background: #2A1F0A; }
  .hgg-chapter-header.ch11 { background: #0A2A2A; }
  .hgg-chapter-header.ch12 { background: #1A0A2A; }
  .hgg-chapter-header h1 { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 5vw, 4.5rem); color: var(--cream); font-weight: 900; max-width: 900px; margin: 0 auto 1rem; line-height: 1.1; }
  .hgg-chapter-header p { color: rgba(245,240,232,0.5); font-family: 'DM Mono', monospace; font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; }
  .hgg-chapter-header .chap-label { font-family: 'DM Mono', monospace; font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); margin-bottom: 1.5rem; }

  .hgg-toc { background: var(--light-brown); padding: 3rem 2rem; border-bottom: 1px solid rgba(0,0,0,0.1); }
  .hgg-toc-inner { max-width: 900px; margin: 0 auto; }
  .hgg-toc-title { font-family: 'DM Mono', monospace; font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); margin-bottom: 1.5rem; }
  .hgg-toc-list { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0.5rem; }
  .hgg-toc-list a { display: flex; align-items: flex-start; gap: 1rem; padding: 0.75rem 1rem; text-decoration: none; color: var(--brown); font-size: 0.875rem; border: 1px solid transparent; transition: all 0.2s; }
  .hgg-toc-list a:hover { border-color: var(--gold); background: white; color: var(--dark); }
  .toc-num { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--gold); flex-shrink: 0; margin-top: 0.1rem; }

  .hgg-content { max-width: 860px; margin: 0 auto; padding: 5rem 2rem 8rem; font-family: 'DM Sans', sans-serif; font-weight: 300; }
  .hgg-content p { margin-bottom: 1.2rem; font-size: 1rem; color: #2D2016; line-height: 1.7; }
  .hgg-content strong { color: var(--dark); font-weight: 500; }

  .hgg-part { margin-bottom: 5rem; }
  .hgg-part-header { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 3rem; padding-bottom: 1.5rem; border-bottom: 2px solid var(--gold); }
  .hgg-part-num { font-family: 'Playfair Display', serif; font-size: 4rem; font-weight: 900; color: var(--light-brown); line-height: 1; flex-shrink: 0; }
  .hgg-part-title { font-family: 'Playfair Display', serif; font-size: clamp(1.3rem, 3vw, 2rem); font-weight: 700; color: var(--dark); line-height: 1.2; }

  .hgg-section { margin-bottom: 4rem; }
  .hgg-section-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; color: var(--brown); margin-bottom: 2rem; padding-left: 1.5rem; border-left: 3px solid var(--gold); scroll-margin-top: 2rem; }
  .hgg-subsection-title { font-family: 'DM Mono', monospace; font-size: 0.75rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--rust); margin: 2.5rem 0 1rem; }

  .hgg-highlight { background: var(--light-brown); border-left: 4px solid var(--gold); padding: 1.5rem 2rem; margin: 2rem 0; font-style: italic; color: var(--brown); }
  .hgg-key-fact { display: flex; gap: 1rem; align-items: flex-start; margin-bottom: 0.75rem; padding: 1rem 1.25rem; background: white; border: 1px solid var(--light-brown); }
  .hgg-key-bullet { width: 6px; height: 6px; background: var(--gold); border-radius: 50%; flex-shrink: 0; margin-top: 0.55rem; }

  .hgg-concept { background: var(--dark); color: var(--cream); padding: 2rem; margin: 2.5rem 0; position: relative; }
  .hgg-concept::before { content: '→'; position: absolute; top: 1.5rem; right: 1.5rem; color: var(--gold); font-size: 1.5rem; }
  .hgg-concept .concept-label { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.75rem; }
  .hgg-concept p { color: rgba(245,240,232,0.8); font-size: 0.95rem; }
  .hgg-concept strong { color: var(--gold); }

  .hgg-author { border: 1px solid var(--light-brown); padding: 1.5rem 2rem; margin: 2rem 0; background: white; }
  .hgg-author .author-name { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; color: var(--brown); margin-bottom: 0.5rem; }

  .hgg-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1px; background: var(--light-brown); margin: 2rem 0; border: 1px solid var(--light-brown); }
  .hgg-stat-cell { background: white; padding: 1.5rem; text-align: center; }
  .hgg-stat-num { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 900; color: var(--rust); display: block; }
  .hgg-stat-label { font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; }

  .hgg-timeline { margin: 2rem 0; position: relative; padding-left: 2rem; }
  .hgg-timeline::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--light-brown); }
  .hgg-timeline-item { position: relative; padding: 1rem 0 1rem 1.5rem; border-bottom: 1px solid var(--light-brown); }
  .hgg-timeline-item:last-child { border-bottom: none; }
  .hgg-timeline-item::before { content: ''; position: absolute; left: -1.55rem; top: 1.4rem; width: 10px; height: 10px; background: var(--gold); border-radius: 50%; }
  .hgg-timeline-date { font-family: 'DM Mono', monospace; font-size: 0.75rem; color: var(--gold); margin-bottom: 0.25rem; }

  /* ─── PHILO COURSE VIEWER (dark) ─── */
  .course-body { display: flex; flex: 1; overflow: hidden; }
  .course-sidebar { width: 280px; min-width: 280px; border-right: 1px solid var(--border); padding: 32px 24px; overflow-y: auto; background: var(--surface); }
  .sidebar-title { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--text-faint); margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); font-family: 'DM Mono', monospace; }
  .sidebar-item { padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 0.82rem; color: var(--text-dim); transition: all 0.2s; margin-bottom: 4px; line-height: 1.4; }
  .sidebar-item:hover { background: var(--surface2); color: var(--text); }
  .sidebar-item.active { background: var(--surface2); color: var(--accent); border-left: 2px solid var(--accent); }
  .course-content { flex: 1; overflow-y: auto; padding: 56px 72px; max-width: 900px; }
  .course-content h1 { font-family: 'Playfair Display', serif; font-size: 2.4rem; font-weight: 900; margin-bottom: 8px; color: var(--text); line-height: 1.2; }
  .course-tag { display: inline-block; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 14px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); margin-bottom: 40px; font-family: 'DM Mono', monospace; }
  .course-section { margin-bottom: 48px; }
  .course-section h2 { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; color: var(--accent); margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .course-section h3 { font-size: 0.8rem; font-weight: 500; color: var(--accent2); margin: 24px 0 12px; text-transform: uppercase; letter-spacing: 0.12em; font-family: 'DM Mono', monospace; }
  .course-section p { color: var(--text-dim); line-height: 1.8; margin-bottom: 16px; font-size: 0.95rem; font-weight: 300; }
  .def-block { background: var(--surface2); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; padding: 20px 24px; margin: 20px 0; }
  .def-block strong { color: var(--accent); }
  .def-block p { margin: 6px 0 0; color: var(--text-dim); font-size: 0.9rem; }
  .highlight-box { background: rgba(200, 169, 110, 0.08); border: 1px solid rgba(200, 169, 110, 0.25); border-radius: 10px; padding: 20px 24px; margin: 20px 0; font-style: italic; color: var(--text-dim); font-size: 0.9rem; line-height: 1.7; }
  .highlight-box cite { display: block; margin-top: 10px; font-style: normal; font-size: 0.78rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.1em; font-family: 'DM Mono', monospace; }
  .info-box { background: rgba(124, 158, 201, 0.08); border: 1px solid rgba(124, 158, 201, 0.25); border-radius: 10px; padding: 20px 24px; margin: 20px 0; text-align: center; font-size: 0.9rem; color: var(--text-dim); line-height: 1.6; font-style: italic; }
  .list-styled { list-style: none; margin: 12px 0 20px; }
  .list-styled li { position: relative; padding-left: 20px; margin-bottom: 8px; color: var(--text-dim); font-size: 0.9rem; line-height: 1.6; font-weight: 300; }
  .list-styled li::before { content: '→'; position: absolute; left: 0; color: var(--accent); }
  .philosopher-tag { display: inline-block; background: rgba(200,169,110,0.12); color: var(--accent); padding: 2px 10px; border-radius: 4px; font-size: 0.78rem; font-weight: 500; margin-right: 6px; font-family: 'DM Mono', monospace; }

  /* ─── CULTURE GEN ─── */
  .cg-layout { display: flex; flex: 1; overflow: hidden; }
  .cg-sidebar { width: 240px; min-width: 240px; border-right: 1px solid var(--border); padding: 28px 20px; background: var(--surface); overflow-y: auto; }
  .cg-sidebar-section { margin-bottom: 28px; }
  .cg-sidebar-label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--text-faint); margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); font-family: 'DM Mono', monospace; }
  .cg-filter-btn { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 0.82rem; color: var(--text-dim); transition: all 0.2s; margin-bottom: 3px; }
  .cg-filter-btn:hover { background: var(--surface2); color: var(--text); }
  .cg-filter-btn.active { background: var(--surface2); color: var(--accent); }
  .cg-filter-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .cg-main { flex: 1; overflow-y: auto; padding: 40px 48px; }
  /* ─── CG ACCORDION LIST ─── */
  .cg-list { display: flex; flex-direction: column; gap: 10px; }
  .cg-item { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; transition: border-color 0.25s, box-shadow 0.25s, transform 0.25s; cursor: pointer; }
  .cg-item:hover { border-color: var(--item-color, var(--accent2)); box-shadow: 0 6px 24px rgba(0,0,0,0.25); transform: translateY(-2px); }
  .cg-item.cg-open { border-color: var(--item-color, var(--accent2)); }
  .cg-item-header { display: flex; align-items: center; gap: 20px; padding: 20px 24px; cursor: pointer; user-select: none; position: relative; }
  .cg-item-header::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--item-color, var(--accent2)); border-radius: 14px 0 0 14px; opacity: 0.7; transition: opacity 0.2s; }
  .cg-item.cg-open .cg-item-header::before { opacity: 1; }
  .cg-item-num { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; color: var(--item-color, var(--text-faint)); min-width: 44px; line-height: 1; flex-shrink: 0; opacity: 0.5; }
  .cg-item.cg-open .cg-item-num { opacity: 1; }
  .cg-item-info { flex: 1; }
  .cg-item-day { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--item-color, var(--text-faint)); margin-bottom: 4px; font-family: 'DM Mono', monospace; opacity: 0.7; }
  .cg-item-title { font-family: 'Playfair Display', serif; font-size: 1.05rem; font-weight: 700; color: var(--text); line-height: 1.3; margin-bottom: 5px; }
  .cg-item-sub { font-size: 0.78rem; color: var(--text-dim); line-height: 1.4; }
  .cg-item-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.68rem; font-weight: 500; background: color-mix(in srgb, var(--item-color, var(--accent2)) 15%, transparent); color: var(--item-color, var(--text-dim)); margin-top: 6px; }
  .cg-item-toggle { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--item-color, var(--accent2)); font-size: 1rem; flex-shrink: 0; transition: all 0.25s; }
  .cg-item:hover .cg-item-toggle { background: color-mix(in srgb, var(--item-color, var(--accent2)) 15%, transparent); border-color: var(--item-color, var(--accent2)); transform: translateX(3px); }
  /* Accordion body */
  .cg-item-body { max-height: 0; overflow: hidden; transition: max-height 0.45s cubic-bezier(0.4,0,0.2,1); }
  .cg-item.cg-open .cg-item-body { max-height: 6000px; }
  .cg-item-body-inner { border-top: 1px solid var(--border); }

  /* ─── FICHE CONTENT (inside accordion) ─── */
  .cg-fiche-wrap { padding: 28px 32px 32px; font-family: 'DM Sans', sans-serif; }
  .cg-section { margin-top: 24px; }
  .cg-section-label {
    font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--text-faint); margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .cg-section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .cg-prose { font-size: 0.88rem; line-height: 1.8; color: var(--text); }
  .cg-prose strong { color: var(--text); font-weight: 600; }
  /* Timeline */
  .cg-timeline { display: flex; flex-direction: column; }
  .cg-tl-row { display: grid; grid-template-columns: 72px 1fr; gap: 16px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .cg-tl-row:last-child { border-bottom: none; }
  .cg-tl-yr { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--text-faint); }

  /* Mini cards grid */
  .cg-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cg-mini { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--surface2); }
  .cg-mini-tag { font-size: 0.62rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; display: inline-block; margin-bottom: 7px; background: var(--border); color: var(--text-dim); }
  .cg-mini-title { font-size: 0.82rem; font-weight: 600; color: var(--text); margin-bottom: 3px; line-height: 1.3; }
  .cg-mini-desc { font-size: 0.75rem; color: var(--text-dim); line-height: 1.45; }
  /* Highlight box */
  .cg-hl { border-radius: 10px; padding: 14px 18px; font-size: 0.83rem; line-height: 1.7; background: var(--surface2); color: var(--text); border-left: 3px solid var(--accent2); }
  /* Anecdote */
  .cg-anecdote { border-left: 3px solid var(--accent); padding: 12px 16px; border-radius: 0 8px 8px 0; font-size: 0.83rem; line-height: 1.7; font-style: italic; background: rgba(200,169,110,0.07); color: var(--text); }
  /* Stats row */
  .cg-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cg-stat { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; text-align: center; background: var(--surface2); }
  .cg-stat-num { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; color: var(--accent); margin-bottom: 3px; }
  .cg-stat-label { font-size: 0.68rem; color: var(--text-dim); line-height: 1.35; }
  /* VS row */
  .cg-vs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cg-vs-card { border-radius: 10px; padding: 12px 14px; border: 1px solid; }
  .cg-vs-name { font-size: 0.82rem; font-weight: 600; margin-bottom: 5px; }
  .cg-vs-desc { font-size: 0.75rem; line-height: 1.45; color: var(--text-dim); }
  /* Pillars */
  .cg-pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cg-pillar { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--surface2); }
  .cg-pillar-title { font-size: 0.82rem; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .cg-pillar-desc { font-size: 0.75rem; color: var(--text-dim); line-height: 1.4; }

  @media (max-width: 600px) {
    .cg-cards, .cg-vs, .cg-pillars, .cg-stats { grid-template-columns: 1fr; }
    .cg-fiche-wrap { padding: 20px; }
  }

  /* ─── FICHE CG ─── */
  .fiche-content { max-width: 800px; padding: 56px 64px; overflow-y: auto; flex: 1; }
  .fiche-content h1 { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 900; margin-bottom: 6px; }

  .fiche-fact { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 10px; font-size: 0.88rem; color: var(--text-dim); line-height: 1.6; }

  /* Corps de la fiche pleine page */

  /* Timeline full page */

  /* Mini grid full page */
  .fp-mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fp-mini-card {

  /* Highlight box full page */

  /* Anecdote full page */
  .fp-anecdote {

  .fp-stat-num { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 900; margin-bottom: 4px; }

  /* ─── ACTUALITÉ ─── */

  .actu-card:hover { border-color: var(--card-color, var(--accent)); background: var(--surface2); transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.3); }

  .actu-badge.theme { background: var(--surface2); color: var(--text-dim); }
  .actu-date { font-size: 0.7rem; color: var(--text-faint); margin-left: auto; font-family: 'DM Mono', monospace; }
  .actu-card-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; color: var(--text); line-height: 1.35; margin-bottom: 12px; }

  /* ─── Image carte actu ─── */
  .actu-card-img-wrap { margin: -20px -22px 16px -22px; overflow: hidden; border-radius: 13px 13px 0 0; aspect-ratio: 16/9; }
  .actu-card-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }

  .ap-hero-img-wrap { width: 100%; border-radius: 12px 12px 0 0; overflow: hidden; aspect-ratio: 16/7; margin-bottom: 0; }

  /* ─── ARTICLE DE PRESSE ─── */

  .article-lead { font-size: 1.1rem; color: var(--text-dim); line-height: 1.7; border-left: 3px solid var(--accent); padding-left: 20px; margin-bottom: 40px; font-weight: 300; }
  .article-stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin: 32px 0; }
  .article-stat-cell { background: var(--surface); padding: 20px 24px; text-align: center; }

  .article-p { font-size: 0.95rem; color: var(--text-dim); line-height: 1.8; margin-bottom: 16px; font-weight: 300; }
  .article-quote { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 0 12px 12px 0; padding: 24px 28px; margin: 28px 0; font-style: italic; color: var(--text-dim); font-size: 1rem; line-height: 1.7; }

  .article-divider { border: none; border-top: 1px solid var(--border); margin: 40px 0; }
  .article-sources { font-size: 0.75rem; color: var(--text-faint); font-style: italic; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); font-family: 'DM Mono', monospace; }

  .ap-stat.gold   { background: linear-gradient(135deg, #7a5c10, #b8922a); }
  .ap-stat.teal   { background: linear-gradient(135deg, #00433c, #00695c); }
  .ap-stat.red    { background: linear-gradient(135deg, #7f0000, #c62828); }
  .ap-stat.purple { background: linear-gradient(135deg, #38006b, #6a1b9a); }
  .ap-stat.olive  { background: linear-gradient(135deg, #2e4d00, #5d7a00); }
  .ap-stat-num  { font-size:22px; font-weight:700; font-family:'DM Mono',monospace; display:block; line-height:1.15; }
  .ap-stat-desc { font-size:10px; opacity:.8; font-family:'DM Mono',monospace; margin-top:4px; display:block; line-height:1.4; }

  /* ─── FAITS CLÉS ─── */
  .ap-facts { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:18px 0; }
  .ap-fact {
    background: rgba(255,255,255,0.03);
    border-radius:6px; padding:12px 14px;
    border-left:3px solid rgba(212,175,90,0.5);
    border: 1px solid rgba(255,255,255,0.07);
    border-left: 3px solid #d4af5a;
  }
  .ap-fact-label { font-family:'DM Mono',monospace; font-size:9px; color:rgba(255,255,255,0.35); text-transform:uppercase; letter-spacing:0.12em; margin-bottom:4px; }
  .ap-fact-val   { font-size:12.5px; font-weight:700; color:#e8e4d8; font-family:'DM Mono',monospace; line-height:1.3; }

  /* ─── LISTE ─── */
  .ap-list { list-style:none; margin:10px 0 18px; }
  .ap-list li {
    font-family:'Georgia',serif; font-size:14px; color:rgba(232,228,216,0.72);
    padding:8px 0 8px 22px; position:relative;
    border-bottom:1px solid rgba(255,255,255,0.05); line-height:1.6;
  }
  .ap-list li::before {
    content:''; position:absolute; left:0; top:16px;
    width:6px; height:6px; border-radius:50%; background:#d4af5a;
  }

  /* ─── CITATION ─── */
  .ap-quote {
    background: linear-gradient(135deg, rgba(180,146,42,0.08), rgba(180,146,42,0.04));
    border-left:3px solid #d4af5a; padding:18px 22px; margin:20px 0;
    border-radius:0 8px 8px 0;
    border: 1px solid rgba(212,175,90,0.15);
    border-left: 3px solid #d4af5a;
  }
  .ap-quote p    { font-family:'Georgia',serif; font-size:14.5px; font-style:italic; color:rgba(232,228,216,0.8); margin:0 0 8px !important; line-height:1.65; }
  .ap-quote cite { font-family:'DM Mono',monospace; font-size:10px; color:rgba(212,175,90,0.6); font-style:normal; letter-spacing:0.06em; }

  /* ─── CONTEXTE ─── */
  .ap-ctx {
    background: linear-gradient(135deg, rgba(13,27,42,0.9), rgba(7,16,28,0.95));
    color:#fff; border-radius:10px; padding:22px 24px; margin-top:24px;
    border: 1px solid rgba(100,140,180,0.2);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .ap-ctx-label { font-family:'DM Mono',monospace; font-size:9px; letter-spacing:0.22em; text-transform:uppercase; color:#d4af5a; margin-bottom:10px; font-weight:700; }
  .ap-ctx p     { font-family:'Georgia',serif; font-size:13.5px; color:rgba(255,255,255,.75); line-height:1.7; margin:0; }

  /* ─── INFO BOX ─── */
  .ap-info {
    background: rgba(100,181,246,0.05);
    border:1px solid rgba(100,181,246,0.15); border-radius:8px;
    padding:16px 20px; margin:18px 0;
    display:flex; align-items:flex-start; gap:14px;
  }
  .ap-info-icon { font-size:26px; flex-shrink:0; margin-top:2px; }
  .ap-info-text { font-family:'Georgia',serif; font-size:13.5px; color:rgba(232,228,216,0.7); line-height:1.65; }
  .ap-info-text strong { color:#e8e4d8; }

  /* ─── TIMELINE ─── */
  .ap-tl { margin:16px 0; border-left:2px solid rgba(212,175,90,0.3); padding-left:20px; }
  .ap-tl-item { margin-bottom:16px; position:relative; }
  .ap-tl-row { display:flex; gap:14px; align-items:baseline; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
  .ap-tl-row:last-child { border-bottom:none; }
  .ap-tl-yr { font-family:'DM Mono',monospace; font-size:10px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; min-width:80px; flex-shrink:0; }
  /* ES article language toggle */
  body.ap-lang-es .ap-fr-section { display:none !important; }
  body.ap-lang-es .ap-es-section { display:block !important; }
  .ap-tl-item::before {
    content:''; position:absolute; left:-26px; top:5px;
    width:8px; height:8px; border-radius:50%;
    background:#d4af5a; border:2px solid #13161f; box-shadow:0 0 0 2px rgba(212,175,90,0.4);
  }
  .ap-tl-date { font-family:'DM Mono',monospace; font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#d4af5a; margin-bottom:3px; }
  .ap-tl-text { font-family:'Georgia',serif; font-size:13.5px; color:rgba(232,228,216,0.65); line-height:1.6; margin:0; }

  /* ─── TABLEAU ─── */
  .ap-table { width:100%; border-collapse:collapse; margin:16px 0; font-family:'DM Mono',monospace; font-size:12px; border-radius:8px; overflow:hidden; }
  .ap-table thead tr { background:rgba(13,27,42,0.95); }
  .ap-table thead th { padding:10px 14px; text-align:left; font-size:9px; letter-spacing:0.18em; text-transform:uppercase; color:rgba(255,255,255,0.6); }
  .ap-table tbody tr { border-bottom:1px solid rgba(255,255,255,0.05); }
  .ap-table tbody tr:nth-child(even) { background:rgba(255,255,255,0.02); }
  .ap-table tbody td { padding:9px 14px; color:rgba(232,228,216,0.7); }
  .ap-cell-bold  { font-weight:600; color:#e8e4d8; }
  .ap-rate-red   { color:#f08080; font-weight:700; }
  .ap-rate-orange{ color:#ffb74d; font-weight:700; }
  .ap-rate-green { color:#81c784; font-weight:700; }
  .ap-rate-grey  { color:rgba(255,255,255,0.4); font-weight:600; }

  /* ─── SÉPARATEUR ─── */
  .ap-divider { text-align:center; margin:24px 0 32px; color:rgba(212,175,90,0.25); font-size:20px; letter-spacing:10px; }

  /* ─── FOOTER ─── */
  .ap-footer {
    background: rgba(5,8,14,0.8);
    color:rgba(255,255,255,.35); text-align:center;
    padding:22px 40px; font-family:'DM Mono',monospace; font-size:11px;
    border-top:1px solid rgba(212,175,90,0.1);
    letter-spacing:0.05em;
  }
  .ap-footer strong { color:rgba(212,175,90,0.7); }

  /* ─── LANG TOGGLE ARTICLE ─── */
  .ap-lang-btn {
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
    color:rgba(255,255,255,.6); font-family:'DM Mono',monospace;
    font-size:10px; font-weight:700; letter-spacing:0.12em;
    padding:5px 14px; border-radius:4px; cursor:pointer; transition:all .2s;
    text-transform:uppercase;
  }
  .ap-lang-btn.active { background:#d4af5a; border-color:#d4af5a; color:#0d1b2a; }
  .ap-lang-btn:hover:not(.active) { background:rgba(255,255,255,.15); color:#fff; }
  .ap-en-section { display:none; }
  body.ap-lang-en .ap-fr-section { display:none; }
  body.ap-lang-en .ap-en-section { display:block; }

  @media(max-width:768px){
    .ap-back-bar { padding:10px 20px; }
    .ap-main { padding:20px 12px 60px; }
    .ap-header { padding:24px 20px; }
    .ap-body { padding:24px 20px; }
    .ap-cols { grid-template-columns:1fr; gap:0; }
    .ap-facts { grid-template-columns:1fr; }
    .ap-title { font-size:22px; }
  }

  /* ─── MUNDOHISPANO tag colors — unified with dark theme above ─── */

  /* ─── SCROLL ─── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

  /* ─── ANIMATIONS ─── */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  .fade-up { animation: fadeUp 0.25s ease forwards; opacity: 0; }
  .fade-up:nth-child(1) { animation-delay: 0s; }
  .fade-up:nth-child(2) { animation-delay: 0.02s; }
  .fade-up:nth-child(3) { animation-delay: 0.04s; }
  .fade-up:nth-child(4) { animation-delay: 0.06s; }
  .fade-up:nth-child(5) { animation-delay: 0.08s; }
  .fade-up:nth-child(6) { animation-delay: 0.1s; }

  @media (max-width: 768px) {
    nav { padding: 14px 20px; }
    .hero { padding: 60px 24px; }
    .home-grid { grid-template-columns: 1fr; }
    .page-header { padding: 40px 24px 30px; }
    .page-header::after { left: 24px; }

    .course-content { padding: 32px 24px; }

    .cg-main, .actu-main { padding: 24px; }
    .fiche-content { padding: 32px 24px; }
    .article-hero, .article-content { padding: 32px 24px; }
    .hgg-content { padding: 3rem 1.25rem 5rem; }
  }
</style>
