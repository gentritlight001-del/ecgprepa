<!DOCTYPE html>
<html lang="fr">
<head>
<script src="../../../auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECG Prépa — Flashcards de langues</title>
<meta name="description" content="Tous les mots des textes du jour, à retrouver du français vers la langue étudiée. Les mots ratés restent dans « À revoir » jusqu'à ce qu'ils soient sus.">
<link rel="stylesheet" href="../../../fonts/fonts.css">
<link rel="stylesheet" href="cartes.css">
<style>
  :root {
    --bg: #0d0d0f; --surface: #16161a; --surface2: #1e1e24; --border: #2a2a35;
    --accent: #c8a96e; --accent2: #7c9ec9; --accent3: #9ecba0; --accent4: #c97c9e;
    --text: #e8e6e0; --text-dim: #a9a79f; --text-faint: #8a8880;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }
  a { color: inherit; }
  button { font: inherit; }

  .bg-orb { position: fixed; border-radius: 50%; filter: blur(140px); pointer-events: none; opacity: 0.07; z-index: 0; }
  .orb1 { width: 700px; height: 700px; background: var(--accent3); top: -300px; right: -250px; }
  .orb2 { width: 600px; height: 600px; background: var(--accent2); bottom: -250px; left: -250px; }

  nav.haut { display: flex; align-items: center; padding: 20px 48px; border-bottom: 1px solid var(--border); background: rgba(13,13,15,0.92); backdrop-filter: blur(16px); position: sticky; top: 0; z-index: 100; }
  .nav-left { flex: 1 1 0; display: flex; align-items: center; }
  .nav-right { flex: 1 1 0; }
  .nav-logo { white-space: nowrap; font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 700; color: var(--accent); cursor: pointer; letter-spacing: 0.02em; }
  .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; color: var(--text-dim); flex-wrap: wrap; }
  .breadcrumb span { cursor: pointer; transition: color 0.2s; }
  .breadcrumb span:hover { color: var(--accent); }
  .breadcrumb .sep { color: #55534d; cursor: default; }
  .breadcrumb .current { color: var(--text); cursor: default; }

  .f-body { max-width: 960px; margin: 0 auto; padding: 72px 24px 96px; position: relative; z-index: 1; display: flex; flex-direction: column; gap: 36px; }
  .f-sur { font-family: 'DM Mono', monospace; font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent3); margin-bottom: 16px; }
  h1 { font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 6vw, 3.75rem); font-weight: 900; line-height: 1.02; }
  .f-lead { margin-top: 20px; max-width: 640px; font-size: 1.12rem; line-height: 1.6; color: var(--text-dim); }

  .langues { display: flex; flex-wrap: wrap; gap: 10px; }
  .langue { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 170px; padding: 16px 20px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); color: var(--text); text-align: left; cursor: pointer; transition: all 0.2s; }
  .langue b { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; }
  .langue span { font-size: 0.82rem; color: var(--text-dim); }
  .langue:hover { border-color: var(--text-faint); }
  .langue.actif { border-color: var(--accent3); background: rgba(158,203,160,0.07); }
  .langue:disabled { cursor: default; opacity: 0.55; border-style: dashed; background: transparent; }

  .f-stats { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 0.9rem; color: var(--text-dim); }
  .f-stats b { font-weight: 500; color: var(--text); }
  .f-stats a { color: var(--accent); text-decoration: none; margin-left: auto; }
  .f-stats a:hover { text-decoration: underline; }
  .vide { padding: 28px; border: 1px dashed var(--border); border-radius: 18px; color: var(--text-dim); line-height: 1.6; }

  @media (max-width: 768px) {
    nav.haut { padding: 14px 20px; gap: 14px; }
    .nav-left { flex: 0 0 auto; }
    .nav-right { display: none; }
    .breadcrumb { font-size: 0.8rem; gap: 6px; }
    .f-body { padding: 44px 16px 64px; gap: 28px; }
    .langue { flex: 1 1 140px; min-width: 0; }
    .f-stats a { margin-left: 0; }
  }
</style>
<meta property="og:type" content="article">
<meta property="og:title" content="Flashcards de langues">
<meta property="og:image" content="https://ecg-prepa.fr/partage/cours/premiere_annee-langues-flashcards-index.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Flashcards de langues">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://ecg-prepa.fr/partage/cours/premiere_annee-langues-flashcards-index.jpg">
<link rel="canonical" href="https://ecg-prepa.fr/premiere_annee/langues/flashcards/index.html">
</head>
<body>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<nav class="haut">
  <div class="nav-left"><div class="nav-logo" onclick="window.location.href='../../../index.html'">ECG Prépa</div></div>
  <div class="breadcrumb">
    <span onclick="window.location.href='../../../index.html'">Accueil</span>
    <span class="sep">/</span>
    <span onclick="window.location.href='../../index.html'">1ère Année</span>
    <span class="sep">/</span>
    <span onclick="window.location.href='../index.html'">Langues</span>
    <span class="sep">/</span>
    <span class="current">Flashcards</span>
  </div>
  <div class="nav-right"></div>
</nav>

<main class="f-body">
  <header>
    <div class="f-sur">Langues · 1ère Année</div>
    <h1>Flashcards</h1>
    <p class="f-lead">Tous les mots des textes du jour, à retrouver du français vers la langue étudiée. Les mots ratés restent dans «&nbsp;À revoir&nbsp;» jusqu'à ce qu'ils soient sus.</p>
  </header>
  <div class="langues" id="langues" role="tablist" aria-label="Langue"></div>
  <div class="f-stats" id="stats"></div>
  <div id="zone"></div>
</main>

<!-- Données générées par outils/flashcards.py. Cloudflare garde les .js 4 h en cache : on les
     charge avec un paramètre qui change chaque minute (voir CLAUDE.md). -->
<script>
var V_FLASH = Math.floor(Date.now() / 60000);
document.write('<script src="langues.js?v=' + V_FLASH + '"><\/script>');
</script>
<script>
(window.ECG_FLASHCARDS_LANGUES || []).forEach(function (l) {
  document.write('<script src="' + l + '.js?v=' + V_FLASH + '"><\/script>');
});
</script>
<script src="cartes.js"></script>
<script>
(function () {
  'use strict';
  /* Langues de l'espace : une langue devient disponible dès que outils/flashcards.py
     trouve des pages du jour dans premiere_annee/langues/<id>/quotidien/. */
  var LANGUES = [
    { id: 'anglais', nom: 'Anglais', sens: 'Français → anglais' },
    { id: 'espagnol', nom: 'Espagnol', sens: 'Français → espagnol' },
    { id: 'allemand', nom: 'Allemand', sens: 'Français → allemand' }
  ];
  var DONNEES = window.ECG_FLASHCARDS || {};
  function cle(id) { return 'ecg-' + id + '-quotidien-a-revoir'; }
  function dateCourte(d) {
    return new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
  }
  function tousLesMots(jours, quoi) {
    var l = [];
    jours.forEach(function (j) {
      var mots = quoi === 'essentiels' ? j.essentiels : quoi === 'theme' ? j.theme.mots : j.essentiels.concat(j.theme.mots);
      mots.forEach(function (m) { l.push({ en: m.en, fr: m.fr, ex: m.ex, date: j.date }); });
    });
    return l;
  }
  function uniques(l) {
    var vus = {}, n = 0;
    l.forEach(function (m) { if (!vus[m.en]) { vus[m.en] = 1; n++; } });
    return n;
  }

  var barre = document.getElementById('langues');
  var stats = document.getElementById('stats');
  var zone = document.getElementById('zone');

  function afficher(langue) {
    barre.querySelectorAll('.langue').forEach(function (b) {
      var oui = b.getAttribute('data-langue') === langue.id;
      b.classList.toggle('actif', oui);
      b.setAttribute('aria-selected', oui ? 'true' : 'false');
    });
    var jours = DONNEES[langue.id].jours;
    var tous = tousLesMots(jours, 'tous');
    var revoir = window.ECGCartes.lire(cle(langue.id)).length;
    stats.innerHTML = '<span><b>' + uniques(tous) + '</b> mots</span><span><b>' + jours.length + '</b> jour' + (jours.length > 1 ? 's' : '') +
      '</span><span><b>' + revoir + '</b> à revoir</span>' +
      '<a href="../' + langue.id + '/quotidien/index.html">' + langue.nom + ' au quotidien →</a>';
    zone.innerHTML = '';
    zone.appendChild(window.ECGCartes.creer({
      titre: langue.sens,
      sens: langue.sens,
      paquets: [
        { id: 'tous', libelle: 'Tous', mots: tous },
        { id: 'essentiels', libelle: 'Essentiels', mots: tousLesMots(jours, 'essentiels') },
        { id: 'theme', libelle: 'Thèmes', mots: tousLesMots(jours, 'theme') }
      ],
      parJour: jours.map(function (j) {
        return { id: 'jour-' + j.date, libelle: 'Jour ' + j.numero + ' · ' + dateCourte(j.date) + ' · ' + j.titre, mots: tousLesMots([j], 'tous') };
      }),
      cleRevoir: cle(langue.id),
      initial: revoir ? 'revoir' : 'tous'
    }));
    if (history.replaceState) history.replaceState(null, '', '#' + langue.id);
  }

  var dispo = LANGUES.filter(function (l) { return DONNEES[l.id] && DONNEES[l.id].jours.length; });
  LANGUES.forEach(function (l) {
    var ok = dispo.indexOf(l) !== -1;
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'langue'; b.setAttribute('role', 'tab'); b.setAttribute('data-langue', l.id);
    b.disabled = !ok;
    b.innerHTML = '<b>' + l.nom + '</b><span>' + (ok ? uniques(tousLesMots(DONNEES[l.id].jours, 'tous')) + ' mots' : 'Bientôt') + '</span>';
    if (ok) b.addEventListener('click', function () { afficher(l); });
    barre.appendChild(b);
  });
  if (!dispo.length) {
    zone.innerHTML = '<div class="vide">Les flashcards apparaîtront ici avec les premiers textes du jour.</div>';
    return;
  }
  var voulue = location.hash.slice(1);
  afficher(dispo.filter(function (l) { return l.id === voulue; })[0] || dispo[0]);
})();
</script>
</body>
</html>
