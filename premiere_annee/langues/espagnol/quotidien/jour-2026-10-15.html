        "« Tant que » + futur : <em>mientras</em> + subjonctif présent, <em>no tenga</em>, et non <s>no tendrá</s>."
      ] }
  ],

  /* ─── 7. Bilan ─── */
  bilan: [
    "Devant un COD de <strong>personne</strong>, la préposition <strong>a</strong> : <em>considera a Bukele un referente</em>, <em>recibirá a cabecillas</em> ; jamais devant une chose.",
    "Le <strong>subjonctif présent</strong> remplace le futur français dans les relatives sur des personnes indéterminées (<em>quienes necesiten</em>) et après <em>mientras</em> (<em>mientras no cumpla</em>).",
    "« C'est … que » pour un moment : <strong>ser … cuando</strong>, au temps du verbe qui suit (<em>fue en ese contexto cuando fue elegida</em>).",
    "Le <strong>conditionnel</strong> exprime le futur vu du passé (<em>anunciaba que serían enviados</em>) ; <strong>seguir + gérondif</strong> dit ce qui dure (<em>siguen siendo independientes</em>).",
    "À réemployer : <em>la pieza clave, sin embargo, por su parte, ir más allá de, se trata de, al límite</em>."
  ]
};
