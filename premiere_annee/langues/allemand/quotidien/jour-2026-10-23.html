      rappel: "<p>Les verbes formés avec <strong>be-, ge-, er-, ver-, zer-, ent-, emp-, miss-</strong> sont <strong>inséparables</strong> : le préfixe reste toujours collé au verbe, à tous les temps. Leur participe II ne prend <strong>pas de ge-</strong> : <em>verkünden → hat verkündet</em>, <em>bewerten → hatte bewertet</em>, <em>entscheiden → hat entschieden</em>.</p><p>Une particule séparable, elle, se détache au présent et au prétérit et accueille le <em>ge-</em> au participe : <em>Berlin zieht seine Bewerbung zurück</em>, <em>Berlin hat sie zurückgezogen</em>. L'inséparable reste d'un bloc : <em>Der DOSB entschied sich für München.</em></p>",

      rappel: "<p>L'allemand a <strong>cinq types de pluriel</strong>, parfois avec un Umlaut : <em>-e</em> (<em>das Spiel → die Spiele</em>, <em>die Stadt → die Städte</em>) ; <em>-(e)n</em>, presque tous les féminins (<em>die Stimme → die Stimmen</em>) ; <strong>aucune terminaison</strong> pour les masculins en <em>-er, -el, -en</em> (<em>der Bewerber → die Bewerber</em>) ; <em>-er</em> (<em>das Land → die Länder</em>) ; <em>-s</em> pour les mots étrangers (<em>der Chef → die Chefs</em>).</p><p>Quand le nom ne change pas, c'est l'article qui montre le pluriel : <em>der Bewerber</em>, « le candidat », <em>die Bewerber</em>, « les candidats ». D'où le réflexe : apprendre chaque nom avec son article et son pluriel.</p>",

      rappel: "<p>L'apposition est le groupe nominal placé entre virgules après un nom pour le présenter. Elle prend <strong>le même cas</strong> que ce nom : <em>Thomas Weikert, der Präsident des DOSB</em> est sujet, donc au nominatif ; après <em>unter</em> + datif, on écrit <em>unter Elif Eralp, einer entschiedenen Gegnerin</em>, article et adjectif au datif féminin.</p><p>Le français ne montre pas le cas ; l'allemand l'affiche dans l'article et l'adjectif : <em>mit Kai Wegner, dem Bürgermeister</em> (datif), <em>für Kai Wegner, den Bürgermeister</em> (accusatif).</p>",

      rappel: "<p>Avec un modal, le passif se met à l'<strong>infinitif passif</strong> : participe II + <strong>werden</strong>, à la fin de la phrase, tandis que le modal conjugué reste en 2e position : <em>kann … infrage gestellt werden</em>, « peut être remis en cause ».</p><p>L'agent reste <em>von</em> + datif : <em>von einer neuen Mehrheit</em>, <em>vom Internationalen Olympischen Komitee</em>. Avec <em>sollen</em>, la phrase dit ce qui est prévu : <em>sollen … vergeben werden</em>, « doivent être attribués ».</p>",
