      ] }
  ],

  /* ─── 8. Bilan ─── */
  bilan: [
    "<strong>Interrogation indirecte</strong> : mot interrogatif ou <em>whether / if</em>, puis sujet + verbe, sans inversion ni <em>did</em> : <em>he did not say when it would arrive</em>.",
    "<strong>Past continuous</strong> pour l'action de fond, <strong>prétérit</strong> pour l'événement qui la croise : <em>it came as they were meeting</em>.",
    "<strong>Passif</strong> = <em>be</em> au temps voulu + participe passé : <em>sanctions are delayed, the license was issued</em>.",
    "<strong>Superlatif</strong> + <em>to</em> + base verbale, <em>yet</em> ou <em>since</em> ; <strong>may / could</strong> + base pour le possible ; <strong>if + présent, will + base</strong> pour la condition réelle.",
