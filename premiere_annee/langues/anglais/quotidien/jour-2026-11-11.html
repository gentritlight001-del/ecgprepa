      citation: "Tony Burke recalled that <mark>those who want to cause harm</mark> have the latest technology",
      rappel: "<p>Pour désigner des personnes en général, « ceux qui » se dit <strong>those who</strong> : <em>those who want to cause harm</em>, « ceux qui veulent nuire ». <em>Those</em> est un démonstratif pluriel : le verbe de la relative et celui de la principale sont au <strong>pluriel</strong>, <em>those who want … have</em>.</p><p>Pour des choses, on dit <em>those that</em> ou <em>those which</em> : <em>these rules and those that will follow</em>. Au singulier, « celui qui » se dit <em>the one who</em>, et « quiconque » <em>anyone who</em>.</p>",
