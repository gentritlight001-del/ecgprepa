      rappel: "<p>Pour une chose, un pays ou une organisation, l'adjectif possessif est <strong>its</strong> : <em>the party lost its seats</em>, « le parti a perdu ses sièges ». Comme <em>his, her, their</em>, il s'accorde avec le <strong>possesseur</strong>, jamais avec l'objet possédé.</p><p>Ici, le possesseur est le parti : <em>its leader</em>, « sa cheffe », même si la cheffe est une femme. Pour Fréchette elle-même, on passe à <em>her</em> : <em>her own riding</em>.</p>",
