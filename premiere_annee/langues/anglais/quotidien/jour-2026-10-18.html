      "On Friday, October 16, 2026, the White House {announced|a annoncé} that Katie Zacharia was “transitioning out” of her role as press secretary, five days after she started. Donald Trump had {named|nommé} her on October 9 to replace Karoline Leavitt, who left in August. Zacharia is [1|the sixth person to hold] the job under Trump, and the {shortest-serving|restée le moins longtemps en poste} press secretary in history.",

    {

      citation: "Zacharia is <mark>the sixth person to hold</mark> the job under Trump",
      rappel: "<p>Après un ordinal (<em>the first, the sixth</em>), <em>the last</em>, <em>the only</em> ou un superlatif, « le premier à faire, la sixième à occuper » se construit avec <strong>to + base verbale</strong> : <em>the sixth person to hold the job</em>, « la sixième personne à occuper le poste ».</p><p>Le nom peut disparaître : <em>She was the first to leave</em>, « elle a été la première à partir ».</p>",

      lecon: 21, ancre: "type-two"

    {

      rappel: "<p>Après une conjonction de temps (<em>when, as soon as, before, until</em>), l'anglais n'emploie pas <em>will</em> pour un fait à venir, mais le présent : <em>We'll talk when I get back.</em></p><p>Au discours indirect ou dans un récit, la règle se décale : <em>would</em> reste dans la principale et la subordonnée passe au <strong>prétérit</strong> : <em>they would talk when he got back</em>, « ils en parleraient à son retour ».</p>",

      rappel: "<p>L'infinitif a une forme passive : <strong>to be + participe passé</strong>. <em>Records are made to be broken</em>, « les records sont faits pour être battus » : ce sont les records qui subissent l'action.</p><p>On le trouve après un verbe (<em>She expects to be replaced soon</em>), un adjectif (<em>It is likely to be announced</em>) ou pour exprimer le but, comme ici.</p>",
