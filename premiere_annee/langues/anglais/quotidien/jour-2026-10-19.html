    titre: "“No Kings” Swaps Marches for Early Voting",
    article: "États-Unis : « No Kings » rassemble une quatrième fois, cette fois pour le vote anticipé avant les élections de mi-mandat",
    url: "../../../../actualites/en/articles/us-no-kings-vote-early-2026.html",
    paragraphes: [
      "On Saturday, October 17, 2026, the “No Kings” movement returned to American streets for the fourth time, but with a new {rallying cry|mot d'ordre}: vote early. After three waves of protests against Donald Trump, the coalition held [1|thousands of gatherings], from marches to {block parties|fêtes de quartier}, two and a half weeks before the November 3 {midterms|élections de mi-mandat}. There is no national {turnout|participation} figure, and local reports describe [2|smaller crowds than before].",
      "For Indivisible co-founder Ezra Levin, the first three days “were designed to send a message.” Now the movement wants people to vote. Organizers {barred|ont interdit} political {endorsements|soutiens officiels} and did not invite candidates to speak, to stay nonpartisan.",

    {

      citation: "the coalition held <mark>thousands of gatherings</mark> […] a rally at the Lincoln Memorial drew <mark>a few hundred people</mark>",
      rappel: "<p>Après un nombre ou après <em>a few, several</em>, <strong>hundred, thousand, million</strong> restent invariables et se placent directement devant le nom : <em>a few hundred people</em>, « quelques centaines de personnes », <em>8 million participants</em>.</p><p>Employés seuls pour une quantité imprécise, ils prennent un <strong>-s</strong> et sont suivis de <strong>of</strong> : <em>thousands of gatherings</em>, « des milliers de rassemblements », <em>hundreds of organizations</em>.</p>",

    {

      citation: "local reports describe <mark>smaller crowds than before</mark>",
      rappel: "<p>Un adjectif court (une syllabe, ou deux syllabes en <em>-y</em>) forme son comparatif de supériorité avec <strong>-er + than</strong> : <em>small → smaller than</em>, « plus petit que ».</p><p>L'orthographe s'adapte : <em>big → bigger</em> (consonne redoublée), <em>large → larger</em>, <em>busy → busier</em>. Le comparatif peut précéder le nom : <em>smaller crowds than before</em>, « des foules moins nombreuses qu'auparavant ».</p>",
      piege: "Le calque de « plus petit » donne <s>more small</s>, et « que » donne <s>smaller that</s>. Un adjectif court prend <em>-er</em>, et « que » se dit toujours <em>than</em>.",

    {

      rappel: "<p><strong>have + personne + base verbale</strong>, sans <em>to</em>, signifie « faire faire quelque chose à quelqu'un » : <em>she had voters fill out postcards</em>, « elle a fait remplir des cartes postales aux électeurs ».</p><p>Quand le complément est une chose, on emploie le participe passé : <em>she had the postcards printed</em>, « elle a fait imprimer les cartes ».</p>",

      piege: "On oublie <em>have</em> (<s>which would required</s>) ou on met le participe après <em>would</em> seul (<s>would required</s>). Et dans la proposition en <em>if</em>, jamais <em>would have</em> : <em>if it had passed</em>.",

    {

      rappel: "<p><strong>in case</strong> introduit une précaution : on se prépare au cas où quelque chose arriverait. Il est suivi du <strong>présent</strong> même quand l'événement est à venir : <em>in case something bad happens</em>, « au cas où il se passerait quelque chose de grave ».</p><p><em>in case</em> ne veut pas dire « si » : <em>Take an umbrella in case it rains</em> (on le prend de toute façon) ≠ <em>Take an umbrella if it rains</em> (seulement s'il pleut).</p>",

  /* ─── 7. Traduction : version (phrases du texte) puis thème ─── */
  version: [
    { en: "There is no national turnout figure, and local reports describe smaller crowds than before.",
      fr: "Il n'existe aucun chiffre national de participation, et les comptes rendus locaux font état de foules moins nombreuses qu'auparavant.",
      notes: [
        "<em>There is no</em> : « il n'existe aucun », plus élégant que « il n'y a pas de ».",
        "<em>turnout figure</em> : nom + nom, qu'on déplie en français, « chiffre de participation ».",
