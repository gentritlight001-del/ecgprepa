      citation: "Hasan “<mark>is going to get</mark> a firing squad of soldiers, and we'll make sure that people are able to watch it,” he said",
      rappel: "<p><strong>be going to</strong> + base verbale annonce un futur déjà décidé avant le moment où l'on parle, ou que la situation présente rend certain : <em>Hasan is going to get a firing squad</em>, « Hasan va être fusillé par un peloton », la décision est prise.</p><p>Seul <em>be</em> se conjugue : <em>is going to</em>, <em>are going to</em>, <em>was going to</em> (projet passé). Au négatif : <em>He is not going to attend.</em></p>",

      rappel: "<p>Les pronoms en <strong>-self / -selves</strong> ont deux emplois. <strong>Réfléchi</strong> : le sujet agit sur lui-même, <em>he represented himself</em>, « il a assuré lui-même sa défense ».</p><p><strong>Insistance</strong> : placé juste après un nom, le pronom le met en relief, « lui-même, en soi » : <em>the firing squad itself remains exceptional</em>, « le peloton d'exécution lui-même reste exceptionnel ».</p>",

  /* ─── 7. Traduction : version (phrases du texte) puis thème ─── */

    { en: "Hasan “is going to get a firing squad of soldiers, and we'll make sure that people are able to watch it,” he said.",
