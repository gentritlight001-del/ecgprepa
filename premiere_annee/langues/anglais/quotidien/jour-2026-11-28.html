  /* ─── 7. Traduction : version (phrases du texte) puis thème ─── */
  version: [
    { en: "The figure remains provisional, and the final report is not due until early 2027.",

      autres: ["Le chiffre demeure provisoire : le rapport définitif n'est pas attendu avant début 2027."],
      notes: [
        "<em>remains provisional</em> : « reste provisoire » ; <em>remain</em> se construit avec un adjectif, comme <em>be</em>.",

        "<em>is not due until</em> : « n'est attendu que », ou « n'est pas attendu avant »."

      notes: [

  /* ─── 8. Bilan ─── */
  bilan: [
    "<strong>Not … until</strong> + moment rend « ne … que » : <em>the final report is not due until early 2027</em>.",
    "<strong>Be used to</strong> + nom ou V-ing veut dire « habitué à » : <em>a country not used to such temperatures</em>, à ne pas confondre avec <em>used to</em> + base.",
    "Après une virgule, <strong>which</strong> reprend toute l'idée : <em>which is why it looks modest</em>, « ce qui explique qu'elle paraisse modeste ».",
    "Le superlatif prend <strong>of</strong> devant une période (<em>the deadliest of the summer</em>) et <em>in</em> devant un lieu ; <strong>call</strong> + objet + attribut se passe de préposition : <em>called the numbers a stark reminder</em>.",
    "<strong>Much of</strong> se met devant un indénombrable, <strong>many of</strong> devant un pluriel : <em>much of Britain's housing and many of its hospitals</em>."
