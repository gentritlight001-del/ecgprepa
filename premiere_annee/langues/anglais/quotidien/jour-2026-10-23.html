window.JOUR = {

    titre: "Ireland's Biggest Public Sector Strike Since 2009",

    paragraphes: [
      "On Wednesday, October 14, 2026, more than 300,000 public sector workers in Ireland, teachers, nurses, doctors and civil servants, {walked out|ont cessé le travail} for 24 hours. [1|Most schools] and universities closed, hospitals {postponed|ont reporté} thousands of appointments and the courts dealt only with emergencies. Irish media called it the biggest public sector strike since 2009, [2|seventeen years ago].",

  grammaire: [
    {
      titre: "Most schools : « la plupart des » sans article",
      citation: "<mark>Most schools</mark> and universities closed",
      rappel: "<p>« La plupart des » se dit <strong>most + nom</strong>, sans article ni <em>of</em>, quand on parle en général : <em>most schools closed</em>, « la plupart des écoles ont fermé ».</p><p>Devant un groupe déjà déterminé (<em>the, these, their</em>) ou un pronom, on passe à <strong>most of</strong> : <em>most of the strikers, most of them</em>.</p>",
      piege: "Le calque de « la plupart des » donne <s>the most of schools</s> ou <s>the most schools</s> : deux fautes. <em>The most</em> est un superlatif (« le plus »), et <em>of</em> n'apparaît que devant un déterminant ou un pronom.",
      lecon: 6, ancre: "quantifieurs-communs"

    {
      titre: "Seventeen years ago : « il y a » + prétérit",
      citation: "the biggest public sector strike since 2009, <mark>seventeen years ago</mark>",
      rappel: "<p>Pour situer une action passée et terminée, « il y a » + durée se dit <strong>durée + ago</strong>, avec un <strong>prétérit</strong> : <em>the last strike on this scale took place seventeen years ago</em>.</p><p><em>Ago</em> se place toujours <strong>après</strong> la durée : <em>two days ago, a year ago</em>.</p>",
      piege: "Ne pas confondre « il y a » et « depuis » : <em>ago</em> date une action terminée (prétérit), <em>for</em> mesure une situation qui dure (present perfect). Et jamais <s>there are seventeen years</s> ni <s>since seventeen years</s>.",
      lecon: 15, ancre: "erreurs"

    {
      titre: "Not all of them : la négation partielle",
      citation: "but <mark>not all of them</mark> are allowed to strike",
      rappel: "<p>Pour dire « pas tous », l'anglais place <strong>not devant all</strong> : <em>not all of them are allowed to strike</em>, « ils n'ont pas tous le droit de faire grève » (certains l'ont, d'autres non).</p><p>La négation totale, « aucun », se dit <strong>none of</strong> : <em>none of them are allowed to strike</em>.</p>",
      piege: "Le français « tous ne sont pas » pousse vers <s>all of them are not allowed</s>, ambigu en anglais, où l'on comprend souvent « aucun ». Pour « pas tous », commencer par <em>not all</em>.",
      lecon: 6, ancre: "quantifieurs-communs"
    },
    {
      titre: "Not … either : « non plus »",
      citation: "Commercial state companies such as the ESB and An Post were not involved <mark>either</mark>",
      rappel: "<p>En fin de phrase <strong>négative</strong>, <strong>either</strong> veut dire « non plus » : <em>they were not involved either</em>, « elles n'étaient pas concernées non plus ».</p><p>À l'affirmative, « aussi » se dit <strong>too</strong> : <em>teachers went on strike, and nurses did too</em>.</p>",
      piege: "<em>Too</em> ne suit jamais une négation : <s>they were not involved too</s>. Et <em>neither</em> porte déjà la négation : <em>neither were they</em>, sans <em>not</em>.",
      lecon: 3, ancre: "indefinis"

      piege: "L'apostrophe change le sens : <em>the dentist's union</em> serait « le syndicat du dentiste », un seul. Et jamais <s>the dentists's union</s> : pas de second s après le -s du pluriel.",

      titre: "As prices climb again : as, « alors que »",
      citation: "wages are falling behind <mark>as prices climb again</mark>",
      rappel: "<p>Conjonction de temps, <strong>as</strong> + sujet + verbe marque la <strong>simultanéité</strong> : <em>wages are falling behind as prices climb again</em>, « les salaires décrochent alors que les prix repartent à la hausse ».</p><p>Avec deux évolutions qui avancent ensemble, il se traduit souvent par « à mesure que ».</p>",
      piege: "<em>As</em> peut aussi exprimer la cause (« comme, puisque ») : seul le contexte tranche. Ici, deux mouvements simultanés : « alors que », pas « parce que ».",
      lecon: 27, ancre: "temps"
    }

      lecon: 23, ancre: "prepositions" },
    { cat: "Constructions verbales", ext: "<mark>ask</mark> its staff <mark>to be</mark> patient",
      regle: "<em>ask</em> + objet + <em>to</em> + base verbale.", ex: "They asked us to wait.",

    { cat: "Noms et articles", ext: "<mark>inflation</mark> reached 4.1%",

    { cat: "Liens logiques", ext: "<mark>while</mark> the government wants",
      regle: "<em>while</em> : « tandis que », contraste.", ex: "Nurses struck, while police worked.",

    { cat: "Dates et chiffres", ext: "<mark>300,000</mark> public sector workers",
      regle: "Virgule pour les milliers, point pour les décimales.", ex: "4.1%, €1.2 billion",

  vocabulaire: {

        { en: "work-to-rule", fr: "la grève du zèle", ex: "Work-to-rule action continues." },
        { en: "a picket", fr: "un piquet de grève", ex: "Pickets stood outside the schools." },
        { en: "talks", fr: "des négociations", ex: "Talks were set to open on October 19." },
        { en: "a deadlock", fr: "une impasse, un blocage", ex: "The unions protested at the deadlock in pay talks." },
        { en: "an honest broker", fr: "un médiateur impartial", ex: "The Taoiseach offered to act as an honest broker." },
        { en: "wages", fr: "les salaires", ex: "Prices rise faster than wages." },
        { en: "a state employer", fr: "un employeur public", ex: "A state employer must keep services running." }
      ]
    }
  },

  /* ─── 7. Traduction : version (phrases du texte) puis thème ─── */
  version: [
    { en: "Most schools and universities closed, hospitals postponed thousands of appointments and the courts dealt only with emergencies.",
      fr: "La plupart des écoles et des universités ont fermé, les hôpitaux ont reporté des milliers de rendez-vous et les tribunaux n'ont traité que les urgences.",
      notes: [
        "<em>Most schools</em> : « la plupart des écoles », avec l'article en français, sans article en anglais.",
        "Prétérit d'actions terminées et datées, rendu par le passé composé.",
        "<em>dealt only with</em> : « ne … que », plus naturel que « seulement »."

    { en: "About 385,000 workers are covered by the expired pay agreement, but not all of them are allowed to strike.",
      fr: "Environ 385 000 agents sont couverts par l'accord salarial arrivé à échéance, mais ils n'ont pas tous le droit de faire grève.",
      notes: [
        "<em>385,000</em> : la virgule anglaise devient une espace en français, 385 000.",
        "<em>the expired pay agreement</em> : « arrivé à échéance » ou « expiré », placé après le nom.",
        "<em>not all of them</em> : négation partielle, « ils n'ont pas tous », et non « aucun d'eux »."

        "<em>across the public sector</em> : « dans tout le secteur public »."

  ],
  theme: [
    { fr: "La plupart des enseignants ont fait grève, mais tous les agents publics n'en avaient pas le droit.",
      en: "Most teachers went on strike, but not all public sector workers were allowed to.",
      notes: [
        "« la plupart des enseignants » : <em>most teachers</em>, sans article ni <em>of</em>.",
        "« tous … n'en avaient pas le droit » : négation partielle, <em>not all … were allowed to</em>.",
        "<em>to</em> seul reprend le verbe déjà exprimé : <em>allowed to</em> (sous-entendu <em>strike</em>)."
      ] },
    { fr: "La dernière grève de cette ampleur a eu lieu il y a dix-sept ans, alors que la crise financière frappait le pays.",
      en: "The last strike on this scale took place seventeen years ago, as the financial crisis was hitting the country.",
      notes: [
        "« il y a dix-sept ans » : <em>seventeen years ago</em>, avec un prétérit.",
        "« alors que » (simultanéité) : <em>as</em> + sujet + verbe.",
        "« de cette ampleur » : <em>on this scale</em>."
      ] },
    { fr: "Le syndicat des enseignants n'a pas accepté l'offre, et celui des infirmières non plus.",
      en: "The teachers' union did not accept the offer, and the nurses' union did not either.",
      notes: [
        "« le syndicat des enseignants » : génitif d'un pluriel, <em>the teachers' union</em>, apostrophe seule.",
        "« non plus » dans une phrase négative : <em>not … either</em>, jamais <em>not … too</em>.",
        "<em>did not either</em> : l'auxiliaire reprend le verbe <em>accept</em>."

  /* ─── 8. Bilan ─── */
  bilan: [
    "« La plupart des » au sens général : <strong>most + nom</strong>, sans article (<em>most schools</em>) ; <em>most of</em> devant <em>the</em> ou un pronom.",
    "« Il y a » + durée : <strong>durée + ago</strong> avec un prétérit (<em>seventeen years ago</em>) ; « depuis » reste <em>for</em> ou <em>since</em>.",
    "« Pas tous » : <strong>not all</strong> en tête de phrase ; « aucun » : <em>none of</em>. « Non plus » : <strong>not … either</strong>, jamais <em>not … too</em>.",
    "Génitif d'un pluriel en -s : <strong>apostrophe seule</strong>, <em>the dentists' union</em>. <strong>As</strong> + sujet + verbe relie deux faits simultanés : <em>as prices climb again</em>.",

  ]
