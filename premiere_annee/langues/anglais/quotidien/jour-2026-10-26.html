  grammaire: [
    {
      titre: "Let ’em take out : let + complément + base verbale",
      citation: "“<mark>Let ’em take out</mark> Los Angeles. Let ’em take out San Diego.”",
      rappel: "<p><strong>Let + pronom complément + base verbale</strong> veut dire « laisser quelqu'un faire » ; en tête de phrase, il se traduit souvent par « que + subjonctif » : <em>let ’em take out Los Angeles</em>, « qu'ils détruisent Los Angeles ». <em>’em</em> est la forme orale de <em>them</em>.</p><p>Le pronom est toujours <strong>complément</strong> (<em>him, her, them</em>). À ne pas confondre avec <em>let's</em> (<em>let us</em>), qui inclut celui qui parle : <em>let's move on</em>, « passons à autre chose ».</p>",

      rappel: "<p>Quand une action est <strong>sujet</strong> de la phrase, l'anglais emploie le <strong>gérondif</strong> (V-ing), là où le français met l'infinitif : <em>letting Iran obtain a nuclear weapon would mean…</em>, « laisser l'Iran obtenir l'arme nucléaire reviendrait à… ». Le verbe qui suit est au <strong>singulier</strong>.</p><p>Après <em>mean</em> au sens de « impliquer, revenir à », on garde la forme en <em>-ing</em> : <em>would mean letting it</em>.</p>",

    }
