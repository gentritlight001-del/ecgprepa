      autres: ["The president said that he would not let American companies build data centers abroad."],
      notes: [
        "« permettre aux entreprises de construire » : <em>allow companies to build</em>, sans <em>to</em> devant la personne ; avec <em>let</em>, pas de <em>to</em> du tout.",
        "Discours indirect au passé : <em>will not</em> devient <em>would not</em>.",

  /* ─── 8. Bilan ─── */
  bilan: [
    "« Permettre à quelqu'un de faire » se dit <strong>allow + personne + to</strong> : <em>allow companies to build</em> ; avec <em>let</em>, la base verbale seule : <em>let data centers go</em>.",
    "Une <strong>question indirecte</strong> garde l'ordre sujet + verbe : <em>it is unclear whether the tax would hit…</em>, <em>nobody knows how it would be enforced</em>.",
