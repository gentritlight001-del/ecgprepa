  /* ─── 7. Traduction : version (phrases du texte) puis thème ─── */
  version: [
    { en: "This is not a duty in force: it is a ceiling put out for consultation, which would fall to 17% if New Delhi signed a trade deal.",

      notes: [
        "<em>in force</em> : « en vigueur », un groupe prépositionnel placé après le nom.",
        "<em>put out for consultation</em> : participe passé après le nom, « soumis à consultation ».",
        "<em>would fall … if New Delhi signed</em> : hypothèse, « tomberait … si New Delhi signait »."

        "<em>escape the new tax</em> : <em>escape</em> se construit sans préposition, « échapper à ».",

        "<em>already bound by</em> : participe passé de <em>bind</em> (<em>bound</em>), « déjà liés par ».",
