  'II.1': ["Partie II · Des intégrations plurielles", "L'intégration nationale : territoire et identités plurielles"],

const D = (m, x, o) => ({ k: 'def', m, x, ...o }), FI = (kk, t, x, o) => ({ k: 'fiche', kk, t, x, ...o });

const S = (sp, g, ...b) => ({ sp, g, b });
const R = { c: 1 };
const r = o => ({ c: 1, ...o });

/* Version courte (≈ 9 min) : écrans clés de hgg2-chapitre1.html, repris tels quels ; photos des cartons de partie changées

  { tpl: 'these', kk: "L'idée du chapitre", titre: "Il n'y a pas une Amérique, mais *des Amériques*",

    p("À l'**échelle locale**, Hervé Théry montre qu'à São Paulo le centre est riche et diplômé, les périphéries plus pauvres et moins éduquées.", R),

  S('II.3', '1fr 1fr',
    p("Né en **1991** (traité d'Asunción), le **Mercosur** réunit le Brésil, l'Argentine, le Paraguay et l'Uruguay. Avec son tarif extérieur commun (1995), c'est une **union douanière**, même imparfaite."),

    p("Depuis 2025, Trump impose de nouveaux droits de douane à ses deux partenaires ; le **réexamen conjoint de 2026** fragilise l'avenir de l'intégration nord-américaine.", R)),
  { tpl: 'partie', n: 'III', img: 'la-moneda-11-septembre-1973.webp', cap: "Santiago, 11 septembre 1973 : La Moneda sous les bombes." },
  S('III.1', '1fr',
    DU(["Doctrine Monroe (1823)", "Énoncée par James Monroe : « **l'Amérique aux Américains** ». Plus de colonisation ni d'intervention européenne, isolationnisme des États-Unis en Europe.", 'Anti-impérialiste'],
       ["Corollaire Roosevelt (1904)", "Lecture expansionniste par Theodore Roosevelt : les États-Unis, **gendarmes du continent**. C'est la politique du « Big Stick ».", 'Expansionniste'], { lab: 'De la doctrine Monroe à son interprétation expansionniste' }),

    Q('Guatemala · 1954', 'Une république bananière', "La CIA renverse Jacobo Árbenz, qui voulait une réforme agraire sur des terres largement détenues par l'United Fruit Company. S'ouvre une guerre civile de plus de trente ans.", R)),
  S('III.2', '1fr 1fr',
    p("La frontière États-Unis / Mexique alterne entre **ouverture**, quand l'économie réclame de la main-d'œuvre, et **fermeture**, quand la sécurité domine."),
    p("Sa **barriérisation** relève d'une géopolitique externe (opération Gatekeeper, 1994 ; Secure Fence Act, 2006) et **interne** : le « mur » oppose électorat hispanique et électorat conservateur."),

  S('III.3', '1fr 1fr',
    PH('accord-paix-colombie-2016.webp', "Carthagène, 26 septembre 2016 : Juan Manuel Santos accueille les chefs d'État invités à la signature de l'accord de paix avec les FARC.", { h: 440 }),
    p("Les cartels de **Medellín** (Pablo Escobar) et de **Cali** infiltrent l'État. Les **FARC**, nées en 1964, lient guérilla et narcotrafic. Accord de paix en **2016**, mais les violences continuent.", R),
    ST([['260 000', "morts en un demi-siècle"], ['6,9 M', 'de déplacés internes']], { c: 1, petit: 1, r: 0, lab: 'Le bilan du conflit colombien' })),

  { tpl: 'fin', x: "Le cours complet, le résumé en PDF et les flashcards sur **ecg-prepa.fr**.", suite: 'Les États-Unis : territoire, société et puissance', fin: 2.5 }
];
