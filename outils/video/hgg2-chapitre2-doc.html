  Documentaire du chapitre 2 d'HGG 2e année, version reportage (novembre 2026), habillage « cinéma sobre » :

  La voix off fixe le tempo : chaque séquence dure « avant + voix + après », et chaque plan est calé sur un mot de la
  voix (S.t('mot', k) = instant du k-ième « mot » dit dans la séquence, d'après mots.json de voix.py).

  1. Extraits vidéo :  python3 outils/video/doc-medias.py outils/video/hgg2-chapitre2-doc.html --fichier mer=<mer.mp4>

  3. Contrôle :       python3 outils/video/generer.py outils/video/hgg2-chapitre2-doc.html --controle --voix <voix>/voix.json
  4. Images :         python3 outils/video/generer.py outils/video/hgg2-chapitre2-doc.html --images <dossier> --voix <voix>/voix.json
  5. Rendu :          python3 outils/video/generer.py outils/video/hgg2-chapitre2-doc.html <muet.mp4> --voix <voix>/voix.json
  6. Voix + musique : python3 outils/video/doc-musique.py outils/video/hgg2-chapitre2-doc.html <muet.mp4> <final.mp4> --musiques <mp3> --voix <voix>

  Sources des images et des films (domaine public sauf mention) :

    1869 (cph 3g02634) ; Emigrants to the West, gravure, 1880 (cph 3c01163) ; Immigrants at Ellis Island, vers 1900
    (Bain, ggbain 08804) ; photographies de Carol M. Highsmith (don au domaine public) : Manhattan au crépuscule, parquet du
    New York Stock Exchange, Wall Street, rotonde du Capitole, Grand Teton (deux vues), Blue Ridge Parkway, blé du Kansas,
    pont de Bixby Creek (Big Sur).
  - Wikimedia Commons : John Trumbull, Declaration of Independence, 1819 (Architect of the Capitol) ; portrait officiel de
    Donald Trump, 2025 (Maison-Blanche).
  - Films : V-J Day Celebration in New York City, 14/08/1945 (US Naval Photographic Center, NARA, NPC-17236, archive.org) ;
    Arrival of emigrants [i.e. immigrants], Ellis Island, 1906 (American Mutoscope & Biograph, Library of Congress) ;
    NASA Goddard, Earth at Night, 2017 (Black Marble).
  - NASA Worldview, BlueMarble_ShadedRelief_Bathymetry (relief des États-Unis).
  - Site (deuxieme_annee/hgg/images/) : porte-avions Gerald R. Ford, panneau Hollywood, Capitole, Joseph Nye, Shanghai,
    mur frontalier de Tijuana, Capitole le 6 janvier 2021 ; images/doc-hgg2-ch2/aron-1974.webp (LOC, U.S. News & World Report).
  - Cartes : us-atlas@3 et world-atlas@2 (ISC) dans donnees/ ; acquisitions territoriales tracées à la main d'après les
    traités (1783, 1803, 1819, 1845, 1846, 1848, 1853, 1867), contours simplifiés.
-->

<body>
<div id="stage"></div>
<script>
(async function () {
  const W = 1920, H = 1080, FPS = 25;
  const MEDIA = 'media/doc-hgg2-ch2/';
  const IMG = 'images/doc-hgg2-ch2/', SITE = '../../deuxieme_annee/hgg/images/';
  const stage = document.getElementById('stage');
  const ERR = [];
  const $ = (tag, cls, html, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
  const NS = 'http://www.w3.org/2000/svg';
  const S_ = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const cl = x => Math.max(0, Math.min(1, x));
  const eo = p => 1 - Math.pow(1 - p, 3);
  const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const lin = (a, b, p) => a + (b - a) * p;
  const up = (x, a, d = .7) => eo(cl((x - a) / d));
  const show = (el, p, dy = 18) => { el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * dy}px)`; };

  /* ===== Voix : durées (voix.json) et instant de chaque mot (mots.json) ===== */
  const VX = window.VOIX, VM = window.VOIX_MOTS;
  if (!VX || !VM) throw new Error('Rendre avec --voix <dossier>/voix.json (voix.py synthese) : la voix fixe le tempo.');
  const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');

  /* ===== Séquences et plans ===== */
  const SEQS = []; let fin = 0;
  function sequence(n, avant, apres, build, fixe) {
    const voix = fixe ? 0 : VX[n];
    if (!fixe && voix == null) ERR.push(`séquence ${n} : pas de voix dans voix.json`);
    const d = fixe || (avant + (voix || 4) + apres);
    const el = $('div', 'sq', null, stage);
    const toks = ((VM && VM[n]) || []).map(([w, t]) => [norm(w), t]).filter(x => x[0]);
    const S = { n, d, el, avant, layers: [], start: fin,
      /* instant (dans la séquence) du k-ième mot qui commence par « mot » */
      t(mot, k = 1) {
        const c = norm(mot); let vu = 0;
        for (const [w, t] of toks) if (w === c || (c.length >= 4 && w.startsWith(c))) { if (++vu === k) return avant + t; }
        ERR.push(`séquence ${n} : mot « ${mot} » (${k}) introuvable dans la voix`); return avant;
      } };
    build(S); SEQS.push(S); fin += d;
  }
  /* un plan : élément visible de t0 à t1 (temps de la séquence), fondu d'entrée fi et de sortie fo */
  function plan(S, t0, t1, el, o = {}) {
    el.classList.add('ly'); S.el.appendChild(el);
    const l = { t0, t1, el, fi: o.fi ?? .5, fo: o.fo ?? .5, draw: o.draw };
    S.layers.push(l); return l;
  }
  /* Ken Burns : de a {s, x, y} à b (x, y en % du cadre) */
  const kbT = (a, b, p) => { const q = lin(0, 1, p * .25 + eio(p) * .75); return `translate(${lin(a.x || 0, b.x || 0, q)}%, ${lin(a.y || 0, b.y || 0, q)}%) scale(${lin(a.s, b.s, q)})`; };
  function photo(S, t0, t1, src, o = {}) {
    const box = $('div'); const im = $('img', 'full', null, box); im.src = src; im.alt = '';
    if (o.pos) im.style.objectPosition = o.pos;
    if (o.filtre) im.style.filter = o.filtre;
    (o.voiles || []).forEach(v => $('div', v, null, box));
    const a = o.a || { s: 1.04 }, b = o.b || { s: 1.12 };
    plan(S, t0, t1, box, { ...o, draw: (lt, d) => { im.style.transform = kbT(a, b, lt / d); if (o.draw) o.draw(lt, d); } });
    return box;
  }
  /* image verticale : tirage net sur son propre fond flou, à gauche ou à droite */
  function tirage(S, t0, t1, src, o = {}) {
    const box = $('div'); const f = $('img', 'flou', null, box); f.src = src;
    const t = $('div', 'tirage', null, box); const im = $('img', null, null, t); im.src = src;
    t.style[o.cote === 'gauche' ? 'left' : 'right'] = (o.marge ?? 170) + 'px';
    if (o.haut) { t.style.top = o.haut[0] + 'px'; t.style.bottom = o.haut[1] + 'px'; }
    plan(S, t0, t1, box, { ...o, draw: (lt, d) => { const p = lt / d; t.style.transform = `translateY(${lin(14, -14, p)}px) scale(${lin(1, 1.035, p)})`; f.style.transform = `scale(${lin(1.05, 1.12, p)})`; if (o.draw) o.draw(lt, d); } });
    return box;
  }
  /* extrait vidéo : une image JPEG par image du film (doc-medias.py) */
  const N = window.CLIPS_N || {};
  function clip(S, t0, t1, nom, o = {}) {
    if (!N[nom]) ERR.push(`extrait « ${nom} » absent : lancer doc-medias.py`);
    const box = $('div'); const im = $('img', 'full', null, box); im.alt = ''; let cur = -1;
    im.src = `${MEDIA}${nom}/${String(Math.round((o.depuis || 0) * FPS) + 1).padStart(4, '0')}.jpg`;
    if (o.filtre) im.style.filter = o.filtre;
    (o.voiles || []).forEach(v => $('div', v, null, box));
    const a = o.a || { s: 1 }, b = o.b || { s: 1.04 };
    plan(S, t0, t1, box, { ...o, draw: (lt, d) => {
      const k = Math.min((N[nom] || 1) - 1, Math.max(0, Math.round(((o.depuis || 0) + lt * (o.vitesse || 1)) * FPS)));
      im.style.transform = kbT(a, b, lt / d);
      if (o.draw) o.draw(lt, d);
      if (k !== cur) { cur = k; im.src = `${MEDIA}${nom}/${String(k + 1).padStart(4, '0')}.jpg`; return im.decode().catch(() => null); }
    } });
    return box;
  }
  /* petit titre en bas d'écran */
  function titre(S, t0, t1, kick, txt, o = {}) {
    const box = $('div'); const lt = $('div', 'lt', `<b>${kick}</b>${txt ? `<span>${txt}</span>` : ''}`, box);
    if (o.droite) { lt.style.left = 'auto'; lt.style.right = '120px'; lt.style.textAlign = 'right'; }
    plan(S, t0, t1, box, { fi: .6, fo: .4, draw: lt0 => show(lt, up(lt0, 0, .8), 14) });
  }
  function credit(S, t0, t1, html) { const box = $('div'); $('div', 'doc', html, box); plan(S, t0, t1, box, { fi: .8, fo: .4 }); }
  /* texte libre positionné ; apparitions [élément, instant] */
  function texte(S, t0, t1, html, style, o = {}) {
    const box = $('div'); const e = $('div', o.cls || 'grand', html, box); Object.assign(e.style, style);
    plan(S, t0, t1, box, { fi: o.fi ?? .7, fo: o.fo ?? .5, draw: (lt, d) => { show(e, up(lt, 0, .9), o.dy ?? 22); if (o.draw) o.draw(lt, d, e); } });
    return e;
  }
  const noir = (S, t0, t1) => plan(S, t0, t1, $('div'), { fi: 0, fo: 0 });

  /* ===== Fonds de carte ===== */
  const WORLD = window.WORLD_ATLAS, US = window.US_ATLAS;
  const pays = topojson.feature(WORLD, WORLD.objects.countries).features;
  const etats = topojson.feature(US, US.objects.states).features;
  const URSS = ['643', '804', '112', '498', '233', '428', '440', '268', '051', '031', '398', '860', '795', '417', '762'];
  const UE = ['250', '276', '380', '724', '616', '528', '056', '620', '040', '203', '752', '246', '208', '372', '300', '348', '642', '100', '703', '705', '191', '440', '428', '233', '442', '196'];
  /* carte du monde : renvoie { svg, p(id) : chemin du pays, proj } */
  function monde(parent) {
    const proj = d3.geoNaturalEarth1().rotate([-10, 0]).fitExtent([[50, 70], [1870, 1010]], { type: 'Sphere' });
    const path = d3.geoPath(proj);
    const svg = S_('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}` }, parent);
    S_('path', { d: path(d3.geoGraticule10()), fill: 'none', stroke: 'rgba(241,236,226,.05)', 'stroke-width': 1 }, svg);
    const g = S_('g', {}, svg); const P = {};
    pays.forEach(f => { if (f.id === '010') return; P[f.id] = S_('path', { d: path(f), fill: '#1b1d22', stroke: '#2f333b', 'stroke-width': .8 }, g); });
    return { svg, P, proj, path };
  }

  /* ===== Les séquences ===== */

  /* [1] Ouverture : Winthrop, 1630, puis la puissance d'aujourd'hui */
  sequence(1, 3.2, 1.4, S => {
    const tw = S.t('winthrop'), tn = S.t('nous'), tp = S.t('pres'), te = S.t('premiere', 1), ta = S.t('premiere', 2), tm = S.t('monnaie') - .25, tf = S.t('pourtant') - .3;
    clip(S, 0, tw + .3, 'mer', { fi: 1.4, a: { s: 1.02 }, b: { s: 1.08 } });
    titre(S, .9, tw - .1, '1630', 'Océan Atlantique');
    tirage(S, tw, tn + .2, IMG + 'winthrop-1806.webp', { fi: .6 });
    titre(S, tw + .5, tn - .2, 'John Winthrop (1588-1649)', 'Puritain, gouverneur de la colonie de la baie du Massachusetts');
    clip(S, tn, tp + .2, 'mer', { depuis: 9, filtre: 'brightness(.45) saturate(.6)', a: { s: 1.1 }, b: { s: 1.16 } });
    texte(S, tn + .1, tp + .1, '<span class="mot">« We shall be as a city upon a hill.</span><br><span class="mot">The eyes of all people are upon us. »</span><span class="src mot">John Winthrop · A Model of Christian Charity · 1630</span>',
      { left: '160px', top: '330px', right: '160px' }, { cls: 'cit', dy: 0, draw: (lt, d, e) => { const m = e.querySelectorAll('.mot'); show(m[0], up(lt, 0, .9)); show(m[1], up(lt, S.t('yeux') - tn - .2, .9)); show(m[2], up(lt, S.t('yeux') - tn + 1, .8)); } });
    photo(S, tp, te + .2, IMG + 'manhattan-crepuscule.webp', { a: { s: 1.05, x: 1.5 }, b: { s: 1.12, x: -1.5 }, pos: '50% 70%' });
    photo(S, te, ta + .15, IMG + 'nyse-parquet.webp', { fi: .25, a: { s: 1.06 }, b: { s: 1.16 }, voiles: ['voile-b'] });
    titre(S, te + .1, ta, 'New York Stock Exchange', '');
    photo(S, ta, tm + .25, SITE + 'porte-avions-gerald-ford.webp', { fi: .25, a: { s: 1.04, x: -1 }, b: { s: 1.12, x: 1 }, voiles: ['voile-b'] });
    titre(S, ta + .1, tm, 'USS Gerald R. Ford', '');

    const fr = pays.find(f => f.id === '250'); const poly = fr.geometry.coordinates.map(p => p[0]).sort((a, b) => d3.polygonArea(b) - d3.polygonArea(a))[0];
    const f0 = d3.polygonCentroid(poly), kx = Math.cos(f0[1] * Math.PI / 180) / Math.cos(39 * Math.PI / 180);
    const frX = poly.map(([l, p]) => [-98 + (l - f0[0]) * kx, 39 + (p - f0[1])]);
    const frP = S_('path', { d: 'M' + frX.map(([l, p]) => `${X(l)},${Y(p)}`).join('L') + 'Z', fill: 'rgba(91,143,199,.55)', stroke: '#9cc0e6', 'stroke-width': 2 }, g);
    const lab = (txt, lon, lat, cls = 'etiq') => { const e = $('div', cls, txt, box); Object.assign(e.style, { left: X(lon) + 'px', top: Y(lat) + 'px', transform: 'translate(-50%,-50%)' }); e.style.opacity = 0; return e; };
    const lFr = lab('France<small>× 17 ≈ les États-Unis</small>', -98, 36.6);
    const oceans = [lab('Océan<br>Atlantique', -70.5, 31.5), lab('Océan<br>Pacifique', -124.2, 33), lab('Golfe du Mexique', -90, 25.6)];
    const zones = [lab('Appalaches', -80.5, 37.8), lab('Rocheuses', -108.6, 41.5), lab('Grandes Plaines', -99.5, 43.5)];
    const sup = $('div', 'grand', 'Plus de 9 millions<br>de km²', box); Object.assign(sup.style, { left: '110px', bottom: '80px', fontSize: '60px' });
    const fl = S_('path', { d: `M${X(-74)},${Y(36.2)} L${X(-118)},${Y(36.2)}`, stroke: '#d9a54a', 'stroke-width': 3, fill: 'none', 'marker-end': 'url(#fleche)' }, g);
    const defs = S_('defs', {}, svg); const mk = S_('marker', { id: 'fleche', viewBox: '0 0 10 10', refX: 5, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto' }, defs); S_('path', { d: 'M0,0 L10,5 L0,10 z', fill: '#d9a54a' }, mk);
    const Lf = fl.getTotalLength(); fl.style.strokeDasharray = Lf;
    const T = { c: S.t('9'), m: S.t('millions'), f: S.t('17'), a: S.t('atlantique'), p: S.t('pacifique'), g: S.t('golfe'), e: S.t('est'), ap: S.t('appalaches'), r: S.t('rocheuse'), gp: S.t('grandes') };
    const fv = S.avant + VX[10] + .1;
    plan(S, 0, fv + .2, box, { fi: .8, draw: lt => {
      g.style.transform = `scale(${lin(1.05, 1, eio(cl(lt / 6)))})`; g.style.transformOrigin = '50% 50%';
      contour.style.strokeDashoffset = Lc * (1 - eio(cl((lt - T.c + .2) / 1.8)));
      show(sup, up(lt, T.m - .3, .8));
      const pf = up(lt, T.f - .3, .7) * (1 - up(lt, T.a - 1.6, .6)); frP.style.opacity = pf; lFr.style.opacity = pf;
      oceans.forEach((e, i) => show(e, up(lt, [T.a, T.p, T.g][i] - .3, .6)));
      fl.style.strokeDashoffset = Lf * (1 - eio(cl((lt - T.e + .2) / 2.4))); fl.style.opacity = up(lt, T.e - .3, .3);
      zones.forEach((e, i) => show(e, up(lt, [T.ap, T.r, T.gp][i] - .3, .5)));
    } });
    /* quatre paysages, d'est en ouest */
    [['blue-ridge', 'Les Appalaches'], ['ble-kansas', 'Les Grandes Plaines'], ['tetons', 'Les Rocheuses'], ['big-sur-bixby', 'La côte pacifique']].forEach(([f, n], i) => {
      const a = fv + i * 1.0, b = i === 3 ? S.d : a + 1.05;
      photo(S, a, b, IMG + f + '.webp', { fi: .2, fo: i === 3 ? .8 : .05, a: { s: 1.06 }, b: { s: 1.12 }, voiles: ['voile-b'] });
      titre(S, a + .1, b - .05, n, '');
    });
  });

  /* [11] La formation du territoire */
  sequence(11, .5, 2.2, S => {
    const box = $('div');
    const proj = d3.geoAlbers().fitExtent([[330, 150], [1720, 990]], { type: 'FeatureCollection', features: etats.filter(f => !['02', '15', '72', '78', '66', '69', '60'].includes(f.id)) });
    const path = d3.geoPath(proj);
    const pAk = d3.geoConicEqualArea().rotate([154, 0]).center([-2, 58.5]).parallels([55, 65]).scale(proj.scale() * .35).translate([330, 880]);
    const svg = S_('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}` }, box);
    const defs = S_('defs', {}, svg); const cp = S_('clipPath', { id: 'l48' }, defs);
    const l48 = etats.filter(f => !['02', '15', '72', '78', '66', '69', '60'].includes(f.id));
    l48.forEach(f => S_('path', { d: path(f) }, cp));
    l48.forEach(f => S_('path', { d: path(f), fill: '#17191e', stroke: '#2b2f37', 'stroke-width': .8 }, svg));
    const ak = etats.find(f => f.id === '02'); const akP = S_('path', { d: d3.geoPath(pAk)(ak), fill: '#17191e', stroke: '#2b2f37', 'stroke-width': .8 }, svg);
    const MISS = [[-95.2, 49.5], [-95.2, 47.24], [-94.2, 46.35], [-93.27, 44.98], [-91.25, 43.8], [-90.67, 42.5], [-90.57, 41.52], [-91.4, 40.4], [-90.19, 38.63], [-89.52, 37.3], [-89.18, 37.0], [-90.05, 35.15], [-91.06, 33.41], [-90.88, 32.35], [-91.4, 31.56], [-91.63, 31.0]];
    const OUEST_LA = [[-93.85, 28.8], [-93.85, 29.7], [-93.7, 30.1], [-93.7, 31.0], [-94.04, 32.0], [-94.04, 33.55], [-95.0, 33.85], [-96.5, 33.8], [-98.0, 34.1], [-100, 34.56], [-100, 37.75], [-102.0, 38.05], [-104.6, 38.27], [-105.2, 38.45], [-106.3, 39.2]];
    const DIVIDE = [[-106.3, 42.0], [-109.0, 42.0], [-109.7, 43.2], [-110.5, 44.3], [-111.4, 44.6], [-112.8, 44.4], [-113.5, 45.0], [-113.9, 45.7], [-112.5, 46.0], [-112.3, 46.6], [-112.7, 47.5], [-113.8, 48.5], [-114.07, 49.5]];
    const RIO = [[-107.3, 37.8], [-106.0, 37.1], [-105.9, 36.0], [-106.6, 35.1], [-106.9, 34.0], [-107.3, 33.0], [-106.6, 31.9], [-105.0, 30.7], [-104.4, 29.6], [-103.3, 29.0], [-102.4, 29.8], [-101.0, 29.4], [-100.3, 28.6], [-99.5, 27.5], [-99.1, 26.4], [-97.15, 25.95]];
    const GILA = [[-106.6, 31.9], [-107.2, 32.35], [-108.2, 32.55], [-109.05, 32.75], [-110, 32.9], [-111.6, 33.1], [-113, 33.0], [-114.6, 32.73]];
    const ACQ = [
      ['1783', 'Le territoire de 1783', '#5b8fc7', [...MISS, [-85.0, 31.0], [-84.86, 30.7], [-82.2, 30.6], [-81.4, 30.7], [-60, 30.7], [-60, 50], [-95.2, 50]], [-85.5, 38.6]],
      ['1803', 'Louisiane', '#d9a54a', [[-114.07, 49.5], ...MISS, [-91.19, 30.45], [-90.07, 29.95], [-89.25, 29.15], [-89.0, 28.5], [-93.85, 28.5], ...OUEST_LA, ...DIVIDE], [-98, 42]],
      ['1819', 'Floride', '#4f9d8e', [[-91.63, 31.0], [-91.19, 30.45], [-90.1, 30.38], [-89.6, 30.15], [-89.6, 24], [-60, 24], [-60, 30.7], [-81.4, 30.7], [-82.2, 30.6], [-84.86, 30.7], [-85.0, 31.0]], [-82, 28.8]],
      ['1845', 'Texas', '#c8463c', [[-93.85, 25.0], ...OUEST_LA, ...RIO, [-96.5, 25.0]], [-99, 31.5]],
      ['1846', 'Oregon', '#6c9a4a', [[-130, 49.5], [-114.07, 49.5], ...DIVIDE.slice().reverse().slice(0, -1), [-109.0, 42.0], [-130, 42.0]], [-119.5, 45.5]],
      ['1848', 'Cession mexicaine', '#a8643a', [[-130, 42], [-109.0, 42.0], [-106.3, 42.0], [-106.3, 39.2], ...RIO.slice(0, 7), ...GILA.slice(1), [-117.12, 32.53], [-130, 32.53]], [-115, 37.5]],
      ['1853', 'Achat Gadsden', '#c9b28a', [...GILA, [-114.8, 32.4], [-114.8, 30], [-106.6, 30]], [-110.5, 31.0]],
    ];
    const zone = (ring) => { const f = { type: 'Feature', geometry: { type: 'Polygon', coordinates: [[...ring, ring[0]]] } }; if (d3.geoArea(f) > 2 * Math.PI) f.geometry.coordinates[0].reverse(); return f; };
    const gz = S_('g', { 'clip-path': 'url(#l48)' }, svg);
    const Z = ACQ.map(([an, nom, c, ring, ct]) => { const p = S_('path', { d: path(zone(ring)), fill: c, opacity: 0, stroke: 'rgba(0,0,0,.35)', 'stroke-width': 1.2 }, gz); const q = proj(ct);
      const e = $('div', 'etiq', `${an}<small>${nom}</small>`, box); Object.assign(e.style, { left: q[0] + 'px', top: q[1] + 'px', transform: 'translate(-50%,-50%)', textAlign: 'center' }); e.style.opacity = 0; return [p, e]; });
    S_('path', { d: path(topojson.mesh(US, { type: 'GeometryCollection', geometries: US.objects.states.geometries.filter(x => !['02', '15', '72', '78', '66', '69', '60'].includes(x.id)) }, (a, b) => a === b)), fill: 'none', stroke: '#f1ece2', 'stroke-width': 1.6 }, svg);
    const riv = S_('path', { d: path({ type: 'LineString', coordinates: MISS.slice(1).concat([[-91.19, 30.45], [-90.07, 29.95], [-89.25, 29.15]]) }), fill: 'none', stroke: '#9cc0e6', 'stroke-width': 3 }, svg);
    const Lr = riv.getTotalLength(); riv.style.strokeDasharray = Lr;
    const lm = $('div', 'etiq', 'Mississippi', box); const qm = proj([-89.6, 35.6]); Object.assign(lm.style, { left: (qm[0] + 14) + 'px', top: qm[1] + 'px', color: '#9cc0e6' }); lm.style.opacity = 0;
    const qa = d3.geoPath(pAk).centroid(ak); const la = $('div', 'etiq', '1867<small>Alaska</small>', box); Object.assign(la.style, { left: qa[0] + 'px', top: (qa[1] + 70) + 'px', transform: 'translateX(-50%)', textAlign: 'center' }); la.style.opacity = 0;
    const tit = $('div', 'grand', 'La formation<br>du territoire', box); Object.assign(tit.style, { left: '110px', top: '80px', fontSize: '60px' });
    const tz = [S.t('1783'), S.t('1803'), S.t('superficie') + .3, S.t('texas'), S.t('texas') + .7, S.t('mexique'), S.t('1848') + .6];
    const tms = S.t('mississippi'), tak = S.t('alaska'), tdb = S.t('double');
    plan(S, 0, S.d, box, { fi: .7, fo: 1, draw: lt => {
      show(tit, up(lt, .2, .8));
      Z.forEach(([p, e], i) => { const q = up(lt, tz[i] - .3, .7); p.setAttribute('opacity', .82 * q); show(e, q, 10); });
      riv.style.strokeDashoffset = Lr * (1 - eio(cl((lt - tms + 1.4) / 1.6))); lm.style.opacity = up(lt, tms - .2, .5);
      const pd = cl((lt - tdb + .2) / 1.2); Z[1][0].setAttribute('stroke-width', 1.2 + 4 * Math.sin(Math.PI * pd)); Z[1][0].setAttribute('stroke', pd > 0 && pd < 1 ? '#fff3d6' : 'rgba(0,0,0,.35)');
      const qk = up(lt, tak - .3, .7); akP.setAttribute('fill', d3.interpolateRgb('#17191e', '#7fa9c9')(qk)); show(la, qk, 10);
    } });
  });

  /* [12] Le mythe de la Frontier */
  sequence(12, .5, 2.6, S => {
    const tn = S.t('non') - .2, t93 = S.t('1893') - .3, tm = S.t('mais', 2) - .2;
    photo(S, 0, tn, IMG + 'emigrants-darley-1869.webp', { fi: .6, a: { s: 1.03, x: 2 }, b: { s: 1.12, x: -2 }, voiles: ['voile-g'] });
    texte(S, S.t('mythe') - .4, tn, '<span class="kick">Le mythe de la</span><br>Frontier', { left: '120px', top: '360px', fontSize: '140px' });
    credit(S, .5, tn, '<i>F. O. C. Darley, Emigrants crossing the plains</i>, 1869');
    photo(S, tn, t93, IMG + 'emigrants-ouest-1880.webp', { fi: .4, a: { s: 1.1, x: 4 }, b: { s: 1.1, x: -4 }, voiles: ['voile-b'] });
    titre(S, tn + .3, t93, 'La Frontier', 'La zone mouvante où avancent les pionniers');
    tirage(S, t93, tm, IMG + 'turner.webp', { cote: 'gauche', marge: 240 });
    titre(S, t93 + .5, tm, 'Frederick Jackson Turner (1861-1932)', 'The Significance of the Frontier in American History, 1893', { droite: true });
    texte(S, S.t('1890') - .3, tm, '<span class="kick">Recensement de 1890</span><br>La Frontier<br><em>est close</em>', { right: '180px', top: '300px', fontSize: '84px', textAlign: 'right' });
    noir(S, tm, S.d);
  });

  /* ===== Habillage commun : vignette (pas de grain : il alourdit le fichier et brouille l'image) ===== */
  const vg = $('div', null, null, stage); vg.id = 'vignette';

  const DUREE = fin;
  function render(t) {
    const proms = [];
    for (const s of SEQS) {
      const on = t >= s.start && t < s.start + s.d;
      s.el.style.display = on ? 'block' : 'none';
      if (!on) continue;
      const lt = t - s.start;
      for (const l of s.layers) {
        const vis = lt >= l.t0 && lt < l.t1;
        l.el.style.display = vis ? 'block' : 'none';
        if (!vis) continue;
        l.el.style.opacity = Math.min(l.fi ? cl((lt - l.t0) / l.fi) : 1, l.fo ? cl((l.t1 - lt) / l.fo) : 1);
        if (l.draw) { const r = l.draw(lt - l.t0, l.t1 - l.t0, lt); if (r && r.then) proms.push(r); }
      }
    }
    return proms.length ? Promise.all(proms).then(() => null) : null;
  }
  function controle() {
    const err = ERR.slice();
    for (const s of SEQS) for (const l of s.layers) if (l.t1 <= l.t0 + .05) err.push(`séquence ${s.n} : plan vide (${l.t0.toFixed(2)} → ${l.t1.toFixed(2)})`);
    /* trous noirs involontaires : instants sans aucun plan */
    for (const s of SEQS) for (let x = .05; x < s.d; x += .1) if (!s.layers.some(l => x >= l.t0 && x < l.t1)) { err.push(`séquence ${s.n} : aucun plan à ${x.toFixed(1)} s`); break; }
    return err;
  }
  await Promise.all(['300 40px Fraunces', 'italic 300 40px Fraunces', '400 40px Fraunces', '600 20px "Inter Tight"', '400 20px "Inter Tight"', '500 20px "Inter Tight"'].map(f => document.fonts.load(f, 'AÉé')));
  window.VIDEO = { render, duree: DUREE, plans: SEQS.map(s => ({ n: s.n, start: s.start, dur: s.d, voix: s.avant })), controle };
  render(0);
})().catch(e => { window.__erreur = String(e); throw e; });
</script>
