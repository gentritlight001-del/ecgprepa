<!--
  Montage du documentaire du chapitre 2 d'HGG 2e année : les 18 séquences de hgg2-chapitre2-doc-plans.md,
  aux durées du découpage (5 min 25). Rendu : python3 outils/video/generer.py outils/video/hgg2-chapitre2-doc.html <sortie.mp4>
  Chaque séquence est une fonction draw(lt) (lt = temps local en secondes) : aucune horloge, chaque image est calculée.

  Images (toutes libres) :
  - site (deuxieme_annee/hgg/images/) : porte-avions Gerald Ford, panneau Hollywood, Pentagone, Manhattan, Falcon Heavy,
    Capitole, Joseph Nye, Florian Louis, American Progress (John Gast, 1872), Shanghai, Monument Valley, pivots du Kansas,
    Promontory Summit (A. J. Russell, 1869).
  - images/doc-hgg2-ch2/ : NASA Earth Observatory, Black Marble 2012 (Amériques ; États-Unis), domaine public ;
    Library of Congress, « No known restrictions on publication » : Raymond Aron en 1974 (U.S. News & World Report,
    ppmsca 55499), New York Stock Exchange vers 1908 (Detroit Publishing, ds 11716), Emigrants crossing the plains
    (F. O. C. Darley, 1869, cph 3g02634), A harvest of death, Gettysburg (T. O'Sullivan, 1863, ppmsca 12557),
    ruines de Richmond, avril 1865 (ppmsca 34850), Harper's Weekly du 5 juin 1869 (cph 3c16354).
  - cartes : us-atlas@3 et world-atlas@2 (ISC), dans donnees/.
-->
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=block" rel="stylesheet">

<style>

/* Chiffres */

.case.k1 { border-top: 8px solid var(--a1c); } .case.k2 { border-top: 8px solid var(--or); } .case.k3 { border-top: 8px solid #6fa3c7; }

/* Graphique en barres */
.graph { position: absolute; left: 230px; right: 230px; top: 250px; height: 560px; display: flex; align-items: flex-end; justify-content: space-around; border-bottom: 3px solid rgba(243,236,224,.7); }

.fiche h3 { margin-top: 14px; font: 800 54px/1 "Big Shoulders Display"; text-transform: uppercase; color: #1c140f; }

<div id="stage"></div>
<script>
(function () {
  const W = 1920, H = 1080;
  const IMG = '../../deuxieme_annee/hgg/images/', DOC = 'images/doc-hgg2-ch2/';
  const stage = document.getElementById('stage');
  const SC = [];
  const $ = (tag, cls, html, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
  const SVGNS = 'http://www.w3.org/2000/svg';
  const S = (tag, attrs, parent) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const cl = x => Math.max(0, Math.min(1, x));
  const eo = p => 1 - Math.pow(1 - p, 3);
  const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const lin = (a, b, p) => a + (b - a) * p;
  /* apparition : 0 avant a, 1 après a + d */
  const up = (lt, a, d = .8) => eo(cl((lt - a) / d));
  /* présence d'un élément entre a et b (fondu d'entrée et de sortie) */
  const win = (lt, a, b, d = .7) => Math.min(up(lt, a, d), 1 - eio(cl((lt - b + d) / d)));
  const show = (el, p, dy = 26, dx = 0) => { el.style.opacity = p; el.style.transform = `translate(${(1 - p) * dx}px, ${(1 - p) * dy}px)`; };
  /* Ken Burns : de a {s, x, y} à b (x, y en % de la taille), mouvement doux et continu */
  const kb = (el, lt, dur, a, b) => {
    const p = cl(lt / dur), q = lin(0, 1, p * .15 + eio(p) * .85);
    el.style.transform = `translate(${lin(a.x || 0, b.x || 0, q)}%, ${lin(a.y || 0, b.y || 0, q)}%) scale(${lin(a.s, b.s, q)})`;
  };
  const fr = (v, d = 0) => v.toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d }).replace(/ /g, ' ');
  const img = (src, cls, parent) => { const i = $('img', cls, null, parent); i.src = src; i.alt = ''; return i; };
  /* une séquence : n, début, fin (s), construction qui renvoie draw(lt) ; xf = fondu d'entrée */
  function scene(n, t0, t1, build, xf = .6) {
    const el = $('div', 'sc', null, stage);
    SC.push({ n, t0, dur: t1 - t0, xf, el, draw: build(el, t1 - t0) });
  }
  /* plans successifs dans une séquence (fondu enchaîné de f secondes) */
  const plans = (lt, bornes, f = .5) => bornes.map(([a, b], i) => i === 0 ? (lt < b + f ? 1 : 0) : (lt >= a && lt < b + f ? up(lt, a, f) : 0));

  /* ===== Cartes : projections et formes ===== */
  const US = window.US_ATLAS, WORLD = window.WORLD_ATLAS;
  const etats = topojson.feature(US, US.objects.states);
  const nation = topojson.merge(US, US.objects.states.geometries);
  const anneau = pts => { // polygone lon/lat, orienté pour d3 (le plus petit des deux côtés)
    const f = { type: 'Polygon', coordinates: [[...pts, pts[0]]] };
    if (d3.geoArea(f) > 2 * Math.PI) f.coordinates[0].reverse();
    return f;
  };
  function carteUS(svg, ext) {
    const pu = d3.geoAlbersUsa().fitExtent(ext, nation);
    const p48 = d3.geoAlbers().scale(pu.scale()).translate(pu.translate());
    return { pu, p48, gu: d3.geoPath(pu), g48: d3.geoPath(p48) };
  }
  let clipN = 0;
  const clipDe = (svg, d) => { const id = 'clip' + (++clipN); const c = S('clipPath', { id }, svg); S('path', { d }, c); return `url(#${id})`; };
  const MISS = [[-95.2, 47.2], [-93.1, 44.9], [-91.2, 43], [-90.6, 41.5], [-91.4, 40.3], [-90.2, 38.6], [-89.2, 37], [-90, 35.1], [-91.1, 33], [-91.6, 31]];

  /* ================= 1 · 0:00-0:15 · Ouverture ================= */
  scene(1, 0, 15, (el) => {
    const a = $('div', 'lay', null, el), b = $('div', 'lay', null, el), c = $('div', 'lay', null, el);
    const i1 = img(IMG + 'porte-avions-gerald-ford.webp', 'full', a), i2 = img(DOC + 'nyse-1908.webp', 'full', b), i3 = img(IMG + 'panneau-hollywood.webp', 'full', c);
    i2.style.filter = 'sepia(.25) contrast(1.05)';
    [a, b, c].forEach(x => $('div', 'vig', null, x));
    const d2 = $('div', 'doc', 'New York Stock Exchange, Wall Street · Library of Congress', b);
    return lt => {
      const [o1, o2, o3] = plans(lt, [[0, 5], [5, 10], [10, 15]], .45);
      a.style.opacity = o1; b.style.opacity = o2; c.style.opacity = o3;
      kb(i1, lt, 5.5, { s: 1.04, x: 1.5 }, { s: 1.14, x: -1.5 });
      kb(i2, lt - 5, 5.5, { s: 1.12, y: 2 }, { s: 1.04, y: -1 });
      kb(i3, lt - 10, 5, { s: 1.03 }, { s: 1.16, y: -1 });
      d2.style.opacity = win(lt, 5.6, 9.8);
    };
  }, 1.2);

  /* ================= 2 · 0:15-0:40 · Quatre chiffres ================= */
  scene(2, 15, 40, (el) => {
    const L = [['manhattan-liberty-island.webp', 0, 7.5], ['pentagone-arlington.webp', 7.5, 13], ['falcon-heavy-decollage.webp', 13, 19], ['capitole-washington.webp', 19, 25]];
    const lays = L.map(([f]) => { const l = $('div', 'lay', null, el); const i = img(IMG + f, 'full', l); $('div', 'bas', null, l); return [l, i]; });
    lays[1][1].style.objectPosition = '50% 40%';
    const rouge = $('div', 'lay', null, lays[3][0]); rouge.style.background = 'radial-gradient(ellipse at 50% 40%, rgba(120,10,10,.15), rgba(70,0,0,.55))';
    const box = $('div', 'chiffres', null, el);
    const C = [[29200, ' Md$', 'PIB, 1<sup>er</sup> rang mondial (2024)', 2.2], [null, '1/3', 'des dépenses militaires mondiales', 7.6], [341, ' M', 'd\'habitants', 13.2], [40000, ' Md$', 'de dette publique (août 2026)', 18.6]];
    const cs = C.map(([v, u, t], i) => { const d = $('div', 'ch' + (i === 3 ? ' r' : ''), `<b></b><span>${t}</span>`, box); return d; });
    return lt => {
      const op = plans(lt, L.map(x => [x[1], x[2]]), .35);
      lays.forEach(([l, i], k) => { l.style.opacity = op[k]; kb(i, lt - L[k][1], L[k][2] - L[k][1] + .5, { s: 1.06, x: k % 2 ? 1 : -1 }, { s: 1.16, x: k % 2 ? -1 : 1 }); });
      lays[1][1].style.filter = 'none';
      C.forEach(([v, u, t, a], k) => {
        const p = up(lt, a, .6); show(cs[k], p, 30);
        const n = cl((lt - a) / 1.6);
        cs[k].firstChild.textContent = v == null ? u : fr(Math.round(v * eo(n))).replace(/\s/g, ' ') + u;
        cs[k].style.opacity = p * (k < 3 && lt > 18.6 ? lin(1, .55, up(lt, 18.6, .6)) : 1);
      });
    };
  }, .5);

  /* ================= 3 · 0:40-0:50 · Titre et problématique ================= */
  scene(3, 40, 50, (el) => {
    const g = $('div', 'lay', null, el); g.style.background = '#000';
    const i1 = img(DOC + 'terre-nuit-ameriques.webp', 'full', g); i1.style.objectFit = 'contain';
    const u = $('div', 'lay', null, el); const i2 = img(DOC + 'etats-unis-nuit.webp', 'full', u);
    const vo = $('div', 'lay', null, el); vo.style.background = 'radial-gradient(ellipse at 50% 55%, rgba(0,0,0,.15), rgba(0,0,0,.72))';
    const vq = $('div', 'lay', null, el); vq.style.background = 'radial-gradient(ellipse 60% 40% at 50% 46%, rgba(0,0,0,.72), rgba(0,0,0,0))';
    const t = $('div', null, `<div class="kick">HGG · 2<sup>e</sup> année · Chapitre 2</div><div class="titre" style="margin-top:22px">Les États-Unis</div><div class="serif" style="margin-top:22px;font:italic 400 44px Newsreader;color:#f3ece0">Pouvoir de, pouvoir sur, pouvoir limité</div>`, el);
    Object.assign(t.style, { position: 'absolute', left: '0', right: '0', top: '330px', textAlign: 'center' });
    const q = $('div', null, `<div class="serif" style="font:500 66px/1.15 Newsreader;color:#fff">Sur quoi repose la puissance des États-Unis ?</div><div class="serif" style="margin-top:26px;font:italic 400 58px/1.15 Newsreader;color:var(--or)">Cette puissance est-elle en train de décliner ?</div>`, el);
    Object.assign(q.style, { position: 'absolute', left: '180px', right: '180px', top: '400px', textAlign: 'center' });
    const doc = $('div', 'doc', 'La Terre de nuit · NASA, Black Marble 2012', el);
    return lt => {
      kb(i1, lt, 6, { s: 1.0, y: 0 }, { s: 2.4, x: 13, y: 22 });
      u.style.opacity = up(lt, 4.4, 1.4); kb(i2, lt - 4.4, 6, { s: 1.02 }, { s: 1.12, y: -1 });
      t.style.opacity = win(lt, .8, 5.3, .8); t.style.transform = `scale(${lin(.97, 1.02, cl(lt / 5.5))})`;
      vq.style.opacity = up(lt, 5.0, .8); show(q.children[0], up(lt, 5.4, .8), 20); show(q.children[1], up(lt, 7.3, .8), 20);
      doc.style.opacity = win(lt, .5, 9.5);
    };
  }, .25);

  /* ================= 4 · 0:50-1:05 · Raymond Aron ================= */
  scene(4, 50, 65, (el) => {
    const l = $('div', 'lay', null, el); const i = img(DOC + 'aron-1974.webp', 'full', l); i.style.objectPosition = '30% 40%';
    $('div', 'droite', null, l);
    const lt1 = $('div', 'lt', '<b>Raymond Aron</b><span>Philosophe et sociologue · 1905-1983</span>', el);
    const c = $('div', 'coupure', `<div class="scotch"></div><q>« La capacité d'une unité politique d'imposer sa volonté aux autres »</q><span class="suite">… ou de ne pas se laisser imposer la leur.</span><div class="src">Raymond Aron · <i>Paix et guerre entre les nations</i>, 1962</div>`, el);
    Object.assign(c.style, { left: '1060px', top: '250px', width: '780px', transform: 'rotate(1.2deg)' });
    const wrap = $('div', null, null, el); wrap.appendChild(c); Object.assign(wrap.style, { position: 'absolute', inset: 0 });
    const doc = $('div', 'doc', 'Raymond Aron en 1974 · U.S. News & World Report, Library of Congress', el);
    return lt => {
      kb(i, lt, 15, { s: 1.04, x: -4 }, { s: 1.12, x: -6 });
      show(lt1, win(lt, .8, 6.5), 0, -30);
      show(wrap, up(lt, 3.6, .9), 50);
      c.querySelector('.suite').style.opacity = up(lt, 10.4, .8);
      doc.style.opacity = win(lt, .6, 14.4);
    };
  });

  /* ================= 5 · 1:05-1:20 · Serge Sur ================= */
  scene(5, 65, 80, (el) => {
    el.style.background = 'radial-gradient(ellipse at 50% 55%, #2a1418 0%, #0d090b 75%)';
    const h = $('div', 'haut', 'Serge Sur<small>une quadruple capacité</small>', el);
    const svg = S('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}` }, el); svg.style.position = 'absolute';
    const cx = 960, cy = 590;
    const coeur = S('g', {}, svg);
    S('circle', { cx, cy, r: 120, fill: '#7a1e2c', stroke: '#e0a83a', 'stroke-width': 4 }, coeur);
    const tc = S('text', { x: cx, y: cy + 16, 'text-anchor': 'middle', fill: '#fff', 'font-size': 46, 'font-weight': 700 }, coeur); tc.textContent = 'PUISSANCE';
    const B = [['Faire', -1, -1, 'le pouvoir', 0], ['Faire faire', 1, -1, 'l\'influence', 1], ['Empêcher de faire', -1, 1, 'l\'indépendance', 2], ['Refuser de faire', 1, 1, 'l\'indépendance', 2]];
    const T = [4.6, 6.0, 7.5, 9.2];
    const items = B.map(([t, sx, sy, _, sens], k) => {
      const g = S('g', {}, svg);
      const x2 = cx + sx * 470, y2 = cy + sy * 245;
