<body>
<div id="stage"></div>
<script>
(async function () {
  const W = 1920, H = 1080;
  const D2 = '../../deuxieme_annee/hgg/images/', P1 = '../../premiere_annee/hgg/';
  const stage = document.getElementById('stage');
  const ERR = [];
  const $ = (tag, cls, html, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
  const NS = 'http://www.w3.org/2000/svg';
  const S_ = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const cl = x => Math.max(0, Math.min(1, x));
  const eo = p => 1 - Math.pow(1 - p, 3);
  const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const lin = (a, b, p) => a + (b - a) * p;
  const up = (x, a, d = .7) => eo(cl((x - a) / d));
  const show = (el, p, dy = 18) => { el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * dy}px)`; };
  /* typographie française : espaces insécables */
  const typo = s => String(s).replace(/ ([:;!?%»])/g, ' $1').replace(/« /g, '« ').replace(/(\d) (\d{3})/g, '$1 $2');

  /* ===== Tempo : le temps de lire ===== */
  const LECT = 3.0;                                   // mots lus par seconde, texte posé
  const nmots = h => String(h).replace(/<[^>]+>/g, ' ').trim().split(/\s+/).filter(Boolean).length;
  const lire = (h, min = 3) => Math.max(min, 1.2 + nmots(h) / LECT);
  const X = .7;                                       // fondu enchaîné entre deux plans

  /* ===== Séquences et plans ===== */
  const SEQS = []; let fin = 0;
  function sequence(n, nom, build) {
    const el = $('div', 'sq', null, stage);
    const S = { n, nom, el, layers: [], c: 0, start: fin };
    build(S); S.d = S.c + .4; SEQS.push(S); fin += S.d;
  }
  function plan(S, t0, t1, el, o = {}) {
    el.classList.add('ly'); S.el.appendChild(el);
    const l = { t0, t1, el, fi: o.fi ?? .6, fo: o.fo ?? .6, draw: o.draw };
    S.layers.push(l); return l;
  }
  /* phrases à l'écran : chaque phrase reste le temps de la lire, l'une après l'autre */
  function phrases(S, t0, liste, o = {}) {
    let t = t0;
    for (const it of liste) {
      const [k, x] = Array.isArray(it) ? it : [null, it];
      const d = lire((k || '') + ' ' + x);
      const box = $('div'); const st = $('div', 'st ' + (o.cls || ''), `${k ? `<b class="k">${typo(k)}</b>` : ''}<span>${typo(x)}</span>`, box);
      if (o.w) st.style.width = o.w + 'px';
      plan(S, t, t + d, box, { fi: 0, fo: 0, draw: (lt, dd) => { st.style.opacity = Math.min(up(lt, 0, .55), cl((dd - lt) / .45)); st.style.transform = `translateY(${(1 - up(lt, 0, .55)) * 14}px)`; } });
      t += d;
    }
    return t - t0;
  }
  const duree = liste => liste.reduce((s, it) => s + lire(Array.isArray(it) ? (it[0] || '') + ' ' + it[1] : it), 0);
  /* un plan d'images avec ses phrases : le fond dure avant + phrases + après (au moins o.d) */
  function vue(S, fond, liste = [], o = {}) {
    const av = o.avant ?? .7, ap = o.apres ?? .4;
    const d = Math.max(o.d || 0, av + duree(liste) + ap);
    const t0 = S.c, t1 = t0 + d;
    const T = []; let tt = av; for (const it of liste) { T.push(tt); tt += lire(Array.isArray(it) ? (it[0] || '') + ' ' + it[1] : it); }
    fond(t0, t1 + (o.dernier ? 0 : X), d, T);
    phrases(S, t0 + av, liste, o);
    S.c = t1; return [t0, t1];
  }
  /* Ken Burns */
  const kbT = (a, b, p) => { const q = p * .25 + eio(p) * .75; return `translate(${lin(a.x || 0, b.x || 0, q)}%, ${lin(a.y || 0, b.y || 0, q)}%) scale(${lin(a.s, b.s, q)})`; };
  function photo(S, src, liste, o = {}) {
    return vue(S, (t0, t1) => {
      const box = $('div'); const im = $('img', 'full', null, box); im.src = src; im.alt = '';
      if (o.pos) im.style.objectPosition = o.pos;
      if (o.filtre) im.style.filter = o.filtre;
      (o.voiles || ['voile-b']).forEach(v => $('div', v, null, box));
      if (o.credit) $('div', 'doc', typo(o.credit), box);
      const a = o.a || { s: 1.04 }, b = o.b || { s: 1.13 };
      plan(S, t0, t1, box, { fi: o.fi ?? X, fo: o.fo ?? X, draw: (lt, d) => { im.style.transform = kbT(a, b, lt / d); } });
    }, liste, o);
  }
  /* image en hauteur (portrait) : tirage net sur son propre fond flou */
  function tirage(S, src, liste, o = {}) {
    return vue(S, (t0, t1) => {
      const box = $('div'); const f = $('img', 'flou', null, box); f.src = src;
      const t = $('div', 'tirage', null, box); const im = $('img', null, null, t); im.src = src;
      t.style[o.cote === 'droite' ? 'right' : 'left'] = (o.marge ?? 170) + 'px';
      if (o.haut) { t.style.top = o.haut[0] + 'px'; t.style.bottom = o.haut[1] + 'px'; }
      if (o.credit) $('div', 'doc', typo(o.credit), box);
      plan(S, t0, t1, box, { fi: X, fo: X, draw: (lt, d) => { const p = lt / d; t.style.transform = `translateY(${lin(14, -14, p)}px) scale(${lin(1, 1.035, p)})`; f.style.transform = `scale(${lin(1.05, 1.12, p)})`; } });
    }, liste, { cls: o.cote === 'droite' ? 'etroit' : 'droite etroit', ...o });
  }
  /* fond construit à la main (carte, graphique, carton) : build(box) renvoie draw(lt, d) */
  function scene(S, build, liste = [], o = {}) {
    return vue(S, (t0, t1, d, T) => {
      const box = $('div'); const draw = build(box, d, T);
      plan(S, t0, t1, box, { fi: o.fi ?? X, fo: o.fo ?? X, draw });
    }, liste, o);
  }
  const noir = (S, d) => { const t0 = S.c; plan(S, t0, t0 + d + X, $('div'), { fi: 0, fo: 0 }); S.c += d; };

  /* ===== Cartes ===== */
  const WA = window.WORLD_ATLAS_50;
  const pays = topojson.feature(WA, WA.objects.countries).features;
  const F = id => pays.find(f => f.id === id);
  const AMLAT = ['484', '320', '084', '340', '222', '558', '188', '591', '192', '332', '214', '388', '044', '780', '630', '170', '862', '328', '740', '218', '604', '068', '076', '600', '152', '032', '858'];
  const NOMS = { '484': 'Mexique', '076': 'Brésil', '032': 'Argentine', '152': 'Chili', '604': 'Pérou', '170': 'Colombie', '862': 'Venezuela', '068': 'Bolivie', '218': 'Équateur', '600': 'Paraguay', '858': 'Uruguay', '332': 'Haïti', '328': 'Guyana', '591': 'Panama', '192': 'Cuba' };
  /* carte : projection ajustée à un cadre [[lon0, lat0], [lon1, lat1]] dans une zone de l'écran */
  function carte(parent, cadre, zone, o = {}) {
    const bbox = { type: 'Feature', geometry: { type: 'MultiPoint', coordinates: cadre } };
    const proj = (o.proj || d3.geoMercator()).fitExtent(zone, bbox);
    const path = d3.geoPath(proj);
    const svg = S_('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}` }, parent);
    const g = S_('g', {}, svg); const P = {};
    S_('path', { d: path(d3.geoGraticule10()), fill: 'none', stroke: 'rgba(241,236,226,.05)', 'stroke-width': 1 }, g);
    pays.forEach(f => { if (f.id === '010') return; P[f.id] = S_('path', { d: path(f), fill: AMLAT.includes(f.id) ? '#24272e' : '#15171b', stroke: '#363b45', 'stroke-width': .8 }, g); });
    const lab = (html, ll, cls = 'etiq c', dx = 0, dy = 0) => { const q = proj(ll); const e = $('div', cls, html, parent); Object.assign(e.style, { left: (q[0] + dx) + 'px', top: (q[1] + dy) + 'px' }); return e; };
    return { svg, g, P, proj, path, lab };
  }
  const teinte = (el, c0, c1, p) => el && el.setAttribute('fill', d3.interpolateRgb(c0, c1)(p));
  /* arc animé entre deux points (lon, lat) */
  function arc(M, a, b, o = {}) {
    const p = M.proj(a), q = M.proj(b); const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2 - Math.hypot(q[0] - p[0], q[1] - p[1]) * (o.courbe ?? .25);
    const e = S_('path', { d: `M${p[0]},${p[1]} Q${mx},${my} ${q[0]},${q[1]}`, fill: 'none', stroke: o.c || '#d9a54a', 'stroke-width': o.w || 3, 'stroke-linecap': 'round' }, M.svg);
    if (o.tirets) e.setAttribute('stroke-dasharray', o.tirets);
    const L = e.getTotalLength(); if (!o.tirets) { e.style.strokeDasharray = L; e.style.strokeDashoffset = L; }
    return p => { if (o.tirets) e.style.opacity = p; else e.style.strokeDashoffset = L * (1 - p); };
  }
  function point(M, ll, o = {}) {
    const q = M.proj(ll); const c = S_('circle', { cx: q[0], cy: q[1], r: 0, fill: o.c || '#f1ece2' }, M.svg);
    const h = S_('circle', { cx: q[0], cy: q[1], r: 0, fill: 'none', stroke: o.c || '#f1ece2', 'stroke-width': 2 }, M.svg);
    return p => { c.setAttribute('r', (o.r || 7) * p); h.setAttribute('r', (o.r || 7) * (1 + 3 * p)); h.style.opacity = .7 * p * (1 - p * .6); };
  }
  /* barres horizontales : rows = [[nom, valeur, affiché, classe]] */
  function barres(box, rows, o = {}) {
    const hb = $('div', 'hb', rows.map(r => `<div class="l"><div class="n">${typo(r[0])}</div><div class="t"><i class="${r[3] || ''}"></i></div><div class="v">${typo(r[2])}</div></div>`).join(''), box);
    hb.style.top = (o.top || 360) + 'px';
    const max = o.max || Math.max(...rows.map(r => r[1]));
    return lt => [...hb.children].forEach((l, i) => { const p = up(lt, (o.t0 || .8) + i * (o.pas || .9), 1.1); l.querySelector('i').style.width = (rows[i][1] / max * 100 * p) + '%'; l.querySelector('.v').style.opacity = cl(p * 1.6); l.style.opacity = cl(.3 + p * 2); });
  }
  const gtitre = (box, k, t) => $('div', 'gtitre', `<span class="kick">${typo(k)}</span><div>${typo(t)}</div>`, box);
  const gsrc = (box, t) => $('div', 'gsrc', typo(t), box);

  /* ======================================================================
     Les séquences
     ====================================================================== */

  /* [1] Ouverture : Potosí */
  sequence(1, 'Ouverture · Potosí', S => {
    photo(S, D2 + 'cerro-rico-potosi.webp', [['Potosí · Bolivie', 'Au cœur des Andes, une montagne a changé l’histoire du monde.']], { fi: 1.6, avant: 2.2, a: { s: 1.02 }, b: { s: 1.12, y: -1 } });
    photo(S, D2 + 'potosi-gravure-mine-argent.webp', ['En 1545, les Espagnols y découvrent un immense filon d’argent : le <strong>Cerro Rico</strong>.', 'Les Amérindiens y sont soumis au <strong>travail forcé</strong>.'], { credit: '<i>Une mine d’argent à Potosí</i>, gravure, XVIIIe siècle', a: { s: 1.08, x: 3 }, b: { s: 1.18, x: -3 } });
    scene(S, (box, d, T) => {
      const M = carte(box, [[-95, -40], [10, 52]], [[80, 80], [1840, 1000]], { proj: d3.geoNaturalEarth1() });

      const leg = $('div', null, G.map(g => `<div style="opacity:0;display:flex;gap:22px;align-items:flex-start;margin-bottom:34px"><i style="flex:none;width:30px;height:30px;margin-top:6px;background:${g[1]}"></i><div><b style="display:block;font:400 38px/1.15 Fraunces;color:#fff">${typo(g[2])}</b><span style="display:block;margin-top:6px;font:500 21px/1.3 'Inter Tight';color:#b7afa2">${typo(g[3])}</span></div></div>`).join(''), box);
      Object.assign(leg.style, { position: 'absolute', left: '140px', top: '200px', width: '760px' });
      const t = $('div', 'kick', 'Laurent Carroué · des niveaux d’émergence', box); Object.assign(t.style, { position: 'absolute', left: '140px', top: '120px' });
      const gy = M.lab('Guyana<small>croissance record</small>', [-58.9, 4.9], 'etiq', 22, -10);
      const T = [1, 4.8, 8.6, 12.6];
      return lt => { G.forEach((g, i) => { const p = up(lt, T[i], .9); g[0].forEach(id => teinte(M.P[id], '#24272e', g[1], p)); show(leg.children[i], p, 14); }); show(gy, up(lt, 17.5)); teinte(M.P['328'], '#24272e', '#e8d07a', up(lt, 17.2)); };
    }, [], { d: 22.5, fi: 1 });
    scene(S, box => {
      box.style.background = '#08090c';
      const c1 = $('div', 'chiffre', '<b class="o">Guyana</b><span>la croissance la plus rapide du monde, grâce au pétrole offshore exploité depuis 2019 par ExxonMobil</span>', box); Object.assign(c1.style, { left: '200px', top: '280px' });
      const c2 = $('div', 'chiffre', '<b class="r">Haïti</b><span>l’IDH le plus faible du continent ; des gangs contrôlent environ 90 % de Port-au-Prince</span>', box); Object.assign(c2.style, { left: '1000px', top: '280px' });
      return lt => { show(c1, up(lt, .5, .9), 30); show(c2, up(lt, 1.6, .9), 30); };
    }, ['L’émergence est <strong>sélective</strong> : un pays émergé, deux puissances, beaucoup de pays pauvres.'], { avant: 4.4, dernier: true, fo: 1 });
  });

  /* [18] Le Brésil */
  sequence(18, 'Le Brésil', S => {
    photo(S, D2 + 'brasilia-satellite.webp', [['Le Brésil', 'Plus de 210 millions d’habitants, <strong>10e PIB mondial</strong> en 2024 : multiplié par 3 depuis 2000.']], { fi: 1, credit: 'Brasília vue par satellite', a: { s: 1.03 }, b: { s: 1.12 } });
    scene(S, box => {
      box.style.background = '#08090c';
      gtitre(box, 'La « ferme du monde »… et des firmes mondiales', 'Un pays « émergé »');
      const t = $('div', 'tuiles', '<div><b>Vale</b><span>Minerai de fer</span></div><div><b>Petrobras</b><span>Énergie</span></div><div><b>JBS</b><span>1er producteur de viande au monde</span></div><div><b>Embraer</b><span>3e avionneur mondial</span></div>', box);
      Object.assign(t.style, { top: '580px', gridTemplateColumns: 'repeat(4, 1fr)' });
      const a = $('div', 'tuiles', '<div><b>Soja</b><span>1re culture</span></div><div><b>Café</b><span>1er exportateur mondial</span></div><div><b>Viande bovine</b><span>1er exportateur mondial</span></div><div><b>Agro-industrie</b><span>environ un quart du PIB</span></div>', box);
      Object.assign(a.style, { top: '310px', gridTemplateColumns: 'repeat(4, 1fr)' });
      return lt => { [...a.children].forEach((e, i) => show(e, up(lt, .6 + i * .6, .7))); [...t.children].forEach((e, i) => show(e, up(lt, 4 + i * .6, .7))); };
    }, [], { d: 11 });
    photo(S, P1 + 'chapitre-14/images/cop30-belem.webp', [['Belém · novembre 2025', 'La <strong>COP30</strong> en Amazonie : le Brésil se pose en leader climatique et en porte-parole des Suds.'], 'BRICS, G20, Mercosur : une diplomatie « active et altière » sous Lula.'], { a: { s: 1.04 }, b: { s: 1.13 } });
    scene(S, box => {
      box.style.background = '#08090c';
      const c1 = $('div', 'chiffre', '<b class="o">~30 %</b><span>de ses exportations partent vers la Chine</span>', box); Object.assign(c1.style, { left: '200px', top: '300px' });
      const c2 = $('div', 'chiffre', '<b>~20e</b><span>rang mondial de la Bourse de São Paulo</span>', box); Object.assign(c2.style, { left: '1000px', top: '300px' });
      return lt => { show(c1, up(lt, .5, .9), 30); show(c2, up(lt, 1.6, .9), 30); };
    }, ['Mais une <strong>puissance incomplète</strong> : dépendante de la Chine, financièrement secondaire, au soft power surtout régional.'], { avant: 2.6, dernier: true, fo: 1 });
  });

  /* [19] Conclusion */
  sequence(19, 'Conclusion', S => {
    photo(S, D2 + 'cerro-rico-potosi.webp', [['Cinq siècles après Potosí', 'Du cuivre au lithium, l’Amérique latine exporte toujours ses ressources.'], 'Le <strong>modèle exportateur</strong> est à la fois le moteur et le frein de son émergence.'], { fi: 1.2, filtre: 'brightness(.8)', a: { s: 1.14, y: -1 }, b: { s: 1.02 } });
    scene(S, box => {
      box.style.background = '#08090c';
      const t = $('div', 'grand', '<span class="kick">À retenir</span><br>Riche en ressources, l’Amérique latine ne cesse d’<em>émerger</em> sans y parvenir tout à fait.', box); Object.assign(t.style, { left: '160px', right: '160px', top: '260px', fontSize: '70px' });
      const n = $('div', 'tuiles', '<div><b>ISI</b><em>industrialiser en remplaçant les importations</em></div><div><b>Néo-extractivisme</b><em>la rente au service de la redistribution</em></div><div><b>Reprimarisation</b><em>le retour du secteur primaire</em></div><div><b>Malédiction des ressources</b><em>riches en ressources, moins développés</em></div>', box);
      Object.assign(n.style, { top: '660px', gridTemplateColumns: 'repeat(4, 1fr)' });
      return lt => { show(t, up(lt, .4, 1)); [...n.children].forEach((e, i) => show(e, up(lt, 3.4 + i * .7, .7))); };
    }, [], { d: 14 });
    scene(S, box => {
      box.style.background = '#08090c';
      const t = $('div', 'grand', 'ECG Prépa<small>Le cours complet, le résumé et les flashcards du chapitre sur <b style="color:#f5cf86;font-weight:400">ecg-prepa.fr</b></small>', box); Object.assign(t.style, { left: '160px', top: '380px', fontSize: '110px' });
      return lt => show(t, up(lt, .4, 1));
    }, [], { d: 6, fo: 1.6, dernier: true });
  });

  /* ===== Habillage commun ===== */
  const vg = $('div', null, null, stage); vg.id = 'vignette';

  const DUREE = fin;
  function render(t) {
    for (const s of SEQS) {
      const on = t >= s.start && t < s.start + s.d;
      s.el.style.display = on ? 'block' : 'none';
      if (!on) continue;
      const lt = t - s.start;
      for (const l of s.layers) {
        const vis = lt >= l.t0 && lt < l.t1;
        l.el.style.display = vis ? 'block' : 'none';
        if (!vis) continue;
        l.el.style.opacity = Math.min(l.fi ? cl((lt - l.t0) / l.fi) : 1, l.fo ? cl((l.t1 - lt) / l.fo) : 1);
        if (l.draw) l.draw(lt - l.t0, l.t1 - l.t0, lt);
      }
    }
    return null;
  }
  function controle() {
    const err = ERR.slice();
    for (const s of SEQS) for (const l of s.layers) if (l.t1 <= l.t0 + .05) err.push(`séquence ${s.n} : plan vide`);
    for (const s of SEQS) for (let x = .05; x < s.d - .45; x += .1) if (!s.layers.some(l => x >= l.t0 && x < l.t1)) { err.push(`séquence ${s.n} : aucun plan à ${x.toFixed(1)} s`); break; }
    /* texte qui sort de l'écran ou phrase trop longue (plus de 3 lignes) */
    for (const s of SEQS) {
      s.el.style.display = 'block';
      for (const l of s.layers) {
        l.el.style.display = 'block';
        l.el.querySelectorAll('.st span, .grand, .def, .cit, .tuiles, .plan3, .chiffre, .etiq').forEach(e => {
          const r = e.getBoundingClientRect();
          if (r.width && (r.right > W - 30 || r.left < 30 || r.bottom > H - 20 || r.top < 20)) err.push(`séquence ${s.n} : « ${e.textContent.slice(0, 40)} » sort du cadre`);
          if (e.matches('.st span') && r.height > 3.4 * 56) err.push(`séquence ${s.n} : phrase sur plus de 3 lignes : « ${e.textContent.slice(0, 50)} »`);
        });
        l.el.style.display = 'none';
      }
      s.el.style.display = 'none';
    }
    if (/—/.test(document.body.innerText + SEQS.map(s => s.el.innerText).join(''))) err.push('tiret cadratin dans le texte');
    return err;
  }
  await Promise.all(['300 40px Fraunces', 'italic 300 40px Fraunces', '400 40px Fraunces', '600 20px "Inter Tight"', '400 20px "Inter Tight"', '500 20px "Inter Tight"'].map(f => document.fonts.load(f, 'AÉé')));
  window.VIDEO = { render, duree: DUREE, plans: SEQS.map(s => ({ n: s.n, nom: s.nom, start: s.start, dur: s.d, sp: s.nom })), controle };
  render(0);
})().catch(e => { window.__erreur = String(e); throw e; });
</script>
