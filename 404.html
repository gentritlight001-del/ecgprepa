<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — ECG Prépa</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0d0d0f">
<link rel="stylesheet" href="fonts/fonts.css">
<script src="auth.js"></script>
<style>
  :root{
    --bg:#0d0d0f; --border:#2a2a35;
    --accent:#c8a96e; --accent2:#7c9ec9;
    --text:#e8e6e0; --dim:#8a8880; --faint:#4a4845;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:'DM Sans',system-ui,sans-serif;line-height:1.6;
    display:flex;align-items:center;justify-content:center;
    padding:32px 24px;overflow:hidden;
  }
  .orb{position:fixed;border-radius:50%;filter:blur(150px);pointer-events:none;opacity:.09;z-index:0}
  .orb1{width:680px;height:680px;background:var(--accent);top:-320px;right:-240px}
  .orb2{width:560px;height:560px;background:var(--accent2);bottom:-260px;left:-220px}

  main{position:relative;z-index:1;max-width:560px;text-align:center}

  .code{font-family:'DM Mono',monospace;font-size:.78rem;letter-spacing:.24em;text-transform:uppercase;
    color:var(--accent);margin-bottom:22px}
  h1{font-family:'Playfair Display',serif;font-size:clamp(2.2rem,6vw,3.2rem);font-weight:900;
    line-height:1.15;letter-spacing:-.015em;margin-bottom:18px}
  .rule{width:52px;height:1px;background:var(--accent);opacity:.6;margin:0 auto 22px}
  p{font-size:clamp(.92rem,1.6vw,1.02rem);font-weight:300;color:var(--dim);margin-bottom:30px}

  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-block;text-decoration:none;font-size:.9rem;font-weight:500;
    padding:14px 30px;border-radius:10px;font-family:inherit;cursor:pointer;
    transition:filter .2s,transform .2s,box-shadow .2s;border:1px solid var(--accent)}
  .btn.primary{background:var(--accent);color:#12120f}
  .btn.primary:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 12px 30px rgba(200,169,110,.22)}
  .btn.ghost{background:none;color:var(--text);border-color:var(--border)}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent)}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="orb orb1"></div><div class="orb orb2"></div>

<main>
  <div class="code">Erreur 404</div>
  <h1>Cette page n'existe pas (ou plus)</h1>
  <div class="rule"></div>
  <p>Le lien est peut-être mal orthographié, périmé, ou la fiche a été déplacée. Vérifie l'adresse,
    ou repars depuis l'accueil.</p>
  <div class="actions">
    <a class="btn primary" id="accueilBtn" href="accueil.html">Retour à l'accueil</a>
    <a class="btn ghost" href="contact.html">Signaler un lien cassé</a>
  </div>
</main>

<script>
/* Si un compte est déjà connu sur cet appareil, on renvoie directement
   vers l'espace membre plutôt que la vitrine publique. */
(function(){
  try {
    var p = window.ECGAuth && window.ECGAuth.current();
    if (p && p.prenom) {
      document.getElementById('accueilBtn').textContent = 'Retour à mon espace';
      document.getElementById('accueilBtn').href = 'index.html';
    }
  } catch (e) {}
})();
</script>
</body>
</html>
