<!DOCTYPE html>
<html lang="fr">
<head>
<script src="auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECG Prépa — Mes favoris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="favoris.js"></script>
<style>
  :root{
    --bg:#0d0d0f; --surface:#16161a; --surface2:#1e1e24; --border:#2a2a35;
    --accent:#c8a96e; --accent2:#7c9ec9; --accent4:#c97c9e;
    --text:#e8e6e0; --text-dim:#8a8880; --text-faint:#4a4845;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}

  .bg-orb{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;opacity:.09;z-index:0}
  .orb1{width:700px;height:700px;background:var(--accent);top:-300px;right:-250px}
  .orb2{width:600px;height:600px;background:var(--accent2);bottom:-250px;left:-250px}

  nav{display:flex;align-items:center;justify-content:space-between;padding:18px 48px;
    border-bottom:1px solid var(--border);background:rgba(13,13,15,.9);backdrop-filter:blur(16px);
    position:sticky;top:0;z-index:100}
  .nav-logo{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;color:var(--accent);cursor:pointer;letter-spacing:.02em}
  .breadcrumb{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--text-dim);flex-wrap:wrap}
  .breadcrumb span{cursor:pointer;transition:color .2s}
  .breadcrumb span:hover{color:var(--accent)}
  .breadcrumb .sep{color:var(--text-faint)}
  .breadcrumb .current{color:var(--text);cursor:default}

  .page-header{padding:60px 64px 40px;border-bottom:1px solid var(--border);position:relative;z-index:1}
  .page-header::after{content:'';position:absolute;bottom:-1px;left:64px;width:60px;height:2px;background:var(--accent)}
  .page-eyebrow{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;font-weight:500;font-family:'DM Mono',monospace}
  .page-title{font-family:'Playfair Display',serif;font-size:clamp(2rem,4vw,3.2rem);font-weight:900;color:var(--text)}
  .page-count{margin-top:14px;font-family:'DM Mono',monospace;font-size:.75rem;letter-spacing:.08em;color:var(--text-faint)}

  main{padding:48px 64px 96px;position:relative;z-index:1}

  .fav-section{margin-bottom:56px}
  .fav-section-head{display:flex;align-items:center;gap:16px;margin-bottom:24px}
  .fav-section-title{font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--sec,var(--accent));white-space:nowrap}
  .fav-section-line{flex:1;height:1px;background:var(--border)}
  .fav-section-n{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--text-faint)}

  .fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}

  .actu-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px;
    cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
  .actu-card:hover{border-color:var(--card-color,var(--accent));background:var(--surface2);transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.3)}
  .actu-card-img-wrap{margin:-20px -22px 14px;overflow:hidden;border-radius:13px 13px 0 0;aspect-ratio:16/9}
  .actu-card-img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}
  .actu-card:hover .actu-card-img{transform:scale(1.04)}
  .actu-card-meta{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .actu-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.68rem;font-weight:500;font-family:'DM Mono',monospace;letter-spacing:.05em;background:var(--surface2);color:var(--text-dim)}
  .actu-card-title{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;color:var(--text);line-height:1.35}

  .fav-remove{position:absolute;top:10px;right:10px;z-index:6;width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;
    background:rgba(13,13,15,.72);border:1px solid rgba(200,169,110,.55);color:var(--accent);
    backdrop-filter:blur(8px);padding:0;transition:color .2s,border-color .2s,background .2s,transform .18s}
  .fav-remove svg{fill:currentColor;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
  .fav-remove:hover{color:#e08a8a;border-color:rgba(224,138,138,.6);background:rgba(224,138,138,.12);transform:scale(1.1)}
  .fav-remove:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .empty{text-align:center;padding:96px 24px;position:relative;z-index:1}
  .empty svg{width:44px;height:44px;fill:none;stroke:var(--text-faint);stroke-width:1.3;stroke-linejoin:round;margin-bottom:20px}
  .empty-line{width:40px;height:2px;background:var(--border);margin:0 auto 22px}
  .empty h2{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;color:var(--text);margin-bottom:10px}
  .empty p{font-size:.88rem;color:var(--text-dim);max-width:420px;margin:0 auto 28px;line-height:1.65;font-weight:300}
  .empty-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .empty-links a{text-decoration:none;border:1px solid var(--border);border-radius:10px;padding:11px 20px;
    font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--text-dim);transition:all .2s}
  .empty-links a:hover{border-color:var(--accent);color:var(--accent);background:var(--surface)}

  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  .fade-up{animation:fadeUp .4s ease forwards}

  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

  @media (max-width:900px){
    nav{padding:14px 20px}
    .page-header{padding:40px 24px 28px}
    .page-header::after{left:24px}
    main{padding:32px 20px 64px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<nav>
  <div class="nav-logo" onclick="location.href='index.html'">ECG Prépa</div>
  <div class="breadcrumb">
    <span onclick="location.href='index.html'">Accueil</span>
    <span class="sep">/</span>
    <span class="current">Mes favoris</span>
  </div>
</nav>

<div class="page-header">
  <div class="page-eyebrow">★ Ta sélection</div>
  <div class="page-title">Mes favoris</div>
  <div class="page-count" id="count"></div>
</div>

<main id="out"></main>

<script>
(function(){
  var F = window.ECGFav;
  var out = document.getElementById('out');
  var countEl = document.getElementById('count');

  var SECTIONS = [
    { key:'cg',   label:'Culture Générale', color:'#7c9ec9' },
    { key:'actu', label:'Actualité',        color:'#c97c9e' }
  ];

  var STAR = '<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">' +
    '<path d="M12 2.8l2.85 5.77 6.37.93-4.61 4.49 1.09 6.35L12 17.34l-5.7 3 1.09-6.35L2.78 9.5l6.37-.93z"/></svg>';

  function esc(s){
    return String(s||'').replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  function render(){
    var favs = F.all();
    countEl.textContent = favs.length
      ? favs.length + (favs.length > 1 ? ' fiches enregistrées' : ' fiche enregistrée')
      : '';

    if (!favs.length){
      out.innerHTML =
        '<div class="empty">' +
          '<svg viewBox="0 0 24 24"><path d="M12 2.8l2.85 5.77 6.37.93-4.61 4.49 1.09 6.35L12 17.34l-5.7 3 1.09-6.35L2.78 9.5l6.37-.93z"/></svg>' +
          '<div class="empty-line"></div>' +
          '<h2>Rien en favoris pour l\'instant</h2>' +
          '<p>Clique sur l\'étoile en haut à droite d\'une fiche de culture générale ou d\'un article d\'actualité pour la retrouver ici.</p>' +
          '<div class="empty-links">' +
            '<a href="culture-generale.html">Culture Générale</a>' +
            '<a href="actualites/actualites.html">Actualité</a>' +
          '</div>' +
        '</div>';
      return;
    }

    out.innerHTML = '';
    var n = 0;

    SECTIONS.forEach(function(sec){
      var items = favs.filter(function(f){ return f.section === sec.key; })
                      .sort(function(a,b){ return b.ajoute - a.ajoute; });
      if (!items.length) return;

      var wrap = document.createElement('section');
      wrap.className = 'fav-section';
      wrap.style.setProperty('--sec', sec.color);
      wrap.innerHTML =
        '<div class="fav-section-head">' +
          '<div class="fav-section-title">' + sec.label + '</div>' +
          '<div class="fav-section-line"></div>' +
          '<div class="fav-section-n">' + items.length + '</div>' +
        '</div><div class="fav-grid"></div>';

      var grid = wrap.querySelector('.fav-grid');

      items.forEach(function(f, i){
        var card = document.createElement('div');
        card.className = 'actu-card fade-up';
        card.style.setProperty('--card-color', sec.color);
        card.style.animationDelay = (n + i) * 40 + 'ms';

        var img = f.image
          ? '<div class="actu-card-img-wrap"><img class="actu-card-img" src="' + esc(f.image) + '" alt="" loading="lazy" onerror="this.parentElement.remove()"></div>'
          : '';
        var badges = '';
        if (f.meta)  badges += '<span class="actu-badge">' + esc(f.meta) + '</span>';
        if (f.theme) badges += '<span class="actu-badge" style="color:' + sec.color + '">' + esc(f.theme) + '</span>';

        card.innerHTML = img +
          (badges ? '<div class="actu-card-meta">' + badges + '</div>' : '') +
          '<div class="actu-card-title">' + esc(f.titre) + '</div>' +
          '<button type="button" class="fav-remove" title="Retirer des favoris" aria-label="Retirer des favoris">' + STAR + '</button>';

        card.addEventListener('click', function(){ if (f.url) location.href = f.url; });
        card.querySelector('.fav-remove').addEventListener('click', function(e){
          e.stopPropagation();
          F.remove(f.id);
          render();
        });

        grid.appendChild(card);
      });

      n += items.length;
      out.appendChild(wrap);
    });
  }

  render();
})();
</script>
</body>
</html>
