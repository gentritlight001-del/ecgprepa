  };
  var etat = { q: '', th: '' };
  var $ = function (id) { return document.getElementById(id); };
  function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function surligne(t) {
    if (!etat.q) return esc(t);
    var i = norm(t).indexOf(norm(etat.q));
    if (i < 0) return esc(t);
    return esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + etat.q.length)) + '</mark>' + esc(t.slice(i + etat.q.length));
  }
  var DOSSIERS = CG_DATA.map(function (a, i) { return { a: a, n: i + 1 }; }).reverse();

  function filtre(sansTheme) {
    var q = norm(etat.q);
    return DOSSIERS.filter(function (d) {
      return (sansTheme || !etat.th || d.a.domain === etat.th) &&
             (!q || norm(d.a.titre + ' ' + d.a.theme).indexOf(q) >= 0);
    });
  }
  function themes() {
    var T = filtre(true), c = {}, lib = {};
    T.forEach(function (d) { c[d.a.domain] = (c[d.a.domain] || 0) + 1; lib[d.a.domain] = d.a.theme; });
    $('ta-themes').innerHTML = '<button type="button" class="ta-th" data-d="" aria-pressed="' + !etat.th + '">Tous les thèmes <span>' + T.length + '</span></button>' +
      Object.keys(c).sort(function (x, y) { return c[y] - c[x]; }).map(function (d) {
        return '<button type="button" class="ta-th" data-d="' + esc(d) + '" style="--t:' + (THEMES[d] || '#888') + '" aria-pressed="' + (etat.th === d) + '"><i></i>' + esc(lib[d]) + ' <span>' + c[d] + '</span></button>';
      }).join('');
  }
  function carte(d) {
    var a = d.a, n = ('00' + d.n).slice(-3);
    return '<a class="actu-card" href="' + esc(a.externalUrl) + '">' +
      '<img class="ta-img" src="' + esc(a.image) + '" alt="" loading="lazy">' +
      '<div class="ta-tx"><div class="ta-meta"><span class="ia-lieu">Dossier n° ' + n + '</span>' +
      '<span class="ia-theme" style="--t:' + (THEMES[a.domain] || '#888') + '">' + esc(a.theme) + '</span></div>' +
      '<div class="actu-card-title">' + surligne(a.titre) + '</div></div></a>';
  }
  function rendu() {
    themes();
    var l = filtre(), actif = etat.q || etat.th, h = '';
    if (!l.length) {
      $('cg-grid').innerHTML = '<div class="ta-vide"><h2>Aucun dossier</h2><p>Aucun dossier ne correspond.</p><button type="button" id="ta-raz">Tout afficher</button></div>';
      $('ta-raz').onclick = function () { etat = { q: '', th: '' }; $('ta-q').value = ''; $('ta-efface').hidden = true; rendu(); };
      return;
    }
    if (actif) {
      h = '<p class="ta-resume"><b>' + l.length + '</b> dossier' + (l.length > 1 ? 's' : '') + (etat.q ? ' · « ' + esc(etat.q) + ' »' : '') + '</p>' +
        '<section class="ta-bloc"><div class="ta-grille">' + l.map(carte).join('') + '</div></section>';
    } else {
      h = '<section class="ta-bloc"><h2>Les plus récents</h2><div class="ta-recents">' + l.slice(0, 3).map(carte).join('') + '</div></section>' +
        '<section class="ta-bloc"><h2>Tous les dossiers</h2><div class="ta-grille">' + l.slice(3).map(carte).join('') + '</div></section>';
    }
    $('cg-grid').innerHTML = h;
  }
  $('ta-q').addEventListener('input', function (e) { etat.q = e.target.value.trim(); $('ta-efface').hidden = !etat.q; rendu(); });
  $('ta-efface').addEventListener('click', function () { $('ta-q').value = ''; etat.q = ''; $('ta-efface').hidden = true; rendu(); $('ta-q').focus(); });
  $('ta-themes').addEventListener('click', function (e) {
    var b = e.target.closest('.ta-th');
    if (!b) return;
    etat.th = b.getAttribute('data-d');
    rendu();
  });
  rendu();
})();
</script>
</body>
</html>
