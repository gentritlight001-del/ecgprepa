  .breadcrumb .current { color: var(--text); cursor: default; }

  .actu-sidebar { width: 220px; min-width: 220px; border-right: 1px solid var(--border); padding: 28px 18px; background: var(--surface); overflow-y: auto; }
  .actu-main { flex: 1; overflow-y: auto; padding: 40px 48px; }
  .actu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }

  /* Cards */
  .actu-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px 26px; cursor: pointer; transition: all 0.25s; position: relative; overflow: hidden; }

  .actu-card.title-only .actu-card-meta { margin-bottom: 10px; }
  .actu-card.title-only .actu-card-title { font-size: 1rem; margin-bottom: 0; }
  .actu-card-img-wrap { margin: -28px -26px 16px -26px; overflow: hidden; border-radius: 13px 13px 0 0; aspect-ratio: 16/9; }
  .actu-card.title-only .actu-card-img-wrap { margin: -20px -22px 14px -22px; }
  .actu-card-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
  .actu-card:hover .actu-card-img { transform: scale(1.04); }

  .cg-filter-btn { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 0.82rem; color: var(--text-dim); transition: all 0.2s; margin-bottom: 3px; }

let currentDomain = 'tous';
let currentQuery = '';

function normalize(str) {
  return (str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function onSearch(val) {
  currentQuery = val.trim();
  const clearBtn = document.getElementById('search-clear');
  clearBtn.style.display = currentQuery ? 'block' : 'none';
  buildGrid();
}

function clearSearch() {
  const input = document.getElementById('search-input');
  input.value = '';
  currentQuery = '';
  document.getElementById('search-clear').style.display = 'none';
  input.focus();
  buildGrid();
}

function filterCG(domain, e) {
  document.querySelectorAll('.domain-btn').forEach(b => b.classList.remove('active'));
  if (e && e.currentTarget) e.currentTarget.classList.add('active');
  currentDomain = domain;
  buildGrid();
}

function buildGrid() {
  const grid = document.getElementById('cg-grid');
  let data = [...CG_DATA];

  if (currentDomain !== 'tous') {
    data = data.filter(d => d.domain === currentDomain);
  }

  if (currentQuery) {
    const q = normalize(currentQuery);
    data = data.filter(d =>
      normalize(d.titre).includes(q) ||
      normalize(d.theme).includes(q)
    );
  }

  const countEl = document.getElementById('search-count');

  if (!data.length) {
    if (countEl) countEl.innerHTML = '';
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        <div class="es-flag">${currentQuery ? '🔍' : '📚'}</div>
        <div class="es-line"></div>
        <div class="es-title">${currentQuery ? 'Aucun résultat' : 'Aucune fiche dans ce thème'}</div>
        <div class="es-sub">${currentQuery ? `Aucune fiche ne correspond à « ${currentQuery} »` : 'Essayez un autre filtre'}</div>
      </div>`;
    return;
  }

  if (countEl) {
    if (currentQuery) {
      countEl.innerHTML = `<span class="hl">${data.length}</span> résultat${data.length > 1 ? 's' : ''} pour « ${currentQuery} »`;
    } else {
      countEl.innerHTML = '';
    }
  }

  // Les nouvelles fiches sont ajoutées à la fin du tableau CG_DATA :
  // on inverse donc l'ordre pour que la dernière ajoutée apparaisse en premier.
  data = data.reverse();

  const themeColors = {
    'Philosophie':    '#c8a96e',
    'Politique':      '#7c9ec9',
    'Économie':       '#e8c84a',
    'Société':        '#c97c9e',
    'Histoire':       '#e07a3a',
    'Géopolitique':   '#9ecba0',
    'Culture & Arts': '#ce93d8',
    'Sciences':       '#4db6ac',
    'Sport':          '#0d7a3a',
    'Environnement':  '#5bbfa8',
    'Organisations':  '#8c8fd6',
    'Entreprise':     '#d68f5a',
  };

  grid.innerHTML = '';

  data.forEach((a, i) => {
    const color = themeColors[a.theme] || 'var(--accent)';
    const card = document.createElement('div');
    card.className = 'actu-card title-only fade-up';
    card.style.cssText = `--card-color:${color}; animation-delay:${i * 40}ms`;

    const imgHtml = a.image
      ? `<div class="actu-card-img-wrap"><img class="actu-card-img" src="${a.image}" alt="${a.titre}" loading="lazy" onerror="this.parentElement.style.display='none'"></div>`
      : '';

    card.innerHTML =
      imgHtml +
      `<div class="actu-card-meta">` +
      `<span class="actu-badge theme" style="color:${color}">${a.theme}</span>` +
      `</div>` +
      `<div class="actu-card-title">${a.titre}</div>`;

    card.onclick = () => a.externalUrl ? window.location.href = a.externalUrl : null;
    grid.appendChild(card);
  });
}

buildGrid();
</script>
