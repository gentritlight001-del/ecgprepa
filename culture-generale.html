<style>
  /* Culture générale : index « mosaïque », choisi par le propriétaire sur maquette (en-tête et « une » façon M5,
     filtres et grille façon M2). Cohérent avec le gabarit bento des dossiers : fond clair, cartes arrondies,
     chaque dossier à sa couleur (g et g2 dans CG_DATA). Tout vient de CG_DATA, plus bas : un nouveau dossier
     s'ajoute à la fin de CG_DATA, avec sa couleur, rien d'autre. Les cartes gardent .actu-card /
     .actu-card-title (badge Premium d'auth.js, étoile de favoris.js). */
  :root { --bg:#f3efec; --ink:#1e1610; --line:#e3ddd9; --dim:#6a625c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); font-family:'DM Sans',system-ui,sans-serif; line-height:1.5; min-height:100vh; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }
  img { display:block; }
  mark { background:#f2d58a; color:inherit; padding:0 1px; border-radius:2px; }
  h1,h2,h3 { font-family:'Bricolage Grotesque','DM Sans',sans-serif; }
  .pg { max-width:1240px; margin:0 auto; padding:30px 24px 90px; }

  /* En-tête */
  .h { display:flex; flex-wrap:wrap; gap:16px 40px; align-items:flex-end; justify-content:space-between; margin-bottom:24px; }
  .h .k { font:500 12px 'DM Mono',monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); margin-bottom:10px; }
  .h h1 { font-weight:800; font-size:clamp(44px,6.4vw,76px); line-height:.95; letter-spacing:-.035em; }
  .h p.l { color:var(--dim); max-width:500px; font-size:17px; margin-top:12px; }
  .stats { display:flex; gap:10px; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:18px; padding:12px 18px; min-width:110px; }
  .stat b { display:block; font:800 30px/1 'Bricolage Grotesque',sans-serif; letter-spacing:-.02em; }
  .stat span { font-size:12.5px; color:var(--dim); }

  /* La une : le dernier dossier en grand, les deux précédents à côté */
  .une { display:grid; grid-template-columns:8fr 4fr; gap:14px; margin-bottom:26px; }
  .big, .mini { position:relative; overflow:hidden; color:#fff; background:var(--g); display:flex; align-items:flex-end; }
  .big { border-radius:26px; min-height:360px; }
  .mini { border-radius:24px; min-height:170px; }
  .big img, .mini img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .big::after { content:''; position:absolute; inset:0; background:linear-gradient(to top,var(--g) 0%,color-mix(in srgb,var(--g) 60%,transparent) 40%,transparent 78%); }
  .mini::after { content:''; position:absolute; inset:0; background:linear-gradient(to top,var(--g),color-mix(in srgb,var(--g) 40%,transparent) 55%,transparent); }
  .big .in { position:relative; z-index:1; padding:28px 30px; width:100%; }
  .mini .in { position:relative; z-index:1; padding:16px 20px; }
  .side { display:grid; gap:14px; }
  .badge { display:inline-flex; align-items:center; border-radius:99px; padding:4px 11px; font:600 12px 'DM Sans',sans-serif; }
  .badge.new { background:#fff; color:var(--g); }
  .badge.f { background:rgba(255,255,255,.22); color:#fff; backdrop-filter:blur(6px); }
  .big .actu-card-title { display:block; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:clamp(28px,3.6vw,44px); line-height:1.03; letter-spacing:-.025em; margin:12px 0 16px; max-width:640px; }
  .go { display:inline-block; background:#fff; color:var(--g); border-radius:99px; padding:9px 20px; font-weight:600; font-size:14px; }
  .mini .no { font:500 11px 'DM Mono',monospace; opacity:.9; letter-spacing:.08em; text-transform:uppercase; }
  .mini .actu-card-title { display:block; font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:19px; line-height:1.1; margin-top:4px; letter-spacing:-.01em; }

  /* Recherche et thèmes */
  .srch { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:99px; padding:0 18px; height:48px; max-width:460px; position:relative; }
  .srch svg { color:var(--dim); flex:none; }
  .srch input { flex:1; border:0; outline:0; background:none; font:400 16px 'DM Sans',sans-serif; color:var(--ink); min-width:0; }
  .srch input::-webkit-search-cancel-button { display:none; }
  .efface { border:0; background:none; font-size:22px; line-height:1; color:var(--dim); cursor:pointer; width:28px; height:28px; }
  .pills { display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 8px; }
  .pill { border:1px solid var(--line); background:#fff; border-radius:99px; padding:7px 14px; font:500 13.5px 'DM Sans',sans-serif; cursor:pointer; color:var(--ink); }
  .pill b { font-weight:500; color:var(--dim); margin-left:5px; }
  .pill[aria-pressed="true"] { background:var(--ink); color:#fff; border-color:var(--ink); }
  .pill[aria-pressed="true"] b { color:#bbb; }
  .compte { font:500 13px 'DM Mono',monospace; color:var(--dim); margin:4px 2px 16px; }

  /* La grille */
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .c { background:#fff; border:1px solid var(--line); border-bottom:4px solid var(--g); border-radius:20px; overflow:hidden; display:flex; flex-direction:column; transition:transform .18s, box-shadow .18s; position:relative; }
  .c:hover { transform:translateY(-3px); box-shadow:0 10px 26px rgba(30,22,16,.1); }
  .c .im { aspect-ratio:3/2; position:relative; background:var(--g2); }
  .c .im img { width:100%; height:100%; object-fit:cover; }
  .c .no { position:absolute; left:10px; top:10px; background:#fff; color:var(--g); border-radius:99px; padding:3px 10px; font:500 11.5px 'DM Mono',monospace; }
  .c .b { padding:14px 16px 16px; display:flex; flex-direction:column; gap:9px; flex:1; }
  .c .actu-card-title { font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:16.5px; line-height:1.18; letter-spacing:-.005em; }
  .c .chip { align-self:flex-start; margin-top:auto; display:inline-block; padding:3px 10px; border-radius:99px; font:600 11.5px 'DM Sans',sans-serif; background:var(--g2); color:var(--g); }
  .vide { grid-column:1 / -1; padding:50px 18px; text-align:center; color:var(--dim); }
  .vide button { margin-top:12px; min-height:40px; padding:0 18px; border:1.5px solid var(--ink); border-radius:99px; background:none; font:inherit; color:var(--ink); cursor:pointer; }

  @media (max-width:1100px) { .grid { grid-template-columns:repeat(3,1fr); } }
  @media (max-width:900px) { .une { grid-template-columns:1fr; } .stats { display:none; } }
  @media (max-width:800px) { .grid { grid-template-columns:repeat(2,1fr); gap:10px; } .pg { padding:22px 16px 70px; } }
  @media (max-width:480px) { .grid { grid-template-columns:1fr; } .big { min-height:300px; } .big .in { padding:22px 20px; } }
</style>

/* Le dernier dossier (dernière entrée de CG_DATA) et les deux précédents en « une », puis la grille de tous les
   dossiers, du plus récent au plus ancien, avec filtre par thème et recherche. */
(function () {
  'use strict';
  var etat = { q: '', th: '' };
  function $(id) { return document.getElementById(id); }
  function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function surligne(t) {
    if (!etat.q) return esc(t);
    var i = norm(t).indexOf(norm(etat.q));
    if (i < 0) return esc(t);
    return esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + etat.q.length)) + '</mark>' + esc(t.slice(i + etat.q.length));
  }
  function numero(n) { return ('00' + n).slice(-3); }
  function couleurs(a) { return '--g:' + esc(a.g || '#1e1610') + ';--g2:' + esc(a.g2 || '#ece6e1'); }

  var DOSSIERS = CG_DATA.filter(function (a) { return a && a.externalUrl; })
    .map(function (a, i) { return { a: a, n: i + 1 }; }).reverse();
  $('nbDossiers').textContent = DOSSIERS.length;
  $('nbThemes').textContent = DOSSIERS.reduce(function (s, x) { if (s.l.indexOf(x.a.domain) < 0) s.l.push(x.a.domain); return s; }, { l: [] }).l.length;

  // La une
  var u = DOSSIERS[0];
  if (u) {
    $('une').innerHTML =
      '<a class="actu-card big" href="' + esc(u.a.externalUrl) + '" style="' + couleurs(u.a) + '">' +
        (u.a.image ? '<img src="' + esc(u.a.image) + '" alt="">' : '') +
        '<span class="in"><span class="badge new">Nouveau</span> <span class="badge f">Dossier n°&nbsp;' + numero(u.n) + ' · ' + esc(u.a.theme) + '</span>' +
          '<span class="actu-card-title">' + esc(u.a.titre) + '</span>' +
          '<span class="go">Ouvrir le dossier →</span></span>' +
      '</a>' +
      '<div class="side">' + DOSSIERS.slice(1, 3).map(function (x) {
        return '<a class="actu-card mini" href="' + esc(x.a.externalUrl) + '" style="' + couleurs(x.a) + '">' +
          (x.a.image ? '<img src="' + esc(x.a.image) + '" alt="" loading="lazy">' : '') +
          '<span class="in"><span class="no">N°&nbsp;' + numero(x.n) + ' · ' + esc(x.a.theme) + '</span>' +
          '<span class="actu-card-title">' + esc(x.a.titre) + '</span></span></a>';
      }).join('') + '</div>';
  }

  function filtre(sansTheme) {
    var q = norm(etat.q);
    return DOSSIERS.filter(function (x) {
      return (sansTheme || !etat.th || x.a.domain === etat.th) &&
             (!q || norm(x.a.titre + ' ' + x.a.theme + ' ' + numero(x.n)).indexOf(q) >= 0);
    });
  }
  function themes() {
    var T = filtre(true), c = {}, lib = {};
    T.forEach(function (x) { c[x.a.domain] = (c[x.a.domain] || 0) + 1; lib[x.a.domain] = x.a.theme; });
    $('themes').innerHTML = '<button type="button" class="pill" data-d="" aria-pressed="' + !etat.th + '">Tous<b>' + T.length + '</b></button>' +
      Object.keys(c).sort(function (a, b) { return lib[a].localeCompare(lib[b], 'fr'); }).map(function (k) {
        return '<button type="button" class="pill" data-d="' + esc(k) + '" aria-pressed="' + (etat.th === k) + '">' + esc(lib[k]) + '<b>' + c[k] + '</b></button>';
      }).join('');
  }
  function carte(x) {
    var a = x.a;
    return '<a class="actu-card c" href="' + esc(a.externalUrl) + '" style="' + couleurs(a) + '">' +
      '<span class="im">' + (a.image ? '<img src="' + esc(a.image) + '" alt="" loading="lazy">' : '') + '<span class="no">n°&nbsp;' + numero(x.n) + '</span></span>' +
      '<span class="b"><span class="actu-card-title">' + surligne(a.titre) + '</span>' +
      '<span class="chip">' + esc(a.theme) + '</span></span></a>';
  }
  function rendu() {
    themes();
    var l = filtre();
    $('compte').textContent = (etat.q || etat.th) ? l.length + ' sur ' + DOSSIERS.length + ' dossiers' : DOSSIERS.length + ' dossiers, du plus récent au plus ancien';
    if (!l.length) {
      $('registre').innerHTML = '<div class="vide">Aucun dossier ne correspond.<br><button type="button" id="raz">Tout afficher</button></div>';
      $('raz').onclick = function () { etat = { q: '', th: '' }; $('q').value = ''; $('efface').hidden = true; rendu(); };
      return;
    }
    $('registre').innerHTML = l.map(carte).join('');
  }
  $('q').addEventListener('input', function (e) { etat.q = e.target.value.trim(); $('efface').hidden = !etat.q; rendu(); });
  $('efface').addEventListener('click', function () { $('q').value = ''; etat.q = ''; $('efface').hidden = true; rendu(); $('q').focus(); });
  $('themes').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    etat.th = b.getAttribute('data-d') === etat.th ? '' : b.getAttribute('data-d');
    rendu();
  });
  rendu();
})();
</script>
