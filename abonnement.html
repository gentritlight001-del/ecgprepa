<!DOCTYPE html>
<html lang="fr">
<head>
<script src="auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECG Prépa — Mon abonnement</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{
    --bg:#0d0d0f; --surface:#16161a; --surface2:#1e1e24; --border:#2a2a35;
    --accent:#c8a96e; --accent2:#7c9ec9; --green:#9ecba0; --danger:#e08a8a;
    --text:#e8e6e0; --text-dim:#8a8880; --text-faint:#4a4845;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}

  .bg-orb{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;opacity:.09;z-index:0}
  .orb1{width:700px;height:700px;background:var(--accent);top:-300px;right:-250px}
  .orb2{width:600px;height:600px;background:var(--accent2);bottom:-250px;left:-250px}

  nav{display:flex;align-items:center;justify-content:space-between;padding:18px 48px;
    border-bottom:1px solid var(--border);background:rgba(13,13,15,.9);backdrop-filter:blur(16px);
    position:sticky;top:0;z-index:100}
  .nav-logo{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;color:var(--accent);cursor:pointer;letter-spacing:.02em}
  .breadcrumb{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--text-dim);flex-wrap:wrap}
  .breadcrumb span{cursor:pointer;transition:color .2s}
  .breadcrumb span:hover{color:var(--accent)}
  .breadcrumb .sep{color:var(--text-faint)}
  .breadcrumb .current{color:var(--text);cursor:default}

  .page-header{padding:60px 64px 40px;border-bottom:1px solid var(--border);position:relative;z-index:1}
  .page-header::after{content:'';position:absolute;bottom:-1px;left:64px;width:60px;height:2px;background:var(--accent)}
  .page-eyebrow{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);
    margin-bottom:12px;font-weight:500;font-family:'DM Mono',monospace}
  .page-title{font-family:'Playfair Display',serif;font-size:clamp(2rem,4vw,3.2rem);font-weight:900}

  main{padding:44px 64px 110px;position:relative;z-index:1;max-width:760px}

  .carte{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px}
  .carte.prem{border-color:rgba(200,169,110,.5);background:linear-gradient(180deg,rgba(200,169,110,.08),rgba(200,169,110,.02))}
  .statut{font-family:'DM Mono',monospace;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;
    display:inline-block;padding:4px 10px;border-radius:20px;background:var(--surface2);color:var(--text-dim)}
  .prem .statut{background:var(--accent);color:#12120f}
  .statut.alerte{background:rgba(224,138,138,.15);color:var(--danger)}
  .carte h2{font-family:'Playfair Display',serif;font-size:1.6rem;margin:14px 0 8px}
  .carte p{color:var(--text-dim);font-size:.9rem;font-weight:300;line-height:1.7}
  .carte p b{color:var(--text);font-weight:500}
  .lignes{margin-top:18px;border-top:1px solid var(--border)}
  .lignes div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--border);font-size:.86rem}
  .lignes span{color:var(--text-dim)}
  .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
  .btn{background:var(--accent);border:0;color:#12100c;font-family:'DM Mono',monospace;font-size:.72rem;
    letter-spacing:.16em;text-transform:uppercase;font-weight:500;padding:13px 26px;border-radius:9px;
    cursor:pointer;transition:transform .2s,box-shadow .2s,opacity .2s;text-decoration:none;display:inline-block}
  .btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 32px rgba(200,169,110,.22)}
  .btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
  .btn.ghost{background:none;border:1px solid var(--border);color:var(--text-dim)}
  .btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);box-shadow:none}
  #erreur,#code-msg{color:var(--danger);font-size:.84rem;margin-top:14px}
  #code-msg.ok{color:var(--green)}

  .carte.code{margin-top:18px}
  .carte.code h3{font-family:'Playfair Display',serif;font-size:1.15rem;margin-bottom:6px}
  .champ-code{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .champ-code input{flex:1;min-width:200px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;
    color:var(--text);font:400 .92rem 'DM Sans',sans-serif;padding:12px 14px;outline:none;transition:border-color .18s}
  .champ-code input:focus{border-color:var(--accent)}

  .note{margin-top:28px;font-size:.8rem;color:var(--text-faint);line-height:1.7;font-weight:300}
  .note a{color:var(--text-dim)}

  .etat{padding:70px 0;text-align:center;color:var(--text-faint);
    font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase}

  @media(max-width:720px){
    nav{padding:16px 20px}
    .page-header{padding:40px 20px 30px}.page-header::after{left:20px}
    main{padding:32px 20px 90px}
    .carte{padding:22px}
  }
</style>
</head>
<body>
<div class="bg-orb orb1"></div><div class="bg-orb orb2"></div>

<nav>
  <div class="nav-logo" onclick="location.href='index.html'">ECG Prépa</div>
  <div class="breadcrumb">
    <span onclick="location.href='index.html'">Accueil</span>
    <span class="sep">/</span>
    <span class="current">Mon abonnement</span>
  </div>
</nav>

<div class="page-header">
  <div class="page-eyebrow">✦ Compte</div>
  <div class="page-title">Mon abonnement</div>
</div>

<main>
  <div id="chargement" class="etat">Chargement…</div>
  <div id="contenu" style="display:none"></div>
  <p class="note">Les paiements, les factures et la résiliation sont gérés par Stripe, notre prestataire de paiement.
    Pour toute question : <a href="contact.html">nous contacter</a>. Voir aussi les <a href="cgv.html">conditions générales de vente</a>.</p>
</main>

<script>
(function () {
  'use strict';
  var A = window.ECGAuth;
  var $ = function (s) { return document.getElementById(s); };
  var retourPaiement = new URLSearchParams(location.search).get('paiement') === 'ok';

  function date(v) {
    if (!v) return '—';
    return new Date(v).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function afficher(st) {
    $('chargement').style.display = 'none';
    var c = $('contenu');
    c.style.display = 'block';

    if (st.premium && st.statut === 'offert') {
      c.innerHTML =
        '<div class="carte prem">' +
        '<span class="statut">✦ Accès offert</span>' +
        '<h2>Tu as accès à tout le site</h2>' +
        '<p>Ton accès Premium t\'a été offert : tous les contenus réservés te sont ouverts, sans paiement et sans date de fin.</p>' +
        '<div class="lignes"><div><span>Offre</span><b>Accès offert</b></div></div>' +
        '<div class="actions">' +
        '<a class="btn" href="index.html">Aller aux cours</a>' +
        (st.client_stripe ? '<button class="btn ghost" id="gerer">Mes anciennes factures</button>' : '') +
        '</div>' +
        '<div id="erreur" role="alert"></div>' +
        '</div>';
    } else if (st.premium) {
      var alerte = st.statut === 'past_due';
      var echeance = st.annulation_prevue
        ? '<div><span>Accès jusqu\'au</span><b>' + date(st.fin_periode) + '</b></div>'
        : '<div><span>Prochain renouvellement</span><b>' + date(st.fin_periode) + '</b></div>';
      c.innerHTML =
        '<div class="carte prem">' +
        '<span class="statut' + (alerte ? ' alerte' : '') + '">' + (alerte ? 'Paiement en attente' : '✦ Premium actif') + '</span>' +
        '<h2>' + (retourPaiement ? 'Bienvenue dans le Premium !' : 'Tu es membre Premium') + '</h2>' +
        '<p>' + (alerte
          ? 'Le dernier prélèvement a échoué. Stripe va réessayer automatiquement ; mets à jour ta carte pour éviter une coupure.'
          : st.annulation_prevue
            ? 'Ton abonnement est <b>résilié</b> : il ne sera pas renouvelé, mais tu gardes l\'accès jusqu\'à la date ci-dessous.'
            : 'Tous les contenus réservés du site te sont ouverts. Merci pour ton soutien.') + '</p>' +
        '<div class="lignes">' +
        '<div><span>Offre</span><b>' + esc(st.offre === 'annuel' ? 'Annuelle' : st.offre === 'mensuel' ? 'Mensuelle' : '—') + '</b></div>' +
        echeance +
        '</div>' +
        '<div class="actions">' +
        '<button class="btn" id="gerer">Gérer mon abonnement</button>' +
        '<a class="btn ghost" href="index.html">Retour aux cours</a>' +
        '</div>' +
        '<div id="erreur" role="alert"></div>' +
        '<p style="margin-top:16px;font-size:.78rem">Changer de carte, télécharger tes factures, passer à l\'annuel ou résilier : tout se fait depuis « Gérer mon abonnement ».</p>' +
        '</div>';
    } else {
      if (retourPaiement) {
        c.innerHTML =
          '<div class="carte"><span class="statut">Activation en cours</span>' +
          '<h2>Paiement reçu, merci !</h2>' +
          '<p>L\'activation prend parfois une minute. Recharge cette page dans un instant ; ' +
          'si rien ne change d\'ici quelques minutes, <a href="contact.html" style="color:var(--accent2)">écris-nous</a>.</p>' +
          '<div class="actions"><button class="btn" onclick="location.reload()">Recharger</button></div></div>';
        return;
      }
      var ancien = st.statut && st.statut !== 'aucun';
      c.innerHTML =
        '<div class="carte">' +
        '<span class="statut">' + (ancien ? 'Abonnement terminé' : 'Compte gratuit') + '</span>' +
        '<h2>' + (ancien ? 'Ton abonnement a pris fin' : 'Passe au Premium') + '</h2>' +
        '<p>Le Premium ouvre toutes les rubriques et fiches réservées du site. Sans engagement, résiliable en un clic.</p>' +
        '<div class="actions">' +
        '<a class="btn" href="tarifs.html">Voir les offres</a>' +
        (st.client_stripe ? '<button class="btn ghost" id="gerer">Mes factures</button>' : '') +
        '</div>' +
        '<div id="erreur" role="alert"></div>' +
        '</div>' +
        /* Code d'accès offert par l'administrateur */
        '<div class="carte code" id="code">' +
        '<h3>Tu as un code d\'accès ?</h3>' +
        '<p>Si on t\'a donné un code, saisis-le ici : il t\'ouvre tout le site gratuitement.</p>' +
        '<form class="champ-code" id="form-code" autocomplete="off">' +
        '<input type="text" id="saisie-code" placeholder="Ton code d\'accès" aria-label="Code d\'accès" autocapitalize="off" spellcheck="false">' +
        '<button class="btn" type="submit" id="valider-code">Valider</button>' +
        '</form>' +
        '<div id="code-msg" role="alert"></div>' +
        '</div>';
      brancherCode();
    }

    var g = $('gerer');
    if (g) g.addEventListener('click', function () {
      g.disabled = true;
      $('erreur').textContent = '';
      A.premium.gerer().catch(function (e) {
        g.disabled = false;
        $('erreur').textContent = String((e && e.message) || e);
      });
    });
  }

  function brancherCode() {
    var form = $('form-code'), champ = $('saisie-code'), btn = $('valider-code'), msg = $('code-msg');
    if (location.hash === '#code') { champ.focus(); }

    /* Le message doit toujours être visible, même sur un petit écran. */
    function dire(texte, ok) {
      msg.className = ok ? 'ok' : '';
      msg.textContent = texte;
      try { msg.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {}
    }
    function relacher() { btn.disabled = false; btn.textContent = 'Valider'; }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      dire('');
      if (!champ.value.trim()) { dire('Saisis ton code.'); return; }
      btn.disabled = true; btn.textContent = 'Vérification…';

      /* Filet : sans réponse du serveur au bout de 15 s, on le dit
         au lieu de laisser le bouton bloqué. */
      var fini = false;
      var minuteur = setTimeout(function () {
        if (fini) return;
        fini = true;
        dire('Le serveur ne répond pas. Vérifie ta connexion et réessaie.');
        relacher();
      }, 15000);

      var essai;
      try {
        essai = A.premium.utiliserCode(champ.value);
      } catch (err) {
        essai = Promise.reject(err);
      }
      essai.then(function () {
        if (fini) return;
        fini = true; clearTimeout(minuteur);
        dire('Code accepté : bienvenue !', true);
        return A.premium.statut(true).then(function (st) { setTimeout(function () { afficher(st); }, 900); });
      }).catch(function (err) {
        if (console && console.error) console.error('Code d\'accès :', err);
        if (fini) return;
        fini = true; clearTimeout(minuteur);
        dire(String((err && err.message) || err || 'Erreur inconnue.'));
        relacher();
      });
    });
  }

  /* Juste après un paiement, Stripe prévient le site en quelques
     secondes : on patiente un peu avant de conclure. */
  function charger(essai) {
    A.premium.statut(true).then(function (st) {
      if (retourPaiement && !st.premium && essai < 8) {
        $('chargement').textContent = 'Confirmation du paiement en cours…';
        setTimeout(function () { charger(essai + 1); }, 2000);
        return;
      }
      afficher(st);
      if (retourPaiement && st.premium) history.replaceState(null, '', location.pathname);
    });
  }

  document.addEventListener('ecg:pret', function () { charger(0); });
})();
</script>
</body>
</html>
