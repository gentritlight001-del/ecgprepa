<!DOCTYPE html>
<html lang="fr">
<head>
<script src="auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>ECG Prépa — Idées pour le site</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --bg: #f2efe9;
    --carte: #fff;
    --encre: #1d1c1a;
    --gris: #5d5a53;
    --filet: #ddd8cd;
    --filet-doux: #e6e1d7;
    --champ: #fbfaf7;
    --nuit: #16171b;
    --nuit2: #2a2c33;
    --nuit-texte: #ecebe6;
    --nuit-gris: #a9a79f;
    --vert: #1d6b3f;
    --rouge: #9c1620;
    --lien: #1f5fa8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--encre); font-family: 'DM Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5; min-height: 100vh; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--lien); outline-offset: 2px; }
  .cache { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Barre du haut */
  nav.barre {
    position: sticky; top: 0; z-index: 100; height: 60px; padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: #000; color: #fff;
  }
  .nav-logo { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 20px; color: #fff; text-decoration: none; white-space: nowrap; }
  .fil { display: flex; gap: 8px; font-size: 13px; color: #c9c7c0; white-space: nowrap; overflow-x: auto; scrollbar-width: none; }
  .fil a { color: #c9c7c0; text-decoration: none; }
  .fil a:hover { color: #fff; }
  .fil .ici { color: #fff; }
  .nav-right { display: flex; align-items: center; gap: 10px; }

  /* Trois volets */
  .volets { display: grid; grid-template-columns: 270px minmax(0, 1fr) 450px; min-height: calc(100vh - 60px); }
  .cote, .fiche { position: sticky; top: 60px; height: calc(100vh - 60px); overflow-y: auto; }

  /* Volet gauche */
  .cote { background: var(--nuit); color: var(--nuit-texte); padding: 28px 18px 32px; }
  .cote h1 { margin: 0 6px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 28px; line-height: 1.1; }
  .cote .compte { margin: 8px 6px 0; font-size: 14px; color: var(--nuit-gris); }
  .btn-nouvelle {
    margin-top: 22px; width: 100%; height: 46px; border-radius: 12px; border: 0;
    background: var(--bg); color: var(--nuit); font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-nouvelle:hover { background: #fff; }
  .cote-t { margin: 26px 8px 8px; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--nuit-gris); }
  .filtre {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    min-height: 40px; padding: 0 10px; border-radius: 9px; border: 0; background: transparent;
    color: var(--nuit-texte); font-size: 14.5px; text-align: left;
  }
  .filtre:hover { background: #202228; }
  .filtre[aria-pressed="true"] { background: var(--nuit2); color: #fff; font-weight: 600; }
  .filtre .g { display: flex; align-items: center; gap: 10px; }
  .filtre .pt { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .filtre .n { color: var(--nuit-gris); font-variant-numeric: tabular-nums; font-weight: 400; }
  .filtre[aria-pressed="true"] .n { color: #fff; }
  .cote-pied { margin: 28px 8px 0; font-size: 12.5px; color: var(--nuit-gris); line-height: 1.5; }

  /* Volet central */
  .liste { padding: 26px 24px 48px; border-right: 1px solid var(--filet); min-width: 0; }
  .outils { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .recherche {
    flex: 999 1 240px; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px;
    border-radius: 12px; border: 1px solid var(--filet); background: var(--carte); color: var(--gris);
  }
  .recherche:focus-within { border-color: var(--encre); }
  .recherche input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: var(--encre); }
  .recherche input::placeholder { color: #77736b; }
  .tri { flex: none; display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--gris); }
  .tri select, .champ select {
    height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--filet); background: var(--carte); color: var(--encre);
  }
  .rubriques { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .rubriques:empty { display: none; }
  .rub {
    height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--filet); background: var(--carte);
    font-size: 13.5px; color: var(--encre); display: inline-flex; align-items: center; gap: 6px;
  }
  .rub span { color: var(--gris); font-variant-numeric: tabular-nums; }
  .rub[aria-pressed="true"] { background: var(--encre); border-color: var(--encre); color: #fff; }
  .rub[aria-pressed="true"] span { color: #d8d5cd; }

  .bloc-t { margin: 24px 4px 8px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .idees { list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .idee { display: flex; align-items: center; gap: 4px; border-radius: 12px; }
  .idee:hover { background: rgba(255,255,255,.6); }
  .idee.choisie { background: var(--carte); box-shadow: 0 0 0 2px var(--encre); }
  .coche {
    flex: none; width: 40px; height: 44px; border: 0; background: transparent;
    display: grid; place-items: center; border-radius: 10px;
  }
  .coche i {
    width: 20px; height: 20px; border-radius: 10px; border: 2px solid #aaa498; display: grid; place-items: center; color: #fff;
  }
  .coche:hover i { border-color: var(--vert); }
  .idee.faite .coche i { background: var(--vert); border-color: var(--vert); }
  .ouvrir { flex: 1; min-width: 0; border: 0; background: transparent; text-align: left; padding: 9px 12px 9px 0; }
  .ouvrir .t { display: block; font-weight: 600; color: var(--encre); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ouvrir .m { display: block; font-size: 13px; color: var(--gris); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ouvrir .m b { font-weight: 600; }
  .idee.faite .t { text-decoration: line-through; color: var(--gris); }
  .prio-p { display: inline-block; padding: 0 8px; margin-right: 4px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .p-high { background: #fde8e8; color: var(--rouge); }
  .p-med  { background: #fbf1d9; color: #6e5106; }
  .p-low  { background: #eceff4; color: #3d4a62; }
  .vide { margin-top: 48px; text-align: center; color: var(--gris); }
  .vide strong { display: block; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; color: var(--encre); margin-bottom: 6px; }

  /* Volet droit */
  .fiche { background: var(--carte); padding: 28px 28px 36px; }
  .fiche-haut { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; }
  .fiche-date { font-size: 13px; color: var(--gris); }
  .btn-icone {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--filet-doux); background: var(--carte);
    display: grid; place-items: center; color: var(--encre); flex: none;
  }
  .btn-icone:hover { border-color: var(--encre); }
  .btn-icone.suppr { color: var(--rouge); }
  .btn-icone.suppr:hover { border-color: var(--rouge); background: #fdf1f1; }
  .fermer { display: none; }
  .fiche-titre {
    margin-top: 10px; width: 100%; border: 0; padding: 4px 0; resize: none; overflow: hidden;
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.15;
    color: var(--encre); background: transparent; border-bottom: 2px solid transparent;
  }
  .fiche-titre:focus { outline: none; border-bottom-color: var(--filet); }
  .fiche-titre::placeholder { color: #a8a399; }
  .champs2 { margin-top: 22px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .champ { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--gris); margin-top: 18px; }
  .champs2 .champ { margin-top: 0; }
  .champ select { font-weight: 500; }
  .champ textarea, .champ input {
    padding: 12px 14px; border-radius: 12px; border: 1px solid var(--filet); background: var(--champ);
    font-weight: 400; font-size: 15px; line-height: 1.55; color: var(--encre); resize: vertical; width: 100%;
  }
  .champ input { height: 44px; padding: 0 14px; border-radius: 10px; }
  .champ textarea:focus, .champ input:focus, .champ select:focus { outline: none; border-color: var(--encre); }
  .lien-ligne { display: flex; gap: 8px; }
  .lien-ligne input { flex: 1; min-width: 0; }
  .lien-ligne a { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--filet); color: var(--lien); text-decoration: none; font-weight: 600; }
  .lien-ligne a:hover { border-color: var(--lien); }
  fieldset.champ { border: 0; }
  fieldset.champ legend { margin-bottom: 6px; }
  .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 4px; border-radius: 12px; background: var(--bg); }
  .seg button { height: 40px; border-radius: 9px; border: 0; background: transparent; color: #4a4741; font-weight: 500; }
  .seg button:hover { background: rgba(255,255,255,.6); }
  .seg button[aria-pressed="true"] { background: var(--carte); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .seg button[data-p="high"][aria-pressed="true"] { color: var(--rouge); }
  .seg button[data-p="med"][aria-pressed="true"] { color: #6e5106; }
  .seg button[data-p="low"][aria-pressed="true"] { color: #3d4a62; }
  .btn-faite {
    margin-top: 26px; width: 100%; height: 50px; border-radius: 12px; border: 0; background: var(--vert); color: #fff;
    font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-faite:hover { background: #155532; }
  .btn-faite.refaire { background: var(--bg); color: var(--encre); border: 1px solid var(--filet); }
  .btn-faite.refaire:hover { border-color: var(--encre); }
  .fiche-note { margin-top: 12px; font-size: 13px; color: var(--gris); }
  .fiche-vide { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--gris); padding: 0 20px; }
  .fiche-vide strong { font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; color: var(--encre); margin-bottom: 6px; }

  @media (max-width: 1240px) {
    .volets { grid-template-columns: 240px minmax(0, 1fr) 390px; }
    .fiche { padding: 24px 22px 32px; }
  }

  /* Téléphone et tablette : volets empilés, la fiche s'ouvre en plein écran */
  @media (max-width: 900px) {
    nav.barre { padding: 0 16px; }
    .fil { display: none; }
    .volets { display: block; }
    .cote { position: static; height: auto; padding: 24px 16px; }
    .cote-filtres { display: flex; flex-wrap: wrap; gap: 6px; }
    .cote-filtres .filtre { width: auto; border: 1px solid #33353d; border-radius: 999px; padding: 0 12px; }
    .cote-filtres .filtre .n { margin-left: 6px; }
    .cote-t { margin: 20px 4px 8px; }
    .cote-pied { display: none; }
    .liste { padding: 20px 16px 48px; border-right: 0; }
    .fiche { display: none; position: fixed; inset: 0; z-index: 200; height: auto; padding: 18px 16px 32px; }
    .fiche.ouverte { display: block; }
    .fermer { display: grid; }
    .fiche-vide { display: none; }
  }
</style>
</head>
<body>

<nav class="barre">
  <a class="nav-logo" href="index.html">ECG Prépa</a>
  <div class="fil" aria-label="Fil d'Ariane">
    <a href="index.html">Accueil</a><span aria-hidden="true">/</span>
    <a href="admin.html">Administration</a><span aria-hidden="true">/</span>
    <span class="ici">Idées pour le site</span>
  </div>
  <div class="nav-right"></div>
</nav>

<div class="volets">

  <aside class="cote">
    <h1>Idées pour le site</h1>
    <p class="compte" id="compte"></p>
    <button type="button" class="btn-nouvelle" id="btn-nouvelle">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Nouvelle idée
    </button>
    <p class="cote-t">Vues</p>
    <div class="cote-filtres" id="vues"></div>
    <p class="cote-t">Parties du site</p>
    <div class="cote-filtres" id="parties"></div>
    <p class="cote-pied">Les idées sont gardées dans ce navigateur. Les modifications s'enregistrent toutes seules.</p>
  </aside>

  <section class="liste" aria-label="Liste des idées">
    <div class="outils">
      <label class="recherche">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="cache">Chercher une idée</span>
        <input type="search" id="recherche" placeholder="Chercher dans les titres et les notes" autocomplete="off">
      </label>
      <label class="tri">Tri&nbsp;:
        <select id="tri">
          <option value="prio">Priorité</option>
          <option value="date">Date</option>
          <option value="partie">Partie du site</option>
          <option value="alpha">A à Z</option>
        </select>
      </label>
    </div>
    <div class="rubriques" id="rubriques"></div>
    <div id="contenu"></div>
  </section>

  <section class="fiche" id="fiche" aria-label="Idée sélectionnée"></section>
</div>

<script>
  /* Les parties du site et leurs rubriques (calquées sur l'arborescence réelle).
     c : couleur sur fond clair ; cn : couleur sur le volet noir. */
  const SECTIONS = {
    articles: { label: 'Actualités', c: '#b5131f', cn: '#ff8f8f', subs: {
      monde: 'Mondiale', en: 'Anglophone', es: 'Hispanophone', de: 'Germanophone' } },
    cg: { label: 'Culture générale', c: '#6b4fa0', cn: '#c4b1ee', subs: {
      philosophie: 'Philosophie', histoire: 'Histoire', politique: 'Politique', economie: 'Économie',
      geopolitique: 'Géopolitique', societe: 'Société', culture: 'Culture & Arts', sciences: 'Sciences',
      environnement: 'Environnement', entreprise: 'Entreprise', sport: 'Sport',
      organisations: 'Organisations', pays: 'Pays', lieux: 'Lieux' } },
    cours: { label: 'Cours', c: '#1f5fa8', cn: '#8dbcf2', subs: {
      maths: 'Maths', hgg: 'HGG', esh: 'ESH', philo: 'Philosophie', langues: 'Langues',
      colles: 'Colles', ds: 'DS / annales', autre: 'Autre matière' } },
    humanite: { label: 'Humanité', c: '#a8432a', cn: '#f0a07f', subs: {
      cinema: 'Cinéma', litterature: 'Littérature', cours: "Cours d'Humanité" } },
    newsletter: { label: 'Newsletters', c: '#2d6a3e', cn: '#93d39e', subs: {
      monde: 'Mondiale', en: 'Anglophone', es: 'Hispanophone', de: 'Germanophone', cg: 'Culture générale' } },
    site: { label: 'Site et fonctionnalités', c: '#7d5a0c', cn: '#e6c766', subs: {
      fonction: 'Nouvelle fonctionnalité', design: 'Design / mise en page', comptes: 'Comptes & Premium',
      admin: 'Administration', seo: 'Référencement', bug: 'Bug / correction' } },
    autre: { label: 'Autre', c: '#5d5a53', cn: '#a9a79f', subs: { autre: 'Divers' } }
  };
  const PRIOS = {
    high: { label: 'Urgent', c: '#9c1620' },
    med:  { label: 'Bientôt', c: '#6e5106' },
    low:  { label: 'Un jour', c: '#3d4a62' }
  };
  const PRIO_ORDER = { high: 0, med: 1, low: 2 };
  /* Anciennes catégories (avant la première refonte) → partie / rubrique. */
  const ANCIEN = {
    monde: ['articles', 'monde'], en: ['articles', 'en'], es: ['articles', 'es'], de: ['articles', 'de'],
    eco: ['cg', 'economie'], pol: ['cg', 'politique'], autre: ['autre', 'autre']
  };
  const CLE = 'ecg-articles';
  const $ = id => document.getElementById(id);
  const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ICONE_COCHE = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>';

  function charger() {
    let l = [];
    try { l = JSON.parse(localStorage.getItem(CLE) || '[]'); } catch (e) {}
    if (!Array.isArray(l)) l = [];
    let migre = false;
    l.forEach(a => {
      if (!a.sec || !SECTIONS[a.sec]) {
        const m = ANCIEN[a.cat] || ANCIEN.autre;
        a.sec = m[0]; a.sub = m[1]; migre = true;
      }
      if (!PRIOS[a.prio]) { a.prio = 'med'; migre = true; }
    });
    if (migre) enregistrer(l);
    return l;
  }
  function enregistrer(l) {
    try { localStorage.setItem(CLE, JSON.stringify(l || idees)); } catch (e) {}
  }

  let idees = charger();
  let vue = 'todo';        // todo | done | all
  let partie = '';         // clé de SECTIONS, ou '' pour toutes
  let rubrique = '';
  let tri = 'prio';
  let choisie = null;      // id de l'idée ouverte dans la fiche
  try { tri = localStorage.getItem('ecg-idees:tri') || 'prio'; } catch (e) {}
  if (!['prio', 'date', 'partie', 'alpha'].includes(tri)) tri = 'prio';
  $('tri').value = tri;

  const trouver = id => idees.find(a => a.id === id);
  const dateCourte = iso => new Date(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
  const dateLongue = iso => new Date(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  const urlSure = u => /^https?:\/\//i.test(u) ? u : (u ? 'https://' + u : '');
  const telephone = () => matchMedia('(max-width: 900px)').matches;

  /* Retire les idées restées sans titre (créées puis abandonnées). */
  function nettoyer(saufId) {
    const avant = idees.length;
    idees = idees.filter(a => a.id === saufId || (a.title || '').trim());
    if (idees.length !== avant) enregistrer();
  }

  /* ---------- Volet gauche ---------- */
  function rendreCote() {
    const afaire = idees.filter(a => !a.done).length;
    const faites = idees.length - afaire;
    const urg = idees.filter(a => !a.done && a.prio === 'high').length;
    $('compte').textContent = afaire + ' à faire' + (urg ? ' (' + urg + ' urgente' + (urg > 1 ? 's' : '') + ')' : '') + ' · ' + faites + ' faite' + (faites > 1 ? 's' : '');

    const bouton = (attr, val, actif, label, n, couleur) =>
      `<button type="button" class="filtre" ${attr}="${val}" aria-pressed="${actif}">
        <span class="g">${couleur ? `<span class="pt" style="background:${couleur}" aria-hidden="true"></span>` : ''}${esc(label)}</span>
        <span class="n">${n}</span></button>`;
    $('vues').innerHTML =
      bouton('data-vue', 'todo', vue === 'todo', 'À faire', afaire) +
      bouton('data-vue', 'done', vue === 'done', 'Faites', faites) +
      bouton('data-vue', 'all', vue === 'all', 'Toutes', idees.length);

    const dansVue = a => vue === 'all' || (vue === 'done') === !!a.done;
    $('parties').innerHTML = Object.keys(SECTIONS).map(k => {
      const n = idees.filter(a => a.sec === k && dansVue(a)).length;
      if (!n && k === 'autre' && partie !== k) return '';
      return bouton('data-partie', k, partie === k, SECTIONS[k].label, n, SECTIONS[k].cn);
    }).join('');
  }

  /* ---------- Volet central ---------- */
  function filtrees() {
    const q = $('recherche').value.trim().toLowerCase();
    return idees.filter(a => {
      if (vue === 'todo' && a.done && a.id !== choisie) return false;
      if (vue === 'done' && !a.done && a.id !== choisie) return false;
      if (partie && a.sec !== partie) return false;
      if (rubrique && a.sub !== rubrique) return false;
      if (q && !(a.title || '').toLowerCase().includes(q) && !(a.note || '').toLowerCase().includes(q)) return false;
      return true;
    });
  }

  function ligne(a) {
    const s = SECTIONS[a.sec] || SECTIONS.autre;
    const rub = s.subs[a.sub] || '';
    const prio = tri === 'prio' || a.done ? '' : `<span class="prio-p p-${a.prio}">${PRIOS[a.prio].label}</span>`;
    return `<li class="idee${a.done ? ' faite' : ''}${a.id === choisie ? ' choisie' : ''}" data-id="${a.id}">
      <button type="button" class="coche" data-coche="${a.id}" aria-label="${a.done ? 'Remettre à faire' : 'Marquer comme faite'} : ${esc(a.title)}"><i>${a.done ? ICONE_COCHE : ''}</i></button>
      <button type="button" class="ouvrir" data-ouvrir="${a.id}" aria-current="${a.id === choisie}">
        <span class="t">${esc(a.title) || '<em>Sans titre</em>'}</span>
        <span class="m">${prio}<b style="color:${s.c}">${esc(s.label)}</b>${rub ? ' · ' + esc(rub) : ''} · ${dateCourte(a.date)}</span>
      </button>
    </li>`;
  }

  function rendreListe() {
    const s = SECTIONS[partie];
    $('rubriques').innerHTML = s ? Object.keys(s.subs).map(k => {
      const n = idees.filter(a => a.sec === partie && a.sub === k).length;
      return `<button type="button" class="rub" data-rub="${k}" aria-pressed="${rubrique === k}">${esc(s.subs[k])}<span>${n}</span></button>`;
    }).join('') : '';

    const liste = filtrees();
    const cles = Object.keys(SECTIONS);
    const parDate = (a, b) => new Date(b.date) - new Date(a.date);
    if (tri === 'alpha') liste.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'fr'));
    else liste.sort(parDate);

    if (!liste.length) {
      const rien = !idees.length;
      $('contenu').innerHTML = `<div class="vide"><strong>${rien ? 'Aucune idée pour l’instant' : 'Aucun résultat'}</strong>${rien ? 'Ajoute ta première idée avec « Nouvelle idée ».' : 'Essaie une autre vue, une autre partie ou une autre recherche.'}</div>`;
      return;
    }

    let groupes;
    if (tri === 'prio') {
      groupes = ['high', 'med', 'low'].map(p => ({ t: PRIOS[p].label, c: PRIOS[p].c, l: liste.filter(a => a.prio === p) }));
    } else if (tri === 'partie') {
      groupes = cles.map(k => ({ t: SECTIONS[k].label, c: SECTIONS[k].c, l: liste.filter(a => a.sec === k) }));
    } else {
      groupes = [{ t: '', l: liste }];
    }
    $('contenu').innerHTML = groupes.filter(g => g.l.length).map(g =>
      (g.t ? `<h2 class="bloc-t" style="color:${g.c}">${esc(g.t)} · ${g.l.length}</h2>` : '<div style="height:18px"></div>') +
      `<ul class="idees">${g.l.map(ligne).join('')}</ul>`
    ).join('');
  }

  /* ---------- Volet droit ---------- */
  function rendreFiche(focusTitre) {
    const f = $('fiche');
    const a = trouver(choisie);
    if (!a) {
      f.classList.remove('ouverte');
      f.innerHTML = `<div class="fiche-vide"><strong>Choisis une idée</strong>Elle s'ouvre ici en entier : titre, partie du site, priorité, note et lien.</div>`;
      return;
    }
    const s = SECTIONS[a.sec] || SECTIONS.autre;
    const optParties = Object.keys(SECTIONS).map(k => `<option value="${k}"${k === a.sec ? ' selected' : ''}>${esc(SECTIONS[k].label)}</option>`).join('');
    const optRubs = Object.keys(s.subs).map(k => `<option value="${k}"${k === a.sub ? ' selected' : ''}>${esc(s.subs[k])}</option>`).join('');
    const url = urlSure(a.link || '');
    f.innerHTML = `
      <div class="fiche-haut">
        <button type="button" class="btn-icone fermer" id="f-fermer" aria-label="Revenir à la liste">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span class="fiche-date">Ajoutée le ${dateLongue(a.date)}</span>
        <button type="button" class="btn-icone suppr" id="f-suppr" aria-label="Supprimer l'idée">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
        </button>
      </div>
      <label class="cache" for="f-titre">Titre</label>
      <textarea class="fiche-titre" id="f-titre" rows="1" placeholder="Titre de l'idée">${esc(a.title)}</textarea>
      <div class="champs2">
        <label class="champ">Partie du site<select id="f-partie">${optParties}</select></label>
        <label class="champ">Rubrique<select id="f-rub">${optRubs}</select></label>
      </div>
      <fieldset class="champ">
        <legend>Priorité</legend>
        <div class="seg">${['high', 'med', 'low'].map(p => `<button type="button" data-p="${p}" aria-pressed="${a.prio === p}">${PRIOS[p].label}</button>`).join('')}</div>
      </fieldset>
      <label class="champ">Note<textarea id="f-note" rows="6" placeholder="Contexte, sources, ce qu'il faut penser à faire…">${esc(a.note || '')}</textarea></label>
      <div class="champ">
        <label for="f-lien">Lien</label>
        <div class="lien-ligne">
          <input type="url" id="f-lien" placeholder="https://…" value="${esc(a.link || '')}">
          ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">Ouvrir<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></a>` : ''}
        </div>
      </div>
      <button type="button" class="btn-faite${a.done ? ' refaire' : ''}" id="f-faite">
        ${a.done ? 'Remettre à faire' : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>Marquer comme faite'}
      </button>
      <p class="fiche-note">Les modifications sont enregistrées toutes seules.</p>`;

    const titre = $('f-titre');
    const ajuster = () => { titre.style.height = 'auto'; titre.style.height = titre.scrollHeight + 'px'; };
    ajuster();
    titre.addEventListener('input', () => { a.title = titre.value.replace(/\n/g, ' '); ajuster(); enregistrer(); rafraichirLigne(a); rendreCote(); });
    titre.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('f-note').focus(); } });
    $('f-note').addEventListener('input', e => { a.note = e.target.value; enregistrer(); });
    $('f-lien').addEventListener('change', e => { a.link = e.target.value.trim(); enregistrer(); rendreFiche(); });
    $('f-partie').addEventListener('change', e => {
      a.sec = e.target.value; a.sub = Object.keys(SECTIONS[a.sec].subs)[0]; enregistrer(); tout();
    });
    $('f-rub').addEventListener('change', e => { a.sub = e.target.value; enregistrer(); rendreListe(); });
    f.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { a.prio = b.dataset.p; enregistrer(); tout(); }));
    $('f-faite').addEventListener('click', () => { a.done = !a.done; enregistrer(); tout(); });
    $('f-suppr').addEventListener('click', () => {
      if (!confirm('Supprimer l’idée « ' + (a.title || 'Sans titre') + ' » ?')) return;
      idees = idees.filter(x => x.id !== a.id); choisie = null; enregistrer(); tout();
    });
    $('f-fermer').addEventListener('click', fermerFiche);
    if (telephone()) f.classList.add('ouverte');
    if (focusTitre) titre.focus();
  }

  function rafraichirLigne(a) {
    const li = document.querySelector(`.idee[data-id="${a.id}"] .t`);
    if (li) li.innerHTML = esc(a.title) || '<em>Sans titre</em>';
  }

  function fermerFiche() {
    choisie = null;
    nettoyer();
    $('fiche').classList.remove('ouverte');
    tout();
  }

  function choisir(id, focusTitre) {
    if (choisie !== id) nettoyer(id);
    choisie = id;
    tout(focusTitre);
  }

  function tout(focusTitre) {
    rendreCote();
    rendreListe();
    rendreFiche(focusTitre);
  }

  /* ---------- Événements ---------- */
  $('btn-nouvelle').addEventListener('click', () => {
    const sec = partie || (trouver(choisie) || {}).sec || 'articles';
    const a = {
      id: Date.now(), title: '', note: '', link: '',
      sec, sub: rubrique || Object.keys(SECTIONS[sec].subs)[0],
      prio: 'med', done: false, date: new Date().toISOString()
    };
    idees.unshift(a);
    if (vue === 'done') vue = 'todo';
    $('recherche').value = '';
    enregistrer();
    choisir(a.id, true);
  });
  $('vues').addEventListener('click', e => {
    const b = e.target.closest('[data-vue]'); if (!b) return;
    vue = b.dataset.vue; tout();
  });
  $('parties').addEventListener('click', e => {
    const b = e.target.closest('[data-partie]'); if (!b) return;
    partie = partie === b.dataset.partie ? '' : b.dataset.partie; rubrique = ''; tout();
  });
  $('rubriques').addEventListener('click', e => {
    const b = e.target.closest('[data-rub]'); if (!b) return;
    rubrique = rubrique === b.dataset.rub ? '' : b.dataset.rub; rendreListe();
  });
  $('contenu').addEventListener('click', e => {
    const c = e.target.closest('[data-coche]');
    if (c) { const a = trouver(+c.dataset.coche); if (a) { a.done = !a.done; enregistrer(); tout(); } return; }
    const o = e.target.closest('[data-ouvrir]');
    if (o) choisir(+o.dataset.ouvrir);
  });
  $('recherche').addEventListener('input', rendreListe);
  $('tri').addEventListener('change', e => {
    tri = e.target.value;
    try { localStorage.setItem('ecg-idees:tri', tri); } catch (err) {}
    rendreListe();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $('fiche').classList.contains('ouverte')) fermerFiche();
  });

  tout();
</script>
</body>
</html>
