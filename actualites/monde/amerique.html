<!DOCTYPE html>
<html lang="fr">
<head>
<script src="../../auth.js"></script>
<script src="../../favoris.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECG Prépa — Actualité — Amérique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: #2a2a35;
    --accent: #7ca8c9;
    --text: #e8e6e0;
    --text-dim: #8a8880;
    --text-faint: #4a4845;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }

  .page { display: none; min-height: 100vh; flex-direction: column; }
  .page.active { display: flex; }

  .bg-orb { position: fixed; border-radius: 50%; filter: blur(140px); pointer-events: none; opacity: 0.09; z-index: 0; }
  .orb1 { width: 700px; height: 700px; background: #8b0000; top: -300px; right: -250px; }
  .orb2 { width: 600px; height: 600px; background: #003087; bottom: -250px; left: -250px; }
  .orb3 { width: 400px; height: 400px; background: #8b0000; top: 40%; left: 30%; opacity: 0.05; }

  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 48px; border-bottom: 1px solid var(--border);
    background: rgba(13,13,15,0.9); backdrop-filter: blur(16px);
    position: sticky; top: 0; z-index: 100;
  }
  .nav-logo { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; color: var(--accent); cursor: pointer; letter-spacing: 0.02em; }
  .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-dim); flex-wrap: wrap; }
  .breadcrumb span { cursor: pointer; transition: color 0.2s; }
  .breadcrumb span:hover { color: var(--accent); }
  .breadcrumb .sep { color: var(--text-faint); }
  .breadcrumb .current { color: var(--text); cursor: default; }

  .page-header { padding: 60px 64px 40px; border-bottom: 1px solid var(--border); position: relative; z-index: 1; }
  .page-header::after { content: ''; position: absolute; bottom: -1px; left: 64px; width: 60px; height: 2px; background: var(--accent); }
  .page-eyebrow { font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; font-weight: 500; font-family: 'DM Mono', monospace; }
  .page-title { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 4vw, 3.2rem); font-weight: 900; color: var(--text); }
  .page-header-row { display: flex; align-items: center; justify-content: space-between; gap: 24px; }

  .actu-layout { display: flex; flex: 1; overflow: hidden; }
  .actu-sidebar { width: 220px; min-width: 220px; border-right: 1px solid var(--border); padding: 28px 18px; background: var(--surface); overflow-y: auto; }
  .actu-main { flex: 1; overflow-y: auto; padding: 40px 48px; }
  .actu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }

  .actu-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px 26px; cursor: pointer; transition: all 0.25s; position: relative; overflow: hidden; }
  .actu-card:hover { border-color: var(--card-color, var(--accent)); background: var(--surface2); transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
  .actu-card-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .actu-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.68rem; font-weight: 500; font-family: 'DM Mono', monospace; letter-spacing: 0.05em; }
  .actu-badge.pays { background: rgba(139,0,0,0.2); color: #d48a8a; }
  .actu-badge.theme { background: var(--surface2); color: var(--text-dim); }
  .actu-card-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; color: var(--text); line-height: 1.35; margin-bottom: 12px; }
  .actu-card.title-only { padding: 20px 22px; }
  .actu-card.title-only .actu-card-meta { margin-bottom: 10px; }
  .actu-card.title-only .actu-card-title { font-size: 1rem; margin-bottom: 0; }

  .actu-card-img-wrap { margin: -20px -22px 16px -22px; overflow: hidden; border-radius: 13px 13px 0 0; aspect-ratio: 16/9; }
  .actu-card-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
  .actu-card:hover .actu-card-img { transform: scale(1.04); }

  .cg-sidebar-section { margin-bottom: 28px; }
  .cg-sidebar-label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--text-faint); margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); font-family: 'DM Mono', monospace; }
  .cg-filter-btn { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 0.82rem; color: var(--text-dim); transition: all 0.2s; margin-bottom: 3px; }
  .cg-filter-btn:hover { background: var(--surface2); color: var(--text); }
  .cg-filter-btn.active { background: var(--surface2); color: var(--accent); }
  .cg-filter-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 340px; gap: 16px; color: var(--text-faint);
  }
  .empty-state .es-flag { font-size: 3rem; filter: grayscale(0.3); }
  .empty-state .es-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--text-dim); }
  .empty-state .es-sub { font-size: 0.82rem; color: var(--text-faint); letter-spacing: 0.08em; font-family: 'DM Mono', monospace; text-transform: uppercase; }
  .es-line { width: 40px; height: 2px; background: var(--accent); opacity: 0.4; border-radius: 2px; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  .fade-up { animation: fadeUp 0.5s ease forwards; opacity: 0; }


  /* Search bar */
  .search-wrap {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }
  .search-inner {
    position: relative;
    width: 260px;
  }
  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-faint);
    font-size: 0.95rem;
    pointer-events: none;
    transition: color 0.2s;
  }
  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 44px 12px 42px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  .search-input::placeholder { color: var(--text-faint); }
  .search-input:focus {
    border-color: var(--accent);
    background: var(--surface2);
    box-shadow: 0 0 0 3px rgba(124,158,201,0.12);
  }
  .search-inner:focus-within .search-icon { color: var(--accent); }
  .search-clear {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-faint);
    font-size: 1rem;
    cursor: pointer;
    display: none;
    line-height: 1;
    padding: 4px;
    border-radius: 4px;
    transition: color 0.2s;
  }
  .search-clear:hover { color: var(--text); }
  .search-count {
    margin-top: 6px;
    font-size: 0.75rem;
    color: var(--text-faint);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.05em;
    min-height: 18px;
    text-align: right;
  }
  .search-count .hl { color: var(--accent); }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

  @media (max-width: 768px) {
    nav { padding: 14px 20px; }
    .page-header { padding: 40px 24px 30px; }
    .page-header::after { left: 24px; }
    .page-header-row { flex-direction: column; align-items: flex-start; gap: 16px; }
    .search-wrap { align-items: stretch; }
    .search-inner { width: 100%; }
    .actu-sidebar { display: none; }
    .actu-main { padding: 24px; }
  }

  .month-separator {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 18px;
    margin: 8px 0 4px;
  }
  .month-separator:not(:first-child) { margin-top: 32px; }
  .month-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem; font-weight: 500; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--text-dim); white-space: nowrap;
  }
  .month-label strong { color: #d48a8a; font-weight: 500; }
  .month-line { flex: 1; height: 1px; background: linear-gradient(to right, var(--border), transparent); }
</style>
</head>
<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>
<div class="bg-orb orb3"></div>

<div id="page-amerique" class="page active">
  <nav>
    <div class="nav-logo" onclick="window.location.href='../../index.html'">ECG Prépa</div>
    <div class="breadcrumb">
      <span onclick="window.location.href='../../index.html'">Accueil</span>
      <span class="sep">/</span>
      <span onclick="window.location.href='../actualites.html'">Actualité</span>
      <span class="sep">/</span>
      <span onclick="window.location.href='index-monde.html'">Monde</span>
      <span class="sep">/</span>
      <span class="current">Amérique</span>
    </div>
  </nav>
  <div class="page-header">
    <div class="page-eyebrow">🗽 Amérique</div>
    <div class="page-header-row">
      <div class="page-title">Amérique</div>
      <div class="search-wrap">
        <div class="search-inner">
          <span class="search-icon">🔍</span>
          <input
            class="search-input"
            id="search-input"
            type="text"
            placeholder="Rechercher…"
            autocomplete="off"
            oninput="onSearch(this.value)"
          >
          <span class="search-clear" id="search-clear" onclick="clearSearch()">✕</span>
        </div>
        <div class="search-count" id="search-count"></div>
      </div>
    </div>
  </div>
  <div class="actu-layout">
    <div class="actu-sidebar">
      <div class="cg-sidebar-section" id="sidebar-domaine">
        <div class="cg-sidebar-label">Par domaine</div>
        <div class="cg-filter-btn domain-btn active" onclick="filterActu('tous',event)"><div class="cg-filter-dot"></div>Tous</div>
        <div class="cg-filter-btn domain-btn" onclick="filterActu('politique',event)"><div class="cg-filter-dot" style="background:#c8a96e"></div>Politique</div>
        <div class="cg-filter-btn domain-btn" onclick="filterActu('geopolitique',event)"><div class="cg-filter-dot" style="background:#9ecba0"></div>Géopolitique</div>
        <div class="cg-filter-btn domain-btn" onclick="filterActu('economie',event)"><div class="cg-filter-dot" style="background:#e0a458"></div>Économie</div>
        <div class="cg-filter-btn domain-btn" onclick="filterActu('social',event)"><div class="cg-filter-dot" style="background:#c97c9e"></div>Social</div>
        <div class="cg-filter-btn domain-btn" onclick="filterActu('environnement',event)"><div class="cg-filter-dot" style="background:#4db6ac"></div>Environnement</div>
        <div class="cg-filter-btn domain-btn" onclick="filterActu('sante',event)"><div class="cg-filter-dot" style="background:#e07aaa"></div>Santé</div>
        <div class="cg-filter-btn domain-btn" onclick="filterActu('defense',event)"><div class="cg-filter-dot" style="background:#c62828"></div>Défense</div>
        <div class="cg-filter-btn domain-btn" onclick="filterActu('securite',event)"><div class="cg-filter-dot" style="background:#d68438"></div>Sécurité</div>
        <div class="cg-filter-btn domain-btn" onclick="filterActu('numerique',event)"><div class="cg-filter-dot" style="background:#7c9ec9"></div>Numérique</div>
        <div class="cg-filter-btn domain-btn" onclick="filterActu('langue',event)"><div class="cg-filter-dot" style="background:#ab8fc9"></div>Langue</div>
      </div>
      <div class="cg-sidebar-section">
        <div class="cg-sidebar-label">Autres régions</div>
        <div class="cg-filter-btn" onclick="window.location.href='tous-monde.html'"><div class="cg-filter-dot" style="background:var(--accent)"></div>🌐 Toutes les régions</div>
        <div class="cg-filter-btn" onclick="window.location.href='europe.html'"><div class="cg-filter-dot" style="background:#003087"></div>🇪🇺 Europe</div>
        <div class="cg-filter-btn" onclick="window.location.href='asie.html'"><div class="cg-filter-dot" style="background:#c62828"></div>🏯 Asie</div>
        <div class="cg-filter-btn" onclick="window.location.href='moyen-orient.html'"><div class="cg-filter-dot" style="background:#c8a96e"></div>🕌 Moyen Orient</div>
        <div class="cg-filter-btn active" onclick="window.location.href='amerique.html'"><div class="cg-filter-dot" style="background:#c62828"></div>🗽 Amérique</div>
        <div class="cg-filter-btn" onclick="window.location.href='afrique.html'"><div class="cg-filter-dot" style="background:#006847"></div>🥁 Afrique</div>
        <div class="cg-filter-btn" onclick="window.location.href='oceanie.html'"><div class="cg-filter-dot" style="background:#003087"></div>🦘 Océanie</div>
        <div class="cg-filter-btn" onclick="window.location.href='arctique.html'"><div class="cg-filter-dot" style="background:#7ca8c9"></div>🧊 Arctique</div>
      </div>
    </div>
    <div class="actu-main">
      <div class="actu-grid" id="actu-grid"></div>
    </div>
  </div>
</div>

<script>
const ACTU_DATA = [
  {
    id: 'guyana-autosuffisant',
    pays: 'Guyana',
    flag: '🇬🇾',
    theme: 'Économie',
    domain: 'economie',
    pays_filter: 'guyana',
    cardTitle: 'Guyana : premier pays au monde à atteindre l\'autosuffisance énergétique par le pétrole offshore',
    image: 'images/guyana-autosuffisant.jpg',
    externalUrl: 'articles/guyana-autosuffisant.html',
    month: 4, year: 2026
  },
  {
    id: 'bresil-deforestation-amazonie',
    pays: 'Brésil',
    flag: '🇧🇷',
    theme: 'Environnement',
    domain: 'environnement',
    pays_filter: 'bresil',
    cardTitle: 'Amazonie : quatre ans de recul, une forêt encore fragile',
    image: 'images/bresil-deforestation-amazonie.jpg',
    externalUrl: 'articles/bresil-deforestation-amazonie.html',
    month: 5, year: 2026
  },
  {
    id: 'dedollarisation-amerique-latine',
    pays: 'Amérique latine',
    flag: '🌎',
    theme: 'Économie',
    domain: 'economie',
    pays_filter: 'amerique-latine',
    cardTitle: 'La dédollarisation en Amérique latine : entre pivot vers le yuan et paradoxe argentin',
    image: 'images/dedollarisation-amerique-latine.jpg',
    externalUrl: 'articles/dedollarisation-amerique-latine.html',
    month: 5, year: 2026
  }
];


let currentDomain = 'tous';
let currentQuery = '';

function normalize(str) {
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function onSearch(val) {
  currentQuery = val.trim();
  const clearBtn = document.getElementById('search-clear');
  clearBtn.style.display = currentQuery ? 'block' : 'none';
  buildGrid(currentDomain);
}

function clearSearch() {
  const input = document.getElementById('search-input');
  input.value = '';
  currentQuery = '';
  document.getElementById('search-clear').style.display = 'none';
  input.focus();
  buildGrid(currentDomain);
}

function buildGrid(domainFilter) {
  const grid = document.getElementById('actu-grid');
  grid.innerHTML = '';
  let data = ACTU_DATA;
  if (domainFilter && domainFilter !== 'tous') {
    data = data.filter(d => d.domain === domainFilter || d.pays_filter === domainFilter);
  }
  if (currentQuery) {
    const q = normalize(currentQuery);
    data = data.filter(d =>
      normalize(d.cardTitle || '').includes(q) ||
      normalize(d.pays || '').includes(q) ||
      normalize(d.theme || '').includes(q) ||
      normalize(d.flag || '').includes(q)
    );
  }

  const countEl = document.getElementById('search-count');
  if (countEl) {
    if (currentQuery && data.length) {
      countEl.innerHTML = `<span class="hl">${data.length}</span> résultat${data.length > 1 ? 's' : ''} pour « ${currentQuery} »`;
    } else {
      countEl.innerHTML = '';
    }
  }

  if (!data.length) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        <div class="es-flag">🗽</div>
        <div class="es-line"></div>
        <div class="es-title">Articles à venir</div>
        <div class="es-sub">Le contenu sera publié prochainement</div>
      </div>`;
    return;
  }

  data = [...data].sort((a, b) => (b.year * 12 + b.month) - (a.year * 12 + a.month));

  const themeColors = {
    'Santé': '#e07060', 'Économie': '#81c784', 'Politique': '#c8a96e',
    'Défense': '#c62828', 'Social': '#7c9ec9', 'Géopolitique': '#9ecba0',
    'Sécurité': '#c62828', 'Environnement': '#81c784'
  };

  const MONTH_NAMES_FR = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

  const groups = [];
  data.forEach(a => {
    const key = `${a.year}-${a.month}`;
    let g = groups.find(g => g.key === key);
    if (!g) { g = { key, month: a.month, year: a.year, items: [] }; groups.push(g); }
    g.items.push(a);
  });

  groups.forEach((group, gi) => {
    const sep = document.createElement('div');
    sep.className = 'month-separator';
    sep.innerHTML = `
      <span class="month-label"><strong>${MONTH_NAMES_FR[group.month - 1]}</strong> ${group.year}</span>
      <div class="month-line"></div>`;
    grid.appendChild(sep);

    group.items.forEach((a, i) => {
      const col = themeColors[a.theme] || '#7ca8c9';
      const card = document.createElement('div');
      card.className = 'actu-card title-only fade-up';
      card.style.setProperty('--card-color', col);
      card.style.animationDelay = `${(gi * 10 + i) * 0.07}s`;
      const imgHtml = a.image ? `<div class="actu-card-img-wrap"><img class="actu-card-img" src="${a.image}" alt="${a.cardTitle}" loading="lazy" onerror="this.parentElement.style.display='none'"></div>` : '';
      card.innerHTML = imgHtml +
        `<div class="actu-card-meta"><span class="actu-badge pays">${a.flag} ${a.pays}</span><span class="actu-badge theme">${a.theme}</span></div>` +
        `<div class="actu-card-title">${a.cardTitle}</div>`;
      card.onclick = () => { if (a.externalUrl) window.location.href = a.externalUrl; };
      grid.appendChild(card);
    });
  });
}

function filterActu(f, e) {
  document.querySelectorAll('#page-amerique .domain-btn').forEach(b => b.classList.remove('active'));
  if (e && e.currentTarget) e.currentTarget.classList.add('active');
  currentDomain = f;
  buildGrid(f);
}

buildGrid('tous');
</script>
</body>
</html>
